[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mstr-qualify"
version = "0.0.0"
description = "Qualification and evidence harness for MSTR preconstruction research."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TheHalfMoon" }]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[project.scripts]
mstr-qualify = "mstr_qualify.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mstr_qualify"]
