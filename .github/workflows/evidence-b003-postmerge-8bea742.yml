name: Evidence B003 post-merge verification

on:
  push:
    branches:
      - evidence/b003-postmerge-8bea742

permissions:
  contents: read

env:
  EXPECTED_MAIN: 8bea74269fb81a4c898b7a2864bf103d15fd98a9
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify-b003-postmerge:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact post-merge main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify canonical main identity and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify B003 remains execution-eligible pending closeout
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task eligible B003 > /tmp/b003.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/b003.json', encoding='utf-8'))
          assert payload['task_id'] == 'B003', payload
          assert payload['eligible'] is True, payload
          assert payload['canonical_main'] == '8bea74269fb81a4c898b7a2864bf103d15fd98a9', payload
          print('POSTMERGE_B003_ELIGIBLE_PENDING_CLOSEOUT=true')
          PY

      - name: Prove detector catches merged-active canonical drift
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m mstr_qualify task drift > /tmp/drift.json
          rc=$?
          set -e
          test "$rc" -eq 1
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/drift.json', encoding='utf-8'))
          assert payload['canonical_main'] == '8bea74269fb81a4c898b7a2864bf103d15fd98a9', payload
          assert payload['status'] == 'drift', payload
          codes = {item['code'] for item in payload['findings']}
          assert 'implementation.merged_while_active' in codes, payload
          print('POSTMERGE_DRIFT_CODES=' + ','.join(sorted(codes)))
          PY

      - name: Run targeted B003 tests
        run: pytest -q tests/unit/test_task_drift.py tests/integration/test_task_drift_cli.py

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Verify immutable post-merge main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"
          echo "FINAL_MAIN_SHA=$(git rev-parse HEAD)"
