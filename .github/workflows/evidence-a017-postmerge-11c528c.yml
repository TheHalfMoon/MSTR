name: A017 post-merge proof

on:
  push:
    branches:
      - evidence/a017-postmerge-11c528c

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  identity:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove canonical A017 implementation merge
        shell: bash
        run: |
          set -euo pipefail
          MERGE='11c528c0ad015f7505dd143c700e710a0f08d86a'
          OLD_MAIN='0bd69861b987c616e1b9b25ef88a5d14f4762788'
          HEAD='2270cbbd6a1110e2823679ea3ca2d7b77a92d256'
          TREE='1e85b48fda0569e4e51e188ae566b2b9674ad2b8'
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$MERGE"
          test "$(git show -s --format=%T "$MERGE")" = "$TREE"
          test "$(git show -s --format=%P "$MERGE")" = "$OLD_MAIN $HEAD"
          pr="$(gh api repos/TheHalfMoon/MSTR/pulls/120)"
          test "$(jq -r '.state' <<<"$pr")" = 'closed'
          test "$(jq -r '.merged' <<<"$pr")" = 'true'
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$MERGE"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$OLD_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$HEAD"
          reviews="$(gh api repos/TheHalfMoon/MSTR/pulls/120/reviews)"
          jq -e '.[] | select(.id == 5071307102 and .state == "COMMENTED" and .commit_id == "2270cbbd6a1110e2823679ea3ca2d7b77a92d256")' <<<"$reviews" >/dev/null
          test "$(jq -r '.conclusion' <<<"$(gh api repos/TheHalfMoon/MSTR/actions/runs/33440052024)")" = 'success'
          test "$(jq -r '.conclusion' <<<"$(gh api repos/TheHalfMoon/MSTR/actions/runs/33440372946)")" = 'success'
          test "$(jq -r '.conclusion' <<<"$(gh api repos/TheHalfMoon/MSTR/actions/runs/33439438385)")" = 'failure'
          test "$(jq -r '.conclusion' <<<"$(gh api repos/TheHalfMoon/MSTR/actions/runs/33439766350)")" = 'failure'
          git show "$MERGE:specs/001-agent-harness-verified-loop-foundation/tasks.md" | grep -F -- '- [ ] **A017 Freeze failure taxonomy and training trajectory contract.**'
          git show "$MERGE:specs/001-agent-harness-verified-loop-foundation/tasks.md" | grep -F -- '- [ ] **A018 Implement trajectory recorder/replay/admission.**'
          git show "$MERGE:evidence/mstr-000a/A017-trajectory-contract.md" | grep -F '**State:** IMPLEMENTATION_CANDIDATE'
          git diff --check "$OLD_MAIN..$MERGE"

  quality:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11c528c0ad015f7505dd143c700e710a0f08d86a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Run canonical A017 post-merge quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_trajectory_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src

  complete:
    needs: quality
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final immutable A017 post-merge recheck
        shell: bash
        run: |
          set -euo pipefail
          MERGE='11c528c0ad015f7505dd143c700e710a0f08d86a'
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$MERGE"
          test "$(git show -s --format=%T "$MERGE")" = '1e85b48fda0569e4e51e188ae566b2b9674ad2b8'
          test "$(git show -s --format=%P "$MERGE")" = '0bd69861b987c616e1b9b25ef88a5d14f4762788 2270cbbd6a1110e2823679ea3ca2d7b77a92d256'
          pr="$(gh api repos/TheHalfMoon/MSTR/pulls/120)"
          test "$(jq -r '.merged' <<<"$pr")" = 'true'
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$MERGE"
