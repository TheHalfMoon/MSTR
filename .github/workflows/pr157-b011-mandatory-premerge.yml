name: Mandatory premerge PR157 B011 evidence

on:
  push:
    branches:
      - evidence/pr157-b011-mandatory-premerge

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  premerge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 450d9b5b9b3c6aca27222a553dc6230f6eef6783
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify qualification review dependencies and exact live PR identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=dd547bb768598f92ad203764ce32be6e1fc710d6
          HEAD=450d9b5b9b3c6aca27222a553dc6230f6eef6783
          for run in 33867186224 33867564924; do
            gh api repos/${GITHUB_REPOSITORY}/actions/runs/$run | jq -e '.status == "completed" and .conclusion == "success"' >/dev/null
          done
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          gh api repos/${GITHUB_REPOSITORY}/pulls/157 > /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state == "open" and .draft == false and .mergeable == true and .base.sha == $base and .head.sha == $head and .changed_files == 6' /tmp/pr.json >/dev/null
          expected=$(printf '%s\n' \
            'artifacts/manifests/B011-acquired-candidates.json' \
            'artifacts/manifests/B011-artifact-mellum-4b.json' \
            'artifacts/manifests/B011-artifact-qwen3.5-0.8b-control.json' \
            'evidence/mstr-000b/B011-acquisition.md' \
            'evidence/mstr-000b/B011-runner-reports/mellum-4b.json' \
            'evidence/mstr-000b/B011-runner-reports/qwen3.5-0.8b-control.json')
          test "$(git diff --name-only "$BASE" "$HEAD" | sort)" = "$expected"
          echo 'PR157_PREMERGE_IDENTITY=PASS'
      - name: Reconcile reviews threads rulesets protection statuses and bot service states
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/pulls/157/reviews > /tmp/reviews.json
          test "$(jq 'length' /tmp/reviews.json)" -eq 0
          gh api graphql -f query='query($owner:String!,$repo:String!,$n:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$n){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner=TheHalfMoon -f repo=MSTR -F n=157 > /tmp/threads.json
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0' /tmp/threads.json >/dev/null
          gh api repos/${GITHUB_REPOSITORY}/rulesets > /tmp/rulesets.json
          test "$(jq 'length' /tmp/rulesets.json)" -eq 0
          gh api repos/${GITHUB_REPOSITORY}/branches/main > /tmp/main-branch.json
          jq -e '.protected == false' /tmp/main-branch.json >/dev/null
          gh api repos/${GITHUB_REPOSITORY}/commits/450d9b5b9b3c6aca27222a553dc6230f6eef6783/status > /tmp/status.json
          jq -e 'any(.statuses[]; .context == "CodeRabbit" and .state == "success")' /tmp/status.json >/dev/null
          gh api repos/${GITHUB_REPOSITORY}/issues/157/comments > /tmp/comments.json
          jq -e 'any(.[]; .user.login == "qodo-code-review[bot]" and (.body | contains("reviews are paused")))' /tmp/comments.json >/dev/null
          jq -e 'any(.[]; .user.login == "coderabbitai[bot]" and (.body | contains("does not receive automatic reviews")))' /tmp/comments.json >/dev/null
          echo 'PR157_PREMERGE_GITHUB_RECONCILIATION=PASS'
      - name: Re-prove exact source evidence and authority containment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/33865617854 > /tmp/source.json
          jq -e '.status == "completed" and .conclusion == "success" and .head_sha == "86609c656e20ac959c206d15fc21eda1f633b6ec"' /tmp/source.json >/dev/null
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          b010p=root/'artifacts/manifests/B010-new-candidate-weight-access.json'
          assert hashlib.sha256(b010p.read_bytes()).hexdigest()=='4c2fd1469cdcf728063ab8f5b6a603191ffdc9e1a4d4c2d794abd2a24950c3ef'
          b010=json.loads(b010p.read_text())
          auth=json.loads((root/'artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json').read_text())
          agg=json.loads((root/'artifacts/manifests/B011-acquired-candidates.json').read_text())
          assert auth['status']=='AUTHORIZED_CANONICAL'
          assert auth['scope']['decision']=='FOUNDER_B011_MODEL_WEIGHT_ACCESS_DECISION=AUTHORIZE_EXACT_B010_ENVELOPE'
          assert all(auth['scope'][k] is False for k in ['paid_compute','paid_model_api','gated_terms_acceptance','quantization_execution','weight_changing_training','large_dataset_ingestion','production_release','git_model_binaries'])
          assert agg['implementation_state']=='ACQUISITION_EXECUTED_VERIFIED_PENDING_CANONICAL_CLOSEOUT'
          assert agg['authorized_total_download_bytes']==agg['observed_total_download_bytes']==9817996174
          assert agg['resource_cost_usd']==0.0
          assert set(agg['observed_network_hosts']) <= set(agg['network_allowlist'])
          assert agg['prior_fail_closed_attempt']['model_weight_download_started'] is False
          assert {c['candidate_id'] for c in agg['candidates']} == set(b010['decision']['new_weight_access_required_candidates']) == {'mellum-4b','qwen3.5-0.8b-control'}
          print('PR157_PREMERGE_EVIDENCE=PASS')
          PY
      - name: Re-prove exact-main B011 gate and B012 closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          BASE=dd547bb768598f92ad203764ce32be6e1fc710d6
          git update-ref refs/heads/main "$BASE"
          git update-ref refs/remotes/origin/main "$BASE"
          git checkout --detach "$BASE"
          mstr-qualify task eligible B011 > /tmp/b011.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.satisfied == true' /tmp/b011.json >/dev/null
          if mstr-qualify task eligible B012 > /tmp/b012.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B011")) != null' /tmp/b012.json >/dev/null
          git checkout --detach 450d9b5b9b3c6aca27222a553dc6230f6eef6783
          echo 'PR157_PREMERGE_TASK_GATE=PASS'
      - name: Fresh mandatory full quality
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          echo 'PR157_PREMERGE_QUALITY=PASS'
      - name: Final live guarded-merge readiness recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "450d9b5b9b3c6aca27222a553dc6230f6eef6783"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "dd547bb768598f92ad203764ce32be6e1fc710d6"
          gh api repos/${GITHUB_REPOSITORY}/pulls/157 | jq -e '.state == "open" and .draft == false and .mergeable == true and .head.sha == "450d9b5b9b3c6aca27222a553dc6230f6eef6783" and .base.sha == "dd547bb768598f92ad203764ce32be6e1fc710d6"' >/dev/null
          echo 'PR157_MANDATORY_PREMERGE=PASS'
