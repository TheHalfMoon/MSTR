name: Exact-head qualification PR166 T030 canonical closeout

on:
  push:
    branches:
      - evidence/pr166-t030-closeout-qualification-50df354

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: pr166-t030-closeout-qualification-50df354
  cancel-in-progress: false

env:
  PR_NUMBER: '166'
  BASE_SHA: 8916fa7138ad56d18452b7a20db9c8cb982648ba
  HEAD_SHA: 50df3540fc4c1568169d8b5dcb27e8e49a0e1737
  HEAD_TREE: 288a818c532a04028219b64dee6b3295f09aa249
  TARGET_BRANCH: closeout/000-t030-canonical

jobs:
  identity_scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify live PR identity, scope, lifecycle evidence, and authority boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          root = "https://api.github.com/repos/TheHalfMoon/MSTR"

          def get(path: str):
              request = urllib.request.Request(f"{root}{path}", headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          pr = get(f"/pulls/{os.environ['PR_NUMBER']}")
          assert pr["state"] == "open" and pr["draft"] is False and pr["merged"] is False
          assert pr["base"]["ref"] == "main" and pr["base"]["sha"] == os.environ["BASE_SHA"]
          assert pr["head"]["ref"] == os.environ["TARGET_BRANCH"] and pr["head"]["sha"] == os.environ["HEAD_SHA"]
          assert pr["commits"] == 2 and pr["changed_files"] == 3
          expected = {
              "docs/canonical/CURRENT_STATE.md",
              "evidence/T030-runtime-adapters.md",
              "specs/000-universal-laptop-interaction-contract/tasks.md",
          }
          assert {item["filename"] for item in get(f"/pulls/{os.environ['PR_NUMBER']}/files?per_page=100")} == expected

          for run_id in (33971815139, 33971878391, 33972061731, 33972305104, 33972551215):
              run = get(f"/actions/runs/{run_id}")
              assert run["status"] == "completed" and run["conclusion"] == "success", run_id

          reviews = get("/pulls/165/reviews?per_page=100")
          review = next(row for row in reviews if row["id"] == 5121599106)
          assert review["state"] == "COMMENTED"
          assert review["commit_id"] == "0462786550d24096272b7541ab286e838b4a1c2e"
          assert "Findings: NONE" in review["body"]

          request = urllib.request.Request(
              f"{root}/contents/artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json?ref={os.environ['BASE_SHA']}",
              headers=headers,
          )
          try:
              urllib.request.urlopen(request)
          except urllib.error.HTTPError as exc:
              assert exc.code == 404
          else:
              raise AssertionError("B012 authority unexpectedly exists")
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact topology and canonical closeout semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..$HEAD_SHA")" = "2"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          printf '%s\n' docs/canonical/CURRENT_STATE.md evidence/T030-runtime-adapters.md specs/000-universal-laptop-interaction-contract/tasks.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          tasks = Path("specs/000-universal-laptop-interaction-contract/tasks.md").read_text()
          assert "- [x] T030 [US1] Implement/qualify portable CPU runtime adapters" in tasks
          assert "- [ ] T031 [US1] Measure 4K/8K/16K artifact/load/memory/paging/prefill/decode behavior" in tasks

          a_tasks = Path("specs/001-agent-harness-verified-loop-foundation/tasks.md").read_text()
          for n in range(5, 19):
              assert re.search(rf"- \[x\] \*\*A{n:03d}\b", a_tasks), n
          for n in range(19, 25):
              assert re.search(rf"- \[ \] \*\*A{n:03d}\b", a_tasks), n

          catalog = json.loads(Path("configs/task-gate/mstr-000b.json").read_text())
          b = catalog["tasks"]
          for n in list(range(1, 12)) + list(range(14, 31)):
              assert b[f"B{n:03d}"]["canonical_state"] == "COMPLETE_CANONICAL", n
          assert b["B012"]["canonical_state"] == "PENDING"
          assert b["B012"]["required_authority_id"] == "B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION"
          assert b["B013"]["canonical_state"] == "BLOCKED"
          for n in range(31, 35):
              assert b[f"B{n:03d}"]["canonical_state"] == "PENDING", n

          state = Path("docs/canonical/CURRENT_STATE.md").read_text()
          required_state = (
              "T000-T030 = COMPLETE_CANONICAL",
              "T030_IMPLEMENTATION_PR = #165 / MERGE 8916fa7138ad56d18452b7a20db9c8cb982648ba",
              "T030_POSTMERGE_RUN = 33972551215 / SUCCESS",
              "A005-A018 = COMPLETE_CANONICAL",
              "LAST_COMPLETE_MSTR_000B_TASK = B030 / COMPLETE_CANONICAL",
              "B012 = PENDING / BLOCKED_BY_EXACT_FOUNDER_AUTHORITY",
              "B013 = BLOCKED_BY_B012",
              "B014-B030 = COMPLETE_CANONICAL",
              "T031 = NEXT / MATERIAL_EXECUTION_AUTHORITY_AND_EPHEMERAL_ARTIFACT_RECONCILIATION_REQUIRED / NOT_COMPLETE_CANONICAL",
          )
          for marker in required_state:
              assert marker in state, marker

          evidence = Path("evidence/T030-runtime-adapters.md").read_text()
          for marker in (
              "IMPLEMENTATION_PR = #165",
              "EXACT_HEAD_QUALIFICATION = 33971815139 / SUCCESS",
              "SECOND_EXACT_HEAD_QUALIFICATION = 33971878391 / SUCCESS",
              "INDEPENDENT_SEMANTIC_SECURITY_REVIEW = 33972061731 / SUCCESS",
              "REVIEW_SUBMISSION = 5121599106 / COMMENTED / FINDINGS_NONE",
              "MANDATORY_PREMERGE = 33972305104 / SUCCESS",
              "MERGE = 8916fa7138ad56d18452b7a20db9c8cb982648ba",
              "POSTMERGE = 33972551215 / SUCCESS",
              "FULL_PYTEST = 1354 PASSED",
              "T030_COMPLETE_CANONICAL = YES_ON_CLOSEOUT_MERGE",
              "T031_EXECUTION_AUTHORITY = NOT_CREATED_BY_T030",
              "B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION = ABSENT",
          ):
              assert marker in evidence, marker
          assert not Path("artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json").exists()
          PY

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen repository quality gates on exact closeout head
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q
          ruff check .
          mypy
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test -z "$(git status --porcelain)"

  final_qualification:
    needs: [identity_scope, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recheck immutable live head and emit qualification verdict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          echo 'T030_CLOSEOUT_EXACT_HEAD_QUALIFICATION=PASS'
          echo "QUALIFIED_HEAD=$HEAD_SHA"
          echo "QUALIFIED_TREE=$HEAD_TREE"
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'T031_EXECUTION_AUTHORITY=NOT_CREATED'
