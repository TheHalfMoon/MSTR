name: Build guarded B026 canonical closeout

on:
  push:
    branches: [evidence/b026-closeout-builder-1aed677]

permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  BASE_SHA: 1aed67793fa14e6c9a7bbe4067ad521d16617b26
  TARGET_BRANCH: docs/000b-b026-canonicalize
  POSTMERGE_RUN: '33683456723'
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify exact canonical entry and successful post-merge proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/heads/$TARGET_BRANCH)"

          for _ in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${POSTMERGE_RUN}" > /tmp/postmerge.json
            status="$(jq -r .status /tmp/postmerge.json)"
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 10
          done
          jq -e --arg sha "14d2a62be58c08f70457f7b14bbc4922834b5403" '
            .status == "completed" and .conclusion == "success" and
            .head_sha == $sha and .head_branch == "evidence/b026-postmerge-1aed677" and
            .path == ".github/workflows/b026-postmerge-verification-1aed677.yml"
          ' /tmp/postmerge.json

          git show "${GITHUB_SHA}:.github/scripts/b026_closeout_builder.py" > /tmp/builder.py
          git checkout --detach "$BASE_SHA"

      - name: Build and seal exact five-file closeout candidate
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/builder.py
          printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B026-research-ladder.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check
          test -z "$(git diff --name-only -- src schemas configs/research specs/002-code-model-supremacy-foundation/contracts docs/data artifacts/authorities)"
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B026-research-ladder.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py
          git commit -m 'docs(mstr-000b): canonicalize B026 research-ladder closeout'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git diff-tree --no-commit-id --name-only -r HEAD | sort > /tmp/committed
          diff -u /tmp/expected /tmp/committed
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "B026_CLOSEOUT_LOCAL_CANDIDATE=$candidate"

      - name: Install development gates
        run: python -m pip install -e '.[dev]'

      - name: Prove closeout machine state and successor frontier
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$CANDIDATE_SHA"
          git update-ref refs/remotes/origin/main "$CANDIDATE_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json

          set +e
          mstr-qualify task eligible B026 > /tmp/b026.json; b026_rc=$?
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_rc=$?
          set -e
          test "$b026_rc" -eq 1
          test "$b011_rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null' /tmp/b026.json
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json

          mstr-qualify task eligible B027 > /tmp/b027.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0' /tmp/b027.json
          jq -e '[.prerequisite_results[] | select(.task_id == "B026" and .observed_state == "COMPLETE_CANONICAL" and .evidence_present == true and .satisfied == true)] | length == 1' /tmp/b027.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"

      - name: Focused closeout tests
        run: python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
      - name: Offline validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src

      - name: Re-prove closeout provenance and authority containment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          grep -F '**State:** COMPLETE_CANONICAL' evidence/mstr-000b/B026-research-ladder.md
          grep -F '**Implementation PR:** #137' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'ENTRY_GATE_TASK = B026' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'CodeRabbit comment `5516237548`' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'post-merge implementation verification: run `33683456723` — SUCCESS' evidence/mstr-000b/B026-research-ladder.md
          grep -F -- '- [x] **B026 Freeze multi-fidelity MSTR Research Ladder v0.**' specs/002-code-model-supremacy-foundation/tasks.md
          for marker in \
            'MODEL_WEIGHT_ACCESS = NONE' \
            'MODEL_EXECUTION = NONE' \
            'RESEARCH_CAMPAIGN_EXECUTION = NONE' \
            'VERIFIER_EXECUTION = NONE' \
            'PAID_COMPUTE = NONE' \
            'NETWORK_MODEL_OR_TEACHER_CALL = NONE' \
            'WEIGHT_CHANGING_TRAINING = NONE' \
            'PRODUCTION_RELEASE = NONE'; do
            grep -F "$marker" evidence/mstr-000b/B026-research-ladder.md
          done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"

      - name: Publish exact qualified closeout commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/heads/$TARGET_BRANCH)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$CANDIDATE_SHA"
          echo "B026_CLOSEOUT_HEAD=$CANDIDATE_SHA"
