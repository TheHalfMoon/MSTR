    return decoded


def _artifact(record: dict[str, object], collection: str) -> dict[str, object]:
    if collection == "generated_task":
        value = record[collection]
    else:
        values = record[collection]
        assert isinstance(values, list)
        value = values[0]
    assert isinstance(value, dict)
    return value


def test_schema_registration_and_byte_identity() -> None:
