          evidence = '''# B018 — Execution-Filtered Student Self-Alignment Contract

**Task:** `B018`
**State:** IMPLEMENTATION_CANDIDATE
**Contract:** `mstr.self-alignment-generation.v0`
**Canonical main at execution:** `73b60aa9421f51be52560bbbca6e8dd46b77b6c9`
**Exact entry evidence:** run `33185451160` / job `98897160421` — SUCCESS

## Decision

B018 freezes the structural contract for execution-filtered student self-alignment without generating training data, executing a model, ingesting a corpus, or authorizing training.

The contract binds exact student model/checkpoint/harness/sampling identity; seed identity/provenance/rights/contamination; a generated task plus one-or-more generated solutions and tests; per-artifact provenance/rights/contamination; sandbox execution evidence for solutions/tests; independent verifier health; checkpoint-relative difficulty identity/class; and a fail-closed admission decision.

## Fail-Closed Admission

`admission_decision=ADMIT` is structurally valid only when:

```text
SEED_PROVENANCE = COMPLETE
SEED_RIGHTS = COMPATIBLE
SEED_CONTAMINATION = CLEAR
