```

`REJECT` requires at least one reason and preserves negative evidence such as unresolved rights, broken verifier health, failed execution, or `INVALID` difficulty.

## Per-Artifact Evidence Binding

The planning data model describes generated-artifact provenance and rights as parallel conceptual collections. The runtime schema co-locates required provenance and rights directly on every generated task, solution, and test. This avoids cross-array referential gaps that JSON Schema cannot prove and makes missing per-artifact evidence structurally invalid.

Generated tasks are non-executable descriptions and reject `execution_result`. Generated solutions and tests require execution evidence; `ADMIT` further requires sandboxed passing execution.

## Difficulty Boundary

B018 does not implement B020 or its calibration algorithm. The enclosing `student_model_identity` carries the exact `model_id`, `checkpoint_id`, `harness_profile_id`, and `sampling_identity` once, while `difficulty_record` binds its record identity and one B014-frozen class. This avoids duplicate identity values that JSON Schema could not prove equal. B020 remains responsible for detailed calibration/refresh/frontier semantics. `INVALID` may be preserved on rejected evidence but cannot be admitted.

## Verifier-Health Boundary

B018 does not implement B022/B023. It binds verifier-health record identity, verifier identity, health class, independence, and whether generated tests are the sole authority. Only `HEALTHY + INDEPENDENT + generated_tests_sole_authority=false` can satisfy `ADMIT`. Detailed evaluator hashes, protected paths, mutation/shortcut/leakage/disagreement analysis and stage eligibility remain owned by B022/B023.

## Runtime Registration

The design and runtime schemas are byte-identical:

