name: Build B018 self-alignment contract

on:
  push:
    branches:
      - evidence/b018-build-73b60aa

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 73b60aa9421f51be52560bbbca6e8dd46b77b6c9
      TARGET_BRANCH: feat/000b-b018-self-alignment-contract
    steps:
      - uses: actions/checkout@v4
