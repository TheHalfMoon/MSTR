name: B002 task-markdown containment repair v3

on:
  push:
    branches:
      - evidence/b002-tasks-file-containment-v3

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: 6aa46472d5913765aebeadc0f1b5a6524ba39a6c
      EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
      TARGET_BRANCH: feat/000b-b002-task-gate
      SOURCE_BRANCH: evidence/b002-tasks-file-containment-v2
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout guarded B002 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main "$SOURCE_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Reuse v2 repair and normalize EOF
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$SOURCE_BRANCH:.github/workflows/b002-tasks-file-containment-v2.yml" > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/source.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply containment repair'
          start = lines.index(marker)
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_index + 1, len(lines)) if lines[i].startswith('      - name: '))
          body = []
          for line in lines[run_index + 1:end]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line:
                  body.append('')
              else:
                  raise SystemExit(f'unexpected indentation: {line!r}')
          Path('/tmp/apply.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          python -m py_compile /tmp/apply.py
          python /tmp/apply.py
          python - <<'PY'
          from pathlib import Path
          for raw in ('src/mstr_qualify/task_gate.py', 'tests/contract/test_task_gate.py'):
              path = Path(raw)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Verify source and bounded mutation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py | sort)"
          test "$actual" = "$expected"
          python -m py_compile src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Run targeted and frozen gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy
          python -m mstr_qualify validate

      - name: Guarded commit and fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py
          git commit -m "fix(mstr-000b): contain canonical task markdown"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "NEW_B002_HEAD=$(git rev-parse HEAD)"
