# MSTR T028 — ephemeral acquisition runner (autonomous executor).
#
# Executes the frozen T027 weight-access plan inside a single-job GitHub
# Actions VM per docs/canonical/STORAGE_ARCHITECTURE.md:
# - plain HTTPS GET to huggingface.co only; no authentication; USD 0.00;
#   (public repository => free hosted runners, zero marginal cost)
# - per-file size + SHA-256 verification against the frozen manifest;
# - the acquisition report is uploaded as the durable output artifact and
#   binary copies are deleted before job exit (VM reclamation enforces it).

name: t028-acquire

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate id from artifacts/manifests/T027-weight-access.json"
        required: true
        type: string

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Acquire pinned artifacts for one candidate (fail-closed verify)
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          python colab/mstr_t028_acquire.py \
            --manifest artifacts/manifests/T027-weight-access.json \
            --candidate "$CANDIDATE" \
            --workdir "$RUNNER_TEMP/mstr_t028_binaries" \
            --report "reports/$CANDIDATE.json"

      - name: Upload durable report only (binaries never leave the runner)
        uses: actions/upload-artifact@v4
        with:
          name: t028-report-${{ inputs.candidate }}
          path: reports/
          if-no-files-found: error

      - name: Delete local binary copies (defense in depth)
        if: always()
        run: rm -rf "$RUNNER_TEMP/mstr_t028_binaries"
