name: PR202 B012 CLI incompatibility postmerge

on:
  push:
    branches:
      - evidence/pr202-b012-cli-incompatibility-postmerge-e873288

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  REPO: TheHalfMoon/MSTR
  BASE: 66cd090fc75286bfc24db4bdf8fe58b64394e228
  SUBJECT: 870e9d70335817007a07e3115f17545c584e3c86
  MERGE: e87328872232471fa0e1eb05d74223bc0aeaafd3
  MERGE_TREE: 616eb2183621d7d81df02df83ece354ccd7099a5
  PR: '202'
  QUAL_RUN: '34294460806'
  QUAL_HEAD: 9898177c9f94ae2c63059fc6b05aca2dba565218
  REVIEW_RUN: '34295567734'
  REVIEW_HEAD: e2ee84d25661d3313bad14b17aad5123e7989d2c
  PREMERGE_RUN: '34295871282'
  PREMERGE_HEAD: 80d472446cf8f6d4ad88a101cf6bd54a8032fbb9
  INCIDENT_SHA256: 20e30ef5382189dc22407df0caaab171668c91863cdf972a66bfd90e4615f03d
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove canonical merge identity and evidence chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$MERGE"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git rev-parse origin/main)" = "$MERGE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE"
          test "$(git show -s --format=%P HEAD)" = "$BASE $SUBJECT"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg merge "$MERGE" --arg head "$SUBJECT" '.state=="closed" and .merged==true and .merge_commit_sha==$merge and .head.sha==$head' /tmp/pr.json >/dev/null
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/review.json
          gh api "repos/$REPO/actions/runs/$PREMERGE_RUN" > /tmp/premerge.json
          jq -e --arg h "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/qual.json >/dev/null
          jq -e --arg h "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/review.json >/dev/null
          jq -e --arg h "$PREMERGE_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/premerge.json >/dev/null

      - name: Prove exact incident scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE" "$MERGE" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          artifacts/manifests/B012-executor-toolchain-binding.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-case-failure.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-01-init.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-02-source.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-03-quantize.json
          artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-one-shot-runtime-cli-incompatibility-run-34288154926.json
          evidence/mstr-000b/B012-qwen-one-shot-runtime-cli-incompatibility-34288154926.md
          tests/contract/test_b012_executor_binding.py
          tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py
          tests/contract/test_b012_qwen_one_shot_runtime_cli_incompatibility_evidence.py
          tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          tests/contract/test_b012_qwen_raw_code_one_shot_topology.py
          tests/contract/test_b012_qwen_raw_code_recovery.py
          tests/contract/test_b012_qwen_staged_recovery_topology.py
          tests/contract/test_b012_runner_shutdown_evidence.py
          tests/contract/test_b012_stage_checkpoint_topology.py
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --check "$BASE" "$MERGE"

      - name: Bind local canonical main ref for task-gate semantics
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$MERGE"
          test "$(git rev-parse refs/heads/main)" = "$MERGE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE"

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Prove canonical incident and fail-closed authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('.')
          incident_path=root/'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-one-shot-runtime-cli-incompatibility-run-34288154926.json'
          failure_path=root/'artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-case-failure.json'
          state_path=root/'artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json'
          incident=json.loads(incident_path.read_text(encoding='utf-8'))
          failure=json.loads(failure_path.read_text(encoding='utf-8'))
          state=json.loads(state_path.read_text(encoding='utf-8'))
          binding=json.loads((root/'artifacts/manifests/B012-executor-toolchain-binding.json').read_text(encoding='utf-8'))
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(incident_path)==os.environ['INCIDENT_SHA256']
          assert incident['failure_classification']=='B012_EXECUTOR_RUNTIME_CLI_INCOMPATIBILITY_RAW_CODE_UNEXECUTED'
          assert incident['root_cause']['runtime_commit']=='3173a56471c1753650cd806694145ffd6dcace67'
          assert incident['root_cause']['parser_example']=='LLAMA_EXAMPLE_CLI'
          assert incident['root_cause']['rejected_argument']=='--no-conversation'
          assert incident['root_cause']['argument_scope']=='LLAMA_EXAMPLE_COMPLETION_ONLY'
          assert incident['execution']['durable_raw_code_cases']==[]
          assert incident['execution']['model_quality_verdict']=='NONE'
          assert incident['execution']['candidate_admission_decision']=='NONE'
          assert incident['execution']['candidate_execution_completion']=='NOT_PROVEN'
          assert failure['completed_raw_code_cases']==[]
          assert state['completed_stages']==['init','source','quantize']
          assert incident['canonical_effect']['b012_state']=='PENDING'
          assert incident['canonical_effect']['b013_opening_authorized'] is False
          assert binding['status']=='BLOCKED_PENDING_QWEN_RAW_CODE_RUNTIME_CONTRACT_REPAIR'
          bound=binding['qwen_raw_code_one_shot_runtime_cli_incompatibility']
          for key in ('same_topology_redispatch_authorized','retry_authority_created','external_dispatch_authority_created','cross_run_resume_authority_created','candidate_expansion','revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert bound[key] is False, key
          assert bound['paid_cost_usd']==0.0
          PY

      - name: Reprove exact-main B012 eligibility and Founder authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/heads/main)" = "$MERGE"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012' and d['canonical_main']==os.environ['MERGE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert all(d['semantic_checks'].values())
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['scope']['candidate_ids']==['mellum-4b','qwen3.5-0.8b-control']
          assert a['scope']['training'] is False
          assert a['scope']['paid_compute'] is False
          assert a['scope']['paid_model_api'] is False
          assert a['cost_resource_ceiling']['limits'][0]['max']==0.0
          PY

      - name: Postmerge repository quality
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q tests/contract/test_b012*.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check tests/contract/test_b012_qwen_one_shot_runtime_cli_incompatibility_evidence.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final canonical-main guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE"
          test "$(git rev-parse refs/heads/main)" = "$MERGE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg merge "$MERGE" '.state=="closed" and .merged==true and .merge_commit_sha==$merge' /tmp/pr-final.json >/dev/null
          echo 'PR202_POSTMERGE=PASS'
          echo 'MODEL_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'PAID_COST_USD=0.0'
