name: Verify B019 post-merge canonical state

on:
  push:
    branches:
      - evidence/b019-postmerge-ac68e2f

permissions:
  contents: read

env:
  EXPECTED_PARENT_MAIN: 2605846607fc98291ded4e53e9bb6bb6c3cf52a0
  EXPECTED_CANDIDATE: 25907c32fb60e83a6b171192e8c12c8092bc9f5e
  EXPECTED_MERGE: ac68e2ff9de9962807ab32ce983b2e808bf4fab9

jobs:
  merge_identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify canonical merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MERGE"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT_MAIN"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_CANDIDATE"
          git merge-base --is-ancestor "$EXPECTED_CANDIDATE" "$EXPECTED_MERGE"
          test -f docs/data/TEACHER_RESCUE_POLICY.md
          test -f schemas/mstr-teacher-rescue-record-v0.schema.json
          test -f evidence/mstr-000b/B019-teacher-policy.md

  task_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Verify B019 remains pending before closeout and B011 remains blocked
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B019 > /tmp/b019.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          python -m mstr_qualify task drift > /tmp/drift.json
          test "$(jq -r '.eligible' /tmp/b019.json)" = "true"
          test "$(jq -r '.state_consistency_result.observed_state' /tmp/b019.json)" = "PENDING"
          test "$(jq -r '.authority_result.required' /tmp/b019.json)" = "false"
          test "$(jq -r '.eligible' /tmp/b011.json)" = "false"
          test "$(jq -r '.state_consistency_result.observed_state' /tmp/b011.json)" = "BLOCKED"
          test "$(jq -r '.authority_result.required' /tmp/b011.json)" = "true"
          test "$(jq -r '.authority_result.satisfied' /tmp/b011.json)" = "false"
          test "$(jq -r '.status' /tmp/drift.json)" = "clean"
          test "$(jq '.findings | length' /tmp/drift.json)" = "0"

  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Re-run B019 contract and schema gates on canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE"
          pytest -q tests/contract/test_teacher_rescue_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py
          python -m mstr_qualify validate
          cmp schemas/mstr-teacher-rescue-record-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-teacher-rescue-record-v0.schema.json

  full_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Re-run frozen full quality on canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE"
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy

  complete:
    needs: [merge_identity, task_gate, focused, full_quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Final canonical main immutability recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_MERGE"
