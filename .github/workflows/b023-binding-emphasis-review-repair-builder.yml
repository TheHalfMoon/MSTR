name: B023 emphasized-duplicate binding repair builder

on:
  push:
    branches: [evidence/b023-binding-emphasis-review-repair-builder]

permissions:
  contents: write

env:
  BASE_SHA: db12d1467bb81185a9affffb4d470626ceceddfa
  SOURCE_SHA: 9466ed1b85ee4585a54c09e0d166addd5121ddcf
  SOURCE_BRANCH: fix/b023-cross-workstream-bindings-fenced-safe-atomic-20260901
  TARGET_BRANCH: fix/b023-cross-workstream-bindings-emphasis-safe-atomic-20260901

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable inputs and target absence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SOURCE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$SOURCE_SHA"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target branch already exists" >&2
            exit 1
          fi
          echo "INPUT_IDENTITY=PASS"
      - name: Reconstruct exact source candidate from canonical base
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$BASE_SHA"
          git checkout "$SOURCE_SHA" -- \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md \
            src/mstr_qualify/task_gate.py \
            tests/contract/test_task_gate.py
      - name: Apply independent-review hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/mstr_qualify/task_gate.py")
          source = source_path.read_text(encoding="utf-8")
          old_pattern = 'rf"^- \\[(?P<mark>[ xX])\\] \\*\\*{re.escape(task_id)}\\s+[^*\\r\\n]+?\\*\\*\\s*$",'
          new_pattern = 'rf"^- \\[(?P<mark>[ xX])\\] \\*\\*{re.escape(task_id)}\\s+[^\\r\\n]+?\\*\\*\\s*$",'
          assert source.count(old_pattern) == 1, source.count(old_pattern)
          source = source.replace(old_pattern, new_pattern, 1)
          source_path.write_text(source, encoding="utf-8")

          tests_path = Path("tests/contract/test_task_gate.py")
          tests = tests_path.read_text(encoding="utf-8")
          duplicated = (
              '    assert "prerequisite.external_state_unproven" in predecessor["reasons"]\n'
              '\n'
              '    assert "prerequisite.external_state_unproven" in predecessor["reasons"]\n'
          )
          assert tests.count(duplicated) == 1, tests.count(duplicated)
          tests = tests.replace(
              duplicated,
              '    assert "prerequisite.external_state_unproven" in predecessor["reasons"]\n',
              1,
          )
          regression = '''\n\ndef test_external_prerequisite_emphasized_duplicate_checklist_row_fails_closed(\n    tmp_path: Path,\n) -> None:\n    catalog_path = _write_external_binding_fixture(\n        tmp_path,\n        "**Task:** `MSTR-000A / A006`\\n**State:** `COMPLETE_CANONICAL`\\n",\n    )\n    external_tasks = (\n        tmp_path / "specs" / "001-agent-harness-verified-loop-foundation" / "tasks.md"\n    )\n    external_tasks.write_text(\n        "- [x] **A006 Canonical task.**\\n"\n        "- [ ] **A006 Duplicate with *emphasis*.**\\n",\n        encoding="utf-8",\n    )\n\n    result = evaluate_task_snapshot(\n        "B001",\n        repository_root=tmp_path,\n        catalog_path=catalog_path,\n        canonical_main=_CANONICAL_MAIN,\n    )\n\n    assert result["eligible"] is False\n    predecessor = result["prerequisite_results"][0]\n    assert predecessor["satisfied"] is False\n    assert "prerequisite.external_checkbox_unverifiable" in predecessor["reasons"]\n'''
          assert "test_external_prerequisite_emphasized_duplicate_checklist_row_fails_closed" not in tests
          tests += regression
          tests_path.write_text(tests, encoding="utf-8")

          evidence_path = Path("evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md")
          evidence = evidence_path.read_text(encoding="utf-8")
          section = '''\n\n## Emphasized duplicate-row hardening from independent review\n\nIndependent exact-head review of PR #128 found that the external checklist matcher excluded task-title rows containing Markdown emphasis because the title character class rejected `*`. A checked canonical row plus an emphasized duplicate could therefore be misread as uniquely located. The matcher now accepts the full non-newline title payload after the exact task id, so every matching task row is counted and any duplicate remains fail-closed as `prerequisite.external_checkbox_unverifiable`. A dedicated regression covers a checked row plus an emphasized duplicate. The same review also identified and removed one redundant duplicate assertion in the fenced-state-evidence regression; that cleanup does not alter eligibility semantics.\n'''
          assert "## Emphasized duplicate-row hardening from independent review" not in evidence
          evidence += section
          evidence_path.write_text(evidence, encoding="utf-8")
          PY
          git diff --check
      - name: Verify exact four-file candidate scope and pending task ledger
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" | sort)
          expected=(
            configs/task-gate/mstr-000b.json
            evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md
            src/mstr_qualify/task_gate.py
            tests/contract/test_task_gate.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 4
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test -z "$(git diff --name-only "$BASE_SHA" -- .github/workflows)"
          test -z "$(git diff --name-only "$BASE_SHA" -- specs/002-code-model-supremacy-foundation/tasks.md)"
          echo "SCOPE=PASS"
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused task-gate tests
        run: python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src
      - name: Prospective B023 eligibility on repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from mstr_qualify.task_gate import evaluate_task_snapshot

          result = evaluate_task_snapshot(
              "B023",
              repository_root=Path.cwd(),
              catalog_path=Path("configs/task-gate/mstr-000b.json"),
              canonical_main="db12d1467bb81185a9affffb4d470626ceceddfa",
          )
          assert result["eligible"] is True, result
          states = {item["task_id"]: item for item in result["prerequisite_results"]}
          for task_id in ("A006", "A014", "B002", "B022"):
              assert states[task_id]["satisfied"] is True, states[task_id]
          print("B023_PROSPECTIVE_ELIGIBLE=PASS")
          PY
      - name: Create one-parent atomic candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MSTR Evidence Builder"
          git config user.email "mstr-evidence-builder@users.noreply.github.com"
          git add \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md \
            src/mstr_qualify/task_gate.py \
            tests/contract/test_task_gate.py
          git commit -m "fix(task-gate): fail closed on emphasized duplicate rows"
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..HEAD")" -eq 1
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - name: Final guarded push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SOURCE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$SOURCE_SHA"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target branch appeared during qualification" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "GUARDED_PUSH=PASS"
