name: B012 case-checkpoint format builder v2

on:
  push:
    branches:
      - evidence/b012-case-checkpoint-format-builder-v2-369fa33

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BASE: 2d35efe6d7350f6aa0241ee9de128134cd321f90
      START_SUBJECT: 369fa334600c6dfcefd75f3f1dcb828a7032f32f
      TARGET_BRANCH: fix/b012-qwen-raw-code-case-checkpoint-topology
    steps:
      - name: Checkout exact repair subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.START_SUBJECT }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Prove exact starting identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$START_SUBJECT"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$START_SUBJECT"
          test "$(git merge-base "$BASE" "$START_SUBJECT")" = "$BASE"

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Format exact repair implementation and contract
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path=Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          script_path=Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          data=json.loads(manifest_path.read_text(encoding='utf-8'))
          data['case_checkpoint_script_sha256']=hashlib.sha256(script_path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print('FORMATTED_SCRIPT_SHA256=' + data['case_checkpoint_script_sha256'])
          PY

      - name: Prove formatted scope and frozen surfaces
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/dirty.txt
          cat > /tmp/expected-dirty.txt <<'EOF'
          artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json
          colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py
          tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          EOF
          sort -o /tmp/expected-dirty.txt /tmp/expected-dirty.txt
          diff -u /tmp/expected-dirty.txt /tmp/dirty.txt
          git diff --name-only "$BASE" | sort > /tmp/all.txt
          cat > /tmp/expected-all.txt <<'EOF'
          artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json
          colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py
          configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml
          evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md
          tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          EOF
          sort -o /tmp/expected-all.txt /tmp/expected-all.txt
          diff -u /tmp/expected-all.txt /tmp/all.txt
          for path in \
            .github/workflows/b012-qwen-raw-code-recovery.yml \
            artifacts/manifests/B012-executor-toolchain-binding.json \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B012-equivalent-qualification-execution-envelope.json \
            artifacts/manifests/B012-executor-toolchain-lock.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_raw_code.py; do
            test "$(git hash-object "$path")" = "$(git rev-parse "$BASE:$path")"
          done

      - name: Prove repair hashes and non-authorizing semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          m=json.loads(Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json').read_text())
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['base_main']=='2d35efe6d7350f6aa0241ee9de128134cd321f90'
          assert m['case_checkpoint_script_sha256']==sha(m['case_checkpoint_script_path'])
          assert m['case_checkpoint_workflow_sha256']==sha(m['case_checkpoint_workflow_spec_path'])=='f15941577213c5e96a1ebb3993989693628eae5f2e28620f90e03110d303d127'
          assert m['raw_code_manifest_sha256']==sha(m['raw_code_manifest_path'])=='038586bb8156add6bb2de8573a9d15d0f1201909c36820a6cc608a2b5d393349'
          assert sha('.github/workflows/b012-qwen-raw-code-recovery.yml')==m['active_workflow_at_repair_base_sha256']=='e5a666641af6557efb2aba7091a51db3deef973f6177ab682207a4326d3f4bbe'
          assert m['topology']['raw_code_case_order']==['python-clamp','python-dedupe','python-safe-divide']
          assert m['topology']['maximum_uncheckpointed_raw_code_cases']==1
          assert m['topology']['durable_upload_after_each_raw_code_case'] is True
          assert m['activation']['active_workflow_materialized'] is False
          assert m['activation']['separate_activation_pr_required'] is True
          assert m['triggering_incident']['run_id']==34231845282
          assert m['triggering_incident']['canonical_incident_postmerge_run_id']==34250328560
          assert m['triggering_incident']['model_quality_verdict']=='NONE'
          assert m['triggering_incident']['candidate_admission_decision']=='NONE'
          for key in ('authority_scope_modified','authority_transfer','retry_authority_created','external_dispatch_authority_created','candidate_expansion','candidate_revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert m['authority_boundary'][key] is False, key
          PY

      - name: Create local immutable formatted subject
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add \
            artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'style(b012): canonicalize case-checkpoint repair formatting'
          echo "NEW_SUBJECT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "NEW_TREE=$(git show -s --format=%T HEAD)" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain)"

      - name: Reprove B012 exact-main machine eligibility
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text())
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True
          assert d['authority_result']['required'] is True
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['superseded'] is False
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          PY
          git checkout --detach "$NEW_SUBJECT"
          test "$(git rev-parse HEAD)" = "$NEW_SUBJECT"
          test "$(git show -s --format=%T HEAD)" = "$NEW_TREE"

      - name: Focused repair contracts
        run: |
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py

      - name: Repository validation and static quality
        run: |
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py

      - name: Full repository tests
        run: python -m pytest -q

      - name: Mypy
        run: python -m mypy src/mstr_qualify

      - name: Push only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEW_SUBJECT"
          test "$(git show -s --format=%T HEAD)" = "$NEW_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$START_SUBJECT"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$NEW_SUBJECT"
          echo "NEW_SUBJECT=$NEW_SUBJECT"
          echo "NEW_TREE=$NEW_TREE"
          echo 'B012_CASE_CHECKPOINT_FORMAT_BUILDER_V2=PASS'
