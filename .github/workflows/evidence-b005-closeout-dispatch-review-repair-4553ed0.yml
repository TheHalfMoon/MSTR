name: Repair B006 CLI dispatch assertion

on:
  push:
    branches: [evidence/b005-closeout-dispatch-review-repair-4553ed0]

permissions:
  contents: write

env:
  EXPECTED_MAIN: 1e096f4d1f270b2803da6a6306e9e7f0cf8fb81b
  EXPECTED_TARGET: 4553ed0a142ce2634bc42182b5380b9ac96b2ba5
  TARGET_BRANCH: docs/000b-b005-canonicalize
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: canonical
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: docs/000b-b005-canonicalize
          fetch-depth: 0
          path: target
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical tooling
        run: python -m pip install -e './canonical[dev]'
      - name: Re-prove exact canonical entry gate
        working-directory: canonical
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET"
          test -z "$(git status --short)"
          python -m mstr_qualify task eligible B005 > /tmp/b005-entry.json
          python -m mstr_qualify task drift > /tmp/b005-drift.json
          python - <<'PY'
          import json, os
          task=json.load(open('/tmp/b005-entry.json',encoding='utf-8'))
          drift=json.load(open('/tmp/b005-drift.json',encoding='utf-8'))
          assert task['task_id']=='B005'
          assert task['eligible'] is True
          assert task['canonical_main']==os.environ['EXPECTED_MAIN']
          assert task['state_consistency_result']['observed_state']=='PENDING'
          assert drift['status']=='clean' and drift['findings']==[]
          print('B005_DISPATCH_REPAIR_ENTRY_GATE=PASS')
          PY
      - name: Verify exact target head
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET"
          test -z "$(git status --short)"
      - name: Apply exact dispatch assertion repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('target/tests/integration/test_task_gate_cli.py')
          s=p.read_text(encoding='utf-8')
          old='''    expected = evaluate_task_snapshot("B006", canonical_main=_CANONICAL_MAIN)\n    monkeypatch.setattr(\n        "mstr_qualify.cli.evaluate_task_eligibility",\n        lambda task_id: expected,\n    )\n\n    exit_code = main(["task", "eligible", "B006"])\n'''
          new='''    expected = evaluate_task_snapshot("B006", canonical_main=_CANONICAL_MAIN)\n\n    def fake_evaluate_task_eligibility(task_id: str) -> dict[str, object]:\n        assert task_id == "B006"\n        return expected\n\n    monkeypatch.setattr(\n        "mstr_qualify.cli.evaluate_task_eligibility",\n        fake_evaluate_task_eligibility,\n    )\n\n    exit_code = main(["task", "eligible", "B006"])\n'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('B006_CLI_DISPATCH_ASSERTION=ADDED')
          PY
      - name: Verify bounded review repair
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_MAIN"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          expected={
              'configs/task-gate/mstr-000b.json',
              'evidence/mstr-000b/B005-code-backbone-rescan.md',
              'specs/002-code-model-supremacy-foundation/tasks.md',
              'tests/contract/test_task_gate.py',
              'tests/integration/test_task_gate_cli.py',
          }
          changed=set(subprocess.run(
              ['git','diff','--name-only',os.environ['EXPECTED_MAIN']],
              check=True,capture_output=True,text=True,
          ).stdout.splitlines())
          assert changed==expected,(changed,expected)
          c=json.loads(Path('configs/task-gate/mstr-000b.json').read_text(encoding='utf-8'))
          assert c['tasks']['B005']['canonical_state']=='COMPLETE_CANONICAL'
          assert c['tasks']['B005']['closeout_rule']['require_all_outputs'] is True
          assert c['tasks']['B005']['outputs']==['artifacts/manifests/B005-code-backbone-discovery.json']
          assert c['tasks']['B006']['canonical_state']=='PENDING'
          assert c['tasks']['B006']['prerequisites']==['B005']
          print('B005_DISPATCH_REPAIR_SCOPE=PASS_5_FILES')
          PY
      - name: Install repaired target tooling
        run: python -m pip install -e './target[dev]'
      - name: Targeted CLI dispatch test
        working-directory: target
        run: pytest -q tests/integration/test_task_gate_cli.py -k b006_successor
      - name: Pytest
        working-directory: target
        run: pytest -q
      - name: Ruff
        working-directory: target
        run: ruff check src tests
      - name: Mypy
        working-directory: target
        run: mypy
      - name: Validate
        working-directory: target
        run: python -m mstr_qualify validate
      - name: Commit exact review repair
        id: commit
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/test_task_gate_cli.py
          git commit -m "test(mstr-000b): assert B006 CLI dispatch"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET"
          git diff --check "$EXPECTED_MAIN" HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify exact repaired head scope
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.commit.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "$candidate"
          changed="$(git diff --name-only "$EXPECTED_MAIN" HEAD | sort)"
          expected="$(printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B005-code-backbone-rescan.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort)"
          test "$changed" = "$expected"
          test -z "$(git status --short)"
          echo "B005_DISPATCH_REPAIRED_HEAD=$candidate"
      - name: Guarded fast-forward push
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.commit.outputs.sha }}"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET"
          test "$(git rev-parse HEAD)" = "$candidate"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "B005_CLOSEOUT_DISPATCH_REPAIR=$candidate"
