name: Verify B004 post-closeout canonical main

on:
  push:
    branches:
      - evidence/b004-postcloseout-986b174

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 986b174b2bf79ce53a3e67b9b02c55cbe6981303
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          ref: 986b174b2bf79ce53a3e67b9b02c55cbe6981303
          fetch-depth: 0
          persist-credentials: false

      - name: Establish trusted canonical-main refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          git branch -f main "$EXPECTED_MAIN"
          git checkout main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Production B004 terminal gate
        shell: bash
        run: |
          set -euo pipefail
          code=0
          python -m mstr_qualify task eligible B004 > /tmp/b004.json || code=$?
          cat /tmp/b004.json
          test "$code" = "1"
          python - <<'PY'
          import json, os
          with open('/tmp/b004.json', encoding='utf-8') as fh:
              payload = json.load(fh)
          assert payload['task_id'] == 'B004'
          assert payload['eligible'] is False
          assert payload['canonical_main'] == os.environ['EXPECTED_MAIN']
          assert payload['state_consistency_result']['observed_state'] == 'COMPLETE_CANONICAL'
          assert 'task.already_terminal' in payload['reasons']
          PY

      - name: Production B005 entry gate
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task eligible B005 > /tmp/b005.json
          cat /tmp/b005.json
          python - <<'PY'
          import json, os
          with open('/tmp/b005.json', encoding='utf-8') as fh:
              payload = json.load(fh)
          assert payload['task_id'] == 'B005'
          assert payload['eligible'] is True
          assert payload['canonical_main'] == os.environ['EXPECTED_MAIN']
          assert payload['reasons'] == []
          PY

      - name: Canonical task drift
        run: python -m mstr_qualify task drift

      - name: Targeted governance tests
        run: pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_task_drift.py tests/integration/test_task_drift_cli.py

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Final immutable canonical-main check
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"
          echo "FINAL_MAIN_SHA=$EXPECTED_MAIN"
