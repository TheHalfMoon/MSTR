name: PR168 B012 authority exact-head qualification

on:
  push:
    branches:
      - evidence/pr168-b012-authority-qualification-1b5528b

permissions:
  contents: read
  pull-requests: read

env:
  REPO: TheHalfMoon/MSTR
  PR_NUMBER: "168"
  BASE_SHA: e5e47644fb7122cbb47b43cdf13d072f82ebfdf7
  TARGET_HEAD: 1b5528bd824dd4c7896d07f50e12a9353e7e903e
  TARGET_TREE: 875e722d32687525cd4209ee23b0d5660fad3dad

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact authority head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Verify live identity and bounded authority semantics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" "$TARGET_HEAD")" = "$BASE_SHA"
          git diff --check "$BASE_SHA...$TARGET_HEAD"
          changed="$(git diff --name-only "$BASE_SHA...$TARGET_HEAD" | sort)"
          expected="$(printf '%s\n' artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json artifacts/manifests/B012-equivalent-qualification-execution-envelope.json tests/contract/test_b012_authority.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py | sort)"
          test "$changed" = "$expected"
          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")"
          python - "$pr_json" <<'PY'
          import json, os, sys
          pr=json.loads(sys.argv[1])
          assert pr['state']=='open' and pr['draft'] is False
          assert pr['base']['sha']==os.environ['BASE_SHA']
          assert pr['head']['sha']==os.environ['TARGET_HEAD']
          assert pr['changed_files']==5 and pr['commits']==1
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          from mstr_qualify.task_gate import evaluate_task_snapshot
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text())
          e=json.loads(Path('artifacts/manifests/B012-equivalent-qualification-execution-envelope.json').read_text())
          assert a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert a['task_id']=='B012' and a['status']=='AUTHORIZED_CANONICAL'
          s=a['scope']
          assert s['decision']=='FOUNDER_B012_EQUIVALENT_QUALIFICATION_DECISION=AUTHORIZE_EXACT_B010_CANDIDATES'
          assert s['decision_surface']=={'issue':162,'comment_id':5553875175}
          assert s['candidate_ids']==['mellum-4b','qwen3.5-0.8b-control']
          assert s['training'] is False and s['weight_changing_training'] is False
          assert s['new_candidate_access'] is False
          assert e['candidate_ids']==s['candidate_ids']
          assert e['dispatch_state']=='BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING'
          assert e['toolchain_provisioning']['state']=='BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING'
          assert e['resource_ceiling']['paid_cost_usd']==0.0
          assert e['runner_envelope']['founder_machine_model_binaries']==0
          assert e['runner_envelope']['git_model_binaries']==0
          r=evaluate_task_snapshot('B012', canonical_main='a'*40)
          assert r['eligible'] is True and r['reasons']==[]
          r13=evaluate_task_snapshot('B013', canonical_main='a'*40)
          assert r13['eligible'] is False
          assert 'prerequisite.unsatisfied:B012' in r13['reasons']
          PY

  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact authority head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Run frozen repository gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_b012_authority.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/contract/test_convergence_external_bindings.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"

  final_qualification:
    needs: [identity_scope, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Recheck exact live head and emit verdict
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/branches/main" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          pr_head="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          test "$main_sha" = "$BASE_SHA"
          test "$pr_head" = "$TARGET_HEAD"
          echo "B012_AUTHORITY_EXACT_HEAD_QUALIFICATION=PASS"
          echo "BASE_SHA=$BASE_SHA"
          echo "TARGET_HEAD=$TARGET_HEAD"
          echo "TARGET_TREE=$TARGET_TREE"
          echo "EXTERNAL_EXECUTION=NOT_DISPATCHED"
