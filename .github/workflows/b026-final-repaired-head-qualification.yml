name: Qualify final repaired B026 exact implementation head

on:
  push:
    branches: [evidence/b026-qualify-08399fa]

permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read

env:
  BASE_SHA: 823cd7ec3b4c537876a0795d0f0f8d4bd75acd85
  INITIAL_HEAD: a2414b1bf58a5bce3a69ee965e74d8ac9d0ba7a8
  FIRST_REPAIRED_HEAD: 45d9f9f0ded97ebd482c29d419d2ff41bd9e940a
  HEAD_SHA: 08399fa64ed82f31feb5b5cff2f92420bde36308
  HEAD_TREE: d9b7e2da6488934ddaf24b6ec9c9f373d62e0aea
  TARGET_BRANCH: feat/000b-b026-research-ladder
  PR_NUMBER: '137'
  INITIAL_BUILDER_RUN: '33565430381'
  INITIAL_QUALIFICATION_RUN: '33565694537'
  FIRST_REPAIR_RUN: '33625504116'
  FIRST_REPAIRED_QUALIFICATION_RUN: '33625838318'
  FINAL_REPAIR_RUN: '33632563787'

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.HEAD_SHA }}', fetch-depth: 0}
      - name: Verify exact final repaired identity scope and provenance
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$FIRST_REPAIRED_HEAD"
          test "$(git rev-parse HEAD^^)" = "$INITIAL_HEAD"
          test "$(git rev-parse HEAD^^^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and .commits == 3 and .changed_files == 17' /tmp/pr.json

          printf '%s\n' \
            configs/research/mstr-research-ladder-v0.json \
            evidence/mstr-000b/B026-research-ladder.md \
            schemas/mstr-material-result-identity-v0.schema.json \
            schemas/mstr-research-experiment-v2.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/README.md \
            specs/002-code-model-supremacy-foundation/contracts/mstr-material-result-identity-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-research-experiment-v2.schema.json \
            specs/002-code-model-supremacy-foundation/data-model.md \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/schemas.py \
            tests/contract/test_research_ladder_contract.py \
            tests/contract/test_schemas.py \
            tests/fixtures/schemas/invalid/mstr-material-result-identity-v0.json \
            tests/fixtures/schemas/invalid/mstr-research-experiment-v2.json \
            tests/fixtures/schemas/valid/mstr-material-result-identity-v0.json \
            tests/fixtures/schemas/valid/mstr-research-experiment-v2.json \
            tests/integration/test_cli_offline.py | sort > /tmp/expected
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE_SHA...$HEAD_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- specs/002-code-model-supremacy-foundation/tasks.md configs/task-gate/mstr-000b.json)"

          for run_id in "$INITIAL_BUILDER_RUN" "$INITIAL_QUALIFICATION_RUN" "$FIRST_REPAIR_RUN" "$FIRST_REPAIRED_QUALIFICATION_RUN" "$FINAL_REPAIR_RUN"; do
            run="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$run_id)"
            test "$(jq -r '.status' <<<"$run")" = completed
            test "$(jq -r '.conclusion' <<<"$run")" = success
          done

          final_repair="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${FINAL_REPAIR_RUN})"
          test "$(jq -r '.name' <<<"$final_repair")" = 'Guard B026 remaining Codex review repair v5'
          test "$(jq -r '.head_sha' <<<"$final_repair")" = '9b481dd3b5a9051abd97dbd4e02f97f6e8fe9b4b'

          for spec in \
            '3913543823|Require the complete per-level gate set before promotion' \
            '3913543831|Require canonical authority for external-effect results' \
            '3913543839|Add data and difficulty identities to material results'; do
            id="${spec%%|*}"; needle="${spec#*|}"
            comment="$(gh api repos/${GITHUB_REPOSITORY}/pulls/comments/$id)"
            test "$(jq -r '.user.login' <<<"$comment")" = 'chatgpt-codex-connector[bot]'
            grep -F "$needle" <<<"$(jq -r '.body' <<<"$comment")"
          done

  machine_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.HEAD_SHA }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: pyproject.toml}
      - name: Re-prove exact B026 task frontier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$HEAD_SHA"
          git update-ref refs/remotes/origin/main "$HEAD_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B026 > /tmp/b026.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0' /tmp/b026.json
          set +e
          mstr-qualify task eligible B027 > /tmp/b027.json; b027_rc=$?
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_rc=$?
          set -e
          test "$b027_rc" -eq 1
          test "$b011_rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING" and ([.prerequisite_results[] | select(.task_id == "B026" and .observed_state == "PENDING" and .satisfied == false)] | length == 1)' /tmp/b027.json
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.HEAD_SHA }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: pyproject.toml}
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused B026 final repair and registry tests
        run: python -m pytest tests/contract/test_schemas.py tests/contract/test_research_ladder_contract.py tests/integration/test_cli_offline.py -q
      - name: Offline schema and explicit B026 CLI validation
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m mstr_qualify validate tests/fixtures/schemas/valid/mstr-material-result-identity-v0.json
          python -m mstr_qualify validate tests/fixtures/schemas/valid/mstr-research-experiment-v2.json
          set +e
          python -m mstr_qualify validate tests/fixtures/schemas/invalid/mstr-material-result-identity-v0.json; material_rc=$?
          python -m mstr_qualify validate tests/fixtures/schemas/invalid/mstr-research-experiment-v2.json; experiment_rc=$?
          set -e
          test "$material_rc" -eq 1
          test "$experiment_rc" -eq 1
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src
      - name: Verify final repaired contract semantics and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          cmp schemas/mstr-material-result-identity-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-material-result-identity-v0.schema.json
          cmp schemas/mstr-research-experiment-v2.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-research-experiment-v2.schema.json
          jq -S 'del(."$schema", ."$id", .title)' schemas/mstr-material-result-identity-v0.schema.json > /tmp/material-standalone.json
          jq -S '."$defs".material_result_identity' schemas/mstr-research-experiment-v2.schema.json > /tmp/material-embedded.json
          cmp /tmp/material-standalone.json /tmp/material-embedded.json
          grep -F '"mstr.material-result-identity.v0": "mstr-material-result-identity-v0"' src/mstr_qualify/cli.py
          grep -F '"mstr.research-experiment.v2": "mstr-research-experiment-v2"' src/mstr_qualify/cli.py
          grep -F '_material_result_identity_semantic_errors' src/mstr_qualify/schemas.py
          grep -F '_research_experiment_semantic_errors' src/mstr_qualify/schemas.py
          grep -F 'and isinstance(level, str)' src/mstr_qualify/schemas.py
          grep -F 'PROMOTE requires exact per-level required gate coverage' src/mstr_qualify/schemas.py
          jq -e '.promotion_policy.required_gate_coverage_semantically_enforced == true and .promotion_policy.external_effect_authority_binding_required == true and .promotion_policy.training_evidence_data_difficulty_identity_required == true' configs/research/mstr-research-ladder-v0.json
          jq -e '([.levels[] | (.required_gate_ids | length == 5)] | all)' configs/research/mstr-research-ladder-v0.json
          jq -e '(.properties.evidence_kind.enum | index("TRAINING_EVIDENCE")) != null and (.required | index("data_identity_or_na")) != null and (.required | index("difficulty_identity_or_na")) != null' schemas/mstr-material-result-identity-v0.schema.json
          jq -e '.properties.external_effect_authority != null and (.required | index("external_effect_authority")) != null and ."$defs".external_effect_authority.properties.authority_record_sha256.pattern == "^[0-9a-fA-F]{64}$"' schemas/mstr-research-experiment-v2.schema.json
          jq -e '[.levels[].level] == ["L0_CONTRACT_SMOKE","L1_CODE_PROXY","L2_EXECUTABLE_REPO","L3_DIRECTION_TO_DONE","L4_Q4_UNIVERSAL_LAPTOP"]' configs/research/mstr-research-ladder-v0.json
          grep -F '**State:** `IMPLEMENTATION_ACTIVE`' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'B026_ELIGIBLE = true' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'The external-effect authority object is evidence about authority granted elsewhere. It is not an authority grant.' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'RESEARCH_CAMPAIGN_EXECUTION = NONE' evidence/mstr-000b/B026-research-ladder.md
          for marker in 'MODEL_WEIGHT_ACCESS = NONE' 'MODEL_EXECUTION = NONE' 'TEST_GENERATION_EXECUTION = NONE' 'VERIFIER_EXECUTION = NONE' 'TEACHER_API_EXECUTION = NONE' 'PAID_MODEL_API = NONE' 'PAID_COMPUTE = NONE' 'NETWORK_MODEL_OR_TEACHER_CALL = NONE' 'LARGE_DATASET_INGESTION = NONE' 'PRIVATE_USER_DATA_INGESTION = NONE' 'PRODUCTION_TRACE_INGESTION = NONE' 'WEIGHT_CHANGING_TRAINING = NONE' 'LARGE_SCALE_RL = NONE' 'PRODUCTION_RELEASE = NONE'; do grep -F "$marker" evidence/mstr-000b/B026-research-ladder.md; done
          jq -e '.authority_boundary.contract_freeze_only == true and ([.authority_boundary | to_entries[] | select(.key != "contract_freeze_only") | .value] | all(. == false))' configs/research/mstr-research-ladder-v0.json
          test -z "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- specs/002-code-model-supremacy-foundation/tasks.md configs/task-gate/mstr-000b.json)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"

  complete:
    needs: [identity_scope, machine_gate, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.HEAD_SHA }}', fetch-depth: 0}
      - name: Final immutable exact-head recheck
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$FIRST_REPAIRED_HEAD"
          test "$(git rev-parse HEAD^^)" = "$INITIAL_HEAD"
          test "$(git rev-parse HEAD^^^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and .changed_files == 17 and .commits == 3'
          echo 'B026_FINAL_REPAIRED_EXACT_HEAD_QUALIFICATION=PASS'
