name: Premerge A009 canonical closeout

on:
  push:
    branches:
      - evidence/a009-closeout-premerge-05712be

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  CLOSEOUT_SHA: 05712be44172f8b526aff3fb123bc4842ba750db
  CLOSEOUT_TREE: bdfc1bfad15ad9f864247b412e5b34af2073e1bd
  BASE_SHA: d3b3484280d9cbd13986af4217d934c4c7c49a44
  CLOSEOUT_BRANCH: docs/000a-a009-canonicalize
  PR_NUMBER: "103"
  REVIEW_ID: "5063406061"
  QUALIFICATION_RUN: "33360973919"
  GH_TOKEN: ${{ github.token }}

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CLOSEOUT_SHA }}
          fetch-depth: 0
      - name: Verify immutable closeout admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CLOSEOUT_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$CLOSEOUT_BRANCH | cut -f1)" = "$CLOSEOUT_SHA"

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.state' <<<"$pr_json")" = "open"
          test "$(jq -r '.draft' <<<"$pr_json")" = "false"
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$CLOSEOUT_SHA"
          test "$(jq -r '.head.ref' <<<"$pr_json")" = "$CLOSEOUT_BRANCH"
          test "$(jq -r '.base.ref' <<<"$pr_json")" = "main"
          test "$(jq -r '.base.sha' <<<"$pr_json")" = "$BASE_SHA"
          test "$(jq -r '.mergeable' <<<"$pr_json")" = "true"

          review_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews/$REVIEW_ID")"
          test "$(jq -r '.commit_id' <<<"$review_json")" = "$CLOSEOUT_SHA"
          test "$(jq -r '.state' <<<"$review_json")" = "COMMENTED"

          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename' | sort)"
          expected="$(printf '%s\n' evidence/mstr-000a/A009-wepld-adapter.md specs/001-agent-harness-verified-loop-foundation/tasks.md | sort)"
          test "$files" = "$expected"

          unresolved="$(gh api graphql -f query='query { repository(owner: "TheHalfMoon", name: "MSTR") { pullRequest(number: 103) { reviewThreads(first: 100) { nodes { isResolved } } } } }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          test "$unresolved" = "0"

          qual_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN")"
          test "$(jq -r '.status' <<<"$qual_json")" = "completed"
          test "$(jq -r '.conclusion' <<<"$qual_json")" = "success"

          grep -F -- '- [x] **A009 Implement H2 WePLD-native adapter.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A010 Freeze evidence-derived `CapabilityProfile` contract for WePLD routing.**' specs/001-agent-harness-verified-loop-foundation/tasks.md

  quality:
    needs: admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CLOSEOUT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run frozen closeout premerge gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_SHA"
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest -q tests/unit/harness/test_wepld.py tests/security/test_wepld_adapter_boundary.py tests/unit/harness/test_native.py
          pytest -q
          python -m mstr_qualify validate
          ruff check src tests
          mypy src

  complete:
    needs:
      - admission
      - quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CLOSEOUT_SHA }}
          fetch-depth: 0
      - name: Final immutable closeout merge-admission recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CLOSEOUT_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$CLOSEOUT_BRANCH | cut -f1)" = "$CLOSEOUT_SHA"

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.state' <<<"$pr_json")" = "open"
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$CLOSEOUT_SHA"
          test "$(jq -r '.base.sha' <<<"$pr_json")" = "$BASE_SHA"
          test "$(jq -r '.mergeable' <<<"$pr_json")" = "true"

          review_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews/$REVIEW_ID")"
          test "$(jq -r '.commit_id' <<<"$review_json")" = "$CLOSEOUT_SHA"

          unresolved="$(gh api graphql -f query='query { repository(owner: "TheHalfMoon", name: "MSTR") { pullRequest(number: 103) { reviewThreads(first: 100) { nodes { isResolved } } } } }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          test "$unresolved" = "0"
