name: B012 executor binding resolution

on:
  push:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout binding branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify exact base and B012 authority boundary
        env:
          EXPECTED_MAIN: 603a6865fdbf5a5434565e870d73054c5b574f2a
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          authority_path = Path("artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json")
          envelope_path = Path("artifacts/manifests/B012-equivalent-qualification-execution-envelope.json")
          b010_path = Path("artifacts/manifests/B010-new-candidate-weight-access.json")
          authority = json.loads(authority_path.read_text())
          envelope = json.loads(envelope_path.read_text())
          assert authority["status"] == "AUTHORIZED_CANONICAL"
          assert authority["authority_id"] == "B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION"
          assert authority["task_id"] == "B012"
          assert authority["scope"]["candidate_ids"] == ["mellum-4b", "qwen3.5-0.8b-control"]
          assert envelope["candidate_ids"] == ["mellum-4b", "qwen3.5-0.8b-control"]
          assert envelope["authority_id"] == authority["authority_id"]
          assert envelope["dispatch_state"] == "BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING"
          assert envelope["toolchain_provisioning"]["state"] == "BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING"
          assert envelope["resource_ceiling"]["paid_cost_usd"] == 0.0
          assert envelope["resource_ceiling"]["paid_compute"] is False
          assert envelope["resource_ceiling"]["paid_model_api"] is False
          envelope_sha = hashlib.sha256(envelope_path.read_bytes()).hexdigest()
          b010_sha = hashlib.sha256(b010_path.read_bytes()).hexdigest()
          assert authority["scope"]["bounded_execution_envelope"]["sha256"] == envelope_sha
          assert authority["scope"]["b010_manifest"]["sha256"] == b010_sha
          assert envelope["candidate_source_manifest"]["sha256"] == b010_sha
          print("B012_AUTHORITY_BOUNDARY=VALID")
          print("B012_EXECUTION_DISPATCH=BLOCKED_PENDING_SEPARATELY_REVIEWED_BINDING")
          print("MODEL_ACCESS=NONE")
          print("TRAINING=false")
          print("PAID_COST_USD=0.0")
          PY

      - name: Validate B012 executor candidate without model access
        run: |
          set -euo pipefail
          python -m py_compile \
            colab/mstr_b012_governance.py \
            colab/mstr_b012_source.py \
            colab/mstr_b012_artifacts.py \
            colab/mstr_b012_raw_code.py \
            colab/mstr_b012_execute.py
          python - <<'PY'
          import json
          from pathlib import Path

          candidates = ["mellum-4b", "qwen3.5-0.8b-control"]
          lock = json.loads(Path("artifacts/manifests/B012-executor-toolchain-lock.json").read_text())
          raw = json.loads(Path("benchmarks/manifests/B012-raw-code-proxy.json").read_text())
          acquired = json.loads(Path("artifacts/manifests/B011-acquired-candidates.json").read_text())
          envelope = json.loads(Path("artifacts/manifests/B012-equivalent-qualification-execution-envelope.json").read_text())
          assert lock["task_id"] == "B012"
          assert lock["task_binding"]["candidate_ids"] == candidates
          assert lock["runner"]["python_version"] == "3.11.16"
          assert lock["runner"]["max_parallel_candidates"] == 1
          assert lock["resource_ceiling"]["paid_cost_usd"] == 0.0
          assert lock["resource_ceiling"]["paid_compute"] is False
          assert lock["resource_ceiling"]["paid_model_api"] is False
          assert lock["explicit_dependency_reuse"]["authority_transfer"] is False
          assert lock["explicit_dependency_reuse"]["source_task"] == "T031"
          assert lock["explicit_dependency_reuse"]["package_count"] == 40
          assert raw["task_id"] == "B012"
          assert raw["execution"]["network_model_calls"] == 0
          assert raw["verification"]["score_is_observation_not_admission_gate"] is True
          assert len(raw["tasks"]) == 3
          assert envelope["candidate_ids"] == candidates
          observed = {
              item["candidate_id"]: (item["model_repo"], item["revision"], item["status"])
              for item in acquired["candidates"]
          }
          assert observed == {
              "mellum-4b": ("JetBrains/Mellum-4b-base", "83cce2605fbdf6a3868627e9b0a5924e0072b94d", "ACQUIRED_VERIFIED"),
              "qwen3.5-0.8b-control": ("Qwen/Qwen3.5-0.8B-Base", "dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68", "ACQUIRED_VERIFIED"),
          }
          workflow = Path(".github/workflows/b012-qualify.yml").read_text()
          assert "github.event.issue.number == 162" in workflow
          assert "github.event.comment.user.login == 'TheHalfMoon'" in workflow
          assert "github.event.comment.author_association == 'OWNER'" in workflow
          assert "B012_RUN mellum-4b" in workflow
          assert "B012_RUN qwen3.5-0.8b-control" in workflow
          assert "workflow_dispatch" not in workflow
          print("B012_EXECUTOR_STATIC_VALIDATION=PASS")
          print("MODEL_ACCESS=NONE")
          PY

      - name: Record exact reusable component identities
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/b012-binding-resolution.txt"
          {
            echo "CANONICAL_BASE=603a6865fdbf5a5434565e870d73054c5b574f2a"
            echo "EVIDENCE_HEAD=$(git rev-parse HEAD)"
            sha256sum artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json
            sha256sum artifacts/manifests/B012-equivalent-qualification-execution-envelope.json
            sha256sum artifacts/manifests/B010-new-candidate-weight-access.json
            sha256sum artifacts/manifests/B011-acquired-candidates.json
            sha256sum artifacts/manifests/B011-artifact-mellum-4b.json
            sha256sum artifacts/manifests/B011-artifact-qwen3.5-0.8b-control.json
            sha256sum artifacts/manifests/B012-executor-toolchain-lock.json
            sha256sum benchmarks/manifests/B012-raw-code-proxy.json
            sha256sum artifacts/manifests/T031-executor-toolchain-lock.json
            sha256sum artifacts/manifests/T031-t029-producer-replay-overlay.json
            sha256sum colab/mstr_executor_toolchain.py
            sha256sum colab/mstr_t031_replay.py
            sha256sum colab/mstr_t031_measure.py
            sha256sum colab/mstr_b012_governance.py
            sha256sum colab/mstr_b012_source.py
            sha256sum colab/mstr_b012_artifacts.py
            sha256sum colab/mstr_b012_raw_code.py
            sha256sum colab/mstr_b012_execute.py
            sha256sum configs/runtimes/llama-cpp-cpu.json
            sha256sum .github/workflows/b012-qualify.yml
            python --version
            cmake --version | head -1
            gcc --version | head -1
            g++ --version | head -1
            echo "MODEL_ACCESS=NONE"
            echo "TRAINING=false"
            echo "PAID_COST_USD=0.0"
          } | tee "$report"

      - name: Verify pinned package closure without model access
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          from mstr_t031_replay import install_replay_toolchain

          root = Path(os.environ["RUNNER_TEMP"]) / "b012-no-model-toolchain-smoke"
          python_exe, identity = install_replay_toolchain(
              base_lock_path=Path("artifacts/manifests/T031-executor-toolchain-lock.json"),
              overlay_path=Path("artifacts/manifests/T031-t029-producer-replay-overlay.json"),
              root=root,
          )
          assert python_exe.is_file()
          assert identity["python_version"] == "3.11.16"
          assert identity["package_count"] == 40
          print(json.dumps(identity, sort_keys=True))
          print("B012_TOOLCHAIN_REUSE_CLASS=EXPLICIT_PINNED_DEPENDENCY_REUSE_NO_AUTHORITY_TRANSFER")
          print("MODEL_ACCESS=NONE")
          print("TRAINING=false")
          print("PAID_COST_USD=0.0")
          shutil.rmtree(root, ignore_errors=True)
          PY

      - name: Upload no-model resolution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b012-binding-resolution
          path: ${{ runner.temp }}/b012-binding-resolution.txt
          if-no-files-found: error
          retention-days: 7
