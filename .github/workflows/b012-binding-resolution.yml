name: B012 executor binding resolution

on:
  push:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout binding branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify exact base and B012 authority boundary
        env:
          EXPECTED_MAIN: 603a6865fdbf5a5434565e870d73054c5b574f2a
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          authority_path = Path("artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json")
          envelope_path = Path("artifacts/manifests/B012-equivalent-qualification-execution-envelope.json")
          b010_path = Path("artifacts/manifests/B010-new-candidate-weight-access.json")
          authority = json.loads(authority_path.read_text())
          envelope = json.loads(envelope_path.read_text())
          assert authority["status"] == "AUTHORIZED_CANONICAL"
          assert authority["authority_id"] == "B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION"
          assert authority["task_id"] == "B012"
          assert authority["scope"]["candidate_ids"] == ["mellum-4b", "qwen3.5-0.8b-control"]
          assert envelope["candidate_ids"] == ["mellum-4b", "qwen3.5-0.8b-control"]
          assert envelope["authority_id"] == authority["authority_id"]
          assert envelope["dispatch_state"] == "BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING"
          assert envelope["toolchain_provisioning"]["state"] == "BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING"
          assert envelope["resource_ceiling"]["paid_cost_usd"] == 0.0
          assert envelope["resource_ceiling"]["paid_compute"] is False
          assert envelope["resource_ceiling"]["paid_model_api"] is False
          envelope_sha = hashlib.sha256(envelope_path.read_bytes()).hexdigest()
          b010_sha = hashlib.sha256(b010_path.read_bytes()).hexdigest()
          assert authority["scope"]["bounded_execution_envelope"]["sha256"] == envelope_sha
          assert authority["scope"]["b010_manifest"]["sha256"] == b010_sha
          assert envelope["candidate_source_manifest"]["sha256"] == b010_sha
          print("B012_AUTHORITY_BOUNDARY=VALID")
          print("B012_EXECUTION_DISPATCH=BLOCKED_PENDING_SEPARATELY_REVIEWED_BINDING")
          print("MODEL_ACCESS=NONE")
          print("TRAINING=false")
          print("PAID_COST_USD=0.0")
          PY

      - name: Record exact reusable component identities
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/b012-binding-resolution.txt"
          {
            echo "CANONICAL_BASE=603a6865fdbf5a5434565e870d73054c5b574f2a"
            sha256sum artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json
            sha256sum artifacts/manifests/B012-equivalent-qualification-execution-envelope.json
            sha256sum artifacts/manifests/B010-new-candidate-weight-access.json
            sha256sum artifacts/manifests/T031-executor-toolchain-lock.json
            sha256sum artifacts/manifests/T031-t029-producer-replay-overlay.json
            sha256sum colab/mstr_executor_toolchain.py
            sha256sum colab/mstr_t031_replay.py
            sha256sum configs/runtimes/llama-cpp-cpu.json
            python --version
            cmake --version | head -1
            gcc --version | head -1
            g++ --version | head -1
            echo "MODEL_ACCESS=NONE"
            echo "TRAINING=false"
            echo "PAID_COST_USD=0.0"
          } | tee "$report"

      - name: Verify pinned package closure without model access
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          from mstr_t031_replay import install_replay_toolchain

          root = Path(os.environ["RUNNER_TEMP"]) / "b012-no-model-toolchain-smoke"
          python_exe, identity = install_replay_toolchain(
              base_lock_path=Path("artifacts/manifests/T031-executor-toolchain-lock.json"),
              overlay_path=Path("artifacts/manifests/T031-t029-producer-replay-overlay.json"),
              root=root,
          )
          assert python_exe.is_file()
          assert identity["python_version"] == "3.11.16"
          assert identity["package_count"] == 40
          print(json.dumps(identity, sort_keys=True))
          print("B012_TOOLCHAIN_REUSE_CLASS=EXPLICIT_PINNED_DEPENDENCY_REUSE_NO_AUTHORITY_TRANSFER")
          print("MODEL_ACCESS=NONE")
          print("TRAINING=false")
          print("PAID_COST_USD=0.0")
          shutil.rmtree(root, ignore_errors=True)
          PY

      - name: Upload no-model resolution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b012-binding-resolution
          path: ${{ runner.temp }}/b012-binding-resolution.txt
          if-no-files-found: error
          retention-days: 7
