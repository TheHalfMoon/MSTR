name: Verify B017 drift repair post-merge

on:
  push:
    branches:
      - evidence/b017-drift-repair-postmerge-73b60aa

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 73b60aa9421f51be52560bbbca6e8dd46b77b6c9
      EXPECTED_PARENT: 4919891be2e10c84a4c57a420ee2884d72da4e93
      EXPECTED_REPAIR: 05b0263c65fa99abc6268e56166d90bc8686ad24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind canonical merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_REPAIR"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$EXPECTED_REPAIR^{tree}")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
      - run: python -m pip install -e '.[dev]'
      - name: Prove canonical drift and next frontier
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task drift > /tmp/drift.json
          python -m mstr_qualify task eligible B018 > /tmp/b018.json
          set +e
          python -m mstr_qualify task eligible B017 > /tmp/b017.json
          b17_rc=$?
          python -m mstr_qualify task eligible B011 > /tmp/b011.json
          b11_rc=$?
          set -e
          test "$b17_rc" -ne 0
          test "$b11_rc" -ne 0
          python - <<'PY'
          import json
          drift=json.load(open('/tmp/drift.json'))
          b18=json.load(open('/tmp/b018.json'))
          b17=json.load(open('/tmp/b017.json'))
          b11=json.load(open('/tmp/b011.json'))
          assert drift['status']=='clean' and drift['findings']==[]
          assert b17['eligible'] is False
          assert b17['state_consistency_result']['observed_state']=='COMPLETE_CANONICAL'
          assert 'task.already_terminal' in b17['reasons']
          assert b18['eligible'] is True
          assert b18['state_consistency_result']['observed_state']=='PENDING'
          assert b18['authority_result']['required'] is False
          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state']=='BLOCKED'
          assert b11['authority_result']['required'] is True
          assert b11['authority_result']['satisfied'] is False
          PY
      - name: Frozen repository gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/unit/test_software_evolution_projection.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy
      - name: Final immutable main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
