name: PR183 B012 activation independent review v2

on:
  push:
    branches:
      - evidence/pr183-b012-activation-independent-review-v2-3030980

permissions:
  contents: read
  pull-requests: read

env:
  PR_NUMBER: "183"
  BASE_SHA: b04db4aa42de3c4b5adcba2f54052a6ab2d3fcec
  SUBJECT_BRANCH: fix/b012-activate-stage-checkpoint-topology
  SUBJECT_HEAD: 30309808dfe5e352e5289653bcea97cf18bc2ec3
  SUBJECT_TREE: 21c21200967de1cbfc82c268309a74e669d8fc6a
  QUALIFICATION_RUN: "34150730256"
  EXPECTED_STAGED_SHA256: 1cffee33a17c524dac0743a975d6538e845361d8ae7f8dedf808e4c740f5250e
  EXPECTED_WORKFLOW_SHA256: 383cae4a3729045b9d5a5b2e23ef3430a410070fceefc507b78eaaeaf0232f29
  EXPECTED_REPAIR_SHA256: 2dfc075480fb1549b811fe0976ddef745e0399ccc6c9a301b180684e4f88429e
  FIRST_FAILURE_SHA256: e5abc34f9d251951d4b38508fd0c6f67d8200282f564279a4c6fada65e354030
  SECOND_FAILURE_SHA256: f20f8a1048392932d477c521329566341f0c1a13115caa3091bb27dfcb38df75

jobs:
  independent-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout independent review evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify evidence provenance and live PR identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_HEAD" ]]
          [[ "$(git merge-base "$SUBJECT_HEAD" HEAD)" == "$SUBJECT_HEAD" ]]
          git diff --name-only "$SUBJECT_HEAD..HEAD" | while read -r path; do
            case "$path" in
              .github/workflows/pr183-b012-activation-independent-review-v2-3030980.yml|evidence/b012/pr183-independent-review-v2-trigger-3030980.txt) ;;
              *) echo "Unexpected evidence-branch path: $path" >&2; exit 1 ;;
            esac
          done
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-b012-independent-review-v2',
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          pr = get(f"https://api.github.com/repos/TheHalfMoon/MSTR/pulls/{os.environ['PR_NUMBER']}")
          assert pr['state'] == 'open'
          assert pr['draft'] is False
          assert pr['base']['ref'] == 'main'
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['ref'] == os.environ['SUBJECT_BRANCH']
          assert pr['head']['sha'] == os.environ['SUBJECT_HEAD']
          assert pr['changed_files'] == 6

          qualification = get(
              'https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/'
              + os.environ['QUALIFICATION_RUN']
          )
          assert qualification['status'] == 'completed'
          assert qualification['conclusion'] == 'success'
          print('EVIDENCE_BRANCH_PROVENANCE=PASS')
          print('LIVE_PR_IDENTITY=PASS')
          print('EXACT_HEAD_QUALIFICATION=PASS')
          PY

      - name: Guard exact subject and six-file containment
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_HEAD"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_HEAD" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          [[ "$(git merge-base "$BASE_SHA" HEAD)" == "$BASE_SHA" ]]
          git diff --name-only "$BASE_SHA..HEAD" | sort -u > /tmp/changed
          cat >/tmp/expected <<'EOF'
          .github/workflows/b012-qualify.yml
          artifacts/manifests/B012-executor-toolchain-binding.json
          artifacts/manifests/B012-runner-shutdown-topology-repair.json
          tests/contract/test_b012_executor_binding.py
          tests/contract/test_b012_runner_shutdown_evidence.py
          tests/contract/test_b012_stage_checkpoint_topology.py
          EOF
          sort -u /tmp/expected -o /tmp/expected
          diff -u /tmp/expected /tmp/changed
          echo 'SIX_FILE_CONTAINMENT=PASS'

      - name: Perform substantive topology and authority review
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          active = root / '.github/workflows/b012-qualify.yml'
          staged_workflow = root / 'configs/workflows/b012-qualify-staged.yml'
          staged_executor = root / 'colab/mstr_b012_staged.py'
          repair_path = root / 'artifacts/manifests/B012-runner-shutdown-topology-repair.json'
          binding_path = root / 'artifacts/manifests/B012-executor-toolchain-binding.json'
          first_failure = root / 'artifacts/results/equivalent/B012/failures/B012-mellum-4b-run-34064172421.json'
          second_failure = root / 'artifacts/results/equivalent/B012/failures/B012-mellum-4b-run-34068813113.json'

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert active.read_bytes() == staged_workflow.read_bytes()
          assert digest(active) == os.environ['EXPECTED_WORKFLOW_SHA256']
          assert digest(staged_workflow) == os.environ['EXPECTED_WORKFLOW_SHA256']
          assert digest(staged_executor) == os.environ['EXPECTED_STAGED_SHA256']
          assert digest(repair_path) == os.environ['EXPECTED_REPAIR_SHA256']
          assert digest(first_failure) == os.environ['FIRST_FAILURE_SHA256']
          assert digest(second_failure) == os.environ['SECOND_FAILURE_SHA256']

          workflow = active.read_text(encoding='utf-8')
          assert 'mstr_b012_staged.py' in workflow
          assert 'mstr_b012_execute.py' not in workflow
          assert 'issue_comment:' in workflow
          assert 'workflow_dispatch:' not in workflow
          assert '\n  push:' not in workflow
          assert "github.event.issue.number == 162" in workflow
          assert "github.event.comment.user.login == 'TheHalfMoon'" in workflow
          assert "github.event.comment.author_association == 'OWNER'" in workflow
          assert 'ref: main' in workflow
          assert 'persist-credentials: false' in workflow
          assert 'group: b012-equivalent-qualification-single-candidate' in workflow
          assert 'cancel-in-progress: false' in workflow

          stages = ['init', 'source', 'quantize', 'prefill', 'decode', 'raw-code', 'finalize']
          positions = [workflow.index(f'--stage {stage}') for stage in stages]
          assert positions == sorted(positions)
          assert all(workflow.count(f'--stage {stage}') == 1 for stage in stages)
          assert workflow.count('actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02') == 7
          assert workflow.count('b012-results/*.json') == 7
          assert 'Remove ephemeral B012 binaries' in workflow
          assert 'rm -rf "$RUNNER_TEMP/b012-work"' in workflow
          assert '.gguf' not in '\n'.join(
              line for line in workflow.splitlines() if line.lstrip().startswith('path:')
          )

          repair = json.loads(repair_path.read_text(encoding='utf-8'))
          binding = json.loads(binding_path.read_text(encoding='utf-8'))
          assert repair['activation_state'] == 'ACTIVATED_BY_SEPARATE_CANONICAL_BINDING_CHANGE'
          assert repair['candidate_workflow_sha256'] == os.environ['EXPECTED_WORKFLOW_SHA256']
          assert repair['staged_executor_sha256'] == os.environ['EXPECTED_STAGED_SHA256']
          recovery = repair['recovery_semantics']
          assert recovery['prior_failure_classification_preserved'] is True
          assert recovery['same_monolithic_topology_repetition'] is False
          assert recovery['repair_is_new_repository_evidence'] is True
          assert recovery['retry_same_failed_action_without_new_evidence'] is False
          assert recovery['retry_authority_created'] is False
          assert recovery['external_dispatch_authority_created'] is False

          authority_boundary = repair['authority_boundary']
          assert authority_boundary['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          for key in (
              'candidate_revision_or_file_expansion',
              'new_candidates',
              'training',
              'weight_changing_training',
              'production_release',
              'authority_scope_modified',
              'authority_transfer',
          ):
              assert authority_boundary[key] is False

          resource = repair['resource_boundary']
          assert resource['paid_compute'] is False
          assert resource['paid_model_api'] is False
          assert resource['paid_cost_usd'] == 0.0
          assert resource['git_model_binaries'] == 0
          assert resource['founder_machine_model_binaries'] == 0

          benchmark = repair['benchmark_semantics']
          assert benchmark['modified_by_repair'] is False
          assert benchmark['prompt_tokens'] == 8192
          assert benchmark['decode_tokens'] == 128
          assert benchmark['measured_repetitions'] == 3
          assert benchmark['warmups_excluded'] == 1
          assert benchmark['threads'] == 2

          assert binding['status'] == 'SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          assert binding['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          assert binding['workflow_sha256'] == os.environ['EXPECTED_WORKFLOW_SHA256']
          assert binding['runner_shutdown_topology_repair_manifest_sha256'] == os.environ['EXPECTED_REPAIR_SHA256']

          first = binding['runner_shutdown_recovery']
          second = binding['repeated_runner_shutdown_recovery']
          assert first['run_id'] == 34064172421
          assert first['failure_evidence_sha256'] == os.environ['FIRST_FAILURE_SHA256']
          assert first['model_quality_verdict'] == 'NONE'
          assert first['retry_authority_created'] is False
          assert second['run_id'] == 34068813113
          assert second['failure_evidence_sha256'] == os.environ['SECOND_FAILURE_SHA256']
          assert second['prior_runner_shutdown_run_id'] == 34064172421
          assert second['same_failure_class_recurred'] is True
          assert second['same_single_job_execution_topology'] is True
          assert second['repeating_same_topology_authorized_by_this_evidence'] is False
          assert second['model_quality_verdict'] == 'NONE'
          assert second['retry_authority_created'] is False

          boundary = binding['execution_boundary']
          for key in (
              'authority_transfer',
              'candidate_revision_or_file_expansion',
              'new_candidates',
              'training',
              'weight_changing_training',
              'paid_compute',
              'paid_model_api',
              'production_release',
          ):
              assert boundary[key] is False
          assert boundary['git_model_binaries'] == 0
          assert boundary['founder_machine_model_binaries'] == 0
          assert boundary['paid_cost_usd'] == 0.0

          activation = binding['runner_shutdown_topology_activation']
          assert activation['repair_manifest_sha256'] == os.environ['EXPECTED_REPAIR_SHA256']
          assert activation['staged_executor_sha256'] == os.environ['EXPECTED_STAGED_SHA256']
          assert activation['active_workflow_sha256'] == os.environ['EXPECTED_WORKFLOW_SHA256']
          assert activation['repair_merge_commit'] == os.environ['BASE_SHA']
          assert activation['repair_postmerge_run_id'] == 34148201124
          assert activation['activation_is_separate_repository_change'] is True
          assert activation['retry_authority_created'] is False
          assert activation['external_dispatch_authority_created'] is False
          assert activation['model_access'] == 'NONE'
          assert activation['training'] is False
          assert activation['paid_cost_usd'] == 0.0

          staged_text = staged_executor.read_text(encoding='utf-8')
          assert 'shutil.rmtree(workdir, ignore_errors=True)' in staged_text
          print('SUBSTANTIVE_TOPOLOGY_REVIEW=PASS')
          print('AUTHORITY_BOUNDARY_REVIEW=PASS')
          print('PRIOR_FAILURE_EVIDENCE_PRESERVED=PASS')
          PY

      - name: Verify machine eligibility on actual canonical main
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-review-eligible.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          gate = json.loads(Path('/tmp/b012-review-eligible.json').read_text(encoding='utf-8'))
          assert gate['eligible'] is True
          assert gate['canonical_main'] == os.environ['BASE_SHA']
          print('B012_MACHINE_ELIGIBLE=true')
          PY

      - name: Run independent exact-subject regression
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_HEAD"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_HEAD" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          python -m pytest -q \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            colab/mstr_b012_staged.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final live ref guards and review declaration
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$SUBJECT_BRANCH" | cut -f1)"
          [[ "$REMOTE_MAIN" == "$BASE_SHA" ]]
          [[ "$REMOTE_HEAD" == "$SUBJECT_HEAD" ]]
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_HEAD" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          echo "FINAL_REMOTE_MAIN=$REMOTE_MAIN"
          echo "FINAL_PR_HEAD=$REMOTE_HEAD"
          echo "FINAL_PR_TREE=$SUBJECT_TREE"
          echo 'INDEPENDENT_REVIEW_FINDINGS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
