name: Diagnose B005 post-closeout drift bd4ad13

on:
  push:
    branches: [evidence/b005-drift-diagnostic-bd4ad13]

permissions:
  contents: read

env:
  EXPECTED_MAIN: bd4ad13f076ba2a44cf9bf6cd7ba95d39119eba5
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"
      - name: Install canonical tooling
        run: python -m pip install -e '.[dev]'
      - name: Emit exact canonical drift report
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task drift > /tmp/drift.json
          cat /tmp/drift.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/drift.json',encoding='utf-8'))
          assert p['status']=='drift', p
          print('DRIFT_FINDING_COUNT=' + str(len(p['findings'])))
          for finding in p['findings']:
              print('DRIFT_FINDING=' + json.dumps(finding,sort_keys=True,separators=(',',':')))
          PY
