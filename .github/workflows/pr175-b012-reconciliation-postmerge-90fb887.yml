name: PR175 B012 reconciliation postmerge verification

on:
  push:
    branches:
      - evidence/pr175-b012-reconciliation-postmerge-90fb887

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr175-b012-reconciliation-postmerge-90fb887
  cancel-in-progress: false

env:
  MERGE_SHA: 90fb88734006de8296825034345ba89ed6614794
  MERGE_TREE: 569fb23fe58a16bd15383e44666ca8284c3a8d02
  PR_NUMBER: '175'
  PR_HEAD_SHA: d688f5922a427a25dd48f27c607603edc4e74de1

jobs:
  postmerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Verify merged PR identity before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          root = 'https://api.github.com/repos/TheHalfMoon/MSTR'
          def get(path):
              req = urllib.request.Request(root + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          pr = get(f"/pulls/{os.environ['PR_NUMBER']}")
          assert pr['state'] == 'closed' and pr['merged'] is True
          assert pr['head']['sha'] == os.environ['PR_HEAD_SHA']
          assert pr['merge_commit_sha'] == os.environ['MERGE_SHA']
          assert get('/branches/main')['commit']['sha'] == os.environ['MERGE_SHA']
          print('MERGED_PR_IDENTITY=PASS')
          PY

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Verify exact canonical reconciliation and frozen quality
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = 'main'
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MERGE_SHA"
          test -f evidence/B012-pr174-merge-race-reconciliation.md
          grep -Fq 'PR174_MANDATORY_PREMERGE_FINAL_GUARD = FAILURE' evidence/B012-pr174-merge-race-reconciliation.md
          grep -Fq 'RETROACTIVE_PREMERGE_PASS = PROHIBITED' evidence/B012-pr174-merge-race-reconciliation.md
          grep -Fq 'RESULT_CLASSIFICATION = B012_EXECUTION_FAILED_CLOSED' evidence/B012-pr174-merge-race-reconciliation.md
          grep -Fq 'MODEL_QUALITY_VERDICT = NONE' evidence/B012-pr174-merge-race-reconciliation.md
          grep -Fq 'This reconciliation does not authorize a retry.' evidence/B012-pr174-merge-race-reconciliation.md
          grep -Fq 'This artifact creates no new Founder authority and authorizes no external effect by itself.' evidence/B012-pr174-merge-race-reconciliation.md
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m mstr_qualify task eligible B012
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MERGE_SHA"
          echo 'POSTMERGE_VERIFICATION=PASS'
          echo 'B012_ELIGIBILITY=PASS'
          echo 'RETRY_AUTHORITY_CREATED=false'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
