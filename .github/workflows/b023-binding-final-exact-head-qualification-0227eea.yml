name: B023 binding final exact-head qualification 0227eea

on:
  push:
    branches:
      - evidence/b023-binding-final-qualify-0227eea

permissions:
  contents: read

env:
  BASE_SHA: db12d1467bb81185a9affffb4d470626ceceddfa
  TARGET_SHA: 0227eea165096b7ae8ea3cc853de4b6f941807e4
  TARGET_TREE: 15f0000be34e8a9380349fdc240526cdc32e9965
  TARGET_BRANCH: fix/b023-cross-workstream-bindings-final-atomic-20260901

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact candidate identity and live main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" "$TARGET_SHA")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
      - name: Verify exact four-file scope and pending task state
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat >"$expected" <<'EOF'
          configs/task-gate/mstr-000b.json
          evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md
          src/mstr_qualify/task_gate.py
          tests/contract/test_task_gate.py
          EOF
          git diff --name-only "$BASE_SHA...$TARGET_SHA" | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(grep '^\.github/workflows/' "$actual" || true)"
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md
      - name: Verify binding and final parser semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('configs/task-gate/mstr-000b.json').read_text())
          b023 = catalog['tasks']['B023']
          assert b023['canonical_state'] == 'PENDING'
          assert set(b023['prerequisites']) == {'A006', 'A014', 'B002', 'B022'}
          expected = {
              'A006': 'evidence/mstr-000a/A006-finalizer.md',
              'A014': 'evidence/mstr-000a/A014-verifier-shortcuts.md',
          }
          for task_id, evidence_path in expected.items():
              binding = catalog['external_prerequisites'][task_id]
              assert binding['workstream_id'] == 'MSTR-000A'
              assert binding['task_identity'] == f'MSTR-000A / {task_id}'
              assert binding['tasks_file'] == 'specs/001-agent-harness-verified-loop-foundation/tasks.md'
              assert binding['state_evidence'] == evidence_path
              assert evidence_path in binding['evidence_outputs']
              assert binding['required_state'] == 'COMPLETE_CANONICAL'
          source = Path('src/mstr_qualify/task_gate.py').read_text()
          assert 'prerequisite.external_checkbox_unverifiable' in source
          assert 'elif checked is False:' in source
          assert source.count('except (OSError, UnicodeError):') >= 2
          task_parser = source[source.index('def _external_task_checked'):source.index('def _external_evidence_claims')]
          assert '.+?\\.\\*\\*' not in task_parser
          tests = Path('tests/contract/test_task_gate.py').read_text()
          assert 'test_external_prerequisite_checklist_title_does_not_require_trailing_period' in tests
          assert 'test_external_prerequisite_non_utf8_checklist_fails_closed_without_exception' in tests
          assert 'test_external_prerequisite_non_utf8_state_evidence_fails_closed_without_exception' in tests
          PY

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused task-gate tests
        run: python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src

  complete:
    runs-on: ubuntu-24.04
    needs:
      - identity_scope
      - quality
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Recheck exact candidate immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
