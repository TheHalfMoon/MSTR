name: PR172 replay helper Ruff autofix c02def5

on:
  push:
    branches:
      - evidence/pr172-ruff-autofix-c02def5

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c02def5641e9927dc60b4469f1f8ee2a836a2eb8
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Materialize exact Ruff repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff check --fix colab/mstr_t031_replay.py || true
          python -m ruff format colab/mstr_t031_replay.py
          python -m ruff check colab/mstr_t031_replay.py
          python -m ruff format --check colab/mstr_t031_replay.py
          cp colab/mstr_t031_replay.py /tmp/mstr_t031_replay.py
          sha256sum /tmp/mstr_t031_replay.py
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
      - name: Upload exact repaired helper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr172-ruff-repaired-helper-c02def5
          path: /tmp/mstr_t031_replay.py
          if-no-files-found: error
          retention-days: 14
