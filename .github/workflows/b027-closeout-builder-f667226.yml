name: Build B027 canonical closeout

on:
  push:
    branches:
      - evidence/b027-closeout-builder-f667226

permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  EXPECTED_MAIN: f667226dbf6cd380fefef5ff90fbc14eb1de3630
  IMPLEMENTATION_HEAD: b5e152552f3b840fd74f2fe9b092eca17b56a91d
  IMPLEMENTATION_PR: '141'
  POSTMERGE_RUN: '33761211923'
  TARGET_BRANCH: docs/000b-b027-canonicalize
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify immutable source and proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${POSTMERGE_RUN}" > /tmp/postmerge.json
          jq -e '.status == "completed" and .conclusion == "success"' /tmp/postmerge.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${IMPLEMENTATION_PR}" > /tmp/pr.json
          jq -e --arg merge "$EXPECTED_MAIN" --arg head "$IMPLEMENTATION_HEAD" '.merged == true and .merge_commit_sha == $merge and .head.sha == $head' /tmp/pr.json
          if git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo 'Target branch already exists; refusing overwrite.' >&2
            exit 1
          fi
          cp scripts/b027_closeout_builder.py /tmp/b027_closeout_builder.py
      - name: Build bounded closeout
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" "$EXPECTED_MAIN"
          python /tmp/b027_closeout_builder.py
          expected_paths=$'configs/task-gate/mstr-000b.json\nevidence/mstr-000b/B027-ladder-pilot.md\nspecs/002-code-model-supremacy-foundation/tasks.md\ntests/contract/test_task_gate.py\ntests/integration/test_task_gate_cli.py'
          actual_paths="$(git diff --name-only | sort)"
          test "$actual_paths" = "$expected_paths"
      - name: Validate closeout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
          python -m mstr_qualify validate
          python -m ruff check tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          python -m mypy src
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
      - name: Publish guarded closeout branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add configs/task-gate/mstr-000b.json evidence/mstr-000b/B027-ladder-pilot.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          git commit -m 'docs(mstr-000b): canonicalize B027 ladder pilot'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "B027_CLOSEOUT_HEAD=$(git rev-parse HEAD)"
