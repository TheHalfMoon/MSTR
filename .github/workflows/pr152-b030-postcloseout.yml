name: Verify B030 canonical post-closeout

on:
  push:
    branches:
      - evidence/pr152-b030-postcloseout

permissions:
  contents: read
  pull-requests: read

env:
  MERGE_SHA: 3e3ec4c4ec9b179ab4a3cd7addd6e0a46ac9201b
  PREVIOUS_MAIN: 986cdfdaa2ddc64458a7681caf174f3a0e434a1f
  CLOSEOUT_HEAD: e8f112a504e55df0cc670dc757a2292d243c1f0b
  EXPECTED_TREE: 292594db1132888bcc317330102cc28c24a83c95

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove exact canonical merge topology and PR truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^1)" = "$PREVIOUS_MAIN"
          test "$(git rev-parse HEAD^2)" = "$CLOSEOUT_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          gh api repos/${GITHUB_REPOSITORY}/pulls/152 > /tmp/pr.json
          jq -e --arg head "$CLOSEOUT_HEAD" --arg merge "$MERGE_SHA" '.state == "closed" and .merged == true and .head.sha == $head and .merge_commit_sha == $merge' /tmp/pr.json >/dev/null
      - name: Install canonical tooling and bind local canonical ref
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$MERGE_SHA"
          git update-ref refs/remotes/origin/main "$MERGE_SHA"
          test "$(git rev-parse refs/heads/main)" = "$MERGE_SHA"
      - name: Prove canonical B030 terminal state and fail-closed frontier
        run: |
          set -euo pipefail
          if mstr-qualify task eligible B030 > /tmp/b030.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null and .authority_result.required == false' /tmp/b030.json >/dev/null
          if mstr-qualify task eligible B031 > /tmp/b031.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:A019")) != null and (.reasons | index("prerequisite.unsatisfied:A020")) != null and ((.reasons | index("prerequisite.unsatisfied:B030")) == null)' /tmp/b031.json >/dev/null
          jq -e '[.prerequisite_results[] | select(.task_id == "B030")][0] | .observed_state == "COMPLETE_CANONICAL" and .evidence_present == true and .satisfied == true' /tmp/b031.json >/dev/null
          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json >/dev/null
          if mstr-qualify task eligible B013 > /tmp/b013.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.state_consistency_result.observed_state == "BLOCKED" and ((.reasons | index("prerequisite.unsatisfied:B012")) != null)' /tmp/b013.json >/dev/null
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json >/dev/null
          grep -F '**State:** COMPLETE_CANONICAL' evidence/mstr-000b/B030-long-horizon-quality.md
          grep -F '**Implementation PR:** #151' evidence/mstr-000b/B030-long-horizon-quality.md
          grep -F '**Final implementation head:** `00502aba975e4fa1c2780e5cca1c779fc6b64f27`' evidence/mstr-000b/B030-long-horizon-quality.md
          grep -F '**Canonical implementation merge:** `986cdfdaa2ddc64458a7681caf174f3a0e434a1f`' evidence/mstr-000b/B030-long-horizon-quality.md
          echo 'B030_CANONICAL_TERMINAL=PASS'
          echo 'B031_BLOCKED_BY=A019,A020'
          echo 'B011_AUTHORITY_BOUNDARY=PRESERVED'
      - name: Focused B030 closeout regression
        run: python -m pytest -q tests/contract/test_task_gate.py tests/contract/test_convergence_external_bindings.py tests/contract/test_repository_health_delta_contract.py
      - name: Offline validation
        run: python -m mstr_qualify validate
      - name: Full test suite
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Canonical mypy
        run: python -m mypy src
      - name: Final immutable canonical recheck
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse refs/heads/main)" = "$MERGE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          echo 'B030_POST_CLOSEOUT=PASS'
