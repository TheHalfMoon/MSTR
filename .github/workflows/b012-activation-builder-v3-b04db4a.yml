name: B012 stage-checkpoint topology activation builder v3

on:
  push:
    branches:
      - evidence/b012-activation-builder-b04db4a

permissions:
  contents: write

env:
  BASE_SHA: b04db4aa42de3c4b5adcba2f54052a6ab2d3fcec
  TARGET_BRANCH: fix/b012-activate-stage-checkpoint-topology
  REPAIR_POSTMERGE_RUN: "34148201124"
  EXPECTED_STAGED_SHA256: 1cffee33a17c524dac0743a975d6538e845361d8ae7f8dedf808e4c740f5250e
  EXPECTED_CANDIDATE_WORKFLOW_SHA256: 383cae4a3729045b9d5a5b2e23ef3430a410070fceefc507b78eaaeaf0232f29

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify canonical entry and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$TARGET_BRANCH")" == "$BASE_SHA" ]]
          git checkout -B main origin/main
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligible.json
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          gate = json.loads(Path('/tmp/b012-eligible.json').read_text(encoding='utf-8'))
          assert gate['eligible'] is True
          req = urllib.request.Request(
              'https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/' + os.environ['REPAIR_POSTMERGE_RUN'],
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'mstr-b012-activation-builder-v3',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              run = json.load(response)
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          print('B012_MACHINE_ELIGIBLE=true')
          print('REPAIR_POSTMERGE_EVIDENCE=PASS')
          PY

      - name: Materialize activation candidate
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          cp configs/workflows/b012-qualify-staged.yml .github/workflows/b012-qualify.yml
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          repair_path = Path('artifacts/manifests/B012-runner-shutdown-topology-repair.json')
          binding_path = Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          staged_path = Path('colab/mstr_b012_staged.py')
          candidate_workflow = Path('configs/workflows/b012-qualify-staged.yml')
          active_workflow = Path('.github/workflows/b012-qualify.yml')

          assert digest(staged_path) == os.environ['EXPECTED_STAGED_SHA256']
          assert digest(candidate_workflow) == os.environ['EXPECTED_CANDIDATE_WORKFLOW_SHA256']
          assert active_workflow.read_bytes() == candidate_workflow.read_bytes()

          repair = json.loads(repair_path.read_text(encoding='utf-8'))
          assert repair['activation_state'] == 'INERT_UNTIL_SEPARATE_CANONICAL_BINDING_ACTIVATION'
          repair['activation_state'] = 'ACTIVATED_BY_SEPARATE_CANONICAL_BINDING_CHANGE'
          repair['activation_evidence'] = {
              'activation_base_main': os.environ['BASE_SHA'],
              'repair_merge_commit': os.environ['BASE_SHA'],
              'repair_postmerge_run_id': int(os.environ['REPAIR_POSTMERGE_RUN']),
              'repair_postmerge_status': 'SUCCESS',
              'model_access': 'NONE',
              'training': False,
              'paid_cost_usd': 0.0,
          }
          repair_path.write_text(json.dumps(repair, indent=2) + '\n', encoding='utf-8')
          repair_sha = digest(repair_path)

          binding = json.loads(binding_path.read_text(encoding='utf-8'))
          assert binding['status'] == 'BLOCKED_PENDING_RUNNER_SHUTDOWN_TOPOLOGY_REPAIR'
          binding['status'] = 'SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          binding['workflow_sha256'] = digest(active_workflow)
          binding['runner_shutdown_topology_repair_manifest_sha256'] = repair_sha
          binding['runner_shutdown_topology_activation'] = {
              'repair_id': repair['repair_id'],
              'repair_manifest_sha256': repair_sha,
              'staged_executor_sha256': digest(staged_path),
              'active_workflow_sha256': digest(active_workflow),
              'repair_merge_commit': os.environ['BASE_SHA'],
              'repair_postmerge_run_id': int(os.environ['REPAIR_POSTMERGE_RUN']),
              'activation_is_separate_repository_change': True,
              'retry_authority_created': False,
              'external_dispatch_authority_created': False,
              'model_access': 'NONE',
              'training': False,
              'paid_cost_usd': 0.0,
          }
          binding_path.write_text(json.dumps(binding, indent=2) + '\n', encoding='utf-8')

          executor_test = Path('tests/contract/test_b012_executor_binding.py')
          text = executor_test.read_text(encoding='utf-8')
          anchor = 'WORKFLOW = ROOT / ".github/workflows/b012-qualify.yml"\n'
          assert text.count(anchor) == 1
          text = text.replace(
              anchor,
              anchor
              + 'TOPOLOGY_REPAIR = ROOT / "artifacts/manifests/B012-runner-shutdown-topology-repair.json"\n'
              + 'STAGED_EXECUTOR = ROOT / "colab/mstr_b012_staged.py"\n',
          )
          old_status = 'assert binding["status"] == "BLOCKED_PENDING_RUNNER_SHUTDOWN_TOPOLOGY_REPAIR"'
          assert text.count(old_status) == 1
          text = text.replace(
              old_status,
              'assert binding["status"] == "SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL"',
          )
          needle = '    for path, digest in expected.items():\n        assert isinstance(digest, str)\n        assert _sha256(path) == digest\n'
          assert text.count(needle) == 1
          text = text.replace(
              needle,
              needle
              + '\n    repair = _read_json(TOPOLOGY_REPAIR)\n'
              + '    assert binding["runner_shutdown_topology_repair_manifest_sha256"] == _sha256(TOPOLOGY_REPAIR)\n'
              + '    assert repair["staged_executor_sha256"] == _sha256(STAGED_EXECUTOR)\n'
              + '    assert binding["workflow_sha256"] == repair["candidate_workflow_sha256"]\n',
          )
          needle = '    assert \'python-version: "3.11.16"\' in workflow\n'
          assert text.count(needle) == 1
          text = text.replace(
              needle,
              needle
              + '    assert "mstr_b012_staged.py" in workflow\n'
              + '    assert "mstr_b012_execute.py" not in workflow\n',
          )
          executor_test.write_text(text, encoding='utf-8')

          topology_test = Path('tests/contract/test_b012_stage_checkpoint_topology.py')
          text = topology_test.read_text(encoding='utf-8')
          old = 'def test_repair_package_is_hash_bound_and_does_not_activate_dispatch() -> None:'
          assert text.count(old) == 1
          text = text.replace(
              old,
              'def test_repair_package_is_hash_bound_after_separate_canonical_activation() -> None:',
          )
          old = '    assert binding["status"] == "BLOCKED_PENDING_RUNNER_SHUTDOWN_TOPOLOGY_REPAIR"\n    assert "runner_shutdown_topology_repair_manifest_sha256" not in binding\n\n    assert repair["activation_state"] == "INERT_UNTIL_SEPARATE_CANONICAL_BINDING_ACTIVATION"\n'
          assert text.count(old) == 1
          text = text.replace(
              old,
              '    assert binding["status"] == "SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL"\n'
              + '    assert binding["runner_shutdown_topology_repair_manifest_sha256"] == _sha256(REPAIR)\n'
              + '    assert binding["workflow_sha256"] == _sha256(ROOT / ".github/workflows/b012-qualify.yml")\n\n'
              + '    assert repair["activation_state"] == "ACTIVATED_BY_SEPARATE_CANONICAL_BINDING_CHANGE"\n',
          )
          marker = '    assert recovery["activation_requires_separate_review_and_merge"] is True\n'
          assert text.count(marker) == 1
          text = text.replace(
              marker,
              marker
              + '\n    activation = binding["runner_shutdown_topology_activation"]\n'
              + '    assert isinstance(activation, dict)\n'
              + '    assert activation["repair_manifest_sha256"] == _sha256(REPAIR)\n'
              + '    assert activation["staged_executor_sha256"] == _sha256(STAGED_EXECUTOR)\n'
              + '    assert activation["active_workflow_sha256"] == _sha256(ROOT / ".github/workflows/b012-qualify.yml")\n'
              + '    assert activation["activation_is_separate_repository_change"] is True\n'
              + '    assert activation["retry_authority_created"] is False\n'
              + '    assert activation["external_dispatch_authority_created"] is False\n',
          )
          topology_test.write_text(text, encoding='utf-8')

          shutdown_test = Path('tests/contract/test_b012_runner_shutdown_evidence.py')
          text = shutdown_test.read_text(encoding='utf-8')
          old = 'def test_binding_blocks_same_topology_until_separately_reviewed_repair() -> None:'
          assert text.count(old) == 1
          text = text.replace(
              old,
              'def test_binding_preserves_shutdown_evidence_after_separate_topology_activation() -> None:',
          )
          old = '    assert binding["status"] == "BLOCKED_PENDING_RUNNER_SHUTDOWN_TOPOLOGY_REPAIR"\n'
          assert text.count(old) == 1
          text = text.replace(
              old,
              '    assert binding["status"] == "SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL"\n',
          )
          shutdown_test.write_text(text, encoding='utf-8')

          print(f'ACTIVE_WORKFLOW_SHA256={digest(active_workflow)}')
          print(f'ACTIVATED_REPAIR_MANIFEST_SHA256={repair_sha}')
          print(f'STAGED_EXECUTOR_SHA256={digest(staged_path)}')
          PY
          python -m ruff format \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py

      - name: Verify activation candidate before push
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'colab')
          import mstr_b012_staged as staged
          binding, _, _ = staged._require_staged_binding(Path.cwd())
          assert binding['status'] == 'SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          activation = binding['runner_shutdown_topology_activation']
          assert activation['retry_authority_created'] is False
          assert activation['external_dispatch_authority_created'] is False
          print('STAGED_BINDING_ACTIVATION_GUARD=PASS')
          PY
          python -m pytest -q \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m mstr_qualify validate
          python -m ruff check \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            colab/mstr_b012_staged.py
          python -m ruff format --check \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            colab/mstr_b012_staged.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          { git diff --name-only "$BASE_SHA...HEAD"; git diff --name-only; } | sort -u | sed '/^$/d' > /tmp/changed
          cat >/tmp/expected <<'EOF'
          .github/workflows/b012-qualify.yml
          artifacts/manifests/B012-executor-toolchain-binding.json
          artifacts/manifests/B012-runner-shutdown-topology-repair.json
          tests/contract/test_b012_executor_binding.py
          tests/contract/test_b012_runner_shutdown_evidence.py
          tests/contract/test_b012_stage_checkpoint_topology.py
          EOF
          sort -u /tmp/expected -o /tmp/expected
          diff -u /tmp/expected /tmp/changed

      - name: Commit and forward-only push exact activation candidate
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$TARGET_BRANCH")" == "$BASE_SHA" ]]
          git config user.name "MSTR Evidence Builder"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/b012-qualify.yml \
            artifacts/manifests/B012-executor-toolchain-binding.json \
            artifacts/manifests/B012-runner-shutdown-topology-repair.json \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          git commit -m "fix(b012): activate reviewed stage-checkpoint topology"
          NEW_HEAD="$(git rev-parse HEAD)"
          NEW_TREE="$(git show -s --format=%T HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "ACTIVATION_HEAD=$NEW_HEAD"
          echo "ACTIVATION_TREE=$NEW_TREE"
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
