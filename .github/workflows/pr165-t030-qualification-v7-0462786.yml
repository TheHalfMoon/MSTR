name: Exact-head qualification PR165 T030 final hardened candidate v7

on:
  push:
    branches:
      - evidence/pr165-t030-qualification-v7-0462786

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: pr165-t030-qualification-v7-0462786
  cancel-in-progress: false

env:
  PR_NUMBER: '165'
  BASE_SHA: 226609e3a29a5e5d038bbd0e9c744f3ff2877112
  HEAD_SHA: 0462786550d24096272b7541ab286e838b4a1c2e
  HEAD_TREE: b016ab6a3899accc352d8f177a2ba76451259f66
  TARGET_BRANCH: reconcile/000-t030-portable-cpu-runtime-adapters

jobs:
  identity_scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact live PR identity and bounded authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          root = "https://api.github.com/repos/TheHalfMoon/MSTR"

          def get(path: str):
              with urllib.request.urlopen(
                  urllib.request.Request(f"{root}{path}", headers=headers)
              ) as response:
                  return json.load(response)

          pr = get(f"/pulls/{os.environ['PR_NUMBER']}")
          assert pr["state"] == "open"
          assert pr["draft"] is False
          assert pr["merged"] is False
          assert pr["base"]["ref"] == "main"
          assert pr["base"]["sha"] == os.environ["BASE_SHA"]
          assert pr["head"]["ref"] == os.environ["TARGET_BRANCH"]
          assert pr["head"]["sha"] == os.environ["HEAD_SHA"]
          assert pr["commits"] == 17
          assert pr["changed_files"] == 10

          expected = {
              "artifacts/decisions/T030-runtime-interface-scan.json",
              "configs/runtimes/llama-cpp-cpu.json",
              "evidence/T030-runtime-adapters.md",
              "src/mstr_qualify/runtimes/__init__.py",
              "src/mstr_qualify/runtimes/benchmark_cli.py",
              "tests/integration/test_runtime_adapters.py",
              "tests/security/test_runtime_benchmark_boundary.py",
              "tests/security/test_runtime_environment_boundary.py",
              "tests/security/test_runtime_profile_alias_boundary.py",
              "tests/unit/test_runtime_benchmark_cli.py",
          }
          files = get(f"/pulls/{os.environ['PR_NUMBER']}/files?per_page=100")
          assert {item["filename"] for item in files} == expected

          authority = (
              "/contents/artifacts/authorities/"
              "B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json"
              f"?ref={os.environ['BASE_SHA']}"
          )
          request = urllib.request.Request(f"{root}{authority}", headers=headers)
          try:
              urllib.request.urlopen(request)
          except urllib.error.HTTPError as exc:
              assert exc.code == 404
          else:
              raise AssertionError("B012 authority unexpectedly exists")
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact topology, scope, final hardening, and evidence history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          printf '%s\n' \
            artifacts/decisions/T030-runtime-interface-scan.json \
            configs/runtimes/llama-cpp-cpu.json \
            evidence/T030-runtime-adapters.md \
            src/mstr_qualify/runtimes/__init__.py \
            src/mstr_qualify/runtimes/benchmark_cli.py \
            tests/integration/test_runtime_adapters.py \
            tests/security/test_runtime_benchmark_boundary.py \
            tests/security/test_runtime_environment_boundary.py \
            tests/security/test_runtime_profile_alias_boundary.py \
            tests/unit/test_runtime_benchmark_cli.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- artifacts/authorities artifacts/manifests configs/task-gate .github/workflows docs/canonical specs)"

          grep -Fq '_BLOCKED_RUNTIME_ENV_PREFIXES = ("LLAMA_ARG_", "HF_")' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq 'env=_sanitized_runtime_environment()' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '"--model-url"' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '"--docker-repo"' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq 'def _verify_loaded_artifact_identity' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq 'runtime.artifact_hash_changed_after_load' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq 'test_artifact_mutation_after_load_fails_before_process' tests/security/test_runtime_benchmark_boundary.py
          grep -Fq 'test_subprocess_runner_sanitizes_upstream_option_environment' tests/security/test_runtime_environment_boundary.py
          grep -Fq '33971084397' evidence/T030-runtime-adapters.md
          grep -Fq '33971535582' evidence/T030-runtime-adapters.md
          grep -Fq 'T031_EXECUTION_AUTHORITY = NONE_INFERRED_BY_T030' evidence/T030-runtime-adapters.md

          python - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(
              Path("artifacts/decisions/T030-runtime-interface-scan.json").read_text()
          )
          assert decision["task_id"] == "T030"
          assert decision["canonical_base"] == "226609e3a29a5e5d038bbd0e9c744f3ff2877112"
          assert decision["execution_performed"] is False
          assert decision["model_weight_access_performed"] is False
          primary = decision["runtime_candidates"][0]
          assert primary["adapter_state"] == "RECONCILED_IMPLEMENTATION_UNEXECUTED_FINAL_SECURITY_HARDENED"
          assert primary["interface"]["model_url"] == ["-mu", "--model-url"]
          assert primary["interface"]["docker_repo"] == ["-dr", "--docker-repo"]
          assert "immediately before every benchmark process" in primary["artifact_identity_policy"]
          assert "Hugging Face" in primary["network_policy"]
          assert decision["runtime_candidates"][1]["adapter_state"] == "DEFERRED_INTERFACE_NOT_PROVEN"
          assert not Path(
              "artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json"
          ).exists()
          PY

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run focused and frozen quality gates on exact final hardened candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/unit/test_runtime_benchmark_cli.py \
            tests/security/test_runtime_benchmark_boundary.py \
            tests/security/test_runtime_profile_alias_boundary.py \
            tests/security/test_runtime_environment_boundary.py \
            tests/integration/test_runtime_adapters.py
          python -m mstr_qualify validate
          python -m pytest -q
          ruff check src tests
          mypy
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test -z "$(git status --porcelain)"

  final_qualification:
    needs: [identity_scope, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recheck exact live heads and emit qualification verdict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          echo 'EXACT_HEAD_QUALIFICATION=PASS'
          echo "QUALIFIED_HEAD=$HEAD_SHA"
          echo "QUALIFIED_TREE=$HEAD_TREE"
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
