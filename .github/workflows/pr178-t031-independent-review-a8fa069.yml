name: PR178 T031 independent substantive review a8fa069

on:
  push:
    branches:
      - evidence/pr178-t031-independent-review-a8fa069

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  BASE_SHA: f207ed9080fba1bb597a4091029dfd2a381eb346
  TARGET_HEAD: a8fa069838e05661d3f32dec960c450363ed5a18
  TARGET_TREE: e48c611e695c468ff9508696f2db44139e88d62f
  TARGET_BRANCH: fix/t031-pep440-replay-version-equivalence
  QUALIFICATION_RUN: "34066070646"
  EXPECTED_REPLAY_SHA256: 749eaf1f72a27a47a2a3d993d36a8147f71057428e24cee3271abd8a088e93fb
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  independent_substantive_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false
      - name: Verify immutable subject and qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$BASE_SHA" "$TARGET_HEAD")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$TARGET_HEAD"
          test "$(git diff --name-only "$BASE_SHA".."$TARGET_HEAD" | wc -l)" = 6
          git diff --check "$BASE_SHA".."$TARGET_HEAD"
          python - <<'PY'
          import json, os, urllib.request
          headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          root='https://api.github.com/repos/TheHalfMoon/MSTR'
          def get(path):
              req=urllib.request.Request(root+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          run=get(f'/actions/runs/{os.environ["QUALIFICATION_RUN"]}')
          assert run['conclusion']=='success'
          jobs=get(f'/actions/runs/{os.environ["QUALIFICATION_RUN"]}/jobs?per_page=100')['jobs']
          conclusions={j['name']:j['conclusion'] for j in jobs}
          assert conclusions['exact_head_qualification']=='success'
          assert conclusions['final_live_refs']=='success'
          pr=get('/pulls/178')
          assert pr['state']=='open'
          assert pr['head']['sha']==os.environ['TARGET_HEAD']
          assert pr['base']['sha']==os.environ['BASE_SHA']
          assert pr['changed_files']==6
          print('REVIEW_SUBJECT_IDENTITY=PASS')
          print('QUALIFICATION_IDENTITY=PASS')
          PY
      - name: Independent correctness security and governance assertions
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from packaging.version import Version
          root=Path('.')
          t031=json.loads((root/'artifacts/manifests/T031-executor-toolchain-binding.json').read_text())
          b012=json.loads((root/'artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          authority=json.loads((root/'artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json').read_text())
          helper=root/'colab/mstr_t031_replay.py'
          digest=hashlib.sha256(helper.read_bytes()).hexdigest()
          assert digest=='749eaf1f72a27a47a2a3d993d36a8147f71057428e24cee3271abd8a088e93fb'
          assert t031['producer_replay_helper_sha256']==digest
          assert b012['replay_helper_sha256']==digest
          assert Version('13.0.3')==Version('13.0.3.0')
          assert Version('13.0.3')!=Version('13.0.4')
          text=helper.read_text()
          assert 'Version(actual[name])==Version(expected[name])' in text
          assert '--no-index' in text and '--no-deps' in text
          assert authority['status']=='AUTHORIZED_CANONICAL'
          expected=['granite-4.1-3b','ministral-3-3b','qwen2.5-coder-1.5b','qwen3-4b','qwen3.5-2b','qwen3.5-4b','smollm3-3b','yi-coder-1.5b']
          assert authority['scope']['candidate_ids']==expected
          for key in ('b010_b012_candidates','candidate_revision_or_file_expansion','new_candidates','paid_compute','paid_model_api','production_release','t032_execution','t033_execution','t034_admission_decision','training','weight_changing_training'):
              assert authority['scope'][key] is False, key
          failure=json.loads((root/'artifacts/results/local/T031/failures/T031-granite-4.1-3b-run-34065259852.json').read_text())
          assert failure['candidate_id']=='granite-4.1-3b'
          assert failure['result_classification']=='T031_EXECUTION_FAILED_CLOSED'
          assert failure['training'] is False
          assert failure['paid_cost_usd']==0.0
          print('PR178_CORRECTNESS_REVIEW=PASS')
          print('PR178_SECURITY_BOUNDARY_REVIEW=PASS')
          print('PR178_GOVERNANCE_BOUNDARY_REVIEW=PASS')
          print('B012_CROSS_BINDING=PASS')
          print('AUTHORITY_EXPANSION=false')
          print('FINDINGS=NONE')
          print('MODEL_ACCESS=NONE')
          print('TRAINING=false')
          print('PAID_COST_USD=0.0')
          PY
      - name: Independent full regression
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_replay_version_equivalence.py tests/contract/test_t031_executor_binding.py tests/contract/test_b012_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          test -z "$(git status --porcelain)"
      - name: Final immutable review guard
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$TARGET_HEAD"
          echo 'PR178_INDEPENDENT_SUBSTANTIVE_REVIEW=PASS'
