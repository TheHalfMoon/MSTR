name: PR177 B012 postmerge f207ed9

on:
  push:
    branches:
      - evidence/pr177-b012-postmerge-f207ed9

permissions:
  contents: read

env:
  CANONICAL_MAIN_SHA: f207ed9080fba1bb597a4091029dfd2a381eb346
  CANONICAL_TREE: 9966d965a87b8ec7d4fe72370f70ee0819228db0
  MERGED_PR_HEAD: 098cdc1a58c5abb16bba44ec958e94f99fa0a642
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  canonical_eligibility_and_binding:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact merged canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f207ed9080fba1bb597a4091029dfd2a381eb346
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Revalidate canonical B012 authority and dispatch preconditions
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_MAIN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANONICAL_TREE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$CANONICAL_MAIN_SHA"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligibility.json
          python - <<'PY'
          import json
          from pathlib import Path
          import mstr_b012_governance as governance

          root = Path.cwd()
          binding, envelope, lock = governance._require_binding(root)
          live = governance._require_live_main(root)
          authority = json.loads((root / governance.AUTHORITY_PATH).read_text(encoding='utf-8'))
          assert live == 'f207ed9080fba1bb597a4091029dfd2a381eb346'
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['decision'] == 'FOUNDER_B012_EQUIVALENT_QUALIFICATION_DECISION=AUTHORIZE_EXACT_B010_CANDIDATES'
          assert authority['scope']['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          assert envelope['dispatch_state'] == 'BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING'
          assert binding['status'] == 'SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          assert binding['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          assert binding['b012_measurement_helper_sha256'] == '767b65ba6d1073418c5e1afcc447060cf2c3fec77d39391acaafb826c290cf1c'
          assert binding['executor_script_sha256'] == '699745547b0743e70a9dc94c223b028a565615041b6e0d895c3f96026a6521b0'
          dispatch = binding['dispatch_boundary']
          assert dispatch == {
              'surface': 'ISSUE_COMMENT_CANONICAL_MAIN',
              'issue': 162,
              'command': 'B012_RUN <authorized-candidate>',
              'checkout_ref': 'main',
              'owner': 'TheHalfMoon',
              'owner_association': 'OWNER',
              'max_parallel_candidates': 1,
              'max_job_minutes': 120,
              'canonicalization_required': True,
          }
          boundary = binding['execution_boundary']
          for key in (
              'authority_transfer', 'candidate_revision_or_file_expansion', 'new_candidates',
              'training', 'weight_changing_training', 'paid_compute', 'paid_model_api',
              'production_release'
          ):
              assert boundary[key] is False
          assert boundary['paid_cost_usd'] == 0.0
          assert lock['runner']['max_job_minutes'] == 120
          runtime = lock['task_binding']['runtime_benchmark']
          assert runtime['per_invocation_timeout_seconds'] == 900
          assert runtime['benchmark_wall_budget_seconds'] == 4800
          assert runtime['reserved_non_benchmark_seconds'] == 2400
          assert runtime['authorized_job_ceiling_seconds'] == 7200
          print('B012_POSTMERGE_AUTHORITY_BINDING=PASS')
          print('MODEL_EXECUTION_PERFORMED=false')
          print('TRAINING=false')
          print('PAID_COST_USD=0.0')
          PY
          python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_timeout_binding.py \
            tests/contract/test_b012_timeout_budget.py
          python -m ruff format --check colab/mstr_b012_execute.py colab/mstr_b012_measure.py
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$CANONICAL_MAIN_SHA"

  canonical_quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact merged canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f207ed9080fba1bb597a4091029dfd2a381eb346
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Re-run canonical quality gates postmerge
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_MAIN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANONICAL_TREE"
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          python -m mstr_qualify validate
          test -z "$(git status --porcelain)"

  final_postmerge:
    needs: [canonical_eligibility_and_binding, canonical_quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Guard canonical main after postmerge qualification
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$CANONICAL_MAIN_SHA"
          echo 'PR177_B012_POSTMERGE=PASS'
          echo "CANONICAL_MAIN=$CANONICAL_MAIN_SHA"
          echo "MERGED_PR_HEAD=$MERGED_PR_HEAD"
          echo 'B012_MACHINE_ELIGIBILITY_REVALIDATED=true'
          echo 'FOUNDER_AUTHORITY_REVALIDATED=true'
          echo 'EXECUTOR_BINDING_CANONICAL=true'
          echo 'MODEL_EXECUTION_PERFORMED=false'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
