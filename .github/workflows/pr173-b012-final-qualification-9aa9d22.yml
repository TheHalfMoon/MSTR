name: PR173 B012 final qualification 9aa9d22

on:
  push:
    branches:
      - evidence/pr173-b012-final-qualification-9aa9d22

permissions:
  contents: read

jobs:
  canonical_task_eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify canonical main and B012 machine eligibility
        shell: bash
        run: |
          set -euo pipefail
          BASE=603a6865fdbf5a5434565e870d73054c5b574f2a
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012
          echo 'B012_CANONICAL_MAIN_ELIGIBILITY=PASS'

  exact_product_qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9aa9d221e8b0be9d8af5d1e9efb2b11b89c13b6b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify exact identity scope and immutable binding
        shell: bash
        run: |
          set -euo pipefail
          BASE=603a6865fdbf5a5434565e870d73054c5b574f2a
          HEAD=9aa9d221e8b0be9d8af5d1e9efb2b11b89c13b6b
          TREE=0d62b79860d7f6468238491de0a97846d3fd1de0
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/feat/b012-executor-toolchain-binding | awk '{print $1}')" = "$HEAD"
          git diff --check "$BASE".."$HEAD"
          test "$(git diff --name-only "$BASE".."$HEAD" | wc -l)" = 10
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          binding = json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          authority = json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text())
          envelope = json.loads(Path('artifacts/manifests/B012-equivalent-qualification-execution-envelope.json').read_text())
          lock = json.loads(Path('artifacts/manifests/B012-executor-toolchain-lock.json').read_text())
          pairs = {
            'authority_sha256':'artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json',
            'envelope_sha256':'artifacts/manifests/B012-equivalent-qualification-execution-envelope.json',
            'b010_sha256':'artifacts/manifests/B010-new-candidate-weight-access.json',
            'b011_sha256':'artifacts/manifests/B011-acquired-candidates.json',
            'mellum_b011_artifact_sha256':'artifacts/manifests/B011-artifact-mellum-4b.json',
            'qwen_b011_artifact_sha256':'artifacts/manifests/B011-artifact-qwen3.5-0.8b-control.json',
            'toolchain_lock_sha256':'artifacts/manifests/B012-executor-toolchain-lock.json',
            'raw_code_manifest_sha256':'benchmarks/manifests/B012-raw-code-proxy.json',
            'runtime_profile_sha256':'configs/runtimes/llama-cpp-cpu.json',
            'reused_t031_lock_sha256':'artifacts/manifests/T031-executor-toolchain-lock.json',
            'reused_t031_replay_overlay_sha256':'artifacts/manifests/T031-t029-producer-replay-overlay.json',
            'toolchain_helper_sha256':'colab/mstr_executor_toolchain.py',
            'replay_helper_sha256':'colab/mstr_t031_replay.py',
            'reused_measurement_helper_sha256':'colab/mstr_t031_measure.py',
            'governance_script_sha256':'colab/mstr_b012_governance.py',
            'source_script_sha256':'colab/mstr_b012_source.py',
            'artifact_script_sha256':'colab/mstr_b012_artifacts.py',
            'raw_code_script_sha256':'colab/mstr_b012_raw_code.py',
            'executor_script_sha256':'colab/mstr_b012_execute.py',
            'workflow_sha256':'.github/workflows/b012-qualify.yml',
          }
          for key, path in pairs.items():
              assert binding[key] == hashlib.sha256(Path(path).read_bytes()).hexdigest(), key
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['authority_id'] == 'B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert binding['candidate_ids'] == ['mellum-4b','qwen3.5-0.8b-control']
          assert envelope['candidate_ids'] == binding['candidate_ids']
          assert lock['explicit_dependency_reuse']['source_task'] == 'T031'
          assert lock['explicit_dependency_reuse']['authority_transfer'] is False
          assert binding['dependency_reuse']['authority_transfer'] is False
          for key in ('candidate_revision_or_file_expansion','new_candidates','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert binding['execution_boundary'][key] is False, key
          assert binding['execution_boundary']['paid_cost_usd'] == 0.0
          print('B012_BINDING=PASS')
          print('MODEL_ACCESS=NONE')
          print('TRAINING=false')
          PY
      - name: Run frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_b012_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_governance.py \
            colab/mstr_b012_source.py \
            colab/mstr_b012_artifacts.py \
            colab/mstr_b012_raw_code.py \
            colab/mstr_b012_execute.py \
            tests/contract/test_b012_executor_binding.py
          python -m mypy src/mstr_qualify
          git diff --exit-code
          git diff --cached --exit-code
      - name: Verify reused pinned package closure without model access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from mstr_t031_replay import install_replay_toolchain
          with tempfile.TemporaryDirectory() as td:
              python_exe, identity = install_replay_toolchain(
                  base_lock_path=Path('artifacts/manifests/T031-executor-toolchain-lock.json'),
                  overlay_path=Path('artifacts/manifests/T031-t029-producer-replay-overlay.json'),
                  root=Path(td),
              )
              assert python_exe.is_file()
              assert identity['python_version'] == '3.11.16'
              assert identity['package_count'] == 40
              assert identity['historical_transitive_identity_claim'] is False
              assert identity['equivalence_gate'] == 'EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH'
          print('B012_PINNED_DEPENDENCY_REUSE=PASS')
          print('AUTHORITY_TRANSFER=false')
          print('MODEL_ACCESS=NONE')
          PY

  final_qualification:
    needs: [canonical_task_eligibility, exact_product_qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reverify exact live refs
        shell: bash
        run: |
          set -euo pipefail
          BASE=603a6865fdbf5a5434565e870d73054c5b574f2a
          HEAD=9aa9d221e8b0be9d8af5d1e9efb2b11b89c13b6b
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/feat/b012-executor-toolchain-binding | awk '{print $1}')" = "$HEAD"
          echo 'PR173_B012_EXACT_HEAD_QUALIFICATION=PASS'
          echo "BASE_SHA=$BASE"
          echo "TARGET_HEAD=$HEAD"
          echo 'TARGET_TREE=0d62b79860d7f6468238491de0a97846d3fd1de0'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
