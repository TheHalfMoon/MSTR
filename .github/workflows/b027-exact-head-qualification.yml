name: Qualify B027 research ladder pilot exact head

on:
  push:
    branches: [evidence/b027-qualify-315984b]

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  EXPECTED_MAIN: 312d40eee8400a0dab94633f891b206f66a82855
  EXPECTED_HEAD: 315984b5b0d4013d19baf3868f385bbfce6bdfa4
  EXPECTED_TREE: c4e165dcc109cbd8a7a908f05e42a6d1cfbc1510
  EXPECTED_COMMITS: '9'
  EXPECTED_FILES: '60'
  PR_NUMBER: '141'
  BUILDER_RUN: '33691048260'
  GH_TOKEN: ${{ github.token }}

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify immutable B027 identity and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          test "$(git rev-list --count "$EXPECTED_MAIN..$EXPECTED_HEAD")" = "$EXPECTED_COMMITS"
          git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_HEAD" > /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt | tr -d ' ')" = "$EXPECTED_FILES"
          while IFS= read -r path; do
            case "$path" in
              scripts/research/b027_ladder_pilot.py|artifacts/results/research/B027/*|evidence/mstr-000b/B027-ladder-pilot.md|tests/contract/test_b027_ladder_pilot.py) ;;
              *) echo "OUT_OF_SCOPE=$path" >&2; exit 1 ;;
            esac
          done < /tmp/changed.txt
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/000b-b027-ladder-pilot | cut -f1)" = "$EXPECTED_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$EXPECTED_MAIN" --arg head "$EXPECTED_HEAD" --argjson commits "$EXPECTED_COMMITS" --argjson files "$EXPECTED_FILES" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and .commits == $commits and .changed_files == $files' /tmp/pr.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILDER_RUN}" > /tmp/builder.json
          jq -e '.status == "completed" and .conclusion == "success" and (.name | contains("B027 research ladder pilot"))' /tmp/builder.json
          test ! -e artifacts/authorities/B027.json

  semantic_campaign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate immutable campaign records and early discard
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from mstr_qualify.schemas import validate_instance

          root = Path.cwd()
          result_root = root / 'artifacts' / 'results' / 'research' / 'B027'
          ledger = json.loads((result_root / 'campaign-ledger.json').read_text(encoding='utf-8'))
          assert ledger['campaign_id'] == 'b027-offline-ladder-pilot-v0'
          assert ledger['campaign_result'] == 'QUALIFIED_PROMOTION_AND_EARLY_DISCARD'
          assert ledger['canonical_entry_main'] == '312d40eee8400a0dab94633f891b206f66a82855'
          assert ledger['external_effect_authority_required'] is False
          assert not any(ledger['governed_effects'].values())
          assert ledger['paid_cost_usd'] == 0
          assert ledger['model_execution_count'] == 0
          assert ledger['network_model_or_teacher_call_count'] == 0
          sequence = ledger['sequence']
          assert [row['level'] for row in sequence] == ['L0_CONTRACT_SMOKE', 'L1_CODE_PROXY']
          assert [row['decision'] for row in sequence] == ['PROMOTE', 'STOP']
          assert sequence[1]['early_discard_gate'] == 'code_proxy_thresholds'
          assert ledger['levels_not_executed'] == ['L2_EXECUTABLE_REPO', 'L3_DIRECTION_TO_DONE', 'L4_Q4_UNIVERSAL_LAPTOP']
          records = []
          for row in sequence:
              path = result_root / 'registry' / f"{row['experiment_id']}.json"
              raw = path.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == row['record_sha256']
              record = json.loads(raw)
              validate_instance('mstr-research-experiment-v2', record, repository_root=root)
              assert record['governed_effects'] == ledger['governed_effects']
              assert record['external_effect_authority'] is None
              assert record['aggregate_resource_cost']['paid_cost_usd'] == 0
              result = record['material_results'][0]
              assert result['model_execution_count_or_na'] == 0
              assert result['network_model_or_teacher_call_count_or_na'] == 0
              assert result['resource_cost']['network_bytes_or_na'] == 0
              records.append(record)
          l0, l1 = records
          assert l0['promotion_decision'] == 'PROMOTE'
          assert l1['promotion_decision'] == 'STOP'
          assert l1['promoted_result_id_or_na'] == 'N/A'
          assert l1['parent_identity'] == l0['promoted_result_id_or_na']
          assert l1['predecessor_promotion']['experiment_id'] == l0['experiment_id']
          assert l1['predecessor_promotion']['experiment_record_sha256'] == sequence[0]['record_sha256']
          gate = next(row for row in l1['hard_gate_results'] if row['gate_id'] == 'code_proxy_thresholds')
          assert gate['status'] == 'FAIL'
          assert l0['frozen_evaluation_identity'] == l1['frozen_evaluation_identity'] == ledger['frozen_evaluation_identity']
          PY
          test ! -e artifacts/results/research/B027/registry/b027-l2.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  canonical_entry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Re-prove canonical entry remains eligible and bounded
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B027 > /tmp/b027.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0 and ([.prerequisite_results[] | select(.task_id == "B026" and .observed_state == "COMPLETE_CANONICAL" and .satisfied == true)] | length == 1)' /tmp/b027.json
          set +e
          mstr-qualify task eligible B011 > /tmp/b011.json; rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run exact-head B027 quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_b027_ladder_pilot.py tests/contract/test_research_ladder_contract.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/000b-b027-ladder-pilot | cut -f1)" = "$EXPECTED_HEAD"

  complete:
    needs: [identity_scope, semantic_campaign, canonical_entry, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Final immutable exact-head recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/000b-b027-ladder-pilot | cut -f1)" = "$EXPECTED_HEAD"
          echo "B027_QUALIFIED_HEAD=$EXPECTED_HEAD"
          echo "B027_QUALIFIED_TREE=$EXPECTED_TREE"
          echo 'MODEL_EXECUTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
