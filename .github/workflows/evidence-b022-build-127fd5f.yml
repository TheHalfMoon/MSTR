name: Build B022 verifier-health contract atomically

on:
  push:
    branches:
      - evidence/b022-build-127fd5f

permissions:
  contents: write

env:
  EXPECTED_MAIN: 127fd5fd1a5a6f1843f207a0272664ae8cb129f4
  TARGET_BRANCH: feat/000b-b022-verifier-health-contract

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b022-build-127fd5f
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve builder and prove immutable clean target
        shell: bash
        run: |
          set -euo pipefail
          cp tools/evidence/build_b022_contract.py /tmp/build_b022_contract.py
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
      - name: Materialize exact B022 contract candidate
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/build_b022_contract.py
          ruff format tests/contract/test_verifier_health_contract.py
          git diff --check
          mapfile -t actual < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          expected=(
            evidence/mstr-000b/B022-verifier-health.md
            schemas/mstr-verifier-health-v0.schema.json
            specs/002-code-model-supremacy-foundation/contracts/mstr-verifier-health-v0.schema.json
            src/mstr_qualify/cli.py
            src/mstr_qualify/schemas.py
            tests/contract/test_schemas.py
            tests/contract/test_verifier_health_contract.py
            tests/fixtures/schemas/invalid/mstr-verifier-health-v0.json
            tests/fixtures/schemas/valid/mstr-verifier-health-v0.json
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 9
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          test -z "$(git diff --name-only -- configs/task-gate/mstr-000b.json specs/002-code-model-supremacy-foundation/tasks.md AGENTS.md .specify/memory/constitution.md)"
      - name: Run B022 and canonical quality gates before push
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_verifier_health_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
      - name: Commit and fast-forward exact target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add \
            evidence/mstr-000b/B022-verifier-health.md \
            schemas/mstr-verifier-health-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-verifier-health-v0.schema.json \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/schemas.py \
            tests/contract/test_schemas.py \
            tests/contract/test_verifier_health_contract.py \
            tests/fixtures/schemas/invalid/mstr-verifier-health-v0.json \
            tests/fixtures/schemas/valid/mstr-verifier-health-v0.json
          git commit -m "feat(mstr-000b): freeze B022 verifier health contract"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "B022_BUILD_HEAD=$(git rev-parse HEAD)"
          echo "B022_BUILD_TREE=$(git rev-parse HEAD^{tree})"
          echo "B022_BUILD_FILES=9"
          echo "MODEL_EXECUTION=NONE"
          echo "WEIGHT_CHANGING_TRAINING=NONE"
