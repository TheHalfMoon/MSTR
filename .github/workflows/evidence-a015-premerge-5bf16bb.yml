name: Mandatory premerge A015 verification

on:
  push:
    branches:
      - evidence/a015-premerge-5bf16bb

permissions:
  contents: read
  pull-requests: read

env:
  BASE_SHA: 28a4a972182c0f58f7c6500239f625a0e2143d0a
  TARGET_SHA: 5bf16bba43711c40c62bd3a838ee4f138c01fc06
  TARGET_TREE: 4cbcce5f00cd9b7b669ba05d1880d4b02eb52c18
  PR_NUMBER: "116"
  REVIEW_ID: "5070218869"
  QUALIFICATION_RUN: "33428990007"
  FAILED_RUN: "33428444420"

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact PR admission and A015 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/feat/000a-a015-direction-to-done | cut -f1)" = "$TARGET_SHA"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"$pr")" = "open"
          test "$(jq -r .draft <<<"$pr")" = "false"
          test "$(jq -r .head.sha <<<"$pr")" = "$TARGET_SHA"
          test "$(jq -r .base.sha <<<"$pr")" = "$BASE_SHA"
          review="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}")"
          test "$(jq -r .commit_id <<<"$review")" = "$TARGET_SHA"
          test "$(jq -r .state <<<"$review")" = "COMMENTED"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN}" --jq .conclusion)" = "failure"
          threads="$(gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner="${GITHUB_REPOSITORY_OWNER}" -f repo="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          test "$threads" = "0"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort)
          test "${#files[@]}" -eq 11
          grep -F -- '- [ ] **A015 Freeze `DirectionTaskManifest` and MSTR Direction-to-Done v0 task taxonomy.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A016 Implement DVCR/TTVC + diagnostic metric computation.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '33428444420 = FAILURE / quality' evidence/mstr-000a/A015-direction-to-done.md
          git diff --check "$BASE_SHA" "$TARGET_SHA"

  quality:
    needs: admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run mandatory A015 premerge quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_direction_task_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: [admission, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Final immutable A015 premerge recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/feat/000a-a015-direction-to-done | cut -f1)" = "$TARGET_SHA"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"$pr")" = "open"
          test "$(jq -r .head.sha <<<"$pr")" = "$TARGET_SHA"
          test "$(jq -r .base.sha <<<"$pr")" = "$BASE_SHA"
