name: Build clean B023 cross-workstream repair

on:
  push:
    branches:
      - evidence/b023-cross-workstream-repair-clean-builder

permissions:
  contents: write

env:
  EXPECTED_BASE: db12d1467bb81185a9affffb4d470626ceceddfa
  V7_SOURCE_COMMIT: e21713924b4b1909a09f12a944707b5567a0c78c
  BRANCH: evidence/b023-cross-workstream-repair-clean-builder

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact base and replay source identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git cat-file -e "$V7_SOURCE_COMMIT^{commit}"
          test "$(git show -s --format=%H "$V7_SOURCE_COMMIT")" = "$V7_SOURCE_COMMIT"
      - name: Replay proven v7 generator and repair exact Ruff defects
        shell: bash
        run: |
          set -euo pipefail
          git show "$V7_SOURCE_COMMIT:.github/workflows/build-cross-workstream-binding-repair-v7.yml" > /tmp/v7.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/v7.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, '<v7-generator-replay>', 'exec'), {'__name__': '__main__'})

          tests = Path('tests/contract/test_task_gate.py')
          text = tests.read_text(encoding='utf-8')
          old = '        "tasks": {"B001": {"canonical_state": "PENDING", "prerequisites": ["A006"], "evidence_outputs": []}},\n'
          new = '''        "tasks": {\n            "B001": {\n                "canonical_state": "PENDING",\n                "prerequisites": ["A006"],\n                "evidence_outputs": [],\n            }\n        },\n'''
          if text.count(old) != 2:
              raise SystemExit(f'expected two Ruff anchors, found {text.count(old)}')
          tests.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/b023-cross-workstream-clean-builder.yml').unlink()
          PY
      - name: Run complete frozen gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git diff --check "$EXPECTED_BASE"
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy
      - name: Commit prospective candidate and prove exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'fix(task-gate): bind cross-workstream prerequisites'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --name-only "$EXPECTED_BASE"..HEAD | tee /tmp/final-files
          test "$(wc -l < /tmp/final-files)" -eq 4
          grep -Fx 'configs/task-gate/mstr-000b.json' /tmp/final-files
          grep -Fx 'evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md' /tmp/final-files
          grep -Fx 'src/mstr_qualify/task_gate.py' /tmp/final-files
          grep -Fx 'tests/contract/test_task_gate.py' /tmp/final-files
          ! grep -q '^.github/workflows/' /tmp/final-files
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Prove prospective drift and B023 eligibility
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=$(git rev-parse HEAD)
          git update-ref refs/heads/main "$CANDIDATE"
          git update-ref refs/remotes/origin/main "$CANDIDATE"
          python -m mstr_qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json
          cat /tmp/drift.json
          mstr-qualify task eligible B023 > /tmp/b023.json
          jq -e '.task_id == "B023" and .eligible == true and (.reasons | length) == 0' /tmp/b023.json
          jq -e '.semantic_checks.prerequisite_set_complete == true and .semantic_checks.prerequisite_states_satisfied == true' /tmp/b023.json
          jq -e '[.prerequisite_results[] | select(.task_id == "A006" or .task_id == "A014") | .satisfied] == [true, true]' /tmp/b023.json
          cat /tmp/b023.json
      - name: Push candidate after immutable live-main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          git push origin HEAD:"$BRANCH"
          echo "FINAL_BUILDER_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_BUILDER_TREE=$(git rev-parse HEAD^{tree})"
