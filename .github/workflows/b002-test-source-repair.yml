name: Repair B002 contract test source

on:
  push:
    branches:
      - evidence/b002-test-source-repair

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: 3800457d6073a82a81271de55437ec65abc5fad9
      EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
      TARGET_BRANCH: feat/000b-b002-task-gate
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout guarded B002 branch
        uses: actions/checkout@v4
        with:
          ref: feat/000b-b002-task-gate
          fetch-depth: 0

      - name: Verify exact target and main identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"

      - name: Repair malformed contract-test source
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          path = Path("tests/contract/test_task_gate.py")
          text = path.read_text(encoding="utf-8")

          start_marker = "\\\n    def test_real_evaluation_requires_verified_main_refs(tmp_path: Path) -> None:\n"
          end_marker = "\ndef test_undeclared_not_required_state_cannot_satisfy_predecessor"
          if text.count(start_marker) != 1:
              raise SystemExit(f"trust-test block start mismatch: {text.count(start_marker)}")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start + 2:end]
          fixed_block = dedent(block).rstrip() + "\n\n"
          text = text[:start] + fixed_block + text[end + 1:]

          bad_assert = '        assert result["authority_result"]["satisfied"] is False\\\n'
          good_assert = '        assert result["authority_result"]["satisfied"] is False\n'
          if text.count(bad_assert) != 1:
              raise SystemExit(f"authority assertion backslash mismatch: {text.count(bad_assert)}")
          text = text.replace(bad_assert, good_assert, 1)

          path.write_text(text.rstrip() + "\n", encoding="utf-8")

      - name: Verify exact source repair before tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "tests/contract/test_task_gate.py"
          python -m py_compile tests/contract/test_task_gate.py
          ! grep -n '^\\$' tests/contract/test_task_gate.py
          ! grep -n 'is False\\$' tests/contract/test_task_gate.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Run targeted B002 tests
        run: pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Guarded commit and fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contract/test_task_gate.py
          test -z "$(git diff --name-only)"
          git commit -m "test(mstr-000b): repair canonical-main regression source"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "NEW_B002_HEAD=$(git rev-parse HEAD)"
