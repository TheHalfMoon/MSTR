name: Independent review PR156 B011 readiness

on:
  push:
    branches:
      - evidence/pr156-b011-readiness-independent-review

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  BASE_SHA: 7884af6b159534671ad4259addfcb319d7084d36
  TARGET_SHA: f5b421cc81cb3add30be3c459cc3519d921ab39e
  PR_NUMBER: '156'
  QUALIFICATION_RUN: '33863065554'
  CHECKLIST: specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md

jobs:
  independent_review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify successful independent qualification dependency
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" > /tmp/qual.json
          jq -e --arg branch 'evidence/pr156-b011-readiness-qualification' '.status == "completed" and .conclusion == "success" and .head_branch == $branch' /tmp/qual.json >/dev/null
          echo 'PR156_REVIEW_QUALIFICATION_DEPENDENCY=PASS'
      - name: Verify exact immutable PR topology and diff containment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse ${TARGET_SHA}^)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$TARGET_SHA" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and .commits == 1 and .changed_files == 1' /tmp/pr.json >/dev/null
          test "$(git diff --name-only "$BASE_SHA" "$TARGET_SHA")" = "$CHECKLIST"
          echo 'PR156_REVIEW_TOPOLOGY_SCOPE=PASS'
      - name: Independently verify every B011 readiness claim against canonical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/153/comments" > /tmp/issue153-comments.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          checklist = Path('specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md').read_text(encoding='utf-8')
          section = checklist.split('## Before B011\n', 1)[1].split('\n## Before Any Weight-Changing Training', 1)[0]
          assert section.count('- [x]') == 4 and '- [ ]' not in section

          manifest_path = Path('artifacts/manifests/B010-new-candidate-weight-access.json')
          authority_path = Path('artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          comments = json.loads(Path('/tmp/issue153-comments.json').read_text(encoding='utf-8'))

          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert manifest_sha == '4c2fd1469cdcf728063ab8f5b6a603191ffdc9e1a4d4c2d794abd2a24950c3ef'
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['b010_manifest']['sha256'] == manifest_sha
          assert authority['scope']['decision'] == 'FOUNDER_B011_MODEL_WEIGHT_ACCESS_DECISION=AUTHORIZE_EXACT_B010_ENVELOPE'
          assert any(c['id'] == 5538049681 and 'FOUNDER_B011_MODEL_WEIGHT_ACCESS_DECISION=AUTHORIZE_EXACT_B010_ENVELOPE' in c['body'] for c in comments)

          expected_ids = ['mellum-4b', 'qwen3.5-0.8b-control']
          assert manifest['decision']['new_weight_access_required_candidates'] == expected_ids
          access = manifest['candidate_access_envelopes']
          assert [c['candidate_id'] for c in access] == expected_ids
          assert all(c['new_weight_access_required'] is True for c in access)
          assert sum(c['expected_required_download_bytes'] for c in access) == 9817996174
          assert manifest['authority_boundary']['founder_machine_large_artifacts'] == 0
          assert manifest['authority_boundary']['model_weight_access'] is False
          assert all(c['usd_ceiling'] == 0.0 and c['expected_usd'] == 0.0 for c in access)
          allowed = {'huggingface.co','cdn-lfs.huggingface.co','cas-bridge.xethub.hf.co','transfer.xethub.hf.co','us.aws.cdn.hf.co'}
          for candidate in access:
              assert set(candidate['network_hosts']) == allowed
              assert 'ABORT_ON_AUTH_GATING_PAYMENT_OR_UNLISTED_REDIRECT' in candidate['network_policy']
              assert candidate['executor'] == 'B011_APPROVED_EPHEMERAL_CLOUD_RUNNER_AFTER_EXACT_FOUNDER_AUTHORIZATION'
              assert candidate['storage'] == 'EXTERNAL_EPHEMERAL_OR_APPROVED_EXTERNAL_ACQUISITION_DIR; NEVER_GIT; NEVER_FOUNDER_MACHINE'
              assert 'DELETE_PARTIAL_OR_FAILED_DOWNLOADS_IMMEDIATELY' in candidate['cleanup']
              assert 'REMOVE_EPHEMERAL_RUNNER_STORAGE_AT_JOB_END' in candidate['cleanup']
              assert candidate['retention'] == 'RETAIN_VERIFIED_ARTIFACTS_ONLY_UNTIL_B012_QUALIFICATION_AND_DOWNSTREAM_ADMISSION_CLOSEOUT_REQUIRES_OTHERWISE'

          scope = authority['scope']
          for key in ['paid_compute','paid_model_api','gated_terms_acceptance','quantization_execution','weight_changing_training','large_dataset_ingestion','production_release','git_model_binaries']:
              assert scope[key] is False
          assert scope['founder_machine_large_artifacts'] == 0

          training = checklist.split('## Before Any Weight-Changing Training\n', 1)[1].split('\n## Blocking Conditions', 1)[0]
          assert training.count('- [ ]') == 12
          print('PR156_REVIEW_EVIDENCE_SEMANTICS=PASS')
          PY
      - name: Prove downstream authority remains closed at canonical main
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$BASE_SHA"
          git update-ref refs/remotes/origin/main "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          mstr-qualify task eligible B011 > /tmp/b011.json
          jq -e '.eligible == true and .authority_result.satisfied == true and .state_consistency_result.observed_state == "PENDING"' /tmp/b011.json >/dev/null
          if mstr-qualify task eligible B012 > /tmp/b012.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B011")) != null' /tmp/b012.json >/dev/null
          if mstr-qualify task eligible B013 > /tmp/b013.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B012")) != null' /tmp/b013.json >/dev/null
          git checkout --detach "$TARGET_SHA"
          echo 'PR156_REVIEW_DOWNSTREAM_CLOSED=PASS'
      - name: Fresh semantic-review quality rerun
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          echo 'PR156_REVIEW_QUALITY=PASS'
      - name: Final independent review no-drift recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$TARGET_SHA")" = "$CHECKLIST"
          echo 'PR156_INDEPENDENT_SEMANTIC_REVIEW=PASS'
