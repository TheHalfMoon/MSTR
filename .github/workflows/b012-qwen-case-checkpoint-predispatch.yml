name: B012 Qwen case-checkpoint predispatch gate

on:
  push:
    branches:
      - evidence/b012-qwen-case-checkpoint-predispatch-145be15

permissions:
  contents: read
  issues: read

env:
  REPO: TheHalfMoon/MSTR
  EXPECTED_MAIN: 145be15a32448d00fada0e2d9bf736f265c942a1
  POSTMERGE_RUN: '34264924353'
  POSTMERGE_HEAD: 2ade02e89bb4104aaa97218578d4a352e0e690d0
  COMMAND: B012_RECOVER_RAW_CODE_CASE_CHECKPOINT qwen3.5-0.8b-control 34155931982
  GH_TOKEN: ${{ github.token }}

jobs:
  predispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove immutable main and successful postmerge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          gh api "repos/$REPO/actions/runs/$POSTMERGE_RUN" > /tmp/postmerge.json
          jq -e --arg head "$POSTMERGE_HEAD" '.status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha==$head' /tmp/postmerge.json >/dev/null
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Prove fresh B012 eligibility and exact Founder authority
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['EXPECTED_MAIN']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['task_id']=='B012'
          assert a['cost_resource_ceiling']['limits'][0]['max']==0.0
          assert a['scope']['candidate_ids']==['mellum-4b','qwen3.5-0.8b-control']
          assert a['scope']['training'] is False
          assert a['scope']['paid_compute'] is False
          assert a['scope']['paid_model_api'] is False
          PY

      - name: Prove exact activated recovery identity and bounded effects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          active=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          spec=Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          script=Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          mp=Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          bp=Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          m=json.loads(mp.read_text(encoding='utf-8')); b=json.loads(bp.read_text(encoding='utf-8'))
          assert active.read_bytes()==spec.read_bytes()
          assert sha(active)==m['case_checkpoint_workflow_sha256']
          assert sha(script)==m['case_checkpoint_script_sha256']
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          bound=b['qwen_raw_code_case_checkpoint_activation']
          assert bound['active_workflow_sha256']==sha(active)
          assert bound['case_checkpoint_script_sha256']==sha(script)
          assert bound['model_access']=='NONE' and bound['model_execution']=='NONE'
          assert bound['paid_cost_usd']==0.0
          for key in ('retry_authority_created','external_dispatch_authority_created','candidate_expansion','revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert bound[key] is False, key
          text=active.read_text(encoding='utf-8')
          assert f"github.event.comment.body == '{os.environ['COMMAND']}'" in text
          assert "github.event.issue.number == 162" in text
          assert "github.event.comment.user.login == 'TheHalfMoon'" in text
          assert "github.event.comment.author_association == 'OWNER'" in text
          PY

      - name: Prove exact dispatch command has not already been consumed
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh api --paginate "repos/$REPO/issues/162/comments?per_page=100" --jq ".[] | select(.body == \"$COMMAND\") | .id" | wc -l | tr -d ' ')"
          test "$count" -eq 0
          echo 'B012_QWEN_CASE_CHECKPOINT_COMMAND_PRIOR_COUNT=0'

      - name: Focused predispatch quality
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate

      - name: Final single-shot dispatch readiness guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          count="$(gh api --paginate "repos/$REPO/issues/162/comments?per_page=100" --jq ".[] | select(.body == \"$COMMAND\") | .id" | wc -l | tr -d ' ')"
          test "$count" -eq 0
          echo 'B012_QWEN_CASE_CHECKPOINT_PREDISPATCH=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'PAID_COST_USD=0.0'
