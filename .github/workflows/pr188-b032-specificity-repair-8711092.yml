name: PR188 B032/B033 specificity repair

on:
  push:
    branches:
      - evidence/pr188-b032-specificity-repair-8711092

permissions:
  contents: write

env:
  MAIN_SHA: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
  TARGET_BRANCH: plan/mstr-source-adoption-capability-mining-v2-5e74e77
  OLD_SUBJECT_SHA: 8711092d9c9f007f62d976774ff6b00ba32a0bbc

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repair evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Checkout exact PR target head
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$OLD_SUBJECT_SHA"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Restore explicit downstream obligations additively
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('specs/002-code-model-supremacy-foundation/tasks.md')
          text = path.read_text(encoding='utf-8')

          b032 = '''- [ ] **B032 Amend MSTR-001/MSTR-002/MSTR-003 entry requirements and downstream acceleration obligations.**
          Prerequisite: B031 `COMPLETE_CANONICAL`. Consume `docs/canonical/MSTR_FRONTIER_ACCELERATION_STRATEGY.md`, `docs/canonical/MSTR_SOURCE_ADOPTION_AND_CAPABILITY_MINING_STRATEGY.md`, the canonical B013 frontier snapshot, and the source-adoption research snapshot. MSTR-001 consumes Data Constitution, language mix, software evolution, frontier curriculum, checkpoint-lineage substrate experiments where applicable, early low-bit compatibility evidence, and mandatory Q4 promotion. MSTR-002 consumes self-alignment, teacher policy, verifier health, test generation, greenfield/feature and production-compatible same-loop trajectories including failure/negative examples. MSTR-003 consumes frontier curriculum, admitted environments, verifier health, multi-fidelity RL promotion, dynamic synthetic environment generation, previous-MSTR bootstrap with independent admission, targeted trajectory-feedback research, and reward-shortcut controls. The downstream roadmap amendment MUST also carry the non-executing consequences for MSTR-004 (Q4 anchor plus Q3/Q2/structured-ternary, kernel, speculation/parallel-generation, and FAST/NORMAL/DEEP effort-control tournament) and MSTR-006 (sealed anti-leakage headline qualification). In addition, freeze the downstream source-adoption interfaces `SourceAdoptionRecord`, `ExecutionBackendProfile`, `ResumableTaskCheckpoint`, `ImprovementDecisionRecord`, `RepositoryContextIndexProfile`, and `TrainingBackendParityRecord`; require `MINIMAL_BASH_LINEAR_BASELINE` as the anti-complexity control; require baseline-first runtime acceleration; require immutable upstream revision/update/rollback governance; carry behavioral-reconstruction evaluation into the appropriate downstream evaluation plan; and keep source-code permission distinct from data admission, model-weight authority, training authority, and external-effect authority. B032 itself authorizes none of those external effects.
          Outputs: roadmap/training strategy/preplan amendments, `evidence/mstr-000b/B032-downstream-contracts.md`.
          '''

          b033 = '''- [ ] **B033 Independent consistency/red-team review.**  
          Prerequisite: B032 `COMPLETE_CANONICAL`. Review frontier freshness/candidate omission, candidate fairness, data leakage, future-Git-history/public-solution/network leakage, rights, reward hacking/evaluator extraction, task-gate bypass, teacher contamination, tokenizer comparability, mandatory Q4 promotion, low-bit quality claims, hardware-specific speed/runtime claims, speculative/parallel-generation attribution, WePLD attribution, and 8GB product preservation. Confirm that no experimental sub-Q4 artifact can replace the required Q4 promotion anchor and that vendor benchmark/speed claims are not represented as MSTR evidence without exact reproduction. Additionally red-team source-adoption provenance, license/NOTICE retention, transitive dependencies/assets, source-code-permission conflation with data/model/training authority, mutable-upstream dependencies, dependency bloat, stale repository-context indexes, checkpoint secret leakage, optimizer/evaluator separation, execution-backend isolation/fallback semantics, training-backend semantic divergence, donor benchmark/speed claim laundering, and rollback failure. Confirm completed B014-B030 history was not reopened and B031 prerequisites were not weakened. Resolve all material findings.
          Outputs: `evidence/mstr-000b/B033-independent-review.md`.
          '''

          text, n1 = re.subn(
              r'- \[ \] \*\*B032 .*?(?=\n- \[ \] \*\*B033 )',
              b032.rstrip(),
              text,
              count=1,
              flags=re.S,
          )
          text, n2 = re.subn(
              r'- \[ \] \*\*B033 .*?(?=\n- \[ \] \*\*B034 )',
              b033.rstrip(),
              text,
              count=1,
              flags=re.S,
          )
          assert (n1, n2) == (1, 1), (n1, n2)
          path.write_text(text if text.endswith('\n') else text + '\n', encoding='utf-8')

          test_path = Path('tests/contract/test_source_adoption_plan.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_original_downstream_obligations_remain_explicit()'
          assert marker not in tests
          tests += '''\n\ndef test_original_downstream_obligations_remain_explicit() -> None:\n    tasks = TASKS.read_text(encoding="utf-8")\n    for required in (\n        "Data Constitution, language mix, software evolution",\n        "self-alignment, teacher policy, verifier health",\n        "multi-fidelity RL promotion",\n        "dynamic synthetic environment generation",\n        "previous-MSTR bootstrap with independent admission",\n        "Q4 anchor plus Q3/Q2/structured-ternary",\n        "FAST/NORMAL/DEEP effort-control tournament",\n        "sealed anti-leakage headline qualification",\n        "future-Git-history/public-solution/network leakage",\n        "no experimental sub-Q4 artifact can replace",\n    ):\n        assert required in tasks\n''' 
          test_path.write_text(tests, encoding='utf-8')
          PY

          mapfile -t changed < <(git diff --name-only "$OLD_SUBJECT_SHA")
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'specs/002-code-model-supremacy-foundation/tasks.md' >/dev/null
          printf '%s\n' "${changed[@]}" | grep -Fx 'tests/contract/test_source_adoption_plan.py' >/dev/null

      - name: Qualify repaired subject
        run: |
          set -euo pipefail
          python -m pytest -q tests/contract/test_source_adoption_plan.py tests/contract/test_task_gate.py tests/contract/test_convergence_external_bindings.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check tests/contract/test_source_adoption_plan.py
          python -m mypy src/mstr_qualify

      - name: Guard and publish repaired PR head
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$OLD_SUBJECT_SHA"
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_source_adoption_plan.py
          git commit -m "docs(plan): preserve explicit downstream obligations"
          test "$(git rev-parse HEAD^)" = "$OLD_SUBJECT_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
