name: Mandatory pre-merge verification for B017

on:
  push:

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN: f7a386214a1346b75dd3311390aa1e19bf354bb1
  EXPECTED_HEAD: 6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3
  TARGET_BRANCH: feat/mstr-000b-b017-evolution-fixture-pilot
  PR_NUMBER: "73"
  GH_TOKEN: ${{ github.token }}

jobs:
  premerge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Bind PR identity, canonical main, and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          test "$(jq -r .state <<<"$pr")" = "open"
          test "$(jq -r .draft <<<"$pr")" = "false"
          test "$(jq -r .base.ref <<<"$pr")" = "main"
          test "$(jq -r .base.sha <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r .head.ref <<<"$pr")" = "$TARGET_BRANCH"
          test "$(jq -r .head.sha <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r .changed_files <<<"$pr")" = "6"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          expected=$(printf '%s\n' evidence/mstr-000b/B017-evolution-fixture-pilot.md src/mstr_qualify/software_evolution.py tests/fixtures/software_evolution/b017-localization.json tests/fixtures/software_evolution/b017-edit.json tests/fixtures/software_evolution/b017-review-repair.json tests/unit/test_software_evolution_projection.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
      - name: Re-prove canonical task gate and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/main-check "$EXPECTED_MAIN"
          (cd /tmp/main-check && python -m mstr_qualify task eligible B017 > /tmp/b017.json)
          if (cd /tmp/main-check && python -m mstr_qualify task eligible B011 > /tmp/b011.json); then exit 1; fi
          (cd /tmp/main-check && python -m mstr_qualify task drift > /tmp/drift.json)
          python - <<'PY'
          import json
          b17=json.load(open('/tmp/b017.json')); b11=json.load(open('/tmp/b011.json')); drift=json.load(open('/tmp/drift.json'))
          assert b17['eligible'] is True and b17['state_consistency_result']['observed_state']=='PENDING'
          assert b17['authority_result']['required'] is False
          assert b11['eligible'] is False and b11['state_consistency_result']['observed_state']=='BLOCKED'
          assert b11['authority_result']['required'] is True and b11['authority_result']['satisfied'] is False
          assert drift['status']=='clean' and drift['findings']==[]
          PY
      - name: Focused B017 tests
        run: pytest -q tests/unit/test_software_evolution_projection.py tests/contract/test_software_evolution_contract.py
      - name: Frozen schema selfcheck
        run: python -m mstr_qualify validate
      - name: Frozen full test suite
        run: pytest -q
      - name: Frozen lint
        run: ruff check src tests
      - name: Frozen strict typecheck
        run: mypy
      - name: Final PR and remote immutability recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          test "$(jq -r .state <<<"$pr")" = "open"
          test "$(jq -r .draft <<<"$pr")" = "false"
          test "$(jq -r .base.sha <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r .head.sha <<<"$pr")" = "$EXPECTED_HEAD"
          echo 'B017_MANDATORY_PREMERGE=PASS'
          echo 'B011_REMAINS_BLOCKED=PASS'
