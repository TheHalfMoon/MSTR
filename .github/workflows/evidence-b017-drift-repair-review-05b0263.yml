name: Adversarial review B017 drift repair

on:
  push:
    branches:
      - evidence/b017-drift-repair-review-05b0263

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 4919891be2e10c84a4c57a420ee2884d72da4e93
      EXPECTED_HEAD: 05b0263c65fa99abc6268e56166d90bc8686ad24
      PR_BRANCH: docs/000b-b017-entry-gate-drift-repair
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/000b-b017-entry-gate-drift-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Review exact diff and authority containment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$PR_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          expected=$(printf '%s\n' evidence/mstr-000b/B017-evolution-fixture-pilot.md tests/unit/test_software_evolution_projection.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN"..."$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          test -z "$(git diff --name-only "$EXPECTED_MAIN"..."$EXPECTED_HEAD" -- specs/002-code-model-supremacy-foundation/tasks.md artifacts/tasks artifacts/authority artifacts/manifests/B010-new-candidate-weight-access.json src/mstr_qualify/task_gate.py src/mstr_qualify/task_drift.py)"
          git diff --check "$EXPECTED_MAIN"..."$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          text=Path('evidence/mstr-000b/B017-evolution-fixture-pilot.md').read_text(encoding='utf-8')
          required=(
              'ENTRY_GATE_TASK = B017',
              'ENTRY_GATE_CANONICAL_MAIN = f7a386214a1346b75dd3311390aa1e19bf354bb1',
              'ENTRY_GATE_RUN = 33174634290',
              'ENTRY_GATE_JOB = 98859944051',
              'ENTRY_GATE_ELIGIBLE = true',
              'ENTRY_GATE_DRIFT = clean',
              'MODEL_WEIGHT_ACCESS = NONE',
              'MODEL_EXECUTION = NONE',
              'LARGE_DATASET_INGESTION = NONE',
              'WEIGHT_CHANGING_TRAINING = NONE',
          )
          for value in required:
              assert value in text, value
          assert text.count('ENTRY_GATE_TASK = B017') == 1
          PY
      - run: python -m pip install -e '.[dev]'
      - name: Independent semantic checks
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/unit/test_software_evolution_projection.py
          python -m mstr_qualify validate
          git branch -f main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"
          git checkout main
          python -m mstr_qualify task drift > /tmp/drift.json
          python -m mstr_qualify task eligible B018 > /tmp/b018.json
          set +e
          python -m mstr_qualify task eligible B011 > /tmp/b011.json
          b011_rc=$?
          set -e
          test "$b011_rc" -ne 0
          python - <<'PY'
          import json
          drift=json.load(open('/tmp/drift.json'))
          b18=json.load(open('/tmp/b018.json'))
          b11=json.load(open('/tmp/b011.json'))
          assert drift == {'canonical_main':'05b0263c65fa99abc6268e56166d90bc8686ad24','findings':[],'status':'clean','tasks_checked':34}
          assert b18['eligible'] is True and b18['reasons']==[]
          assert b18['authority_result']['required'] is False
          assert b11['eligible'] is False
          assert 'authority.canonical_envelope_missing_or_invalid' in b11['reasons']
          assert 'task.blocked' in b11['reasons']
          PY
      - name: Final remote immutability recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$PR_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
