name: PR185 B012 Qwen recovery activation qualification

on:
  push:
    branches:
      - evidence/pr185-b012-qwen-recovery-activation-qualification-180b928

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  PR_NUMBER: "185"
  BASE_SHA: 31549eeb78f2b3346c0915519cf5f4899ab47773
  SUBJECT_BRANCH: fix/b012-qwen-raw-code-recovery-activation
  SUBJECT_SHA: 180b928e56261dbc3e1bd06597e7c81fa32694ee
  SUBJECT_TREE: 046156f3ff372f541b4a16618c212490027e57c4
  PR184_POSTMERGE_RUN: "34161170022"
  PR184_POSTMERGE_HEAD: 3bdab353ee6aa7dd60510208b1e0f02545d3ebea
  ACTIVATED_MANIFEST_SHA256: 6b9536e16c52fefe03ee2844c68008f68e36cdd91ae45987086e1acda0259d70
  ACTIVE_WORKFLOW_SHA256: 7643ef2b87c32901e5cbdf384001a341cfd061f4a33437a4fb7556dadc6c33a0

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout qualification evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify exact base head tree ancestry and scope
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "$SUBJECT_SHA^")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          [[ "$(git rev-parse HEAD^)" == "$SUBJECT_SHA" ]]
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            ".github/workflows/b012-qwen-raw-code-recovery.yml"
            "artifacts/manifests/B012-executor-toolchain-binding.json"
            "artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json"
            "evidence/B012-qwen-raw-code-recovery-activation.md"
            "tests/contract/test_b012_qwen_raw_code_recovery.py"
          )
          [[ "${#changed[@]}" -eq 5 ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done

      - name: Verify exact-main B012 eligibility and PR184 provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligible.json
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          gate = json.loads(Path('/tmp/b012-eligible.json').read_text(encoding='utf-8'))
          assert gate['canonical_main'] == os.environ['BASE_SHA']
          assert gate['eligible'] is True
          assert gate['authority_result']['required'] is True
          assert gate['authority_result']['satisfied'] is True
          assert gate['state_consistency_result']['observed_state'] == 'PENDING'
          assert gate['supersession_result']['superseded'] is False
          assert all(item['satisfied'] for item in gate['prerequisite_results'])

          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-pr185-qualification',
          }
          request = urllib.request.Request(
              'https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/' + os.environ['PR184_POSTMERGE_RUN'],
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['PR184_POSTMERGE_HEAD']
          print('B012_EXACT_MAIN_ELIGIBLE=true')
          print('PR184_POSTMERGE_PROVENANCE=PASS')
          PY
          git checkout --detach "$SUBJECT_SHA"

      - name: Verify activated identities authority and external-effect boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          manifest_path = 'artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json'
          binding_path = 'artifacts/manifests/B012-executor-toolchain-binding.json'
          incident_path = 'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-run-34155931982.json'
          runner_path = 'colab/mstr_b012_qwen_raw_code_recovery.py'
          spec_path = 'configs/workflows/b012-qwen-raw-code-recovery.yml'
          active_path = '.github/workflows/b012-qwen-raw-code-recovery.yml'

          manifest = json.loads(Path(manifest_path).read_text(encoding='utf-8'))
          binding = json.loads(Path(binding_path).read_text(encoding='utf-8'))
          authority = json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert manifest['status'] == 'ACTIVATED_CANONICAL'
          assert sha(manifest_path) == os.environ['ACTIVATED_MANIFEST_SHA256']
          assert sha(active_path) == os.environ['ACTIVE_WORKFLOW_SHA256']
          assert Path(active_path).read_bytes() == Path(spec_path).read_bytes()
          assert manifest['recovery_script_sha256'] == sha(runner_path)
          assert manifest['recovery_workflow_sha256'] == sha(active_path)
          assert manifest['incident_evidence_sha256'] == sha(incident_path)
          assert manifest['activation']['activation_base_main'] == os.environ['BASE_SHA']
          assert manifest['activation']['recovery_package_merge_commit'] == os.environ['BASE_SHA']
          assert manifest['activation']['recovery_package_postmerge_run_id'] == int(os.environ['PR184_POSTMERGE_RUN'])
          assert manifest['activation']['recovery_package_postmerge_evidence_head'] == os.environ['PR184_POSTMERGE_HEAD']
          assert manifest['activation']['activation_is_separate_repository_change'] is True
          assert manifest['activation']['active_workflow_materialized'] is True
          assert manifest['activation']['model_access_during_activation'] == 'NONE'
          assert manifest['activation']['retry_authority_created'] is False
          assert manifest['activation']['external_dispatch_authority_created'] is False
          assert manifest['activation']['training'] is False
          assert manifest['activation']['paid_cost_usd'] == 0.0
          assert binding['qwen_raw_code_recovery_manifest_sha256'] == sha(manifest_path)
          activation = binding['qwen_raw_code_recovery_activation']
          assert activation['recovery_manifest_sha256'] == sha(manifest_path)
          assert activation['recovery_script_sha256'] == sha(runner_path)
          assert activation['active_workflow_sha256'] == sha(active_path)
          assert activation['incident_evidence_sha256'] == sha(incident_path)
          assert activation['retry_authority_created'] is False
          assert activation['external_dispatch_authority_created'] is False
          assert activation['candidate_expansion'] is False
          assert activation['revision_or_file_expansion'] is False
          assert activation['model_access'] == 'NONE'
          assert activation['training'] is False
          assert activation['paid_cost_usd'] == 0.0
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          scope = manifest['recovery_scope']
          assert scope['rerun_prefill'] is False
          assert scope['rerun_decode'] is False
          assert scope['run_raw_code_proxy'] is True
          for key in ('candidate_expansion', 'revision_or_file_expansion', 'training', 'paid_compute', 'paid_model_api', 'git_model_binaries', 'founder_machine_model_binaries'):
              assert scope[key] is False
          assert scope['durable_outputs'] == ['JSON']
          print('ACTIVATION_IDENTITIES=PASS')
          print('AUTHORITY_BOUNDARY=PASS')
          print('EXTERNAL_EFFECT_BOUNDARY=PASS')
          PY

      - name: Run focused and full qualification quality gate
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m py_compile colab/mstr_b012_qwen_raw_code_recovery.py tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m mypy src/mstr_qualify

      - name: Final exact live qualification guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote origin "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          python - <<'PY'
          import json
          import os
          import urllib.request
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-pr185-final-qualification',
          }
          req = urllib.request.Request('https://api.github.com/repos/TheHalfMoon/MSTR/pulls/185', headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              pr = json.load(response)
          assert pr['state'] == 'open' and pr['draft'] is False
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['sha'] == os.environ['SUBJECT_SHA']
          assert pr['changed_files'] == 5
          print('PR185_EXACT_HEAD_QUALIFICATION=PASS')
          print('MODEL_EXECUTION=NONE')
          print('MODEL_ACCESS=NONE')
          print('TRAINING=false')
          print('PAID_COST_USD=0.0')
          PY
