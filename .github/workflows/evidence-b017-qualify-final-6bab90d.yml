name: Qualify exact final B017 implementation head

on:
  push:

permissions:
  contents: read

env:
  EXPECTED_MAIN: f7a386214a1346b75dd3311390aa1e19bf354bb1
  EXPECTED_HEAD: 6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3
  TARGET_BRANCH: feat/mstr-000b-b017-evolution-fixture-pilot

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Bind canonical main, task state, and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B017 > /tmp/b017.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json, os
          b17=json.load(open('/tmp/b017.json')); b11=json.load(open('/tmp/b011.json')); drift=json.load(open('/tmp/drift.json'))
          assert b17['canonical_main']==os.environ['EXPECTED_MAIN'] and b17['eligible'] is True
          assert b17['state_consistency_result']['observed_state']=='PENDING'
          assert b17['authority_result']['required'] is False
          assert b11['eligible'] is False and b11['state_consistency_result']['observed_state']=='BLOCKED'
          assert b11['authority_result']['required'] is True and b11['authority_result']['satisfied'] is False
          assert drift['status']=='clean' and drift['findings']==[]
          PY
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          expected=$(printf '%s\n' evidence/mstr-000b/B017-evolution-fixture-pilot.md src/mstr_qualify/software_evolution.py tests/fixtures/software_evolution/b017-localization.json tests/fixtures/software_evolution/b017-edit.json tests/fixtures/software_evolution/b017-review-repair.json tests/unit/test_software_evolution_projection.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          for path in schemas/mstr-software-evolution-record-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-software-evolution-record-v0.schema.json src/mstr_qualify/schemas.py configs/task-gate/mstr-000b.json specs/002-code-model-supremacy-foundation/tasks.md configs/quality.toml pyproject.toml; do
            git diff --quiet "$EXPECTED_MAIN" "$EXPECTED_HEAD" -- "$path"
          done

  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: 6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/test_software_evolution_projection.py tests/contract/test_software_evolution_contract.py

  test_suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: 6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: 6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: 6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - run: mypy

  schema_selfcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: 6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - run: python -m mstr_qualify validate

  complete:
    needs: [identity, focused, test_suite, lint, typecheck, schema_selfcheck]
    runs-on: ubuntu-24.04
    steps:
      - name: Final immutable remote recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          echo 'B017_EXACT_FINAL_HEAD_QUALIFICATION=PASS'
          echo 'B011_REMAINS_BLOCKED=PASS'
