name: PR184 recovery Ruff format builder

on:
  push:
    branches:
      - builder/pr184-ruff-format-74a0f56

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Apply canonical Ruff formatting and rebind runner digest
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.6' pytest
          python -m ruff format \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          runner = Path('colab/mstr_b012_qwen_raw_code_recovery.py')
          manifest_path = Path('artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['recovery_script_sha256'] = hashlib.sha256(runner.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f"RECOVERY_SCRIPT_SHA256={manifest['recovery_script_sha256']}")
          PY
          python -m ruff check \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m py_compile colab/mstr_b012_qwen_raw_code_recovery.py tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m pytest -q tests/contract/test_b012_qwen_raw_code_recovery.py

      - name: Commit forward-only repair and remove builder workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/pr184-ruff-format-builder-74a0f56.yml
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json
          git commit -m 'style(b012): format Qwen recovery package'
          git push origin HEAD:builder/pr184-ruff-format-74a0f56
