name: Diagnose B017 Ruff rule family

on:
  push:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b6be7168fbe7de8357b03e9eea27a8ec41a587c
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: E rules
        continue-on-error: true
        run: ruff check src tests --select E
      - name: F rules
        continue-on-error: true
        run: ruff check src tests --select F
      - name: I rules
        continue-on-error: true
        run: ruff check src tests --select I
      - name: UP rules
        continue-on-error: true
        run: ruff check src tests --select UP
      - name: B rules
        continue-on-error: true
        run: ruff check src tests --select B
