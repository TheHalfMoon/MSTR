name: Premerge A012 clean-checkout environment reset

on:
  push:
    branches:
      - evidence/a012-premerge-b753979

permissions:
  contents: read
  pull-requests: read

env:
  CANONICAL_BASE: 3cb9f44569a7469e785ed8ffc4ea88080663adda
  TARGET_BRANCH: feat/000a-a012-environment-reset
  TARGET_HEAD: b75397999f8b84ab5abbfe0ef1614af99705864c
  TARGET_TREE: 9c032ec0fd1f531d90c9de1603779095d4250302
  PR_NUMBER: "109"
  REVIEW_ID: "5068484080"
  QUALIFICATION_RUN: "33410772058"

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Verify PR admission and exact A012 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$CANONICAL_BASE" "$TARGET_HEAD")" = "$CANONICAL_BASE"
          test "$(git rev-list --count "$TARGET_HEAD..$CANONICAL_BASE")" = "0"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$TARGET_HEAD"

          mapfile -t actual < <(git diff --name-only "$CANONICAL_BASE" "$TARGET_HEAD" | sort)
          expected=(
            evidence/mstr-000a/A012-environment-reset.md
            src/mstr_qualify/environment/__init__.py
            src/mstr_qualify/environment/reset.py
            tests/integration/test_environment_reset.py
            tests/security/test_environment_reset_boundary.py
            tests/security/test_environment_reset_destructive_preflight.py
            tests/security/test_environment_reset_write_policy.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          git diff --check "$CANONICAL_BASE" "$TARGET_HEAD"

          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TheHalfMoon/MSTR/pulls/$PR_NUMBER")"
          jq -e --arg head "$TARGET_HEAD" --arg base "$CANONICAL_BASE" '.state == "open" and .draft == false and .head.sha == $head and .base.sha == $base and .mergeable == true' <<<"$pr_json"

          review_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TheHalfMoon/MSTR/pulls/$PR_NUMBER/reviews/$REVIEW_ID")"
          jq -e --arg head "$TARGET_HEAD" '.commit_id == $head and (.state == "COMMENTED" or .state == "APPROVED")' <<<"$review_json"

          run_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/$QUALIFICATION_RUN")"
          jq -e '.status == "completed" and .conclusion == "success"' <<<"$run_json"

          query='query { repository(owner:"TheHalfMoon", name:"MSTR") { pullRequest(number:109) { reviewThreads(first:100) { nodes { isResolved } } } } }'
          threads_json="$(jq -nc --arg query "$query" '{query:$query}' | curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' --data-binary @- https://api.github.com/graphql)"
          jq -e '(.data.repository.pullRequest.reviewThreads.nodes | map(select(.isResolved == false)) | length) == 0' <<<"$threads_json"

          grep -F -- '- [x] **A011 Freeze environment/setup/verifier manifest schemas and effect boundaries.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A012 Implement clean-checkout environment reset/setup abstraction.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A013 Implement bounded environment bootstrap/admission loop.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '**State:** `IMPLEMENTATION_CANDIDATE`' evidence/mstr-000a/A012-environment-reset.md
          grep -F -- 'NETWORK_EXECUTION = NONE' evidence/mstr-000a/A012-environment-reset.md
          grep -F -- 'SECRET_ACCESS = NONE' evidence/mstr-000a/A012-environment-reset.md
          grep -F -- 'ENVIRONMENT_ADMISSION_AUTHORITY = A013 / NOT_CREATED_BY_A012' evidence/mstr-000a/A012-environment-reset.md
          grep -F -- 'environment.external_effect_not_authorized' src/mstr_qualify/environment/reset.py
          grep -F -- 'environment.reset_write_policy' src/mstr_qualify/environment/reset.py
          grep -F -- 'environment.clone_envelope_mismatch' src/mstr_qualify/environment/reset.py

  quality:
    needs: admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run mandatory A012 premerge quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest -q tests/integration/test_environment_reset.py tests/security/test_environment_reset_boundary.py tests/security/test_environment_reset_destructive_preflight.py tests/security/test_environment_reset_write_policy.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: [admission, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Final immutable A012 premerge recheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$TARGET_HEAD"
          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TheHalfMoon/MSTR/pulls/$PR_NUMBER")"
          jq -e --arg head "$TARGET_HEAD" --arg base "$CANONICAL_BASE" '.state == "open" and .draft == false and .head.sha == $head and .base.sha == $base and .mergeable == true' <<<"$pr_json"
