name: Build cross-workstream binding repair v2

on:
  push:
    branches:
      - fix/000b-cross-workstream-prerequisite-bindings

permissions:
  contents: write

env:
  EXPECTED_BASE: db12d1467bb81185a9affffb4d470626ceceddfa
  BRANCH: fix/000b-cross-workstream-prerequisite-bindings

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable base and failed-builder history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE"..HEAD)" -eq 2
          test "$(git rev-parse HEAD^)" = "42d9f3d8fb753a67842986dfb547bba03a7c6737"
      - name: Re-run bounded generator with test-source repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/build-cross-workstream-binding-repair.yml')
          source = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          old = "addition = r'''"
          if script.count(old) != 1:
              raise SystemExit('expected one raw addition marker')
          script = script.replace(old, "addition = '''", 1)
          compiled = compile(script, '<bounded-generator-v2>', 'exec')
          exec(compiled, {'__name__': '__main__'})
          Path('.github/workflows/build-cross-workstream-binding-repair-v2.yml').unlink()
          PY
      - name: Run frozen gates on repaired workspace
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git diff --check "$EXPECTED_BASE"
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy
          python -m mstr_qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          cat /tmp/drift.json
          git update-ref refs/heads/main HEAD
          git update-ref refs/remotes/origin/main HEAD
          mstr-qualify task eligible B023 > /tmp/b023.json
          jq -e '.task_id == "B023" and .eligible == true and (.reasons | length) == 0' /tmp/b023.json
          jq -e '.semantic_checks.prerequisite_set_complete == true and .semantic_checks.prerequisite_states_satisfied == true' /tmp/b023.json
          jq -e '[.prerequisite_results[] | select(.task_id == "A006" or .task_id == "A014") | .satisfied] == [true, true]' /tmp/b023.json
          cat /tmp/b023.json
      - name: Commit exact maintenance repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git diff --cached --name-only | grep -Fx 'src/mstr_qualify/task_gate.py'
          git diff --cached --name-only | grep -Fx 'configs/task-gate/mstr-000b.json'
          git diff --cached --name-only | grep -Fx 'tests/contract/test_task_gate.py'
          git diff --cached --name-only | grep -Fx 'evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md'
          git diff --cached --name-only | grep -Fx '.github/workflows/build-cross-workstream-binding-repair.yml'
          git diff --cached --name-only | grep -Fx '.github/workflows/build-cross-workstream-binding-repair-v2.yml'
          git commit -m 'fix(task-gate): bind cross-workstream prerequisites'
          git push origin HEAD:"$BRANCH"
          FINAL_HEAD=$(git rev-parse HEAD)
          echo "FINAL_REPAIR_HEAD=$FINAL_HEAD"
          echo 'Final compare against canonical base:'
          git diff --name-only "$EXPECTED_BASE"..HEAD
          test "$(git diff --name-only "$EXPECTED_BASE"..HEAD | wc -l)" -eq 4
