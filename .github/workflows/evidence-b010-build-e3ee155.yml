                  },
                  'required_files': [
                      {
                          **record,
                          'artifact_class': 'MODEL_WEIGHT' if record['path'] in weight_files else 'MODEL_OR_TOKENIZER_METADATA',
                          'upstream_sha256_status': 'PINNED' if record['sha256'] else 'NOT_EXPOSED_BY_PUBLIC_METADATA',
                      }
                      for record in files
                  ],
                  'expected_weight_bytes': sum(int(record['size_bytes']) for record in files if record['path'] in weight_files),
                  'expected_required_download_bytes': sum(int(record['size_bytes']) for record in files),
                  'network_hosts': common_hosts,
                  'network_policy': 'HTTPS_GET_ONLY_AFTER_B011_EXACT_FOUNDER_AUTHORIZATION; ABORT_ON_AUTH_GATING_PAYMENT_OR_UNLISTED_REDIRECT',
                  'rights_status': {
                      'license': 'Apache-2.0',
                      'decision': 'pass_permissive',
                      'account_required': False,
                      'clickthrough_required': False,
                      'gated_terms_acceptance_required': False,
                  },
                  'executor': 'B011_APPROVED_EPHEMERAL_CLOUD_RUNNER_AFTER_EXACT_FOUNDER_AUTHORIZATION',
                  'storage': 'EXTERNAL_EPHEMERAL_OR_APPROVED_EXTERNAL_ACQUISITION_DIR; NEVER_GIT; NEVER_FOUNDER_MACHINE',
                  'retention': 'RETAIN_VERIFIED_ARTIFACTS_ONLY_UNTIL_B012_QUALIFICATION_AND_DOWNSTREAM_ADMISSION_CLOSEOUT_REQUIRES_OTHERWISE',
                  'cleanup': 'DELETE_PARTIAL_OR_FAILED_DOWNLOADS_IMMEDIATELY; REMOVE_EPHEMERAL_RUNNER_STORAGE_AT_JOB_END; FOLLOW_CANONICAL_EXTERNAL_ARTIFACT_RETENTION_FOR_SUCCESS',
                  'usd_ceiling': 0.0,
                  'expected_usd': 0.0,
              }

          qualification = ['mellum-4b', 'qwen3.5-0.8b-control']
          access = list(qualification)
          manifest = {
              'schema_version': 'mstr.b010-new-candidate-weight-access.v1',
              'task_id': 'B010',
              'state': 'IMPLEMENTED_PENDING_CANONICAL_CLOSEOUT',
              'canonical_main_at_execution': main,
              'purpose': 'Freeze new-candidate equivalent-qualification and model-weight-access planning without authorizing access or execution.',
              'frozen_inputs': {
