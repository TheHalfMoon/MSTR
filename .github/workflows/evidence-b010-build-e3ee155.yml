      - name: Qualify exact local implementation candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git branch -f main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B010 > /tmp/b010-after.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011-after.json; then
            echo 'B011 unexpectedly eligible from implementation-only B010 artifact' >&2
            exit 1
          fi
          python -m mstr_qualify task drift > /tmp/drift-after.json
          python - <<'PY'
          import json, os
          expected = os.environ['EXPECTED_MAIN']
          b010 = json.load(open('/tmp/b010-after.json'))
          b011 = json.load(open('/tmp/b011-after.json'))
          drift = json.load(open('/tmp/drift-after.json'))
          assert b010['canonical_main'] == expected
          assert b010['eligible'] is True and b010['reasons'] == []
          assert b010['state_consistency_result']['observed_state'] == 'PENDING'
          assert b011['eligible'] is False
          assert 'prerequisite.unsatisfied:B010' in b011['reasons']
          assert drift['status'] == 'clean' and drift['findings'] == []
          print('B010_IMPLEMENTATION_SEMANTICS=PASS')
          PY
          pytest -q tests/contract/test_b010_new_candidate_weight_access.py
