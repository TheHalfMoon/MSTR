              {'path': 'model-00001-of-00002.safetensors', 'size_bytes': 4986625856, 'sha256': '04bf4f574526ebecd75283af1f7ed0a412362388ddd28360c1581706cb3a00d2'},
              {'path': 'model-00002-of-00002.safetensors', 'size_bytes': 3051902048, 'sha256': '8fa0269d11332e13874280dbf5a15d5d6086d038656832c16e984544caf4b21b'},
              {'path': 'model.safetensors.index.json', 'size_bytes': 22463, 'sha256': None},
              {'path': 'special_tokens_map.json', 'size_bytes': 1127, 'sha256': None},
              {'path': 'tokenizer.json', 'size_bytes': 7030308, 'sha256': None},
              {'path': 'tokenizer_config.json', 'size_bytes': 5650, 'sha256': None},
              {'path': 'vocab.json', 'size_bytes': 1595831, 'sha256': None},
          ]
          qwen_files = [
              {'path': 'config.json', 'size_bytes': 2907, 'sha256': None},
              {'path': 'merges.txt', 'size_bytes': 3353259, 'sha256': None},
              {'path': 'model.safetensors-00001-of-00001.safetensors', 'size_bytes': 1746942600, 'sha256': 'c2b1e5a17d9c1e27685d92ed9b382911ebb99955ecd89052d1721241adfbab6c'},
              {'path': 'model.safetensors.index.json', 'size_bytes': 50900, 'sha256': None},
              {'path': 'preprocessor_config.json', 'size_bytes': 390, 'sha256': None},
              {'path': 'tokenizer.json', 'size_bytes': 12807196, 'sha256': 'fe000e3ed39ed12b8d2481d527d44f93c65d37e87645d2dcc80d1bf9d50d2927'},
              {'path': 'tokenizer_config.json', 'size_bytes': 16712, 'sha256': None},
              {'path': 'video_preprocessor_config.json', 'size_bytes': 386, 'sha256': None},
              {'path': 'vocab.json', 'size_bytes': 6722759, 'sha256': None},
