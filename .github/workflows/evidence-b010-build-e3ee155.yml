name: Build and qualify B010 new-candidate access preflight

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: e3ee155a7e0ed491984908998546900e594bda9a
      TARGET_BRANCH: research/000b-b010-new-candidate-weight-access
      METADATA_RUN: '33161954193'
      METADATA_JOB: '98818272943'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/000b-b010-new-candidate-weight-access
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard exact B010 entry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git branch -f main "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B010 > /tmp/b010-entry.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011-entry.json; then
            echo 'B011 unexpectedly eligible before B010 canonical closeout' >&2
            exit 1
          fi
          python -m mstr_qualify task drift > /tmp/drift-entry.json
          python - <<'PY'
          import json, os
          expected = os.environ['EXPECTED_MAIN']
          b010 = json.load(open('/tmp/b010-entry.json'))
          b011 = json.load(open('/tmp/b011-entry.json'))
          drift = json.load(open('/tmp/drift-entry.json'))
          assert b010['canonical_main'] == expected
          assert b010['eligible'] is True and b010['reasons'] == []
          assert b010['state_consistency_result']['observed_state'] == 'PENDING'
          assert b011['eligible'] is False
          assert 'prerequisite.unsatisfied:B010' in b011['reasons']
          assert drift['status'] == 'clean' and drift['findings'] == []
          print('B010_BUILD_ENTRY=PASS')
          PY

      - name: Materialize B010 artifact evidence and contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          main = 'e3ee155a7e0ed491984908998546900e594bda9a'
          metadata_run = 33161954193
          metadata_job = 98818272943
          common_hosts = [
              'huggingface.co',
              'cdn-lfs.huggingface.co',
              'cas-bridge.xethub.hf.co',
              'transfer.xethub.hf.co',
              'us.aws.cdn.hf.co',
          ]

          mellum_files = [
              {'path': 'config.json', 'size_bytes': 730, 'sha256': None},
              {'path': 'generation_config.json', 'size_bytes': 132, 'sha256': None},
