name: Evidence B003 post-closeout verification

on:
  push:
    branches:
      - evidence/b003-postcloseout-d0e9074

permissions:
  contents: read

env:
  EXPECTED_MAIN: d0e90740924f6991da361536e7f835eb55ae9145
  EXPECTED_CLOSEOUT_HEAD: 711b81d17fdcd941c881fb3e27ad6494fb271a0b
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  postcloseout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact canonical identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_CLOSEOUT_HEAD"
          test -z "$(git status --short)"
          git diff --exit-code

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify production post-closeout state
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          set +e
          python -m mstr_qualify task eligible B003 > /tmp/b003.json
          b003_rc=$?
          set -e
          test "$b003_rc" -eq 1
          python -m mstr_qualify task eligible B004 > /tmp/b004.json
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json
          b003 = json.load(open('/tmp/b003.json', encoding='utf-8'))
          b004 = json.load(open('/tmp/b004.json', encoding='utf-8'))
          drift = json.load(open('/tmp/drift.json', encoding='utf-8'))
          main = 'd0e90740924f6991da361536e7f835eb55ae9145'
          assert b003['task_id'] == 'B003', b003
          assert b003['eligible'] is False, b003
          assert 'task.already_terminal' in b003['reasons'], b003
          assert b003['canonical_main'] == main, b003
          assert b004['task_id'] == 'B004', b004
          assert b004['eligible'] is True and b004['reasons'] == [], b004
          assert b004['canonical_main'] == main, b004
          assert drift['status'] == 'clean' and drift['findings'] == [], drift
          assert drift['canonical_main'] == main, drift
          assert drift['tasks_checked'] == 34, drift
          print('POSTCLOSEOUT_B003_TERMINAL=true')
          print('POSTCLOSEOUT_B004_ELIGIBLE=true')
          print('POSTCLOSEOUT_DRIFT=clean')
          PY

      - name: Run targeted governance tests
        run: pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_task_drift.py tests/integration/test_task_drift_cli.py

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Verify immutable canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          echo "FINAL_POSTCLOSEOUT_MAIN=$(git rev-parse HEAD)"
