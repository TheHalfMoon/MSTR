name: PR171 T031 executor qualification5 2585cf8

on:
  push:
    branches:
      - evidence/pr171-t031-executor-qualification5-2585cf8

permissions:
  contents: read

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2585cf89ef0c54eed9d763cd0a9276caaa61f7e3
          fetch-depth: 0

      - name: Verify exact identity scope and immutable authority
        shell: bash
        run: |
          set -euo pipefail
          BASE=891af2215a2244a6a0912d49d782f42bcc38b6ef
          HEAD=2585cf89ef0c54eed9d763cd0a9276caaa61f7e3
          TREE=cbe56dafbabbf5917df52d159847c46aa34d58a3
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/feat/t031-governed-measurement-executor | awk '{print $1}')" = "$HEAD"
          git diff --check "$BASE".."$HEAD"
          cat > /tmp/expected-files <<'EOF'
          .github/workflows/t031-measure.yml
          artifacts/manifests/T031-executor-toolchain-binding.json
          artifacts/manifests/T031-executor-toolchain-lock.json
          colab/mstr_executor_toolchain.py
          colab/mstr_t031_artifacts.py
          colab/mstr_t031_execute.py
          colab/mstr_t031_governance.py
          colab/mstr_t031_measure.py
          colab/mstr_t031_source.py
          evidence/T031-executor-toolchain-binding.md
          tests/contract/test_t031_executor_binding.py
          EOF
          git diff --name-only "$BASE".."$HEAD" | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          binding = json.loads(Path('artifacts/manifests/T031-executor-toolchain-binding.json').read_text())
          pairs = {
              'toolchain_lock_sha256': 'artifacts/manifests/T031-executor-toolchain-lock.json',
              'toolchain_helper_sha256': 'colab/mstr_executor_toolchain.py',
              'governance_script_sha256': 'colab/mstr_t031_governance.py',
              'source_script_sha256': 'colab/mstr_t031_source.py',
              'artifact_script_sha256': 'colab/mstr_t031_artifacts.py',
              'measurement_script_sha256': 'colab/mstr_t031_measure.py',
              'executor_script_sha256': 'colab/mstr_t031_execute.py',
              'workflow_sha256': '.github/workflows/t031-measure.yml',
          }
          for key, path in pairs.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert binding[key] == actual, (key, binding[key], actual)
          authority = Path('artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json')
          envelope = Path('artifacts/manifests/T031-local-measurement-execution-envelope.json')
          assert hashlib.sha256(authority.read_bytes()).hexdigest() == 'f7ac76d05d2a9dfa91fc4ff76fef42aac0c080aaefc89b9c2dc6348d93fb92cd'
          assert hashlib.sha256(envelope.read_bytes()).hexdigest() == '700be8f090ac13dd26b9f1720ecd9911ca432e94df970d3aae3e7a6c8afd6ff6'
          assert binding['authority_sha256'] == 'f7ac76d05d2a9dfa91fc4ff76fef42aac0c080aaefc89b9c2dc6348d93fb92cd'
          assert binding['envelope_sha256'] == '700be8f090ac13dd26b9f1720ecd9911ca432e94df970d3aae3e7a6c8afd6ff6'
          assert binding['candidate_ids'] == [
              'granite-4.1-3b','ministral-3-3b','qwen2.5-coder-1.5b','qwen3-4b',
              'qwen3.5-2b','qwen3.5-4b','smollm3-3b','yi-coder-1.5b'
          ]
          assert binding['contexts'] == [4096,8192,16384]
          dispatch = binding['dispatch_boundary']
          assert dispatch == {
              'canonicalization_required': True,
              'connector_dispatch_surface': 'ISSUE_COMMENT_CANONICAL_MAIN',
              'connector_dispatch_issue': 167,
              'connector_dispatch_author': 'TheHalfMoon',
              'connector_dispatch_author_association': 'OWNER',
              'connector_dispatch_command': 'T031_RUN <authorized-candidate>',
              'checkout_ref': 'main',
              'max_parallel_candidates': 1,
              'max_job_minutes': 120,
          }
          boundary = binding['execution_boundary']
          for key in ('authority_transfer','b012_execution','t032_execution','t033_execution','t034_admission_decision','training'):
              assert boundary[key] is False, key
          assert boundary['paid_cost_usd'] == 0.0
          assert boundary['git_model_binaries'] == 0
          assert boundary['founder_machine_model_binaries'] == 0
          workflow = Path('.github/workflows/t031-measure.yml').read_text()
          assert 'issue_comment:' in workflow
          assert 'workflow_dispatch:' not in workflow
          assert '\n  push:' not in workflow
          assert 'execute/t031-' not in workflow
          assert "github.event.issue.number == 167" in workflow
          assert "github.event.comment.author_association == 'OWNER'" in workflow
          PY
          python -m py_compile colab/mstr_executor_toolchain.py colab/mstr_t031_artifacts.py colab/mstr_t031_execute.py colab/mstr_t031_governance.py colab/mstr_t031_measure.py colab/mstr_t031_source.py tests/contract/test_t031_executor_binding.py

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2585cf89ef0c54eed9d763cd0a9276caaa61f7e3
          fetch-depth: 0
      - name: Setup Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Run frozen repository gates and PR-specific format gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check colab/mstr_executor_toolchain.py colab/mstr_t031_artifacts.py colab/mstr_t031_execute.py colab/mstr_t031_governance.py colab/mstr_t031_measure.py colab/mstr_t031_source.py tests/contract/test_t031_executor_binding.py
          python -m mypy src/mstr_qualify
          test "$(git rev-parse HEAD)" = "2585cf89ef0c54eed9d763cd0a9276caaa61f7e3"
          test "$(git rev-parse HEAD^{tree})" = "cbe56dafbabbf5917df52d159847c46aa34d58a3"
          test -z "$(git status --porcelain)"

  final_qualification:
    needs: [identity_scope, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recheck exact live state and emit verdict
        shell: bash
        run: |
          set -euo pipefail
          BASE=891af2215a2244a6a0912d49d782f42bcc38b6ef
          HEAD=2585cf89ef0c54eed9d763cd0a9276caaa61f7e3
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/feat/t031-governed-measurement-executor | awk '{print $1}')" = "$HEAD"
          echo "T031_EXECUTOR_EXACT_HEAD_QUALIFICATION=PASS"
          echo "BASE_SHA=$BASE"
          echo "TARGET_HEAD=$HEAD"
          echo "TARGET_TREE=cbe56dafbabbf5917df52d159847c46aa34d58a3"
          echo "EXTERNAL_MODEL_EXECUTION=NOT_DISPATCHED"
