name: B023 horizontal-whitespace-safe binding exact-head qualification

on:
  push:
    branches:
      - evidence/b023-binding-horizontal-safe-qualify-4df7181

permissions:
  contents: read

env:
  BASE_SHA: db12d1467bb81185a9affffb4d470626ceceddfa
  TARGET_SHA: 4df7181de84109435e23560daed58a0b59b1489d
  TARGET_TREE: 0cc20f3c184e9d373483363960eaaaf4f3884ee7
  TARGET_BRANCH: fix/b023-cross-workstream-bindings-horizontal-safe-atomic-20260901

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact identity, ancestry, and live refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" "$TARGET_SHA")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
      - name: Verify exact four-file scope and B023 pending state
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md \
            src/mstr_qualify/task_gate.py \
            tests/contract/test_task_gate.py | sort > /tmp/expected
          git diff --name-only "$BASE_SHA...$TARGET_SHA" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(grep '^\.github/' /tmp/actual || true)"
          test -z "$(grep '^specs/002-code-model-supremacy-foundation/tasks.md$' /tmp/actual || true)"
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md
      - name: Verify cumulative fail-closed parser semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('configs/task-gate/mstr-000b.json').read_text(encoding='utf-8'))
          b023 = catalog['tasks']['B023']
          assert b023['canonical_state'] == 'PENDING'
          assert set(b023['prerequisites']) == {'A006', 'A014', 'B002', 'B022'}
          for task_id, evidence_path in {
              'A006': 'evidence/mstr-000a/A006-finalizer.md',
              'A014': 'evidence/mstr-000a/A014-verifier-shortcuts.md',
          }.items():
              binding = catalog['external_prerequisites'][task_id]
              assert binding['workstream_id'] == 'MSTR-000A'
              assert binding['task_identity'] == f'MSTR-000A / {task_id}'
              assert binding['tasks_file'] == 'specs/001-agent-harness-verified-loop-foundation/tasks.md'
              assert binding['state_evidence'] == evidence_path
              assert evidence_path in binding['evidence_outputs']
              assert binding['required_state'] == 'COMPLETE_CANONICAL'

          source = Path('src/mstr_qualify/task_gate.py').read_text(encoding='utf-8')
          required_source = (
              'def _markdown_without_fenced_code',
              'opener = re.compile(r"^[ \\t]{0,3}(?P<fence>`{3,}|~{3,})")',
              'closer = re.compile(r"^[ \\t]{0,3}(?P<fence>`{3,}|~{3,})[ \\t]*$")',
              'rf"^- \\[(?P<mark>[ xX])\\] \\*\\*{re.escape(task_id)}[ \\t]+[^\\r\\n]+?\\*\\*[ \\t]*$"',
              'r"^\\*\\*Task:\\*\\*[ \\t]*`(?P<task>[^`\\r\\n]+)`[ \\t]*$"',
              'r"^\\*\\*State:\\*\\*[ \\t]*`(?P<state>[^`\\r\\n]+)`[ \\t]*$"',
              'def _external_evidence_output_present',
              '_external_evidence_output_present(catalog.repository_root, raw)',
              'prerequisite.external_checkbox_unverifiable',
          )
          for fragment in required_source:
              assert fragment in source, fragment
          assert r'^[ \\t]{0,3}' not in source
          assert r'\s*`(?P<task>' not in source
          assert r'\s*`(?P<state>' not in source
          assert r'{re.escape(task_id)}\s+' not in source
          assert source.count('_markdown_without_fenced_code(evidence_text)') >= 2
          assert source.count('except (OSError, UnicodeError):') >= 2

          tests = Path('tests/contract/test_task_gate.py').read_text(encoding='utf-8')
          required_tests = (
              'test_external_prerequisite_fenced_checklist_example_is_ignored',
              'test_external_prerequisite_fenced_state_evidence_example_is_ignored',
              'test_external_prerequisite_fenced_examples_do_not_duplicate_canonical_records',
              'test_external_prerequisite_crlf_fenced_checklist_example_is_ignored',
              'test_external_prerequisite_checklist_title_does_not_require_trailing_period',
              'test_external_prerequisite_non_utf8_checklist_fails_closed_without_exception',
              'test_external_prerequisite_non_utf8_state_evidence_fails_closed_without_exception',
              'test_external_prerequisite_emphasized_duplicate_checklist_row_fails_closed',
              'test_external_prerequisite_literal_directory_evidence_output_fails_closed',
              'test_external_prerequisite_glob_directory_evidence_output_fails_closed',
              'test_external_prerequisite_literal_t_fence_does_not_hide_duplicate_row',
              'test_external_prerequisite_tab_indented_fence_still_hides_fenced_duplicate',
              'test_external_prerequisite_newline_split_records_fail_closed',
          )
          for name in required_tests:
              assert name in tests, name

          evidence = Path('evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md').read_text(encoding='utf-8')
          assert '## Horizontal-whitespace parser hardening from independent review' in evidence
          assert '## Regular-file evidence-output hardening from independent review' in evidence
          PY

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused task-gate tests
        run: python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src
      - name: Prospective B023 eligibility on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from mstr_qualify.task_gate import evaluate_task_snapshot

          result = evaluate_task_snapshot(
              'B023',
              repository_root=Path.cwd(),
              catalog_path=Path('configs/task-gate/mstr-000b.json'),
              canonical_main='db12d1467bb81185a9affffb4d470626ceceddfa',
          )
          assert result['eligible'] is True, result
          rows = {item['task_id']: item for item in result['prerequisite_results']}
          assert set(rows) == {'A006', 'A014', 'B002', 'B022'}, rows
          assert all(rows[item]['satisfied'] is True for item in rows), rows
          print('B023_PROSPECTIVE_ELIGIBLE=PASS')
          PY

  complete:
    runs-on: ubuntu-24.04
    needs:
      - identity_scope
      - quality
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Recheck exact-head immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          echo "EXACT_HEAD_QUALIFICATION=PASS"
