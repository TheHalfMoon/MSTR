name: Postmerge verify PR156 B011 readiness

on:
  push:
    branches:
      - evidence/pr156-b011-readiness-postmerge

permissions:
  contents: read
  pull-requests: read

env:
  MERGE_SHA: dd547bb768598f92ad203764ce32be6e1fc710d6
  OLD_MAIN: 7884af6b159534671ad4259addfcb319d7084d36
  PR_HEAD: f5b421cc81cb3add30be3c459cc3519d921ab39e
  PR_NUMBER: '156'

jobs:
  exact_main_postmerge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify canonical merge identity and terminal PR state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          mapfile -t parents < <(git show -s --format='%P' "$MERGE_SHA" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$OLD_MAIN"
          test "${parents[1]}" = "$PR_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg merge "$MERGE_SHA" --arg head "$PR_HEAD" '.state == "closed" and .merged == true and .merge_commit_sha == $merge and .head.sha == $head' /tmp/pr.json >/dev/null
          git update-ref refs/heads/main "$MERGE_SHA"
          git update-ref refs/remotes/origin/main "$MERGE_SHA"
          echo 'PR156_POSTMERGE_IDENTITY=PASS'
      - name: Verify canonical checklist and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          checklist = Path('specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md').read_text(encoding='utf-8')
          before = checklist.split('## Before B011\n', 1)[1].split('\n## Before Any Weight-Changing Training', 1)[0]
          assert before.count('- [x]') == 4 and '- [ ]' not in before
          training = checklist.split('## Before Any Weight-Changing Training\n', 1)[1].split('\n## Blocking Conditions', 1)[0]
          assert training.count('- [ ]') == 12

          manifest_path = Path('artifacts/manifests/B010-new-candidate-weight-access.json')
          authority = json.loads(Path('artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json').read_text(encoding='utf-8'))
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == '4c2fd1469cdcf728063ab8f5b6a603191ffdc9e1a4d4c2d794abd2a24950c3ef'
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['decision'] == 'FOUNDER_B011_MODEL_WEIGHT_ACCESS_DECISION=AUTHORIZE_EXACT_B010_ENVELOPE'
          for key in ['paid_compute','paid_model_api','gated_terms_acceptance','quantization_execution','weight_changing_training','large_dataset_ingestion','production_release','git_model_binaries']:
              assert authority['scope'][key] is False
          print('PR156_POSTMERGE_CHECKLIST=PASS')
          PY
      - name: Install canonical tooling
        run: python -m pip install -e '.[dev]'
      - name: Prove exact-main B011 eligibility and downstream closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse refs/heads/main)" = "$MERGE_SHA"
          mstr-qualify task eligible B011 > /tmp/b011.json
          jq -e '.task_id == "B011" and .eligible == true and .authority_result.required == true and .authority_result.satisfied == true and .authority_result.authority_id == "B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED" and .state_consistency_result.observed_state == "PENDING" and (.reasons | length == 0)' /tmp/b011.json >/dev/null
          if mstr-qualify task eligible B012 > /tmp/b012.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B011")) != null' /tmp/b012.json >/dev/null
          if mstr-qualify task eligible B013 > /tmp/b013.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B012")) != null' /tmp/b013.json >/dev/null
          echo 'PR156_POSTMERGE_TASK_GATE=PASS'
      - name: Fresh canonical quality verification
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          echo 'PR156_POSTMERGE_QUALITY=PASS'
      - name: Final canonical main immutability recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse refs/heads/main)" = "$MERGE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MERGE_SHA"
          echo 'PR156_B011_READINESS_POSTMERGE=PASS'
