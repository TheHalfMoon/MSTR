name: Verify B017 canonical closeout post-merge

on:
  push:

permissions:
  contents: read

env:
  EXPECTED_MAIN: 4919891be2e10c84a4c57a420ee2884d72da4e93
  EXPECTED_PARENT_MAIN: 79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c
  EXPECTED_CLOSEOUT: 287da395632bc454ef0abe0e9b322800286711a7

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Bind canonical closeout merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT_MAIN"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_CLOSEOUT"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$EXPECTED_CLOSEOUT^{tree}")"

  task_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - name: Prove B017 terminal, B018 eligible, and B011 still blocked
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          if python -m mstr_qualify task eligible B017 > /tmp/b017.json; then exit 1; fi
          python -m mstr_qualify task eligible B018 > /tmp/b018.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json
          b17=json.load(open('/tmp/b017.json')); b18=json.load(open('/tmp/b018.json')); b11=json.load(open('/tmp/b011.json')); drift=json.load(open('/tmp/drift.json'))
          assert b17['canonical_main']=='4919891be2e10c84a4c57a420ee2884d72da4e93'
          assert b17['eligible'] is False
          assert b17['state_consistency_result']['observed_state']=='COMPLETE_CANONICAL'
          assert 'task.already_terminal' in b17['reasons']
          assert b18['eligible'] is True
          assert b18['state_consistency_result']['observed_state']=='PENDING'
          assert b18['authority_result']['required'] is False
          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state']=='BLOCKED'
          assert b11['authority_result']['required'] is True
          assert b11['authority_result']['satisfied'] is False
          assert drift['status']=='clean' and drift['findings']==[]
          PY

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: 4919891be2e10c84a4c57a420ee2884d72da4e93}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - run: python -m mstr_qualify validate
      - run: pytest -q
      - run: ruff check src tests
      - run: mypy

  complete:
    needs: [identity, task_gate, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Final canonical main immutability recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo 'B017_CLOSED_CANONICAL=PASS'
          echo 'B018_ENTRY_ELIGIBLE=PASS'
          echo 'B011_REMAINS_BLOCKED=PASS'
