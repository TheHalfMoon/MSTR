name: PR171 T031 executor qualification6 0b25193

on:
  push:
    branches:
      - evidence/pr171-t031-executor-qualification6-0b25193

permissions:
  contents: read

jobs:
  exact_identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0b25193c160a16750294977f225dca421bc5d211
          fetch-depth: 0
      - name: Exact head base tree live-ref and file-scope gates
        shell: bash
        run: |
          set -euo pipefail
          BASE=891af2215a2244a6a0912d49d782f42bcc38b6ef
          HEAD=0b25193c160a16750294977f225dca421bc5d211
          TREE=f3cd47b76a0e837c3f9357fa62d566d5b1e4a9cc
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/feat/t031-governed-measurement-executor | awk '{print $1}')" = "$HEAD"
          git diff --check "$BASE".."$HEAD"
          cat > /tmp/expected <<'EOF'
          .github/workflows/t031-measure.yml
          artifacts/manifests/T031-executor-toolchain-binding.json
          artifacts/manifests/T031-executor-toolchain-lock.json
          colab/mstr_executor_toolchain.py
          colab/mstr_t031_artifacts.py
          colab/mstr_t031_execute.py
          colab/mstr_t031_governance.py
          colab/mstr_t031_measure.py
          colab/mstr_t031_source.py
          evidence/T031-executor-toolchain-binding.md
          tests/contract/test_t031_executor_binding.py
          EOF
          sort /tmp/expected -o /tmp/expected
          git diff --name-only "$BASE".."$HEAD" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

  binding_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0b25193c160a16750294977f225dca421bc5d211
          fetch-depth: 0
      - name: Verify immutable authority component hashes and scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          b=json.loads(Path('artifacts/manifests/T031-executor-toolchain-binding.json').read_text())
          pairs={
            'toolchain_lock_sha256':'artifacts/manifests/T031-executor-toolchain-lock.json',
            'toolchain_helper_sha256':'colab/mstr_executor_toolchain.py',
            'governance_script_sha256':'colab/mstr_t031_governance.py',
            'source_script_sha256':'colab/mstr_t031_source.py',
            'artifact_script_sha256':'colab/mstr_t031_artifacts.py',
            'measurement_script_sha256':'colab/mstr_t031_measure.py',
            'executor_script_sha256':'colab/mstr_t031_execute.py',
            'workflow_sha256':'.github/workflows/t031-measure.yml',
          }
          for k,p in pairs.items():
              a=hashlib.sha256(Path(p).read_bytes()).hexdigest()
              assert b[k]==a,(k,b[k],a)
          assert hashlib.sha256(Path('artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json').read_bytes()).hexdigest()=='f7ac76d05d2a9dfa91fc4ff76fef42aac0c080aaefc89b9c2dc6348d93fb92cd'
          assert hashlib.sha256(Path('artifacts/manifests/T031-local-measurement-execution-envelope.json').read_bytes()).hexdigest()=='700be8f090ac13dd26b9f1720ecd9911ca432e94df970d3aae3e7a6c8afd6ff6'
          assert b['authority_sha256']=='f7ac76d05d2a9dfa91fc4ff76fef42aac0c080aaefc89b9c2dc6348d93fb92cd'
          assert b['envelope_sha256']=='700be8f090ac13dd26b9f1720ecd9911ca432e94df970d3aae3e7a6c8afd6ff6'
          assert b['candidate_ids']==['granite-4.1-3b','ministral-3-3b','qwen2.5-coder-1.5b','qwen3-4b','qwen3.5-2b','qwen3.5-4b','smollm3-3b','yi-coder-1.5b']
          assert b['contexts']==[4096,8192,16384]
          assert b['dispatch_boundary']=={
            'canonicalization_required':True,
            'connector_dispatch_surface':'ISSUE_COMMENT_CANONICAL_MAIN',
            'connector_dispatch_issue':167,
            'connector_dispatch_author':'TheHalfMoon',
            'connector_dispatch_author_association':'OWNER',
            'connector_dispatch_command':'T031_RUN <authorized-candidate>',
            'checkout_ref':'main','max_parallel_candidates':1,'max_job_minutes':120,
          }
          e=b['execution_boundary']
          for k in ['authority_transfer','b012_execution','t032_execution','t033_execution','t034_admission_decision','training']:
              assert e[k] is False,k
          assert e['paid_cost_usd']==0.0 and e['git_model_binaries']==0 and e['founder_machine_model_binaries']==0
          PY
      - name: Verify dispatch security and syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/t031-measure.yml').read_text()
          assert 'issue_comment:' in w
          assert 'workflow_dispatch:' not in w
          assert '\n  push:' not in w
          assert 'execute/t031-' not in w
          assert "github.event.issue.number == 167" in w
          assert "github.actor == 'TheHalfMoon'" in w
          assert "github.event.comment.user.login == 'TheHalfMoon'" in w
          assert "github.event.comment.author_association == 'OWNER'" in w
          assert '[[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]' in w
          assert '[[ "$GITHUB_REF" == "refs/heads/main" ]]' in w
          PY
          python -m py_compile colab/mstr_executor_toolchain.py colab/mstr_t031_artifacts.py colab/mstr_t031_execute.py colab/mstr_t031_governance.py colab/mstr_t031_measure.py colab/mstr_t031_source.py tests/contract/test_t031_executor_binding.py

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0b25193c160a16750294977f225dca421bc5d211
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Frozen repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check colab/mstr_executor_toolchain.py colab/mstr_t031_artifacts.py colab/mstr_t031_execute.py colab/mstr_t031_governance.py colab/mstr_t031_measure.py colab/mstr_t031_source.py tests/contract/test_t031_executor_binding.py
          python -m mypy src/mstr_qualify
          test -z "$(git status --porcelain)"

  final_qualification:
    needs: [exact_identity, binding_contract, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reverify exact live refs
        shell: bash
        run: |
          set -euo pipefail
          BASE=891af2215a2244a6a0912d49d782f42bcc38b6ef
          HEAD=0b25193c160a16750294977f225dca421bc5d211
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/feat/t031-governed-measurement-executor | awk '{print $1}')" = "$HEAD"
          echo 'T031_EXECUTOR_EXACT_HEAD_QUALIFICATION=PASS'
          echo "BASE_SHA=$BASE"
          echo "TARGET_HEAD=$HEAD"
          echo 'TARGET_TREE=f3cd47b76a0e837c3f9357fa62d566d5b1e4a9cc'
          echo 'EXTERNAL_MODEL_EXECUTION=NOT_DISPATCHED'
