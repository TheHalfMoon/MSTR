name: PR188 final source adoption exact-head qualification

on:
  push:
    branches:
      - evidence/pr188-source-adoption-qualification-cc722dd

permissions:
  contents: read
  pull-requests: read

env:
  PR_NUMBER: "188"
  BASE_SHA: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
  SUBJECT_BRANCH: plan/mstr-source-adoption-capability-mining-v2-5e74e77
  SUBJECT_SHA: cc722dd5ee08e0c94d22e3a5cda0c4c4a7470f92
  SUBJECT_TREE: 97fac42d0e9886720f93aa1a74679317e8086a7b

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout qualification evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify exact PR base head tree ancestry and scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "origin/$SUBJECT_BRANCH")" = "$SUBJECT_SHA"
          test "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..$SUBJECT_SHA")" = "3"
          test "$(git show -s --format=%T "$SUBJECT_SHA")" = "$SUBJECT_TREE"
          test "$(gh api repos/TheHalfMoon/MSTR/pulls/$PR_NUMBER --jq .state)" = open
          test "$(gh api repos/TheHalfMoon/MSTR/pulls/$PR_NUMBER --jq .base.sha)" = "$BASE_SHA"
          test "$(gh api repos/TheHalfMoon/MSTR/pulls/$PR_NUMBER --jq .head.sha)" = "$SUBJECT_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            "artifacts/manifests/MSTR-source-adoption-research-snapshot-2026-09-08.json"
            "docs/canonical/MSTR_SOURCE_ADOPTION_AND_CAPABILITY_MINING_STRATEGY.md"
            "specs/002-code-model-supremacy-foundation/research-source-adoption-2026-09-08.md"
            "specs/002-code-model-supremacy-foundation/tasks.md"
            "tests/contract/test_source_adoption_plan.py"
          )
          test "${#changed[@]}" -eq 5
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- configs/task-gate/mstr-000b.json
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- artifacts/authorities
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- .github/workflows

      - name: Verify planning-only and preserved-obligation invariants
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path('artifacts/manifests/MSTR-source-adoption-research-snapshot-2026-09-08.json').read_text())
          assert len(snapshot['sources']) == 18
          assert snapshot['canonical_planning_base'] == '5e74e77c1fc86d4ebc7e64654f45bd18f565edd6'
          assert snapshot['canonical_planning_base_tree'] == '66120bf247e7d9b9da34d5d47603493c8dce4c30'
          assert snapshot['revision_reverification']['changed_source_count'] == 5
          boundary = snapshot['authority_boundary']
          assert boundary['source_code_permission_is_data_admission'] is False
          assert boundary['source_code_permission_is_model_weight_authority'] is False
          assert boundary['source_code_permission_is_training_authority'] is False
          assert boundary['source_code_permission_is_external_effect_authority'] is False
          assert boundary['training'] is False
          assert boundary['paid_cost_usd'] == 0.0

          catalog = json.loads(Path('configs/task-gate/mstr-000b.json').read_text())['tasks']
          for i in range(14, 31):
              assert catalog[f'B{i:03d}']['canonical_state'] == 'COMPLETE_CANONICAL'
          assert catalog['B031']['canonical_state'] == 'PENDING'
          assert catalog['B032']['prerequisites'] == ['B031']
          assert catalog['B033']['prerequisites'] == ['B032']
          assert catalog['B034']['canonical_state'] == 'PENDING'

          tasks = Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text()
          required = (
              'Data Constitution, language mix, software evolution',
              'self-alignment, teacher policy, verifier health',
              'multi-fidelity RL promotion',
              'dynamic synthetic environment generation',
              'previous-MSTR bootstrap with independent admission',
              'Q4 anchor plus Q3/Q2/structured-ternary',
              'FAST/NORMAL/DEEP effort-control tournament',
              'sealed anti-leakage headline qualification',
              'future-Git-history/public-solution/network leakage',
              'no experimental sub-Q4 artifact can replace',
              'SourceAdoptionRecord',
              'MINIMAL_BASH_LINEAR_BASELINE',
          )
          for token in required:
              assert token in tasks
          assert '\n  Prerequisite: B031 `COMPLETE_CANONICAL`.' in tasks
          assert '\n  Prerequisite: B032 `COMPLETE_CANONICAL`.' in tasks
          print('PLANNING_ONLY_AND_PRESERVED_OBLIGATIONS=PASS')
          PY

      - name: Run exact-head quality gates
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q tests/contract/test_source_adoption_plan.py tests/contract/test_task_gate.py tests/contract/test_convergence_external_bindings.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check tests/contract/test_source_adoption_plan.py
          python -m mypy src/mstr_qualify

      - name: Final exact live qualification guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git show -s --format=%T HEAD)" = "$SUBJECT_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$SUBJECT_BRANCH" | cut -f1)" = "$SUBJECT_SHA"
          test "$(gh api repos/TheHalfMoon/MSTR/pulls/$PR_NUMBER --jq .head.sha)" = "$SUBJECT_SHA"
          echo 'PR188_EXACT_HEAD_QUALIFICATION=PASS'
          echo 'MODEL_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
