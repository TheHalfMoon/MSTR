name: Mandatory premerge verification PR 148

on:
  push:
    branches:
      - evidence/pr148-mandatory-premerge

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BASE: 766f7df376eb1fd7b9b68dcd1d029eccdb362d76
      EXPECTED_HEAD: 3de5ed19c1dc8d90e193478effb8ff437e8414ed
      EXPECTED_TREE: 71922d96d7557086a52b92eb54909cb806b3a6a9
      PR_NUMBER: '148'
      QUALIFICATION_RUN: '33787680692'
      REVIEW_RUN: '33790593039'
    steps:
      - name: Checkout canonical base
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BASE }}
          fetch-depth: 0
          path: base
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact live identity, mergeability, and scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git -C candidate rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_BASE"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '
            .state == "open" and
            .draft == false and
            .merged == false and
            .mergeable == true and
            .base.ref == "main" and
            .base.sha == $base and
            .head.sha == $head and
            .commits == 1 and
            .changed_files == 1 and
            .additions == 1 and
            .deletions == 1
          ' /tmp/pr.json >/dev/null

          printf '%s\n' tests/contract/test_b027_ladder_pilot.py > /tmp/expected-files
          git -C candidate diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(git -C candidate diff --numstat "$EXPECTED_BASE...$EXPECTED_HEAD")" = $'1\t1\ttests/contract/test_b027_ladder_pilot.py'
          git -C candidate diff --check "$EXPECTED_BASE...$EXPECTED_HEAD"

      - name: Verify qualification and independent review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" --jq .status)" = completed
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN}" --jq .status)" = completed
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN}" --jq .conclusion)" = success

      - name: Reconcile reviews and threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --jq 'length')" -eq 0
          gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:100){nodes{body author{login}}}}}}}}' -f owner=TheHalfMoon -f repo=MSTR -F number=148 > /tmp/threads.json
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0' /tmp/threads.json >/dev/null
          echo 'REVIEW_RECONCILIATION=PASS'

      - name: Verify protection, rulesets, and required-check boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" > /tmp/branch.json
          jq -e '.protected == false and (.protection.enabled // false) == false and ((.protection.required_status_checks.contexts // []) | length == 0)' /tmp/branch.json >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true" > /tmp/rulesets.json
          jq -e 'length == 0' /tmp/rulesets.json >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD}/status" > /tmp/status.json
          jq -e '[.statuses[]? | select(.state == "failure" or .state == "error")] | length == 0' /tmp/status.json >/dev/null
          echo 'REQUIRED_CHECK_BOUNDARY=PASS'

      - name: Verify exact semantic repair remains isolated
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          base = Path('base')
          candidate = Path('candidate')
          test_path = Path('tests/contract/test_b027_ladder_pilot.py')
          production_path = Path('scripts/research/b027_ladder_pilot.py')
          before = (base / test_path).read_text(encoding='utf-8')
          after = (candidate / test_path).read_text(encoding='utf-8')
          old = '    _git(clone, "fetch", ".", f"{canonical_entry}:refs/remotes/origin/main")'
          new = '    _git(clone, "update-ref", "refs/remotes/origin/main", canonical_entry)'
          assert before.count(old) == 1
          assert after == before.replace(old, new, 1)
          assert (base / production_path).read_bytes() == (candidate / production_path).read_bytes()
          assert b'update-ref' not in (candidate / production_path).read_bytes()
          print('SEMANTIC_SCOPE=PASS')
          PY

      - name: Install exact candidate tooling
        run: python -m pip install -e './candidate[dev]'

      - name: Repaired B027 regression
        working-directory: candidate
        run: python -m pytest tests/contract/test_b027_ladder_pilot.py::test_b027_harness_never_rewrites_canonical_refs -q

      - name: Full B027 suite
        working-directory: candidate
        run: python -m pytest tests/contract/test_b027_ladder_pilot.py -q

      - name: Full test suite
        working-directory: candidate
        run: python -m pytest -q

      - name: Ruff
        working-directory: candidate
        run: python -m ruff check .

      - name: Canonical mypy
        working-directory: candidate
        run: python -m mypy src

      - name: Offline validation
        working-directory: candidate
        run: python -m mstr_qualify validate

      - name: Final immutable live recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr-final.json
          jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '.state == "open" and .draft == false and .merged == false and .mergeable == true and .base.sha == $base and .head.sha == $head' /tmp/pr-final.json >/dev/null
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          echo 'MANDATORY_PREMERGE=PASS'
