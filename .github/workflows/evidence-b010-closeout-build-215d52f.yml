name: Build and qualify B010 canonical closeout

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 215d52f4de772639c5e64193ff48deaafb6eb2d7
      TARGET_BRANCH: docs/000b-b010-canonicalize
      IMPLEMENTATION_HEAD: 2047a3aa8b7063736a490d00d1fe10709aba23e2
      IMPLEMENTATION_MERGE: 215d52f4de772639c5e64193ff48deaafb6eb2d7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/000b-b010-canonicalize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Guard exact remote closeout entry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m pip install -e '.[dev]'
          git branch -f main "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B010 > /tmp/b010-entry.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011-entry.json; then
            echo 'B011 unexpectedly eligible before B010 closeout' >&2
            exit 1
          fi
          python -m mstr_qualify task drift > /tmp/drift-entry.json
          python - <<'PY'
          import json, os
          expected = os.environ['EXPECTED_MAIN']
          b10 = json.load(open('/tmp/b010-entry.json'))
          b11 = json.load(open('/tmp/b011-entry.json'))
          drift = json.load(open('/tmp/drift-entry.json'))
          assert b10['canonical_main'] == expected
          assert b10['eligible'] is True and b10['reasons'] == []
          assert b10['state_consistency_result']['observed_state'] == 'PENDING'
          assert b11['canonical_main'] == expected
          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state'] == 'BLOCKED'
          assert drift['canonical_main'] == expected
          assert drift['status'] == 'clean' and drift['findings'] == []
          print('B010_CLOSEOUT_REMOTE_ENTRY=PASS')
          PY
      - name: Materialize exact five-file closeout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          catalog = Path('configs/task-gate/mstr-000b.json')
          text = catalog.read_text(encoding='utf-8')
          old = '"B010": {\n      "canonical_state": "PENDING",'
          new = '"B010": {\n      "canonical_state": "COMPLETE_CANONICAL",'
          assert text.count(old) == 1
          catalog.write_text(text.replace(old, new, 1), encoding='utf-8')

          tasks = Path('specs/002-code-model-supremacy-foundation/tasks.md')
          text = tasks.read_text(encoding='utf-8')
          old = '- [ ] **B010 Freeze exact new-candidate qualification/access envelope.**  \n'
          new = '- [x] **B010 Freeze exact new-candidate qualification/access envelope.**\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          output_line = '  Outputs: `artifacts/manifests/B010-new-candidate-weight-access.json`, `evidence/mstr-000b/B010-weight-access-preflight.md`.\n'
          identity_line = '  Canonical implementation: PR #65 / final head `2047a3aa8b7063736a490d00d1fe10709aba23e2` / merge `215d52f4de772639c5e64193ff48deaafb6eb2d7`.\n'
          assert text.count(output_line) == 1
          assert identity_line not in text
          tasks.write_text(text.replace(output_line, output_line + identity_line, 1), encoding='utf-8')

          evidence = Path('evidence/mstr-000b/B010-weight-access-preflight.md')
          text = evidence.read_text(encoding='utf-8')
          assert text.count('**State:** IMPLEMENTED_PENDING_CANONICAL_CLOSEOUT\n') == 1
          text = text.replace('**State:** IMPLEMENTED_PENDING_CANONICAL_CLOSEOUT\n', '**State:** COMPLETE_CANONICAL\n', 1)
          marker = '**Public metadata evidence:** run `33161954193` / job `98818272943`\n'
          identity_lines = [
              '**Implementation PR:** `#65`',
              '**Final implementation head:** `2047a3aa8b7063736a490d00d1fe10709aba23e2`',
              '**Canonical implementation merge:** `215d52f4de772639c5e64193ff48deaafb6eb2d7`',
              '**Exact-head qualification:** run `33163285099` / job `98822614111`',
              '**Independent adversarial review:** run `33163317056` / job `98822713286`',
              '**Post-implementation verification:** run `33163418160` / job `98823047750`',
          ]
          identity = '\n'.join(identity_lines) + '\n'
          assert text.count(marker) == 1
          text = text.replace(marker, marker + identity, 1)
          old_tail = 'B010 freezes an access plan only. Because `new_weight_access_required_candidates[]` is non-empty, B011 requires separate exact founder authorization before any model-weight access. Continuation authority or completion of B010 is not that authorization.'
          new_tail = 'B010 freezes an access plan only. The `COMPLETE_CANONICAL` record is valid only when this closeout is present on canonical `main` and the required post-closeout exact-main verification has passed. Because `new_weight_access_required_candidates[]` is non-empty, B011 remains explicitly blocked and still requires separate exact founder authorization before any model-weight access. Continuation authority or completion of B010 is not that authorization.'
          assert text.count(old_tail) == 1
          evidence.write_text(text.replace(old_tail, new_tail, 1), encoding='utf-8')

          contract = Path('tests/contract/test_task_gate.py')
          text = contract.read_text(encoding='utf-8')
          start_marker = 'def test_b010_is_eligible_after_b009_closeout() -> None:\n'
          end_marker = '\ndef test_b006_fails_closed_when_b005_discovery_manifest_is_missing('
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement_lines = [
              'def test_b010_is_terminal_after_canonical_closeout() -> None:',
              '    result = evaluate_task_snapshot("B010", canonical_main=_CANONICAL_MAIN)',
              '',
              '    assert result["eligible"] is False',
              '    assert result["state_consistency_result"]["observed_state"] == "COMPLETE_CANONICAL"',
              '    assert result["state_consistency_result"]["satisfied"] is True',
              '    assert "task.already_terminal" in result["reasons"]',
              '    validate_instance("mstr-task-eligibility-v0", result)',
              '',
              '',
              'def test_b011_remains_blocked_after_b010_closeout() -> None:',
              '    result = evaluate_task_snapshot("B011", canonical_main=_CANONICAL_MAIN)',
              '',
              '    assert result["eligible"] is False',
              '    assert result["state_consistency_result"]["observed_state"] == "BLOCKED"',
              '    assert "task.blocked" in result["reasons"]',
              '    assert "task.unresolved_binding" in result["reasons"]',
              '    predecessor = next(row for row in result["prerequisite_results"] if row["task_id"] == "B010")',
              '    assert predecessor["satisfied"] is True',
              '    assert result["authority_result"]["required"] is True',
              '    assert result["authority_result"]["satisfied"] is False',
              '    validate_instance("mstr-task-eligibility-v0", result)',
              '',
              '',
          ]
          replacement = '\n'.join(replacement_lines)
          contract.write_text(text[:start] + replacement + text[end + 1:], encoding='utf-8')

          integration = Path('tests/integration/test_task_gate_cli.py')
          text = integration.read_text(encoding='utf-8')
          start_marker = 'def test_task_eligible_b010_successor_returns_zero(\n'
          end_marker = '\ndef test_task_eligible_configuration_error_returns_two('
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement_lines = [
              'def test_task_eligible_b010_terminal_returns_one(',
              '    monkeypatch: pytest.MonkeyPatch, capsys: pytest.CaptureFixture[str]',
              ') -> None:',
              '    expected = evaluate_task_snapshot("B010", canonical_main=_CANONICAL_MAIN)',
              '',
              '    def fake_evaluate_task_eligibility(task_id: str) -> dict[str, object]:',
              '        assert task_id == "B010"',
              '        return expected',
              '',
              '    monkeypatch.setattr(',
              '        "mstr_qualify.cli.evaluate_task_eligibility", fake_evaluate_task_eligibility',
              '    )',
              '    exit_code = main(["task", "eligible", "B010"])',
              '    payload = _stdout_json(capsys)',
              '    assert exit_code == 1',
              '    assert payload == expected',
              '    assert payload["eligible"] is False',
              '    assert "task.already_terminal" in payload["reasons"]',
              '    validate_instance("mstr-task-eligibility-v0", payload)',
              '',
              '',
              'def test_task_eligible_b011_blocked_returns_one(',
              '    monkeypatch: pytest.MonkeyPatch, capsys: pytest.CaptureFixture[str]',
              ') -> None:',
              '    expected = evaluate_task_snapshot("B011", canonical_main=_CANONICAL_MAIN)',
              '',
              '    def fake_evaluate_task_eligibility(task_id: str) -> dict[str, object]:',
              '        assert task_id == "B011"',
              '        return expected',
              '',
              '    monkeypatch.setattr(',
              '        "mstr_qualify.cli.evaluate_task_eligibility", fake_evaluate_task_eligibility',
              '    )',
              '    exit_code = main(["task", "eligible", "B011"])',
              '    payload = _stdout_json(capsys)',
              '    assert exit_code == 1',
              '    assert payload == expected',
              '    assert payload["eligible"] is False',
              '    assert "task.blocked" in payload["reasons"]',
              '    validate_instance("mstr-task-eligibility-v0", payload)',
              '',
              '',
          ]
          replacement = '\n'.join(replacement_lines)
          integration.write_text(text[:start] + replacement + text[end + 1:], encoding='utf-8')
          PY
          expected=$(printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B010-weight-access-preflight.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort)
          actual=$(git status --porcelain=v1 --untracked-files=all | sed 's/^...//' | sort)
          test "$actual" = "$expected"
          git diff --check
          git diff --quiet "$EXPECTED_MAIN" -- artifacts/manifests/B010-new-candidate-weight-access.json
          git add configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B010-weight-access-preflight.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(mstr-000b): canonicalize B010 closeout'
          candidate=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git diff --name-only "$EXPECTED_MAIN...$candidate" | wc -l)" -eq 5
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B010_LOCAL_CLOSEOUT_HEAD=$candidate"
      - name: Simulate closeout candidate as canonical main and run frozen gates
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git branch -f main "$candidate"
          git update-ref refs/remotes/origin/main "$candidate"
          if python -m mstr_qualify task eligible B010 > /tmp/b010-candidate.json; then
            echo 'B010 unexpectedly execution-eligible after closeout' >&2
            exit 1
          fi
          if python -m mstr_qualify task eligible B011 > /tmp/b011-candidate.json; then
            echo 'B011 unexpectedly eligible after B010 closeout' >&2
            exit 1
          fi
          python -m mstr_qualify task drift > /tmp/drift-candidate.json
          python - <<'PY'
          import json, subprocess
          candidate = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          b10 = json.load(open('/tmp/b010-candidate.json'))
          b11 = json.load(open('/tmp/b011-candidate.json'))
          drift = json.load(open('/tmp/drift-candidate.json'))
          assert b10['canonical_main'] == candidate
          assert b10['eligible'] is False
          assert b10['state_consistency_result']['observed_state'] == 'COMPLETE_CANONICAL'
          assert b10['state_consistency_result']['satisfied'] is True
          assert 'task.already_terminal' in b10['reasons']
          assert b11['canonical_main'] == candidate
          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state'] == 'BLOCKED'
          assert 'task.blocked' in b11['reasons']
          predecessor = next(row for row in b11['prerequisite_results'] if row['task_id'] == 'B010')
          assert predecessor['satisfied'] is True
          assert b11['authority_result']['required'] is True
          assert b11['authority_result']['satisfied'] is False
          assert drift['canonical_main'] == candidate
          assert drift['status'] == 'clean' and drift['findings'] == []
          print('B010_CLOSEOUT_LOCAL_EXACT_MAIN_SIMULATION=PASS')
          PY
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/contract/test_b010_new_candidate_weight_access.py
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
          git diff --check "$EXPECTED_MAIN...HEAD"
          git diff --quiet "$EXPECTED_MAIN" -- artifacts/manifests/B010-new-candidate-weight-access.json
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B010_CLOSEOUT_FROZEN_GATES=PASS'
      - name: Restore remote truth and push target only
        shell: bash
        run: |
          set -euo pipefail
          final=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$final"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo "B010_CLOSEOUT_HEAD=$final"
          echo "B010_CLOSEOUT_BUILDER_RUN=$GITHUB_RUN_ID"
          echo 'B011_STATE=BLOCKED'
          echo 'B011_EXACT_FOUNDER_AUTHORITY_REQUIRED=true'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'TRAINING_EXECUTION=NONE'
          echo 'PAID_COMPUTE=NONE'
