              '''## Source-Derived Harness and Research Primitives

Source-derived harness capability must earn its complexity. `MINIMAL_BASH_LINEAR_BASELINE` is the anti-complexity control for any richer harness/runtime surface. Promotion compares verifier-correct completion/DVCR, TTVC, LOC, dependency count, token overhead, startup latency, RSS, attack surface, portability, recovery burden, and deterministic replay.

Downstream harness work must use explicit records where applicable:

- `ExecutionBackendProfile` for subprocess/session/timeout/cancellation/reset/streaming/isolation/fallback semantics;
- `ResumableTaskCheckpoint` for small secret-free durable task state that never becomes authority;
- `ImprovementDecisionRecord` for immutable `KEEP | DISCARD | CRASH | INCONCLUSIVE` optimization history with protected evaluator separation;
- `RepositoryContextIndexProfile` for the staged `grep/find -> syntax/symbol -> token-budgeted repository map -> learned only when justified` context ladder.

Every copied or adapted primitive additionally requires a `SourceAdoptionRecord`. No source repository, benchmark claim, runtime, network service, or dependency is admitted by citation or source-use permission alone.'''
          )

          append_section(
              'docs/canonical/CODE_MODEL_SUPREMACY_STRATEGY.md',
              '## Source Capability Mining and Reconstruction Discipline',
              '''## Source Capability Mining and Reconstruction Discipline

MSTR may selectively mine proven implementation primitives, but model quality and product claims remain MSTR-evidence-only. Source-code permission does not admit source repositories as training/evaluation data and does not create model, training, compute, or external-effect authority.

The capability-mining order is fail-closed:

```text
SMALLEST_MSTR_NATIVE_INVARIANT
-> BOUNDED_PINNED_SOURCE_PRIMITIVE_WITH_SOURCE_ADOPTION_RECORD
-> PINNED_OPTIONAL_DEPENDENCY_WITH_NARROW_ADAPTER
-> WHOLE_REPOSITORY_ONLY_IF_NO_SMALLER_EQUIVALENT_EXISTS
```

Runtime acceleration is baseline-first: ordinary autoregressive reference, then compatible native acceleration already present in the pinned runtime, then custom/source-derived acceleration only when exact MSTR evidence proves the native path insufficient. Behavioral reconstruction becomes a distinct evaluation lane with evaluator-owned hidden tests, and donor benchmark/speed claims remain research signals rather than MSTR results.'''
          )

