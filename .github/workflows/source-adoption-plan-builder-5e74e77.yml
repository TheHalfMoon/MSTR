              '''## 8. Source Adoption and Capability Mining Amendment — 2026-09-08

### FR-030 — Source authority separation and adoption provenance

`SOURCE_CODE_PERMISSION` MUST remain distinct from data admission, model-weight authority, training authority, paid-compute authority, and external-effect authority. Any copied, adapted, vendored, or behaviorally reimplemented upstream primitive MUST bind a `SourceAdoptionRecord` before merge, including immutable revision, source scope, permission provenance, license/NOTICE, dependencies, security/evaluator review, behavior/equivalence evidence, footprint, update policy, and rollback.

### FR-031 — Minimal primitive and anti-complexity baseline

MSTR MUST prefer the smallest native invariant or bounded primitive over wholesale framework import. Harness/runtime additions MUST be compared with `MINIMAL_BASH_LINEAR_BASELINE`; dependency/LOC/token/RSS/latency/attack-surface cost without measured verifier-correct or TTVC benefit is a rejection condition.

### FR-032 — Execution backend and resumability contracts

Downstream harness planning MUST freeze `ExecutionBackendProfile` and secret-free `ResumableTaskCheckpoint` semantics for lifecycle, timeout, cancellation, streaming, reset/snapshot, isolation, fallback, durable evidence references, and live-state/authority revalidation on resume. A checkpoint MUST NOT create authority.

### FR-033 — Improvement decision and evaluator isolation

Automated prompt/tool/skill/harness improvement MUST preserve immutable `KEEP`, `DISCARD`, `CRASH`, or `INCONCLUSIVE` decisions in `ImprovementDecisionRecord`. Protected evaluator evidence MUST remain unavailable to the optimizer before candidate proposal, and the evaluator MUST NOT mutate the candidate under evaluation.

### FR-034 — Repository context index discipline

Repository retrieval MUST use a staged deterministic ladder with explicit token budget, invalidation, stale-index detection, offline/privacy boundary, and fallback. `RepositoryContextIndexProfile` derived state MUST remain subordinate to the checked-out repository tree.

### FR-035 — Training/runtime acceleration parity

A faster training backend requires `TrainingBackendParityRecord` against the reference path before promotion and remains behind separate training authority. Runtime acceleration MUST measure the pinned runtime's native capabilities before custom source-derived acceleration. Donor/vendor performance claims MUST NOT become MSTR evidence without exact reproduction.

### FR-036 — Behavioral reconstruction and source refresh safety

MSTR SHOULD preserve a bounded behavioral-reconstruction evaluation lane with evaluator-owned hidden tests. Every source refresh MUST pin the new revision, recheck license/NOTICE/transitive dependencies/security/equivalence/footprint where applicable, preserve a rollback target, and update the adoption record.

### Acceptance amendment

B032 MUST freeze these planning contracts and downstream obligations without executing them. B033 MUST independently red-team hidden authority expansion, evaluator leakage, mutable upstream dependencies, transitive assets, license/NOTICE loss, permission conflation, dependency bloat, stale indexes, checkpoint secret leakage, rollback failure, source-derived security regressions, and donor-claim misattribution. B034 cannot close until these additions and the existing B001-B033 requirements are satisfied.'''
