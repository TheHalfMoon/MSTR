              '''## Training Backend Parity Before Acceleration Promotion

An accelerated training backend such as Unsloth may not become canonical merely because it is faster or uses less memory. After exact training authority exists, any backend promotion must produce a `TrainingBackendParityRecord` against the reference implementation under identical admitted model/data/seed/update/objective identities.

Parity evidence covers trainable parameters, optimizer/scheduler semantics, loss trajectory tolerance, checkpoint serialization/resume, merged-weight or declared numerical tolerance, post-merge behavior, Q4 conversion where applicable, peak memory, wall time, and unexplained divergence. Divergence fails closed. The reference lane and accelerated lane remain implementation choices; neither creates training authority.

Source-code permission for a training framework does not admit datasets, model weights, training execution, paid compute, or network effects.'''
