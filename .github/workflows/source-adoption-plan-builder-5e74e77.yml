```

The older `BLOCKED_BY_EXACT_FOUNDER_AUTHORITY` description is superseded by exact machine-gate evidence; authority satisfaction is not B012 completion. The source-adoption amendment is planning/governance only and preserves completed B014-B030 history.'''
          )

          append_section(
