name: Reconstruct source adoption planning amendment

on:
  push:
    branches:
      - evidence/source-adoption-plan-builder-5e74e77

permissions:
  contents: write

env:
  TARGET_BRANCH: plan/mstr-source-adoption-capability-mining-v2-5e74e77
  PLAN_BASE: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
  PLAN_BASE_TREE: 66120bf247e7d9b9da34d5d47603493c8dce4c30
  OLD_PLAN_BRANCH: plan/mstr-source-adoption-capability-mining

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact target planning branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact reconstruction base
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PLAN_BASE" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$PLAN_BASE_TREE" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$PLAN_BASE" ]]

      - name: Reconstruct planning artifacts and canonical integrations
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$OLD_PLAN_BRANCH:refs/remotes/origin/$OLD_PLAN_BRANCH"
          git show "refs/remotes/origin/$OLD_PLAN_BRANCH:docs/canonical/MSTR_SOURCE_ADOPTION_AND_CAPABILITY_MINING_STRATEGY.md" > docs/canonical/MSTR_SOURCE_ADOPTION_AND_CAPABILITY_MINING_STRATEGY.md
          git show "refs/remotes/origin/$OLD_PLAN_BRANCH:specs/002-code-model-supremacy-foundation/research-source-adoption-2026-09-08.md" > specs/002-code-model-supremacy-foundation/research-source-adoption-2026-09-08.md
          git show "refs/remotes/origin/$OLD_PLAN_BRANCH:artifacts/manifests/MSTR-source-adoption-research-snapshot-2026-09-08.json" > artifacts/manifests/MSTR-source-adoption-research-snapshot-2026-09-08.json

          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')
          BASE = '5e74e77c1fc86d4ebc7e64654f45bd18f565edd6'
          BASE_TREE = '66120bf247e7d9b9da34d5d47603493c8dce4c30'

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              if not text.endswith('\n'):
                  text += '\n'
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_required(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise RuntimeError(f'missing required anchor in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          def append_section(path: str, marker: str, section: str) -> None:
              text = read(path)
              if marker in text:
                  raise RuntimeError(f'duplicate marker in {path}: {marker}')
              write(path, text.rstrip() + '\n\n' + section.strip() + '\n')

          # Revalidate and reconstruct the three preserved research artifacts.
          research_path = 'specs/002-code-model-supremacy-foundation/research-source-adoption-2026-09-08.md'
          revisions = {
              'c389f96a06005300336904239c409258129812c9': 'c389f96bf3a9b6807cb71ed6bdad5849be0df6d8',
              'd8563a7d213dd2472c18314992b9435527a11eaf': '04d809ceab9df28f9adaed044884180159172930',
              'a978f8924522bb72c0d5a876b3990d41d432decf': '5c995c365dfb1fd5bc56fda688be5d8538f9931f',
              '2a8d8b739a7be305f570963240f8f96ba62c90d0': '5dc9490bb35f9729ef2c95d00a19ccd30c26339c',
              'dbae8d5667c61f5f4b313b0169d8acd8f102373a': '1891e22b25bda4a4e88e23b3866c3ee7a127e3be',
          }
          text = read(research_path)
          for old, new in revisions.items():
              if old not in text:
                  raise RuntimeError(f'missing old source revision {old}')
              text = text.replace(old, new)
          text = text.replace('Status: PLANNING_RESEARCH_CANDIDATE', 'Status: CANONICAL_RESEARCH_INPUT_ON_MERGE')
          write(research_path, text)
          append_section(
              research_path,
              '## Revision re-verification on canonical planning base',
              f'''## Revision re-verification on canonical planning base

Planning base: `{BASE}`  
Planning-base tree: `{BASE_TREE}`  
Reverified: 2026-09-08

All 18 upstream refs in the research set were re-read before reconstruction. Thirteen remained at the previously observed immutable revisions. Five moved and are pinned here at their newly observed heads:

- `deepseek-ai/deepseek-harness@master` -> `c389f96bf3a9b6807cb71ed6bdad5849be0df6d8`
- `SWE-agent/mini-swe-agent@main` -> `04d809ceab9df28f9adaed044884180159172930`
- `SWE-agent/SWE-ReX@main` -> `5c995c365dfb1fd5bc56fda688be5d8538f9931f`
- `Aider-AI/aider@main` -> `5dc9490bb35f9729ef2c95d00a19ccd30c26339c`
- `ifm-ai/xllm@main` -> `1891e22b25bda4a4e88e23b3866c3ee7a127e3be`

Revision movement alone does not change a capability disposition. Any future copied/adapted primitive must independently reverify and bind the exact adopted revision in its `SourceAdoptionRecord`; this research snapshot is not runtime dependency authority.'''
          )

          snapshot_path = 'artifacts/manifests/MSTR-source-adoption-research-snapshot-2026-09-08.json'
          snapshot = json.loads(read(snapshot_path))
          snapshot['canonical_planning_base'] = BASE
          snapshot['canonical_planning_base_tree'] = BASE_TREE
          snapshot['revision_reverification'] = {
              'reverified_date': '2026-09-08',
              'source_count': 18,
              'unchanged_source_count': 13,
              'changed_source_count': 5,
              'changed_sources': [
                  'deepseek-harness',
                  'mini-swe-agent',
                  'swe-rex',
                  'aider',
                  'ifm-xllm',
              ],
          }
          by_id = {item['source_id']: item for item in snapshot['sources']}
          by_id['deepseek-harness']['observed_revision'] = 'c389f96bf3a9b6807cb71ed6bdad5849be0df6d8'
          by_id['mini-swe-agent']['observed_revision'] = '04d809ceab9df28f9adaed044884180159172930'
          by_id['swe-rex']['observed_revision'] = '5c995c365dfb1fd5bc56fda688be5d8538f9931f'
          by_id['aider']['observed_revision'] = '5dc9490bb35f9729ef2c95d00a19ccd30c26339c'
          by_id['ifm-xllm']['observed_revision'] = '1891e22b25bda4a4e88e23b3866c3ee7a127e3be'
          write(snapshot_path, json.dumps(snapshot, indent=2, sort_keys=False) + '\n')

          strategy_path = 'docs/canonical/MSTR_SOURCE_ADOPTION_AND_CAPABILITY_MINING_STRATEGY.md'
          replace_required(
              strategy_path,
              'Status: PLANNED_CANONICAL_AMENDMENT_CANDIDATE',
              'Status: CANONICAL_PLANNING_AMENDMENT_ON_MERGE',
          )
          append_section(
              strategy_path,
              '## 18. Canonical planning-base reconstruction',
              f'''## 18. Canonical planning-base reconstruction

This amendment was reconstructed from exact canonical `main` `{BASE}` rather than rebasing or merging the stale planning branch. The three prior research artifacts were treated only as source material, all 18 upstream refs were reverified, and five moved heads were repinned in the companion research snapshot.

Completed B014-B030 history remains closed and unchanged. B031 retains its existing exact prerequisites and authority semantics. B032 is the first remaining task that may freeze these source-adoption interfaces into downstream entry contracts; B033 independently red-teams the resulting design; B034 may close only after those obligations and all earlier canonical requirements are satisfied.

This planning amendment creates no model access, model execution, dataset admission, training, paid compute, external dispatch, or production-release authority.'''
          )

          # Reconcile the stale descriptive state without claiming B012 completion.
          state_path = 'docs/canonical/CURRENT_STATE.md'
          replace_required(state_path, '**Checkpoint:** 2026-09-05 Asia/Riyadh', '**Checkpoint:** 2026-09-08 Asia/Riyadh')
          replace_required(
              state_path,
              'CANONICAL_MAIN_AT_LATEST_RECONCILIATION = 8916fa7138ad56d18452b7a20db9c8cb982648ba',
              f'CANONICAL_MAIN_AT_LATEST_RECONCILIATION = {BASE}',
          )
          replace_required(
              state_path,
              'CANONICAL_TREE = b016ab6a3899accc352d8f177a2ba76451259f66',
              f'CANONICAL_TREE = {BASE_TREE}',
          )
          replace_required(
              state_path,
              'ACTIVE_IMPLEMENTATION_TASK = T031_AUTHORITY_AND_EXECUTION_RECONCILIATION / B012_EXACT_AUTHORITY_GATE / A019_A020_CONVERGENCE_GATES',
              'ACTIVE_IMPLEMENTATION_TASK = T031_AUTHORITY_AND_EXECUTION_RECONCILIATION / B012_EQUIVALENT_QUALIFICATION / B013_BLOCKED_BY_B012 / A019_A020_CONVERGENCE_GATES',
          )
          replace_required(
              state_path,
              'CURRENT_MSTR_000B_FRONTIERS = B012 / PENDING / BLOCKED_BY_EXACT_FOUNDER_AUTHORITY | B031 / PENDING / TRANSITIVELY_BLOCKED_BY_A019_A020_AND_B013',
              'CURRENT_MSTR_000B_FRONTIERS = B012 / PENDING / AUTHORITY_SATISFIED / EQUIVALENT_QUALIFICATION_INCOMPLETE | B013 / BLOCKED_BY_B012 | B031 / PENDING / TRANSITIVELY_BLOCKED_BY_A019_A020_AND_B013',
          )
          append_section(
              state_path,
              '## 2026-09-08 Source-adoption and B012 reconciliation',
              f'''## 2026-09-08 Source-adoption and B012 reconciliation

Exact live verification on canonical planning base `{BASE}` established:

```text
B012_CANONICAL_STATE = PENDING
B012_REQUIRED_AUTHORITY = B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION
B012_AUTHORITY_RESULT = SATISFIED
B012_ELIGIBLE_ON_EXACT_MAIN = true
B012_COMPLETE_CANONICAL = false
B013 = BLOCKED_BY_B012
SOURCE_ADOPTION_AMENDMENT = CANONICAL_ON_THIS_PLAN_MERGE
SOURCE_CODE_PERMISSION_CREATES_DATA_ADMISSION = false
