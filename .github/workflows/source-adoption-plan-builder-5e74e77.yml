name: Reconstruct source adoption planning amendment

on:
  push:
    branches:
      - evidence/source-adoption-plan-builder-5e74e77

permissions:
  contents: write

env:
  TARGET_BRANCH: plan/mstr-source-adoption-capability-mining-v2-5e74e77
  BUILDER_BRANCH: evidence/source-adoption-plan-builder-5e74e77
  OLD_PLAN_BRANCH: plan/mstr-source-adoption-capability-mining
  PLAN_BASE: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
  PLAN_BASE_TREE: 66120bf247e7d9b9da34d5d47603493c8dce4c30

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: evidence/source-adoption-plan-builder-5e74e77
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare exact planning branch
        run: |
          set -euo pipefail
          cp .github/scripts/reconstruct_source_adoption_plan.py /tmp/reconstruct_source_adoption_plan.py
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git fetch origin "refs/heads/$OLD_PLAN_BRANCH:refs/remotes/origin/$OLD_PLAN_BRANCH"
          git checkout -B "$TARGET_BRANCH" "refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$PLAN_BASE"
          test "$(git show -s --format=%T HEAD)" = "$PLAN_BASE_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PLAN_BASE"

      - name: Reconstruct bounded amendment
        run: |
          set -euo pipefail
          git show "refs/remotes/origin/$OLD_PLAN_BRANCH:docs/canonical/MSTR_SOURCE_ADOPTION_AND_CAPABILITY_MINING_STRATEGY.md" > docs/canonical/MSTR_SOURCE_ADOPTION_AND_CAPABILITY_MINING_STRATEGY.md
          git show "refs/remotes/origin/$OLD_PLAN_BRANCH:specs/002-code-model-supremacy-foundation/research-source-adoption-2026-09-08.md" > specs/002-code-model-supremacy-foundation/research-source-adoption-2026-09-08.md
          git show "refs/remotes/origin/$OLD_PLAN_BRANCH:artifacts/manifests/MSTR-source-adoption-research-snapshot-2026-09-08.json" > artifacts/manifests/MSTR-source-adoption-research-snapshot-2026-09-08.json
          python /tmp/reconstruct_source_adoption_plan.py
          printf '%s\n' \
            artifacts/manifests/MSTR-source-adoption-research-snapshot-2026-09-08.json \
            docs/canonical/MSTR_SOURCE_ADOPTION_AND_CAPABILITY_MINING_STRATEGY.md \
            specs/002-code-model-supremacy-foundation/research-source-adoption-2026-09-08.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_source_adoption_plan.py \
            | sort > /tmp/expected-files
          git add -N \
            artifacts/manifests/MSTR-source-adoption-research-snapshot-2026-09-08.json \
            docs/canonical/MSTR_SOURCE_ADOPTION_AND_CAPABILITY_MINING_STRATEGY.md \
            specs/002-code-model-supremacy-foundation/research-source-adoption-2026-09-08.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_source_adoption_plan.py
          git status --short
          git diff --name-only "$PLAN_BASE" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Qualify reconstructed bytes
        run: |
          set -euo pipefail
          python -m pytest -q tests/contract/test_source_adoption_plan.py tests/contract/test_task_gate.py tests/contract/test_convergence_external_bindings.py
          python -m mstr_qualify validate
          python -m pytest -q
          ruff check tests/contract/test_source_adoption_plan.py
          ruff format --check tests/contract/test_source_adoption_plan.py
          mypy

      - name: Guard and publish planning branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PLAN_BASE"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$PLAN_BASE"
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add artifacts/manifests/MSTR-source-adoption-research-snapshot-2026-09-08.json \
                  docs/canonical/MSTR_SOURCE_ADOPTION_AND_CAPABILITY_MINING_STRATEGY.md \
                  specs/002-code-model-supremacy-foundation/research-source-adoption-2026-09-08.md \
                  specs/002-code-model-supremacy-foundation/tasks.md \
                  tests/contract/test_source_adoption_plan.py
          git commit -m "docs(plan): integrate source adoption capability mining"
          test "$(git rev-parse HEAD^)" = "$PLAN_BASE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
