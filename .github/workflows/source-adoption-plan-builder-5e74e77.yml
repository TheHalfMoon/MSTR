              '''## Source Adoption and Capability Mining Amendment — 2026-09-08

MSTR-000B now carries a source-adoption governance lane into its remaining convergence work without reopening completed B014-B030 tasks.

```text
SOURCE_CODE_PERMISSION
  != DATA_ADMISSION
