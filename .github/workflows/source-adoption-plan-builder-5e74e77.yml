Frontier acceleration may mine bounded source primitives only under `MSTR_SOURCE_ADOPTION_AND_CAPABILITY_MINING_STRATEGY.md`. Every adopted primitive binds an immutable upstream revision and `SourceAdoptionRecord`; mutable branch dependencies and runtime auto-update are not acceptable baseline product paths.

