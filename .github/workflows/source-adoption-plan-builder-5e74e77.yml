              '''## 15. Source Adoption and Capability Mining Research — 2026-09-08

The dedicated companion `research-source-adoption-2026-09-08.md` evaluates 18 source repositories under a minimal-primitive, local-first, evaluator-isolated adoption policy. The companion machine snapshot pins the reverified upstream heads and preserves planned dispositions as `ADOPT_PRIMITIVE`, `REFERENCE_BASELINE`, `STUDY_METHOD`, or `REJECT_FOR_CORE` per capability.

The main new research conclusions are: source provenance must be first-class; source-code permission must not be conflated with data/model/training authority; a minimal bash harness is an anti-complexity control; execution backends and long-task checkpoints need normalized contracts; self-improvement needs immutable decisions and protected evaluation; repository indexing needs a deterministic staged ladder; accelerated training requires semantic/artifact parity; native pinned-runtime acceleration precedes custom acceleration; behavioral reconstruction deserves a distinct evaluation lane; and upstream churn must have explicit update/rollback governance.

These findings do not reopen completed B014-B030 work and create no external-effect authority.'''
