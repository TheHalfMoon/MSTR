name: Prove B018 canonical entry gate

on:
  push:
    branches:
      - evidence/b018-entry-73b60aa

permissions:
  contents: read

jobs:
  entry:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 73b60aa9421f51be52560bbbca6e8dd46b77b6c9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain)"
      - run: python -m pip install -e '.[dev]'
      - name: Prove B018 eligible and canonical drift clean
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task drift > /tmp/drift.json
          python -m mstr_qualify task eligible B018 > /tmp/b018.json
          set +e
          python -m mstr_qualify task eligible B011 > /tmp/b011.json
          b011_rc=$?
          set -e
          test "$b011_rc" -ne 0
          python - <<'PY'
          import json
          drift=json.load(open('/tmp/drift.json'))
          b18=json.load(open('/tmp/b018.json'))
          b11=json.load(open('/tmp/b011.json'))
          assert drift['status']=='clean' and drift['findings']==[]
          assert b18['canonical_main']=='73b60aa9421f51be52560bbbca6e8dd46b77b6c9'
          assert b18['eligible'] is True and b18['reasons']==[]
          assert b18['state_consistency_result']['observed_state']=='PENDING'
          assert b18['authority_result']['required'] is False
          assert len(b18['prerequisite_results'])==1
          assert b18['prerequisite_results'][0]['task_id']=='B014'
          assert b18['prerequisite_results'][0]['observed_state']=='COMPLETE_CANONICAL'
          assert b18['prerequisite_results'][0]['satisfied'] is True
          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state']=='BLOCKED'
          assert b11['authority_result']['required'] is True
          assert b11['authority_result']['satisfied'] is False
          PY
      - name: Entry quality smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          pytest -q tests/contract/test_data_constitution.py tests/contract/test_software_evolution_contract.py
      - name: Final immutable main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
