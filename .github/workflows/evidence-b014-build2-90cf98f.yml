name: Repair and qualify B014 Data Constitution

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 90cf98f5f87b64f8e6da50a8444b1b598148f945
      TARGET_BRANCH: feat/000b-b014-data-constitution-v2
      SOURCE_HEAD: 14ddc497f12d92ebe67f9f87072af60b383c1253
      SOURCE_WORKFLOW: .github/workflows/evidence-b014-build-90cf98f.yml
      DONOR_HEAD: 2ad16ed19c159897ce0f31730e016fac1c06afa9
      ENTRY_RUN: '33164424310'
      ENTRY_JOB: '98826328509'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/000b-b014-data-constitution-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind exact unchanged target and source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH" evidence/b014-build-90cf98f
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/evidence/b014-build-90cf98f)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B014_REPAIR_BINDING=PASS'

      - name: Extract original builder steps and patch donor whitespace cleanup
        shell: bash
        run: |
          set -euo pipefail
          git show "$SOURCE_HEAD:$SOURCE_WORKFLOW" > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/source.yml').read_text(encoding='utf-8')

          def extract(step_name: str, destination: str) -> None:
              marker = f'      - name: {step_name}\n'
              start = source.index(marker)
              run_marker = '        run: |\n'
              body_start = source.index(run_marker, start) + len(run_marker)
              next_step = source.find('\n      - name: ', body_start)
              raw = source[body_start:] if next_step == -1 else source[body_start:next_step]
              lines = raw.splitlines()
              body = [line[10:] if line.startswith('          ') else line for line in lines]
              Path(destination).write_text('\n'.join(body) + '\n', encoding='utf-8')

          extract('Bind exact B014 entry and stale donor only', '/tmp/guard.sh')
          extract('Recover reviewed B014 contract and integrate canonical runtime surfaces', '/tmp/materialize.sh')
          extract('Qualify exact local B014 implementation candidate', '/tmp/qualify.sh')
          extract('Restore live refs and push target only', '/tmp/push.sh')

          materialize = Path('/tmp/materialize.sh').read_text(encoding='utf-8')
          needle = "expected=$(printf '%s\\n' \\\n"
          assert materialize.count(needle) == 1
          cleanup = "python - <<'PY_CLEAN'\nfrom pathlib import Path\np = Path('docs/data/MSTR_DATA_CONSTITUTION.md')\nlines = p.read_text(encoding='utf-8').splitlines()\np.write_text('\\n'.join(line.rstrip() for line in lines) + '\\n', encoding='utf-8')\nPY_CLEAN\n\n"
          Path('/tmp/materialize.sh').write_text(materialize.replace(needle, cleanup + needle, 1), encoding='utf-8')
          PY
          bash -n /tmp/guard.sh
          bash -n /tmp/materialize.sh
          bash -n /tmp/qualify.sh
          bash -n /tmp/push.sh
          echo 'B014_REPAIR_EXTRACTION=PASS'

      - name: Re-prove exact B014 entry
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/guard.sh

      - name: Materialize repaired B014 candidate
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/materialize.sh

      - name: Run full B014 qualification
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/qualify.sh

      - name: Restore live refs and push target only after PASS
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/push.sh
          echo "B014_REPAIR_RUN=$GITHUB_RUN_ID"
