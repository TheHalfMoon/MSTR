name: Guard B026 exact-head review repair 6

on:
  push:
    branches: [evidence/b026-review-repair6-d2950bb]

permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: read

env:
  BASE_SHA: 823cd7ec3b4c537876a0795d0f0f8d4bd75acd85
  OLD_HEAD: d2950bb1f254beedbac64268347c735f21e500c9
  OLD_TREE: 0817e9fc29c40557e46765b8db72d60cf74f9283
  TARGET_BRANCH: feat/000b-b026-research-ladder
  PR_NUMBER: '137'
  QUALIFICATION_RUN: '33667724453'
  REVIEW_COMMENT_ID: '5514766559'
  GH_TOKEN: ${{ github.token }}

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify exact entry, qualification, and fresh review findings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$OLD_HEAD"
          test "$(git rev-parse "$OLD_HEAD^{tree}")" = "$OLD_TREE"
          pr="$(gh api repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER)"
          jq -e --arg base "$BASE_SHA" --arg head "$OLD_HEAD" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head' <<<"$pr"
          qualification="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$QUALIFICATION_RUN)"
          jq -e '.status == "completed" and .conclusion == "success"' <<<"$qualification"
          review="$(gh api repos/${GITHUB_REPOSITORY}/issues/comments/$REVIEW_COMMENT_ID)"
          jq -e '.user.login == "coderabbitai[bot]"' <<<"$review"
          body="$(jq -r '.body' <<<"$review")"
          grep -F "$OLD_HEAD" <<<"$body"
          grep -F "$OLD_TREE" <<<"$body"
          grep -F 'Positive network resource evidence can bypass the network-model/teacher authority requirement' <<<"$body"
          grep -F 'Gate outcomes still depend on a self-authored verifier-evidence assertion' <<<"$body"
          cp .github/scripts/b026_review_repair6.py /tmp/repair6.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/repair6.py')
          text = path.read_text(encoding='utf-8')
          old = 'evidence_path.write_text(evidence.rstrip() + append + "\\n", encoding="utf-8")'
          new = 'evidence_path.write_text(evidence.rstrip() + append, encoding="utf-8")'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one B026 evidence EOF writer')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile /tmp/repair6.py
          git checkout --detach "$OLD_HEAD"
          test -z "$(git status --porcelain)"

      - name: Build bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/repair6.py
          git diff --check
          test -z "$(git diff --name-only -- specs/002-code-model-supremacy-foundation/tasks.md configs/task-gate/mstr-000b.json artifacts/authorities)"
          cmp schemas/mstr-research-experiment-v2.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-research-experiment-v2.schema.json
          cmp schemas/mstr-material-result-identity-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-material-result-identity-v0.schema.json
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add -A
          git commit -m 'fix(mstr-000b): bind B026 verifier evidence'
          test "$(git rev-parse HEAD^)" = "$OLD_HEAD"
          test -z "$(git status --porcelain)"

      - name: Install development gates
        run: python -m pip install -e '.[dev]'

      - name: Format candidate and preserve one repair commit
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format src/mstr_qualify/schemas.py tests/contract/test_research_ladder_contract.py
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mstr_qualify/schemas.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '                f"$.hard_gate_results[{index}]: verifier manifest identity must be content-addressed"\n':
                  '                f"$.hard_gate_results[{index}]: verifier manifest identity "\n'
                  '                "must be content-addressed"\n',
              '                        f"$.hard_gate_results[{index}]: unsupported verifier manifest schema_version"\n':
                  '                        f"$.hard_gate_results[{index}]: unsupported verifier manifest "\n'
                  '                        "schema_version"\n',
              '                        f"$.hard_gate_results[{index}]: verifier manifest evaluation identity mismatch"\n':
                  '                        f"$.hard_gate_results[{index}]: verifier manifest evaluation "\n'
                  '                        "identity mismatch"\n',
              '                        f"$.hard_gate_results[{index}]: verifier health evaluation identity mismatch"\n':
                  '                        f"$.hard_gate_results[{index}]: verifier health evaluation "\n'
                  '                        "identity mismatch"\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one lint target: {old.strip()}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m ruff format src/mstr_qualify/schemas.py tests/contract/test_research_ladder_contract.py
          git diff --check
          if ! git diff --quiet; then
            git add src/mstr_qualify/schemas.py tests/contract/test_research_ladder_contract.py
            git commit --amend --no-edit
          fi
          test "$(git rev-parse HEAD^)" = "$OLD_HEAD"
          test -z "$(git status --porcelain)"
          test -z "$(git diff --name-only "$BASE_SHA...HEAD" -- specs/002-code-model-supremacy-foundation/tasks.md configs/task-gate/mstr-000b.json artifacts/authorities)"
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"

      - name: Re-prove canonical machine frontier
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          git update-ref refs/heads/main "$candidate"
          git update-ref refs/remotes/origin/main "$candidate"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B026 > /tmp/b026.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0' /tmp/b026.json
          set +e
          mstr-qualify task eligible B027 > /tmp/b027.json; r27=$?
          mstr-qualify task eligible B011 > /tmp/b011.json; r11=$?
          set -e
          test "$r27" -eq 1
          test "$r11" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING"' /tmp/b027.json
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"

      - name: Focused B026 tests
        run: python -m pytest tests/contract/test_research_ladder_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py -q

      - name: Offline validation
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m mstr_qualify validate tests/fixtures/schemas/valid/mstr-research-experiment-v2.json
          set +e
          python -m mstr_qualify validate tests/fixtures/schemas/invalid/mstr-research-experiment-v2.json; rc=$?
          set -e
          test "$rc" -eq 1

      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src

      - name: Prove fresh review repairs and unchanged authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/mstr_qualify/schemas.py').read_text(encoding='utf-8')
          tests = Path('tests/contract/test_research_ladder_contract.py').read_text(encoding='utf-8')
          required_source = (
              'network_byte_total += network_bytes',
              'network_bytes > 0',
              'NETWORK_MODEL_OR_TEACHER_CALL',
              'verifier-manifests',
              'verifier-health',
              'subject-evidence',
              'verifier-results',
              'subject material evidence must exactly',
              'canonical verifier result missing',
              'observed_value = verifier_result.get("observed_value")',
          )
          missing = [marker for marker in required_source if marker not in source]
          if missing:
              raise SystemExit(f'missing repair markers: {missing}')
          required_tests = (
              'test_positive_network_bytes_require_network_effect_declaration',
              'test_verifier_evidence_rejects_unresolvable_underlying_result',
              'test_verifier_subject_evidence_must_match_material_result',
          )
          missing_tests = [marker for marker in required_tests if marker not in tests]
          if missing_tests:
              raise SystemExit(f'missing adversarial repair tests: {missing_tests}')
          if 'observed_value = source_record.get("observed_value")' in source:
              raise SystemExit('self-authored verifier observation path still present')
          PY
          jq -e '.promotion_policy.network_resource_evidence_authority_required == true and .promotion_policy.verifier_underlying_artifact_resolution_required == true' configs/research/mstr-research-ladder-v0.json
          jq -e '.canonical_resolution.verifier_evidence_record_contract.observed_value_is_forbidden_in_wrapper == true and .canonical_resolution.subject_evidence_record_contract.must_exactly_match_experiment_material_result == true and .canonical_resolution.verifier_result_record_contract.must_bind_manifest_health_and_subject == true' configs/research/mstr-research-ladder-v0.json
          grep -F '5514766559' evidence/mstr-000b/B026-research-ladder.md
          for marker in 'MODEL_WEIGHT_ACCESS = NONE' 'MODEL_EXECUTION = NONE' 'RESEARCH_CAMPAIGN_EXECUTION = NONE' 'PAID_COMPUTE = NONE' 'NETWORK_MODEL_OR_TEACHER_CALL = NONE' 'LARGE_DATASET_INGESTION = NONE' 'WEIGHT_CHANGING_TRAINING = NONE' 'LARGE_SCALE_RL = NONE' 'PRODUCTION_RELEASE = NONE'; do grep -F "$marker" evidence/mstr-000b/B026-research-ladder.md; done
          test -z "$(git diff --name-only "$BASE_SHA...HEAD" -- specs/002-code-model-supremacy-foundation/tasks.md configs/task-gate/mstr-000b.json artifacts/authorities)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"

      - name: Guarded fast-forward publication
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$OLD_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$OLD_HEAD"
          pr="$(gh api repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER)"
          jq -e --arg base "$BASE_SHA" --arg head "$OLD_HEAD" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head' <<<"$pr"
          git push origin "$candidate:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$candidate"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          echo "B026_REVIEW_REPAIR6_HEAD=$candidate"
