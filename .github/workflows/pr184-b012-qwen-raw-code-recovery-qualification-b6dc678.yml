name: PR184 B012 Qwen raw-code recovery qualification

on:
  push:
    branches:
      - evidence/pr184-b012-qwen-raw-code-recovery-qualification-b6dc678

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: 7ebb02c3c46c64d226d412def8bc88fd5f2c1594
      SUBJECT_BRANCH: fix/b012-qwen-raw-code-runner-shutdown-recovery
      SUBJECT_SHA: b6dc678ab63676b817342821c9cf5ecfec1f0a9f
      SUBJECT_TREE: 7d049e8069b3284b767da14b882e3462ff478589
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Prove exact base subject tree and six-file containment
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            "artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json"
            "artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-run-34155931982.json"
            "colab/mstr_b012_qwen_raw_code_recovery.py"
            "configs/workflows/b012-qwen-raw-code-recovery.yml"
            "evidence/B012-qwen-raw-code-runner-shutdown-34155931982.md"
            "tests/contract/test_b012_qwen_raw_code_recovery.py"
          )
          [[ "${#changed[@]}" -eq 6 ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- .github/workflows/b012-qualify.yml
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- artifacts/manifests/B012-executor-toolchain-binding.json
          git cat-file -e "$SUBJECT_SHA:.github/workflows/b012-qwen-raw-code-recovery.yml" 2>/dev/null && exit 1 || true

      - name: Reverify B012 machine eligibility on actual canonical main
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligibility.json
          python - <<'PY'
          import json
          import os
          data = json.load(open('/tmp/b012-eligibility.json', encoding='utf-8'))
          assert data['task_id'] == 'B012'
          assert data['canonical_main'] == os.environ['BASE_SHA']
          assert data['eligible'] is True
          assert data['authority_result']['satisfied'] is True
          assert data['state_consistency_result']['observed_state'] == 'PENDING'
          PY
          git checkout --detach "$SUBJECT_SHA"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]

      - name: Verify incident identities recovery digests and inert boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest_path = Path('artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json')
          incident_path = Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-run-34155931982.json')
          runner_path = Path('colab/mstr_b012_qwen_raw_code_recovery.py')
          workflow_path = Path('configs/workflows/b012-qwen-raw-code-recovery.yml')
          active_path = Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          binding = json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          manifest = json.loads(manifest_path.read_text())
          incident = json.loads(incident_path.read_text())

          assert manifest['status'] == 'INERT_PENDING_SEPARATE_ACTIVATION'
          assert manifest['candidate_id'] == 'qwen3.5-0.8b-control'
          assert manifest['prior_run_id'] == 34155931982
          assert manifest['prior_stage05_artifact_id'] == 10031329744
          assert manifest['prior_stage05_artifact_digest'] == 'sha256:726e154a9e94c67eea4b0bdec5440912af6055e46cac9f95861872a044616fee'
          assert manifest['prior_stage05_checkpoint_sha256'] == '2141781456f54623e6b87c9e7528ea767f49062670fbb62b77d639b3ec3d1f88'
          assert manifest['expected_q4_k_m_sha256'] == '47f87d507130b70d7b54a159e7bf982e4fbe7dc75eae74e3cd9c9c9284805626'
          assert manifest['expected_q4_k_m_size_bytes'] == 541903296
          assert manifest['incident_evidence_sha256'] == digest(incident_path)
          assert manifest['recovery_script_sha256'] == digest(runner_path)
          assert manifest['recovery_workflow_sha256'] == digest(workflow_path)
          assert not active_path.exists()
          assert 'qwen_raw_code_recovery_manifest_sha256' not in binding
          assert manifest['activation']['separate_activation_pr_required'] is True
          assert manifest['activation']['retry_authority_created'] is False
          assert manifest['activation']['external_dispatch_authority_created'] is False
          assert manifest['qualification_boundary']['model_access'] == 'NONE'
          assert manifest['qualification_boundary']['model_execution'] == 'NONE'
          assert manifest['qualification_boundary']['training'] is False
          assert manifest['qualification_boundary']['paid_cost_usd'] == 0.0
          assert incident['workflow_run_id'] == 34155931982
          assert incident['workflow_job_id'] == 101847640786
          assert incident['durable_artifact_count'] == 5
          assert incident['last_durable_stage'] == 'decode'
          assert incident['interrupted_stage'] == 'raw-code'
          assert incident['interrupted_step_conclusion'] == 'cancelled'
          assert incident['raw_code_result'] == 'NONE'
          assert incident['model_quality_verdict'] == 'NONE'
          assert incident['candidate_admission_decision'] == 'NONE'
          assert incident['retry_authority_created'] is False
          assert incident['external_dispatch_authority_created'] is False
          scope = manifest['recovery_scope']
          assert scope['rerun_prefill'] is False
          assert scope['rerun_decode'] is False
          assert scope['run_raw_code_proxy'] is True
          assert scope['candidate_expansion'] is False
          assert scope['revision_or_file_expansion'] is False
          source = runner_path.read_text()
          assert 'llama-bench' not in source
          assert 'measure_set_bounded' not in source
          assert 'target="llama-quantize"' in source
          assert 'target="llama-cli"' in source
          print(f"RECOVERY_MANIFEST_SHA256={digest(manifest_path)}")
          print(f"RECOVERY_SCRIPT_SHA256={digest(runner_path)}")
          print(f"RECOVERY_WORKFLOW_SPEC_SHA256={digest(workflow_path)}")
          print(f"INCIDENT_SHA256={digest(incident_path)}")
          PY

      - name: Run focused B012 recovery and preserved contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m py_compile colab/mstr_b012_qwen_raw_code_recovery.py
          python -m mstr_qualify validate

      - name: Run full quality gate
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m mypy src/mstr_qualify

      - name: Final live subject and canonical-main guard
        run: |
          set -euo pipefail
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          echo 'PR184_QUALIFICATION=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
