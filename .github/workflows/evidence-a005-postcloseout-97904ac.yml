name: Verify A005 canonical post-closeout

on:
  push:
    branches:
      - evidence/a005-postcloseout-97904ac

permissions:
  contents: read
  pull-requests: read

env:
  MERGE_SHA: 97904ac5ad17e7142e88944ee83dbb304ecb197f
  BASE_SHA: 3c8d817d27948bffefaacc589eb10ec2733ecbd4
  CLOSEOUT_HEAD: 6ddffbeb500558da95492c4fbc02af6b467f7a8d
  EXPECTED_TREE: 23eabeaf1c5231f04af01c6ba90dac3b43b413f4
  PR_NUMBER: '93'

jobs:
  merge_identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97904ac5ad17e7142e88944ee83dbb304ecb197f
          fetch-depth: 0
      - name: Prove exact A005 closeout merge identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$CLOSEOUT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -e --arg merge "$MERGE_SHA" --arg head "$CLOSEOUT_HEAD" '.state == "closed" and .merged == true and .merge_commit_sha == $merge and .head.sha == $head'
          mapfile -t actual < <(git diff --name-only "$BASE_SHA" "$MERGE_SHA" | sort)
          expected=(
            evidence/mstr-000a/A005-build-loop.md
            specs/001-agent-harness-verified-loop-foundation/tasks.md
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}" | sort)

  canonical_quality_frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97904ac5ad17e7142e88944ee83dbb304ecb197f
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove A005 terminal canonical state and next blockers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/unit/test_build_loop.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src
          grep -Fq -- '- [x] **A005 Implement `MSTR-BUILD-LOOP-v0` bounded state graph.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -Fq '**State:** `COMPLETE_CANONICAL`' evidence/mstr-000a/A005-build-loop.md
          grep -Fq -- '- [ ] **A006 Implement protected finalizer / verifier boundary.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          git update-ref refs/heads/main "$MERGE_SHA"
          git update-ref refs/remotes/origin/main "$MERGE_SHA"
          if mstr-qualify task eligible B023 > /tmp/b023.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:A006")) != null and (.reasons | index("prerequisite.unsatisfied:A014")) != null' /tmp/b023.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          echo "A005_COMPLETE_CANONICAL=YES"
          echo "A006_MANUAL_EARLY_SAFE_FRONTIER=PENDING_REVALIDATION"
          echo "EXTERNAL_EFFECT=NONE"

  complete:
    needs: [merge_identity, canonical_quality_frontier]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97904ac5ad17e7142e88944ee83dbb304ecb197f
          fetch-depth: 0
      - name: Final immutable canonical-main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$CLOSEOUT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
