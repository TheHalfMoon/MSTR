name: PR175 B012 reconciliation independent review d688f59

on:
  push:
    branches:
      - evidence/pr175-b012-reconciliation-independent-review-d688f59

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  substantive_governance_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d688f5922a427a25dd48f27c607603edc4e74de1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify immutable review subject and prior qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          HEAD=d688f5922a427a25dd48f27c607603edc4e74de1
          TREE=569fb23fe58a16bd15383e44666ca8284c3a8d02
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/governance/pr174-b012-merge-race-reconciliation | awk '{print $1}')" = "$HEAD"
          test "$(git diff --name-only "$BASE".."$HEAD")" = 'evidence/B012-pr174-merge-race-reconciliation.md'
          git diff --check "$BASE".."$HEAD"
          python - <<'PY'
          import json, os, urllib.request
          headers={
            'Authorization':f'Bearer {os.environ["GH_TOKEN"]}',
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
          }
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as resp:
                  return json.load(resp)
          run=get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34052869726')
          assert run['conclusion']=='success'
          jobs=get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34052869726/jobs?per_page=100')['jobs']
          by={j['name']:j['conclusion'] for j in jobs}
          assert by['canonical_eligibility']=='success'
          assert by['exact_head']=='success'
          assert by['final']=='success'
          pr=get('https://api.github.com/repos/TheHalfMoon/MSTR/pulls/175')
          assert pr['state']=='open'
          assert pr['head']['sha']=='d688f5922a427a25dd48f27c607603edc4e74de1'
          assert pr['base']['sha']=='a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          assert pr['changed_files']==1
          print('REVIEW_SUBJECT_IDENTITY=PASS')
          print('QUALIFICATION_RUN_34052869726=PASS')
          PY
      - name: Independent substantive governance assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          text=Path('evidence/B012-pr174-merge-race-reconciliation.md').read_text(encoding='utf-8')
          authority=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          envelope=json.loads(Path('artifacts/manifests/B012-equivalent-qualification-execution-envelope.json').read_text(encoding='utf-8'))
          binding=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text(encoding='utf-8'))

          assert 'PR174_MANDATORY_PREMERGE_FINAL_GUARD = FAILURE' in text
          assert 'RETROACTIVE_PREMERGE_PASS = PROHIBITED' in text
          assert 'The failed final premerge guard remains a failure.' in text
          assert 'RESULT_CLASSIFICATION = B012_EXECUTION_FAILED_CLOSED' in text
          assert 'ERROR = llama-bench timed out after 900s' in text
          assert 'MODEL_QUALITY_VERDICT = NONE' in text
          assert 'CANONICAL_B012_RESULT = false' in text
          assert 'No score, promotion, admission, or rejection inference may be drawn from this run.' in text
          assert 'This reconciliation does not authorize a retry.' in text
          assert 'any applicable recovery-policy or new-evidence requirements' in text
          assert 'A canonical retry is permitted' not in text
          assert 'This artifact creates no new Founder authority and authorizes no external effect by itself.' in text

          assert authority['status']=='AUTHORIZED_CANONICAL'
          expected=['mellum-4b','qwen3.5-0.8b-control']
          assert authority['scope']['candidate_ids']==expected
          assert binding['candidate_ids']==expected
          assert envelope['candidate_ids']==expected
          for key in ('new_candidate_access','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert authority['scope'][key] is False,key
          boundary=binding['execution_boundary']
          for key in ('authority_transfer','candidate_revision_or_file_expansion','new_candidates','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert boundary[key] is False,key
          assert boundary['paid_cost_usd']==0.0
          assert boundary['git_model_binaries']==0
          assert boundary['founder_machine_model_binaries']==0

          assert 'NEW_CANDIDATES = false' in text
          assert 'REVISION_EXPANSION = false' in text
          assert 'FILE_EXPANSION = false' in text
          assert 'AUTHORITY_TRANSFER = false' in text
          assert 'TRAINING = false' in text
          assert 'PAID_COMPUTE = false' in text
          assert 'PAID_MODEL_API = false' in text
          assert 'PRODUCTION_RELEASE = false' in text

          print('PR175_SUBSTANTIVE_GOVERNANCE_REVIEW=PASS')
          print('HISTORICAL_FAILURE_PRESERVATION=PASS')
          print('DRIFT_TIMEOUT_CLASSIFICATION=PASS')
          print('RETRY_AUTHORITY_CREATED=false')
          print('AUTHORITY_EXPANSION=false')
          print('FINDINGS=NONE')
          print('MODEL_ACCESS=NONE')
          print('TRAINING=false')
          print('PAID_COST_USD=0.0')
          PY
      - name: Focused regression and frozen repository checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          test -z "$(git status --porcelain)"
      - name: Final immutable review-subject guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = 'a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/governance/pr174-b012-merge-race-reconciliation | awk '{print $1}')" = 'd688f5922a427a25dd48f27c607603edc4e74de1'
          echo 'PR175_INDEPENDENT_REVIEW_FINAL=PASS'
