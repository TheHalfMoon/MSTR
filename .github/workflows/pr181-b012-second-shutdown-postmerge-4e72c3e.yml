name: PR181 B012 second shutdown postmerge

on:
  push:
    branches:
      - evidence/pr181-b012-second-shutdown-postmerge-4e72c3e

permissions:
  contents: read

env:
  MERGE_SHA: 4e72c3e1a4e196ad67d932c71c896511968da08e
  MERGE_TREE: 206b3d85404b76a08cc323904eff18ed1d31e604
  OLD_MAIN: d9fbf070c425b3da378655cbbd8f656d1a8b7b90
  SUBJECT_SHA: 97b2fbea7493b2499546a0f9c7933ee212002764
  INCIDENT_EVIDENCE_SHA256: f20f8a1048392932d477c521329566341f0c1a13115caa3091bb27dfcb38df75

jobs:
  postmerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Prove exact merge topology tree and live main
        run: |
          set -euo pipefail
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$MERGE_TREE" ]]
          [[ "$(git show -s --format=%P HEAD)" == "$OLD_MAIN $SUBJECT_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" == "$MERGE_SHA" ]]

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify canonical B012 state and fail-closed dispatch
        run: |
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligibility.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          data = json.load(open('/tmp/b012-eligibility.json', encoding='utf-8'))
          assert data['task_id'] == 'B012'
          assert data['canonical_main'] == os.environ['MERGE_SHA']
          assert data['eligible'] is True
          assert data['state_consistency_result']['observed_state'] == 'PENDING'
          binding = json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          assert binding['status'] == 'BLOCKED_PENDING_RUNNER_SHUTDOWN_TOPOLOGY_REPAIR'
          second = binding['repeated_runner_shutdown_recovery']
          assert second['run_id'] == 34068813113
          assert second['same_failure_class_recurred'] is True
          assert second['same_single_job_execution_topology'] is True
          assert second['repeating_same_topology_authorized_by_this_evidence'] is False
          assert second['model_quality_verdict'] == 'NONE'
          assert second['candidate_execution_completion'] == 'NOT_PROVEN'
          assert second['retry_authority_created'] is False
          incident = Path('artifacts/results/equivalent/B012/failures/B012-mellum-4b-run-34068813113.json')
          assert hashlib.sha256(incident.read_bytes()).hexdigest() == os.environ['INCIDENT_EVIDENCE_SHA256']
          PY

      - name: Run canonical focused and full quality verification
        run: |
          python -m pytest -q tests/contract/test_b012_authority.py tests/contract/test_b012_executor_binding.py tests/contract/test_b012_runner_shutdown_evidence.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check tests/contract/test_b012_executor_binding.py tests/contract/test_b012_runner_shutdown_evidence.py
          python -m mypy src/mstr_qualify

      - name: Final live canonical guard
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" == "$MERGE_SHA" ]]
          echo 'PR181_POSTMERGE=PASS'
          echo 'B012_BINDING_STATUS=BLOCKED_PENDING_RUNNER_SHUTDOWN_TOPOLOGY_REPAIR'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
