name: PR196 B012 staged shutdown independent semantic review

on:
  push:
    branches:
      - evidence/pr196-b012-staged-shutdown-independent-review-c8b6043

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: TheHalfMoon/MSTR
      PR: '196'
      BASE: 98feee7765cbf64428f149f885519cef76800caf
      HEAD: c8b604384073227ca99833bfa0085e30b2b7b5ac
      TREE: aa43402ec11fbff58ebe830d2bea47fbe0599d30
      QUAL_RUN: '34243869812'
      QUAL_HEAD: 8e62220ff629103b9c9bc181c7af3590d1fd9fa6
      SUBJECT_BRANCH: governance/b012-qwen-staged-recovery-runner-shutdown-34231845282
      INCIDENT_SHA256: a067895cc6f0356b917d896f7da59faab0db4dcd27c29d76bc157968c2d8134b
      FAILURE_CLASS: B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_PARTIAL_DURABLE_PROGRESS_RAW_CODE_UNPROVEN
      BLOCKED_STATUS: BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact reviewed subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove exact subject, PR, and qualification identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$SUBJECT_BRANCH)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          jq -e --arg head "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' /tmp/qual.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==8' /tmp/pr.json >/dev/null

      - name: Prove exact incident-only scope and immutable execution surfaces
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            'artifacts/manifests/B012-executor-toolchain-binding.json'
            'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-staged-recovery-run-34231845282.json'
            'evidence/mstr-000b/B012-qwen-staged-recovery-runner-shutdown-34231845282.md'
            'tests/contract/test_b012_executor_binding.py'
            'tests/contract/test_b012_qwen_raw_code_recovery.py'
            'tests/contract/test_b012_qwen_staged_recovery_topology.py'
            'tests/contract/test_b012_runner_shutdown_evidence.py'
            'tests/contract/test_b012_stage_checkpoint_topology.py'
          )
          [[ ${#actual[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done
          git diff --check "$BASE...$HEAD"
          for path in \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B010-new-candidate-weight-access.json \
            artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_governance.py \
            colab/mstr_b012_executor.py \
            colab/mstr_b012_qwen_raw_code_recovery_staged.py \
            configs/workflows/b012-qwen-raw-code-recovery-staged.yml \
            .github/workflows/b012-qwen-raw-code-recovery.yml; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Independently review incident truth and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          incident_path=Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-staged-recovery-run-34231845282.json')
          binding_path=Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          authority_path=Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json')
          incident=json.loads(incident_path.read_text(encoding='utf-8'))
          binding=json.loads(binding_path.read_text(encoding='utf-8'))
          authority=json.loads(authority_path.read_text(encoding='utf-8'))

          assert hashlib.sha256(incident_path.read_bytes()).hexdigest()==os.environ['INCIDENT_SHA256']
          assert authority['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert authority['task_id']=='B012'
          assert authority['status']=='AUTHORIZED_CANONICAL'
          assert incident['schema_version']=='mstr.b012-infrastructure-cancellation.v1'
          assert incident['task_id']=='B012'
          assert incident['candidate_id']=='qwen3.5-0.8b-control'
          assert incident['run_id']==34231845282
          assert incident['job_id']==102079676195
          assert incident['workflow_conclusion']=='failure'
          assert incident['canonical_main_at_start']==os.environ['BASE']
          assert incident['workflow_head_sha']==os.environ['BASE']
          assert incident['shutdown_occurred_before_workflow_timeout_budget'] is True
          assert incident['failure_classification']==os.environ['FAILURE_CLASS']
          assert incident['infrastructure_root_cause']=='UNKNOWN_BEYOND_RUNNER_SHUTDOWN_SIGNAL'
          assert incident['durable_stage_count']==3
          assert incident['durable_stages']==['init','source','quantize']
          assert incident['durable_artifact_count']==3
          assert [x['stage'] for x in incident['durable_artifacts']]==['init','source','quantize']
          assert incident['source_verification']['status']=='EXACT_B010_QWEN_FILES_REACQUIRED_AND_VERIFIED'
          assert incident['source_verification']['file_count']==9
          assert incident['source_verification']['total_download_bytes']==1769897109
          assert incident['regenerated_q4']['status']=='EXACT_PRIOR_Q4_IDENTITY_REPRODUCED'
          assert incident['regenerated_q4']['matches_prior_stage03'] is True
          assert incident['raw_code_stage_conclusion']=='cancelled'
          assert incident['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert incident['raw_code_checkpoint_artifact']=='NONE'
          assert incident['finalize_stage_conclusion']=='skipped'
          assert incident['final_evidence_artifact']=='NONE'
          assert incident['explicit_cleanup_step_conclusion']=='skipped'
          assert incident['ephemeral_cleanup_completion']=='NOT_PROVEN'
          assert incident['candidate_execution_completion']=='NOT_PROVEN'
          assert incident['candidate_admission_decision']=='NONE'
          assert incident['model_quality_verdict']=='NONE'
          assert incident['durable_binary_artifacts'] is False
          assert incident['training'] is False
          assert incident['paid_cost_usd']==0.0
          assert incident['paid_model_api'] is False
          assert incident['candidate_expansion'] is False
          assert incident['revision_or_file_expansion'] is False
          assert incident['retry_authority_created'] is False
          assert incident['external_dispatch_authority_created'] is False
          assert incident['same_staged_topology_redispatch_authorized_by_this_evidence'] is False
          assert incident['separate_topology_repair_required'] is True

          assert binding['status']==os.environ['BLOCKED_STATUS']
          shutdown=binding['qwen_raw_code_staged_recovery_runner_shutdown']
          assert shutdown['run_id']==incident['run_id']
          assert shutdown['job_id']==incident['job_id']
          assert shutdown['failure_classification']==incident['failure_classification']
          assert shutdown['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert shutdown['candidate_admission_decision']=='NONE'
          assert shutdown['model_quality_verdict']=='NONE'
          assert shutdown['retry_authority_created'] is False
          assert shutdown['external_dispatch_authority_created'] is False
          assert shutdown['same_staged_topology_redispatch_authorized_by_this_evidence'] is False
          assert shutdown['separate_topology_repair_required'] is True
          print('SEMANTIC_REVIEW=PASS')
          PY

      - name: Independently prove no model execution or authority expansion was introduced
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          diff=subprocess.check_output(['git','diff','--unified=0',f"{os.environ['BASE']}...{os.environ['HEAD']}"], text=True)
          forbidden_added=(
              'B012_RECOVER_RAW_CODE_STAGED qwen3.5-0.8b-control 34155931982',
              'huggingface.co',
              'hf_hub_download',
              'snapshot_download',
              'llama-cli',
              'llama-bench',
              'convert_hf_to_gguf.py',
              'llama-quantize',
          )
          added='\n'.join(line[1:] for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++'))
          for token in forbidden_added:
              assert token not in added, token
          print('NO_EXECUTION_SURFACE_EXPANSION=PASS')
          PY

      - name: Independent focused and full quality confirmation
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify

      - name: Final immutable review guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/final-pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head' /tmp/final-pr.json >/dev/null
          echo 'INDEPENDENT_SEMANTIC_REVIEW=SUCCESS'
