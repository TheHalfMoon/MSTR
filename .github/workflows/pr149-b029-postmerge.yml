name: Post-merge verification PR 149 B029

on:
  push:
    branches:
      - evidence/pr149-b029-postmerge

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_PREVIOUS_MAIN: 1179515986ee2311ec1cd675fd899a6143c03761
  EXPECTED_HEAD: f449f81fc3e7343052b54b09b0481d64963d7e2f
  EXPECTED_MERGE: b3223bb384d8723c37a28526be691cedf8174dc3
  EXPECTED_TREE: 40c3521fe0b6119c50eacc711675c72139887d51
  PR_NUMBER: '149'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MERGE }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact merge topology and live main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PREVIOUS_MAIN"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_MERGE"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg head "$EXPECTED_HEAD" --arg merge "$EXPECTED_MERGE" '.state == "closed" and .merged == true and .head.sha == $head and .merge_commit_sha == $merge' /tmp/pr.json >/dev/null
          echo 'PR149_MERGE_TOPOLOGY=PASS'

      - name: Verify implementation landed without premature closeout
        shell: bash
        run: |
          set -euo pipefail
          cmp schemas/mstr-adaptive-inference-policy-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-adaptive-inference-policy-v0.schema.json
          cmp schemas/mstr-selective-context-config-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-selective-context-config-v0.schema.json
          grep -F 'IMPLEMENTED_PENDING_CANONICAL_CLOSEOUT' evidence/mstr-000b/B029-adaptive-inference.md
          grep -F -- '- [ ] **B029 Freeze adaptive test-time compute + selective-context policy.**' specs/002-code-model-supremacy-foundation/tasks.md
          python - <<'PY'
          import json
          data=json.load(open('configs/task-gate/mstr-000b.json', encoding='utf-8'))
          assert data['tasks']['B029']['canonical_state'] == 'PENDING'
          print('B029_PREMATURE_CLOSEOUT=NO')
          PY

      - name: Install merged tooling
        run: python -m pip install -e '.[dev]'

      - name: Focused B029 contract suite
        run: python -m pytest -q tests/contract/test_adaptive_inference_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py::test_validate_self_checks_schemas_and_fixtures

      - name: Full test suite
        run: python -m pytest -q

      - name: Ruff
        run: python -m ruff check .

      - name: Canonical mypy
        run: python -m mypy src

      - name: Offline validation
        run: python -m mstr_qualify validate

      - name: Final live main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_MERGE"
          echo 'B029_IMPLEMENTATION_POSTMERGE=PASS'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
          echo 'PRODUCTION_RELEASE=NONE'
