name: Guard B004 canonical closeout build v4

on:
  push:
    branches:
      - evidence/b004-closeout-build-fa90726-v4

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: fa90726a6415cab0b655acae4768c7343cc6370c
      TARGET_BRANCH: docs/000b-b004-canonicalize
      EXPECTED_TARGET: fa90726a6415cab0b655acae4768c7343cc6370c
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout evidence builder
        uses: actions/checkout@v4
        with:
          ref: evidence/b004-closeout-build-fa90726-v4
          fetch-depth: 1
          path: evidence
          persist-credentials: false

      - name: Checkout exact closeout target
        uses: actions/checkout@v4
        with:
          ref: docs/000b-b004-canonicalize
          fetch-depth: 0
          path: target
          persist-credentials: true

      - name: Verify live closeout preconditions
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET"
          test -z "$(git status --short)"

      - name: Apply bounded B004 closeout transition
        run: python evidence/.github/evidence/b004_closeout_apply.py target

      - name: Verify five-file closeout scope
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              "configs/task-gate/mstr-000b.json",
              "specs/002-code-model-supremacy-foundation/tasks.md",
              "evidence/mstr-000b/B004-000a-sequence-reconciliation.md",
              "tests/contract/test_task_gate.py",
              "tests/integration/test_task_gate_cli.py",
          }
          changed = set(subprocess.run(["git", "diff", "--name-only"], check=True, capture_output=True, text=True).stdout.splitlines())
          assert changed == expected, (changed, expected)
          PY
          python -m py_compile tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py

      - name: Commit candidate locally without pushing
        id: candidate
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/task-gate/mstr-000b.json specs/002-code-model-supremacy-foundation/tasks.md evidence/mstr-000b/B004-000a-sequence-reconciliation.md tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          git commit -m "docs(mstr-000b): canonicalize B004 closeout"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET"
          test -z "$(git status --short)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install development tooling
        working-directory: target
        run: python -m pip install -e '.[dev]'

      - name: Verify closeout candidate transition
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.candidate.outputs.sha }}"
          git branch -f main "$candidate"
          git update-ref refs/remotes/origin/main "$candidate"
          b004_code=0
          python -m mstr_qualify task eligible B004 > /tmp/b004.json || b004_code=$?
          cat /tmp/b004.json
          test "$b004_code" = "1"
          python - <<'PY'
          import json
          with open('/tmp/b004.json', encoding='utf-8') as fh:
              payload=json.load(fh)
          assert payload['eligible'] is False
          assert payload['state_consistency_result']['observed_state'] == 'COMPLETE_CANONICAL'
          assert 'task.already_terminal' in payload['reasons']
          PY
          python -m mstr_qualify task eligible B005 > /tmp/b005.json
          cat /tmp/b005.json
          python - <<'PY'
          import json
          with open('/tmp/b005.json', encoding='utf-8') as fh:
              payload=json.load(fh)
          assert payload['eligible'] is True
          assert payload['reasons'] == []
          PY
          drift_code=0
          python -m mstr_qualify task drift > /tmp/drift.json || drift_code=$?
          cat /tmp/drift.json
          test "$drift_code" = "0"
          python - <<'PY'
          import json
          with open('/tmp/drift.json', encoding='utf-8') as fh:
              payload=json.load(fh)
          assert payload['status'] == 'clean', payload
          assert payload['findings'] == [], payload
          PY

      - name: Targeted governance tests
        working-directory: target
        run: pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_task_drift.py tests/integration/test_task_drift_cli.py

      - name: Frozen gate - pytest
        working-directory: target
        run: pytest -q

      - name: Frozen gate - Ruff
        working-directory: target
        run: ruff check src tests

      - name: Frozen gate - mypy
        working-directory: target
        run: mypy

      - name: Frozen gate - offline validate
        working-directory: target
        run: python -m mstr_qualify validate

      - name: Guarded fast-forward closeout push
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.candidate.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "$candidate"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET"
          test -z "$(git status --short)"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "B004_CLOSEOUT_CANDIDATE=$candidate"
