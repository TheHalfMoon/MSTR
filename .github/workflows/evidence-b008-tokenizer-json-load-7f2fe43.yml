name: Verify B008 tokenizer.json loadability

on:
  push:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 7f2fe43797db4b94103ca07c172de5672806f624
      TARGET_BRANCH: feat/000b-b008-tokenizer-economics
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Guard exact entry and install fixed tokenizer runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]' 'huggingface_hub==0.34.4' 'tokenizers==0.22.0'
          python -m mstr_qualify task eligible B008 > /tmp/b008.json
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json, os
          e=json.load(open('/tmp/b008.json')); d=json.load(open('/tmp/drift.json')); m=os.environ['EXPECTED_MAIN']
          assert e['canonical_main']==m and e['eligible'] is True and e['reasons']==[], e
          assert d['canonical_main']==m and d['status']=='clean' and d['findings']==[], d
          print('B008_TOKENIZER_JSON_ENTRY=PASS')
          PY
      - name: Download only pinned tokenizer.json files and load locally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from tokenizers import Tokenizer
          pairs=[
            ('granite-4.1-3b','ibm-granite/granite-4.1-3b-base','dacb9cb9157bec98e99b09f285c92a4d58405c96'),
            ('mellum-4b','JetBrains/Mellum-4b-base','83cce2605fbdf6a3868627e9b0a5924e0072b94d'),
            ('ministral-3-3b','mistralai/Ministral-3-3B-Base-2512','6f9c4b12a95b139af68670a6713616b757923735'),
            ('qwen2.5-coder-1.5b','Qwen/Qwen2.5-Coder-1.5B','df3ce67c0e24480f20468b6ef2894622d69eb73b'),
            ('qwen3-4b','Qwen/Qwen3-4B-Base','906bfd4b4dc7f14ee4320094d8b41684abff8539'),
            ('qwen3.5-0.8b-control','Qwen/Qwen3.5-0.8B-Base','dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68'),
            ('qwen3.5-2b','Qwen/Qwen3.5-2B-Base','b1485b2fa6dfa1287294f269f5fb618e03d52d7c'),
            ('qwen3.5-4b','Qwen/Qwen3.5-4B-Base','1001bb4d826a52d1f399e183466143f4da7b741b'),
            ('smollm3-3b','HuggingFaceTB/SmolLM3-3B-Base','d78a42f79198603e614095753484a04c10c2b940'),
            ('yi-coder-1.5b','01-ai/Yi-Coder-1.5B','00e59e64f47d3c78e4cfbdd345888479797e8109'),
          ]
          root=Path('/tmp/b008-tokenizer-json'); root.mkdir(parents=True,exist_ok=True)
          rows=[]
          for cid,repo,rev in pairs:
              path=Path(hf_hub_download(repo_id=repo,filename='tokenizer.json',revision=rev,local_dir=str(root/cid),token=False))
              assert path.name=='tokenizer.json'
              raw=path.read_bytes()
              tok=Tokenizer.from_file(str(path))
              enc=tok.encode('def b008_probe(x: int) -> int:\n    return x + 1\n', add_special_tokens=False)
              assert len(enc.ids)>0
              rows.append({'candidate_id':cid,'repository':repo,'revision':rev,'file':'tokenizer.json','bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'implementation_class':tok.__class__.__name__,'probe_tokens':len(enc.ids)})
          assert len(rows)==10
          print('B008_TOKENIZER_JSON_LOADS='+json.dumps(rows,sort_keys=True,separators=(',',':')))
          shutil.rmtree(root)
          print('B008_TOKENIZER_JSON_LOAD_COUNT=10')
          print('B008_TOKENIZER_JSON_CLEANUP=PASS')
          PY
      - name: Final target and main immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/b008-tokenizer-json
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          echo 'B008_REMOTE_FILES_PER_CANDIDATE=tokenizer.json-only'
          echo 'B008_TARGET_MUTATION=NONE'
