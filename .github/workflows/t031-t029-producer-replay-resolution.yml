name: T031 T029 producer replay dependency resolution

on:
  push:
    branches:
      - evidence/t031-t029-producer-replay-resolution

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 119a9bcca1c97b9edbcacd6d8d457b31206bb162
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Resolve evidence-bounded T029 producer replay environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t031-resolution
          cat > /tmp/t031-direct-requirements.txt <<'EOF'
          numpy==2.4.6
          torch==2.13.0
          sentencepiece==0.2.2
          protobuf==7.36.0
          gguf==0.19.0
          safetensors==0.8.0
          transformers==5.15.1
          EOF
          python -m pip install \
            --dry-run \
            --ignore-installed \
            --report /tmp/t031-resolution/pip-report.json \
            --index-url https://pypi.org/simple/ \
            -r /tmp/t031-direct-requirements.txt
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import platform
          import subprocess
          import sys
          from pathlib import Path

          report_path = Path('/tmp/t031-resolution/pip-report.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          direct = {
              'numpy': '2.4.6',
              'torch': '2.13.0',
              'sentencepiece': '0.2.2',
              'protobuf': '7.36.0',
              'gguf': '0.19.0',
              'safetensors': '0.8.0',
              'transformers': '5.15.1',
          }
          resolved = []
          observed_direct = {}
          for item in report.get('install', []):
              metadata = item.get('metadata', {})
              name = str(metadata.get('name', '')).lower().replace('_', '-')
              version = str(metadata.get('version', ''))
              download = item.get('download_info', {})
              archive = download.get('archive_info', {})
              hashes = archive.get('hashes', {})
              sha256 = hashes.get('sha256')
              url = download.get('url')
              if not name or not version or not isinstance(url, str) or not isinstance(sha256, str):
                  raise SystemExit(f'incomplete resolver identity for {name or "<unknown>"}')
              resolved.append({
                  'name': name,
                  'version': version,
                  'url': url,
                  'sha256': sha256,
                  'requested': bool(item.get('requested', False)),
              })
              if name in direct:
                  observed_direct[name] = version
          if observed_direct != direct:
              raise SystemExit(f'direct requirement resolution drift: {observed_direct!r}')
          resolved.sort(key=lambda entry: (entry['name'], entry['version'], entry['url']))
          payload = {
              'schema_version': 'mstr.t031-t029-producer-replay-resolution.v1',
              'purpose': 'DEPENDENCY_RESOLUTION_ONLY_NO_MODEL_ACCESS',
              'source_main': '119a9bcca1c97b9edbcacd6d8d457b31206bb162',
              'historical_t029_runner_python': '3.11.16',
              'historical_workflow_semantics': [
                  'pip install numpy torch --index-url https://pypi.org/simple/',
                  'pip install sentencepiece protobuf gguf safetensors transformers',
              ],
              'replay_direct_requirements': direct,
              'resolution_note': (
                  'Direct versions are reconstructed from package availability at the '
                  '2026-08-26 T029 execution boundary; transitive versions are resolver '
                  'outputs from this evidence run and are not claimed as historical until '
                  'separately justified or proven by exact artifact reproduction.'
              ),
              'python': platform.python_version(),
              'pip': subprocess.check_output([sys.executable, '-m', 'pip', '--version'], text=True).strip(),
              'resolved_packages': resolved,
              'pip_report_sha256': hashlib.sha256(report_path.read_bytes()).hexdigest(),
              'model_access': 'NONE',
              'training': False,
              'paid_cost_usd': 0.0,
          }
          out = Path('/tmp/t031-resolution/t031-t029-producer-replay-resolution.json')
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'RESOLVED_PACKAGE_COUNT={len(resolved)}')
          print('MODEL_ACCESS=NONE')
          print('PAID_COST_USD=0.0')
          PY

      - name: Upload dependency-resolution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t031-t029-producer-replay-resolution
          path: /tmp/t031-resolution/*.json
          if-no-files-found: error
          retention-days: 14
