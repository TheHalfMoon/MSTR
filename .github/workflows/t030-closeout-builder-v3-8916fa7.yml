name: Build bounded T030 canonical closeout

on:
  push:
    branches:
      - evidence/t030-closeout-builder-v3-8916fa7

permissions:
  contents: write

jobs:
  build_closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout target branch
        uses: actions/checkout@v4
        with:
          ref: closeout/000-t030-canonical
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8916fa7138ad56d18452b7a20db9c8cb982648ba"
          test "$(git rev-parse HEAD^{tree})" = "b016ab6a3899accc352d8f177a2ba76451259f66"

      - name: Apply bounded governance closeout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tasks_path = Path("specs/000-universal-laptop-interaction-contract/tasks.md")
          tasks = tasks_path.read_text(encoding="utf-8")
          old_task = "- [ ] T030 [US1] Implement/qualify portable CPU runtime adapters; acceleration is separate bonus data → `src/mstr_qualify/runtimes/<runtime>.py`, `configs/runtimes/*.json`, `tests/integration/test_runtime_adapters.py`, `evidence/T030-runtime-adapters.md`."
          new_task = old_task.replace("- [ ]", "- [x]", 1)
          assert tasks.count(old_task) == 1, "T030 task checkbox source drift"
          tasks = tasks.replace(old_task, new_task, 1)
          tasks_path.write_text(tasks, encoding="utf-8")

          state_path = Path("docs/canonical/CURRENT_STATE.md")
          state = state_path.read_text(encoding="utf-8")
          replacements = {
              "CANONICAL_MAIN_AT_LATEST_RECONCILIATION = 29df1b4be142407fbd31e13dca00e525dd729365": "CANONICAL_MAIN_AT_LATEST_RECONCILIATION = 8916fa7138ad56d18452b7a20db9c8cb982648ba",
              "CANONICAL_TREE = 15fb0a0088e1be09d1071c960dbea1fd91df5cb5": "CANONICAL_TREE = b016ab6a3899accc352d8f177a2ba76451259f66",
              "ACTIVE_IMPLEMENTATION_TASK = T030_CURRENT_MAIN_RECONCILIATION / B012_EXACT_AUTHORITY_GATE": "ACTIVE_IMPLEMENTATION_TASK = T031_AUTHORITY_AND_EXECUTION_RECONCILIATION / B012_EXACT_AUTHORITY_GATE",
              "## Canonical History Through T029 + A004": "## Canonical History Through T030 + A004",
              "T000-T029 = COMPLETE_CANONICAL": "T000-T030 = COMPLETE_CANONICAL",
              "T030 = LEGACY_PR_#96_EXISTS / CURRENT_MAIN_RECONCILIATION_REQUIRED / NOT_COMPLETE_CANONICAL": "T030_IMPLEMENTATION_PR = #165 / MERGE 8916fa7138ad56d18452b7a20db9c8cb982648ba\nT030_POSTMERGE_RUN = 33972551215 / SUCCESS\nT030_CLOSEOUT = COMPLETE_CANONICAL_ON_THIS_CLOSEOUT_MERGE\nT031 = NEXT / MATERIAL_EXECUTION_AUTHORITY_AND_EPHEMERAL_ARTIFACT_RECONCILIATION_REQUIRED / NOT_COMPLETE_CANONICAL",
          }
          for old, new in replacements.items():
              assert state.count(old) == 1, f"CURRENT_STATE source drift: {old}"
              state = state.replace(old, new, 1)
          state_path.write_text(state, encoding="utf-8")

          evidence_path = Path("evidence/T030-runtime-adapters.md")
          evidence = evidence_path.read_text(encoding="utf-8")
          old_state = "**State:** `CURRENT_MAIN_RECONCILIATION / FINAL_SECURITY_HARDENING_CANDIDATE / QUALIFICATION_PENDING / NOT_COMPLETE_CANONICAL`"
          new_state = "**State:** `IMPLEMENTATION_MERGED / POSTMERGE_VERIFIED / CLOSEOUT_CANDIDATE / COMPLETE_CANONICAL_ON_CLOSEOUT_MERGE`"
          assert evidence.count(old_state) == 1, "T030 evidence state source drift"
          evidence = evidence.replace(old_state, new_state, 1)
          marker = "## Canonical Closeout Lifecycle"
          assert marker not in evidence, "closeout lifecycle already present"
          evidence += """

## Canonical Closeout Lifecycle

The current-main T030 reconciliation completed the governed implementation lifecycle on one exact final hardened head. Historical PR #96 remains provenance only and was never merged into current main.

```text
IMPLEMENTATION_PR = #165
IMPLEMENTATION_HEAD = 0462786550d24096272b7541ab286e838b4a1c2e
IMPLEMENTATION_TREE = b016ab6a3899accc352d8f177a2ba76451259f66
EXACT_HEAD_QUALIFICATION = 33971815139 / SUCCESS / evidence f48819767b1d571819736562aba22e84a84b3a85
SECOND_EXACT_HEAD_QUALIFICATION = 33971878391 / SUCCESS / evidence b23bc1c7401262bfd41af33bfc1562295e7acc54
INDEPENDENT_SEMANTIC_SECURITY_REVIEW = 33972061731 / SUCCESS / evidence 540d3346863f8be053e8ac199703a884a33998da
REVIEW_SUBMISSION = 5121599106 / COMMENTED / FINDINGS_NONE
MANDATORY_PREMERGE = 33972305104 / SUCCESS / evidence 62e7684531a788c22888eadcfc6e8d09b0c54e96
MERGE = 8916fa7138ad56d18452b7a20db9c8cb982648ba
MERGE_TREE = b016ab6a3899accc352d8f177a2ba76451259f66
POSTMERGE = 33972551215 / SUCCESS / evidence c6ae1aeb25bed755e86515d6914fb871e1f5a164
```

The successful postmerge replay on exact canonical main recorded:

```text
T030_FOCUSED_TESTS = 45 PASSED
MSTR_QUALIFY_VALIDATE = PASS / 30 VALID FIXTURES / 30 INVALID FIXTURES REJECTED
FULL_PYTEST = 1354 PASSED
RUFF = PASS
MYPY = PASS / 45 SOURCE FILES
FINAL_POSTMERGE_GUARD = PASS
```

This closeout is governance-only. It does not reacquire deleted model binaries, execute a model/runtime pair, regenerate Q4 artifacts, widen the T027/T028 candidate envelope, create B012 authority, authorize paid compute, or create T031 material execution authority.

## Completion Boundary

```text
T030_IMPLEMENTATION_LIFECYCLE = COMPLETE
T030_CLOSEOUT_STATE = COMPLETE_CANONICAL_ON_MERGE
T030_COMPLETE_CANONICAL = YES_ON_CLOSEOUT_MERGE
T031_EXECUTION_AUTHORITY = NOT_CREATED_BY_T030
B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION = ABSENT
```

Upon merge of this bounded closeout, T030 is `COMPLETE_CANONICAL`. T031 remains a separate material measurement task and must bind exact current authority plus artifact/runtime/hardware identity before external execution.
"""
          evidence_path.write_text(evidence, encoding="utf-8")
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/canonical/CURRENT_STATE.md evidence/T030-runtime-adapters.md specs/000-universal-laptop-interaction-contract/tasks.md | sort)"
          test "$changed" = "$expected"

      - name: Commit and push bounded closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add docs/canonical/CURRENT_STATE.md evidence/T030-runtime-adapters.md specs/000-universal-laptop-interaction-contract/tasks.md
          git commit -m "docs(mstr-000): close T030 canonically"
          git push origin HEAD:closeout/000-t030-canonical
