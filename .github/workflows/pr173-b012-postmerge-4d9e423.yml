name: PR173 B012 postmerge 4d9e423

on:
  push:
    branches:
      - evidence/pr173-b012-postmerge-4d9e423

permissions:
  contents: read

jobs:
  exact_merge_gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4d9e423f7fa2aa6d4f706d5c9ad61dafb24b2513
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify exact canonical merge identity
        shell: bash
        run: |
          set -euo pipefail
          MAIN=4d9e423f7fa2aa6d4f706d5c9ad61dafb24b2513
          TREE=0d62b79860d7f6468238491de0a97846d3fd1de0
          test "$(git rev-parse HEAD)" = "$MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN"
          git merge-base --is-ancestor 9aa9d221e8b0be9d8af5d1e9efb2b11b89c13b6b "$MAIN"
          echo 'PR173_POSTMERGE_IDENTITY=PASS'
      - name: Run postmerge frozen gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_b012_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_governance.py \
            colab/mstr_b012_source.py \
            colab/mstr_b012_artifacts.py \
            colab/mstr_b012_raw_code.py \
            colab/mstr_b012_execute.py \
            tests/contract/test_b012_executor_binding.py
          python -m mypy src/mstr_qualify
          git diff --exit-code
          git diff --cached --exit-code

  canonical_eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Revalidate B012 canonical eligibility on real local main ref
        shell: bash
        run: |
          set -euo pipefail
          MAIN=4d9e423f7fa2aa6d4f706d5c9ad61dafb24b2513
          test "$(git rev-parse HEAD)" = "$MAIN"
          test "$(git rev-parse refs/heads/main)" = "$MAIN"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012
          echo 'B012_POSTMERGE_CANONICAL_ELIGIBILITY=PASS'

  final_postmerge:
    needs: [exact_merge_gates, canonical_eligibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Final live main guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = '4d9e423f7fa2aa6d4f706d5c9ad61dafb24b2513'
          echo 'PR173_POSTMERGE=PASS'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
