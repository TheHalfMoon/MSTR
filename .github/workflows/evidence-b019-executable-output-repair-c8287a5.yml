name: Harden B019 executable teacher-output admission

on:
  push:
    branches:
      - evidence/b019-executable-output-repair-c8287a5

permissions:
  contents: write

env:
  EXPECTED_MAIN: 2605846607fc98291ded4e53e9bb6bb6c3cf52a0
  EXPECTED_HEAD: c8287a5b9f2bd56f3722c02b60f7295d24e247ce
  TARGET_BRANCH: feat/000b-b019-teacher-rescue-policy

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b019-executable-output-repair-c8287a5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind immutable B019 repair target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git worktree add --detach /tmp/b019 "$EXPECTED_HEAD"
          test "$(git -C /tmp/b019 rev-parse HEAD)" = "$EXPECTED_HEAD"
          git -C /tmp/b019 update-ref refs/heads/main "$EXPECTED_MAIN"
          test -z "$(git -C /tmp/b019 status --porcelain)"
      - name: Require execution for SOLUTION and TEST teacher outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/b019')
          schema_paths = [
              root / 'schemas/mstr-teacher-rescue-record-v0.schema.json',
              root / 'specs/002-code-model-supremacy-foundation/contracts/mstr-teacher-rescue-record-v0.schema.json',
          ]
          for path in schema_paths:
              schema = json.loads(path.read_text(encoding='utf-8'))
              output = schema['$defs']['teacher_output']
              if 'allOf' in output:
                  raise SystemExit(f'unexpected existing teacher_output allOf in {path}')
              output['allOf'] = [
                  {
                      'if': {
                          'properties': {
                              'output_kind': {'enum': ['SOLUTION', 'TEST']},
                          },
                          'required': ['output_kind'],
                      },
                      'then': {
                          'properties': {
                              'execution_required': {'const': True},
                          }
                      },
                  }
              ]
              path.write_text(
                  json.dumps(schema, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )

          policy = root / 'docs/data/TEACHER_RESCUE_POLICY.md'
          text = policy.read_text(encoding='utf-8')
          old = 'Independent execution evidence must exactly cover outputs marked `execution_required=true`.'
          new = (
              old
              + ' `SOLUTION` and `TEST` outputs are execution-required by contract and cannot opt out of independent execution.'
          )
          if text.count(old) != 1:
              raise SystemExit('policy execution-rule anchor mismatch')
          policy.write_text(text.replace(old, new), encoding='utf-8')

          evidence = root / 'evidence/mstr-000b/B019-teacher-policy.md'
          text = evidence.read_text(encoding='utf-8')
          old = 'Teacher identity is not truth. Teacher terms are not concrete-output rights. Missing/unresolved provenance, rights, contamination, required execution, or verifier independence fails closed.'
          new = (
              old
              + ' `SOLUTION` and `TEST` outputs cannot declare execution optional.'
          )
          if text.count(old) != 1:
              raise SystemExit('evidence execution-rule anchor mismatch')
          evidence.write_text(text.replace(old, new), encoding='utf-8')

          tests = root / 'tests/contract/test_teacher_rescue_contract.py'
          text = tests.read_text(encoding='utf-8')
          anchor = '''def test_b019_required_execution_must_be_independently_bound() -> None:
    value = fixture()
    value["independent_execution_results"] = []
    assert any("execution-required teacher output ids" in item for item in errors(value))


'''
          addition = '''def test_b019_solution_and_test_outputs_cannot_opt_out_of_execution() -> None:
    for output_kind in ("SOLUTION", "TEST"):
        value = fixture()
        value["teacher_outputs"][0]["output_kind"] = output_kind
        value["teacher_outputs"][0]["execution_required"] = False
        value["independent_execution_results"] = []
        assert errors(value)


'''
          if text.count(anchor) != 1:
              raise SystemExit('teacher-rescue test anchor mismatch')
          tests.write_text(text.replace(anchor, anchor + addition), encoding='utf-8')
          PY
          git -C /tmp/b019 diff --check
          test "$(git -C /tmp/b019 diff --name-only | sort)" = "$(printf '%s\n' \
            docs/data/TEACHER_RESCUE_POLICY.md \
            evidence/mstr-000b/B019-teacher-policy.md \
            schemas/mstr-teacher-rescue-record-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-teacher-rescue-record-v0.schema.json \
            tests/contract/test_teacher_rescue_contract.py | sort)"
          cmp \
            /tmp/b019/schemas/mstr-teacher-rescue-record-v0.schema.json \
            /tmp/b019/specs/002-code-model-supremacy-foundation/contracts/mstr-teacher-rescue-record-v0.schema.json
      - name: Install repaired candidate environment
        working-directory: /tmp/b019
        run: python -m pip install -e '.[dev]'
      - name: Focused B019 hardening gates
        working-directory: /tmp/b019
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_teacher_rescue_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py
          python -m mstr_qualify validate
      - name: Full frozen quality gates
        working-directory: /tmp/b019
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check src tests
          mypy
      - name: Fast-forward exact repaired B019 candidate only after gates
        working-directory: /tmp/b019
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add \
            docs/data/TEACHER_RESCUE_POLICY.md \
            evidence/mstr-000b/B019-teacher-policy.md \
            schemas/mstr-teacher-rescue-record-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-teacher-rescue-record-v0.schema.json \
            tests/contract/test_teacher_rescue_contract.py
          git commit -m "fix(mstr-000b): require execution for teacher code outputs"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
