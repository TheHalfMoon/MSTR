name: B023 binding repair independent exact-head review

on:
  push:
    branches:
      - evidence/b023-binding-repair-independent-review-77184a7

permissions:
  contents: read

env:
  EXPECTED_MAIN: db12d1467bb81185a9affffb4d470626ceceddfa
  EXPECTED_HEAD: 77184a79e06879298dbfc0c031c44cf56a03957e
  EXPECTED_TREE: 3b9ccfd6857a7b1520c845601dcef6e52cfc2ab4
  TARGET_BRANCH: fix/b023-cross-workstream-bindings-atomic-20260901

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Establish independent exact-head review identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
      - name: Adversarial review of cross-workstream authority binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          base = os.environ['EXPECTED_MAIN']
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}..HEAD'], text=True
          ).splitlines()
          expected = {
              'configs/task-gate/mstr-000b.json',
              'evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md',
              'src/mstr_qualify/task_gate.py',
              'tests/contract/test_task_gate.py',
          }
          assert set(changed) == expected, (changed, expected)
          assert not [p for p in changed if p.startswith('.github/workflows/')]

          catalog = json.loads(Path('configs/task-gate/mstr-000b.json').read_text())
          b023 = catalog['tasks']['B023']
          assert b023['canonical_state'] == 'PENDING'
          assert set(b023['prerequisites']) == {'A006', 'A014', 'B002', 'B022'}
          bindings = catalog['external_prerequisites']
          required = {
              'A006': 'evidence/mstr-000a/A006-finalizer.md',
              'A014': 'evidence/mstr-000a/A014-verifier-shortcuts.md',
          }
          for task_id, evidence_path in required.items():
              binding = bindings[task_id]
              assert binding == {
                  'workstream_id': 'MSTR-000A',
                  'tasks_file': 'specs/001-agent-harness-verified-loop-foundation/tasks.md',
                  'state_evidence': evidence_path,
                  'evidence_outputs': [evidence_path],
                  'required_state': 'COMPLETE_CANONICAL',
              }, (task_id, binding)
              tasks_text = Path(binding['tasks_file']).read_text()
              matches = re.findall(
                  rf'^- \[x\] \*\*{re.escape(task_id)}\b.*$', tasks_text, re.MULTILINE
              )
              assert len(matches) == 1, (task_id, matches)
              evidence = Path(evidence_path).read_text()
              assert re.search(
                  rf'^\*\*Task:\*\*\s*`?{re.escape(task_id)}`?\s*$',
                  evidence,
                  re.MULTILINE,
              ), task_id
              assert re.search(
                  r'^\*\*State:\*\*\s*`?COMPLETE_CANONICAL`?\s*$',
                  evidence,
                  re.MULTILINE,
              ), task_id

          task_gate = Path('src/mstr_qualify/task_gate.py').read_text()
          for marker in (
              'prerequisite.external_identity_unproven',
              'prerequisite.external_state_unproven',
              'prerequisite.required_artifact_missing',
              'external_prerequisites',
          ):
              assert marker in task_gate, marker

          repair_evidence = Path(
              'evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md'
          ).read_text()
          assert 'creates no external authority' in repair_evidence
          assert 'model access, model execution, paid compute, training, large dataset ingestion' in repair_evidence

          tasks = Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text()
          assert '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' in tasks
          print('B023_BINDING_STATIC_ADVERSARIAL_REVIEW=PASS')
          PY
          git diff --check "$EXPECTED_MAIN"..HEAD
      - name: Prove exact-head positive eligibility and substitution resistance
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task drift
          python -m mstr_qualify task eligible B023 > /tmp/b023-positive.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/b023-positive.json'))
          assert d['eligible'] is True, d
          prereqs={p['task_id']:p for p in d['prerequisites']}
          for task in ('A006','A014','B002','B022'):
              assert prereqs[task]['satisfied'] is True, prereqs[task]
          print('B023_EXACT_HEAD_PROSPECTIVE_ELIGIBILITY=PASS')
          PY

          cp evidence/mstr-000a/A006-finalizer.md /tmp/A006-finalizer.md
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('evidence/mstr-000a/A006-finalizer.md')
          original=p.read_text()
          tampered, count = re.subn(
              r'(?m)^(\*\*Task:\*\*\s*`?)A006(`?\s*)$',
              r'\1A999\2',
              original,
              count=1,
          )
          assert count == 1
          assert tampered != original
          p.write_text(tampered)
          PY
          if python -m mstr_qualify task eligible B023 > /tmp/b023-tampered.json; then
            echo 'Tampered A006 evidence unexpectedly kept B023 eligible' >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/b023-tampered.json'))
          assert d['eligible'] is False, d
          prereqs={p['task_id']:p for p in d['prerequisites']}
          assert prereqs['A006']['satisfied'] is False, prereqs['A006']
          assert prereqs['A006']['reason'] == 'prerequisite.external_identity_unproven', prereqs['A006']
          print('B023_CROSS_TASK_EVIDENCE_SUBSTITUTION_REJECTED=PASS')
          PY
          mv /tmp/A006-finalizer.md evidence/mstr-000a/A006-finalizer.md
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Re-run frozen repository gates independently
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
      - name: Final review immutability
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo B023_BINDING_REPAIR_INDEPENDENT_EXACT_HEAD_REVIEW=PASS
