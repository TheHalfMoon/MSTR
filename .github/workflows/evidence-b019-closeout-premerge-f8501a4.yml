name: Mandatory premerge gate for exact B019 closeout head

on:
  push:
    branches:
      - evidence/b019-closeout-premerge-f8501a4

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN: ac68e2ff9de9962807ab32ce983b2e808bf4fab9
  EXPECTED_HEAD: f8501a43fc3e4181915032d08767e6a4e4d1f84b
  TARGET_BRANCH: docs/000b-b019-canonicalize
  PR_NUMBER: '79'

jobs:
  pr_semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b019-closeout-premerge-f8501a4
          fetch-depth: 0
      - name: Verify exact PR identity scope and closeout semantics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          git worktree add --detach /tmp/b019-premerge-main "$EXPECTED_MAIN"
          git worktree add --detach /tmp/b019-premerge-head "$EXPECTED_HEAD"
          expected=$(printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B019-teacher-policy.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/contract/test_teacher_rescue_contract.py \
            tests/integration/test_task_gate_cli.py | sort)
          actual=$(git -C /tmp/b019-premerge-head diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          git -C /tmp/b019-premerge-head diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          python tools/evidence/premerge_b019_closeout.py /tmp/b019-premerge-main /tmp/b019-premerge-head

  task_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac68e2ff9de9962807ab32ce983b2e808bf4fab9
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-prove exact-main eligibility and blockers
        shell: bash
        run: |
          set -euo pipefail
          git branch -f main "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          mstr-qualify task eligible B019 > /tmp/b019.json
          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          mstr-qualify task eligible B020 > /tmp/b020.json
          mstr-qualify task eligible B022 > /tmp/b022.json
          mstr-qualify task drift > /tmp/drift.json

  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f8501a43fc3e4181915032d08767e6a4e4d1f84b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused B019 closeout regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_teacher_rescue_contract.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py

  full_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f8501a43fc3e4181915032d08767e6a4e4d1f84b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen full quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: [pr_semantics, task_gate, focused, full_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b019-closeout-premerge-f8501a4
          fetch-depth: 0
      - name: Final PR and remote immutability recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
