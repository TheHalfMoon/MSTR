name: B002 terminal-rule repair v4

on:
  push:
    branches:
      - evidence/b002-terminal-rule-repair-v4

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: 26e4c718cbad5549e65f5fd7e384897217830c35
      EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
      TARGET_BRANCH: feat/000b-b002-task-gate
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout guarded B002 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact identities and fetch mutation source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main evidence/b002-terminal-rule-repair-v2
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Apply terminal-rule repair and corrected positive fixture
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = subprocess.run(
              ["git", "show", "origin/evidence/b002-terminal-rule-repair-v2:.github/workflows/b002-terminal-rule-repair-v2.yml"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          start_marker = "      - name: Apply terminal-rule repair\n        shell: python\n        run: |\n"
          end_marker = "      - name: Verify bounded diff\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          if any(line and not line.startswith("          ") for line in lines):
              raise SystemExit("unexpected v2 repair script indentation")
          source = "\n".join(line[10:] if line else "" for line in lines) + "\n"
          exec(compile(source, "b002-terminal-rule-repair-v2", "exec"), {})

          tests = Path("tests/contract/test_task_gate.py")
          text = tests.read_text(encoding="utf-8")
          marker = "def test_declared_not_required_state_can_satisfy_predecessor(tmp_path: Path) -> None:\n"
          start = text.index(marker)
          replacement = '''def test_declared_not_required_state_can_satisfy_predecessor(tmp_path: Path) -> None:
              catalog_path = _write_minimal_catalog(tmp_path, b001_checked=True)
              data = json.loads(catalog_path.read_text(encoding="utf-8"))
              data["tasks"]["B001"]["canonical_state"] = "NOT_REQUIRED_FIXTURE"
              data["tasks"]["B001"]["closeout_rule"] = {
                  "terminal_states": [
                      "COMPLETE_CANONICAL",
                      "NOT_REQUIRED_FIXTURE",
                  ]
              }
              catalog_path.write_text(json.dumps(data), encoding="utf-8")

              result = evaluate_task_eligibility(
                  "B002",
                  repository_root=tmp_path,
                  catalog_path=catalog_path,
                  canonical_main=_CANONICAL_MAIN,
              )

              predecessor = result["prerequisite_results"][0]
              assert result["eligible"] is True
              assert predecessor["observed_state"] == "NOT_REQUIRED_FIXTURE"
              assert predecessor["satisfied"] is True
              assert predecessor["reasons"] == []
          '''.replace("          ", "").rstrip() + "\n"
          tests.write_text(text[:start].rstrip() + "\n\n" + replacement, encoding="utf-8")

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py | sort)"
          test "$actual" = "$expected"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy
          python -m mstr_qualify validate

      - name: Commit and guarded push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py
          git commit -m "fix(mstr-000b): honor declared terminal task states"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "NEW_B002_HEAD=$(git rev-parse HEAD)"
