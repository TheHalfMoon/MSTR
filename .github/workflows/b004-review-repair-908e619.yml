name: Guard B004 review-driven reconciliation repair

on:
  push:
    branches:
      - evidence/b004-review-repair-908e619

permissions:
  contents: write

env:
  EXPECTED_MAIN: d0e90740924f6991da361536e7f835eb55ae9145
  EXPECTED_HEAD: 908e619dbec9c8b5f44f9b14fa80de0b80849ccd
  TARGET_BRANCH: docs/000b-b004-000a-sequence-reconciliation
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact B004 target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify live repair preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"

      - name: Apply exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} match count: {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              Path('docs/canonical/CURRENT_STATE.md'),
              'NEXT_ELIGIBLE_MSTR_000B_TASK = B004',
              'CURRENT_ELIGIBLE_MSTR_000B_TASK = B004',
              'current eligible B004 field',
          )
          replace_once(
              Path('evidence/mstr-000b/B004-000a-sequence-reconciliation.md'),
              '| A004 | `COMPLETE_CANONICAL`; implementation PR #45; head `d0098548766232c9fa1a879941978d1735ef9e4a`; merge `564096fc9e8ec3e2b0aa9505926e15f66b00ce74`; closeout PR #46; merge `c2d0ee8a6b9d47275c4d309cd187c1ed0d35fb02` |',
              '| A004 | `COMPLETE_CANONICAL`; implementation PR #45; head `d0098548766232c9fa1a879941978d1735ef9e4a`; merge `564096fc9e8ec3e2b0aa9505926e15f66b00ce74`; closeout PR #46; closeout head `c91d603ab3175260348706b3f879b86900511510`; merge `c2d0ee8a6b9d47275c4d309cd187c1ed0d35fb02` |',
              'A004 closeout head evidence',
          )
          PY

      - name: Verify two-file repair scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          from pathlib import Path
          expected = {
              'docs/canonical/CURRENT_STATE.md',
              'evidence/mstr-000b/B004-000a-sequence-reconciliation.md',
          }
          changed = set(subprocess.run(
              ['git', 'diff', '--name-only'], check=True, capture_output=True, text=True
          ).stdout.splitlines())
          assert changed == expected, (changed, expected)
          current = Path('docs/canonical/CURRENT_STATE.md').read_text(encoding='utf-8')
          assert 'CURRENT_ELIGIBLE_MSTR_000B_TASK = B004' in current
          assert 'NEXT_ELIGIBLE_MSTR_000B_TASK = B004' not in current
          evidence = Path('evidence/mstr-000b/B004-000a-sequence-reconciliation.md').read_text(encoding='utf-8')
          assert 'closeout head `c91d603ab3175260348706b3f879b86900511510`' in evidence
          PY

      - name: Commit repair locally without pushing
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/canonical/CURRENT_STATE.md evidence/mstr-000b/B004-000a-sequence-reconciliation.md
          git commit -m "docs(mstr-000b): clarify B004 active reconciliation state"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Guarded fast-forward repair push
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.repair.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "$candidate"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "B004_REPAIRED_HEAD=$(git rev-parse HEAD)"
