name: PR177 B012 mandatory premerge 67b0818

on:
  push:
    branches:
      - evidence/pr177-b012-mandatory-premerge-67b0818

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  BASE_SHA: 1fd324cddf3c2f852810e72a4c195199d7b884c4
  TARGET_HEAD: 67b08187caac85bc3d1b4fb5f7641bdb2ff2287e
  TARGET_TREE: 62cd5a0989d03c83be564a804e100fcfd9d5310e
  TARGET_BRANCH: fix/b012-timeout-budget-recovery-current-main
  QUALIFICATION_RUN: "34062027162"
  REVIEW_RUN: "34062319938"
  REVIEW_ID: "5126738490"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  canonical_eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Revalidate B012 eligibility on exact canonical main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012
          echo 'B012_PREMERGE_CANONICAL_ELIGIBILITY=PASS'

  exact_head_gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 67b08187caac85bc3d1b4fb5f7641bdb2ff2287e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify expected topology and exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$BASE_SHA" "$TARGET_HEAD")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$TARGET_HEAD"
          git diff --check "$BASE_SHA".."$TARGET_HEAD"
          test "$(git diff --name-only "$BASE_SHA".."$TARGET_HEAD" | wc -l)" = 7
      - name: Verify qualification and independent review bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def fetch(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          for run_id, expected_job_names in (
              (os.environ["QUALIFICATION_RUN"], {"focused", "canonical_quality", "final_qualification"}),
              (os.environ["REVIEW_RUN"], {"independent_review"}),
          ):
              run = fetch(f"https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/{run_id}")
              assert run["status"] == "completed"
              assert run["conclusion"] == "success"
              jobs = fetch(run["jobs_url"])["jobs"]
              names = {job["name"] for job in jobs}
              assert names == expected_job_names
              assert all(job["conclusion"] == "success" for job in jobs)

          reviews = fetch("https://api.github.com/repos/TheHalfMoon/MSTR/pulls/177/reviews")
          matches = [r for r in reviews if str(r.get("id")) == os.environ["REVIEW_ID"]]
          assert len(matches) == 1
          review = matches[0]
          assert review["state"] == "COMMENTED"
          assert review["commit_id"] == os.environ["TARGET_HEAD"]
          body = review.get("body") or ""
          assert "Findings: NONE." in body
          assert os.environ["QUALIFICATION_RUN"] in body
          assert os.environ["REVIEW_RUN"] in body

          pr = fetch("https://api.github.com/repos/TheHalfMoon/MSTR/pulls/177")
          assert pr["state"] == "open"
          assert pr["draft"] is False
          assert pr["head"]["sha"] == os.environ["TARGET_HEAD"]
          assert pr["base"]["sha"] == os.environ["BASE_SHA"]
          assert pr["changed_files"] == 7
          print("PR177_EVIDENCE_BINDINGS=PASS")
          PY
      - name: Re-run frozen exact-head quality gates
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_timeout_binding.py \
            tests/contract/test_b012_timeout_budget.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_execute.py \
            colab/mstr_b012_governance.py \
            colab/mstr_b012_measure.py \
            tests/contract/test_b012_timeout_binding.py \
            tests/contract/test_b012_timeout_budget.py
          python -m mypy src/mstr_qualify
          git diff --exit-code
          git diff --cached --exit-code
          echo 'PR177_EXACT_HEAD_GATES=PASS'
          echo 'MODEL_EXECUTION_PERFORMED=false'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'

  final_premerge:
    needs: [canonical_eligibility, exact_head_gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Guard expected refs immediately before merge eligibility
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$TARGET_HEAD"
          echo 'PR177_B012_MANDATORY_PREMERGE=PASS'
          echo "EXPECTED_BASE=$BASE_SHA"
          echo "EXPECTED_HEAD=$TARGET_HEAD"
          echo "QUALIFICATION_RUN=$QUALIFICATION_RUN"
          echo "REVIEW_RUN=$REVIEW_RUN"
          echo "REVIEW_ID=$REVIEW_ID"
          echo 'MODEL_EXECUTION_PERFORMED=false'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
