name: PR178 T031 PEP440 qualification a8fa069

on:
  push:
    branches:
      - evidence/pr178-t031-pep440-qualification-a8fa069

permissions:
  contents: read

env:
  EXPECTED_BASE: f207ed9080fba1bb597a4091029dfd2a381eb346
  EXPECTED_HEAD: a8fa069838e05661d3f32dec960c450363ed5a18
  EXPECTED_REPLAY_SHA256: 749eaf1f72a27a47a2a3d993d36a8147f71057428e24cee3271abd8a088e93fb
  EXPECTED_FAILURE_SHA256: 22165fc42c064a5f7b9b3c98de9c88d71d154fa0133ec25df71f835f1556b9c3

jobs:
  exact_head_qualification:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a8fa069838e05661d3f32dec960c450363ed5a18
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Qualify exact repair head
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_BASE" "$EXPECTED_HEAD")" = "$EXPECTED_BASE"
          test "$(sha256sum colab/mstr_t031_replay.py | awk '{print $1}')" = "$EXPECTED_REPLAY_SHA256"
          test "$(sha256sum artifacts/results/local/T031/failures/T031-granite-4.1-3b-run-34065259852.json | awk '{print $1}')" = "$EXPECTED_FAILURE_SHA256"
          python -m pip install -e '.[dev]'
          python - <<'PY'
          import json
          from pathlib import Path
          from packaging.version import Version
          assert Version('13.0.3') == Version('13.0.3.0')
          assert Version('13.0.3') != Version('13.0.4')
          b012 = json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          assert b012['replay_helper_sha256'] == '749eaf1f72a27a47a2a3d993d36a8147f71057428e24cee3271abd8a088e93fb'
          print('T031_PEP440_EQUIVALENCE_REGRESSION=PASS')
          print('B012_SHARED_REPLAY_REBIND=PASS')
          PY
          python -m pytest -q \
            tests/contract/test_t031_replay_version_equivalence.py \
            tests/contract/test_t031_executor_binding.py \
            tests/contract/test_t031_authority.py \
            tests/contract/test_b012_executor_binding.py
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check colab/mstr_t031_replay.py tests/contract/test_t031_replay_version_equivalence.py
          python -m mypy src
          python -m mstr_qualify validate
          test -z "$(git status --porcelain)"

  final_live_refs:
    needs: exact_head_qualification
    runs-on: ubuntu-24.04
    steps:
      - name: Guard exact live refs after qualification
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$EXPECTED_BASE"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/fix/t031-pep440-replay-version-equivalence | awk '{print $1}')" = "$EXPECTED_HEAD"
          echo 'PR178_EXACT_HEAD_QUALIFICATION=PASS'
          echo "BASE=$EXPECTED_BASE"
          echo "HEAD=$EXPECTED_HEAD"
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
