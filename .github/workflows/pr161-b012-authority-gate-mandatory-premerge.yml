name: Mandatory premerge PR161 B012 authority gate

on:
  push:
    branches:
      - evidence/pr161-b012-authority-gate-mandatory-premerge

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read

env:
  BASE_SHA: 5aaa64c2f93f7edbe991f62ce822ed134d9f1b59
  HEAD_SHA: 8f8736303e1eecd3921e95b5a83a24af3143dd88
  EXPECTED_TREE: 4002673583c9d05d6d226d8571bd01e9fb2df877
  TARGET_BRANCH: governance/b012-external-effect-gate
  PR_NUMBER: '161'
  QUALIFICATION_RUN: '33958930009'
  QUALIFICATION_EVIDENCE_HEAD: 0d24b144988996686420c5b26946f8c031abd583
  REVIEW_RUN: '33959141199'
  REVIEW_EVIDENCE_HEAD: e4a6201f8c6f33ad5d5f3be091b2a1563236c961
  AUTHORITY_ID: B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION

jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f8736303e1eecd3921e95b5a83a24af3143dd88
          fetch-depth: 0
          persist-credentials: false
      - name: Verify evidence dependencies, exact PR object, review state, rules, and checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA".."$HEAD_SHA")" -eq 1
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"

          for spec in "$QUALIFICATION_RUN:$QUALIFICATION_EVIDENCE_HEAD" "$REVIEW_RUN:$REVIEW_EVIDENCE_HEAD"; do
            run="${spec%%:*}"
            expected="${spec##*:}"
            test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$run --jq .status)" = completed
            test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$run --jq .conclusion)" = success
            test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$run --jq .head_sha)" = "$expected"
          done

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" '.state == "open" and .merged == false and .draft == false and .mergeable != false and .base.ref == "main" and .base.sha == $base and .head.ref == "governance/b012-external-effect-gate" and .head.sha == $head and .commits == 1 and .changed_files == 5' /tmp/pr.json >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" > /tmp/reviews.json
          jq -e '[.[] | select(.state == "CHANGES_REQUESTED")] | length == 0' /tmp/reviews.json >/dev/null

          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner='TheHalfMoon' -f name='MSTR' -F number=161 > /tmp/threads.json
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0' /tmp/threads.json >/dev/null

          test "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .protected)" = false
          test "$(gh api repos/${GITHUB_REPOSITORY}/rulesets --jq 'length')" -eq 0

          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" > /tmp/status.json
          jq -e '[.statuses[] | select(.state == "failure" or .state == "error")] | length == 0' /tmp/status.json >/dev/null
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" > /tmp/checks.json
          jq -e '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required")] | length == 0' /tmp/checks.json >/dev/null
          echo 'PR161_PREMERGE_BOUNDARY=PASS'

  scope_semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f8736303e1eecd3921e95b5a83a24af3143dd88
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reprove exact five-file repair, fail-closed semantics, drift, and authority containment
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
          expected=(
            configs/task-gate/mstr-000b.json
            specs/002-code-model-supremacy-foundation/tasks.md
            tests/contract/test_convergence_external_bindings.py
            tests/contract/test_task_gate.py
            tests/integration/test_task_gate_cli.py
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 5
          diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}")
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- src schemas .github/workflows docs/canonical/CURRENT_STATE.md artifacts/authorities artifacts/manifests evidence)"

          python - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path

          base_sha = '5aaa64c2f93f7edbe991f62ce822ed134d9f1b59'
          authority_id = 'B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          base = json.loads(subprocess.check_output(['git', 'show', f'{base_sha}:configs/task-gate/mstr-000b.json'], text=True))
          head = json.loads(Path('configs/task-gate/mstr-000b.json').read_text(encoding='utf-8'))
          expected = copy.deepcopy(base)
          expected['tasks']['B012']['external_effect_class'] = 'MODEL_WEIGHT_ACCESS'
          expected['tasks']['B012']['required_authority_id'] = authority_id
          assert head == expected
          assert head['tasks']['B011']['canonical_state'] == 'COMPLETE_CANONICAL'
          assert head['tasks']['B011']['required_authority_id'] == 'B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED'
          assert head['tasks']['B012']['canonical_state'] == 'PENDING'
          assert head['tasks']['B012']['external_effect_class'] == 'MODEL_WEIGHT_ACCESS'
          assert head['tasks']['B012']['required_authority_id'] == authority_id
          assert head['tasks']['B013']['canonical_state'] == 'BLOCKED'
          assert not Path(f'artifacts/authorities/{authority_id}.json').exists()

          tasks = Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text(encoding='utf-8')
          assert authority_id in tasks
          assert 'B011 authority never transfers' in tasks
          assert '- [ ] **B012 Run equivalent Q4/runtime/resource/raw-code qualification' in tasks
          assert '- [ ] **B013 Freeze stable product-aligned candidate pool' in tasks
          assert 'AUTHORIZED_CANONICAL' not in subprocess.check_output(['git','diff',base_sha,HEAD_SHA], text=True)
          print('PR161_PREMERGE_SEMANTIC_ASSERTIONS=PASS')
          PY

          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$HEAD_SHA"
          git update-ref refs/remotes/origin/main "$HEAD_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json >/dev/null
          set +e
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_exit=$?
          mstr-qualify task eligible B012 > /tmp/b012.json; b012_exit=$?
          mstr-qualify task eligible B013 > /tmp/b013.json; b013_exit=$?
          set -e
          test "$b011_exit" -eq 1
          test "$b012_exit" -eq 1
          test "$b013_exit" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null and .authority_result.required == true and .authority_result.satisfied == true and .authority_result.authority_id == "B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED"' /tmp/b011.json >/dev/null
          jq -e --arg authority "$AUTHORITY_ID" '.eligible == false and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == true and .authority_result.satisfied == false and .authority_result.authority_id == $authority and (.reasons | index("authority.canonical_envelope_missing_or_invalid")) != null and (.reasons | index("task.blocked")) == null and (.reasons | index("task.unresolved_binding")) == null' /tmp/b012.json >/dev/null
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and (.reasons | index("prerequisite.unsatisfied:B012")) != null' /tmp/b013.json >/dev/null
          echo 'PR161_PREMERGE_SCOPE_SEMANTICS=PASS'

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f8736303e1eecd3921e95b5a83a24af3143dd88
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mandatory premerge repository validation and quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/contract/test_convergence_external_bindings.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          git update-ref refs/heads/main "$HEAD_SHA"
          git update-ref refs/remotes/origin/main "$HEAD_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json >/dev/null
          echo 'PR161_PREMERGE_QUALITY=PASS'

  complete:
    needs: [boundary, scope_semantics, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f8736303e1eecd3921e95b5a83a24af3143dd88
          fetch-depth: 0
          persist-credentials: false
      - name: Final guarded identity and immutability proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" '.state == "open" and .merged == false and .draft == false and .mergeable != false and .base.sha == $base and .head.sha == $head' /tmp/pr.json >/dev/null
          echo 'PR161_B012_AUTHORITY_GATE_MANDATORY_PREMERGE=PASS'
