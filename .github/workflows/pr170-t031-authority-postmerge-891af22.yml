name: Postmerge verify PR170 T031 authority

on:
  push:
    branches:
      - evidence/pr170-t031-authority-postmerge-891af22

permissions:
  contents: read
  pull-requests: read

env:
  MERGE_SHA: 891af2215a2244a6a0912d49d782f42bcc38b6ef
  MERGE_TREE: eb65a0b673aea94266c7d5ed43c69e9ea3b65bfc
  OLD_MAIN: 81639ff15e31d7f6a3b8aeaa7ceae4b80b009feb
  CANDIDATE_HEAD: 7e122ef13ab3ec8478bded2c15fffb693f37310d
  PR_NUMBER: "170"

jobs:
  exact_main_postmerge:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify canonical merge identity and PR terminal state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          mapfile -t parents < <(git show -s --format='%P' "$MERGE_SHA" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$OLD_MAIN"
          test "${parents[1]}" = "$CANDIDATE_HEAD"
          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          python - "$pr_json" <<'PY'
          import json, os, sys
          pr = json.loads(sys.argv[1])
          assert pr['state'] == 'closed'
          assert pr['merged'] is True
          assert pr['merge_commit_sha'] == os.environ['MERGE_SHA']
          assert pr['head']['sha'] == os.environ['CANDIDATE_HEAD']
          PY
          git update-ref refs/heads/main "$MERGE_SHA"
          git update-ref refs/remotes/origin/main "$MERGE_SHA"
          echo 'PR170_POSTMERGE_IDENTITY=PASS'
      - name: Install canonical tooling
        run: python -m pip install -e '.[dev]'
      - name: Prove canonical T031 authority remains bounded and dispatch-blocked
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          authority_path = Path('artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json')
          envelope_path = Path('artifacts/manifests/T031-local-measurement-execution-envelope.json')
          authority = json.loads(authority_path.read_text())
          envelope = json.loads(envelope_path.read_text())
          scope = authority['scope']
          ids = ['granite-4.1-3b','ministral-3-3b','qwen2.5-coder-1.5b','qwen3-4b','qwen3.5-2b','qwen3.5-4b','smollm3-3b','yi-coder-1.5b']
          assert authority['authority_id'] == 'T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION'
          assert authority['task_id'] == 'T031'
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert scope['decision'] == 'FOUNDER_T031_LOCAL_MEASUREMENT_DECISION=AUTHORIZE_EXACT_T029_CANDIDATES'
          assert scope['decision_surface'] == {'issue': 167, 'comment_id': 5553875809}
          assert scope['candidate_ids'] == ids
          assert scope['bounded_execution_envelope']['sha256'] == hashlib.sha256(envelope_path.read_bytes()).hexdigest()
          assert envelope['candidate_ids'] == ids
          assert envelope['canonical_entry_main'] == '81639ff15e31d7f6a3b8aeaa7ceae4b80b009feb'
          assert envelope['dispatch_state'] == 'BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING'
          assert envelope['toolchain_provisioning']['state'] == 'BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING'
          assert envelope['resource_ceiling']['paid_cost_usd'] == 0.0
          assert envelope['runner_envelope']['founder_machine_model_binaries'] == 0
          assert envelope['runner_envelope']['git_model_binaries'] == 0
          assert scope['b010_b012_candidates'] is False
          assert scope['t032_execution'] is False
          assert scope['t033_execution'] is False
          assert scope['t034_admission_decision'] is False
          assert scope['training'] is False
          assert scope['weight_changing_training'] is False
          assert 'mellum-4b' not in envelope['candidate_ids']
          assert 'qwen3.5-0.8b-control' not in envelope['candidate_ids']
          print('PR170_POSTMERGE_T031_AUTHORITY=PASS')
          PY
      - name: Fresh canonical quality verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/contract/test_t031_authority.py tests/contract/test_b012_authority.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          echo 'PR170_POSTMERGE_QUALITY=PASS'
      - name: Final canonical main immutability recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git rev-parse refs/heads/main)" = "$MERGE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MERGE_SHA"
          echo 'PR170_T031_AUTHORITY_POSTMERGE=PASS'
          echo 'T031_EXTERNAL_EXECUTION=BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING'
