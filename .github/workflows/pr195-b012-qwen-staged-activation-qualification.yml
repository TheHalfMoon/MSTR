name: PR195 B012 Qwen staged activation qualification

on:
  push:
    branches:
      - evidence/pr195-b012-qwen-staged-activation-qualification-d362f6e

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 0cff2d57ab78c0189c8557f3e2ec59300bd8082d
      HEAD: d362f6e2db9397c4969b384c3f364c46d8b45dcb
      TREE: 090bab8caec5438448ccb3a0a844478d0356d6b3
      PR: '195'
      SUBJECT_BRANCH: fix/b012-qwen-staged-recovery-activation
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact activation subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove exact identities and ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"

      - name: Prove live PR identity and exact nine-file scope
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
            mergeable=$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' /tmp/pr.json)
            [[ "$mergeable" != unknown ]] && break
            sleep 2
          done
          jq '{state,draft,mergeable,mergeable_state,base:.base.sha,head:.head.sha,changed_files}' /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==9' /tmp/pr.json >/dev/null
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            '.github/workflows/b012-qwen-raw-code-recovery.yml'
            'artifacts/manifests/B012-executor-toolchain-binding.json'
            'artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json'
            'evidence/mstr-000b/B012-qwen-staged-recovery-activation.md'
            'tests/contract/test_b012_executor_binding.py'
            'tests/contract/test_b012_qwen_raw_code_recovery.py'
            'tests/contract/test_b012_qwen_staged_recovery_topology.py'
            'tests/contract/test_b012_runner_shutdown_evidence.py'
            'tests/contract/test_b012_stage_checkpoint_topology.py'
          )
          [[ ${#actual[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Exact-main B012 eligibility and authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git symbolic-ref --short HEAD)" = main
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['superseded'] is False
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert a['task_id']=='B012'
          PY
          git checkout --detach "$HEAD"

      - name: Prove activation hash binding and non-authorizing semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          manifest_path=Path('artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json')
          binding_path=Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          active=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          b=json.loads(binding_path.read_text(encoding='utf-8'))
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['task_id']=='B012'
          assert m['candidate_id']=='qwen3.5-0.8b-control'
          assert m['activation']['activation_base_main']=='0cff2d57ab78c0189c8557f3e2ec59300bd8082d'
          assert m['activation']['repair_package_merge_commit']=='0cff2d57ab78c0189c8557f3e2ec59300bd8082d'
          assert m['activation']['repair_package_postmerge_run_id']==34177394009
          assert m['activation']['active_workflow_materialized'] is True
          assert m['activation']['activation_repository_change_only'] is True
          assert m['activation']['activation_model_access']=='NONE'
          assert m['activation']['activation_model_execution']=='NONE'
          assert m['activation']['activation_paid_cost_usd']==0.0
          assert sha(m['staged_script_path'])==m['staged_script_sha256']
          assert sha(m['staged_workflow_spec_path'])==m['staged_workflow_sha256']
          assert active.read_bytes()==Path(m['staged_workflow_spec_path']).read_bytes()
          assert sha(active)==m['staged_workflow_sha256']=='e5a666641af6557efb2aba7091a51db3deef973f6177ab682207a4326d3f4bbe'
          boundary=m['authority_boundary']
          for key in ('authority_scope_modified','authority_transfer','candidate_expansion','candidate_revision_or_file_expansion','external_dispatch_authority_created','paid_compute','paid_model_api','production_release','retry_authority_created','training','weight_changing_training'):
              assert boundary[key] is False, key
          assert boundary['git_model_binaries']==0
          assert boundary['founder_machine_model_binaries']==0
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          activation=b['qwen_raw_code_recovery_staged_activation']
          assert activation['activation_base_main']==m['activation']['activation_base_main']
          assert activation['repair_manifest_sha256']==sha(manifest_path)
          assert activation['staged_script_sha256']==m['staged_script_sha256']
          assert activation['active_workflow_sha256']==m['staged_workflow_sha256']
          for key in ('retry_authority_created','external_dispatch_authority_created','candidate_expansion','revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert activation[key] is False, key
          assert activation['model_access']=='NONE'
          assert activation['model_execution']=='NONE'
          assert activation['paid_cost_usd']==0.0
          text=active.read_text(encoding='utf-8')
          assert "github.event.issue.number == 162" in text
          assert "github.event.comment.user.login == 'TheHalfMoon'" in text
          assert "github.event.comment.author_association == 'OWNER'" in text
          assert "github.event.comment.body == 'B012_RECOVER_RAW_CODE_STAGED qwen3.5-0.8b-control 34155931982'" in text
          assert text.count('actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02')==5
          assert 'mstr_b012_qwen_raw_code_recovery_staged.py' in text
          assert 'mstr_b012_qwen_raw_code_recovery.py' not in text
          assert '.gguf' not in text and '.safetensors' not in text
          PY

      - name: Focused activation contracts
        run: |
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py

      - name: Canonical schema validation
        run: python -m mstr_qualify validate

      - name: Ruff lint
        run: python -m ruff check .

      - name: Changed Python Ruff format
        run: |
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py

      - name: Full pytest
        run: python -m pytest -q

      - name: Mypy
        run: python -m mypy src/mstr_qualify

      - name: Final immutable live guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .base.sha==$base and .head.sha==$head and .changed_files==9' /tmp/pr-final.json >/dev/null
          echo 'PR195_QUALIFICATION=PASS'
