name: A017 post-closeout proof

on:
  push:
    branches:
      - evidence/a017-postcloseout-f222df1

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  identity:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove canonical A017 closeout merge
        shell: bash
        run: |
          set -euo pipefail
          MAIN='f222df1b939fc5db792021d6883d977014502dba'
          TREE='bedb9d42ff7cc5caf55557d7fea06f6fd1619e3b'
          OLD_MAIN='11c528c0ad015f7505dd143c700e710a0f08d86a'
          CLOSEOUT_HEAD='32052b3566cbc9808fdba3248f0f71277d0ff532'
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(git show -s --format=%P "$MAIN")" = "$OLD_MAIN $CLOSEOUT_HEAD"
          pr="$(gh api repos/TheHalfMoon/MSTR/pulls/121)"
          test "$(jq -r '.state' <<<"$pr")" = 'closed'
          test "$(jq -r '.merged' <<<"$pr")" = 'true'
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$CLOSEOUT_HEAD"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$OLD_MAIN"
          reviews="$(gh api repos/TheHalfMoon/MSTR/pulls/121/reviews)"
          jq -e '.[] | select(.id == 5075803581 and .state == "COMMENTED" and .commit_id == "32052b3566cbc9808fdba3248f0f71277d0ff532")' <<<"$reviews" >/dev/null
          qual="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33487106824)"
          premerge="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33487516246)"
          test "$(jq -r '.conclusion' <<<"$qual")" = 'success'
          test "$(jq -r '.conclusion' <<<"$premerge")" = 'success'
          stale_qual="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33441835774)"
          stale_premerge="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33486590938)"
          test "$(jq -r '.conclusion' <<<"$stale_qual")" = 'success'
          test "$(jq -r '.conclusion' <<<"$stale_premerge")" = 'success'
          tasks="$(git show "$MAIN:specs/001-agent-harness-verified-loop-foundation/tasks.md")"
          grep -F -- '- [x] **A017 Freeze failure taxonomy and training trajectory contract.**' <<<"$tasks"
          grep -F -- '- [ ] **A018 Implement trajectory recorder/replay/admission.**' <<<"$tasks"
          grep -F 'Canonical implementation: PR #120 / final head `2270cbbd6a1110e2823679ea3ca2d7b77a92d256` / merge `11c528c0ad015f7505dd143c700e710a0f08d86a`; post-merge proof run `33441203968` = `SUCCESS`.' <<<"$tasks"
          evidence="$(git show "$MAIN:evidence/mstr-000a/A017-trajectory-contract.md")"
          grep -F '**State:** COMPLETE_CANONICAL' <<<"$evidence"
          grep -F 'A017_STATE = COMPLETE_CANONICAL' <<<"$evidence"
          grep -F 'A018_STATE = PENDING' <<<"$evidence"
          threads="$(gh api graphql -f query='query { repository(owner:"TheHalfMoon", name:"MSTR") { pullRequest(number:121) { reviewThreads(first:100) { nodes { isResolved } } } } }')"
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$threads")" = '0'

  quality:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f222df1b939fc5db792021d6883d977014502dba
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Run canonical A017 post-closeout quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src

  complete:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final immutable A017 post-closeout recheck
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = 'f222df1b939fc5db792021d6883d977014502dba'
          test "$(git show -s --format=%T origin/main)" = 'bedb9d42ff7cc5caf55557d7fea06f6fd1619e3b'
