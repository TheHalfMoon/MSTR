name: Independent review PR160 B011 closeout

on:
  push:
    branches:
      - evidence/pr160-b011-closeout-independent-review

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  BASE_SHA: a788f55f5251f0be92b33e0765d0436cb321eb8b
  HEAD_SHA: 60eb83121a80fc4f30058c62e3d18b01d89d68cf
  EXPECTED_TREE: 2f0480a380c746b8a59ec39d2381303098738f5e
  TARGET_BRANCH: closeout/b011-acquisition
  PR_NUMBER: '160'
  QUALIFICATION_RUN: '33957022743'
  QUALIFICATION_EVIDENCE_HEAD: e3b9af44a0cbb56f3db4e2496980139714e11d75

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60eb83121a80fc4f30058c62e3d18b01d89d68cf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact reviewed object and successful qualification dependency
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA".."$HEAD_SHA")" -eq 2
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN} --jq .status)" = completed
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN} --jq .conclusion)" = success
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN} --jq .head_sha)" = "$QUALIFICATION_EVIDENCE_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" '.state == "open" and .draft == false and .base.ref == "main" and .base.sha == $base and .head.ref == "closeout/b011-acquisition" and .head.sha == $head and .commits == 2 and .changed_files == 6' /tmp/pr.json >/dev/null
          echo 'PR160_REVIEW_OBJECT=PASS'

      - name: Independent substantive semantic review
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git show "$BASE_SHA:configs/task-gate/mstr-000b.json" > /tmp/base-catalog.json
          python - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path

          base_sha = 'a788f55f5251f0be92b33e0765d0436cb321eb8b'
          head_sha = '60eb83121a80fc4f30058c62e3d18b01d89d68cf'
          base = json.load(open('/tmp/base-catalog.json', encoding='utf-8'))
          head = json.load(open('configs/task-gate/mstr-000b.json', encoding='utf-8'))

          # Machine closeout semantics: only B011 canonical state may change.
          expected = copy.deepcopy(base)
          assert expected['tasks']['B011']['canonical_state'] == 'PENDING'
          expected['tasks']['B011']['canonical_state'] = 'COMPLETE_CANONICAL'
          assert head == expected

          b011 = head['tasks']['B011']
          b012 = head['tasks']['B012']
          b013 = head['tasks']['B013']
          assert b011['required_authority_id'] == 'B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED'
          assert b011['external_effect_class'] == 'MODEL_WEIGHT_ACCESS'
          assert b012['canonical_state'] == 'PENDING'
          assert b012.get('required_authority_id') is None
          assert b012.get('external_effect_class') is None
          assert b013['canonical_state'] == 'BLOCKED'
          assert b013['prerequisites'] == ['B002', 'B012']

          # Authority and acquisition manifests are immutable under this closeout.
          immutable = (
              'artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json',
              'artifacts/manifests/B010-new-candidate-weight-access.json',
              'artifacts/manifests/B011-acquired-candidates.json',
          )
          for path in immutable:
              base_bytes = subprocess.check_output(['git', 'show', f'{base_sha}:{path}'])
              assert Path(path).read_bytes() == base_bytes

          authority = json.loads(Path(immutable[0]).read_text(encoding='utf-8'))
          authority_text = json.dumps(authority, sort_keys=True)
          assert authority['authority_id'] == 'B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED'
          assert 'B011' in authority_text
          assert 'mellum-4b' in authority_text
          assert 'qwen3.5-0.8b-control' in authority_text
          assert 'K2' not in authority_text and 'Horizon' not in authority_text

          evidence = Path('evidence/mstr-000b/B011-acquisition.md').read_text(encoding='utf-8')
          required_evidence = (
              '**State:** `COMPLETE_CANONICAL`',
              'ENTRY_GATE_TASK=B011',
              'ENTRY_GATE_CANONICAL_MAIN=dd547bb768598f92ad203764ce32be6e1fc710d6',
              'ENTRY_GATE_ELIGIBLE=true',
              '**Implementation PR:** `#157`',
              '**Final implementation head:** `450d9b5b9b3c6aca27222a553dc6230f6eef6783`',
              '**Canonical implementation merge:** `b9aa4f7de8b924d283d09fa8d93dbaceb0f6b4cd`',
              '**Successful acquisition run:** `33865617854`',
              '**Exact-head qualification:** `33867186224`',
              '**Independent substantive semantic review:** `33867564924`',
              '**Mandatory premerge verification:** `33867838434`',
              '**Post-implementation verification:** `33927258696`',
              '**Frontier-planning postmerge verification:** `33926866711`',
              '33865467059',
              'no model-weight download started',
              'does not transfer to, authorize, or widen B012 or any later task',
              'does not authorize K2 Horizon or any newly discovered candidate',
          )
          for value in required_evidence:
              assert value in evidence, value
          assert evidence.index('ENTRY_GATE_CANONICAL_MAIN=dd547bb768598f92ad203764ce32be6e1fc710d6') < evidence.index('## Scope')

          tasks = Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text(encoding='utf-8')
          assert '- [x] **B011 EXPLICIT NEW WEIGHT ACCESS GATE' in tasks
          assert 'Canonical implementation: PR #157 / final head `450d9b5b9b3c6aca27222a553dc6230f6eef6783` / merge `b9aa4f7de8b924d283d09fa8d93dbaceb0f6b4cd`.' in tasks
          assert '- [ ] **B012 Run equivalent Q4/runtime/resource/raw-code qualification' in tasks
          assert '- [ ] **B013 Freeze stable product-aligned candidate pool' in tasks

          changed = subprocess.check_output(['git','diff','--name-only',base_sha,head_sha], text=True).splitlines()
          assert sorted(changed) == sorted([
              'configs/task-gate/mstr-000b.json',
              'evidence/mstr-000b/B011-acquisition.md',
              'specs/002-code-model-supremacy-foundation/tasks.md',
              'tests/contract/test_convergence_external_bindings.py',
              'tests/contract/test_task_gate.py',
              'tests/integration/test_task_gate_cli.py',
          ])

          # No source/schema/workflow/current-state or authority/manifest widening.
          forbidden = subprocess.check_output([
              'git','diff','--name-only',base_sha,head_sha,'--',
              'src','schemas','.github/workflows','docs/canonical/CURRENT_STATE.md',
              'artifacts/authorities','artifacts/manifests'
          ], text=True).strip()
          assert forbidden == ''
          print('PR160_INDEPENDENT_SEMANTIC_ASSERTIONS=PASS')
          print('FINDINGS=NONE')
          PY

          git update-ref refs/heads/main "$HEAD_SHA"
          git update-ref refs/remotes/origin/main "$HEAD_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json >/dev/null
          set +e
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_exit=$?
          mstr-qualify task eligible B012 > /tmp/b012.json; b012_exit=$?
          mstr-qualify task eligible B013 > /tmp/b013.json; b013_exit=$?
          set -e
          test "$b011_exit" -eq 1
          test "$b012_exit" -eq 0
          test "$b013_exit" -eq 1
          jq -e '.eligible == false and (.reasons | index("task.already_terminal")) != null and .authority_result.required == true and .authority_result.satisfied == true' /tmp/b011.json >/dev/null
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and (.reasons | length) == 0' /tmp/b012.json >/dev/null
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and (.reasons | index("prerequisite.unsatisfied:B012")) != null' /tmp/b013.json >/dev/null
          echo 'PR160_INDEPENDENT_SEMANTIC_REVIEW=PASS'

      - name: Independent regression and quality rerun
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/contract/test_convergence_external_bindings.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json >/dev/null
          echo 'PR160_INDEPENDENT_QUALITY=PASS'

      - name: Final reviewed-head immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          echo 'PR160_B011_CLOSEOUT_INDEPENDENT_REVIEW=PASS'
          echo 'FINDINGS=NONE'
