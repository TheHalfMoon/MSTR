name: PR159 Frontier Independent Semantic Review

on:
  push:
    branches:
      - evidence/pr159-frontier-acceleration-independent-review

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      EXPECTED_BASE: b9aa4f7de8b924d283d09fa8d93dbaceb0f6b4cd
      TARGET_HEAD: 7b22890d72e12829cf412e643527d24831feb30f
      TARGET_BRANCH: plan/000b-frontier-acceleration-2026-09
      PR_NUMBER: '159'
      QUALIFICATION_RUN: '33878935851'
    steps:
      - name: Verify qualification dependency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" --jq .conclusion)"
          test "$conclusion" = success

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0

      - name: Verify exact live topology and planning-only scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_HEAD"
          pr_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          pr_base="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .base.sha)"
          pr_state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)"
          pr_draft="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .draft)"
          test "$pr_head" = "$TARGET_HEAD"
          test "$pr_base" = "$EXPECTED_BASE"
          test "$pr_state" = open
          test "$pr_draft" = false
          test "$(git diff --name-only "$EXPECTED_BASE...$TARGET_HEAD" | wc -l)" -eq 9
          git diff --quiet "$EXPECTED_BASE" "$TARGET_HEAD" -- \
            configs/task-gate src schemas artifacts/authorities .github/workflows README.md docs/canonical/CURRENT_STATE.md

      - name: Independent semantic consistency review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          base = "b9aa4f7de8b924d283d09fa8d93dbaceb0f6b4cd"
          root = Path(".")
          task_path = Path("specs/002-code-model-supremacy-foundation/tasks.md")
          old_tasks = subprocess.check_output(["git", "show", f"{base}:{task_path.as_posix()}"], text=True)
          tasks = task_path.read_text()
          spec = Path("specs/002-code-model-supremacy-foundation/spec.md").read_text()
          plan = Path("specs/002-code-model-supremacy-foundation/plan.md").read_text()
          quick = Path("specs/002-code-model-supremacy-foundation/quickstart.md").read_text()
          checklist = Path("specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md").read_text()
          handoff = Path("specs/002-code-model-supremacy-foundation/implementation-handoff.md").read_text()
          strategy = Path("docs/canonical/MSTR_FRONTIER_ACCELERATION_STRATEGY.md").read_text()
          research = Path("specs/002-code-model-supremacy-foundation/research-frontier-2026-09-04.md").read_text()
          constitution = Path(".specify/memory/constitution.md").read_text()
          authority = json.loads(Path("artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json").read_text())
          b010 = json.loads(Path("artifacts/manifests/B010-new-candidate-weight-access.json").read_text())

          def checkbox_states(text: str):
              return {
                  task: state
                  for state, task in re.findall(r"^- \[([ x])\] \*\*(B\d{3})\b", text, re.M)
              }

          assert checkbox_states(old_tasks) == checkbox_states(tasks)

          # Product floor and metric semantics remain aligned with the constitution.
          for token in ["8_GB", "CPU_ONLY", "8K", "Q4", "TTVC"]:
              assert token in constitution
          for token in ["8_GB", "CPU", "8K", "Q4", "TTVC", "DVCR"]:
              assert token in strategy
          assert "raise" in strategy.lower() and "hardware floor" in strategy.lower()

          # Spec -> plan -> tasks inheritance exists for all new mandatory concepts.
          for fr in range(25, 30):
              assert f"FR-{fr:03d}" in spec
          for phrase in ["Frontier Freshness", "checkpoint", "Q4", "targeted", "sealed"]:
              assert phrase.lower() in plan.lower()
          for task in ["B013", "B032", "B033", "B034"]:
              assert task in tasks

          # B013 is fail-closed on new material frontier challengers and does not preselect K2.
          assert "K2 Horizon 3.7B" in strategy
          assert "K2 Horizon 3.7B" in research
          assert "mandatory" in strategy.lower() and "review" in strategy.lower()
          assert "not" in strategy.lower() and "preselect" in strategy.lower()
          assert "B013" in strategy and "B013" in quick and "B013" in checklist
          assert "frontier" in tasks.lower()
          assert "equivalent qualification" in tasks.lower()

          # Historical B010/B011 authority remains exact and cannot cover K2.
          auth_text = json.dumps(authority, sort_keys=True)
          b010_text = json.dumps(b010, sort_keys=True)
          assert "K2" not in auth_text and "K2" not in b010_text
          assert "mellum-4b" in auth_text and "qwen3.5-0.8b-control" in auth_text
          assert "WEIGHT_CHANGING_TRAINING" in strategy
          assert "NEW_MODEL_WEIGHT_ACCESS" in strategy
          assert "NONE" in strategy or "NOT_AUTHORIZED" in strategy

          # Q4 cannot be silently replaced by sub-Q4 research.
          assert "Q4" in tasks
          assert "Sherry" in strategy
          low = strategy.lower()
          assert "anchor" in low and "challenger" in low
          assert "q3" in low and "q2" in low
          assert "sub-q4" in tasks.lower() or "sub-Q4" in tasks

          # RL changes are planning only and preserve independent verification.
          assert "targeted trajectory feedback" in strategy.lower()
          assert "previous-MSTR" in strategy or "previous-mstr" in strategy.lower()
          assert "independent" in strategy.lower() and "verifier" in strategy.lower()
          assert "B032" in tasks and "B032" in checklist

          # Benchmark integrity is explicit and blocks solution/history leakage.
          for phrase in [
              "future-git-history",
              "public-solution",
              "cached",
              "evaluator",
              "network",
          ]:
              assert phrase.lower() in strategy.lower()
          assert "B033" in tasks

          # Composer 3 is not fabricated as an official release.
          assert "No official Cursor Composer 3 release was verified" in strategy

          # Public/vendor claims remain research inputs, not canonical score truth.
          assert "vendor" in strategy.lower()
          assert "evidence" in strategy.lower()

          # Planning surfaces direct the downstream implementation handoff.
          for text in [quick, checklist, handoff]:
              assert "MSTR_FRONTIER_ACCELERATION_STRATEGY.md" in text

          print("INDEPENDENT_SEMANTIC_REVIEW=PASS")
          print("FINDINGS=NONE")
          PY

      - name: Install canonical tooling
        run: python -m pip install -e '.[dev]'

      - name: Offline repository validation
        run: python -m mstr_qualify validate

      - name: Full test suite
        run: pytest

      - name: Ruff
        run: ruff check src tests

      - name: Strict mypy
        run: mypy

      - name: Diff hygiene
        run: git diff --check "$EXPECTED_BASE...$TARGET_HEAD"

      - name: Final live immutability check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_HEAD"
