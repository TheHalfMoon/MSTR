name: T031 authority exact-main rebase repair v2

on:
  push:
    branches:
      - builder/t031-authority-rebase-repair2-81639ff

permissions:
  contents: write

env:
  NEW_MAIN: 81639ff15e31d7f6a3b8aeaa7ceae4b80b009feb
  OLD_T031_HEAD: 1509ac18f00e700b4d9ed3dba518f7b335466c9d
  OLD_T031_BRANCH: governance/t031-founder-authority-exact-t029-candidates
  TARGET_BRANCH: governance/t031-founder-authority-exact-t029-candidates-v2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact post-B012 main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NEW_MAIN }}
          fetch-depth: 0
      - name: Verify exact source and target absence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEW_MAIN"
          git fetch origin "$OLD_T031_BRANCH" --quiet
          test "$(git rev-parse "origin/$OLD_T031_BRANCH")" = "$OLD_T031_HEAD"
          test -z "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")"
      - name: Re-materialize and rebind exact T031 authority
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json
            artifacts/manifests/T031-local-measurement-execution-envelope.json
            tests/contract/test_t031_authority.py
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$OLD_T031_HEAD:$path" > "$path"
          done
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          new_main = '81639ff15e31d7f6a3b8aeaa7ceae4b80b009feb'
          old_main = 'e5e47644fb7122cbb47b43cdf13d072f82ebfdf7'
          epath = Path('artifacts/manifests/T031-local-measurement-execution-envelope.json')
          apath = Path('artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json')
          envelope = json.loads(epath.read_text())
          assert envelope['canonical_entry_main'] == old_main
          envelope['canonical_entry_main'] = new_main
          epath.write_text(json.dumps(envelope, indent=2, sort_keys=True) + '\n')
          authority = json.loads(apath.read_text())
          authority['scope']['bounded_execution_envelope']['sha256'] = hashlib.sha256(epath.read_bytes()).hexdigest()
          apath.write_text(json.dumps(authority, indent=2, sort_keys=True) + '\n')
          PY
      - name: Verify exact bounded rebase scope and semantics
        shell: bash
        run: |
          set -euo pipefail
          git add -N \
            artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json \
            artifacts/manifests/T031-local-measurement-execution-envelope.json \
            tests/contract/test_t031_authority.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json artifacts/manifests/T031-local-measurement-execution-envelope.json tests/contract/test_t031_authority.py | sort)"
          test "$changed" = "$expected"
          git diff --check
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          apath = Path('artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json')
          epath = Path('artifacts/manifests/T031-local-measurement-execution-envelope.json')
          authority = json.loads(apath.read_text())
          envelope = json.loads(epath.read_text())
          scope = authority['scope']
          ids = ['granite-4.1-3b','ministral-3-3b','qwen2.5-coder-1.5b','qwen3-4b','qwen3.5-2b','qwen3.5-4b','smollm3-3b','yi-coder-1.5b']
          assert authority['authority_id'] == 'T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION'
          assert authority['task_id'] == 'T031' and authority['status'] == 'AUTHORIZED_CANONICAL'
          assert scope['decision'] == 'FOUNDER_T031_LOCAL_MEASUREMENT_DECISION=AUTHORIZE_EXACT_T029_CANDIDATES'
          assert scope['decision_surface'] == {'issue': 167, 'comment_id': 5553875809}
          assert scope['candidate_ids'] == ids and envelope['candidate_ids'] == ids
          assert envelope['canonical_entry_main'] == '81639ff15e31d7f6a3b8aeaa7ceae4b80b009feb'
          assert scope['bounded_execution_envelope']['sha256'] == hashlib.sha256(epath.read_bytes()).hexdigest()
          for key in ('b010_b012_candidates','t032_execution','t033_execution','t034_admission_decision','training','weight_changing_training'):
              assert scope[key] is False, key
          assert envelope['dispatch_state'] == 'BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING'
          assert envelope['toolchain_provisioning']['state'] == 'BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING'
          assert envelope['resource_ceiling']['paid_cost_usd'] == 0.0
          assert envelope['resource_ceiling']['gpu_layers'] == 0
          assert envelope['runner_envelope']['founder_machine_model_binaries'] == 0
          assert envelope['runner_envelope']['git_model_binaries'] == 0
          assert envelope['measurement_contract']['contexts'] == [4096,8192,16384]
          prohibited = set(envelope['prohibited_operations'])
          for item in {'B010_OR_B012_CANDIDATES','NEW_CANDIDATES','CANDIDATE_REVISION_OR_FILE_EXPANSION','T032_EXECUTION','T033_EXECUTION','T034_ADMISSION_DECISION','WEIGHT_CHANGING_TRAINING','TRAINING','PAID_COMPUTE','PAID_MODEL_API','GATED_TERMS_ACCEPTANCE','ACCOUNT_REQUIRED_MODEL_ACCESS','PRODUCTION_RELEASE','GIT_MODEL_BINARIES','FOUNDER_MACHINE_MODEL_BINARIES'}:
              assert item in prohibited, item
          print('T031_REBASE_SEMANTICS=PASS')
          PY
      - name: Install repository quality dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused T031 authority regression
        run: python -m pytest -q tests/contract/test_t031_authority.py
      - name: Run offline validation and full repository quality
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
      - name: Publish one-commit exact-main T031 authority candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEW_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json \
            artifacts/manifests/T031-local-measurement-execution-envelope.json \
            tests/contract/test_t031_authority.py
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'governance(t031): rebind exact T029 measurement authority'
          test "$(git rev-parse HEAD^)" = "$NEW_MAIN"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
