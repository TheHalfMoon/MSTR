name: PR193 repository quality diagnosis

on:
  push:
    branches:
      - evidence/pr193-b012-qwen-recovery-shutdown-qualification-v3-15287f0

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
      SUBJECT_BRANCH: fix/b012-qwen-recovery-runner-shutdown-34169060075
      SUBJECT_SHA: 15287f04bf279b7896a926e655c344f7be96d38c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Checkout exact unchanged PR193 subject
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          git checkout --detach "$SUBJECT_SHA"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]

      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'

      - name: Quality 1 - canonical validation
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate

      - name: Quality 2 - full pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Quality 3 - Ruff check
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .

      - name: Quality 4 - Ruff format
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format --check .

      - name: Quality 5 - mypy
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy src/mstr_qualify

      - name: Final immutable live-ref guard
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          echo 'PR193_REPOSITORY_QUALITY_DIAGNOSIS=PASS'
