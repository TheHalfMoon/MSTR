name: B002 hardening v4

on:
  push:
    branches:
      - evidence/b002-hardening-v4

permissions:
  contents: write

env:
  EXPECTED_HEAD: 0f9bd02ee5eb47a63437545ecfe59f596b54dff7
  EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
  TARGET_BRANCH: feat/000b-b002-task-gate
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  harden-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout guarded B002 branch
        uses: actions/checkout@v4
        with:
          ref: feat/000b-b002-task-gate
          fetch-depth: 0

      - name: Verify exact feature and canonical main identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main evidence/b002-hardening-v3
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Reuse validated hardening mutation and normalize EOF
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = subprocess.run(
              [
                  "git",
                  "show",
                  "origin/evidence/b002-hardening-v3:.github/workflows/b002-hardening-v3.yml",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          start_marker = "      - name: Harden exact-main and binding verification\n"
          end_marker = "      - name: Verify hardening mutation scope\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          run_marker = "        run: |\n"
          if not block.startswith("        shell: python\n" + run_marker):
              raise SystemExit("unexpected v3 hardening step shape")
          script = block[len("        shell: python\n" + run_marker):]
          lines = script.splitlines()
          if any(line and not line.startswith("          ") for line in lines):
              raise SystemExit("unexpected v3 hardening script indentation")
          source = "\n".join(line[10:] if line else "" for line in lines) + "\n"
          exec(compile(source, "b002-hardening-v3", "exec"), {})

          test_path = Path("tests/contract/test_task_gate.py")
          test_path.write_text(test_path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")

      - name: Verify hardening mutation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' evidence/mstr-000b/B002-task-gate.md src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py | sort)"
          test "$actual" = "$expected"

      - name: Commit candidate before clean-checkout tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/mstr-000b/B002-task-gate.md src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py
          git commit -m "fix(mstr-000b): harden B002 canonical task gate"
          test -z "$(git status --short)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify hardened B002 candidate
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy
          python -m mstr_qualify validate
          set +e
          python -m mstr_qualify task eligible B002 >/tmp/b002.out 2>/tmp/b002.err
          code=$?
          set -e
          test "$code" = "2"
          test ! -s /tmp/b002.out
          grep -F '"code": "task_gate.not_canonical_main"' /tmp/b002.err

      - name: Push only fully verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "NEW_B002_HEAD=$(git rev-parse HEAD)"
