name: PR200 B012 Qwen one-shot repair qualification v2

on:
  push:
    branches:
      - evidence/pr200-b012-qwen-one-shot-qualification-v2-eb4256e

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 9ff1680c21be366f11133a4ba2e68ebe0fc1e53b
      HEAD: eb4256e011ab4c2d4e708bde12dcb1f603b5e116
      TREE: d81bccad34d28f0955668466da509697b17a9a67
      PR: '200'
      SUBJECT_BRANCH: fix/b012-qwen-raw-code-one-shot-mode
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact repair subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove exact subject identity ancestry and live refs
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          actual_tree="$(git show -s --format=%T HEAD)"
          live_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          live_subject="$(git ls-remote origin "refs/heads/$SUBJECT_BRANCH" | cut -f1)"
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          commit_count="$(git rev-list --count "$BASE..$HEAD")"
          printf 'HEAD=%s\nTREE=%s\nLIVE_MAIN=%s\nLIVE_SUBJECT=%s\nMERGE_BASE=%s\nCOMMITS_AHEAD=%s\n' \
            "$actual_head" "$actual_tree" "$live_main" "$live_subject" "$merge_base" "$commit_count"
          test "$actual_head" = "$HEAD"
          test "$actual_tree" = "$TREE"
          test "$live_main" = "$BASE"
          test "$live_subject" = "$HEAD"
          test "$merge_base" = "$BASE"

      - name: Prove live PR identity and exact inert five-file scope
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
            mergeable=$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' /tmp/pr.json)
            [[ "$mergeable" != unknown ]] && break
            sleep 2
          done
          jq '{state,draft,mergeable,mergeable_state,base:.base.sha,head:.head.sha,changed_files}' /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==5' /tmp/pr.json >/dev/null
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            'artifacts/manifests/B012-qwen-raw-code-one-shot-topology-repair.json'
            'colab/mstr_b012_qwen_raw_code_one_shot.py'
            'colab/mstr_b012_raw_code_one_shot.py'
            'evidence/mstr-000b/B012-qwen-one-shot-mode-topology.md'
            'tests/contract/test_b012_qwen_raw_code_one_shot_topology.py'
          )
          [[ ${#actual[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done
          git diff --check "$BASE...$HEAD"

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reverify exact-main B012 eligibility and Founder authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main "$BASE"
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert all(d['semantic_checks'].values())
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert a['task_id']=='B012'
          assert a['cost_resource_ceiling']['limits'][0]['max']==0.0
          PY
          git checkout --detach "$HEAD"

      - name: Prove frozen active surfaces are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'colab/mstr_b012_raw_code.py':'bd6d34afd8af60497a4971bb7245fc359c4132bad3772be212b6848aa73060d8',
            'colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py':'c6cb947bd84101b572e4bb8140a393e7dc067c858172339758031f855c6c24a3',
            '.github/workflows/b012-qwen-raw-code-recovery.yml':'f15941577213c5e96a1ebb3993989693628eae5f2e28620f90e03110d303d127',
            'benchmarks/manifests/B012-raw-code-proxy.json':'038586bb8156add6bb2de8573a9d15d0f1201909c36820a6cc608a2b5d393349',
          }
          for path,digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest, path
          PY
          test -z "$(git diff --name-only "$BASE...$HEAD" -- .github/workflows artifacts/authorities artifacts/manifests/B012-executor-toolchain-binding.json benchmarks/manifests/B012-raw-code-proxy.json colab/mstr_b012_raw_code.py colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py configs/runtimes configs/workflows)"

      - name: Prove repair hashes semantics and non-activation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          m=json.loads(Path('artifacts/manifests/B012-qwen-raw-code-one-shot-topology-repair.json').read_text(encoding='utf-8'))
          c=m['components']
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['base_main']=='9ff1680c21be366f11133a4ba2e68ebe0fc1e53b'
          assert m['candidate_id']=='qwen3.5-0.8b-control'
          assert m['prior_qualification_run_id']==34155931982
          assert m['triggering_incident']['run_id']==34265475666
          assert m['triggering_incident']['canonical_incident_postmerge_run_id']==34274596048
          assert m['repair_hypothesis']['root_cause_claimed'] is False
          assert m['repair_hypothesis']['explicit_one_shot_flag']=='--no-conversation'
          assert c['one_shot_raw_code_helper_sha256']==sha(c['one_shot_raw_code_helper_path'])
          assert c['one_shot_wrapper_sha256']==sha(c['one_shot_wrapper_path'])
          assert c['canonical_shared_raw_code_helper_sha256']==sha(c['canonical_shared_raw_code_helper_path'])
          assert c['active_workflow_at_repair_base_sha256']==sha(c['active_workflow_path'])
          assert m['activation']['active_workflow_materialized'] is False
          assert m['activation']['package_performs_model_access'] is False
          assert m['activation']['package_performs_model_execution'] is False
          for key,value in m['authority_boundary'].items():
              if key in {'existing_authority_id','git_model_binaries','founder_machine_model_binaries','paid_cost_usd'}:
                  continue
              assert value is False, key
          assert m['authority_boundary']['git_model_binaries']==0
          assert m['authority_boundary']['founder_machine_model_binaries']==0
          assert m['authority_boundary']['paid_cost_usd']==0.0
          PY
          test "$(grep -o -- '--no-conversation' colab/mstr_b012_raw_code_one_shot.py | wc -l)" = "1"
          ! grep -q -- '--no-conversation' colab/mstr_b012_raw_code.py
          ! grep -q 'B012_RECOVER_RAW_CODE_ONE_SHOT' .github/workflows/b012-qwen-raw-code-recovery.yml

      - name: Focused B012 one-shot contracts
        run: |
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_one_shot_topology.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py

      - name: Canonical schema validation
        run: python -m mstr_qualify validate

      - name: Ruff lint
        run: python -m ruff check .

      - name: Changed Python Ruff format
        run: |
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_one_shot.py \
            colab/mstr_b012_raw_code_one_shot.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_topology.py

      - name: Full pytest
        run: python -m pytest -q

      - name: Mypy
        run: python -m mypy src/mstr_qualify

      - name: Final immutable live guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$SUBJECT_BRANCH" | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .base.sha==$base and .head.sha==$head and .changed_files==5' /tmp/pr-final.json >/dev/null
          echo 'PR200_QUALIFICATION_V2=PASS'
