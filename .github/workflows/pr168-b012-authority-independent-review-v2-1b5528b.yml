name: PR168 B012 authority independent semantic security review v2

on:
  push:
    branches:
      - evidence/pr168-b012-authority-independent-review-v2-1b5528b

permissions:
  contents: read
  pull-requests: read

env:
  REPO: TheHalfMoon/MSTR
  PR_NUMBER: "168"
  BASE_SHA: e5e47644fb7122cbb47b43cdf13d072f82ebfdf7
  TARGET_HEAD: 1b5528bd824dd4c7896d07f50e12a9353e7e903e
  TARGET_TREE: 875e722d32687525cd4209ee23b0d5660fad3dad
  QUALIFICATION_RUN: "33984968182"
  QUALIFICATION_EVIDENCE_HEAD: acfc72aa30d499cd6b5fa71b197e8ccbde00739f

jobs:
  semantic_security_governance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed authority head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Independently verify bounded authority and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" "$TARGET_HEAD")" = "$BASE_SHA"
          git diff --check "$BASE_SHA...$TARGET_HEAD"

          changed="$(git diff --name-only "$BASE_SHA...$TARGET_HEAD" | sort)"
          expected="$(printf '%s\n' artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json artifacts/manifests/B012-equivalent-qualification-execution-envelope.json tests/contract/test_b012_authority.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py | sort)"
          test "$changed" = "$expected"

          qual_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runs/$QUALIFICATION_RUN")"
          python - "$qual_json" <<'PY'
          import json, os, sys
          run = json.loads(sys.argv[1])
          assert run['status'] == 'completed'
          assert run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['QUALIFICATION_EVIDENCE_HEAD']
          PY
          git show "$QUALIFICATION_EVIDENCE_HEAD:.github/workflows/pr168-b012-authority-qualification-v2-1b5528b.yml" | grep -F "TARGET_HEAD: $TARGET_HEAD"
          git show "$QUALIFICATION_EVIDENCE_HEAD:.github/workflows/pr168-b012-authority-qualification-v2-1b5528b.yml" | grep -F "TARGET_TREE: $TARGET_TREE"

          decision_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/issues/comments/5553875175")"
          python - "$decision_json" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])['body']
          assert 'FOUNDER_B012_EQUIVALENT_QUALIFICATION_DECISION=AUTHORIZE_EXACT_B010_CANDIDATES' in body
          assert 'exact B010 qualification candidates' in body
          assert 'creates no authority for T031, T032, T033, T034' in body
          assert 'training or weight-changing operations' in body
          PY

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def digest(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          authority_path = 'artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json'
          envelope_path = 'artifacts/manifests/B012-equivalent-qualification-execution-envelope.json'
          authority = json.loads(Path(authority_path).read_text())
          envelope = json.loads(Path(envelope_path).read_text())
          scope = authority['scope']

          assert authority == {**authority, 'authority_id': 'B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'}
          assert authority['task_id'] == 'B012'
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['external_effect_class'] == 'MODEL_WEIGHT_ACCESS'
          assert scope['decision_surface'] == {'issue': 162, 'comment_id': 5553875175}
          assert scope['decision'] == 'FOUNDER_B012_EQUIVALENT_QUALIFICATION_DECISION=AUTHORIZE_EXACT_B010_CANDIDATES'
          assert scope['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          assert scope['bounded_execution_envelope']['path'] == envelope_path
          assert scope['bounded_execution_envelope']['sha256'] == digest(envelope_path)
          assert scope['b010_manifest']['sha256'] == digest('artifacts/manifests/B010-new-candidate-weight-access.json')

          for key in ('training', 'weight_changing_training', 'large_dataset_ingestion', 'paid_compute', 'paid_model_api', 'gated_terms_acceptance', 'production_release', 'git_model_binaries', 'new_candidate_access'):
              assert scope[key] is False, key
          assert scope['founder_machine_large_artifacts'] == 0

          assert envelope['authority_id'] == authority['authority_id']
          assert envelope['task_id'] == 'B012'
          assert envelope['candidate_ids'] == scope['candidate_ids']
          assert envelope['canonical_entry_main'] == 'e5e47644fb7122cbb47b43cdf13d072f82ebfdf7'
          assert envelope['dispatch_state'] == 'BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING'
          assert envelope['toolchain_provisioning']['state'] == 'BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING'
          assert envelope['durable_outputs_only'] is True
          assert envelope['resource_ceiling']['paid_cost_usd'] == 0.0
          assert envelope['resource_ceiling']['paid_compute'] is False
          assert envelope['resource_ceiling']['paid_model_api'] is False
          assert envelope['resource_ceiling']['gpu_layers'] == 0
          assert envelope['runner_envelope']['founder_machine_model_binaries'] == 0
          assert envelope['runner_envelope']['git_model_binaries'] == 0
          assert envelope['runner_envelope']['max_parallel_candidates'] == 1
          assert envelope['runner_envelope']['runner_class'] == 'GITHUB_HOSTED_EPHEMERAL'

          network = envelope['model_artifact_network']
          assert network['https_get_only'] is True
          for key in ('abort_on_auth_gating', 'abort_on_gated_terms', 'abort_on_payment', 'abort_on_unlisted_redirect'):
              assert network[key] is True, key

          prohibited = set(envelope['prohibited_operations'])
          required_prohibitions = {
              'K2_OR_ANY_NEW_CANDIDATE', 'CANDIDATE_REVISION_OR_FILE_EXPANSION',
              'WEIGHT_CHANGING_TRAINING', 'TRAINING', 'LARGE_OR_PRIVATE_DATASET_INGESTION',
              'PAID_COMPUTE', 'PAID_MODEL_API', 'GATED_TERMS_ACCEPTANCE', 'ACCOUNT_REQUIRED_MODEL_ACCESS',
              'PRODUCTION_RELEASE', 'GIT_MODEL_BINARIES', 'FOUNDER_MACHINE_MODEL_BINARIES'
          }
          assert required_prohibitions <= prohibited

          b010 = json.loads(Path('artifacts/manifests/B010-new-candidate-weight-access.json').read_text())
          assert [c['candidate_id'] for c in b010['candidates']] == scope['candidate_ids']
          assert envelope['candidate_source_manifest']['sha256'] == digest('artifacts/manifests/B010-new-candidate-weight-access.json')
          assert envelope['quantization_identity']['source_manifest']['sha256'] == digest('artifacts/manifests/quantization/T029-q4-profiles.json')
          assert envelope['runtime_identity']['profile']['sha256'] == digest('configs/runtimes/llama-cpp-cpu.json')
          assert envelope['quantization_identity']['llama_cpp_commit'] == 'fc35562ba46fbbf8e30cac85edbb39642c37d248'
          assert envelope['runtime_identity']['llama_cpp_commit'] == '3173a56471c1753650cd806694145ffd6dcace67'
          assert set(envelope['quantization_identity']['arms']) == {'Q4_K_M', 'Q4_K_S'}
          assert envelope['runtime_identity']['device'] == 'none'
          assert envelope['runtime_identity']['gpu_layers'] == 0

          combined = Path(authority_path).read_text() + Path(envelope_path).read_text()
          for forbidden in ('T031', 'T032', 'T033', 'T034'):
              assert forbidden not in combined
          PY

  independent_quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed authority head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Re-run full frozen quality independently
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"

  final_review:
    needs: [semantic_security_governance, independent_quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Emit exact-head substantive review verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/branches/main" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          pr_head="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          test "$main_sha" = "$BASE_SHA"
          test "$pr_head" = "$TARGET_HEAD"
          echo "INDEPENDENT_REVIEW_VERDICT=PASS"
          echo "FINDINGS=NONE"
          echo "B012_SCOPE=EXACT_B010_CANDIDATES_ONLY"
          echo "T031_T032_T033_T034_TRAINING=NOT_AUTHORIZED"
          echo "EXTERNAL_EXECUTION=NOT_DISPATCHED"
