name: PR196 B012 staged shutdown independent semantic review v3

on:
  push:
    branches:
      - evidence/pr196-b012-staged-shutdown-independent-review-v3-c8b6043

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: TheHalfMoon/MSTR
      PR: '196'
      BASE: 98feee7765cbf64428f149f885519cef76800caf
      HEAD: c8b604384073227ca99833bfa0085e30b2b7b5ac
      TREE: aa43402ec11fbff58ebe830d2bea47fbe0599d30
      QUAL_RUN: '34243869812'
      QUAL_HEAD: 8e62220ff629103b9c9bc181c7af3590d1fd9fa6
      SUBJECT_BRANCH: governance/b012-qwen-staged-recovery-runner-shutdown-34231845282
      INCIDENT_SHA256: a067895cc6f0356b917d896f7da59faab0db4dcd27c29d76bc157968c2d8134b
      FAILURE_CLASS: B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_PARTIAL_DURABLE_PROGRESS_RAW_CODE_UNPROVEN
      BLOCKED_STATUS: BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact reviewed subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove immutable live identity qualification and exact non-executable scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$SUBJECT_BRANCH)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          jq -e --arg q "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$q' /tmp/qual.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg b "$BASE" --arg h "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$b and .head.sha==$h and .changed_files==8' /tmp/pr.json >/dev/null
          expected=$(printf '%s\n' \
            'artifacts/manifests/B012-executor-toolchain-binding.json' \
            'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-staged-recovery-run-34231845282.json' \
            'evidence/mstr-000b/B012-qwen-staged-recovery-runner-shutdown-34231845282.md' \
            'tests/contract/test_b012_executor_binding.py' \
            'tests/contract/test_b012_qwen_raw_code_recovery.py' \
            'tests/contract/test_b012_qwen_staged_recovery_topology.py' \
            'tests/contract/test_b012_runner_shutdown_evidence.py' \
            'tests/contract/test_b012_stage_checkpoint_topology.py' | sort)
          test "$(git diff --name-only "$BASE...$HEAD" | sort)" = "$expected"
          git diff --check "$BASE...$HEAD"
          for path in \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B010-new-candidate-weight-access.json \
            artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_governance.py \
            colab/mstr_b012_executor.py \
            colab/mstr_b012_qwen_raw_code_recovery_staged.py \
            configs/workflows/b012-qwen-raw-code-recovery-staged.yml \
            .github/workflows/b012-qwen-raw-code-recovery.yml; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done
          echo 'EXECUTION_SURFACES_UNCHANGED=PASS'

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Independently review incident and binding semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-staged-recovery-run-34231845282.json')
          i=json.loads(p.read_text(encoding='utf-8'))
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text(encoding='utf-8'))
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['INCIDENT_SHA256']
          assert a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert a['task_id']=='B012' and a['status']=='AUTHORIZED_CANONICAL'
          assert i['schema_version']=='mstr.b012-infrastructure-cancellation.v1'
          assert i['task_id']=='B012' and i['candidate_id']=='qwen3.5-0.8b-control'
          assert i['run_id']==34231845282 and i['job_id']==102079676195
          assert i['canonical_main_at_start']==os.environ['BASE'] and i['workflow_head_sha']==os.environ['BASE']
          assert i['workflow_conclusion']=='failure'
          assert i['failure_classification']==os.environ['FAILURE_CLASS']
          assert i['infrastructure_root_cause']=='UNKNOWN_BEYOND_RUNNER_SHUTDOWN_SIGNAL'
          assert i['shutdown_occurred_before_workflow_timeout_budget'] is True
          assert i['durable_stage_count']==3 and i['durable_stages']==['init','source','quantize']
          assert i['durable_artifact_count']==3
          assert [x['stage'] for x in i['durable_artifacts']]==['init','source','quantize']
          assert i['source_verification']['status']=='EXACT_B010_QWEN_FILES_REACQUIRED_AND_VERIFIED'
          assert i['source_verification']['file_count']==9 and i['source_verification']['total_download_bytes']==1769897109
          assert i['regenerated_q4']['status']=='EXACT_PRIOR_Q4_IDENTITY_REPRODUCED'
          assert i['regenerated_q4']['matches_prior_stage03'] is True
          assert i['raw_code_stage_conclusion']=='cancelled' and i['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert i['raw_code_checkpoint_artifact']=='NONE'
          assert i['finalize_stage_conclusion']=='skipped' and i['final_evidence_artifact']=='NONE'
          assert i['explicit_cleanup_step_conclusion']=='skipped'
          assert i['candidate_execution_completion']=='NOT_PROVEN'
          assert i['ephemeral_cleanup_completion']=='NOT_PROVEN'
          assert i['candidate_admission_decision']=='NONE' and i['model_quality_verdict']=='NONE'
          assert i['paid_cost_usd']==0.0 and i['separate_topology_repair_required'] is True
          for key in ('durable_binary_artifacts','training','paid_model_api','candidate_expansion','revision_or_file_expansion','retry_authority_created','external_dispatch_authority_created','same_staged_topology_redispatch_authorized_by_this_evidence'):
              assert i[key] is False, key
          assert b['status']==os.environ['BLOCKED_STATUS']
          s=b['qwen_raw_code_staged_recovery_runner_shutdown']
          assert s['run_id']==i['run_id'] and s['job_id']==i['job_id']
          assert s['candidate_id']==i['candidate_id']
          assert s['canonical_main_at_start']==i['canonical_main_at_start']
          assert s['failure_classification']==i['failure_classification']
          assert s['raw_code_result']=='NONE_DURABLY_PROVEN' and s['model_quality_verdict']=='NONE'
          assert s['candidate_execution_completion']=='NOT_PROVEN'
          assert s['ephemeral_cleanup_completion']=='NOT_PROVEN'
          for key in ('same_staged_topology_redispatch_authorized_by_this_evidence','retry_authority_created','external_dispatch_authority_created','training','paid_model_api','candidate_expansion','revision_or_file_expansion'):
              assert s[key] is False, key
          print('SEMANTIC_REVIEW=PASS')
          PY

      - name: Independent focused and full repository quality
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify

      - name: Final immutable review guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/final.json
          jq -e --arg b "$BASE" --arg h "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$b and .head.sha==$h' /tmp/final.json >/dev/null
          echo 'INDEPENDENT_SEMANTIC_REVIEW_V3=SUCCESS'
