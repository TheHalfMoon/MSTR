name: Evidence B003 closeout exact-head qualification

on:
  push:
    branches:
      - evidence/b003-closeout-82eadbb-final-gates

permissions:
  contents: read

env:
  TARGET_SHA: 82eadbba7a2caed733fc7f9f30dfb788eb4adf2f
  EXPECTED_MAIN: 8bea74269fb81a4c898b7a2864bf103d15fd98a9
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  qualify-closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact closeout head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact target and live main identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"
          git diff --exit-code

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify five-file closeout scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_MAIN..$TARGET_SHA"
          python -m py_compile tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          python - <<'PY'
          import subprocess
          expected = {
              'configs/task-gate/mstr-000b.json',
              'evidence/mstr-000b/B003-drift-detector.md',
              'specs/002-code-model-supremacy-foundation/tasks.md',
              'tests/contract/test_task_gate.py',
              'tests/integration/test_task_gate_cli.py',
          }
          changed = set(subprocess.run(
              ['git', 'diff', '--name-only', '8bea74269fb81a4c898b7a2864bf103d15fd98a9..HEAD'],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines())
          assert changed == expected, (changed, expected)
          PY

      - name: Verify closeout candidate transition
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$TARGET_SHA"
          git update-ref refs/remotes/origin/main "$TARGET_SHA"
          set +e
          python -m mstr_qualify task eligible B003 > /tmp/b003.json
          b003_rc=$?
          set -e
          test "$b003_rc" -eq 1
          python -m mstr_qualify task eligible B004 > /tmp/b004.json
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json
          b003 = json.load(open('/tmp/b003.json', encoding='utf-8'))
          b004 = json.load(open('/tmp/b004.json', encoding='utf-8'))
          drift = json.load(open('/tmp/drift.json', encoding='utf-8'))
          assert b003['eligible'] is False and 'task.already_terminal' in b003['reasons'], b003
          assert b003['canonical_main'] == '82eadbba7a2caed733fc7f9f30dfb788eb4adf2f', b003
          assert b004['eligible'] is True and b004['reasons'] == [], b004
          assert b004['canonical_main'] == '82eadbba7a2caed733fc7f9f30dfb788eb4adf2f', b004
          assert drift['status'] == 'clean' and drift['findings'] == [], drift
          assert drift['canonical_main'] == '82eadbba7a2caed733fc7f9f30dfb788eb4adf2f', drift
          assert drift['tasks_checked'] == 34, drift
          print('B003_CLOSEOUT_EXACT_HEAD_TERMINAL=true')
          print('B004_CLOSEOUT_EXACT_HEAD_ELIGIBLE=true')
          print('B003_CLOSEOUT_EXACT_HEAD_DRIFT=clean')
          PY

      - name: Run targeted governance tests
        run: pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_task_drift.py tests/integration/test_task_drift_cli.py

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Verify immutable closeout head and unchanged live main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --short)"
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          echo "FINAL_B003_CLOSEOUT_SHA=$(git rev-parse HEAD)"
          echo "FINAL_LIVE_MAIN_SHA=$(git rev-parse refs/remotes/origin/main)"
