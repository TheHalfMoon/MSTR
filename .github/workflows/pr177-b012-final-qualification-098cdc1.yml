name: PR177 B012 final qualification 098cdc1

on:
  push:
    branches:
      - evidence/pr177-b012-final-qualification-098cdc1

permissions:
  contents: read
  pull-requests: read

env:
  SUBJECT_SHA: 098cdc1a58c5abb16bba44ec958e94f99fa0a642
  SUBJECT_TREE: 9966d965a87b8ec7d4fe72370f70ee0819228db0
  BASE_SHA: 1fd324cddf3c2f852810e72a4c195199d7b884c4
  PRIOR_REVIEWED_SHA: 67b08187caac85bc3d1b4fb5f7641bdb2ff2287e
  TARGET_BRANCH: fix/b012-timeout-budget-recovery-current-main
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact canonical main for machine eligibility
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Prove canonical B012 machine eligibility
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = "main"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012
          echo 'B012_MACHINE_ELIGIBILITY_AT_CANONICAL_MAIN=PASS'
      - name: Checkout exact formatted recovery subject
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_SHA"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          test "$(git merge-base HEAD main)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$SUBJECT_SHA"
      - name: Prove formatting-only drift from prior reviewed head
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          import subprocess

          old = "67b08187caac85bc3d1b4fb5f7641bdb2ff2287e"
          new = "098cdc1a58c5abb16bba44ec958e94f99fa0a642"
          paths = ["colab/mstr_b012_execute.py", "colab/mstr_b012_measure.py"]
          for path in paths:
              old_source = subprocess.check_output(["git", "show", f"{old}:{path}"], text=True)
              new_source = subprocess.check_output(["git", "show", f"{new}:{path}"], text=True)
              old_ast = ast.dump(ast.parse(old_source), include_attributes=False)
              new_ast = ast.dump(ast.parse(new_source), include_attributes=False)
              assert old_ast == new_ast, path
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{old}..{new}"], text=True
          ).splitlines()
          assert changed == [
              "artifacts/manifests/B012-executor-toolchain-binding.json",
              "colab/mstr_b012_execute.py",
              "colab/mstr_b012_measure.py",
          ]
          binding = json.loads(open("artifacts/manifests/B012-executor-toolchain-binding.json", encoding="utf-8").read())
          assert binding["b012_measurement_helper_sha256"] == "767b65ba6d1073418c5e1afcc447060cf2c3fec77d39391acaafb826c290cf1c"
          assert binding["executor_script_sha256"] == "699745547b0743e70a9dc94c223b028a565615041b6e0d895c3f96026a6521b0"
          print("FORMATTING_ONLY_DRIFT=PASS")
          PY
      - name: Focused exact-subject recovery gates
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_timeout_binding.py \
            tests/contract/test_b012_timeout_budget.py
          python -m mstr_qualify validate
          python -m compileall -q \
            colab/mstr_b012_measure.py \
            colab/mstr_b012_execute.py \
            colab/mstr_b012_governance.py
          python -m ruff check \
            colab/mstr_b012_measure.py \
            colab/mstr_b012_execute.py \
            colab/mstr_b012_governance.py \
            tests/contract/test_b012_timeout_binding.py \
            tests/contract/test_b012_timeout_budget.py
          python -m ruff format --check colab/mstr_b012_execute.py colab/mstr_b012_measure.py
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$SUBJECT_SHA"
          echo 'FOCUSED_B012_RECOVERY=PASS'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'

  canonical_quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact B012 recovery subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 098cdc1a58c5abb16bba44ec958e94f99fa0a642
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Frozen quality gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$BASE_SHA"
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          python -m mstr_qualify validate
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$SUBJECT_SHA"
          echo 'CANONICAL_QUALITY=PASS'
          echo 'MODEL_EXECUTION_PERFORMED=false'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'

  final_qualification:
    runs-on: ubuntu-24.04
    needs: [focused, canonical_quality]
    steps:
      - name: Verify exact subject and canonical base are unchanged
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$SUBJECT_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          echo 'PR177_B012_FINAL_QUALIFICATION=PASS'
          echo 'MODEL_EXECUTION_PERFORMED=false'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
