name: B012 Qwen case-checkpoint activation builder 4deca99

on:
  push:
    branches:
      - evidence/b012-qwen-case-checkpoint-activation-builder-4deca99

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 4deca995306c197e5cefaf8202e64fe5469f873c
      TARGET: fix/b012-qwen-case-checkpoint-activation
      POSTMERGE_RUN: '34261221062'
      POSTMERGE_HEAD: f5dac568a809fe9fed707c3c2d8a298c859d16bb
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact activation target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Reverify exact activation entry gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET" --quiet
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$TARGET)" = "$BASE"
          gh api "repos/$REPO/actions/runs/$POSTMERGE_RUN" > /tmp/post.json
          jq -e --arg h "$POSTMERGE_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h' /tmp/post.json >/dev/null
          echo 'ACTIVATION_ENTRY_IDENTITY=PASS'

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reprove exact-main B012 eligibility before activation
        shell: bash
        run: |
          set -euo pipefail
          git branch -f main "$BASE"
          python -m mstr_qualify task eligible B012 > /tmp/eligibility.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/eligibility.json', encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert d['supersession_result']['satisfied'] is True
          assert d['state_consistency_result']['satisfied'] is True
          assert d['candidate_pool_result']['satisfied'] is True
          assert all(d['semantic_checks'].values())
          print('B012_EXACT_MAIN_ELIGIBILITY=PASS')
          PY

      - name: Materialize reviewed case-checkpoint activation
        shell: bash
        run: |
          set -euo pipefail
          cp configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml \
             .github/workflows/b012-qwen-raw-code-recovery.yml
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          BASE='4deca995306c197e5cefaf8202e64fe5469f873c'
          POST_RUN=34261221062
          POST_HEAD='f5dac568a809fe9fed707c3c2d8a298c859d16bb'

          manifest_path=Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          binding_path=Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          spec_path=Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          active_path=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          script_path=Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')

          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert active_path.read_bytes()==spec_path.read_bytes()

          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          activation=manifest['activation']
          activation['activation_base_main']=BASE
          activation['repair_package_merge_commit']=BASE
          activation['repair_package_postmerge_run_id']=POST_RUN
          activation['repair_package_postmerge_evidence_head']=POST_HEAD
          activation['active_workflow_materialized']=True
          activation['activation_repository_change_only']=True
          activation['activation_model_access']='NONE'
          activation['activation_model_execution']='NONE'
          activation['activation_paid_cost_usd']=0.0
          activation['activation_is_separate_repository_change']=True
          manifest_path.write_text(json.dumps(manifest, indent=2)+'\n', encoding='utf-8')

          binding=json.loads(binding_path.read_text(encoding='utf-8'))
          binding['status']='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          binding['qwen_raw_code_case_checkpoint_activation']={
              'repair_id': manifest['repair_id'],
              'candidate_id': manifest['candidate_id'],
              'prior_run_id': manifest['prior_qualification_run_id'],
              'repair_manifest_sha256': sha(manifest_path),
              'case_checkpoint_script_sha256': sha(script_path),
              'active_workflow_sha256': sha(active_path),
              'activation_base_main': BASE,
              'repair_package_merge_commit': BASE,
              'repair_package_postmerge_run_id': POST_RUN,
              'repair_package_postmerge_evidence_head': POST_HEAD,
              'activation_is_separate_repository_change': True,
              'retry_authority_created': False,
              'external_dispatch_authority_created': False,
              'candidate_expansion': False,
              'revision_or_file_expansion': False,
              'model_access': 'NONE',
              'model_execution': 'NONE',
              'training': False,
              'weight_changing_training': False,
              'paid_compute': False,
              'paid_model_api': False,
              'paid_cost_usd': 0.0,
              'production_release': False,
          }
          binding_path.write_text(json.dumps(binding, indent=2)+'\n', encoding='utf-8')

          evidence=Path('evidence/mstr-000b/B012-qwen-case-checkpoint-activation.md')
          evidence.write_text(f'''# B012 Qwen Case-Checkpoint Recovery Activation\n\nStatus: repository-only activation candidate\n\nCanonical activation base: `{BASE}`\nRepair package merge commit: `{BASE}`\nRepair package postmerge run: `{POST_RUN}`\nRepair package postmerge evidence head: `{POST_HEAD}`\n\n## Activated surface\n\nThe separately reviewed workflow specification `configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml` is materialized byte-for-byte at `.github/workflows/b012-qwen-raw-code-recovery.yml`. The exact owner-scoped issue command is:\n\n```text\nB012_RECOVER_RAW_CODE_CASE_CHECKPOINT qwen3.5-0.8b-control 34155931982\n```\n\nNo command is issued by this activation change. Activation is distinct from dispatch.\n\n## Authority boundary\n\nExisting authority remains `B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION`. This activation creates no retry authority and no external-dispatch authority, performs no model access or model execution, changes no candidate/revision/file identity, performs no training or weight-changing training, spends USD 0.00, and makes no model-quality or candidate-admission decision.\n\n## Durability boundary\n\nThe active topology preserves a maximum of one uncheckpointed raw-code case, writes each stage checkpoint before persisting completed-stage state, treats Actions artifacts as transient transport, and requires required checkpoint evidence to be hash-verified and canonicalized to Git before dispatch closeout or candidate admission. Missing, expired, inconsistent, or non-canonicalizable required evidence fails closed.\n''', encoding='utf-8')

          status_old='BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR'
          status_new='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          for path in [
              Path('tests/contract/test_b012_executor_binding.py'),
              Path('tests/contract/test_b012_runner_shutdown_evidence.py'),
              Path('tests/contract/test_b012_qwen_raw_code_recovery.py'),
              Path('tests/contract/test_b012_stage_checkpoint_topology.py'),
              Path('tests/contract/test_b012_qwen_staged_recovery_topology.py'),
          ]:
              text=path.read_text(encoding='utf-8')
              assert status_old in text, path
              path.write_text(text.replace(status_old, status_new), encoding='utf-8')

          staged_test=Path('tests/contract/test_b012_qwen_staged_recovery_topology.py')
          text=staged_test.read_text(encoding='utf-8')
          old='def test_qwen_staged_recovery_is_materialized_as_current_active_workflow() -> None:'
          new='def test_qwen_staged_recovery_activation_is_preserved_after_case_checkpoint_supersession() -> None:'
          assert old in text
          text=text.replace(old,new,1)
          assert 'assert ACTIVE_WORKFLOW.read_bytes() == WORKFLOW.read_bytes()' in text
          text=text.replace(
              'assert ACTIVE_WORKFLOW.read_bytes() == WORKFLOW.read_bytes()',
              'assert ACTIVE_WORKFLOW.read_bytes() != WORKFLOW.read_bytes()\n    assert "B012_RECOVER_RAW_CODE_CASE_CHECKPOINT qwen3.5-0.8b-control 34155931982" in ACTIVE_WORKFLOW.read_text(encoding="utf-8")',
              1,
          )
          assert 'assert activation["active_workflow_sha256"] == _sha256(ACTIVE_WORKFLOW)' in text
          text=text.replace(
              'assert activation["active_workflow_sha256"] == _sha256(ACTIVE_WORKFLOW)',
              'assert activation["active_workflow_sha256"] == _sha256(WORKFLOW)',
              1,
          )
          staged_test.write_text(text, encoding='utf-8')

          case_test=Path('tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py')
          text=case_test.read_text(encoding='utf-8')
          assert 'RAW_CODE = ROOT / "benchmarks/manifests/B012-raw-code-proxy.json"' in text
          text=text.replace(
              'RAW_CODE = ROOT / "benchmarks/manifests/B012-raw-code-proxy.json"',
              'RAW_CODE = ROOT / "benchmarks/manifests/B012-raw-code-proxy.json"\nBINDING = ROOT / "artifacts/manifests/B012-executor-toolchain-binding.json"',
              1,
          )
          text=text.replace(
              'def test_case_checkpoint_workflow_is_non_active_and_json_only() -> None:',
              'def test_case_checkpoint_workflow_is_active_and_json_only() -> None:',
              1,
          )
          text=text.replace('assert activation["active_workflow_materialized"] is False','assert activation["active_workflow_materialized"] is True',1)
          text=text.replace('assert WORKFLOW.read_bytes() != ACTIVE_WORKFLOW.read_bytes()','assert WORKFLOW.read_bytes() == ACTIVE_WORKFLOW.read_bytes()',1)
          text=text.replace(
              'assert "B012_RECOVER_RAW_CODE_STAGED qwen3.5-0.8b-control 34155931982" in active',
              'assert "B012_RECOVER_RAW_CODE_CASE_CHECKPOINT qwen3.5-0.8b-control 34155931982" in active',
              1,
          )
          text += '''\n\ndef test_case_checkpoint_activation_is_exactly_bound_and_non_authorizing() -> None:\n    manifest = _read_json(MANIFEST)\n    binding = _read_json(BINDING)\n    activation = manifest["activation"]\n    bound = binding["qwen_raw_code_case_checkpoint_activation"]\n    assert isinstance(activation, dict)\n    assert isinstance(bound, dict)\n    assert activation["activation_base_main"] == "4deca995306c197e5cefaf8202e64fe5469f873c"\n    assert activation["repair_package_merge_commit"] == "4deca995306c197e5cefaf8202e64fe5469f873c"\n    assert activation["repair_package_postmerge_run_id"] == 34261221062\n    assert activation["repair_package_postmerge_evidence_head"] == "f5dac568a809fe9fed707c3c2d8a298c859d16bb"\n    assert activation["active_workflow_materialized"] is True\n    assert binding["status"] == "SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL"\n    assert bound["repair_id"] == manifest["repair_id"]\n    assert bound["candidate_id"] == "qwen3.5-0.8b-control"\n    assert bound["prior_run_id"] == 34155931982\n    assert bound["repair_manifest_sha256"] == _sha256(MANIFEST)\n    assert bound["case_checkpoint_script_sha256"] == _sha256(SCRIPT)\n    assert bound["active_workflow_sha256"] == _sha256(ACTIVE_WORKFLOW)\n    assert bound["activation_base_main"] == "4deca995306c197e5cefaf8202e64fe5469f873c"\n    assert bound["repair_package_postmerge_run_id"] == 34261221062\n    assert bound["repair_package_postmerge_evidence_head"] == "f5dac568a809fe9fed707c3c2d8a298c859d16bb"\n    for key in (\n        "retry_authority_created",\n        "external_dispatch_authority_created",\n        "candidate_expansion",\n        "revision_or_file_expansion",\n        "training",\n        "weight_changing_training",\n        "paid_compute",\n        "paid_model_api",\n        "production_release",\n    ):\n        assert bound[key] is False\n    assert bound["model_access"] == "NONE"\n    assert bound["model_execution"] == "NONE"\n    assert bound["paid_cost_usd"] == 0.0\n'''
          case_test.write_text(text, encoding='utf-8')
          PY

      - name: Prove activation scope and frozen identities
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            '.github/workflows/b012-qwen-raw-code-recovery.yml' \
            'artifacts/manifests/B012-executor-toolchain-binding.json' \
            'artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json' \
            'evidence/mstr-000b/B012-qwen-case-checkpoint-activation.md' \
            'tests/contract/test_b012_executor_binding.py' \
            'tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py' \
            'tests/contract/test_b012_qwen_raw_code_recovery.py' \
            'tests/contract/test_b012_qwen_staged_recovery_topology.py' \
            'tests/contract/test_b012_runner_shutdown_evidence.py' \
            'tests/contract/test_b012_stage_checkpoint_topology.py' | sort)
          test "$(git status --short | awk '{print $2}' | sort)" = "$expected"
          git diff --check
          for path in \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B010-new-candidate-weight-access.json \
            artifacts/manifests/B012-equivalent-qualification-execution-envelope.json \
            artifacts/manifests/B012-executor-toolchain-lock.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml; do
            git diff --quiet "$BASE" -- "$path"
          done
          cmp -s configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml .github/workflows/b012-qwen-raw-code-recovery.yml
          echo 'ACTIVATION_SCOPE_AND_IDENTITIES=PASS'

      - name: Prove activation semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          m=json.loads(Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json').read_text(encoding='utf-8'))
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text(encoding='utf-8'))
          a=b['qwen_raw_code_case_checkpoint_activation']
          active=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          spec=Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          assert active.read_bytes()==spec.read_bytes()
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          assert m['activation']['active_workflow_materialized'] is True
          assert a['repair_manifest_sha256']==sha('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          assert a['case_checkpoint_script_sha256']==sha('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          assert a['active_workflow_sha256']==sha(active)
          assert 'B012_RECOVER_RAW_CODE_CASE_CHECKPOINT qwen3.5-0.8b-control 34155931982' in active.read_text(encoding='utf-8')
          for key in ('retry_authority_created','external_dispatch_authority_created','candidate_expansion','revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert a[key] is False, key
          assert a['model_access']=='NONE' and a['model_execution']=='NONE' and a['paid_cost_usd']==0.0
          print('ACTIVATION_SEMANTICS=PASS')
          PY

      - name: Activation focused and full quality
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py
          python -m mstr_qualify validate
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          python -m ruff format --check \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py

      - name: Create exact activation subject
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add \
            .github/workflows/b012-qwen-raw-code-recovery.yml \
            artifacts/manifests/B012-executor-toolchain-binding.json \
            artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json \
            evidence/mstr-000b/B012-qwen-case-checkpoint-activation.md \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          git commit -m 'fix(b012): activate case-checkpoint Qwen recovery'
          echo "SUBJECT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SUBJECT_TREE=$(git show -s --format=%T HEAD)" >> "$GITHUB_ENV"
          echo "ACTIVATION_SUBJECT=$(git rev-parse HEAD)"
          echo "ACTIVATION_TREE=$(git show -s --format=%T HEAD)"

      - name: Guard and publish activation subject when token permits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          set +e
          out=$(git push origin "HEAD:refs/heads/$TARGET" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          echo "PUBLICATION_RC=$rc"
          echo "ACTIVATION_SUBJECT=$SUBJECT"
          echo "ACTIVATION_TREE=$SUBJECT_TREE"
          if [ "$rc" -eq 0 ]; then
            test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$SUBJECT"
            echo 'ACTIVATION_PUBLICATION=SUCCESS'
          else
            test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
            echo 'ACTIVATION_PUBLICATION=BLOCKED_AFTER_SUCCESSFUL_BUILD'
          fi
