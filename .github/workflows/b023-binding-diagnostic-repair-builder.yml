name: B023 binding diagnostic repair builder

on:
  push:
    branches:
      - evidence/b023-binding-diagnostic-repair-builder

permissions:
  contents: write

env:
  BASE_SHA: db12d1467bb81185a9affffb4d470626ceceddfa
  SOURCE_SHA: bd0a49c9b6b00cc63dc60b148a059921de3c8d51
  SOURCE_TREE: 0c0a17b79b6272cd1ef235a9875fd09b1cb44682
  SOURCE_BRANCH: fix/b023-cross-workstream-bindings-hardened-atomic-20260901
  TARGET_BRANCH: fix/b023-cross-workstream-bindings-hardened-v2-atomic-20260901

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact base and source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$SOURCE_BRANCH | cut -f1)" = "$SOURCE_SHA"
          git fetch origin "$SOURCE_BRANCH"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test -z "$(git ls-remote origin refs/heads/$TARGET_BRANCH)"
      - name: Construct diagnostic-hardened four-file candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" "$BASE_SHA"
          git checkout "$SOURCE_SHA" -- \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md \
            src/mstr_qualify/task_gate.py \
            tests/contract/test_task_gate.py
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/mstr_qualify/task_gate.py')
          source = source_path.read_text(encoding='utf-8')
          old = '''    if checked is not True:\n        reasons.append("prerequisite.state_checkbox_conflict")\n'''
          new = '''    if checked is None:\n        reasons.append("prerequisite.external_checkbox_unverifiable")\n    elif checked is False:\n        reasons.append("prerequisite.state_checkbox_conflict")\n'''
          assert source.count(old) == 1
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          tests_path = Path('tests/contract/test_task_gate.py')
          tests = tests_path.read_text(encoding='utf-8')
          extra = r'''


def test_external_prerequisite_missing_checklist_is_reported_unverifiable(
    tmp_path: Path,
) -> None:
    catalog_path = _write_external_binding_fixture(
        tmp_path,
        "**Task:** `MSTR-000A / A006`\n**State:** `COMPLETE_CANONICAL`\n",
    )
    external_tasks = (
        tmp_path / "specs" / "001-agent-harness-verified-loop-foundation" / "tasks.md"
    )
    external_tasks.unlink()

    result = evaluate_task_snapshot(
        "B001",
        repository_root=tmp_path,
        catalog_path=catalog_path,
        canonical_main=_CANONICAL_MAIN,
    )

    assert result["eligible"] is False
    predecessor = result["prerequisite_results"][0]
    assert "prerequisite.external_checkbox_unverifiable" in predecessor["reasons"]
    assert "prerequisite.state_checkbox_conflict" not in predecessor["reasons"]


def test_external_prerequisite_unchecked_checklist_remains_checkbox_conflict(
    tmp_path: Path,
) -> None:
    catalog_path = _write_external_binding_fixture(
        tmp_path,
        "**Task:** `MSTR-000A / A006`\n**State:** `COMPLETE_CANONICAL`\n",
    )
    external_tasks = (
        tmp_path / "specs" / "001-agent-harness-verified-loop-foundation" / "tasks.md"
    )
    external_tasks.write_text("- [ ] **A006 External task.**\n", encoding="utf-8")

    result = evaluate_task_snapshot(
        "B001",
        repository_root=tmp_path,
        catalog_path=catalog_path,
        canonical_main=_CANONICAL_MAIN,
    )

    assert result["eligible"] is False
    predecessor = result["prerequisite_results"][0]
    assert "prerequisite.state_checkbox_conflict" in predecessor["reasons"]
    assert "prerequisite.external_checkbox_unverifiable" not in predecessor["reasons"]
'''
          tests_path.write_text(tests + extra, encoding='utf-8')

          evidence_path = Path(
              'evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md'
          )
          evidence = evidence_path.read_text(encoding='utf-8').rstrip()
          evidence += '''\n\n## Review diagnostic hardening\n\nIndependent review also identified that an absent, unreadable, or non-unique external checklist entry was reported as `prerequisite.state_checkbox_conflict`. The repair now distinguishes an unverifiable checklist as `prerequisite.external_checkbox_unverifiable` while preserving `prerequisite.state_checkbox_conflict` for a uniquely located but unchecked checklist entry. Both cases remain fail-closed.\n'''
          evidence_path.write_text(evidence, encoding='utf-8')
          PY
          git diff --check
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat >"$expected" <<'EOF'
          configs/task-gate/mstr-000b.json
          evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md
          src/mstr_qualify/task_gate.py
          tests/contract/test_task_gate.py
          EOF
          git diff --name-only "$BASE_SHA" | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md
      - name: Run complete frozen gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
      - name: Commit atomic candidate and prove prospective eligibility
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MSTR Evidence Builder'
          git config user.email 'mstr-evidence-builder@users.noreply.github.com'
          git add configs/task-gate/mstr-000b.json evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py
          git commit -m 'fix(task-gate): distinguish unverifiable external checklists'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          CANDIDATE_SHA="$candidate" python - <<'PY'
          import os
          from mstr_qualify.task_gate import evaluate_task_snapshot

          candidate = os.environ['CANDIDATE_SHA']
          result = evaluate_task_snapshot('B023', canonical_main=candidate)
          assert result['eligible'] is True, result
          prereqs = {row['task_id']: row for row in result['prerequisite_results']}
          for task_id in ('A006', 'A014', 'B002', 'B022'):
              assert prereqs[task_id]['satisfied'] is True, prereqs[task_id]
          print('B023_PROSPECTIVE_ELIGIBILITY=PASS')
          PY
          test "$(git diff --name-only "$BASE_SHA..HEAD" | wc -l)" -eq 4
          test -z "$(git diff --name-only "$BASE_SHA..HEAD" | grep '^\.github/workflows/' || true)"
          echo "CANDIDATE_SHA=$candidate"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Guarded push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$SOURCE_BRANCH | cut -f1)" = "$SOURCE_SHA"
          test -z "$(git ls-remote origin refs/heads/$TARGET_BRANCH)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$(git rev-parse HEAD)"
