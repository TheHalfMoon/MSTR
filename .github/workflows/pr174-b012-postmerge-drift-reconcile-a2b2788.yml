name: PR174 B012 postmerge drift reconcile a2b2788

on:
  push:
    branches:
      - evidence/pr174-b012-postmerge-drift-reconcile-a2b2788

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  postmerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify exact merged topology and repair identity
        shell: bash
        run: |
          set -euo pipefail
          MERGE=a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          BASE=4d9e423f7fa2aa6d4f706d5c9ad61dafb24b2513
          HEAD=6290127080459879aa494efdb91aa44bc629a9fc
          TREE=2013b367c3163ab37170b28f611999b54e2dad1f
          test "$(git rev-parse HEAD)" = "$MERGE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^1)" = "$BASE"
          test "$(git rev-parse HEAD^2)" = "$HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MERGE"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          binding = json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          actual = hashlib.sha256(Path('colab/mstr_b012_source.py').read_bytes()).hexdigest()
          assert actual == '890c9d1536ae4046a827789530c186dd02afca80bae8930ef22c2cb6e9ddcf26'
          assert binding['source_script_sha256'] == actual
          failure = binding['repair_evidence']['failed_execution']
          assert failure['run_id'] == 34044413778
          assert failure['classification'] == 'B012_EXECUTION_FAILED_CLOSED'
          print('B012_REPAIR_BINDING_POSTMERGE=PASS')
          PY
      - name: Verify merge-race governance truth via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(url: str):
              req = urllib.request.Request(url, headers=headers)
              return json.load(urllib.request.urlopen(req, timeout=30))

          pr = get('https://api.github.com/repos/TheHalfMoon/MSTR/pulls/174')
          assert pr['merged_at'] == '2026-09-06T16:34:22Z'
          assert pr['merge_commit_sha'] == 'a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          run = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34045842975')
          assert run['conclusion'] == 'failure'
          jobs = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34045842975/jobs?per_page=100')['jobs']
          by_name = {job['name']: job for job in jobs}
          assert by_name['canonical_eligibility']['conclusion'] == 'success'
          assert by_name['exact_head_gates']['conclusion'] == 'success'
          assert by_name['final_premerge']['conclusion'] == 'failure'
          print('PR174_MERGE_RACE_RECORDED=PASS')
          print('MANDATORY_PREMERGE_FINAL_GUARD=FAILURE_NOT_RETROACTIVELY_PASS')
          PY
      - name: Re-run exact-main qualification gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_b012_source_envelope.py tests/contract/test_b012_executor_binding.py
          python -m mstr_qualify validate
          python -m mstr_qualify task eligible B012
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check colab/mstr_b012_source.py tests/contract/test_b012_source_envelope.py
          python -m mypy src/mstr_qualify
          git diff --exit-code
          git diff --cached --exit-code
      - name: Final exact-main guard
        shell: bash
        run: |
          set -euo pipefail
          MERGE=a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$MERGE"
          echo 'PR174_POSTMERGE_EXACT_MAIN=PASS'
          echo 'PR174_GOVERNANCE_DISPOSITION=MERGED_BEFORE_FINAL_PREMERGE_GUARD; FORWARD_ONLY_RECONCILIATION_REQUIRED'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
