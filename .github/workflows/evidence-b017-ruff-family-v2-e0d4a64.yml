name: Diagnose B017 Ruff family v2

on:
  push:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e0d4a64929376f91a7aef502abedc2bc4645afbc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff configured baseline
        continue-on-error: true
        run: ruff check src tests
      - name: Ruff src baseline
        continue-on-error: true
        run: ruff check src
      - name: Ruff tests baseline
        continue-on-error: true
        run: ruff check tests
      - name: Ruff E baseline
        continue-on-error: true
        run: ruff check src tests --select E
      - name: Ruff F baseline
        continue-on-error: true
        run: ruff check src tests --select F
      - name: Ruff I baseline
        continue-on-error: true
        run: ruff check src tests --select I
      - name: Ruff UP baseline
        continue-on-error: true
        run: ruff check src tests --select UP
      - name: Ruff B baseline
        continue-on-error: true
        run: ruff check src tests --select B
      - name: Ruff 0.16.4 install
        run: python -m pip install --force-reinstall 'ruff==0.16.4'
      - name: Ruff 0.16.4 configured
        continue-on-error: true
        run: ruff check src tests
      - name: Ruff 0.16.5 install
        run: python -m pip install --force-reinstall 'ruff==0.16.5'
      - name: Ruff 0.16.5 configured
        continue-on-error: true
        run: ruff check src tests
      - name: Ruff 0.16.5 E
        continue-on-error: true
        run: ruff check src tests --select E
      - name: Ruff 0.16.5 F
        continue-on-error: true
        run: ruff check src tests --select F
      - name: Ruff 0.16.5 I
        continue-on-error: true
        run: ruff check src tests --select I
      - name: Ruff 0.16.5 UP
        continue-on-error: true
        run: ruff check src tests --select UP
      - name: Ruff 0.16.5 B
        continue-on-error: true
        run: ruff check src tests --select B
