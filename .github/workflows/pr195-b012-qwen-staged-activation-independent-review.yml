name: PR195 B012 Qwen staged activation independent semantic review

on:
  push:
    branches:
      - evidence/pr195-b012-qwen-staged-activation-independent-review-d362f6e

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 0cff2d57ab78c0189c8557f3e2ec59300bd8082d
      HEAD: d362f6e2db9397c4969b384c3f364c46d8b45dcb
      TREE: 090bab8caec5438448ccb3a0a844478d0356d6b3
      PR: '195'
      QUAL_RUN: '34228831583'
      QUAL_HEAD: 28f1d8c5198b8fa54e56d96d27797f5e9ec3b2b9
      SUBJECT_BRANCH: fix/b012-qwen-staged-recovery-activation
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact reviewed subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.16
          check-latest: false

      - name: Prove exact subject and successful qualification identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          jq -e --arg head "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' /tmp/qual.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==9' /tmp/pr.json >/dev/null

      - name: Prove exact activation scope and immutable authority surfaces
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            '.github/workflows/b012-qwen-raw-code-recovery.yml'
            'artifacts/manifests/B012-executor-toolchain-binding.json'
            'artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json'
            'evidence/mstr-000b/B012-qwen-staged-recovery-activation.md'
            'tests/contract/test_b012_executor_binding.py'
            'tests/contract/test_b012_qwen_raw_code_recovery.py'
            'tests/contract/test_b012_qwen_staged_recovery_topology.py'
            'tests/contract/test_b012_runner_shutdown_evidence.py'
            'tests/contract/test_b012_stage_checkpoint_topology.py'
          )
          [[ ${#actual[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done
          for path in \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B010-new-candidate-weight-access.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_governance.py \
            colab/mstr_b012_qwen_raw_code_recovery_staged.py \
            configs/workflows/b012-qwen-raw-code-recovery-staged.yml; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Independently review activation binding and authority semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          manifest_path=Path('artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json')
          binding_path=Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          active=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          b=json.loads(binding_path.read_text(encoding='utf-8'))
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))

          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert a['task_id']=='B012'
          assert m['task_id']=='B012'
          assert m['candidate_id']=='qwen3.5-0.8b-control'
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['activation']['activation_base_main']=='0cff2d57ab78c0189c8557f3e2ec59300bd8082d'
          assert m['activation']['repair_package_merge_commit']=='0cff2d57ab78c0189c8557f3e2ec59300bd8082d'
          assert m['activation']['repair_package_postmerge_run_id']==34177394009
          assert m['activation']['repair_package_postmerge_evidence_head']=='6e26a1bcaf844cd9a4ff100de54f116cdca77853'
          assert m['activation']['active_workflow_materialized'] is True
          assert m['activation']['activation_repository_change_only'] is True
          assert m['activation']['activation_model_access']=='NONE'
          assert m['activation']['activation_model_execution']=='NONE'
          assert m['activation']['activation_paid_cost_usd']==0.0
          assert sha(m['staged_script_path'])==m['staged_script_sha256']=='f856a353144ad0cc5e63827b46b7e1f41de61116944bef4b86c6e5cd09dd0c32'
          assert sha(m['staged_workflow_spec_path'])==m['staged_workflow_sha256']=='e5a666641af6557efb2aba7091a51db3deef973f6177ab682207a4326d3f4bbe'
          assert active.read_bytes()==Path(m['staged_workflow_spec_path']).read_bytes()
          assert sha(active)==m['staged_workflow_sha256']
          boundary=m['authority_boundary']
          assert boundary['existing_authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          for key in ('authority_scope_modified','authority_transfer','candidate_expansion','candidate_revision_or_file_expansion','external_dispatch_authority_created','paid_compute','paid_model_api','production_release','retry_authority_created','training','weight_changing_training'):
              assert boundary[key] is False, key
          assert boundary['git_model_binaries']==0
          assert boundary['founder_machine_model_binaries']==0
          assert boundary['paid_cost_usd']==0.0
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          activation=b['qwen_raw_code_recovery_staged_activation']
          assert activation['repair_manifest_sha256']==sha(manifest_path)
          assert activation['staged_script_sha256']==m['staged_script_sha256']
          assert activation['active_workflow_sha256']==m['staged_workflow_sha256']
          assert activation['activation_base_main']==m['activation']['activation_base_main']
          for key in ('retry_authority_created','external_dispatch_authority_created','candidate_expansion','revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert activation[key] is False, key
          assert activation['model_access']=='NONE'
          assert activation['model_execution']=='NONE'
          assert activation['paid_cost_usd']==0.0
          PY

      - name: Independently review active workflow durability boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/b012-qwen-raw-code-recovery.yml').read_text(encoding='utf-8')
          assert "github.event.issue.number == 162" in text
          assert "github.event.comment.user.login == 'TheHalfMoon'" in text
          assert "github.event.comment.author_association == 'OWNER'" in text
          assert "github.event.comment.body == 'B012_RECOVER_RAW_CODE_STAGED qwen3.5-0.8b-control 34155931982'" in text
          assert text.count('actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02')==5
          assert 'actions/download-artifact@' not in text
          assert 'actions/cache@' not in text
          assert '.gguf' not in text and '.safetensors' not in text
          stages=['--stage init','--stage source','--stage quantize','--stage raw-code','--stage finalize']
          positions=[text.index(x) for x in stages]
          assert positions==sorted(positions)
          assert text.index('Upload stage 01 JSON checkpoint') < text.index('--stage source')
          assert text.index('Upload stage 02 JSON checkpoint') < text.index('--stage quantize')
          assert text.index('Upload stage 03 JSON checkpoint') < text.index('--stage raw-code')
          assert text.index('Upload stage 04 JSON checkpoint') < text.index('--stage finalize')
          PY

      - name: Independently exercise staged failure-state truthfulness
        shell: bash
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          cat > /tmp/test_review_failure_states.py <<'PY'
          import argparse
          import json
          from pathlib import Path
          import mstr_b012_qwen_raw_code_recovery_staged as s

          def write_state(path: Path, completed, extra_paths, model_access_state):
              s._write(s._state_path(path), {
                  'task_id':'B012','candidate_id':s.CANDIDATE_ID,
                  'canonical_main_at_start':'a'*40,
                  'completed_stages':list(completed),
                  'last_completed_stage':completed[-1] if completed else None,
                  'model_access_state':model_access_state,
                  'local_ephemeral_paths':{'workdir':str(path/'work'), **extra_paths},
              })

          def fail(msg): raise RuntimeError(msg)
          def failure(path): return json.loads(s._failure_path(path).read_text(encoding='utf-8'))

          def test_source_failure(tmp_path, monkeypatch):
              write_state(tmp_path,['init'],{},'NONE')
              monkeypatch.setattr(s,'_require_stage_main',lambda *a,**k: ({},{},{},{}))
              monkeypatch.setattr(s,'download_candidate',lambda **k: fail('source boom'))
              assert s.execute(argparse.Namespace(stage='source',output_dir=tmp_path,workdir=tmp_path/'work'))==1
              d=failure(tmp_path)
              assert d['model_access_state']=='EXACT_B010_FILE_REACQUISITION_IN_PROGRESS'
              assert d['completed_stages']==['init']
              assert d['model_quality_verdict']=='NONE'

          def test_quantize_failure(tmp_path, monkeypatch):
              paths={k:str(tmp_path/k) for k in ('python_exe','conversion_dir','quantizer','source_dir')}
              write_state(tmp_path,['init','source'],paths,'EXACT_B010_FILES_REACQUIRED_VERIFIED')
              monkeypatch.setattr(s,'_require_stage_main',lambda *a,**k: ({},{},{},{}))
              monkeypatch.setattr(s,'convert_quantize',lambda **k: fail('quantize boom'))
              assert s.execute(argparse.Namespace(stage='quantize',output_dir=tmp_path,workdir=tmp_path/'work'))==1
              d=failure(tmp_path)
              assert d['model_access_state']=='EXACT_Q4_REGENERATION_IN_PROGRESS'
              assert d['completed_stages']==['init','source']
              assert d['candidate_admission_decision']=='NONE'

          def test_raw_code_failure(tmp_path, monkeypatch):
              paths={'cli':str(tmp_path/'cli'),'q4':str(tmp_path/'q4')}
              write_state(tmp_path,['init','source','quantize'],paths,'EXACT_Q4_REGENERATED_VERIFIED')
              monkeypatch.setattr(s,'_require_stage_main',lambda *a,**k: ({},{},{},{}))
              monkeypatch.setattr(s,'read_json',lambda *a,**k: {})
              monkeypatch.setattr(s,'run_raw_code_proxy',lambda **k: fail('raw boom'))
              assert s.execute(argparse.Namespace(stage='raw-code',output_dir=tmp_path,workdir=tmp_path/'work'))==1
              d=failure(tmp_path)
              assert d['model_access_state']=='RAW_CODE_EXECUTION_IN_PROGRESS'
              assert d['completed_stages']==['init','source','quantize']
              assert d['retry_authority_created'] is False
              assert d['external_dispatch_authority_created'] is False
          PY
          python -m pytest -q /tmp/test_review_failure_states.py

      - name: Independently exercise finalize semantics
        shell: bash
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          cat > /tmp/test_review_finalize.py <<'PY'
          import json
          import mstr_b012_qwen_raw_code_recovery_staged as s

          def test_finalize_contains_complete_stage_chain(tmp_path, monkeypatch):
              s._write(s._state_path(tmp_path),{
                  'task_id':'B012','candidate_id':s.CANDIDATE_ID,
                  'canonical_main_at_start':'a'*40,'started_utc':'2026-09-08T00:00:00Z',
                  'completed_stages':['init','source','quantize','raw-code'],
                  'last_completed_stage':'raw-code','model_access_state':'RAW_CODE_EXECUTION_COMPLETE',
                  'source_verification':[],
                  'regenerated_q4':{'sha256':s.EXPECTED_Q4_K_M_SHA256,'size_bytes':s.EXPECTED_Q4_K_M_SIZE_BYTES},
                  'raw_code_proxy':{'score':0.5},'repair_id':'review-fixture',
                  'producer_replay':{},'tool_identity':{},
                  'local_ephemeral_paths':{'workdir':str(tmp_path/'work')},
              })
              monkeypatch.setattr(s,'_require_stage_main',lambda *a,**k: ({},{},{},{}))
              monkeypatch.setattr(s,'_require_live_main',lambda *a,**k: 'a'*40)
              s._stage_finalize(repo_root=tmp_path, output_dir=tmp_path)
              result=json.loads(s._result_path(tmp_path).read_text(encoding='utf-8'))
              state=json.loads(s._state_path(tmp_path).read_text(encoding='utf-8'))
              expected=['init','source','quantize','raw-code','finalize']
              assert result['completed_stages']==expected
              assert result['model_access_state']=='RAW_CODE_EXECUTION_COMPLETE'
              assert result['candidate_admission_decision']=='NOT_MADE_BY_B012_RECOVERY'
              assert state['completed_stages']==expected
              assert state['last_completed_stage']=='finalize'
          PY
          python -m pytest -q /tmp/test_review_finalize.py

      - name: Independent focused and full quality confirmation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Prove no blocking reviews or unresolved threads
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" > /tmp/reviews.json
          jq -e 'all(.[]; .state != "CHANGES_REQUESTED")' /tmp/reviews.json >/dev/null
          gh api graphql -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner=TheHalfMoon -f repo=MSTR -F pr=195 > /tmp/threads.json
          jq -e '.data.repository.pullRequest.reviewThreads.nodes | all(.isResolved == true)' /tmp/threads.json >/dev/null

      - name: Final independent live guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==9' /tmp/pr-final.json >/dev/null
          echo 'PR195_INDEPENDENT_SEMANTIC_REVIEW=PASS'
