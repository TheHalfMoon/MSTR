name: Build B017 canonical closeout

on:
  push:

permissions:
  contents: write

env:
  EXPECTED_MAIN: 79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c
  TARGET_BRANCH: docs/000b-b017-canonicalize

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/000b-b017-canonicalize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Bind canonical baseline and unmodified closeout branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain)"
      - name: Apply B017 canonical closeout record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement in {path}; found {count}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "configs/task-gate/mstr-000b.json",
              '    "B017": {\n      "canonical_state": "PENDING",',
              '    "B017": {\n      "canonical_state": "COMPLETE_CANONICAL",',
          )

          replace_once(
              "specs/002-code-model-supremacy-foundation/tasks.md",
              '- [ ] **B017 Build a tiny fixture-only software-evolution extractor/projection proof.**  \n  No large corpus ingestion. Demonstrate deterministic projection of localization/edit/review-repair examples from synthetic or already-repository-owned fixtures.  \n  Outputs: implementation/tests/fixtures, `evidence/mstr-000b/B017-evolution-fixture-pilot.md`.\n',
              '- [x] **B017 Build a tiny fixture-only software-evolution extractor/projection proof.**\n  No large corpus ingestion. Demonstrate deterministic projection of localization/edit/review-repair examples from synthetic or already-repository-owned fixtures.  \n  Outputs: implementation/tests/fixtures, `evidence/mstr-000b/B017-evolution-fixture-pilot.md`.\n  Canonical implementation: PR #73 / final head `6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3` / merge `79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c`.\n',
          )

          replace_once(
              "evidence/mstr-000b/B017-evolution-fixture-pilot.md",
              '**Task:** `B017`\n**State:** IMPLEMENTED_PENDING_CANONICAL_CLOSEOUT\n**Canonical main at execution:** `f7a386214a1346b75dd3311390aa1e19bf354bb1`\n**Exact entry evidence:** run `33174634290` / job `98859944051` — SUCCESS\n',
              '**Task:** `B017`\n**Implementation PR:** #73\n**Final implementation head:** `6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3`\n**Canonical implementation merge:** `79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c`\n**State:** COMPLETE_CANONICAL\n**Canonical main at execution:** `f7a386214a1346b75dd3311390aa1e19bf354bb1`\n**Exact entry evidence:** run `33174634290` / job `98859944051` — SUCCESS\n',
          )

          evidence = Path("evidence/mstr-000b/B017-evolution-fixture-pilot.md")
          evidence_text = evidence.read_text(encoding="utf-8")
          marker = "## Canonical Implementation Closeout\n"
          if marker in evidence_text:
              raise SystemExit("B017 closeout section already exists")
          evidence_text += '''\n## Canonical Implementation Closeout\n\nThe fixture-only implementation was merged without widening authority or source scope.\n\n- implementation PR: `#73`\n- final implementation head: `6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3`\n- canonical implementation merge: `79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c`\n- exact-final-head qualification: run `33179382488` — SUCCESS\n- independent adversarial review: run `33179494695` / job `98876712043` — SUCCESS\n- mandatory pre-merge verification: run `33180496859` — SUCCESS\n- post-merge implementation verification: run `33182524688` — SUCCESS\n\nThis closeout changes only canonical task/provenance state and regression assertions. It grants no external-effect authority. B011 remains blocked.\n'''
          evidence.write_text(evidence_text, encoding="utf-8")

          replace_once(
              "tests/contract/test_task_gate.py",
              '''def test_b016_closeout_opens_b017_fixture_pilot() -> None:\n    result = evaluate_task_snapshot("B017", canonical_main=_CANONICAL_MAIN)\n\n    assert result["eligible"] is True\n    assert result["reasons"] == []\n    assert result["state_consistency_result"]["observed_state"] == "PENDING"\n    assert result["authority_result"]["required"] is False\n    predecessor = next(\n        item for item in result["prerequisite_results"] if item["task_id"] == "B016"\n    )\n    assert predecessor["observed_state"] == "COMPLETE_CANONICAL"\n    assert predecessor["evidence_present"] is True\n    assert predecessor["satisfied"] is True\n    assert predecessor["reasons"] == []\n    validate_instance("mstr-task-eligibility-v0", result)\n''',
              '''def test_b017_is_terminal_after_canonical_closeout() -> None:\n    result = evaluate_task_snapshot("B017", canonical_main=_CANONICAL_MAIN)\n\n    assert result["eligible"] is False\n    assert result["state_consistency_result"]["observed_state"] == "COMPLETE_CANONICAL"\n    assert result["state_consistency_result"]["satisfied"] is True\n    assert result["authority_result"]["required"] is False\n    assert "task.already_terminal" in result["reasons"]\n    validate_instance("mstr-task-eligibility-v0", result)\n''',
          )

          unit = Path("tests/unit/test_software_evolution_projection.py")
          unit_text = unit.read_text(encoding="utf-8")
          if "def test_b017_canonical_closeout_provenance_and_authority_boundary" in unit_text:
              raise SystemExit("B017 provenance closeout test already exists")
          unit_text += '''\n\ndef test_b017_canonical_closeout_provenance_and_authority_boundary() -> None:\n    evidence = (ROOT / "evidence" / "mstr-000b" / "B017-evolution-fixture-pilot.md").read_text(\n        encoding="utf-8"\n    )\n    assert "**State:** COMPLETE_CANONICAL" in evidence\n    assert "**Implementation PR:** #73" in evidence\n    assert (\n        "**Final implementation head:** "\n        "`6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3`" in evidence\n    )\n    assert (\n        "**Canonical implementation merge:** "\n        "`79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c`" in evidence\n    )\n    assert "run `33179382488` — SUCCESS" in evidence\n    assert "run `33179494695` / job `98876712043` — SUCCESS" in evidence\n    assert "run `33180496859` — SUCCESS" in evidence\n    assert "run `33182524688` — SUCCESS" in evidence\n    assert "MODEL_WEIGHT_ACCESS = NONE" in evidence\n    assert "LARGE_DATASET_INGESTION = NONE" in evidence\n    assert "WEIGHT_CHANGING_TRAINING = NONE" in evidence\n'''
          unit.write_text(unit_text, encoding="utf-8")

          cli = Path("tests/integration/test_task_gate_cli.py")
          cli_text = cli.read_text(encoding="utf-8")
          if "def test_task_eligible_b017_terminal_returns_one" in cli_text:
              raise SystemExit("B017 CLI closeout test already exists")
          cli_text += '''\n\ndef test_task_eligible_b017_terminal_returns_one(\n    monkeypatch: pytest.MonkeyPatch, capsys: pytest.CaptureFixture[str]\n) -> None:\n    expected = evaluate_task_snapshot("B017", canonical_main=_CANONICAL_MAIN)\n\n    def fake_evaluate_task_eligibility(task_id: str) -> dict[str, object]:\n        assert task_id == "B017"\n        return expected\n\n    monkeypatch.setattr(\n        "mstr_qualify.cli.evaluate_task_eligibility", fake_evaluate_task_eligibility\n    )\n    exit_code = main(["task", "eligible", "B017"])\n    payload = _stdout_json(capsys)\n    assert exit_code == 1\n    assert payload == expected\n    assert payload["eligible"] is False\n    assert "task.already_terminal" in payload["reasons"]\n    validate_instance("mstr-task-eligibility-v0", payload)\n'''
          cli.write_text(cli_text, encoding="utf-8")
          PY
          git diff --check
          expected=$(printf '%s\n' configs/task-gate/mstr-000b.json evidence/mstr-000b/B017-evolution-fixture-pilot.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_software_evolution_projection.py | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
      - run: python -m pip install -e '.[dev]'
      - name: Focused closeout regressions
        run: pytest -q tests/unit/test_software_evolution_projection.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
      - name: Frozen repository gates
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy
      - name: Commit and fast-forward closeout branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add configs/task-gate/mstr-000b.json evidence/mstr-000b/B017-evolution-fixture-pilot.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_software_evolution_projection.py
          git commit -m "docs(mstr-000b): canonicalize B017 closeout"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
