name: Build A017 trajectory contract candidate

on:
  push:
    branches:
      - automation/a017-contract-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact A017 candidate on focused feature branch
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH='feat/000a-a017-trajectory-contract'
          EXPECTED_HEAD='0bd69861b987c616e1b9b25ef88a5d14f4762788'
          git fetch origin "$TARGET_BRANCH" --quiet
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from __future__ import annotations

          import copy
          import json
          from pathlib import Path

          ROOT = Path('.')
          FAILURES = [
              'WRONG_LOCALIZATION',
              'BAD_ASSUMPTION',
              'STALE_FILE',
              'BAD_PATCH',
              'SYNTAX_ERROR',
              'TYPE_ERROR',
              'BUILD_FAILURE',
              'TEST_FAILURE',
              'DEPENDENCY_FAILURE',
              'TOOL_ERROR',
              'TIMEOUT',
              'INCOMPLETE_IMPLEMENTATION',
              'OVEREDIT',
              'REGRESSION',
              'FAKE_COMPLETION',
              'AUTHORITY_VIOLATION',
              'ENVIRONMENT_FAILURE',
              'VERIFIER_FAILURE',
          ]
          TERMINALS = [
              'VERIFIED_SUCCESS',
              'RECOVERED_SUCCESS',
              'FAILED_VALID',
              'TIMEOUT_VALID',
              'INVALID_ENVIRONMENT',
              'INVALID_VERIFIER',
              'CONTAMINATED',
              'LEAKAGE_DETECTED',
              'AUTHORITY_VIOLATION',
          ]
          HEALTH_CLASSES = [
              'HEALTHY',
              'PARTIAL',
              'DISAGREEMENT',
              'BROKEN',
              'LEAKED',
              'TAMPERED',
          ]
          TRAINING_ADMISSIONS = [
              'ADMITTED_SFT',
              'ADMITTED_PREFERENCE',
              'ADMITTED_RL_EVIDENCE',
              'EVAL_ONLY',
              'REJECTED',
          ]

          run_identity = {
              'type': 'object',
              'additionalProperties': False,
              'required': [
                  'run_id',
                  'task_manifest_id',
                  'repository_revision',
                  'environment_manifest_id',
                  'model_id',
                  'model_revision',
                  'artifact_sha256',
                  'runtime_id',
                  'interaction_contract_id',
                  'loop_contract_id',
                  'harness_profile_id',
                  'verifier_manifest_id',
                  'sampling_config',
                  'seed',
                  'timeout_seconds',
                  'cache_state',
                  'hardware_profile_id',
              ],
              'properties': {
                  'run_id': {'type': 'string', 'minLength': 1, 'maxLength': 256},
                  'task_manifest_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                  'repository_revision': {'type': 'string', 'minLength': 1, 'maxLength': 256},
                  'environment_manifest_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                  'model_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                  'model_revision': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                  'artifact_sha256': {'type': 'string', 'pattern': '^[0-9a-f]{64}$'},
                  'runtime_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                  'interaction_contract_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                  'loop_contract_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                  'harness_profile_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                  'verifier_manifest_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                  'sampling_config': {'type': 'object'},
                  'seed': {'type': ['integer', 'string']},
                  'timeout_seconds': {'type': 'integer', 'minimum': 1, 'maximum': 86400},
                  'cache_state': {'type': 'string', 'minLength': 1, 'maxLength': 128},
                  'hardware_profile_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
              },
          }

          verifier_health_binding = {
              'type': ['object', 'null'],
              'oneOf': [
                  {'type': 'null'},
                  {
                      'type': 'object',
                      'additionalProperties': False,
                      'required': [
                          'schema_version',
                          'verifier_health_id',
                          'task_identity',
                          'verifier_manifest_id',
                          'health_class',
                          'stage_id',
                          'stage_admission_class',
                      ],
                      'properties': {
                          'schema_version': {'const': 'mstr.verifier-health.v0'},
                          'verifier_health_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                          'task_identity': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                          'verifier_manifest_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                          'health_class': {'enum': HEALTH_CLASSES},
                          'stage_id': {'type': 'string', 'minLength': 1, 'maxLength': 256},
                          'stage_admission_class': {
                              'enum': [
                                  'CLEAN_POSITIVE_ELIGIBLE',
                                  'RESEARCH_DIAGNOSTIC_ONLY',
                                  'BLOCKED',
                              ]
                          },
                      },
                      'allOf': [
                          {
                              'if': {
                                  'properties': {
                                      'health_class': {'enum': ['PARTIAL', 'DISAGREEMENT']}
                                  },
                                  'required': ['health_class'],
                              },
                              'then': {
                                  'properties': {
                                      'stage_admission_class': {
                                          'enum': ['RESEARCH_DIAGNOSTIC_ONLY', 'BLOCKED']
                                      }
                                  }
                              },
                          },
                          {
                              'if': {
                                  'properties': {
                                      'health_class': {'enum': ['BROKEN', 'LEAKED', 'TAMPERED']}
                                  },
                                  'required': ['health_class'],
                              },
                              'then': {
                                  'properties': {'stage_admission_class': {'const': 'BLOCKED'}}
                              },
                          },
                      ],
                  },
              ],
          }

          provenance = {
              'type': 'object',
              'additionalProperties': False,
              'required': [
                  'source_class',
                  'source_identity',
                  'provenance_status',
                  'rights_status',
                  'secret_scan_status',
                  'contamination_evidence_identity',
              ],
              'properties': {
                  'source_class': {
                      'enum': [
                          'PUBLIC_REPOSITORY',
                          'SYNTHETIC_FIXTURE',
                          'REPOSITORY_OWNED_FIXTURE',
                          'PRIVATE_USER_REPOSITORY',
                          'PRODUCTION_TRACE',
                          'OTHER_GOVERNED',
                      ]
                  },
                  'source_identity': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                  'provenance_status': {'enum': ['COMPLETE', 'INCOMPLETE', 'UNRESOLVED']},
                  'rights_status': {
                      'enum': ['COMPATIBLE', 'INCOMPATIBLE', 'UNRESOLVED', 'NOT_APPLICABLE']
                  },
                  'secret_scan_status': {'enum': ['CLEAR', 'DETECTED', 'NOT_APPLICABLE']},
                  'contamination_evidence_identity': {
                      'type': 'string',
                      'minLength': 1,
                      'maxLength': 512,
                  },
              },
          }

          schema = {
              '$schema': 'https://json-schema.org/draft/2020-12/schema',
              '$id': 'https://mstr.local/schemas/mstr-trajectory-manifest-v0.json',
              'title': 'MSTR Trajectory Manifest v0',
              'type': 'object',
              'additionalProperties': False,
              'required': [
                  'schema_version',
                  'trajectory_id',
                  'run_identity',
                  'event_log_schema_version',
                  'event_log_sha256',
                  'event_count',
                  'failure_taxonomy_version',
                  'terminal_class',
                  'verifier_result_identity',
                  'verifier_health_binding',
                  'failure_classes',
                  'recovery_count',
                  'authority_violations',
                  'contamination_status',
                  'training_admission',
                  'admission_policy_version',
                  'admission_reasons',
                  'provenance',
              ],
              'properties': {
                  'schema_version': {'const': 'mstr.trajectory-manifest.v0'},
                  'trajectory_id': {'type': 'string', 'minLength': 1, 'maxLength': 512},
                  'run_identity': run_identity,
                  'event_log_schema_version': {'const': 'mstr.run-event.v0'},
                  'event_log_sha256': {'type': 'string', 'pattern': '^[0-9a-f]{64}$'},
                  'event_count': {'type': 'integer', 'minimum': 1},
                  'failure_taxonomy_version': {'const': 'mstr.failure-taxonomy.v0'},
                  'terminal_class': {'enum': TERMINALS},
                  'verifier_result_identity': {
                      'type': ['string', 'null'],
                      'minLength': 1,
                      'maxLength': 512,
                  },
                  'verifier_health_binding': verifier_health_binding,
                  'failure_classes': {
                      'type': 'array',
                      'items': {'enum': FAILURES},
                      'uniqueItems': True,
                  },
                  'recovery_count': {'type': 'integer', 'minimum': 0},
                  'authority_violations': {
                      'type': 'array',
                      'items': {'type': 'string', 'minLength': 1, 'maxLength': 256},
                      'uniqueItems': True,
                  },
                  'contamination_status': {'enum': ['CLEAR', 'SUSPECT', 'REJECTED']},
                  'training_admission': {'enum': TRAINING_ADMISSIONS},
                  'admission_policy_version': {'const': 'mstr.trajectory-admission.v0'},
                  'admission_reasons': {
                      'type': 'array',
                      'items': {'type': 'string', 'minLength': 1, 'maxLength': 256},
                      'uniqueItems': True,
                  },
                  'training_labels': {'type': 'object'},
                  'provenance': provenance,
              },
              'allOf': [
                  {
                      'if': {
                          'properties': {
                              'terminal_class': {'enum': ['VERIFIED_SUCCESS', 'RECOVERED_SUCCESS']}
                          },
                          'required': ['terminal_class'],
                      },
                      'then': {
                          'properties': {
                              'contamination_status': {'const': 'CLEAR'},
                              'verifier_result_identity': {
                                  'type': 'string',
                                  'minLength': 1,
                                  'maxLength': 512,
                              },
                          }
                      },
                  },
                  {
                      'if': {
                          'properties': {'terminal_class': {'const': 'VERIFIED_SUCCESS'}},
                          'required': ['terminal_class'],
                      },
                      'then': {
                          'properties': {
                              'failure_classes': {'maxItems': 0},
                              'recovery_count': {'const': 0},
                          }
                      },
                  },
                  {
                      'if': {
                          'properties': {'terminal_class': {'const': 'RECOVERED_SUCCESS'}},
                          'required': ['terminal_class'],
                      },
                      'then': {
                          'properties': {
                              'failure_classes': {'minItems': 1},
                              'recovery_count': {'minimum': 1},
                          }
                      },
                  },
                  {
                      'if': {
                          'properties': {'terminal_class': {'const': 'FAILED_VALID'}},
                          'required': ['terminal_class'],
                      },
                      'then': {
                          'properties': {
                              'failure_classes': {'minItems': 1},
                              'training_admission': {
                                  'enum': [
                                      'ADMITTED_PREFERENCE',
                                      'ADMITTED_RL_EVIDENCE',
                                      'EVAL_ONLY',
                                      'REJECTED',
                                  ]
                              },
                          }
                      },
                  },
                  {
                      'if': {
                          'properties': {'terminal_class': {'const': 'TIMEOUT_VALID'}},
                          'required': ['terminal_class'],
                      },
                      'then': {
                          'properties': {
                              'failure_classes': {
                                  'contains': {'const': 'TIMEOUT'},
                                  'minContains': 1,
                              },
                              'training_admission': {
                                  'enum': [
                                      'ADMITTED_PREFERENCE',
                                      'ADMITTED_RL_EVIDENCE',
                                      'EVAL_ONLY',
                                      'REJECTED',
                                  ]
                              },
                          }
                      },
                  },
                  {
                      'if': {
                          'properties': {'terminal_class': {'const': 'INVALID_ENVIRONMENT'}},
                          'required': ['terminal_class'],
                      },
                      'then': {
                          'properties': {
                              'failure_classes': {
                                  'contains': {'const': 'ENVIRONMENT_FAILURE'},
                                  'minContains': 1,
                              },
                              'training_admission': {'const': 'REJECTED'},
                          }
                      },
                  },
                  {
                      'if': {
                          'properties': {'terminal_class': {'const': 'INVALID_VERIFIER'}},
                          'required': ['terminal_class'],
                      },
                      'then': {
                          'properties': {
                              'failure_classes': {
                                  'contains': {'const': 'VERIFIER_FAILURE'},
                                  'minContains': 1,
                              },
                              'training_admission': {'const': 'REJECTED'},
                          }
                      },
                  },
                  {
                      'if': {
                          'properties': {
                              'terminal_class': {'enum': ['CONTAMINATED', 'LEAKAGE_DETECTED']}
                          },
                          'required': ['terminal_class'],
                      },
                      'then': {'properties': {'training_admission': {'const': 'REJECTED'}}},
                  },
                  {
                      'if': {
                          'properties': {'terminal_class': {'const': 'AUTHORITY_VIOLATION'}},
                          'required': ['terminal_class'],
                      },
                      'then': {
                          'properties': {
                              'failure_classes': {
                                  'contains': {'const': 'AUTHORITY_VIOLATION'},
                                  'minContains': 1,
                              },
                              'authority_violations': {'minItems': 1},
                              'training_admission': {'const': 'REJECTED'},
                          }
                      },
                  },
                  {
                      'if': {
                          'properties': {
                              'contamination_status': {'enum': ['SUSPECT', 'REJECTED']}
                          },
                          'required': ['contamination_status'],
                      },
                      'then': {'properties': {'training_admission': {'const': 'REJECTED'}}},
                  },
                  {
                      'if': {
                          'properties': {'authority_violations': {'minItems': 1}},
                          'required': ['authority_violations'],
                      },
                      'then': {'properties': {'training_admission': {'const': 'REJECTED'}}},
                  },
                  {
                      'if': {
                          'properties': {
                              'provenance': {
                                  'properties': {
                                      'source_class': {
                                          'enum': ['PRIVATE_USER_REPOSITORY', 'PRODUCTION_TRACE']
                                      }
                                  },
                                  'required': ['source_class'],
                              }
                          },
                          'required': ['provenance'],
                      },
                      'then': {'properties': {'training_admission': {'const': 'REJECTED'}}},
                  },
                  {
                      'if': {
                          'properties': {
                              'provenance': {
                                  'properties': {
                                      'provenance_status': {'enum': ['INCOMPLETE', 'UNRESOLVED']}
                                  },
                                  'required': ['provenance_status'],
                              }
                          },
                          'required': ['provenance'],
                      },
                      'then': {'properties': {'training_admission': {'const': 'REJECTED'}}},
                  },
                  {
                      'if': {
                          'properties': {
                              'provenance': {
                                  'properties': {
                                      'rights_status': {'enum': ['INCOMPATIBLE', 'UNRESOLVED']}
                                  },
                                  'required': ['rights_status'],
                              }
                          },
                          'required': ['provenance'],
                      },
                      'then': {'properties': {'training_admission': {'const': 'REJECTED'}}},
                  },
                  {
                      'if': {
                          'properties': {
                              'provenance': {
                                  'properties': {'secret_scan_status': {'const': 'DETECTED'}},
                                  'required': ['secret_scan_status'],
                              }
                          },
                          'required': ['provenance'],
                      },
                      'then': {'properties': {'training_admission': {'const': 'REJECTED'}}},
                  },
                  {
                      'if': {
                          'properties': {
                              'training_admission': {
                                  'enum': [
                                      'ADMITTED_SFT',
                                      'ADMITTED_PREFERENCE',
                                      'ADMITTED_RL_EVIDENCE',
                                  ]
                              }
                          },
                          'required': ['training_admission'],
                      },
                      'then': {'properties': {'verifier_health_binding': {'type': 'object'}}},
                  },
                  {
                      'if': {
                          'properties': {'training_admission': {'const': 'ADMITTED_SFT'}},
                          'required': ['training_admission'],
                      },
                      'then': {
                          'properties': {
                              'terminal_class': {'enum': ['VERIFIED_SUCCESS', 'RECOVERED_SUCCESS']},
                              'contamination_status': {'const': 'CLEAR'},
                              'verifier_result_identity': {
                                  'type': 'string',
                                  'minLength': 1,
                                  'maxLength': 512,
                              },
                              'authority_violations': {'maxItems': 0},
                              'verifier_health_binding': {
                                  'type': 'object',
                                  'properties': {
                                      'health_class': {'const': 'HEALTHY'},
                                      'stage_admission_class': {'const': 'CLEAN_POSITIVE_ELIGIBLE'},
                                  },
                                  'required': ['health_class', 'stage_admission_class'],
                              },
                              'provenance': {
                                  'type': 'object',
                                  'properties': {
                                      'provenance_status': {'const': 'COMPLETE'},
                                      'rights_status': {'enum': ['COMPATIBLE', 'NOT_APPLICABLE']},
                                      'secret_scan_status': {'enum': ['CLEAR', 'NOT_APPLICABLE']},
                                      'source_class': {
                                          'enum': [
                                              'PUBLIC_REPOSITORY',
                                              'SYNTHETIC_FIXTURE',
                                              'REPOSITORY_OWNED_FIXTURE',
                                              'OTHER_GOVERNED',
                                          ]
                                      },
                                  },
                                  'required': [
                                      'provenance_status',
                                      'rights_status',
                                      'secret_scan_status',
                                      'source_class',
                                  ],
                              },
                          }
                      },
                  },
                  {
                      'if': {
                          'properties': {
                              'training_admission': {
                                  'enum': ['ADMITTED_PREFERENCE', 'ADMITTED_RL_EVIDENCE']
                              }
                          },
                          'required': ['training_admission'],
                      },
                      'then': {
                          'properties': {
                              'verifier_health_binding': {
                                  'type': 'object',
                                  'properties': {
                                      'stage_admission_class': {
                                          'enum': [
                                              'CLEAN_POSITIVE_ELIGIBLE',
                                              'RESEARCH_DIAGNOSTIC_ONLY',
                                          ]
                                      }
                                  },
                                  'required': ['stage_admission_class'],
                              }
                          }
                      },
                  },
              ],
          }

          base_run = {
              'run_id': 'run-a017-001',
              'task_manifest_id': 'direction-task-a017-fixture',
              'repository_revision': '0bd69861b987c616e1b9b25ef88a5d14f4762788',
              'environment_manifest_id': 'env-a017-fixture',
              'model_id': 'N/A_CONTRACT_FIXTURE',
              'model_revision': 'N/A_CONTRACT_FIXTURE',
              'artifact_sha256': '0' * 64,
              'runtime_id': 'N/A_CONTRACT_FIXTURE',
              'interaction_contract_id': 'mstr.interaction.fixture.v0',
              'loop_contract_id': 'mstr.loop-contract.v0',
              'harness_profile_id': 'h0-neutral-fixture',
              'verifier_manifest_id': 'verifier-a017-fixture',
              'sampling_config': {'temperature': 0},
              'seed': 0,
              'timeout_seconds': 60,
              'cache_state': 'EMPTY',
              'hardware_profile_id': 'fixture-hardware',
          }
          health = {
              'schema_version': 'mstr.verifier-health.v0',
              'verifier_health_id': 'vh-a017-healthy',
              'task_identity': 'direction-task-a017-fixture',
              'verifier_manifest_id': 'verifier-a017-fixture',
              'health_class': 'HEALTHY',
              'stage_id': 'MSTR-002-SFT',
              'stage_admission_class': 'CLEAN_POSITIVE_ELIGIBLE',
          }
          provenance_record = {
              'source_class': 'REPOSITORY_OWNED_FIXTURE',
              'source_identity': 'tests/fixtures/schemas/valid/mstr-trajectory-manifest-v0.json',
              'provenance_status': 'COMPLETE',
              'rights_status': 'NOT_APPLICABLE',
              'secret_scan_status': 'NOT_APPLICABLE',
              'contamination_evidence_identity': 'fixture-contamination-clear',
          }
          valid = {
              'schema_version': 'mstr.trajectory-manifest.v0',
              'trajectory_id': 'trajectory-a017-valid',
              'run_identity': base_run,
              'event_log_schema_version': 'mstr.run-event.v0',
              'event_log_sha256': '1' * 64,
              'event_count': 8,
              'failure_taxonomy_version': 'mstr.failure-taxonomy.v0',
              'terminal_class': 'VERIFIED_SUCCESS',
              'verifier_result_identity': 'verifier-result-a017-valid',
              'verifier_health_binding': health,
              'failure_classes': [],
              'recovery_count': 0,
              'authority_violations': [],
              'contamination_status': 'CLEAR',
              'training_admission': 'ADMITTED_SFT',
              'admission_policy_version': 'mstr.trajectory-admission.v0',
              'admission_reasons': [],
              'training_labels': {'label_kind': 'CLEAN_POSITIVE'},
              'provenance': provenance_record,
          }
          invalid = copy.deepcopy(valid)
          invalid['trajectory_id'] = 'trajectory-a017-invalid-partial-sft'
          invalid['verifier_health_binding']['health_class'] = 'PARTIAL'
          invalid['verifier_health_binding']['stage_admission_class'] = 'RESEARCH_DIAGNOSTIC_ONLY'

          taxonomy = {
              'schema_version': 'mstr.failure-taxonomy.v0',
              'authority': 'MSTR-000A-A017',
              'classes': [
                  {'code': 'WRONG_LOCALIZATION', 'category': 'REASONING', 'meaning': 'Work targeted the wrong repository location or symbol.'},
                  {'code': 'BAD_ASSUMPTION', 'category': 'REASONING', 'meaning': 'A material unsupported assumption caused incorrect work.'},
                  {'code': 'STALE_FILE', 'category': 'EDIT', 'meaning': 'An edit was based on stale file state or failed stale-write protection.'},
                  {'code': 'BAD_PATCH', 'category': 'EDIT', 'meaning': 'A proposed patch or deterministic edit could not be applied correctly.'},
                  {'code': 'SYNTAX_ERROR', 'category': 'CODE', 'meaning': 'The resulting code or configuration was syntactically invalid.'},
                  {'code': 'TYPE_ERROR', 'category': 'CODE', 'meaning': 'Type checking or typed contract validation failed.'},
                  {'code': 'BUILD_FAILURE', 'category': 'VERIFICATION', 'meaning': 'The build or compile step failed.'},
                  {'code': 'TEST_FAILURE', 'category': 'VERIFICATION', 'meaning': 'Required tests failed.'},
                  {'code': 'DEPENDENCY_FAILURE', 'category': 'ENVIRONMENT', 'meaning': 'A required dependency or dependency operation failed within authority.'},
                  {'code': 'TOOL_ERROR', 'category': 'TOOL', 'meaning': 'A tool action was invalid, failed, or returned unusable evidence.'},
                  {'code': 'TIMEOUT', 'category': 'BUDGET', 'meaning': 'The admitted run exhausted its timeout before verified completion.'},
                  {'code': 'INCOMPLETE_IMPLEMENTATION', 'category': 'RESULT', 'meaning': 'Required behavior remained incomplete at terminal evaluation.'},
                  {'code': 'OVEREDIT', 'category': 'RESULT', 'meaning': 'The change exceeded the task scope or introduced unnecessary edits.'},
                  {'code': 'REGRESSION', 'category': 'RESULT', 'meaning': 'Previously valid behavior regressed.'},
                  {'code': 'FAKE_COMPLETION', 'category': 'INTEGRITY', 'meaning': 'Completion was claimed without satisfying independent finalizer evidence.'},
                  {'code': 'AUTHORITY_VIOLATION', 'category': 'AUTHORITY', 'meaning': 'The run exceeded an allowed effect, access, or execution authority.'},
                  {'code': 'ENVIRONMENT_FAILURE', 'category': 'ENVIRONMENT', 'meaning': 'The task environment was invalid or failed admission requirements.'},
                  {'code': 'VERIFIER_FAILURE', 'category': 'VERIFIER', 'meaning': 'The verifier was invalid, unavailable, inconsistent, or otherwise unusable as authority.'},
              ],
              'terminal_classes': TERMINALS,
              'training_policy': {
                  'success_requires_independent_verifier': True,
                  'failed_valid_and_timeout_may_be_labeled_evidence': True,
                  'invalid_contaminated_leaked_or_authority_violating_runs_are_rejected': True,
                  'clean_positive_requires_stage_eligible_healthy_verifier': True,
                  'private_user_repository_training_admission': 'REJECTED_IN_V0',
                  'production_trace_training_admission': 'REJECTED_IN_V0',
              },
          }

          schema_text = json.dumps(schema, indent=2, sort_keys=True) + '\n'
          for path in (
              ROOT / 'schemas' / 'mstr-trajectory-manifest-v0.schema.json',
              ROOT
              / 'specs'
              / '001-agent-harness-verified-loop-foundation'
              / 'contracts'
              / 'trajectory-manifest.schema.json',
          ):
