name: Reconcile repaired B027 exact-head qualification

on:
  push:
    branches: [evidence/b027-qualify-reconcile-989bc35]

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  EXPECTED_MAIN: 312d40eee8400a0dab94633f891b206f66a82855
  EXPECTED_HEAD: 989bc35b20ce4be06f71dc4fea4faa58704d47cc
  EXPECTED_TREE: 48c3a23f22146dfa3fe6225f8f353442091c4612
  EXPECTED_COMMITS: '19'
  EXPECTED_FILES: '60'
  PR_NUMBER: '141'
  SOURCE_QUALIFICATION_RUN: '33752686499'
  GH_TOKEN: ${{ github.token }}

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify immutable successful source qualification jobs
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_QUALIFICATION_RUN}" > /tmp/source-run.json
          jq -e '.status == "completed" and .conclusion == "failure" and .head_branch == "evidence/b027-qualify-989bc35" and .head_sha == "9239d21eedcf9a31eb214603011685f7ccff7806"' /tmp/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_QUALIFICATION_RUN}/jobs?per_page=100" > /tmp/source-jobs.json
          jq -e '[.jobs[] | select(.name == "identity_scope" and .status == "completed" and .conclusion == "success")] | length == 1' /tmp/source-jobs.json
          jq -e '[.jobs[] | select(.name == "semantic_campaign" and .status == "completed" and .conclusion == "success")] | length == 1' /tmp/source-jobs.json
          jq -e '[.jobs[] | select(.name == "quality" and .status == "completed" and .conclusion == "success")] | length == 1' /tmp/source-jobs.json
          jq -e '[.jobs[] | select(.name == "canonical_entry" and .status == "completed" and .conclusion == "failure")] | length == 1' /tmp/source-jobs.json

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify real canonical main identity and machine eligibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = "main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B027 > /tmp/b027.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0 and ([.prerequisite_results[] | select(.task_id == "B026" and .observed_state == "COMPLETE_CANONICAL" and .satisfied == true)] | length == 1)' /tmp/b027.json
          set +e
          mstr-qualify task eligible B011 > /tmp/b011.json; rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          test -z "$(git status --porcelain)"

      - name: Final exact PR and remote immutability reconciliation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/000b-b027-ladder-pilot | cut -f1)" = "$EXPECTED_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/git/commits/${EXPECTED_HEAD}" > /tmp/head.json
          jq -e --arg tree "$EXPECTED_TREE" '.tree.sha == $tree' /tmp/head.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$EXPECTED_MAIN" --arg head "$EXPECTED_HEAD" --argjson commits "$EXPECTED_COMMITS" --argjson files "$EXPECTED_FILES" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and .commits == $commits and .changed_files == $files' /tmp/pr.json
          echo "B027_QUALIFIED_HEAD=$EXPECTED_HEAD"
          echo "B027_QUALIFIED_TREE=$EXPECTED_TREE"
          echo "SOURCE_IDENTITY_SCOPE=SUCCESS"
          echo "SOURCE_SEMANTIC_CAMPAIGN=SUCCESS"
          echo "SOURCE_QUALITY=SUCCESS"
          echo "CANONICAL_ENTRY_CORRECTED_PROOF=SUCCESS"
          echo "PREMERGE_CANONICAL_HISTORY=SYNTHETIC_PREFLIGHT_ONLY"
          echo "POSTMERGE_CANONICAL_VALIDATION=MANDATORY"
          echo "MODEL_EXECUTION=NONE"
          echo "WEIGHT_CHANGING_TRAINING=NONE"
