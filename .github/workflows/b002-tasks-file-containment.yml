name: B002 task-markdown containment repair

on:
  push:
    branches:
      - evidence/b002-tasks-file-containment

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: 6aa46472d5913765aebeadc0f1b5a6524ba39a6c
      EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
      TARGET_BRANCH: feat/000b-b002-task-gate
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout guarded B002 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Enforce canonical task-markdown containment
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          gate = Path("src/mstr_qualify/task_gate.py")
          text = gate.read_text(encoding="utf-8")

          helper_start = text.index("def _contained_existing_path(root: Path, candidate: Path) -> Path | None:\n")
          helper_end = text.index("\ndef _path_pattern_present", helper_start)
          helper = text[helper_start:helper_end].rstrip()
          text = text[:helper_start] + text[helper_end + 1:]

          insert_marker = "\ndef _parse_task_markdown(path: Path) -> tuple[dict[str, str], dict[str, bool]]:\n"
          if text.count(insert_marker) != 1:
              raise SystemExit("task markdown insertion marker mismatch")
          text = text.replace(insert_marker, "\n" + helper + "\n\n" + insert_marker.lstrip("\n"), 1)

          old = dedent('''\
              tasks_file = _repository_path(root, tasks_file_raw, field="tasks_file")
              titles, checked = _parse_task_markdown(tasks_file)
          ''')
          new = dedent('''\
              tasks_file = _repository_path(root, tasks_file_raw, field="tasks_file")
              contained_tasks_file = _contained_existing_path(root, tasks_file)
              if contained_tasks_file is None or not contained_tasks_file.is_file():
                  raise QualificationError(
                      "canonical task markdown must be a repository-contained regular file",
                      code="task_gate.tasks_file_invalid",
                      details={"path": str(tasks_file), "root": str(root)},
                  )
              tasks_file = contained_tasks_file
              titles, checked = _parse_task_markdown(tasks_file)
          ''')
          if text.count(old) != 1:
              raise SystemExit(f"tasks_file anchor mismatch: {text.count(old)}")
          text = text.replace(old, new, 1)
          gate.write_text(text.rstrip() + "\n", encoding="utf-8")

          tests = Path("tests/contract/test_task_gate.py")
          test_text = tests.read_text(encoding="utf-8").rstrip()
          if "test_tasks_file_symlink_outside_repository_is_rejected" in test_text:
              raise SystemExit("containment regression tests already present")
          addition = dedent(r'''\


          def test_tasks_file_symlink_outside_repository_is_rejected(tmp_path: Path) -> None:
              catalog_path = _write_minimal_catalog(tmp_path, b001_checked=True)
              tasks_path = tmp_path / "specs" / "002-code-model-supremacy-foundation" / "tasks.md"
              outside = tmp_path.parent / f"{tmp_path.name}-outside-tasks.md"
              outside.write_text(
                  "- [x] **B001 Root task.**\n- [ ] **B002 Target task.**\n",
                  encoding="utf-8",
              )
              tasks_path.unlink()
              _symlink_or_skip(tasks_path, outside)

              with pytest.raises(QualificationError) as captured:
                  load_task_catalog(catalog_path, repository_root=tmp_path)
              assert captured.value.code == "task_gate.tasks_file_invalid"


          def test_external_symlink_cannot_satisfy_literal_required_evidence(tmp_path: Path) -> None:
              catalog_path = _write_minimal_catalog(tmp_path, b001_checked=True)
              canonical_evidence = tmp_path / "evidence" / "B001.md"
              outside = tmp_path.parent / f"{tmp_path.name}-outside-evidence.md"
              outside.write_text("external evidence\n", encoding="utf-8")
              canonical_evidence.unlink()
              _symlink_or_skip(canonical_evidence, outside)

              result = evaluate_task_snapshot(
                  "B002",
                  repository_root=tmp_path,
                  catalog_path=catalog_path,
                  canonical_main=_CANONICAL_MAIN,
              )
              predecessor = result["prerequisite_results"][0]
              assert result["eligible"] is False
              assert predecessor["evidence_present"] is False
              assert "prerequisite.required_artifact_missing" in predecessor["reasons"]


          def test_external_symlink_cannot_satisfy_globbed_required_evidence(tmp_path: Path) -> None:
              catalog_path = _write_minimal_catalog(tmp_path, b001_checked=True)
              data = json.loads(catalog_path.read_text(encoding="utf-8"))
              data["tasks"]["B001"]["evidence_outputs"] = ["evidence/*.md"]
              catalog_path.write_text(json.dumps(data), encoding="utf-8")

              canonical_evidence = tmp_path / "evidence" / "B001.md"
              outside = tmp_path.parent / f"{tmp_path.name}-outside-glob-evidence.md"
              outside.write_text("external evidence\n", encoding="utf-8")
              canonical_evidence.unlink()
              _symlink_or_skip(canonical_evidence, outside)

              result = evaluate_task_snapshot(
                  "B002",
                  repository_root=tmp_path,
                  catalog_path=catalog_path,
                  canonical_main=_CANONICAL_MAIN,
              )
              predecessor = result["prerequisite_results"][0]
              assert result["eligible"] is False
              assert predecessor["evidence_present"] is False
              assert "prerequisite.required_artifact_missing" in predecessor["reasons"]
          ''')
          tests.write_text(test_text + addition + "\n", encoding="utf-8")

      - name: Verify source and bounded mutation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py | sort)"
          test "$actual" = "$expected"
          python -m py_compile src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Run targeted and frozen gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy
          python -m mstr_qualify validate

      - name: Guarded commit and fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py
          git commit -m "fix(mstr-000b): contain canonical task markdown"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "NEW_B002_HEAD=$(git rev-parse HEAD)"
