name: Postmerge PR200 B012 one-shot repair

on:
  push:
    branches:
      - evidence/pr200-b012-one-shot-postmerge-04096a1

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  EXPECTED_MAIN: 04096a180e47ed8f81ee81c1bf3d9e471be607fc
  EXPECTED_TREE: 14c318cdd13d4d24649edde644e9d28d2c8678d8
  BASE_MAIN: 9ff1680c21be366f11133a4ba2e68ebe0fc1e53b
  SUBJECT_HEAD: 4b2a73399c4b7d9caf983024580a27333aaac0a2
  QUALIFICATION_RUN: '34278937207'
  QUALIFICATION_EVIDENCE_HEAD: 18bd6b8ab3c4a5e69d2ede336af644348b418d4a
  REVIEW_RUN: '34281616332'
  REVIEW_EVIDENCE_HEAD: 0995bb9d1a97319933deafc045f0e37e89de0503
  PREMERGE_RUN: '34282046594'
  PREMERGE_EVIDENCE_HEAD: d0e69c42934045e1a9640c5908568d44075bc1f5

jobs:
  live_merge_truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact merge and prerequisite evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          root = "https://api.github.com/repos/TheHalfMoon/MSTR"
          pr = get(f"{root}/pulls/200")
          assert pr["state"] == "closed"
          assert pr["merged"] is True
          assert pr["merge_commit_sha"] == os.environ["EXPECTED_MAIN"]
          assert pr["base"]["sha"] == os.environ["BASE_MAIN"]
          assert pr["head"]["sha"] == os.environ["SUBJECT_HEAD"]

          merge = get(f"{root}/git/commits/{os.environ['EXPECTED_MAIN']}")
          assert merge["tree"]["sha"] == os.environ["EXPECTED_TREE"]
          assert [p["sha"] for p in merge["parents"]] == [
              os.environ["BASE_MAIN"],
              os.environ["SUBJECT_HEAD"],
          ]

          evidence = (
              ("QUALIFICATION_RUN", "QUALIFICATION_EVIDENCE_HEAD"),
              ("REVIEW_RUN", "REVIEW_EVIDENCE_HEAD"),
              ("PREMERGE_RUN", "PREMERGE_EVIDENCE_HEAD"),
          )
          for run_key, head_key in evidence:
              run = get(f"{root}/actions/runs/{os.environ[run_key]}")
              assert run["status"] == "completed"
              assert run["conclusion"] == "success"
              assert run["head_sha"] == os.environ[head_key]
          PY

  canonical_semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify canonical repair remains inert and hash bound
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          repair = json.loads((root / "artifacts/manifests/B012-qwen-raw-code-one-shot-topology-repair.json").read_text())
          binding = json.loads((root / "artifacts/manifests/B012-executor-toolchain-binding.json").read_text())
          raw = json.loads((root / "benchmarks/manifests/B012-raw-code-proxy.json").read_text())

          assert repair["status"] == "READY_FOR_SEPARATE_CANONICAL_ACTIVATION"
          assert repair["candidate_id"] == "qwen3.5-0.8b-control"
          assert repair["prior_qualification_run_id"] == 34155931982
          assert repair["repair_hypothesis"]["root_cause_claimed"] is False
          assert repair["activation"]["separate_activation_pr_required"] is True
          assert repair["activation"]["active_workflow_materialized"] is False
          assert repair["activation"]["package_performs_model_access"] is False
          assert repair["activation"]["package_performs_model_execution"] is False
          assert "qwen_raw_code_one_shot_activation" not in binding
          assert raw["execution"] == {
              "runtime": "llama.cpp-llama-cli-cpu",
              "context_tokens": 2048,
              "generated_tokens": 96,
              "threads": 2,
              "gpu_layers": 0,
              "temperature": 0.0,
              "seed": 42,
              "network_model_calls": 0,
          }
          assert [task["id"] for task in raw["tasks"]] == [
              "python-clamp",
              "python-dedupe",
              "python-safe-divide",
          ]

          components = repair["components"]
          for path_key, hash_key in (
              ("canonical_shared_raw_code_helper_path", "canonical_shared_raw_code_helper_sha256"),
              ("case_checkpoint_script_path", "case_checkpoint_script_sha256"),
              ("one_shot_raw_code_helper_path", "one_shot_raw_code_helper_sha256"),
              ("one_shot_wrapper_path", "one_shot_wrapper_sha256"),
              ("raw_code_manifest_path", "raw_code_manifest_sha256"),
          ):
              path = root / components[path_key]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == components[hash_key]
          PY
          ! grep -F "B012_RECOVER_RAW_CODE_ONE_SHOT" .github/workflows/b012-qwen-raw-code-recovery.yml
          ! grep -F "mstr_b012_qwen_raw_code_one_shot.py" .github/workflows/b012-qwen-raw-code-recovery.yml

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Run postmerge focused and full quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_one_shot_topology.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_workflow.py
          mstr-qualify validate
          ruff check .
          ruff format --check \
            colab/mstr_b012_qwen_raw_code_one_shot.py \
            colab/mstr_b012_raw_code_one_shot.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_topology.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_workflow.py
          python -m pytest -q
          mypy

  final_gate:
    needs: [live_merge_truth, canonical_semantics, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Final exact-main postmerge verdict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo 'PR200_POSTMERGE=PASS'
          echo 'REPAIR_CANONICAL_AND_INERT=YES'
          echo 'ACTIVATION_SEPARATE=REQUIRED'
