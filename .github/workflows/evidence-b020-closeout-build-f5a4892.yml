name: Build B020 canonical closeout atomically

on:
  push:
    branches:
      - evidence/b020-closeout-build-f5a4892

permissions:
  contents: write

env:
  EXPECTED_MAIN: f5a4892bff6bc20e376efcaa8f554c15ac88bca8
  TARGET_BRANCH: docs/000b-b020-canonicalize-v2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b020-closeout-build-f5a4892
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve builder and verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          cp tools/evidence/build_b020_closeout.py /tmp/build_b020_closeout.py
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          git checkout --detach "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          mstr-qualify task eligible B020 > /tmp/b020-entry.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false' /tmp/b020-entry.json
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
      - name: Materialize exact six-file closeout without unrelated formatting
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/build_b020_closeout.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            configs/task-gate/mstr-000b.json
            evidence/mstr-000b/B020-difficulty-contract.md
            specs/002-code-model-supremacy-foundation/tasks.md
            tests/contract/test_difficulty_calibration_contract.py
            tests/contract/test_task_gate.py
            tests/integration/test_task_gate_cli.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 6
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
      - name: Verify prospective terminal state and full quality
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_difficulty_calibration_contract.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src
      - name: Commit and fast-forward target after all gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add configs/task-gate/mstr-000b.json evidence/mstr-000b/B020-difficulty-contract.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_difficulty_calibration_contract.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          git commit -m "docs(mstr-000b): canonicalize B020 closeout"
          candidate=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_MAIN"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$candidate"
          echo "B020_CLOSEOUT_HEAD=$candidate"
