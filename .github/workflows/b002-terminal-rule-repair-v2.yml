name: B002 terminal-rule repair v2

on:
  push:
    branches:
      - evidence/b002-terminal-rule-repair-v2

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: 26e4c718cbad5549e65f5fd7e384897217830c35
      EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
      TARGET_BRANCH: feat/000b-b002-task-gate
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout guarded B002 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Apply terminal-rule repair
        shell: python
        run: |
          from pathlib import Path

          gate = Path("src/mstr_qualify/task_gate.py")
          text = gate.read_text(encoding="utf-8")
          old = '''def _terminal_state(state: object) -> bool:
              return state in _TERMINAL_COMPLETE or (
                  isinstance(state, str) and state.startswith("NOT_REQUIRED")
              )


          def _checkbox_consistent(state: object, checked: bool | None) -> bool:
              if checked is None:
                  return False
              return checked is _terminal_state(state)
          '''.replace("          ", "")
          new = '''def _declared_terminal_state(node: dict[str, Any]) -> bool:
              state = node["canonical_state"]
              return state in node["closeout_rule"]["terminal_states"]


          def _prerequisite_completion_state(node: dict[str, Any]) -> bool:
              return (
                  _declared_terminal_state(node)
                  and node["canonical_state"] != "SUPERSEDED_CANONICAL"
              )


          def _checkbox_consistent(node: dict[str, Any], checked: bool | None) -> bool:
              if checked is None:
                  return False
              return checked is _declared_terminal_state(node)
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit("terminal helper anchor mismatch")
          text = text.replace(old, new, 1)
          replacements = [
              ('    consistent = _checkbox_consistent(state, catalog.checked.get(task_id))\n',
               '    consistent = _checkbox_consistent(node, catalog.checked.get(task_id))\n'),
              ('    terminal = _terminal_state(state) and state != "SUPERSEDED_CANONICAL"\n',
               '    terminal = _prerequisite_completion_state(node)\n'),
              ('    checkbox_consistent = _checkbox_consistent(\n        node["canonical_state"], catalog.checked.get(task_id)\n    )\n',
               '    checkbox_consistent = _checkbox_consistent(node, catalog.checked.get(task_id))\n'),
              ('    elif _terminal_state(node["canonical_state"]):\n',
               '    elif _declared_terminal_state(node):\n'),
          ]
          for before, after in replacements:
              if text.count(before) != 1:
                  raise SystemExit(f"call-site anchor mismatch: {before!r}")
              text = text.replace(before, after, 1)
          gate.write_text(text, encoding="utf-8")

          tests = Path("tests/contract/test_task_gate.py")
          test_text = tests.read_text(encoding="utf-8").rstrip()
          addition = r'''

          def test_undeclared_not_required_state_cannot_satisfy_predecessor(tmp_path: Path) -> None:
              catalog_path = _write_minimal_catalog(tmp_path, b001_checked=True)
              data = json.loads(catalog_path.read_text(encoding="utf-8"))
              data["tasks"]["B001"]["canonical_state"] = "NOT_REQUIRED_FAKE"
              catalog_path.write_text(json.dumps(data), encoding="utf-8")

              result = evaluate_task_eligibility(
                  "B002",
                  repository_root=tmp_path,
                  catalog_path=catalog_path,
                  canonical_main=_CANONICAL_MAIN,
              )

              predecessor = result["prerequisite_results"][0]
              assert result["eligible"] is False
              assert predecessor["observed_state"] == "NOT_REQUIRED_FAKE"
              assert predecessor["satisfied"] is False
              assert "prerequisite.not_terminal" in predecessor["reasons"]
              assert "prerequisite.state_checkbox_conflict" in predecessor["reasons"]


          def test_declared_not_required_state_can_satisfy_predecessor(tmp_path: Path) -> None:
              catalog_path = _write_minimal_catalog(tmp_path, b001_checked=True)
              data = json.loads(catalog_path.read_text(encoding="utf-8"))
              data["tasks"]["B001"]["canonical_state"] = "NOT_REQUIRED_FIXTURE"
              data["tasks"]["B001"]["closeout_rule"]["terminal_states"] = [
                  "COMPLETE_CANONICAL",
                  "NOT_REQUIRED_FIXTURE",
              ]
              catalog_path.write_text(json.dumps(data), encoding="utf-8")

              result = evaluate_task_eligibility(
                  "B002",
                  repository_root=tmp_path,
                  catalog_path=catalog_path,
                  canonical_main=_CANONICAL_MAIN,
              )

              predecessor = result["prerequisite_results"][0]
              assert result["eligible"] is True
              assert predecessor["observed_state"] == "NOT_REQUIRED_FIXTURE"
              assert predecessor["satisfied"] is True
              assert predecessor["reasons"] == []
          '''.replace("          ", "").strip()
          if "test_undeclared_not_required_state_cannot_satisfy_predecessor" in test_text:
              raise SystemExit("regression tests already present")
          tests.write_text(test_text + "\n\n" + addition + "\n", encoding="utf-8")

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py | sort)"
          test "$actual" = "$expected"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy
          python -m mstr_qualify validate

      - name: Commit and guarded push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py
          git commit -m "fix(mstr-000b): honor declared terminal task states"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "NEW_B002_HEAD=$(git rev-parse HEAD)"
