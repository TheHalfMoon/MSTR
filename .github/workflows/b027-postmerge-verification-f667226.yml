name: Post-merge verification for B027 research-ladder pilot

on:
  push:
    branches: [evidence/b027-postmerge-f667226]

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  EXPECTED_MAIN: f667226dbf6cd380fefef5ff90fbc14eb1de3630
  EXPECTED_PARENT1: 312d40eee8400a0dab94633f891b206f66a82855
  EXPECTED_PARENT2: b5e152552f3b840fd74f2fe9b092eca17b56a91d
  EXPECTED_TREE: 20e60c673a203e3fc7f09da817ffc6ad64ac5f76
  PR_NUMBER: '141'
  PREMERGE_RUN: '33760082781'
  GH_TOKEN: ${{ github.token }}

jobs:
  merge_identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Verify exact guarded implementation merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT1"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PARENT2"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg merge "$EXPECTED_MAIN" --arg head "$EXPECTED_PARENT2" '
            .state == "closed" and .merged == true and .merge_commit_sha == $merge and
            .head.sha == $head and .commits == 32 and .changed_files == 60
          ' /tmp/pr.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREMERGE_RUN}" > /tmp/premerge.json
          jq -e '.status == "completed" and .conclusion == "success" and (.name | contains("Mandatory premerge B027"))' /tmp/premerge.json
          echo 'B027_MERGE_IDENTITY=PASS'

  canonical_semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate B027 records against real canonical main
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          before_origin="$(git rev-parse refs/remotes/origin/main)"
          before_local="$(git rev-parse --verify refs/heads/main 2>/dev/null || true)"
          python - <<'PY'
          import json
          from pathlib import Path
          from mstr_qualify.schemas import validate_instance

          root = Path.cwd()
          registry = root / 'artifacts/results/research/B027/registry'
          paths = sorted(registry.glob('*.json'))
          assert [p.name for p in paths] == [
              'b027-l0-contract-smoke.json',
              'b027-l1-controlled-stop.json',
          ]
          records = []
          for path in paths:
              record = json.loads(path.read_text(encoding='utf-8'))
              validate_instance('mstr-research-experiment-v2', record, repository_root=root)
              records.append(record)
          assert records[0]['promotion_decision'] == 'PROMOTE'
          assert records[1]['promotion_decision'] == 'STOP'
          assert records[1]['predecessor_promotion']['experiment_record_sha256'] == 'dbc5f477ebd96d282ecdbd9ca1048e336c8289bcd9941d549656459ff155da90'
          print('B027_REAL_MAIN_SEMANTICS=PASS')
          PY
          after_origin="$(git rev-parse refs/remotes/origin/main)"
          after_local="$(git rev-parse --verify refs/heads/main 2>/dev/null || true)"
          test "$after_origin" = "$before_origin"
          test "$after_local" = "$before_local"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  task_frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Prove clean drift and pre-closeout B027 frontier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git fetch origin main:refs/remotes/origin/main
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B027 > /tmp/b027.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0' /tmp/b027.json
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo 'B027_POSTMERGE_PENDING_ELIGIBLE=PASS'
          echo 'B027_CANONICAL_CLOSEOUT=NOT_YET_DONE'

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run canonical B027 quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_b027_ladder_pilot.py tests/contract/test_research_ladder_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py tests/contract/test_task_gate.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  authority_boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Re-prove B027 zero-external-effect boundary
        shell: bash
        run: |
          set -euo pipefail
          for marker in \
            'MODEL_WEIGHT_ACCESS = NONE' \
            'MODEL_EXECUTION = NONE' \
            'RESEARCH_CAMPAIGN_EXTERNAL_EFFECT = NONE' \
            'VERIFIER_EXTERNAL_EFFECT = NONE' \
            'TEACHER_API_EXECUTION = NONE' \
            'PAID_MODEL_API = NONE' \
            'PAID_COMPUTE = NONE' \
            'NETWORK_MODEL_OR_TEACHER_CALL = NONE' \
            'LARGE_DATASET_INGESTION = NONE' \
            'PRIVATE_USER_DATA_INGESTION = NONE' \
            'PRODUCTION_TRACE_INGESTION = NONE' \
            'WEIGHT_CHANGING_TRAINING = NONE' \
            'LARGE_SCALE_RL = NONE' \
            'Q4_EXECUTION = NONE' \
            'PRODUCTION_RELEASE = NONE'; do
            grep -F "$marker" evidence/mstr-000b/B027-ladder-pilot.md
          done
          jq -e '
            .external_effect_authority_required == false and
            .model_execution_count == 0 and
            .network_model_or_teacher_call_count == 0 and
            .paid_cost_usd == 0 and
            .large_dataset_ingestion == false and
            .weight_changing_training == false and
            ([.governed_effects[] | select(. != false)] | length) == 0
          ' artifacts/results/research/B027/campaign-ledger.json
          grep -F -- '- [ ] **B027 Qualify the research ladder with one non-weight-changing campaign.**' specs/002-code-model-supremacy-foundation/tasks.md
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo 'B027_AUTHORITY_BOUNDARY=PASS'

  complete:
    needs: [merge_identity, canonical_semantics, task_frontier, quality, authority_boundary]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Final immutable canonical-main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT1"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PARENT2"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo "B027_POSTMERGE_MAIN=$EXPECTED_MAIN"
          echo 'B027_REAL_MAIN_SEMANTICS=PASS'
          echo 'B027_CANONICAL_CLOSEOUT=NOT_YET_DONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
