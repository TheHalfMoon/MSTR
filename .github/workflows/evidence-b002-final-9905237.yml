name: Evidence B002 repaired final head

on:
  push:
    branches:
      - evidence/b002-final-9905237

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 9905237b0685b50059112d19e2708ba6357283b6
      EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact B002 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact target and canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Compile repaired contract source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/contract/test_task_gate.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Prove caller-supplied canonical main remains rejected
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m mstr_qualify task eligible B002 --canonical-main "$TARGET_SHA" >/tmp/task-out 2>/tmp/task-err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q -- "unrecognized arguments: --canonical-main" /tmp/task-err

      - name: Targeted B002 tests
        run: pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Verify immutable exact head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --short)"
          git diff --exit-code
          echo "FINAL_TARGET_SHA=$(git rev-parse HEAD)"
