name: PR185 B012 Qwen recovery activation mandatory premerge

on:
  push:
    branches:
      - evidence/pr185-b012-qwen-recovery-activation-mandatory-premerge-180b928

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  PR_NUMBER: "185"
  BASE_SHA: 31549eeb78f2b3346c0915519cf5f4899ab47773
  SUBJECT_BRANCH: fix/b012-qwen-raw-code-recovery-activation
  SUBJECT_SHA: 180b928e56261dbc3e1bd06597e7c81fa32694ee
  SUBJECT_TREE: 046156f3ff372f541b4a16618c212490027e57c4
  QUALIFICATION_RUN: "34162195621"
  QUALIFICATION_HEAD: 05d24e4030143b11f017bf6e5866c2a781c0003b
  QUALIFICATION_BRANCH: evidence/pr185-b012-qwen-recovery-activation-qualification-180b928
  REVIEW_RUN: "34162490236"
  REVIEW_HEAD: 8841bfcf2fe5c9b1db0dfd8e9a728c8148ddb033
  REVIEW_BRANCH: evidence/pr185-b012-qwen-recovery-activation-independent-review-180b928
  ACTIVATED_MANIFEST_SHA256: 6b9536e16c52fefe03ee2844c68008f68e36cdd91ae45987086e1acda0259d70
  ACTIVE_WORKFLOW_SHA256: 7643ef2b87c32901e5cbdf384001a341cfd061f4a33437a4fb7556dadc6c33a0

jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout premerge evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Prove exact base head tree evidence ancestry and scope
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" "$QUALIFICATION_BRANCH" "$REVIEW_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "$SUBJECT_SHA^")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          [[ "$(git rev-parse "origin/$QUALIFICATION_BRANCH")" == "$QUALIFICATION_HEAD" ]]
          [[ "$(git rev-parse "origin/$REVIEW_BRANCH")" == "$REVIEW_HEAD" ]]
          [[ "$(git rev-parse "$QUALIFICATION_HEAD^")" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse "$REVIEW_HEAD^")" == "$SUBJECT_SHA" ]]
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            ".github/workflows/b012-qwen-raw-code-recovery.yml"
            "artifacts/manifests/B012-executor-toolchain-binding.json"
            "artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json"
            "evidence/B012-qwen-raw-code-recovery-activation.md"
            "tests/contract/test_b012_qwen_raw_code_recovery.py"
          )
          [[ "${#changed[@]}" -eq 5 ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done

      - name: Reverify B012 machine eligibility on actual canonical main
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligibility.json
          python - <<'PY'
          import json, os
          data = json.load(open('/tmp/b012-eligibility.json', encoding='utf-8'))
          assert data['task_id'] == 'B012'
          assert data['canonical_main'] == os.environ['BASE_SHA']
          assert data['eligible'] is True
          assert data['authority_result']['satisfied'] is True
          assert data['state_consistency_result']['observed_state'] == 'PENDING'
          assert data['supersession_result']['superseded'] is False
          assert all(item['satisfied'] for item in data['prerequisite_results'])
          PY
          git checkout --detach "$SUBJECT_SHA"

      - name: Verify immutable qualification review and live PR discussion state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-pr185-mandatory-premerge',
          }

          def rest(path: str):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/TheHalfMoon/MSTR{path}', headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          q = rest(f"/actions/runs/{os.environ['QUALIFICATION_RUN']}")
          assert q['status'] == 'completed' and q['conclusion'] == 'success'
          assert q['head_sha'] == os.environ['QUALIFICATION_HEAD']
          assert q['head_branch'] == os.environ['QUALIFICATION_BRANCH']
          qjobs = rest(f"/actions/runs/{os.environ['QUALIFICATION_RUN']}/jobs?per_page=100")['jobs']
          assert any(job['name'] == 'qualify' and job['conclusion'] == 'success' for job in qjobs)

          r = rest(f"/actions/runs/{os.environ['REVIEW_RUN']}")
          assert r['status'] == 'completed' and r['conclusion'] == 'success'
          assert r['head_sha'] == os.environ['REVIEW_HEAD']
          assert r['head_branch'] == os.environ['REVIEW_BRANCH']
          rjobs = rest(f"/actions/runs/{os.environ['REVIEW_RUN']}/jobs?per_page=100")['jobs']
          assert any(job['name'] == 'review' and job['conclusion'] == 'success' for job in rjobs)

          pr = rest('/pulls/185')
          assert pr['state'] == 'open'
          assert pr['draft'] is False
          assert pr['base']['ref'] == 'main'
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['ref'] == os.environ['SUBJECT_BRANCH']
          assert pr['head']['sha'] == os.environ['SUBJECT_SHA']
          assert pr['changed_files'] == 5
          assert pr['mergeable'] is not False
          reviews = rest('/pulls/185/reviews?per_page=100')
          assert not any(review.get('state') == 'CHANGES_REQUESTED' for review in reviews)
          inline = rest('/pulls/185/comments?per_page=100')
          assert len(inline) == 0

          query = '''query($owner:String!, $name:String!, $number:Int!) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                reviewThreads(first:100) { nodes { isResolved } }
              }
            }
          }'''
          payload = json.dumps({
              'query': query,
              'variables': {'owner': 'TheHalfMoon', 'name': 'MSTR', 'number': 185},
          }).encode()
          request = urllib.request.Request(
              'https://api.github.com/graphql',
              data=payload,
              headers={**headers, 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              graph = json.load(response)
          assert 'errors' not in graph, graph
          threads = graph['data']['repository']['pullRequest']['reviewThreads']['nodes']
          assert not any(thread['isResolved'] is False for thread in threads)
          print('QUALIFICATION_REVIEW_AND_DISCUSSION_STATE=PASS')
          PY

      - name: Verify activated recovery identities and bounded semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest_path = Path('artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json')
          incident_path = Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-run-34155931982.json')
          runner_path = Path('colab/mstr_b012_qwen_raw_code_recovery.py')
          spec_path = Path('configs/workflows/b012-qwen-raw-code-recovery.yml')
          active_path = Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          binding_path = Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          authority_path = Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json')
          manifest = json.loads(manifest_path.read_text())
          incident = json.loads(incident_path.read_text())
          binding = json.loads(binding_path.read_text())
          authority = json.loads(authority_path.read_text())

          assert manifest['status'] == 'ACTIVATED_CANONICAL'
          assert sha(manifest_path) == os.environ['ACTIVATED_MANIFEST_SHA256']
          assert sha(active_path) == os.environ['ACTIVE_WORKFLOW_SHA256']
          assert active_path.read_bytes() == spec_path.read_bytes()
          assert manifest['recovery_script_sha256'] == sha(runner_path)
          assert manifest['recovery_workflow_sha256'] == sha(active_path)
          assert manifest['incident_evidence_sha256'] == sha(incident_path)
          assert binding['qwen_raw_code_recovery_manifest_sha256'] == sha(manifest_path)
          activation = binding['qwen_raw_code_recovery_activation']
          assert activation['recovery_manifest_sha256'] == sha(manifest_path)
          assert activation['active_workflow_sha256'] == sha(active_path)
          assert activation['retry_authority_created'] is False
          assert activation['external_dispatch_authority_created'] is False
          assert activation['candidate_expansion'] is False
          assert activation['revision_or_file_expansion'] is False
          assert activation['model_access'] == 'NONE'
          assert activation['training'] is False
          assert activation['paid_cost_usd'] == 0.0
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          assert incident['model_quality_verdict'] == 'NONE'
          assert incident['candidate_admission_decision'] == 'NONE'
          scope = manifest['recovery_scope']
          assert scope['rerun_prefill'] is False and scope['rerun_decode'] is False
          assert scope['run_raw_code_proxy'] is True
          assert scope['require_q4_k_m_identity_match_to_prior_stage03'] is True
          for key in ('candidate_expansion', 'revision_or_file_expansion', 'training', 'paid_compute', 'paid_model_api', 'git_model_binaries', 'founder_machine_model_binaries'):
              assert scope[key] is False
          print('ACTIVATED_RECOVERY_IDENTITIES_AND_SCOPE=PASS')
          PY

      - name: Mandatory focused and full quality gate
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m py_compile colab/mstr_b012_qwen_raw_code_recovery.py tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m mypy src/mstr_qualify

      - name: Final exact live premerge guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote origin "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          python - <<'PY'
          import json
          import os
          import urllib.request
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-pr185-final-premerge',
          }
          def rest(path: str):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/TheHalfMoon/MSTR{path}', headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          pr = rest('/pulls/185')
          assert pr['state'] == 'open' and pr['draft'] is False
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['sha'] == os.environ['SUBJECT_SHA']
          assert pr['changed_files'] == 5
          reviews = rest('/pulls/185/reviews?per_page=100')
          assert not any(review.get('state') == 'CHANGES_REQUESTED' for review in reviews)
          PY
          echo 'PR185_MANDATORY_PREMERGE=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
