name: Independent semantic security review PR201 B012 one-shot activation

on:
  push:
    branches:
      - evidence/pr201-b012-one-shot-independent-review-1f203ad

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  REPO: TheHalfMoon/MSTR
  BASE: 04096a180e47ed8f81ee81c1bf3d9e471be607fc
  TARGET_HEAD: 1f203ad7087d3ef28f9b24f23909a2a10eaada96
  TARGET_TREE: f02010637016ac4b12ee3112b9fe7fb221ab98fd
  TARGET_BRANCH: fix/b012-qwen-raw-code-one-shot-activation
  PR: '201'
  QUALIFICATION_RUN: '34285319693'
  QUALIFICATION_EVIDENCE_HEAD: b56c72f2fb5d789d8b00b0b7f0ee462a22a9813f
  GH_TOKEN: ${{ github.token }}

jobs:
  independent_semantic_security_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify exact subject and prerequisite qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_HEAD"
          gh api "repos/$REPO/actions/runs/$QUALIFICATION_RUN" > /tmp/qualification.json
          jq -e --arg head "$QUALIFICATION_EVIDENCE_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' /tmp/qualification.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$TARGET_HEAD" '.state=="open" and .draft==false and .base.sha==$base and .head.sha==$head and .changed_files==13' /tmp/pr.json >/dev/null

      - name: Checkout exact activation subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Review exact scope and authority containment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$BASE" "$TARGET_HEAD")" = "$BASE"
          git diff --check "$BASE" "$TARGET_HEAD"
          git diff --name-only "$BASE" "$TARGET_HEAD" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/b012-qwen-raw-code-recovery.yml
          artifacts/manifests/B012-executor-toolchain-binding.json
          artifacts/manifests/B012-qwen-raw-code-one-shot-topology-repair.json
          evidence/mstr-000b/B012-qwen-one-shot-mode-activation.md
          tests/contract/test_b012_executor_binding.py
          tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py
          tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          tests/contract/test_b012_qwen_raw_code_one_shot_topology.py
          tests/contract/test_b012_qwen_raw_code_one_shot_workflow.py
          tests/contract/test_b012_qwen_raw_code_recovery.py
          tests/contract/test_b012_qwen_staged_recovery_topology.py
          tests/contract/test_b012_runner_shutdown_evidence.py
          tests/contract/test_b012_stage_checkpoint_topology.py
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git diff --name-only "$BASE" "$TARGET_HEAD" -- artifacts/authorities artifacts/manifests/B012-equivalent-qualification-execution-envelope.json artifacts/manifests/B012-executor-toolchain-lock.json benchmarks/manifests/B012-raw-code-proxy.json specs/002-code-model-supremacy-foundation/tasks.md docs/canonical/CURRENT_STATE.md)"
          ! git diff "$BASE" "$TARGET_HEAD" -- . ':!evidence/**' | grep -F 'AUTHORIZED_CANONICAL'
          ! git diff "$BASE" "$TARGET_HEAD" -- . ':!evidence/**' | grep -F 'PAID_COMPUTE = TRUE'

      - name: Behaviorally review explicit one-shot raw-completion semantics
        shell: bash
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from types import SimpleNamespace
          import mstr_b012_raw_code_one_shot as one_shot

          raw=json.loads(Path('benchmarks/manifests/B012-raw-code-proxy.json').read_text(encoding='utf-8'))
          selected={**raw, 'tasks':[raw['tasks'][0]]}
          captured=[]
          def fake_run(argv, **kwargs):
              captured.append((list(argv), dict(kwargs)))
              return SimpleNamespace(returncode=0, stdout='\n', stderr='')
          one_shot.subprocess.run=fake_run
          result=one_shot.run_raw_code_proxy(
              executable=Path('/synthetic/llama-cli'),
              model=Path('/synthetic/model.gguf'),
              manifest=selected,
          )
          assert result['task_count']==1
          assert result['interpretation']=='OBSERVATIONAL_RAW_CODE_PROXY_NOT_FINAL_ADMISSION'
          argv, kwargs=captured[0]
          assert '--no-conversation' in argv
          assert '--no-display-prompt' in argv
          assert '--simple-io' in argv
          assert '-ngl' in argv and argv[argv.index('-ngl')+1]=='0'
          assert '--seed' in argv and argv[argv.index('--seed')+1]==str(raw['execution']['seed'])
          assert '--temp' in argv and float(argv[argv.index('--temp')+1])==float(raw['execution']['temperature'])
          assert kwargs['timeout']==600
          assert kwargs['check'] is False
          PY

      - name: Review activation binding storage and historical supersession
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          m=json.loads(Path('artifacts/manifests/B012-qwen-raw-code-one-shot-topology-repair.json').read_text())
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          active=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          one_spec=Path('configs/workflows/b012-qwen-raw-code-one-shot-recovery.yml')
          case_spec=Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          assert active.read_bytes()==one_spec.read_bytes()
          assert active.read_bytes()!=case_spec.read_bytes()
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          bound=b['qwen_raw_code_one_shot_activation']
          assert bound['repair_manifest_sha256']==sha('artifacts/manifests/B012-qwen-raw-code-one-shot-topology-repair.json')
          assert bound['active_workflow_sha256']==sha(active)
          assert bound['one_shot_script_sha256']==sha('colab/mstr_b012_qwen_raw_code_one_shot.py')
          assert bound['one_shot_raw_code_helper_sha256']==sha('colab/mstr_b012_raw_code_one_shot.py')
          for key in ('retry_authority_created','external_dispatch_authority_created','cross_run_resume_authority_created','candidate_expansion','revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert bound[key] is False, key
          assert bound['model_access']=='NONE' and bound['model_execution']=='NONE'
          active_text=active.read_text()
          assert 'B012_RECOVER_RAW_CODE_ONE_SHOT qwen3.5-0.8b-control 34155931982' in active_text
          assert 'B012_RECOVER_RAW_CODE_CASE_CHECKPOINT' not in active_text
          historical=json.loads(Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json').read_text())
          assert historical['activation']['active_workflow_materialized'] is True
          assert historical['repair_id']=='B012_QWEN_RAW_CODE_CASE_CHECKPOINT_DURABILITY_REPAIR_2026_09_08'
          storage=Path('docs/canonical/STORAGE_ARCHITECTURE.md').read_text()
          assert 'Git' in storage and 'Actions' in storage
          PY

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Independent focused and full quality rerun
        run: |
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_topology.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_workflow.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_topology.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_workflow.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final immutability and independent review verdict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg base "$BASE" --arg head "$TARGET_HEAD" '.state=="open" and .draft==false and .base.sha==$base and .head.sha==$head and .changed_files==13' /tmp/pr-final.json >/dev/null
          echo 'FINDINGS=NONE'
          echo 'INDEPENDENT_SEMANTIC_SECURITY_REVIEW=PASS'
