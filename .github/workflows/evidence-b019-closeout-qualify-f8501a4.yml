name: Qualify exact B019 closeout head

on:
  push:
    branches:
      - evidence/b019-closeout-qualify-f8501a4

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: ac68e2ff9de9962807ab32ce983b2e808bf4fab9
      EXPECTED_HEAD: f8501a43fc3e4181915032d08767e6a4e4d1f84b
      TARGET_BRANCH: docs/000b-b019-canonicalize
      PR_NUMBER: '79'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b019-closeout-qualify-f8501a4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact PR and immutable refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          git worktree add --detach /tmp/b019-main "$EXPECTED_MAIN"
          git worktree add --detach /tmp/b019-closeout "$EXPECTED_HEAD"
      - name: Verify exact six-file scope and closeout semantics
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B019-teacher-policy.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/contract/test_teacher_rescue_contract.py \
            tests/integration/test_task_gate_cli.py | sort)
          actual=$(git -C /tmp/b019-closeout diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          git -C /tmp/b019-closeout diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          python tools/evidence/qualify_b019_closeout.py /tmp/b019-main /tmp/b019-closeout
      - name: Re-prove exact-main task gate before closeout
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b019-main
          git branch -f main "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          mstr-qualify task eligible B019 > /tmp/b019-eligible.json
          if mstr-qualify task eligible B011 > /tmp/b011-eligible.json; then exit 1; else test "$?" -eq 1; fi
          mstr-qualify task eligible B020 > /tmp/b020-eligible.json
          mstr-qualify task eligible B022 > /tmp/b022-eligible.json
          mstr-qualify task drift > /tmp/task-drift.json
      - name: Run focused closeout regressions on exact head
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b019-closeout
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_teacher_rescue_contract.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
      - name: Run frozen full quality on exact head
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b019-closeout
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src
      - name: Final remote immutability recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
