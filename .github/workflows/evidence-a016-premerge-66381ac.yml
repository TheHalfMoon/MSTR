name: Mandatory premerge A016 verification

on:
  push:
    branches:
      - evidence/a016-premerge-66381ac

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 66381acbab6295d5e445c4354605c704a90df719
          fetch-depth: 0
      - name: Verify exact A016 PR admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=907ab88722223cf53379bc98935f0641536a6907
          HEAD=66381acbab6295d5e445c4354605c704a90df719
          TREE=eb8df5ef99a465e960db0bd0b1c2e75acb8c1d9e
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "$BASE"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/feat/000a-a016-diagnostic-metrics --jq .object.sha)" = "$HEAD"
          gh api repos/${GITHUB_REPOSITORY}/pulls/118 --jq '[.state,.draft,.head.sha,.base.sha,.mergeable] | @tsv' | grep -F $'open\tfalse\t66381acbab6295d5e445c4354605c704a90df719\t907ab88722223cf53379bc98935f0641536a6907\ttrue'
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33433558709 --jq .conclusion)" = success
          test "$(gh api repos/${GITHUB_REPOSITORY}/pulls/118/reviews --jq '[.[] | select(.id == 5070652127 and .commit_id == "66381acbab6295d5e445c4354605c704a90df719" and .state == "COMMENTED")] | length')" = 1
          test "$(gh api graphql -f query='query { repository(owner:"TheHalfMoon", name:"MSTR") { pullRequest(number:118) { reviewThreads(first:100) { nodes { isResolved } } } } }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')" = 0
          mapfile -t FILES < <(git diff --name-only "$BASE"...HEAD | sort)
          test "${#FILES[@]}" -eq 3
          test "${FILES[0]}" = "evidence/mstr-000a/A016-metrics.md"
          test "${FILES[1]}" = "src/mstr_qualify/metrics.py"
          test "${FILES[2]}" = "tests/unit/test_metrics.py"
          git diff --check "$BASE"...HEAD
          python - <<'PY'
          from pathlib import Path
          tasks = Path('specs/001-agent-harness-verified-loop-foundation/tasks.md').read_text()
          evidence = Path('evidence/mstr-000a/A016-metrics.md').read_text()
          assert '**State:** IMPLEMENTATION_CANDIDATE' in evidence
          assert '- [x] **A015 ' in tasks
          assert '- [ ] **A016 ' in tasks
          assert '- [ ] **A017 ' in tasks
          assert 'B030_REPOSITORY_HEALTH_DELTA = NOT_IMPLEMENTED_BY_A016' in evidence
          PY

  quality:
    needs: admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 66381acbab6295d5e445c4354605c704a90df719
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run mandatory A016 premerge quality
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/unit/test_metrics.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src

  complete:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 66381acbab6295d5e445c4354605c704a90df719
          fetch-depth: 0
      - name: Final immutable A016 premerge recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "66381acbab6295d5e445c4354605c704a90df719"
          test "$(git rev-parse HEAD^{tree})" = "eb8df5ef99a465e960db0bd0b1c2e75acb8c1d9e"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "907ab88722223cf53379bc98935f0641536a6907"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/feat/000a-a016-diagnostic-metrics --jq .object.sha)" = "66381acbab6295d5e445c4354605c704a90df719"
          test "$(gh api repos/${GITHUB_REPOSITORY}/pulls/118 --jq .head.sha)" = "66381acbab6295d5e445c4354605c704a90df719"
          test "$(gh api repos/${GITHUB_REPOSITORY}/pulls/118 --jq .state)" = open
