name: PR179 B012 runner shutdown independent review

on:
  push:
    branches:
      - evidence/pr179-b012-runner-shutdown-independent-review-f7a2ca0

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pr179-b012-runner-shutdown-independent-review-f7a2ca0
  cancel-in-progress: false

env:
  BASE_SHA: 610bf7dacc5ee921d99a4fa2eb9023553021e84c
  SUBJECT_SHA: f7a2ca07d9b48f71644e87cc41cd0f45e52cab27
  SUBJECT_BRANCH: fix/b012-runner-shutdown-evidence-34064172421
  PR_NUMBER: '179'
  QUALIFICATION_RUN_ID: '34067038144'
  INCIDENT_RUN_ID: '34064172421'
  INCIDENT_JOB_ID: '101569918156'
  INCIDENT_EVIDENCE_SHA256: e5abc34f9d251951d4b38508fd0c6f67d8200282f564279a4c6fada65e354030
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  independent_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Review immutable topology and exact four-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | awk '{print $1}')" = "$SUBJECT_SHA"
          python - <<'PY'
          import subprocess

          base = "610bf7dacc5ee921d99a4fa2eb9023553021e84c"
          subject = "f7a2ca07d9b48f71644e87cc41cd0f45e52cab27"
          expected = {
              "artifacts/manifests/B012-executor-toolchain-binding.json",
              "artifacts/results/equivalent/B012/failures/B012-mellum-4b-run-34064172421.json",
              "evidence/mstr-000b/B012-runner-shutdown-34064172421.md",
              "tests/contract/test_b012_runner_shutdown_evidence.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}..{subject}"], text=True
              ).splitlines()
          )
          assert actual == expected, (actual, expected)
          PY

      - name: Independently verify live GitHub incident facts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          owner_repo = "TheHalfMoon/MSTR"
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "mstr-independent-review",
          }

          def get_json(url: str) -> dict:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          run_id = 34064172421
          job_id = 101569918156
          run = get_json(f"https://api.github.com/repos/{owner_repo}/actions/runs/{run_id}")
          assert run["event"] == "issue_comment"
          assert run["head_sha"] == "f207ed9080fba1bb597a4091029dfd2a381eb346"
          assert run["status"] == "completed"
          assert run["conclusion"] == "failure"

          jobs = get_json(f"https://api.github.com/repos/{owner_repo}/actions/runs/{run_id}/jobs?per_page=100")
          job = next(item for item in jobs["jobs"] if item["id"] == job_id)
          assert job["name"] == "qualify"
          assert job["status"] == "completed"
          assert job["conclusion"] == "cancelled"
          step_map = {step["name"]: step for step in job["steps"]}
          assert step_map["Execute equivalent candidate qualification"]["conclusion"] == "cancelled"
          assert step_map["Upload durable evidence even on failure"]["conclusion"] == "skipped"

          artifacts = get_json(f"https://api.github.com/repos/{owner_repo}/actions/runs/{run_id}/artifacts")
          assert artifacts["total_count"] == 0

          req = urllib.request.Request(
              f"https://api.github.com/repos/{owner_repo}/actions/jobs/{job_id}/logs",
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              log_text = response.read().decode("utf-8", errors="replace")
          assert "The runner has received a shutdown signal" in log_text
          assert "The operation was canceled" in log_text
          PY

      - name: Review evidence semantics and authority containment
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum artifacts/results/equivalent/B012/failures/B012-mellum-4b-run-34064172421.json | awk '{print $1}')" = "$INCIDENT_EVIDENCE_SHA256"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          base = "610bf7dacc5ee921d99a4fa2eb9023553021e84c"
          evidence = json.loads(Path(
              "artifacts/results/equivalent/B012/failures/B012-mellum-4b-run-34064172421.json"
          ).read_text())
          assert evidence["schema_version"] == "mstr.b012-infrastructure-cancellation.v1"
          assert evidence["task_id"] == "B012"
          assert evidence["candidate_id"] == "mellum-4b"
          assert evidence["run_id"] == 34064172421
          assert evidence["job_id"] == 101569918156
          assert evidence["failure_classification"] == (
              "B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_NO_DURABLE_RESULT"
          )
          assert evidence["executor_authored_failure_json"] is False
          assert evidence["model_quality_verdict"] == "NONE"
          assert evidence["model_access_before_shutdown"] == "UNKNOWN_UNRECORDED"
          assert evidence["candidate_execution_completion"] == "NOT_PROVEN"
          assert evidence["retry_authority_created"] is False
          assert evidence["same_action_retry_performed_by_this_evidence"] is False
          assert evidence["training"] is False
          assert evidence["paid_model_api"] is False
          assert evidence["candidate_expansion"] is False

          current_binding = json.loads(Path(
              "artifacts/manifests/B012-executor-toolchain-binding.json"
          ).read_text())
          base_binding = json.loads(subprocess.check_output(
              ["git", "show", f"{base}:artifacts/manifests/B012-executor-toolchain-binding.json"],
              text=True,
          ))
          recovery = current_binding.pop("runner_shutdown_recovery")
          assert current_binding == base_binding, "incident patch changed pre-existing B012 binding semantics"
          assert recovery["run_id"] == 34064172421
          assert recovery["job_id"] == 101569918156
          assert recovery["candidate_id"] == "mellum-4b"
          assert recovery["failure_classification"] == evidence["failure_classification"]
          assert recovery["model_quality_verdict"] == "NONE"
          assert recovery["model_access_before_shutdown"] == "UNKNOWN_UNRECORDED"
          assert recovery["candidate_execution_completion"] == "NOT_PROVEN"
          assert recovery["retry_authority_created"] is False

          markdown = Path("evidence/mstr-000b/B012-runner-shutdown-34064172421.md").read_text()
          for required in (
              "B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_NO_DURABLE_RESULT",
              "model-quality verdict: `NONE`",
              "model access before shutdown: `UNKNOWN_UNRECORDED`",
              "candidate execution completion: `NOT_PROVEN`",
              "does not create retry authority",
              "does not itself perform or authorize that later attempt",
          ):
              assert required in markdown, required
          PY

      - name: Verify qualification identity and repository quality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              "https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34067038144",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "mstr-independent-review",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              run = json.load(response)
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert run["head_branch"] == "evidence/b012-runner-shutdown-qualification-v2-f7a2ca0"
          PY
          python -m pytest -q \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_timeout_binding.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_t031_executor_binding.py \
            tests/contract/test_t031_replay_version_equivalence.py
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check tests/contract/test_b012_runner_shutdown_evidence.py
          python -m mypy src
          python -m mstr_qualify validate
          test -z "$(git status --porcelain)"

      - name: Final immutable live-ref guard and review verdict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | awk '{print $1}')" = "$SUBJECT_SHA"
          echo 'PR179_INDEPENDENT_SUBSTANTIVE_REVIEW=PASS'
          echo 'FINDINGS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
