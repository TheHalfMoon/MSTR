name: B012 equivalent candidate qualification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: b012-equivalent-qualification-single-candidate
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.user.login == 'TheHalfMoon' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'B012_RUN ')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Resolve exact candidate and dispatch boundary
        id: dispatch
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$BODY" in
            "B012_RUN mellum-4b") candidate="mellum-4b" ;;
            "B012_RUN qwen3.5-0.8b-control") candidate="qwen3.5-0.8b-control" ;;
            *) echo "invalid B012 command" >&2; exit 2 ;;
          esac
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Checkout live canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned B012 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Execute governed B012 qualification
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          python colab/mstr_b012_execute.py \
            --candidate "${{ steps.dispatch.outputs.candidate }}" \
            --output-dir "$RUNNER_TEMP/b012-results" \
            --workdir "$RUNNER_TEMP/b012-work"

      - name: Upload durable JSON evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b012-${{ steps.dispatch.outputs.candidate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/b012-results/*.json
          if-no-files-found: error
          retention-days: 7
