name: B023 binding repair exact-head qualification

on:
  push:
    branches:
      - evidence/b023-binding-repair-qualification-77184a7

permissions:
  contents: read

env:
  TARGET_SHA: 77184a79e06879298dbfc0c031c44cf56a03957e
  TARGET_TREE: 3b9ccfd6857a7b1520c845601dcef6e52cfc2ab4
  BASE_SHA: db12d1467bb81185a9affffb4d470626ceceddfa

jobs:
  identity_scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact candidate identity and immutable main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$BASE_SHA" "$TARGET_SHA")" = "$BASE_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$BASE_SHA"
      - name: Verify exact four-file repair scope
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat >"$expected" <<'EOF'
          configs/task-gate/mstr-000b.json
          evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md
          src/mstr_qualify/task_gate.py
          tests/contract/test_task_gate.py
          EOF
          git diff --name-only "$BASE_SHA...$TARGET_SHA" | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          git diff --check "$BASE_SHA...$TARGET_SHA"
          if git diff --name-only "$BASE_SHA...$TARGET_SHA" | grep -q '^\.github/workflows/'; then
            echo 'Workflow file leaked into repair candidate' >&2
            exit 1
          fi
      - name: Verify repair preserves B023 pending state
        shell: bash
        run: |
          set -euo pipefail
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('configs/task-gate/mstr-000b.json').read_text())
          nodes = catalog['tasks']
          assert nodes['B023']['canonical_state'] == 'PENDING'
          assert set(nodes['B023']['prerequisites']) == {'A006', 'A014', 'B002', 'B022'}
          external = catalog['external_prerequisites']
          assert external['A006']['workstream_id'] == 'MSTR-000A'
          assert external['A014']['workstream_id'] == 'MSTR-000A'
          assert external['A006']['required_state'] == 'COMPLETE_CANONICAL'
          assert external['A014']['required_state'] == 'COMPLETE_CANONICAL'
          PY

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused task-gate tests
        run: python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src

  complete:
    runs-on: ubuntu-latest
    needs:
      - identity_scope
      - quality
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Recheck immutable exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$BASE_SHA"
