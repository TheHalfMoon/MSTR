name: PR193 B012 Qwen recovery shutdown qualification v3

on:
  push:
    branches:
      - evidence/pr193-b012-qwen-recovery-shutdown-qualification-v3-15287f0

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
      SUBJECT_BRANCH: fix/b012-qwen-recovery-runner-shutdown-34169060075
      SUBJECT_SHA: 15287f04bf279b7896a926e655c344f7be96d38c
      SUBJECT_TREE: ac9f512e6d6b46cf85f0b055174dfe6c7571e59b
      INCIDENT_RUN: '34169060075'
      INCIDENT_JOB: '101885732522'
      INCIDENT_EVIDENCE_SHA256: 3994421abe4d368746672f539edca2c509188147cadf9f1d6fd142f9ff9dc8ea
      BLOCKED_STATUS: BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove exact live topology and seven-file scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            "artifacts/manifests/B012-executor-toolchain-binding.json"
            "artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json"
            "evidence/mstr-000b/B012-qwen-recovery-runner-shutdown-34169060075.md"
            "tests/contract/test_b012_executor_binding.py"
            "tests/contract/test_b012_qwen_raw_code_recovery.py"
            "tests/contract/test_b012_runner_shutdown_evidence.py"
            "tests/contract/test_b012_stage_checkpoint_topology.py"
          )
          [[ "${#changed[@]}" -eq "${#expected[@]}" ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- .github/workflows/b012-qwen-raw-code-recovery.yml
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- configs/workflows/b012-qwen-raw-code-recovery.yml
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- colab/mstr_b012_qwen_raw_code_recovery.py
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- colab/mstr_b012_governance.py
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- benchmarks/manifests/B012-raw-code-proxy.json
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json

      - name: Install development dependencies on canonical main
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'

      - name: Verify machine B012 entry state on canonical main
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligibility.json
          python - <<'PY'
          import json
          import os
          data = json.load(open('/tmp/b012-eligibility.json', encoding='utf-8'))
          assert data['task_id'] == 'B012'
          assert data['canonical_main'] == os.environ['BASE_SHA']
          assert data['eligible'] is True
          assert data['authority_result']['satisfied'] is True
          assert data['state_consistency_result']['observed_state'] == 'PENDING'
          assert data['supersession_result']['superseded'] is False
          assert all(row['satisfied'] for row in data['prerequisite_results'])
          PY

      - name: Checkout exact subject
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_SHA"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]

      - name: Verify exact incident and fail-closed binding without model access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence=artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json
          [[ "$(sha256sum "$evidence" | cut -d' ' -f1)" == "$INCIDENT_EVIDENCE_SHA256" ]]
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json').read_text())
          binding = json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          assert evidence['run_id'] == 34169060075
          assert evidence['job_id'] == 101885732522
          assert evidence['canonical_main_at_start'] == os.environ['BASE_SHA']
          assert evidence['workflow_conclusion'] == 'failure'
          assert evidence['execution_step_conclusion'] == 'cancelled'
          assert evidence['artifact_upload_step_conclusion'] == 'skipped'
          assert evidence['cleanup_step_conclusion'] == 'skipped'
          assert evidence['durable_artifact_count'] == 0
          assert evidence['executor_authored_failure_json'] is False
          assert evidence['raw_code_result'] == 'NONE_DURABLY_PROVEN'
          assert evidence['model_quality_verdict'] == 'NONE'
          assert evidence['model_access_before_shutdown'] == 'UNKNOWN_UNRECORDED'
          assert evidence['regenerated_q4_identity_before_shutdown'] == 'UNKNOWN_UNRECORDED'
          assert evidence['candidate_execution_completion'] == 'NOT_PROVEN'
          assert evidence['ephemeral_cleanup_completion'] == 'NOT_PROVEN'
          assert evidence['retry_authority_created'] is False
          assert evidence['external_dispatch_authority_created'] is False
          assert evidence['training'] is False
          assert binding['status'] == os.environ['BLOCKED_STATUS']
          qwen = binding['qwen_raw_code_recovery_runner_shutdown']
          assert qwen['run_id'] == 34169060075
          assert qwen['failure_evidence_sha256'] == os.environ['INCIDENT_EVIDENCE_SHA256']
          assert qwen['same_recovery_topology_as_failed_run_34163308005'] is True
          assert qwen['repeating_same_recovery_topology_authorized_by_this_evidence'] is False
          assert qwen['retry_authority_created'] is False
          assert qwen['external_dispatch_authority_created'] is False
          PY
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_RUN" --jq .conclusion)" == failure ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_RUN" --jq .head_sha)" == "$BASE_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_RUN/artifacts" --jq .total_count)" == 0 ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_RUN/jobs?per_page=100" > /tmp/jobs.json
          python - <<'PY'
          import json
          import os
          jobs = json.load(open('/tmp/jobs.json', encoding='utf-8'))['jobs']
          job = next(row for row in jobs if row['id'] == int(os.environ['INCIDENT_JOB']))
          steps = {row['name']: row['conclusion'] for row in job['steps']}
          assert steps['Recover Qwen raw-code evidence only'] == 'cancelled'
          assert steps['Upload Qwen raw-code recovery JSON'] == 'skipped'
          assert steps['Remove ephemeral B012 recovery binaries'] == 'skipped'
          PY

      - name: Run focused fail-closed contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m ruff check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py

      - name: Verify repository quality
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src/mstr_qualify

      - name: Final immutable live-ref guard
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          echo 'PR193_QUALIFICATION=PASS'
          echo "B012_BINDING_STATUS=$BLOCKED_STATUS"
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
