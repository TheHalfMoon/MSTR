name: Mandatory premerge verification for exact B020 candidate

on:
  push:
    branches:
      - evidence/b020-premerge-1895094

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN: ef90e96ba3d4e2c253987d1d104e0de26ce93529
  EXPECTED_HEAD: 189509470eae10f1080938b0b2b873f375842f35
  PR_NUMBER: '81'
  REVIEW_ID: '5056921687'

jobs:
  pr_semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 189509470eae10f1080938b0b2b873f375842f35
          fetch-depth: 0
      - name: Verify PR identity, scope, and immutable semantics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          mapfile -t actual < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' | sort)
          test "${#actual[@]}" -eq 10
          test "$(git diff --name-only "$EXPECTED_MAIN"..."$EXPECTED_HEAD" -- configs/task-gate/mstr-000b.json specs/002-code-model-supremacy-foundation/tasks.md specs/002-code-model-supremacy-foundation/plan.md .specify/memory/constitution.md | wc -l)" -eq 0
          cmp schemas/mstr-difficulty-calibration-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-difficulty-calibration-v0.schema.json

  review_surface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 189509470eae10f1080938b0b2b873f375842f35
          fetch-depth: 0
      - name: Verify exact-head independent review and no unresolved inline threads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          reviews=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews")
          jq -e --argjson id "$REVIEW_ID" --arg head "$EXPECTED_HEAD" '.[] | select(.id == $id and .state == "COMMENTED" and .commit_id == $head)' <<<"$reviews" >/dev/null
          query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:20){nodes{body commit{oid}}}}}}}}'
          threads=$(gh api graphql -f query="$query" -F owner='TheHalfMoon' -F name='MSTR' -F number="$PR_NUMBER")
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0' <<<"$threads"

  task_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef90e96ba3d4e2c253987d1d104e0de26ce93529
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-prove B020 entry and canonical drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          mstr-qualify task eligible B020 > /tmp/b020.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false' /tmp/b020.json
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          if mstr-qualify task eligible B021 > /tmp/b021.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.state_consistency_result.observed_state == "PENDING" and .eligible == false' /tmp/b021.json

  full_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 189509470eae10f1080938b0b2b873f375842f35
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact-head frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_difficulty_calibration_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: [pr_semantics, review_surface, task_gate, full_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b020-premerge-1895094
          fetch-depth: 0
      - name: Final immutable main, head, and PR recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/000b-b020-difficulty-calibration-contract | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
