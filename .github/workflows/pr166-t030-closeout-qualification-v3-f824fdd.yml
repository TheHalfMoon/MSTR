name: Exact-head qualification PR166 T030 closeout v3

on:
  push:
    branches:
      - evidence/pr166-t030-closeout-qualification-v3-f824fdd

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  BASE_SHA: 8916fa7138ad56d18452b7a20db9c8cb982648ba
  HEAD_SHA: f824fdd082457de0542eed703b8e4b7b4edf5002
  HEAD_TREE: c94b97fcdf20a56e2de08db9eab4667ebe632644
  TARGET_BRANCH: closeout/000-t030-canonical

jobs:
  identity_semantics:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live identity, prerequisite evidence, and authority boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          root='https://api.github.com/repos/TheHalfMoon/MSTR'
          def get(p):
              with urllib.request.urlopen(urllib.request.Request(root+p,headers=h)) as r: return json.load(r)
          pr=get('/pulls/166')
          assert pr['state']=='open' and not pr['draft'] and not pr['merged']
          assert pr['base']['sha']==os.environ['BASE_SHA'] and pr['head']['sha']==os.environ['HEAD_SHA']
          assert pr['commits']==4 and pr['changed_files']==3
          expected={'docs/canonical/CURRENT_STATE.md','evidence/T030-runtime-adapters.md','specs/000-universal-laptop-interaction-contract/tasks.md'}
          assert {x['filename'] for x in get('/pulls/166/files?per_page=100')}==expected
          for rid in (33971815139,33971878391,33972061731,33972305104,33972551215):
              r=get(f'/actions/runs/{rid}')
              assert r['status']=='completed' and r['conclusion']=='success', rid
          rv=next(x for x in get('/pulls/165/reviews?per_page=100') if x['id']==5121599106)
          assert rv['state']=='COMMENTED' and rv['commit_id']=='0462786550d24096272b7541ab286e838b4a1c2e' and 'Findings: NONE' in rv['body']
          req=urllib.request.Request(root+'/contents/artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json?ref='+os.environ['BASE_SHA'],headers=h)
          try: urllib.request.urlopen(req)
          except urllib.error.HTTPError as e: assert e.code==404
          else: raise AssertionError('B012 authority unexpectedly exists')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Verify bounded diff and final reconciled semantics
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..$HEAD_SHA")" = 4
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort >/tmp/a
          printf '%s\n' docs/canonical/CURRENT_STATE.md evidence/T030-runtime-adapters.md specs/000-universal-laptop-interaction-contract/tasks.md | sort >/tmp/e
          diff -u /tmp/e /tmp/a
          python - <<'PY'
          import json,re
          from pathlib import Path
          t=Path('specs/000-universal-laptop-interaction-contract/tasks.md').read_text()
          assert '- [x] T030 [US1]' in t and '- [ ] T031 [US1]' in t
          a=Path('specs/001-agent-harness-verified-loop-foundation/tasks.md').read_text()
          for n in range(5,19): assert re.search(rf'- \[x\] \*\*A{n:03d}\b',a),n
          for n in range(19,25): assert re.search(rf'- \[ \] \*\*A{n:03d}\b',a),n
          b=json.loads(Path('configs/task-gate/mstr-000b.json').read_text())['tasks']
          for n in list(range(1,12))+list(range(14,31)): assert b[f'B{n:03d}']['canonical_state']=='COMPLETE_CANONICAL',n
          assert b['B012']['canonical_state']=='PENDING'
          assert b['B012']['required_authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert b['B013']['canonical_state']=='BLOCKED'
          for n in range(31,35): assert b[f'B{n:03d}']['canonical_state']=='PENDING',n
          s=Path('docs/canonical/CURRENT_STATE.md').read_text()
          markers=(
            'PROJECT_PHASE = PRETRAINING_FOUNDATION / MSTR-000_LOCAL_QUALIFICATION + MSTR-000A_CONVERGENCE_GATED + MSTR-000B_GOVERNANCE_EXECUTION',
            '## Canonical History Through T030 + A018','T000-T030 = COMPLETE_CANONICAL','A005-A018 = COMPLETE_CANONICAL',
            'A001-A018 are `COMPLETE_CANONICAL`.','A019 = PENDING / CONVERGENCE_GATED / REQUIRES_B013_STABLE_POOL',
            'A020 = PENDING / CONVERGENCE_GATED / REQUIRES_B013_STABLE_POOL_AND_B026_RESEARCH_LADDER',
            'LAST_COMPLETE_MSTR_000B_TASK = B030 / COMPLETE_CANONICAL','B012 = PENDING / BLOCKED_BY_EXACT_FOUNDER_AUTHORITY',
            'B013 = BLOCKED_BY_B012','B014-B030 = COMPLETE_CANONICAL',
            'BUILD_LOOP = MSTR_BUILD_LOOP_V0_IMPLEMENTED / A005_COMPLETE_CANONICAL',
            'T031 = NEXT / MATERIAL_EXECUTION_AUTHORITY_AND_EPHEMERAL_ARTIFACT_RECONCILIATION_REQUIRED / NOT_COMPLETE_CANONICAL')
          for m in markers: assert m in s,m
          for stale in ('The next MSTR-000A early-safe task is A005','BUILD_LOOP = PARTIALLY_IMPLEMENTED_MSTR_000A','MSTR-000A_EARLY_SAFE + MSTR-000B_GOVERNANCE_EXECUTION'):
              assert stale not in s,stale
          e=Path('evidence/T030-runtime-adapters.md').read_text()
          for m in ('IMPLEMENTATION_PR = #165','POSTMERGE = 33972551215 / SUCCESS','FULL_PYTEST = 1354 PASSED','T030_COMPLETE_CANONICAL = YES_ON_CLOSEOUT_MERGE','T031_EXECUTION_AUTHORITY = NOT_CREATED_BY_T030','B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION = ABSENT'):
              assert m in e,m
          assert not Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').exists()
          PY

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen repository quality gates
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q
          ruff check .
          mypy
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test -z "$(git status --porcelain)"

  final_qualification:
    needs: [identity_semantics, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Recheck immutable live target
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          echo T030_CLOSEOUT_EXACT_HEAD_QUALIFICATION=PASS
          echo QUALIFIED_HEAD=$HEAD_SHA
          echo QUALIFIED_TREE=$HEAD_TREE
          echo EXTERNAL_EXECUTION=NONE
