name: PR183 B012 activation mandatory premerge

on:
  push:
    branches:
      - evidence/pr183-b012-activation-mandatory-premerge-3030980

permissions:
  contents: read
  pull-requests: read

env:
  PR_NUMBER: "183"
  BASE_SHA: b04db4aa42de3c4b5adcba2f54052a6ab2d3fcec
  SUBJECT_BRANCH: fix/b012-activate-stage-checkpoint-topology
  SUBJECT_HEAD: 30309808dfe5e352e5289653bcea97cf18bc2ec3
  SUBJECT_TREE: 21c21200967de1cbfc82c268309a74e669d8fc6a
  QUALIFICATION_RUN: "34150730256"
  REVIEW_RUN: "34152364613"

jobs:
  mandatory-premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout premerge evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify exact premerge provenance and prior gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_HEAD" ]]
          [[ "$(git merge-base "$SUBJECT_HEAD" HEAD)" == "$SUBJECT_HEAD" ]]
          git diff --name-only "$SUBJECT_HEAD..HEAD" > /tmp/evidence_changed
          [[ "$(wc -l < /tmp/evidence_changed)" -eq 1 ]]
          grep -Fx '.github/workflows/pr183-b012-activation-mandatory-premerge-3030980.yml' /tmp/evidence_changed
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-b012-pr183-premerge',
          }

          def get(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          pr = get(f"https://api.github.com/repos/TheHalfMoon/MSTR/pulls/{os.environ['PR_NUMBER']}")
          assert pr['state'] == 'open'
          assert pr['draft'] is False
          assert pr['mergeable'] is not False
          assert pr['base']['ref'] == 'main'
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['ref'] == os.environ['SUBJECT_BRANCH']
          assert pr['head']['sha'] == os.environ['SUBJECT_HEAD']
          assert pr['changed_files'] == 6

          for env_name in ('QUALIFICATION_RUN', 'REVIEW_RUN'):
              run = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/' + os.environ[env_name])
              assert run['status'] == 'completed'
              assert run['conclusion'] == 'success'

          reviews = get(f"https://api.github.com/repos/TheHalfMoon/MSTR/pulls/{os.environ['PR_NUMBER']}/reviews?per_page=100")
          comments = get(f"https://api.github.com/repos/TheHalfMoon/MSTR/pulls/{os.environ['PR_NUMBER']}/comments?per_page=100")
          assert reviews == []
          assert comments == []
          print('PR_IDENTITY=PASS')
          print('QUALIFICATION_GATE=PASS')
          print('INDEPENDENT_REVIEW_GATE=PASS')
          print('REVIEW_THREADS_RECONCILED=PASS')
          PY

      - name: Guard exact subject and containment
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_HEAD"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_HEAD" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          [[ "$(git merge-base "$BASE_SHA" HEAD)" == "$BASE_SHA" ]]
          git diff --name-only "$BASE_SHA..HEAD" | sort -u > /tmp/changed
          cat >/tmp/expected <<'EOF'
          .github/workflows/b012-qualify.yml
          artifacts/manifests/B012-executor-toolchain-binding.json
          artifacts/manifests/B012-runner-shutdown-topology-repair.json
          tests/contract/test_b012_executor_binding.py
          tests/contract/test_b012_runner_shutdown_evidence.py
          tests/contract/test_b012_stage_checkpoint_topology.py
          EOF
          sort -u /tmp/expected -o /tmp/expected
          diff -u /tmp/expected /tmp/changed
          echo 'EXACT_SUBJECT_CONTAINMENT=PASS'

      - name: Verify exact-main B012 eligibility immediately premerge
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-premerge-eligible.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          gate = json.loads(Path('/tmp/b012-premerge-eligible.json').read_text(encoding='utf-8'))
          assert gate['canonical_main'] == os.environ['BASE_SHA']
          assert gate['eligible'] is True
          assert gate['authority_result']['satisfied'] is True
          assert gate['supersession_result']['superseded'] is False
          print('B012_PREMERGE_ELIGIBLE=true')
          PY

      - name: Run mandatory exact-subject regression
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_HEAD"
          python -m pytest -q \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            colab/mstr_b012_staged.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final guarded merge preconditions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/fix/b012-activate-stage-checkpoint-topology | cut -f1)"
          [[ "$REMOTE_MAIN" == "$BASE_SHA" ]]
          [[ "$REMOTE_HEAD" == "$SUBJECT_HEAD" ]]
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_HEAD" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          python - <<'PY'
          import json
          import os
          import urllib.request
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-b012-pr183-final-premerge',
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/TheHalfMoon/MSTR/pulls/{os.environ['PR_NUMBER']}",
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              pr = json.load(response)
          assert pr['state'] == 'open'
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['sha'] == os.environ['SUBJECT_HEAD']
          assert pr['mergeable'] is not False
          PY
          echo "FINAL_REMOTE_MAIN=$REMOTE_MAIN"
          echo "FINAL_PR_HEAD=$REMOTE_HEAD"
          echo "FINAL_PR_TREE=$SUBJECT_TREE"
          echo 'MANDATORY_PREMERGE=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
