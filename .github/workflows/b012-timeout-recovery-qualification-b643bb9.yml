name: B012 timeout recovery qualification b643bb9

on:
  push:
    branches:
      - evidence/b012-timeout-recovery-qualification-b643bb9

permissions:
  contents: read
  pull-requests: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact B012 recovery subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b643bb9ced3469b4ef747b309fd68a33d561f4c2
          fetch-depth: 0
          persist-credentials: false
      - name: Focused governance and timeout recovery gates
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b643bb9ced3469b4ef747b309fd68a33d561f4c2"
          test "$(git merge-base HEAD origin/main)" = "1fd324cddf3c2f852810e72a4c195199d7b884c4"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012
          python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_timeout_binding.py \
            tests/contract/test_b012_timeout_budget.py
          python -m mstr_qualify validate
          python -m compileall -q colab/mstr_b012_measure.py colab/mstr_b012_execute.py colab/mstr_b012_governance.py
          echo 'FOCUSED_B012_RECOVERY=PASS'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'

  canonical_quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact B012 recovery subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b643bb9ced3469b4ef747b309fd68a33d561f4c2
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen quality gates
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b643bb9ced3469b4ef747b309fd68a33d561f4c2"
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "1fd324cddf3c2f852810e72a4c195199d7b884c4"
          echo 'CANONICAL_QUALITY=PASS'
          echo 'MODEL_EXECUTION_PERFORMED=false'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'

  final_qualification:
    runs-on: ubuntu-24.04
    needs: [focused, canonical_quality]
    steps:
      - name: Verify subject identity and live base
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/fix/b012-timeout-budget-recovery-current-main | awk '{print $1}')" = "b643bb9ced3469b4ef747b309fd68a33d561f4c2"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "1fd324cddf3c2f852810e72a4c195199d7b884c4"
          echo 'B012_TIMEOUT_RECOVERY_FINAL_QUALIFICATION=PASS'
