name: Qualify T029 recovery exact head 4398d59

on:
  push:
    branches:
      - evidence/t029-recovery-4398d59

permissions:
  contents: read

env:
  EXPECTED_MAIN: 97904ac5ad17e7142e88944ee83dbb304ecb197f
  TARGET_HEAD: 4398d59ce33fadb8547c15e87964ad425cade0ac
  TARGET_BRANCH: fix/000-t029-nonutf8-quantizer-output
  LLAMA_CPP_COMMIT: fc35562ba46fbbf8e30cac85edbb39642c37d248

jobs:
  identity_scope:
    runs-on: ubuntu-latest
    steps:
      - name: Check exact immutable identities
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          TARGET_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$TARGET_SHA" = "$TARGET_HEAD"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Check exact recovery scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$EXPECTED_MAIN" "$TARGET_HEAD" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          artifacts/manifests/quantization/T029-q4-profiles.json
          colab/mstr_t029_quantize.py
          evidence/T029-runner-recovery.md
          tests/unit/test_t029_quantize_runner.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Focused runner regression
        run: python -m pytest -q tests/unit/test_t029_quantize_runner.py
      - name: Offline schema validation
        run: mstr-qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: ruff check src tests colab/mstr_t029_quantize.py
      - name: Mypy
        run: mypy src

  ministral_retry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build toolchain and conversion dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential
          pip install numpy torch --index-url https://pypi.org/simple/ --quiet 2>/dev/null || pip install numpy --quiet
          pip install sentencepiece protobuf gguf safetensors transformers --quiet
      - name: Retry Ministral exact T029 cell
        run: |
          python colab/mstr_t029_quantize.py \
            --t027-manifest artifacts/manifests/T027-weight-access.json \
            --candidate ministral-3-3b \
            --llama-cpp-commit "$LLAMA_CPP_COMMIT" \
            --workdir "$RUNNER_TEMP/mstr_t029_work" \
            --report reports/t029-ministral-3-3b.json
      - name: Upload durable report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t029-recovery-ministral-3-3b
          path: reports/
          if-no-files-found: error
      - name: Delete local binaries
        if: always()
        run: rm -rf "$RUNNER_TEMP/mstr_t029_work"

  complete:
    needs: [identity_scope, quality, ministral_retry]
    runs-on: ubuntu-latest
    steps:
      - name: Recheck exact identities
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          TARGET_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$TARGET_SHA" = "$TARGET_HEAD"
