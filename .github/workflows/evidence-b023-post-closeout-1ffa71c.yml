name: Verify B023 canonical closeout on exact main

on:
  push:
    branches:
      - evidence/b023-post-closeout-1ffa71c

permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read

env:
  MERGE_SHA: 1ffa71c94bda161ec7be7784de3a6a4be81570ad
  MERGE_TREE: 2d2e163131009fc4425b769b036ee0502abbaaa8
  PARENT_BASE: f71a15f967250c5c523749be9f9f3066feccb902
  PARENT_HEAD: 2392929d247ba8e5b37617b22244b9e11b129959
  PR_NUMBER: '134'
  QUALIFICATION_RUN: '33533860140'
  PREMERGE_RUN: '33535079145'
  CODEX_REVIEW_COMMENT: '5497449092'

jobs:
  merge_identity_and_provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - name: Verify exact canonical merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          read -r commit p1 p2 extra <<<"$(git rev-list --parents -n1 "$MERGE_SHA")"
          test "$commit" = "$MERGE_SHA"
          test "$p1" = "$PARENT_BASE"
          test "$p2" = "$PARENT_HEAD"
          test -z "${extra:-}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
      - name: Verify merged PR and qualification/premerge provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg merge "$MERGE_SHA" --arg base "$PARENT_BASE" --arg head "$PARENT_HEAD" \
            '.state == "closed" and .merged == true and .merge_commit_sha == $merge and .base.sha == $base and .head.sha == $head and .changed_files == 5' /tmp/pr.json

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" > /tmp/qual.json
          jq -e '.status == "completed" and .conclusion == "success"' /tmp/qual.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREMERGE_RUN}" > /tmp/premerge.json
          jq -e '.status == "completed" and .conclusion == "success"' /tmp/premerge.json

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${CODEX_REVIEW_COMMENT}" > /tmp/review.json
          jq -e --arg short "${PARENT_HEAD:0:10}" \
            '.user.login == "chatgpt-codex-connector[bot]" and .performed_via_github_app.slug == "chatgpt-codex-connector" and (.body | contains("Didn'\''t find any major issues")) and (.body | contains("Reviewed commit:")) and (.body | contains($short))' /tmp/review.json

          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner='TheHalfMoon' -f name='MSTR' -F number=134 > /tmp/threads.json
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0' /tmp/threads.json

  canonical_machine_frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Prove B023 terminal, B024 eligible, B026 dependency block, and B011 authority block
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$MERGE_SHA"
          git update-ref refs/remotes/origin/main "$MERGE_SHA"

          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json

          set +e
          mstr-qualify task eligible B023 > /tmp/b023.json
          rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL"' /tmp/b023.json

          mstr-qualify task eligible B024 > /tmp/b024.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true' /tmp/b024.json
          jq -e '[.prerequisite_results[] | select(.task_id == "B023" and .satisfied == true)] | length == 1' /tmp/b024.json

          set +e
          mstr-qualify task eligible B026 > /tmp/b026.json
          rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING"' /tmp/b026.json
          jq -e '[.prerequisite_results[] | select(.task_id == "B024" and .satisfied == false)] | length == 1' /tmp/b026.json

          set +e
          mstr-qualify task eligible B011 > /tmp/b011.json
          rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json

          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"

  canonical_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Run exact-main quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_verifier_health.py tests/contract/test_verifier_health_contract.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"

  complete:
    needs: [merge_identity_and_provenance, canonical_machine_frontier, canonical_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - name: Final immutable post-closeout recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          echo "B023_CLOSEOUT_MERGE=$MERGE_SHA"
          echo "B023_POST_CLOSEOUT=PASS"
          echo "NEXT_MACHINE_TASK=B024"
          echo "WEIGHT_CHANGING_TRAINING=NONE"
