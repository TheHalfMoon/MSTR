name: Build A010 capability profile candidate

on:
  push:
    branches:
      - evidence/a010-build-cdf5e89

permissions:
  contents: write

env:
  CANONICAL_MAIN: cdf5e89886919a05173a2921c03d213ee5992126
  TARGET_BRANCH: feat/000a-a010-capability-profile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify immutable entry and target absence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target branch already exists" >&2
            exit 1
          fi
          grep -F -- '- [x] **A009 Implement H2 WePLD-native adapter.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A010 Freeze evidence-derived `CapabilityProfile` contract for WePLD routing.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
      - name: Materialize exact A010 candidate
        shell: bash
        env:
          SCHEMA_B64: 
          VALID_B64: 
          INVALID_B64: 
          TEST_B64: 
          EVIDENCE_B64: 
        run: |
          set -euo pipefail
          git checkout -b "$TARGET_BRANCH"
          python - <<'PY'
          import base64
          import os
          import subprocess
          from pathlib import Path

          def write_b64(path: str, env_name: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(os.environ[env_name]))

          write_b64("schemas/mstr-capability-profile-v0.schema.json", "SCHEMA_B64")
          write_b64("specs/001-agent-harness-verified-loop-foundation/contracts/mstr-capability-profile-v0.schema.json", "SCHEMA_B64")
          write_b64("tests/fixtures/schemas/valid/mstr-capability-profile-v0.json", "VALID_B64")
          write_b64("tests/fixtures/schemas/invalid/mstr-capability-profile-v0.json", "INVALID_B64")
          write_b64("tests/contract/test_capability_profile_contract.py", "TEST_B64")
          write_b64("evidence/mstr-000a/A010-capability-profile.md", "EVIDENCE_B64")

          schemas_path = Path("src/mstr_qualify/schemas.py")
          schemas_text = schemas_path.read_text(encoding="utf-8")
          marker = '    "mstr-run-event-v0": "mstr-run-event-v0.schema.json",\n'
          addition = marker + '    # MSTR-000A A010: evidence-derived WePLD routing capability profile.\n    "mstr-capability-profile-v0": "mstr-capability-profile-v0.schema.json",\n'
          if schemas_text.count(marker) != 1:
              raise SystemExit("schemas.py insertion marker mismatch")
          schemas_path.write_text(schemas_text.replace(marker, addition, 1), encoding="utf-8")

          contract_path = Path("tests/contract/test_schemas.py")
          contract_text = contract_path.read_text(encoding="utf-8")
          marker = "\n}\n\n\ndef _fixture"
          addition = '\n    "mstr-capability-profile-v0": (\n        ROOT\n        / "specs"\n        / "001-agent-harness-verified-loop-foundation"\n        / "contracts"\n        / "mstr-capability-profile-v0.schema.json"\n    ),' + marker
          if contract_text.count(marker) != 1:
              raise SystemExit("test_schemas.py insertion marker mismatch")
          contract_path.write_text(contract_text.replace(marker, addition, 1), encoding="utf-8")

          cli_test_path = Path("tests/integration/test_cli_offline.py")
          cli_test_text = cli_test_path.read_text(encoding="utf-8")
          marker = '    assert payload["schemas_checked"] == [\n        "candidate-record",\n        "interaction-contract",\n'
          addition = marker + '        "mstr-capability-profile-v0",\n'
          if cli_test_text.count(marker) != 1:
              raise SystemExit("test_cli_offline.py insertion marker mismatch")
          cli_test_path.write_text(cli_test_text.replace(marker, addition, 1), encoding="utf-8")

          expected = {
              "evidence/mstr-000a/A010-capability-profile.md",
              "schemas/mstr-capability-profile-v0.schema.json",
              "specs/001-agent-harness-verified-loop-foundation/contracts/mstr-capability-profile-v0.schema.json",
              "src/mstr_qualify/schemas.py",
              "tests/contract/test_capability_profile_contract.py",
              "tests/contract/test_schemas.py",
              "tests/fixtures/schemas/invalid/mstr-capability-profile-v0.json",
              "tests/fixtures/schemas/valid/mstr-capability-profile-v0.json",
              "tests/integration/test_cli_offline.py",
          }
          actual = set(subprocess.check_output(["git", "status", "--short"], text=True).splitlines())
          paths = {line[3:] for line in actual}
          if paths != expected:
              raise SystemExit(f"unexpected A010 scope: {sorted(paths)}")
          PY
          git diff --check
      - name: Run A010 focused and frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_capability_profile_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy src
      - name: Commit and publish exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
          git diff --check
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add \
            evidence/mstr-000a/A010-capability-profile.md \
            schemas/mstr-capability-profile-v0.schema.json \
            specs/001-agent-harness-verified-loop-foundation/contracts/mstr-capability-profile-v0.schema.json \
            src/mstr_qualify/schemas.py \
            tests/contract/test_capability_profile_contract.py \
            tests/contract/test_schemas.py \
            tests/fixtures/schemas/invalid/mstr-capability-profile-v0.json \
            tests/fixtures/schemas/valid/mstr-capability-profile-v0.json \
            tests/integration/test_cli_offline.py
          git commit -m "feat(mstr-000a): freeze A010 capability profile contract"
          TARGET_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          echo "TARGET_SHA=$TARGET_SHA"
