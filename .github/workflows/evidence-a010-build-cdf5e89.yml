**Task:** `MSTR-000A / A010`  
**State:** `IMPLEMENTATION_ACTIVE`  
**Canonical base:** `cdf5e89886919a05173a2921c03d213ee5992126`  
**Authority:** contract/schema/fixture work only; no model execution or external effect.

## Objective

Freeze `mstr.capability-profile.v0`, the evidence-derived capability description consumed by WePLD routing and other harness policy. The contract records measured capability without converting vendor claims, model-card statements, or unevaluated expectations into project truth.

## Frozen fields

```text
reliable_context_budget
preferred_edit_arm
tool_call_reliability
localization_strength
planning_depth
recommended_verifier_cadence
max_repair_depth
fim_strength
shell_reliability
context_compaction_strength
```

Every capability field is explicitly `MEASURED` or `UNMEASURED`. A measured field requires a typed value and at least one admissible evidence reference. An unmeasured field carries `value=null` and no field-level evidence references.

## Evidence boundary

Admissible evidence source classes are exactly `MSTR_RUN`, `MSTR_RESULT`, `REPOSITORY_FIXTURE`, and `CANONICAL_DECISION`. `VENDOR_CLAIM_ONLY` is intentionally invalid. Vendor/model-card material may motivate measurement but cannot itself populate a measured routing field.

A real profile binds exact `model_id`, `model_revision`, `artifact_sha256`, `tokenizer_revision`, and `quantization_identity`. This task's fixture is repository-owned synthetic evidence only and is not a real model capability claim.

## Authority boundary

```text
MODEL_WEIGHT_ACCESS = NONE
MODEL_EXECUTION = NONE
REAL_CAPABILITY_MEASUREMENT = NONE
NETWORK_MODEL_OR_PROVIDER_CALL = NONE
PAID_MODEL_API = NONE
PAID_COMPUTE = NONE
LARGE_DATASET_INGESTION = NONE
PRIVATE_USER_DATA_INGESTION = NONE
PRODUCTION_TRACE_INGESTION = NONE
WEIGHT_CHANGING_TRAINING = NONE
LARGE_SCALE_RL = NONE
PRODUCTION_RELEASE = NONE
A010_AUTHORITY = CAPABILITY_PROFILE_CONTRACT_AND_REPOSITORY_FIXTURES_ONLY
```

A010 remains non-canonical until exact-head qualification, review, mandatory premerge verification, guarded merge, post-merge proof, canonical closeout, and post-closeout proof succeed.
