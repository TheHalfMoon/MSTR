name: B023 repaired verifier-health exact-head qualification

on:
  push:
    branches:
      - evidence/b023-verifier-health-qualify-da0480c

permissions:
  contents: read
  pull-requests: read

env:
  BASE_SHA: fdca133e53a47b8966faef172812da58503576a0
  TARGET_SHA: da0480c0eb39e4097cb2d3fd3337a7fc49ab75dc
  TARGET_TREE: 097cf6373e918e60f6c20bb81e3b7f28435177d3
  TARGET_BRANCH: feat/000b-b023-verifier-health-evaluator
  PR_NUMBER: '133'

jobs:
  identity_contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify exact identity, ancestry, live refs, PR state, and implementation scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$BASE_SHA" "$TARGET_SHA")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          test "$(jq -r '.state' /tmp/pr.json)" = "open"
          test "$(jq -r '.draft' /tmp/pr.json)" = "false"
          test "$(jq -r '.head.sha' /tmp/pr.json)" = "$TARGET_SHA"
          test "$(jq -r '.base.sha' /tmp/pr.json)" = "$BASE_SHA"

          printf '%s\n' \
            evidence/mstr-000b/B023-verifier-health-implementation.md \
            src/mstr_qualify/verifier/__init__.py \
            src/mstr_qualify/verifier/health.py \
            tests/unit/test_verifier_health.py | sort > /tmp/expected
          git diff --name-only "$BASE_SHA...$TARGET_SHA" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(grep '^\.github/workflows/' /tmp/actual || true)"
          test -z "$(grep '^specs/002-code-model-supremacy-foundation/tasks.md$' /tmp/actual || true)"
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md

      - name: Verify frozen B023, B022, A018, A006, and review-fix semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/mstr_qualify/verifier/health.py').read_text(encoding='utf-8')
          tests = Path('tests/unit/test_verifier_health.py').read_text(encoding='utf-8')
          evidence = Path('evidence/mstr-000b/B023-verifier-health-implementation.md').read_text(encoding='utf-8')

          for health_class in ('HEALTHY', 'PARTIAL', 'DISAGREEMENT', 'BROKEN', 'LEAKED', 'TAMPERED'):
              assert f'"{health_class}"' in source, health_class
          assert 'validate_instance("mstr-verifier-health-v0", record)' in source
          assert '"CLEAN_POSITIVE_ELIGIBLE"' in source
          assert '"RESEARCH_DIAGNOSTIC_ONLY"' in source
          assert '"BLOCKED"' in source
          assert 'if isinstance(stage_ids, str) or not stage_ids or any(' in source
          assert 'code="verifier.health_stage_invalid"' in source

          required_tests = (
              'test_b023_proves_all_frozen_health_classes',
              'test_b023_stage_ids_must_be_nonempty_unique_and_nonscalar',
              'stage_ids="MSTR-002-SFT"',
              'test_b023_healthy_record_flows_through_existing_a018_admission_surface',
              'test_b023_nonhealthy_records_block_clean_positive_a018_sft',
              'test_b023_does_not_change_a006_terminal_success_authority',
          )
          for fragment in required_tests:
              assert fragment in tests, fragment

          required_evidence = (
              'ENTRY_B023_ELIGIBLE = true',
              '**State:** `IMPLEMENTATION_ACTIVE`',
              'MODEL_EXECUTION = NONE',
              'MODEL_WEIGHT_ACCESS = NONE',
              'NETWORK_EXECUTION = NONE',
              'PAID_COMPUTE = NONE',
              'LARGE_DATASET_INGESTION = NONE',
              'PRIVATE_USER_DATA_INGESTION = NONE',
              'WEIGHT_CHANGING_TRAINING = NONE',
              'CONTROLLED_REPOSITORY_FIXTURES_ONLY = TRUE',
              'scalar string passed as `stage_ids`',
          )
          for fragment in required_evidence:
              assert fragment in evidence, fragment
          PY

      - name: Install package for exact-main gate proof
        run: python -m pip install -e '.[dev]'
      - name: Re-prove B023 exact-main machine eligibility remains true and pending
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from mstr_qualify.task_gate import evaluate_task_snapshot

          result = evaluate_task_snapshot(
              'B023',
              repository_root=Path.cwd(),
              catalog_path=Path('configs/task-gate/mstr-000b.json'),
              canonical_main='fdca133e53a47b8966faef172812da58503576a0',
          )
          assert result['eligible'] is True, result
          rows = {item['task_id']: item for item in result['prerequisite_results']}
          assert set(rows) == {'A006', 'A014', 'B002', 'B022'}, rows
          assert all(rows[item]['satisfied'] is True for item in rows), rows
          print('B023_EXACT_MAIN_ELIGIBLE=PASS')
          PY

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused B023, B022, and A018 tests
        run: >-
          python -m pytest
          tests/unit/test_verifier_health.py
          tests/contract/test_verifier_health_contract.py
          tests/unit/trajectory/test_trajectory_factory.py
          -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src

  complete:
    runs-on: ubuntu-24.04
    needs:
      - identity_contract
      - quality
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Recheck exact-head immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          echo "B023_REPAIRED_EXACT_HEAD_QUALIFICATION=PASS"
