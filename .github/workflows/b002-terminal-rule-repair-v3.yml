name: B002 terminal-rule repair v3

on:
  push:
    branches:
      - evidence/b002-terminal-rule-repair-v3

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: 26e4c718cbad5549e65f5fd7e384897217830c35
      EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
      TARGET_BRANCH: feat/000b-b002-task-gate
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout guarded B002 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact identities and fetch validated mutation source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main evidence/b002-terminal-rule-repair-v2
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Apply terminal-rule repair with corrected inherited closeout fixture
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = subprocess.run(
              ["git", "show", "origin/evidence/b002-terminal-rule-repair-v2:.github/workflows/b002-terminal-rule-repair-v2.yml"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          start_marker = "      - name: Apply terminal-rule repair\n        shell: python\n        run: |\n"
          end_marker = "      - name: Verify bounded diff\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          if any(line and not line.startswith("          ") for line in lines):
              raise SystemExit("unexpected v2 repair script indentation")
          source = "\n".join(line[10:] if line else "" for line in lines) + "\n"
          exec(compile(source, "b002-terminal-rule-repair-v2", "exec"), {})

          tests = Path("tests/contract/test_task_gate.py")
          text = tests.read_text(encoding="utf-8")
          old = '''    data["tasks"]["B001"]["closeout_rule"]["terminal_states"] = [
              "COMPLETE_CANONICAL",
              "NOT_REQUIRED_FIXTURE",
          ]
          '''.replace("          ", "")
          new = '''    data["tasks"]["B001"]["closeout_rule"] = {
              "terminal_states": [
                  "COMPLETE_CANONICAL",
                  "NOT_REQUIRED_FIXTURE",
              ]
          }
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit("inherited closeout fixture anchor mismatch")
          tests.write_text(text.replace(old, new, 1).rstrip() + "\n", encoding="utf-8")

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py | sort)"
          test "$actual" = "$expected"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy
          python -m mstr_qualify validate

      - name: Commit and guarded push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py
          git commit -m "fix(mstr-000b): honor declared terminal task states"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "NEW_B002_HEAD=$(git rev-parse HEAD)"
