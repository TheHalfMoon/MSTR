name: Qualify B015 implementation head a8cafd9

on:
  push:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 205df4be5f2e25bd28b697816eac3ea6ce361aed
      EXPECTED_HEAD: a8cafd95378a0795ac1d20e61cc3b758a0fad710
      TARGET_BRANCH: feat/000b-b015-language-target-policy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8cafd95378a0795ac1d20e61cc3b758a0fad710
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact identity and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          expected=$(printf '%s\n' \
            artifacts/decisions/B015-language-target-policy.json \
            evidence/mstr-000b/B015-language-mix.md \
            tests/contract/test_b015_language_target_policy.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          test "$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | wc -l)" -eq 3
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B015_EXACT_HEAD_SCOPE=PASS'
      - name: Re-prove B015 policy semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('artifacts/decisions/B015-language-target-policy.json').read_text())
          assert policy['artifact_version'] == 'mstr.b015.language-target-policy.v1'
          assert policy['policy_id'] == 'MSTR-LANGUAGE-TARGET-POLICY-v0'
          assert policy['task_id'] == 'B015'
          assert policy['state'] == 'IMPLEMENTED_PENDING_CANONICAL_CLOSEOUT'
          assert policy['canonical_main_at_entry'] == '205df4be5f2e25bd28b697816eac3ea6ce361aed'
          assert policy['entry_gate']['eligible'] is True
          assert policy['entry_gate']['drift'] == 'clean'
          assert policy['entry_gate']['external_effect_class'] == 'NO_EXTERNAL_EFFECT'
          tiers = policy['tiers']
          assert [x['id'] for x in tiers['core']] == ['typescript','python','javascript','java','csharp','c','cpp']
          assert [x['id'] for x in tiers['secondary']] == ['go','rust','php','kotlin','swift']
          replay = policy['replay_policy']
          assert replay['denominator'] == 'LANGUAGE_TOOLING_SLICE'
          assert replay['aggregate_minimum_percent'] == {'core_programming':55,'secondary_programming':15,'tooling_config':15}
          assert replay['long_tail_maximum_percent'] == 15
          assert sum(replay['core_language_minimum_percent'].values()) <= replay['aggregate_minimum_percent']['core_programming']
          assert sum(replay['secondary_language_minimum_percent'].values()) <= replay['aggregate_minimum_percent']['secondary_programming']
          assert sum(replay['tooling_group_minimum_percent'].values()) == replay['aggregate_minimum_percent']['tooling_config']
          assert sum(replay['aggregate_minimum_percent'].values()) + replay['long_tail_maximum_percent'] == 100
          authority = policy['authority_boundary']
          assert authority and all(value is False for value in authority.values())
          evidence = Path('evidence/mstr-000b/B015-language-mix.md').read_text()
          assert '**State:** IMPLEMENTED_PENDING_CANONICAL_CLOSEOUT' in evidence
          assert 'MODEL_WEIGHT_ACCESS = NONE' in evidence
          assert 'WEIGHT_CHANGING_TRAINING = NONE' in evidence
          assert 'Marketing completeness is explicitly not evidence.' in evidence
          print('B015_POLICY_SEMANTICS=PASS')
          PY
      - name: Simulate exact candidate as canonical main
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git branch -f main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"
          python -m mstr_qualify task eligible B015 > /tmp/b015.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then
            echo 'B011 unexpectedly eligible' >&2
            exit 1
          fi
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json, os
          b15 = json.load(open('/tmp/b015.json'))
          b11 = json.load(open('/tmp/b011.json'))
          drift = json.load(open('/tmp/drift.json'))
          assert b15['canonical_main'] == os.environ['EXPECTED_HEAD']
          assert b15['eligible'] is True and b15['reasons'] == []
          assert b15['state_consistency_result']['observed_state'] == 'PENDING'
          pred = next(x for x in b15['prerequisite_results'] if x['task_id'] == 'B014')
          assert pred['observed_state'] == 'COMPLETE_CANONICAL'
          assert pred['evidence_present'] is True and pred['satisfied'] is True
          assert b15['authority_result']['required'] is False
          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state'] == 'BLOCKED'
          assert b11['authority_result']['required'] is True
          assert b11['authority_result']['satisfied'] is False
          assert drift['status'] == 'clean' and drift['findings'] == []
          print('B015_TASK_GATE_SIMULATION=PASS')
          PY
      - name: Run exact-head frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_b015_language_target_policy.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy src
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B015_EXACT_HEAD_QUALIFICATION=PASS'
      - name: Re-run exact-live-main task eligibility
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach "$EXPECTED_MAIN"
          git branch -f main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B015 > /tmp/b015-live.json
          python -m mstr_qualify task drift > /tmp/drift-live.json
          python - <<'PY'
          import json, os
          b15 = json.load(open('/tmp/b015-live.json'))
          drift = json.load(open('/tmp/drift-live.json'))
          assert b15['canonical_main'] == os.environ['EXPECTED_MAIN']
          assert b15['eligible'] is True and b15['reasons'] == []
          assert b15['state_consistency_result']['observed_state'] == 'PENDING'
          assert drift['status'] == 'clean' and drift['findings'] == []
          print('B015_EXACT_MAIN_ELIGIBILITY=PASS')
          PY
      - name: Final remote identity recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          echo 'B015_QUALIFICATION_REMOTE_RECHECK=PASS'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'LARGE_DATASET_INGESTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
          echo 'PAID_COMPUTE=NONE'
