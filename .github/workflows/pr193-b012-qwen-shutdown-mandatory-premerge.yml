name: PR193 B012 Qwen shutdown mandatory premerge

on:
  push:
    branches:
      - evidence/pr193-mandatory-premerge-15287f0

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
      HEAD: 15287f04bf279b7896a926e655c344f7be96d38c
      TREE: ac9f512e6d6b46cf85f0b055174dfe6c7571e59b
      QUAL_RUN: '34173514002'
      REVIEW_RUN: '34173839964'
      PR: '193'
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Prove exact live topology and successful evidence chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse origin/main)" = "$BASE"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          api="https://api.github.com/repos/$REPO"
          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/pulls/$PR")"
          python - <<'PY' "$pr_json"
          import json, os, sys
          p=json.loads(sys.argv[1])
          assert p['state']=='open' and not p['draft']
          assert p['base']['sha']==os.environ['BASE']
          assert p['head']['sha']==os.environ['HEAD']
          assert p.get('mergeable') is not False
          PY
          for run in "$QUAL_RUN" "$REVIEW_RUN"; do
            run_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$run")"
            python - <<'PY' "$run_json"
          import json, sys
          r=json.loads(sys.argv[1])
          assert r['status']=='completed' and r['conclusion']=='success'
          PY
          done

      - name: Prove no blocking reviews or unresolved review threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          reviews="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/pulls/$PR/reviews?per_page=100")"
          python - <<'PY' "$reviews"
          import json, sys
          reviews=json.loads(sys.argv[1])
          assert not any(r.get('state')=='CHANGES_REQUESTED' for r in reviews)
          PY
          query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}'
          body="$(python - <<'PY'
          import json
          print(json.dumps({'query': '''query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}''','variables':{'owner':'TheHalfMoon','name':'MSTR','number':193}}))
          PY
          )"
          threads="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' https://api.github.com/graphql -d "$body")"
          python - <<'PY' "$threads"
          import json, sys
          p=json.loads(sys.argv[1])
          assert 'errors' not in p, p
          nodes=p['data']['repository']['pullRequest']['reviewThreads']['nodes']
          assert not any(not n['isResolved'] for n in nodes), nodes
          PY

      - name: Prove exact seven-file bounded scope and fail-closed semantics
        run: |
          set -euo pipefail
          expected="$(mktemp)"; actual="$(mktemp)"
          cat > "$expected" <<'EOF'
          artifacts/manifests/B012-executor-toolchain-binding.json
          artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json
          evidence/mstr-000b/B012-qwen-recovery-runner-shutdown-34169060075.md
          tests/contract/test_b012_executor_binding.py
          tests/contract/test_b012_qwen_raw_code_recovery.py
          tests/contract/test_b012_runner_shutdown_evidence.py
          tests/contract/test_b012_stage_checkpoint_topology.py
          EOF
          git diff --name-only "$BASE" "$HEAD" | sort > "$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          e=json.loads(Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json').read_text())
          assert b['status']=='BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR'
          q=b['qwen_raw_code_recovery_runner_shutdown']
          assert q['run_id']==34169060075
          assert q['failure_classification']=='B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_NO_DURABLE_RECOVERY_RESULT'
          assert q['durable_artifact_count']==0
          assert q['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert q['model_quality_verdict']=='NONE'
          assert q['retry_authority_created'] is False
          assert q['external_dispatch_authority_created'] is False
          assert e['candidate_execution_completion']=='NOT_PROVEN'
          assert e['ephemeral_cleanup_completion']=='NOT_PROVEN'
          assert e['training'] is False
          assert e['paid_compute_authority_created'] is False
          PY
          test "$(git diff --name-only "$BASE" "$HEAD" -- .github/workflows configs/workflows colab | wc -l)" -eq 0

      - name: Exact-main B012 gate and canonical formatter baseline
        run: |
          set -euo pipefail
          git branch -f main "$BASE"
          git checkout --detach "$BASE"
          python -m pip install -q pytest ruff mypy
          python -m mstr_qualify validate
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/b012.json'))
          assert p['eligible'] is True
          assert p['authority']['required'] is True
          assert p['authority']['satisfied'] is True
          PY
          ruff format --check . > /tmp/base-format.txt 2>&1 || true
          grep '^Would reformat: ' /tmp/base-format.txt | sed 's/^Would reformat: //' | sort -u > /tmp/base-format-paths.txt

      - name: Fresh exact-head quality and formatter-regression gate
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD"
          pytest -q tests/contract/test_b012_executor_binding.py tests/contract/test_b012_qwen_raw_code_recovery.py tests/contract/test_b012_runner_shutdown_evidence.py tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate
          pytest -q
          ruff check .
          mypy --strict src tests
          ruff format --check tests/contract/test_b012_executor_binding.py tests/contract/test_b012_qwen_raw_code_recovery.py tests/contract/test_b012_runner_shutdown_evidence.py tests/contract/test_b012_stage_checkpoint_topology.py
          ruff format --check . > /tmp/head-format.txt 2>&1 || true
          grep '^Would reformat: ' /tmp/head-format.txt | sed 's/^Would reformat: //' | sort -u > /tmp/head-format-paths.txt
          comm -23 /tmp/head-format-paths.txt /tmp/base-format-paths.txt > /tmp/new-format-debt.txt
          test ! -s /tmp/new-format-debt.txt

      - name: Final mandatory live premerge guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE"
          api="https://api.github.com/repos/$REPO"
          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/pulls/$PR")"
          python - <<'PY' "$pr_json"
          import json, os, sys
          p=json.loads(sys.argv[1])
          assert p['state']=='open'
          assert p['base']['sha']==os.environ['BASE']
          assert p['head']['sha']==os.environ['HEAD']
          PY
