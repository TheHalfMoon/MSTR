name: PR193 B012 Qwen shutdown mandatory premerge

on:
  push:
    branches:
      - evidence/pr193-mandatory-premerge-15287f0

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
      HEAD: 15287f04bf279b7896a926e655c344f7be96d38c
      TREE: ac9f512e6d6b46cf85f0b055174dfe6c7571e59b
      QUAL_RUN: '34173514002'
      REVIEW_RUN: '34173839964'
      PR: '193'
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove exact live topology and successful evidence chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          [[ "$(git rev-parse HEAD)" == "$HEAD" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$TREE" ]]
          [[ "$(git rev-parse origin/main)" == "$BASE" ]]
          [[ "$(git merge-base "$BASE" "$HEAD")" == "$BASE" ]]
          api="https://api.github.com/repos/$REPO"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==7' /tmp/pr.json >/dev/null
          for run in "$QUAL_RUN" "$REVIEW_RUN"; do
            gh api "repos/$REPO/actions/runs/$run" > /tmp/run.json
            jq -e '.status=="completed" and .conclusion=="success"' /tmp/run.json >/dev/null
          done

      - name: Prove no blocking reviews or unresolved review threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" > /tmp/reviews.json
          jq -e '[.[] | select(.state=="CHANGES_REQUESTED")] | length == 0' /tmp/reviews.json >/dev/null
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner=TheHalfMoon -f name=MSTR -F number=193 > /tmp/threads.json
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false)] | length == 0' /tmp/threads.json >/dev/null

      - name: Prove exact seven-file bounded scope and fail-closed semantics
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            'artifacts/manifests/B012-executor-toolchain-binding.json' \
            'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json' \
            'evidence/mstr-000b/B012-qwen-recovery-runner-shutdown-34169060075.md' \
            'tests/contract/test_b012_executor_binding.py' \
            'tests/contract/test_b012_qwen_raw_code_recovery.py' \
            'tests/contract/test_b012_runner_shutdown_evidence.py' \
            'tests/contract/test_b012_stage_checkpoint_topology.py')
          [[ "$(git diff --name-only "$BASE...$HEAD" | sort)" == "$expected" ]]
          for path in .github/workflows/b012-qwen-raw-code-recovery.yml configs/workflows/b012-qwen-raw-code-recovery.yml colab/mstr_b012_qwen_raw_code_recovery.py colab/mstr_b012_governance.py benchmarks/manifests/B012-raw-code-proxy.json artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          e=json.loads(Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json').read_text())
          assert b['status']=='BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR'
          q=b['qwen_raw_code_recovery_runner_shutdown']
          assert q['run_id']==34169060075
          assert q['failure_classification']=='B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_NO_DURABLE_RECOVERY_RESULT'
          assert q['durable_artifact_count']==0
          assert q['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert q['model_quality_verdict']=='NONE'
          assert q['retry_authority_created'] is False
          assert q['external_dispatch_authority_created'] is False
          assert e['candidate_execution_completion']=='NOT_PROVEN'
          assert e['ephemeral_cleanup_completion']=='NOT_PROVEN'
          assert e['training'] is False
          assert e['paid_compute_authority_created'] is False
          PY

      - name: Exact-main B012 gate and canonical formatter baseline
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git symbolic-ref --short HEAD)" == main ]]
          [[ "$(git rev-parse HEAD)" == "$BASE" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/b012.json',encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['superseded'] is False
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          PY
          set +e
          python -m ruff format --check --diff . > /tmp/base-format.diff 2>&1
          code=$?
          set -e
          [[ "$code" -eq 1 ]]

      - name: Fresh exact-head quality and formatter-regression gate
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD"
          python -m pytest -q tests/contract/test_b012_authority.py tests/contract/test_b012_executor_binding.py tests/contract/test_b012_qwen_raw_code_recovery.py tests/contract/test_b012_runner_shutdown_evidence.py tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          python -m ruff format --check tests/contract/test_b012_executor_binding.py tests/contract/test_b012_qwen_raw_code_recovery.py tests/contract/test_b012_runner_shutdown_evidence.py tests/contract/test_b012_stage_checkpoint_topology.py
          set +e
          python -m ruff format --check --diff . > /tmp/head-format.diff 2>&1
          code=$?
          set -e
          [[ "$code" -eq 1 ]]
          python - <<'PY'
          from pathlib import Path
          def paths(path):
              out=set()
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.startswith('--- '): out.add(line[4:].split(':cell ',1)[0])
              return out
          base=paths('/tmp/base-format.diff'); head=paths('/tmp/head-format.diff')
          assert base
          assert not (head-base), f'new formatter debt: {sorted(head-base)}'
          PY

      - name: Final mandatory live premerge guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$BASE" ]]
          [[ "$(git ls-remote origin refs/heads/fix/b012-qwen-recovery-runner-shutdown-34169060075 | cut -f1)" == "$HEAD" ]]
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==7' /tmp/pr-final.json >/dev/null
          echo 'PR193_MANDATORY_PREMERGE=PASS'
