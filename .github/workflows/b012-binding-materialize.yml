name: B012 binding materialization

on:
  push:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Materialize binding on exact product head
        env:
          EXPECTED_PRODUCT_HEAD: 6170e5f9aa845f59626d0c305387df0debe9fd18
          RESOLUTION_RUN_ID: "34041852683"
          RESOLUTION_HEAD: 65fb0e205198066367af43aecc449622d97e24b8
          RESOLUTION_ARTIFACT_ID: "9991912802"
          RESOLUTION_ARTIFACT_SHA256: c6b4f409363c643b5d83db85cc450bf21a7e0c76cc113a2f7abce651828aef5d
        run: |
          set -euo pipefail
          git fetch --no-tags origin feat/b012-executor-toolchain-binding
          test "$(git rev-parse origin/feat/b012-executor-toolchain-binding)" = "$EXPECTED_PRODUCT_HEAD"
          git checkout --detach "$EXPECTED_PRODUCT_HEAD"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          binding_path = Path("artifacts/manifests/B012-executor-toolchain-binding.json")
          binding = json.loads(binding_path.read_text(encoding="utf-8"))
          binding["resolution_evidence"] = {
              "run_id": int(os.environ["RESOLUTION_RUN_ID"]),
              "evidence_head": os.environ["RESOLUTION_HEAD"],
              "artifact_id": int(os.environ["RESOLUTION_ARTIFACT_ID"]),
              "artifact_zip_sha256": os.environ["RESOLUTION_ARTIFACT_SHA256"],
              "model_access": "NONE",
              "training": False,
              "paid_cost_usd": 0.0,
          }
          binding.update({
              "governance_script_sha256": "ee3813458c62f989c15bded0e3cc55adf8d396321f27f147f8417faaba2cb42a",
              "source_script_sha256": "69afaded044fc9f85f72586658222d4a5d32a108f6df6710854254d90f3392fb",
              "artifact_script_sha256": "7141e7c8399c43aa74ef86a036d87de392d574dad15718980d9f8bee316eca54",
              "raw_code_script_sha256": "bd6d34afd8af60497a4971bb7245fc359c4132bad3772be212b6848aa73060d8",
              "executor_script_sha256": "1a7685c93ea6b40f28efd332a2ce8ad3053af7aacbf462152d29aef728ccca2b",
          })
          binding_path.write_text(json.dumps(binding, indent=2, sort_keys=False) + "\n", encoding="utf-8")

          test_path = Path("tests/contract/test_b012_executor_binding.py")
          text = test_path.read_text(encoding="utf-8")
          replacements = {
              "assert evidence[\"run_id\"] == 34037510185": "assert evidence[\"run_id\"] == 34041852683",
              "assert evidence[\"evidence_head\"] == \"c705528fb8a2790233b17cdd1721ad45b28f6316\"": "assert evidence[\"evidence_head\"] == \"65fb0e205198066367af43aecc449622d97e24b8\"",
              "assert evidence[\"artifact_id\"] == 9990642177": "assert evidence[\"artifact_id\"] == 9991912802",
              "\"12b88955e202d56ba2c4c2b2597433a269b6025c9b28560bd0feaf95b134d34a\"": "\"c6b4f409363c643b5d83db85cc450bf21a7e0c76cc113a2f7abce651828aef5d\"",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one contract evidence token: {old}")
              text = text.replace(old, new)
          test_path.write_text(text, encoding="utf-8")
          PY

          test "$(git diff --name-only)" = $'artifacts/manifests/B012-executor-toolchain-binding.json\ntests/contract/test_b012_executor_binding.py'
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_b012_executor_binding.py
          ruff check tests/contract/test_b012_executor_binding.py
          ruff format --check tests/contract/test_b012_executor_binding.py
          git diff --check
          git config user.name "mstr-evidence-bot"
          git config user.email "mstr-evidence-bot@users.noreply.github.com"
          git add artifacts/manifests/B012-executor-toolchain-binding.json tests/contract/test_b012_executor_binding.py
          git commit -m "fix(b012): refresh formatted executor binding evidence"
          git push origin HEAD:feat/b012-executor-toolchain-binding
          echo "MODEL_ACCESS=NONE"
          echo "TRAINING=false"
          echo "PAID_COST_USD=0.0"
