name: PR197 CodeRabbit durability repair builder

on:
  push:
    branches:
      - evidence/pr197-coderabbit-repair-builder-be5dc18

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE: 2d35efe6d7350f6aa0241ee9de128134cd321f90
      START_SUBJECT: be5dc182c7f15602b5da0999ad7f55108233c568
      TARGET_BRANCH: fix/b012-qwen-raw-code-case-checkpoint-topology
      PR_NUMBER: '197'
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Reverify immutable starting truth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$START_SUBJECT"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$START_SUBJECT"
          test "$(git merge-base "$BASE" "$START_SUBJECT")" = "$BASE"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --output /tmp/pr.json
          python - <<'PY'
          import json, os
          pr=json.load(open('/tmp/pr.json', encoding='utf-8'))
          assert pr['state']=='open' and pr['draft'] is False
          assert pr['base']['sha']==os.environ['BASE']
          assert pr['head']['sha']==os.environ['START_SUBJECT']
          assert pr['head']['ref']==os.environ['TARGET_BRANCH']
          assert pr['changed_files']==5
          PY

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply deterministic review repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          script=Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          text=script.read_text(encoding='utf-8')
          old='''    state["completed_stages"] = completed\n    state["last_completed_stage"] = stage\n    _write(_state_path(output_dir), state)\n    _write(\n'''
          new='''    state["completed_stages"] = completed\n    state["last_completed_stage"] = stage\n    _write(\n'''
          assert text.count(old)==1, 'unexpected completed-state write shape'
          text=text.replace(old,new,1)
          checkpoint_tail='''            "checkpoint_payload": checkpoint_payload,\n        },\n    )\n'''
          assert text.count(checkpoint_tail)==1, 'unexpected checkpoint write tail'
          text=text.replace(
              checkpoint_tail,
              checkpoint_tail + '    _write(_state_path(output_dir), state)\n',
              1,
          )
          script.write_text(text, encoding='utf-8')

          manifest_path=Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          durability=manifest['durability_boundary']
          durability['checkpoint_write_must_succeed_before_completed_state_commit']=True
          durability['actions_artifact_retention_days']=7
          durability['actions_artifacts_are_transient_transport_not_canonical_evidence']=True
          durability['canonical_long_term_evidence_store']='GIT_JSON_REPORTS_MANIFESTS_EVIDENCE'
          durability['storage_policy_path']='docs/canonical/STORAGE_ARCHITECTURE.md'
          durability['all_checkpoint_artifacts_must_be_canonicalized_to_git_before_dispatch_closeout']=True
          durability['missing_or_expired_checkpoint_artifact_fails_closed']=True
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          evidence=Path('evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md')
          evidence_text=evidence.read_text(encoding='utf-8')
          heading='## Canonical checkpoint evidence lifecycle'
          assert heading not in evidence_text, 'lifecycle section already present'
          evidence_text += '''\n\n## Canonical checkpoint evidence lifecycle\n\nGitHub Actions checkpoint artifacts are transient transport, not the canonical long-term evidence store. The seven-day artifact retention window is intentionally bounded and does not authorize a new persistent cloud store or paid storage. Canonical storage policy remains `docs/canonical/STORAGE_ARCHITECTURE.md`: JSON reports, manifests, hashes, evidence, and reports return to Git; model and derived binaries remain ephemeral.\n\nEvery required checkpoint artifact from an authorized case-checkpoint dispatch MUST be captured, hash-verified, and canonicalized into Git evidence before B012 dispatch closeout or any candidate-admission decision. If any required checkpoint artifact is missing, expired, inconsistent, or cannot be canonicalized, the run remains fail-closed and B012 completion/admission is not proven. Runner cleanup may occur after artifact upload because uploaded JSON survives the ephemeral VM; cleanup does not substitute for canonical evidence capture.\n\nThe stage writer also commits a stage checkpoint before persisting the completed-stage state. A checkpoint-write failure therefore cannot leave the durable state claiming that a stage completed when its required checkpoint was never written.\n'''
          evidence.write_text(evidence_text, encoding='utf-8')

          tests=Path('tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py')
          test_text=tests.read_text(encoding='utf-8')
          import_anchor='from pathlib import Path\n\n'
          assert test_text.count(import_anchor)==1
          test_text=test_text.replace(import_anchor, 'from pathlib import Path\n\nimport pytest\n\n', 1)
          sentinel='def test_checkpoint_write_must_succeed_before_completed_state_is_persisted'
          assert sentinel not in test_text
          test_text += '''\n\ndef test_checkpoint_write_must_succeed_before_completed_state_is_persisted(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    prior: dict[str, object] = {\n        "task_id": "B012",\n        "candidate_id": "qwen3.5-0.8b-control",\n        "canonical_main_at_start": "a" * 40,\n        "completed_stages": ["init", "source", "quantize"],\n        "last_completed_stage": "quantize",\n        "model_access_state": "EXACT_Q4_REGENERATED_VERIFIED",\n    }\n    state_path = tmp_path / "B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json"\n    state_path.write_text(json.dumps(prior, indent=2) + "\\n", encoding="utf-8")\n    working = dict(prior)\n    working["completed_stages"] = list(prior["completed_stages"])\n    real_write = case_checkpoint._write\n    checkpoint_path = case_checkpoint._checkpoint_path(\n        tmp_path, "raw-code-python-clamp"\n    )\n\n    def guarded_write(path: Path, payload: dict[str, object]) -> None:\n        if path == checkpoint_path:\n            raise OSError("synthetic checkpoint write failure")\n        real_write(path, payload)\n\n    monkeypatch.setattr(case_checkpoint, "_write", guarded_write)\n    with pytest.raises(OSError, match="synthetic checkpoint write failure"):\n        case_checkpoint._complete_stage(\n            output_dir=tmp_path,\n            state=working,\n            stage="raw-code-python-clamp",\n            checkpoint_payload={"synthetic": True},\n        )\n\n    persisted = _read_json(state_path)\n    assert persisted["completed_stages"] == ["init", "source", "quantize"]\n    assert persisted["last_completed_stage"] == "quantize"\n\n\ndef test_checkpoint_artifacts_are_transient_transport_until_git_canonicalization() -> None:\n    manifest = _read_json(MANIFEST)\n    durability = manifest["durability_boundary"]\n    assert isinstance(durability, dict)\n    workflow = WORKFLOW.read_text(encoding="utf-8")\n    assert workflow.count("retention-days: 7") == 7\n    assert durability["actions_artifact_retention_days"] == 7\n    assert durability["actions_artifacts_are_transient_transport_not_canonical_evidence"] is True\n    assert durability["canonical_long_term_evidence_store"] == (\n        "GIT_JSON_REPORTS_MANIFESTS_EVIDENCE"\n    )\n    assert durability["storage_policy_path"] == "docs/canonical/STORAGE_ARCHITECTURE.md"\n    assert (\n        durability[\n            "all_checkpoint_artifacts_must_be_canonicalized_to_git_before_dispatch_closeout"\n        ]\n        is True\n    )\n    assert durability["missing_or_expired_checkpoint_artifact_fails_closed"] is True\n    assert (\n        durability["checkpoint_write_must_succeed_before_completed_state_commit"] is True\n    )\n'''
          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Canonical format and bind exact script hash
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path=Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          script_path=Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          data=json.loads(manifest_path.read_text(encoding='utf-8'))
          data['case_checkpoint_script_sha256']=hashlib.sha256(script_path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print('REPAIRED_SCRIPT_SHA256=' + data['case_checkpoint_script_sha256'])
          PY

      - name: Prove repair scope and frozen canonical surfaces
        shell: bash
        run: |
          set -euo pipefail
          dirty=$(git diff --name-only | sort)
          expected_dirty=$(printf '%s\n' \
            'artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json' \
            'colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py' \
            'evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md' \
            'tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py' | sort)
          test "$dirty" = "$expected_dirty"
          all=$(git diff --name-only "$BASE" | sort)
          expected_all=$(printf '%s\n' \
            'artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json' \
            'colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py' \
            'configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml' \
            'evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md' \
            'tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py' | sort)
          test "$all" = "$expected_all"
          git diff --check
          for path in \
            .github/workflows/b012-qwen-raw-code-recovery.yml \
            artifacts/manifests/B012-executor-toolchain-binding.json \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B012-equivalent-qualification-execution-envelope.json \
            artifacts/manifests/B012-executor-toolchain-lock.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_raw_code.py; do
            test "$(git hash-object "$path")" = "$(git rev-parse "$BASE:$path")"
          done

      - name: Prove repaired non-authorizing semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          m=json.loads(Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json').read_text(encoding='utf-8'))
          assert m['case_checkpoint_script_sha256']==sha(m['case_checkpoint_script_path'])
          assert m['case_checkpoint_workflow_sha256']==sha(m['case_checkpoint_workflow_spec_path'])
          d=m['durability_boundary']
          assert d['checkpoint_write_must_succeed_before_completed_state_commit'] is True
          assert d['actions_artifact_retention_days']==7
          assert d['actions_artifacts_are_transient_transport_not_canonical_evidence'] is True
          assert d['all_checkpoint_artifacts_must_be_canonicalized_to_git_before_dispatch_closeout'] is True
          assert d['missing_or_expired_checkpoint_artifact_fails_closed'] is True
          assert m['activation']['active_workflow_materialized'] is False
          for key in ('authority_scope_modified','authority_transfer','retry_authority_created','external_dispatch_authority_created','candidate_expansion','candidate_revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert m['authority_boundary'][key] is False, key
          PY

      - name: Create local unpublished review-repair subject
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add \
            artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          git commit -m 'fix(b012): harden checkpoint durability lifecycle'
          echo "LOCAL_SUBJECT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "LOCAL_TREE=$(git show -s --format=%T HEAD)" >> "$GITHUB_ENV"

      - name: Reprove B012 exact-main machine eligibility
        shell: bash
        run: |
          set -euo pipefail
          git branch -f main "$BASE"
          git checkout --detach "$BASE"
          test "$(git rev-parse HEAD)" = "$BASE"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 > /tmp/eligibility.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/eligibility.json', encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['required'] is True
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert d['supersession_result']['satisfied'] is True
          assert d['state_consistency_result']['satisfied'] is True
          assert d['candidate_pool_result']['satisfied'] is True
          assert all(d['semantic_checks'].values())
          print('B012_EXACT_MAIN_ELIGIBILITY=PASS')
          PY
          git checkout --detach "$LOCAL_SUBJECT"

      - name: Focused repair contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py

      - name: Repository validation and static quality
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py

      - name: Full repository tests
        run: python -m pytest -q

      - name: Mypy
        run: python -m mypy src/mstr_qualify

      - name: Guarded fast-forward publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCAL_SUBJECT"
          test "$(git show -s --format=%P HEAD)" = "$START_SUBJECT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$START_SUBJECT"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --output /tmp/final-pr.json
          python - <<'PY'
          import json, os
          pr=json.load(open('/tmp/final-pr.json', encoding='utf-8'))
          assert pr['state']=='open'
          assert pr['base']['sha']==os.environ['BASE']
          assert pr['head']['sha']==os.environ['START_SUBJECT']
          assert pr['changed_files']==5
          PY
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$LOCAL_SUBJECT"
          echo "REVIEW_REPAIR_SUBJECT=$LOCAL_SUBJECT"
          echo "REVIEW_REPAIR_TREE=$LOCAL_TREE"
