name: PR175 B012 reconciliation qualification v2 c705d36

on:
  push:
    branches:
      - evidence/pr175-b012-reconciliation-qualification-v2-c705d36

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  exact_head:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c705d36defe3fd96cd6d9a6369b4096ee08acb75
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify exact reconciliation topology and historical truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          HEAD=c705d36defe3fd96cd6d9a6369b4096ee08acb75
          TREE=18366443d2fee5435e9ffa4ce1a432d46a9087c5
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/governance/pr174-b012-merge-race-reconciliation | awk '{print $1}')" = "$HEAD"
          test "$(git diff --name-only "$BASE".."$HEAD")" = 'evidence/B012-pr174-merge-race-reconciliation.md'
          git diff --check "$BASE".."$HEAD"
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30))
          text=Path('evidence/B012-pr174-merge-race-reconciliation.md').read_text(encoding='utf-8')
          for marker in ('PR174_MANDATORY_PREMERGE_FINAL_GUARD = FAILURE','RETROACTIVE_PREMERGE_PASS = PROHIBITED','34045379758','34045539668','34045842975','34045909273','34046087930','This artifact creates no new Founder authority'):
              assert marker in text, marker
          pr=get('https://api.github.com/repos/TheHalfMoon/MSTR/pulls/174')
          assert pr['merged'] is True and pr['merge_commit_sha']=='a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          mandatory=get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34045842975')
          assert mandatory['conclusion']=='failure'
          jobs=get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34045842975/jobs?per_page=100')['jobs']
          by={j['name']:j['conclusion'] for j in jobs}
          assert by['canonical_eligibility']=='success' and by['exact_head_gates']=='success' and by['final_premerge']=='failure'
          assert get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34045909273')['conclusion']=='success'
          assert get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34046087930')['conclusion']=='failure'
          assert get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34046360174')['conclusion']=='failure'
          print('PR175_RECONCILIATION_TRUTH_BINDING=PASS')
          PY
      - name: Run exact-head frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          git diff --exit-code
          git diff --cached --exit-code

  canonical_eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify B012 eligibility on exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          BASE=a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git symbolic-ref --short HEAD)" = 'main'
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012
          echo 'B012_CANONICAL_ELIGIBILITY=PASS'

  final:
    needs: [exact_head, canonical_eligibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Final exact refs guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = 'a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/governance/pr174-b012-merge-race-reconciliation | awk '{print $1}')" = 'c705d36defe3fd96cd6d9a6369b4096ee08acb75'
          echo 'PR175_B012_RECONCILIATION_QUALIFICATION=PASS'
          echo 'HISTORICAL_PR174_FINAL_PREMERGE=FAILURE'
          echo 'RETROACTIVE_PREMERGE_PASS=false'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
