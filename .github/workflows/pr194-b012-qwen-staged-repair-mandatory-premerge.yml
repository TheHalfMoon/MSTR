name: PR194 B012 Qwen staged repair mandatory premerge

on:
  push:
    branches:
      - evidence/pr194-mandatory-premerge-e58435c

permissions:
  contents: read
  pull-requests: read

jobs:
  premerge:
    runs-on: ubuntu-24.04
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 5e15cfd0d5eb696154a757edd9382dfea65359cf
      HEAD: e58435cbb02ec30ba60df1f24f7574f8712dc1ca
      TREE: bd04fe85b9d69747b1936c1c180012449042cfbb
      PR: '194'
      QUAL_RUN: '34176458994'
      QUAL_HEAD: 530c193ad00b0b82dfdf8d1ede64a86deb290a6b
      REVIEW_RUN: '34176864462'
      REVIEW_HEAD: 5c01f8e1311adfb63757e51146376b3f3b2bfd96
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.16
          check-latest: false

      - name: Prove exact live topology and successful evidence chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          jq -e --arg h "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h' /tmp/qual.json >/dev/null
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/review.json
          jq -e --arg h "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h' /tmp/review.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==5' /tmp/pr.json >/dev/null

      - name: Prove no blocking reviews or unresolved review threads
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" > /tmp/reviews.json
          jq -e 'all(.[]; .state != "CHANGES_REQUESTED")' /tmp/reviews.json >/dev/null
          gh api graphql -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner=TheHalfMoon -f repo=MSTR -F pr=194 > /tmp/threads.json
          jq -e '.data.repository.pullRequest.reviewThreads.nodes | all(.isResolved == true)' /tmp/threads.json >/dev/null

      - name: Prove exact five-file non-active repair scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            'artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json'
            'colab/mstr_b012_qwen_raw_code_recovery_staged.py'
            'configs/workflows/b012-qwen-raw-code-recovery-staged.yml'
            'evidence/mstr-000b/B012-qwen-staged-recovery-topology.md'
            'tests/contract/test_b012_qwen_staged_recovery_topology.py'
          )
          [[ ${#actual[@]} -eq 5 ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done
          for path in \
            .github/workflows/b012-qwen-raw-code-recovery.yml \
            colab/mstr_b012_governance.py \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B010-new-candidate-weight-access.json \
            artifacts/manifests/B011-acquired-candidates.json \
            benchmarks/manifests/B012-raw-code-proxy.json; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Exact-main B012 gate and canonical formatter baseline
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "$BASE"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/b012.json', encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['superseded'] is False
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          PY
          set +e
          python -m ruff format --check --diff . > /tmp/base-format.diff 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          git checkout --detach "$HEAD"

      - name: Prove exact staged repair semantics and hash binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path('artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json').read_text(encoding='utf-8'))
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert m['task_id']=='B012'
          assert m['candidate_id']=='qwen3.5-0.8b-control'
          assert m['base_main']=='5e15cfd0d5eb696154a757edd9382dfea65359cf'
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert sha(m['staged_script_path'])==m['staged_script_sha256']
          assert sha(m['staged_workflow_spec_path'])==m['staged_workflow_sha256']
          assert m['topology']['stages']==['init','source','quantize','raw-code','finalize']
          assert m['topology']['durable_checkpoint_after_each_completed_stage'] is True
          assert m['durability_boundary']['caught_stage_failures_preserve_in_progress_model_access_state'] is True
          assert m['durability_boundary']['final_result_completed_stages_include_finalize'] is True
          assert m['activation']['separate_activation_pr_required'] is True
          assert m['activation']['package_performs_model_access'] is False
          assert m['activation']['package_performs_model_execution'] is False
          b=m['authority_boundary']
          assert b['existing_authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          for key in ('authority_scope_modified','authority_transfer','candidate_expansion','candidate_revision_or_file_expansion','external_dispatch_authority_created','paid_compute','paid_model_api','production_release','retry_authority_created','training','weight_changing_training'):
              assert b[key] is False, key
          assert b['git_model_binaries']==0 and b['founder_machine_model_binaries']==0 and b['paid_cost_usd']==0.0
          workflow=Path(m['staged_workflow_spec_path']).read_text(encoding='utf-8')
          needle='$'+'{{ runner.temp }}/b012-qwen-raw-code-results/*.json'
          assert workflow.count(needle)==5
          assert workflow.count('actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02')==5
          assert 'actions/download-artifact@' not in workflow
          assert 'actions/cache@' not in workflow
          PY

      - name: Fresh focused contracts and canonical schema
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q tests/contract/test_b012_qwen_staged_recovery_topology.py
          python -m mstr_qualify validate

      - name: Fresh exact-head quality
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m ruff format --check colab/mstr_b012_qwen_raw_code_recovery_staged.py tests/contract/test_b012_qwen_staged_recovery_topology.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Repository formatter no-regression
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m ruff format --check --diff . > /tmp/head-format.diff 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          from pathlib import Path
          def paths(path):
              out=set()
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.startswith('--- '): out.add(line[4:].split(':cell ',1)[0])
              return out
          base=paths('/tmp/base-format.diff'); head=paths('/tmp/head-format.diff')
          assert base
          assert not (head-base), f'new formatter debt: {sorted(head-base)}'
          PY

      - name: Final mandatory live premerge guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/fix/b012-qwen-staged-recovery-topology | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==5' /tmp/pr-final.json >/dev/null
          gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" > /tmp/reviews-final.json
          jq -e 'all(.[]; .state != "CHANGES_REQUESTED")' /tmp/reviews-final.json >/dev/null
          echo 'PR194_MANDATORY_PREMERGE=PASS'
