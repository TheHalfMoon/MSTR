name: Build B019 teacher-rescue policy and contract

on:
  push:
    branches:
      - evidence/b019-build-2605846

permissions:
  contents: write

env:
  EXPECTED_MAIN: 2605846607fc98291ded4e53e9bb6bb6c3cf52a0
  TARGET_BRANCH: feat/000b-b019-teacher-rescue-policy

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b019-build-2605846
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact B019 entry state and generator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          python -m py_compile tools/evidence/build_b019_candidate.py
          git worktree add --detach /tmp/b019 "$EXPECTED_MAIN"
          test "$(git -C /tmp/b019 rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git -C /tmp/b019 status --porcelain)"
      - name: Materialize bounded teacher-rescue contract candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/evidence/build_b019_candidate.py /tmp/b019
          sed -i 's/[[:space:]]\+$//' \
            /tmp/b019/docs/data/TEACHER_RESCUE_POLICY.md \
            /tmp/b019/evidence/mstr-000b/B019-teacher-policy.md
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/b019/tests/integration/test_cli_offline.py')
          text = path.read_text(encoding='utf-8')
          old = '''        "mstr-self-alignment-generation-v0",
        "mstr-teacher-rescue-record-v0",
        "mstr-software-evolution-record-v0",
        "mstr-task-eligibility-v0",
        "mstr-task-node-v0",
'''
          new = '''        "mstr-self-alignment-generation-v0",
        "mstr-software-evolution-record-v0",
        "mstr-task-eligibility-v0",
        "mstr-task-node-v0",
        "mstr-teacher-rescue-record-v0",
'''
          if text.count(old) != 1:
              raise SystemExit('B019 CLI schema-order anchor mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git -C /tmp/b019 add -N .
          git -C /tmp/b019 diff --check
          expected=$(printf '%s\n' \
            docs/data/TEACHER_RESCUE_POLICY.md \
            evidence/mstr-000b/B019-teacher-policy.md \
            schemas/mstr-teacher-rescue-record-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-teacher-rescue-record-v0.schema.json \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/schemas.py \
            tests/contract/test_schemas.py \
            tests/contract/test_teacher_rescue_contract.py \
            tests/fixtures/schemas/invalid/mstr-teacher-rescue-record-v0.json \
            tests/fixtures/schemas/valid/mstr-teacher-rescue-record-v0.json \
            tests/integration/test_cli_offline.py | sort)
          actual=$(git -C /tmp/b019 diff --name-only | sort)
          printf 'B019_EXPECTED_SCOPE\n%s\n' "$expected"
          printf 'B019_ACTUAL_SCOPE\n%s\n' "$actual"
          test "$actual" = "$expected"
      - name: Install candidate development environment
        working-directory: /tmp/b019
        run: python -m pip install -e '.[dev]'
      - name: Focused B019 contract and registration gates
        working-directory: /tmp/b019
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/contract/test_teacher_rescue_contract.py \
            tests/contract/test_schemas.py \
            tests/integration/test_cli_offline.py
          python -m mstr_qualify validate \
            tests/fixtures/schemas/valid/mstr-teacher-rescue-record-v0.json
          if python -m mstr_qualify validate \
            tests/fixtures/schemas/invalid/mstr-teacher-rescue-record-v0.json; then
            exit 1
          fi
      - name: Frozen repository quality gates
        working-directory: /tmp/b019
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy
      - name: Prospective-main task and authority gates
        working-directory: /tmp/b019
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task eligible B019 > /tmp/b019.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json

          b19 = json.load(open('/tmp/b019.json'))
          b11 = json.load(open('/tmp/b011.json'))
          drift = json.load(open('/tmp/drift.json'))
          assert b19['eligible'] is True
          assert b19['state_consistency_result']['observed_state'] == 'PENDING'
          assert b19['authority_result']['required'] is False
          assert b19['authority_result']['satisfied'] is True
          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state'] == 'BLOCKED'
          assert b11['authority_result']['required'] is True
          assert b11['authority_result']['satisfied'] is False
          assert drift['status'] == 'clean' and drift['findings'] == []
          PY
      - name: Commit locally and fast-forward exact B019 candidate only after gates
        working-directory: /tmp/b019
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add \
            docs/data/TEACHER_RESCUE_POLICY.md \
            evidence/mstr-000b/B019-teacher-policy.md \
            schemas/mstr-teacher-rescue-record-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-teacher-rescue-record-v0.schema.json \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/schemas.py \
            tests/contract/test_schemas.py \
            tests/contract/test_teacher_rescue_contract.py \
            tests/fixtures/schemas/invalid/mstr-teacher-rescue-record-v0.json \
            tests/fixtures/schemas/valid/mstr-teacher-rescue-record-v0.json \
            tests/integration/test_cli_offline.py
          git commit -m "feat(mstr-000b): freeze B019 teacher rescue policy"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
