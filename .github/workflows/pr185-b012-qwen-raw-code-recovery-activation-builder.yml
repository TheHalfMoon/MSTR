name: PR185 B012 Qwen raw-code recovery activation builder

on:
  push:
    branches:
      - builder/pr185-b012-qwen-raw-code-recovery-activation-31549ee

permissions:
  contents: write
  actions: read

env:
  BASE_MAIN: 31549eeb78f2b3346c0915519cf5f4899ab47773
  POSTMERGE_RUN: "34161170022"
  POSTMERGE_EVIDENCE_HEAD: 3bdab353ee6aa7dd60510208b1e0f02545d3ebea
  BUILDER_BRANCH: builder/pr185-b012-qwen-raw-code-recovery-activation-31549ee
  BUILDER_WORKFLOW: .github/workflows/pr185-b012-qwen-raw-code-recovery-activation-builder.yml
  BUILDER_HELPER: tools/pr185_b012_qwen_activation_builder.py

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact builder branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify exact canonical entry and B012 eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          BUILDER_HEAD="$(git rev-parse HEAD)"
          [[ "$(git rev-parse origin/main)" == "$BASE_MAIN" ]]
          [[ "$(git merge-base "$BASE_MAIN" "$BUILDER_HEAD")" == "$BASE_MAIN" ]]
          git checkout -B main origin/main
          [[ "$(git rev-parse HEAD)" == "$BASE_MAIN" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligible.json
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          gate = json.loads(Path('/tmp/b012-eligible.json').read_text(encoding='utf-8'))
          assert gate['canonical_main'] == os.environ['BASE_MAIN']
          assert gate['eligible'] is True
          assert gate['authority_result']['required'] is True
          assert gate['authority_result']['satisfied'] is True
          assert gate['state_consistency_result']['observed_state'] == 'PENDING'
          assert all(item['satisfied'] for item in gate['prerequisite_results'])
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-b012-qwen-activation-builder',
          }
          request = urllib.request.Request(
              'https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/' + os.environ['POSTMERGE_RUN'],
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['POSTMERGE_EVIDENCE_HEAD']
          print('ACTIVATION_ENTRY=PASS')
          PY
          git checkout "$BUILDER_BRANCH"
          [[ "$(git rev-parse HEAD)" == "$BUILDER_HEAD" ]]

      - name: Materialize reviewed activation bytes
        run: |
          set -euo pipefail
          python "$BUILDER_HELPER"

      - name: Run focused construction verification
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_authority.py
          python -m py_compile colab/mstr_b012_qwen_raw_code_recovery.py tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m mstr_qualify validate
          python -m ruff check \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py

      - name: Commit only final activation package
        run: |
          set -euo pipefail
          rm -f "$BUILDER_WORKFLOW" "$BUILDER_HELPER"
          mapfile -t changed < <(git diff --name-only "$BASE_MAIN")
          expected=(
            ".github/workflows/b012-qwen-raw-code-recovery.yml"
            "artifacts/manifests/B012-executor-toolchain-binding.json"
            "artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json"
            "evidence/B012-qwen-raw-code-recovery-activation.md"
            "tests/contract/test_b012_qwen_raw_code_recovery.py"
          )
          [[ "${#changed[@]}" -eq 5 ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add -A
          git commit -m 'fix(b012): activate Qwen raw-code recovery'
          git push origin HEAD:"$BUILDER_BRANCH"
