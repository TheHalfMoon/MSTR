name: Postcloseout proof A015 canonical completion

on:
  push:
    branches:
      - evidence/a015-postcloseout-907ab88

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 907ab88722223cf53379bc98935f0641536a6907
          fetch-depth: 0
      - name: Verify exact A015 closeout merge identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "907ab88722223cf53379bc98935f0641536a6907"
          test "$(git rev-parse HEAD^{tree})" = "5779d1d277859e774ae5d5ad709f2d441c60ec5a"
          test "$(git rev-parse HEAD^1)" = "462a9d5ce32f01408a538d7fe55a585e432397a7"
          test "$(git rev-parse HEAD^2)" = "a7609b7c8227d14e8432774d4e4e1409ed3bab99"
          test "$(git rev-parse HEAD^2^{tree})" = "5779d1d277859e774ae5d5ad709f2d441c60ec5a"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "907ab88722223cf53379bc98935f0641536a6907"
          gh api repos/${GITHUB_REPOSITORY}/pulls/117 --jq '[.state,.merged,.head.sha,.base.sha,.merge_commit_sha] | @tsv' | grep -F $'closed\ttrue\ta7609b7c8227d14e8432774d4e4e1409ed3bab99\t462a9d5ce32f01408a538d7fe55a585e432397a7\t907ab88722223cf53379bc98935f0641536a6907'
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33431015462 --jq .conclusion)" = success
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33431362236 --jq .conclusion)" = success
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33430847495 --jq .conclusion)" = failure
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33430200851 --jq .conclusion)" = failure
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33430301950 --jq .conclusion)" = success
          python - <<'PY'
          from pathlib import Path
          tasks = Path('specs/001-agent-harness-verified-loop-foundation/tasks.md').read_text()
          evidence = Path('evidence/mstr-000a/A015-direction-to-done.md').read_text()
          assert '**State:** COMPLETE_CANONICAL' in evidence
          assert '- [x] **A014 ' in tasks
          assert '- [x] **A015 ' in tasks
          assert '- [ ] **A016 ' in tasks
          assert '33430200851 / FAILURE' in evidence
          assert '33430301950 / SUCCESS' in evidence
          assert 'B023_VERIFIER_HEALTH_EXECUTION = NOT_IMPLEMENTED_BY_A015' in evidence
          assert 'WEIGHT_CHANGING_TRAINING = NONE' in evidence
          PY

  quality:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 907ab88722223cf53379bc98935f0641536a6907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen repository quality gates on canonical closeout
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_direction_task_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src

  complete:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 907ab88722223cf53379bc98935f0641536a6907
          fetch-depth: 0
      - name: Final immutable A015 canonical completion recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "907ab88722223cf53379bc98935f0641536a6907"
          test "$(git rev-parse HEAD^{tree})" = "5779d1d277859e774ae5d5ad709f2d441c60ec5a"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "907ab88722223cf53379bc98935f0641536a6907"
          test "$(gh api repos/${GITHUB_REPOSITORY}/pulls/117 --jq .merge_commit_sha)" = "907ab88722223cf53379bc98935f0641536a6907"
