name: Build B007 tokenizer economics from 9b4e885

on:
  push:
    branches: [evidence/b007-build-9b4e885]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 9b4e885f215fd922ecf79ff9e15bdb1479396668
      TARGET_BRANCH: feat/000b-b007-tokenizer-economics-v2
      DONOR_BRANCH: feat/000b-b007-tokenizer-economics-protocol
      DONOR_HEAD: 6f9161632e327b0048ec68bf79627c0e69ba1c60
      OLD_MAIN: ead69ae26265b133c782ae8fd2795c126253a3b6
      ENTRY_RUN: '33147997037'
      ENTRY_JOB: '98773224654'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/000b-b007-tokenizer-economics-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-prove exact entry and donor identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH" "$DONOR_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$DONOR_BRANCH)" = "$DONOR_HEAD"
          git branch -f main "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B007 > /tmp/b007-entry.json
          python -m mstr_qualify task drift > /tmp/drift-entry.json
          python - <<'PY'
          import json, os
          b=json.load(open('/tmp/b007-entry.json'))
          d=json.load(open('/tmp/drift-entry.json'))
          main=os.environ['EXPECTED_MAIN']
          assert b['canonical_main']==main and b['task_id']=='B007',b
          assert b['eligible'] is True and b['reasons']==[],b
          assert b['state_consistency_result']['observed_state']=='PENDING',b
          assert d['canonical_main']==main and d['status']=='clean' and d['findings']==[],d
          print('B007_BUILDER_ENTRY=PASS')
          PY
      - name: Copy bounded donor content and rebind canonical main
        shell: bash
        run: |
          set -euo pipefail
          files=(
            benchmarks/fixtures/tokenizer-economics/B007-corpus.json
            benchmarks/manifests/B007-tokenizer-economics.json
            evidence/mstr-000b/B007-tokenizer-protocol.md
            specs/002-code-model-supremacy-foundation/contracts/b007-tokenizer-economics-corpus-v0.schema.json
            specs/002-code-model-supremacy-foundation/contracts/b007-tokenizer-economics-protocol-v0.schema.json
            tests/contract/test_b007_protocol_fail_closed.py
            tests/contract/test_b007_tokenizer_economics.py
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$DONOR_HEAD:$path" > "$path"
          done
          python - <<'PY'
          from pathlib import Path
          import json, os
          old=os.environ['OLD_MAIN']; new=os.environ['EXPECTED_MAIN']
          manifest=Path('benchmarks/manifests/B007-tokenizer-economics.json')
          data=json.loads(manifest.read_text())
          assert data['canonical_main_sha']==old
          data['canonical_main_sha']=new
          manifest.write_text(json.dumps(data,separators=(',',':'),ensure_ascii=False)+'\n')
          schema=Path('specs/002-code-model-supremacy-foundation/contracts/b007-tokenizer-economics-protocol-v0.schema.json')
          text=schema.read_text()
          assert text.count(old)==1
          schema.write_text(text.replace(old,new,1))
          ev=Path('evidence/mstr-000b/B007-tokenizer-protocol.md')
          text=ev.read_text()
          text=text.replace(f'**Canonical main at execution:** `{old}`',f'**Canonical main at execution:** `{new}`',1)
          text=text.replace('## Review history','## Donor review history (historical, non-authoritative)',1)
          insertion=(
              '\n## Current execution binding\n\n'
              f'B007 current execution was authorized by production exact-main eligibility run `{os.environ["ENTRY_RUN"]}` '
              f'(job `{os.environ["ENTRY_JOB"]}`) on canonical main `{new}` with `eligible=true`, `PENDING` state, and clean canonical drift.\n\n'
              f'The seven-file content was imported from historical donor head `{os.environ["DONOR_HEAD"]}` only as source material. '
              'No donor review, validation, merge-readiness, or canonical-state claim is inherited. All current claims must be re-proved on a fresh head derived from the canonical main above.\n'
          )
          marker='B007 freezes deterministic corpus bytes and tokenizer-measurement semantics only.'
          idx=text.index(marker)
          paragraph_end=text.index('\n\n',idx)
          text=text[:paragraph_end]+insertion+text[paragraph_end:]
          ev.write_text(text)
          print('B007_DONOR_CONTENT_REBOUND=PASS')
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            benchmarks/fixtures/tokenizer-economics/B007-corpus.json \
            benchmarks/manifests/B007-tokenizer-economics.json \
            evidence/mstr-000b/B007-tokenizer-protocol.md \
            specs/002-code-model-supremacy-foundation/contracts/b007-tokenizer-economics-corpus-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/b007-tokenizer-economics-protocol-v0.schema.json \
            tests/contract/test_b007_protocol_fail_closed.py \
            tests/contract/test_b007_tokenizer_economics.py | sort)"
          test "$changed" = "$expected"
          ! git diff --name-only | grep -Eq '^(src/|artifacts/candidates/|configs/task-gate/|specs/002-code-model-supremacy-foundation/tasks.md$)'
      - name: Verify corpus integrity and B007 protocol
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_b007_tokenizer_economics.py tests/contract/test_b007_protocol_fail_closed.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          c=Path('benchmarks/fixtures/tokenizer-economics/B007-corpus.json')
          raw=c.read_bytes(); payload=json.loads(raw)
          m=json.loads(Path('benchmarks/manifests/B007-tokenizer-economics.json').read_text())
          assert len(raw)==10951==m['corpus']['fixture_file_bytes']
          assert hashlib.sha256(raw).hexdigest()=='425456fa39ae5dc67214b4871b1ac948c63bf9f0ae72a1407a5908d4a5c9e1d6'
          assert len(payload['entries'])==34
          assert m['canonical_main_sha']=='9b4e885f215fd922ecf79ff9e15bdb1479396668'
          assert m['authority']['model_inference_authorized'] is False
          assert m['authority']['model_weight_access_authorized'] is False
          assert m['authority']['paid_compute_authorized'] is False
          assert m['authority']['large_dataset_ingestion_authorized'] is False
          assert m['authority']['tokenizer_measurement_authorized_by_b007'] is False
          print('B007_CORPUS_PROTOCOL_INTEGRITY=PASS')
          PY
      - name: Frozen repository gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
      - name: Finalize current evidence and guarded push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, re
          ev=Path('evidence/mstr-000b/B007-tokenizer-protocol.md')
          text=ev.read_text()
          pattern=re.compile(r'## Validation truth\n.*?(?=\n## Authority boundary)',re.S)
          replacement=f'''## Current validation truth\n\nFresh validation was executed on the current canonical-main-derived B007 worktree before commit. Historical donor validation/review claims are not used as authority.\n\n```text\nENTRY_ELIGIBILITY_RUN = {os.environ['ENTRY_RUN']}\nENTRY_ELIGIBILITY_JOB = {os.environ['ENTRY_JOB']}\nBUILDER_RUN = {os.environ['GITHUB_RUN_ID']}\nCANONICAL_MAIN = {os.environ['EXPECTED_MAIN']}\nDONOR_HEAD = {os.environ['DONOR_HEAD']}\nB007_TARGETED_TESTS = PASS\nFULL_PYTEST = PASS\nRUFF = PASS\nMYPY = PASS\nVALIDATE = PASS\n````\n\nExact counts and final head remain subject to separate exact-head qualification after this commit.\n'''
          text,n=pattern.subn(replacement,text,count=1)
          assert n==1,n
          ev.write_text(text)
          PY
          # Correct the deliberate fence terminator to normal Markdown and reject whitespace errors.
          python - <<'PY'
          from pathlib import Path
          p=Path('evidence/mstr-000b/B007-tokenizer-protocol.md')
          s=p.read_text().replace('````\n\nExact counts','```\n\nExact counts',1)
          p.write_text(s.rstrip()+'\n')
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            benchmarks/fixtures/tokenizer-economics/B007-corpus.json \
            benchmarks/manifests/B007-tokenizer-economics.json \
            evidence/mstr-000b/B007-tokenizer-protocol.md \
            specs/002-code-model-supremacy-foundation/contracts/b007-tokenizer-economics-corpus-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/b007-tokenizer-economics-protocol-v0.schema.json \
            tests/contract/test_b007_protocol_fail_closed.py \
            tests/contract/test_b007_tokenizer_economics.py | sort)"
          test "$changed" = "$expected"
          git fetch origin main "$TARGET_BRANCH" "$DONOR_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$DONOR_BRANCH)" = "$DONOR_HEAD"
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add -- "${changed//$'\n'/ }"
          # Use -A after exact containment assertion so all seven new files are staged reliably.
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m 'docs(mstr-000b): freeze B007 tokenizer economics protocol'
          head="$(git rev-parse HEAD)"
          git fetch origin main "$TARGET_BRANCH" "$DONOR_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$DONOR_BRANCH)" = "$DONOR_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "B007_IMPLEMENTATION_HEAD=$head"
          echo "B007_BUILDER_RUN=$GITHUB_RUN_ID"
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'TOKENIZER_ARTIFACT_DOWNLOAD=NONE'
          echo 'TOKENIZER_MEASUREMENT=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'PAID_COMPUTE=NONE'
          echo 'B008_MATERIAL_EXECUTION=NOT_STARTED'
