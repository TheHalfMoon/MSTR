name: PR180 T031 replay failure postmerge

on:
  push:
    branches:
      - evidence/pr180-t031-replay-failure-postmerge-d9fbf07

permissions:
  contents: read

jobs:
  postmerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MERGE_SHA: d9fbf070c425b3da378655cbbd8f656d1a8b7b90
      MERGE_TREE: 4100d850d1f74e61c7bcf1122d084d676855468b
      OLD_MAIN: 61bacde1ee21831080accc8a226433562a6aeaf9
      SUBJECT_SHA: 2dba6f6d34691ab7686a33de28724aeea67833e3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove canonical merge identity and topology
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$MERGE_TREE" ]]
          mapfile -t parents < <(git show -s --format='%P' HEAD | tr ' ' '\n')
          [[ "${#parents[@]}" -eq 2 ]]
          [[ "${parents[0]}" == "$OLD_MAIN" ]]
          [[ "${parents[1]}" == "$SUBJECT_SHA" ]]

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify canonical evidence and repository quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_t031_59_wheel_replay_failure.py \
            tests/contract/test_t031_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check tests/contract/test_t031_59_wheel_replay_failure.py
          python -m mypy src/mstr_qualify

      - name: Final live-main guard
        shell: bash
        run: |
          set -euo pipefail
          live_main="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          [[ "$live_main" == "$MERGE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]]
          echo 'PR180_POSTMERGE=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
