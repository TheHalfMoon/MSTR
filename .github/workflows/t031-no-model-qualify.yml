name: T031 no-model exact-head qualification

on:
  push:
    branches:
      - qualify/t031-no-model-0b25193c
    paths:
      - .github/workflows/t031-no-model-qualify.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0b25193c160a16750294977f225dca421bc5d211
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Verify exact no-model contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0b25193c160a16750294977f225dca421bc5d211"
          python -m compileall -q \
            colab/mstr_executor_toolchain.py \
            colab/mstr_t031_execute.py \
            tests/contract/test_t031_executor_binding.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tests/contract/test_t031_executor_binding.py")
          spec = importlib.util.spec_from_file_location("t031_contract", path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load T031 contract tests")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          names = sorted(name for name in vars(module) if name.startswith("test_"))
          if not names:
              raise SystemExit("no T031 contract tests discovered")
          for name in names:
              getattr(module, name)()
          print(f"T031_NO_MODEL_CONTRACT_TESTS=PASS count={len(names)}")
          PY
          git diff --check 891af2215a2244a6a0912d49d782f42bcc38b6ef...0b25193c160a16750294977f225dca421bc5d211
          echo "T031_MODEL_ACCESS=NONE"
          echo "T031_EXACT_HEAD_QUALIFICATION=PASS"
