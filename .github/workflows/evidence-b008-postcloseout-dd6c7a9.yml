name: Verify B008 canonical closeout

on:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: dd6c7a9b163f1f34e6cc3570da234078d39f4fce
      EXPECTED_PREVIOUS_MAIN: 07762204ab126c0fccf9ca55a8b572bd6368d8bc
      EXPECTED_CLOSEOUT_HEAD: 3e59f721b472a13c220554e5fcba1f7056f4cb51
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dd6c7a9b163f1f34e6cc3570da234078d39f4fce
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bind exact signed closeout merge identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PREVIOUS_MAIN"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_CLOSEOUT_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B008_POSTCLOSEOUT_MERGE_IDENTITY=PASS'

      - name: Prove production B008 terminal, B009 eligible, and drift clean
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git branch -f main "$EXPECTED_MAIN"
          if python -m mstr_qualify task eligible B008 > /tmp/b008.json; then
            echo 'B008 unexpectedly execution-eligible after canonical closeout' >&2
            exit 1
          fi
          python -m mstr_qualify task eligible B009 > /tmp/b009.json
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ['EXPECTED_MAIN']
          b008 = json.load(open('/tmp/b008.json'))
          b009 = json.load(open('/tmp/b009.json'))
          drift = json.load(open('/tmp/drift.json'))
          assert b008['canonical_main'] == expected
          assert b008['eligible'] is False
          assert b008['state_consistency_result']['observed_state'] == 'COMPLETE_CANONICAL'
          assert b008['state_consistency_result']['satisfied'] is True
          assert 'task.already_terminal' in b008['reasons']
          assert b009['canonical_main'] == expected
          assert b009['eligible'] is True and b009['reasons'] == []
          assert b009['state_consistency_result']['observed_state'] == 'PENDING'
          predecessor = b009['prerequisite_results'][0]
          assert predecessor['task_id'] == 'B008'
          assert predecessor['observed_state'] == 'COMPLETE_CANONICAL'
          assert predecessor['evidence_present'] is True
          assert predecessor['satisfied'] is True
          assert drift['canonical_main'] == expected
          assert drift['status'] == 'clean' and drift['findings'] == []
          assert len(list(Path('artifacts/results/tokenizer/B008').glob('*.json'))) == 10
          print('B008_POSTCLOSEOUT_PRODUCTION_STATE=PASS')
          print('B009_POSTCLOSEOUT_ELIGIBLE=true')
          PY

      - name: Re-run canonical closeout regressions and frozen gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
          git diff --check "$EXPECTED_PREVIOUS_MAIN...$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B008_POSTCLOSEOUT_FROZEN_GATES=PASS'

      - name: Recheck canonical main is still exact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B008_CANONICAL_MAIN=$EXPECTED_MAIN"
          echo 'B008_COMPLETE_CANONICAL=YES'
          echo 'B009_ELIGIBILITY=PROVEN_ON_EXACT_MAIN'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'MODEL_INFERENCE=NONE'
          echo 'PAID_COMPUTE=NONE'
          echo 'TRAINING=NONE'
