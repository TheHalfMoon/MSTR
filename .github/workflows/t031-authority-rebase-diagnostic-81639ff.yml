name: T031 authority exact-main diagnostic repair builder

on:
  push:
    branches:
      - builder/t031-authority-rebase-diagnostic-81639ff

permissions:
  contents: write

env:
  NEW_MAIN: 81639ff15e31d7f6a3b8aeaa7ceae4b80b009feb
  OLD_T031_HEAD: 1509ac18f00e700b4d9ed3dba518f7b335466c9d
  OLD_T031_BRANCH: governance/t031-founder-authority-exact-t029-candidates
  TARGET_BRANCH: governance/t031-founder-authority-exact-t029-candidates-v2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact post-B012 main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NEW_MAIN }}
          fetch-depth: 0

      - name: Verify exact source and target absence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEW_MAIN"
          git fetch origin "$OLD_T031_BRANCH" --quiet
          test "$(git rev-parse "origin/$OLD_T031_BRANCH")" = "$OLD_T031_HEAD"
          test -z "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")"

      - name: Re-materialize and rebind exact T031 authority
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json
            artifacts/manifests/T031-local-measurement-execution-envelope.json
            tests/contract/test_t031_authority.py
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$OLD_T031_HEAD:$path" > "$path"
          done

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          new_main = '81639ff15e31d7f6a3b8aeaa7ceae4b80b009feb'
          old_main = 'e5e47644fb7122cbb47b43cdf13d072f82ebfdf7'
          envelope_path = Path('artifacts/manifests/T031-local-measurement-execution-envelope.json')
          authority_path = Path('artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json')

          envelope = json.loads(envelope_path.read_text(encoding='utf-8'))
          if envelope.get('canonical_entry_main') != old_main:
              raise AssertionError(f"canonical_entry_before={envelope.get('canonical_entry_main')!r}")
          envelope['canonical_entry_main'] = new_main
          envelope_path.write_text(json.dumps(envelope, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          binding = authority['scope']['bounded_execution_envelope']
          if binding.get('path') != str(envelope_path):
              raise AssertionError(f"binding_path={binding.get('path')!r}")
          binding['sha256'] = hashlib.sha256(envelope_path.read_bytes()).hexdigest()
          authority_path.write_text(json.dumps(authority, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Diagnose and verify bounded T031 authority semantics
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json artifacts/manifests/T031-local-measurement-execution-envelope.json tests/contract/test_t031_authority.py | sort)"
          if [ "$changed" != "$expected" ]; then
            printf 'CHANGED_FILES_MISMATCH\nexpected:\n%s\nobserved:\n%s\n' "$expected" "$changed"
            exit 1
          fi
          git diff --check

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          authority_path = Path('artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json')
          envelope_path = Path('artifacts/manifests/T031-local-measurement-execution-envelope.json')
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          envelope = json.loads(envelope_path.read_text(encoding='utf-8'))
          scope = authority['scope']
          exact_ids = [
              'granite-4.1-3b',
              'ministral-3-3b',
              'qwen2.5-coder-1.5b',
              'qwen3-4b',
              'qwen3.5-2b',
              'qwen3.5-4b',
              'smollm3-3b',
              'yi-coder-1.5b',
          ]

          checks = [
              ('authority_id', authority.get('authority_id') == 'T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION', authority.get('authority_id')),
              ('task_id', authority.get('task_id') == 'T031', authority.get('task_id')),
              ('status', authority.get('status') == 'AUTHORIZED_CANONICAL', authority.get('status')),
              ('decision', scope.get('decision') == 'FOUNDER_T031_LOCAL_MEASUREMENT_DECISION=AUTHORIZE_EXACT_T029_CANDIDATES', scope.get('decision')),
              ('decision_surface', scope.get('decision_surface') == {'issue': 167, 'comment_id': 5553875809}, scope.get('decision_surface')),
              ('authority_candidate_ids', scope.get('candidate_ids') == exact_ids, scope.get('candidate_ids')),
              ('envelope_candidate_ids', envelope.get('candidate_ids') == exact_ids, envelope.get('candidate_ids')),
              ('canonical_entry_main', envelope.get('canonical_entry_main') == '81639ff15e31d7f6a3b8aeaa7ceae4b80b009feb', envelope.get('canonical_entry_main')),
              ('envelope_hash', scope['bounded_execution_envelope'].get('sha256') == hashlib.sha256(envelope_path.read_bytes()).hexdigest(), scope['bounded_execution_envelope'].get('sha256')),
              ('b010_b012_candidates', scope.get('b010_b012_candidates') is False, scope.get('b010_b012_candidates')),
              ('t032_execution', scope.get('t032_execution') is False, scope.get('t032_execution')),
              ('t033_execution', scope.get('t033_execution') is False, scope.get('t033_execution')),
              ('t034_admission_decision', scope.get('t034_admission_decision') is False, scope.get('t034_admission_decision')),
              ('training', scope.get('training') is False, scope.get('training')),
              ('weight_changing_training', scope.get('weight_changing_training') is False, scope.get('weight_changing_training')),
              ('dispatch_state', envelope.get('dispatch_state') == 'BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING', envelope.get('dispatch_state')),
              ('toolchain_state', envelope.get('toolchain_provisioning', {}).get('state') == 'BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING', envelope.get('toolchain_provisioning')),
              ('paid_cost_usd', envelope.get('resource_ceiling', {}).get('paid_cost_usd') == 0.0, envelope.get('resource_ceiling')),
              ('gpu_layers', envelope.get('resource_ceiling', {}).get('gpu_layers') == 0, envelope.get('resource_ceiling')),
              ('founder_machine_model_binaries', envelope.get('runner_envelope', {}).get('founder_machine_model_binaries') == 0, envelope.get('runner_envelope')),
              ('git_model_binaries', envelope.get('runner_envelope', {}).get('git_model_binaries') == 0, envelope.get('runner_envelope')),
          ]
          failed = [(name, observed) for name, passed, observed in checks if not passed]
          if failed:
              for name, observed in failed:
                  print(f'T031_REBASE_CHECK_FAIL={name} observed={observed!r}')
              raise SystemExit(1)

          assert set(envelope['prohibited_operations']) >= {
              'B010_OR_B012_CANDIDATES',
              'NEW_CANDIDATES',
              'CANDIDATE_REVISION_OR_FILE_EXPANSION',
              'T032_EXECUTION',
              'T033_EXECUTION',
              'T034_ADMISSION_DECISION',
              'WEIGHT_CHANGING_TRAINING',
              'TRAINING',
              'PAID_COMPUTE',
              'PAID_MODEL_API',
              'GATED_TERMS_ACCEPTANCE',
              'ACCOUNT_REQUIRED_MODEL_ACCESS',
              'PRODUCTION_RELEASE',
              'GIT_MODEL_BINARIES',
              'FOUNDER_MACHINE_MODEL_BINARIES',
          }
          assert envelope['measurement_contract']['contexts'] == [4096, 8192, 16384]
          assert envelope['q4_identity']['llama_cpp_commit'] == 'fc35562ba46fbbf8e30cac85edbb39642c37d248'
          assert envelope['runtime_identity']['llama_cpp_commit'] == '3173a56471c1753650cd806694145ffd6dcace67'
          assert envelope['runtime_identity']['device'] == 'none'
          assert envelope['runtime_identity']['gpu_layers'] == 0
          print('T031_REBASE_SEMANTICS=PASS')
          PY

      - name: Install repository quality dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused T031 authority regression
        run: python -m pytest -q tests/contract/test_t031_authority.py

      - name: Run offline validation and full repository quality
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json$' | grep -v '^ M artifacts/manifests/T031-local-measurement-execution-envelope.json$' || true)"

      - name: Publish one-commit exact-main T031 authority candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEW_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json \
            artifacts/manifests/T031-local-measurement-execution-envelope.json \
            tests/contract/test_t031_authority.py
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'governance(t031): rebind exact T029 measurement authority'
          test "$(git rev-parse HEAD^)" = "$NEW_MAIN"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
