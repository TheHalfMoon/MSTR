name: B023 fenced-safe binding adversarial review

on:
  push:
    branches:
      - evidence/b023-binding-fenced-safe-review-9466ed1

permissions:
  contents: read

env:
  BASE_SHA: db12d1467bb81185a9affffb4d470626ceceddfa
  TARGET_SHA: 9466ed1b85ee4585a54c09e0d166addd5121ddcf
  TARGET_TREE: 98e253d465db97154de451779309c119249feccb
  TARGET_BRANCH: fix/b023-cross-workstream-bindings-fenced-safe-atomic-20260901
  QUALIFICATION_RUN: '33512193600'

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify exact reviewed head and successful qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          python - <<'PY'
          import json
          import urllib.request
          run = json.load(urllib.request.urlopen('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/33512193600'))
          assert run['status'] == 'completed', run
          assert run['conclusion'] == 'success', run
          PY
      - name: Verify exact scope and pending authority boundary
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' configs/task-gate/mstr-000b.json evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py | sort > /tmp/expected
          git diff --name-only "$BASE_SHA...$TARGET_SHA" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(grep '^\.github/workflows/' /tmp/actual || true)"
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md
      - name: Install reviewed candidate
        run: python -m pip install -e '.[dev]'
      - name: Adversarial fenced-Markdown parser probes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from mstr_qualify.task_gate import _markdown_without_fenced_code

          cases = [
              ('before\n```markdown\n**Task:** `MSTR-000A / A006`\n```\nafter\n', 'before\nafter\n'),
              ('before\n~~~text\n- [x] **A006 Example.**\n~~~\nafter\n', 'before\nafter\n'),
              ('before\r\n```markdown\r\ninside\r\n```\r\nafter\r\n', 'before\r\nafter\r\n'),
              ('before\n````markdown\ninside\n```\nstill-inside\n````\nafter\n', 'before\nafter\n'),
              ('before\n```markdown\ninside\n~~~\nstill-inside\n```\nafter\n', 'before\nafter\n'),
              ('before\n```markdown\ninside\nunclosed\n', 'before\n'),
              ('before\n    ```not-a-fence\nafter\n', 'before\n    ```not-a-fence\nafter\n'),
          ]
          for raw, expected in cases:
              observed = _markdown_without_fenced_code(raw)
              assert observed == expected, (raw, expected, observed)
          print('FENCED_MARKDOWN_ADVERSARIAL_PROBES=PASS')
          PY
      - name: External prerequisite regression battery
        run: >-
          python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
          -k 'external_prerequisite or b023'
      - name: Prospective exact-candidate eligibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from mstr_qualify.task_gate import evaluate_task_snapshot
          result = evaluate_task_snapshot('B023', canonical_main='9466ed1b85ee4585a54c09e0d166addd5121ddcf')
          assert result['eligible'] is True, result
          prerequisites = {row['task_id']: row for row in result['prerequisite_results']}
          assert set(prerequisites) == {'A006', 'A014', 'B002', 'B022'}, prerequisites
          for task_id in ('A006', 'A014', 'B002', 'B022'):
              assert prerequisites[task_id]['satisfied'] is True, prerequisites[task_id]
          print('B023_PROSPECTIVE_ELIGIBILITY_REVIEW=PASS')
          PY
      - name: Re-run frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
      - name: Final exact-head immutability review
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          echo 'SUPPLEMENTAL_ADVERSARIAL_REVIEW=PASS'
