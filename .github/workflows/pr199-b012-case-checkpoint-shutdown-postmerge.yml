name: PR199 B012 case-checkpoint shutdown postmerge

on:
  push:
    branches:
      - evidence/pr199-b012-case-checkpoint-shutdown-postmerge-9ff1680

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 145be15a32448d00fada0e2d9bf736f265c942a1
      SUBJECT: e02653b8b3b87100a9a8a5b5122a15636634c52b
      MERGE: 9ff1680c21be366f11133a4ba2e68ebe0fc1e53b
      PR: '199'
      QUAL_RUN: '34273248053'
      QUAL_HEAD: 54c4bbb019877433879a861adbeb8a6e3681f3d7
      REVIEW_RUN: '34273792833'
      REVIEW_HEAD: c346970efe2b24cbe3e266eb6fbc032edc3e64d5
      PREMERGE_RUN: '34274047030'
      PREMERGE_HEAD: d557f27780f29e9efe7c17a85890e3827ddf7bef
      INCIDENT_SHA256: e03d0030cb500a2fc97ec3a2f66c17b463028582643d9169c7be6994bc955152
      BLOCKED_STATUS: BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove canonical merge identity and complete evidence chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$MERGE"
          test "$(git rev-parse origin/main)" = "$MERGE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE"
          test "$(git show -s --format=%T HEAD)" = "dbe5f46cc4f8ef3179f8ea1180f63ee5d5929cfb"
          test "$(git show -s --format=%P HEAD)" = "$BASE $SUBJECT"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg merge "$MERGE" --arg head "$SUBJECT" '.state=="closed" and .merged==true and .merge_commit_sha==$merge and .head.sha==$head' /tmp/pr.json >/dev/null
          for spec in "$QUAL_RUN:$QUAL_HEAD" "$REVIEW_RUN:$REVIEW_HEAD" "$PREMERGE_RUN:$PREMERGE_HEAD"; do
            run=${spec%%:*}
            head=${spec#*:}
            gh api "repos/$REPO/actions/runs/$run" > "/tmp/run-$run.json"
            jq -e --arg h "$head" '.status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha==$h' "/tmp/run-$run.json" >/dev/null
          done

      - name: Bind local canonical main ref for task-gate semantics
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$MERGE"
          test "$(git rev-parse refs/heads/main)" = "$MERGE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE"

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Prove canonical incident hashes checkpoints and fail-closed binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root=Path('artifacts/results/equivalent/B012')
          incident=root/'failures/B012-qwen3.5-0.8b-control-raw-code-case-checkpoint-recovery-run-34265475666.json'
          cp=root/'checkpoints/34265475666'
          paths={
            'init': cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-01-init.json',
            'source': cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-02-source.json',
            'quantize': cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-03-quantize.json',
            'state': cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json',
          }
          expected={
            'init':'fabc44925fdb8243d5eeca856b6e9b5fd83db54c4dc9cca27967409382721fb4',
            'source':'38f9693bd55f77f8634ce01dec0e932e990790735399ade55f0a4230bdbf585e',
            'quantize':'ed15864153a8e4b26fffca5298dcbd80763e9c7edd0106845555b8325b079205',
            'state':'e5accce8487556a649db0c147a3c5876c0b31f8c1c0b334e48510f3680f58733',
          }
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha(incident)==os.environ['INCIDENT_SHA256']
          for key,path in paths.items(): assert sha(path)==expected[key], key
          i=json.loads(incident.read_text(encoding='utf-8'))
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text(encoding='utf-8'))
          assert i['run_id']==34265475666 and i['job_id']==102193622602 and i['run_attempt']==1
          assert i['canonical_main_at_start']==os.environ['BASE']
          assert i['failure_classification']=='B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_PARTIAL_DURABLE_PROGRESS_RAW_CODE_UNPROVEN'
          assert i['durable_stages']==['init','source','quantize']
          assert i['durable_raw_code_case_count']==0
          assert i['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert i['candidate_execution_completion']=='NOT_PROVEN'
          assert i['candidate_admission_decision']=='NONE'
          assert i['model_quality_verdict']=='NONE'
          assert i['ephemeral_cleanup_completion']=='NOT_PROVEN'
          assert i['separate_topology_repair_required'] is True
          for key in ('training','paid_model_api','candidate_expansion','revision_or_file_expansion','retry_authority_created','external_dispatch_authority_created','same_case_checkpoint_topology_redispatch_authorized_by_this_evidence','cross_run_resume_authority_created'):
              assert i[key] is False, key
          assert b['status']==os.environ['BLOCKED_STATUS']
          s=b['qwen_raw_code_case_checkpoint_runner_shutdown']
          assert s['run_id']==34265475666 and s['failure_evidence_sha256']==os.environ['INCIDENT_SHA256']
          assert s['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert s['model_quality_verdict']=='NONE'
          assert s['candidate_execution_completion']=='NOT_PROVEN'
          assert s['ephemeral_cleanup_completion']=='NOT_PROVEN'
          for key in ('retry_authority_created','external_dispatch_authority_created','same_case_checkpoint_topology_redispatch_authorized_by_this_evidence','cross_run_resume_authority_created'):
              assert s[key] is False, key
          print('CANONICAL_INCIDENT_AND_BINDING=PASS')
          PY

      - name: Reprove exact-main B012 eligibility and Founder authority remains bounded
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012' and d['canonical_main']==os.environ['MERGE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['state_consistency_result']['satisfied'] is True
          assert d['supersession_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL' and a['task_id']=='B012'
          assert a['cost_resource_ceiling']['limits'][0]=={'max':0.0,'resource':'cost','unit':'USD'}
          assert a['scope']['candidate_ids']==['mellum-4b','qwen3.5-0.8b-control']
          for key in ('new_candidate_access','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert a['scope'][key] is False, key
          print('B012_POSTMERGE_ELIGIBILITY_AUTHORITY=PASS')
          PY

      - name: Prove storage boundary
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE...$SUBJECT" | grep -Ei '\.(gguf|safetensors|bin|onnx|pt|pth|ckpt|exe|dll|so|dylib)$'; then
            echo 'unexpected binary-like canonical subject path' >&2
            exit 1
          fi
          test -z "$(git diff --name-only "$BASE...$SUBJECT" -- '.github/workflows/**' 'colab/**' 'src/**' 'artifacts/authorities/**')"
          echo 'STORAGE_AND_EXECUTION_BOUNDARY=PASS'

      - name: Postmerge repository quality
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final canonical-main guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE"
          test "$(git rev-parse refs/heads/main)" = "$MERGE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg merge "$MERGE" --arg head "$SUBJECT" '.merged==true and .merge_commit_sha==$merge and .head.sha==$head' /tmp/pr-final.json >/dev/null
          echo 'PR199_POSTMERGE=PASS'
