name: Qualify exact B009 canonical closeout head

on:
  push:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 4fdb6966c085819e69823136fb5e2cd8c56ba58f
      CLOSEOUT_HEAD: 1b393c045f0a22853fb4f4835b27bcaa255bb1d6
      TARGET_BRANCH: docs/000b-b009-canonicalize
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1b393c045f0a22853fb4f4835b27bcaa255bb1d6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bind exact base head parent and five-file scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$CLOSEOUT_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$CLOSEOUT_HEAD"
          expected=$(printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B009-compatibility.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN...$CLOSEOUT_HEAD" | sort)
          test "$actual" = "$expected"
          git diff --check "$EXPECTED_MAIN...$CLOSEOUT_HEAD"
          git diff --quiet "$EXPECTED_MAIN...$CLOSEOUT_HEAD" -- artifacts/decisions/B009-training-runtime-compatibility.json
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B009_CLOSEOUT_IDENTITY_SCOPE=PASS'

      - name: Prove exact closeout semantics and parser identity
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git branch -f main "$CLOSEOUT_HEAD"
          git update-ref refs/remotes/origin/main "$CLOSEOUT_HEAD"
          if python -m mstr_qualify task eligible B009 > /tmp/b009.json; then
            echo 'B009 unexpectedly execution-eligible after closeout' >&2
            exit 1
          fi
          python -m mstr_qualify task eligible B010 > /tmp/b010.json
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json
          from pathlib import Path
          import os

          head = os.environ['CLOSEOUT_HEAD']
          b009 = json.load(open('/tmp/b009.json'))
          b010 = json.load(open('/tmp/b010.json'))
          drift = json.load(open('/tmp/drift.json'))
          assert b009['canonical_main'] == head
          assert b009['eligible'] is False
          assert b009['state_consistency_result']['observed_state'] == 'COMPLETE_CANONICAL'
          assert b009['state_consistency_result']['satisfied'] is True
          assert 'task.already_terminal' in b009['reasons']
          assert b010['canonical_main'] == head
          assert b010['eligible'] is True and b010['reasons'] == []
          assert b010['state_consistency_result']['observed_state'] == 'PENDING'
          predecessor = b010['prerequisite_results'][0]
          assert predecessor['task_id'] == 'B009' and predecessor['satisfied'] is True
          assert drift['canonical_main'] == head
          assert drift['status'] == 'clean' and drift['findings'] == []

          catalog = json.loads(Path('configs/task-gate/mstr-000b.json').read_text())
          b009_node = catalog['tasks']['B009']
          assert b009_node['canonical_state'] == 'COMPLETE_CANONICAL'
          assert b009_node['outputs'] == ['artifacts/decisions/B009-training-runtime-compatibility.json']
          assert b009_node['closeout_rule']['require_all_outputs'] is True

          tasks = Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text()
          assert '- [x] **B009 Freeze candidate trainability / conversion / runtime compatibility matrix.**' in tasks
          assert 'Canonical implementation: PR #63 / final head `88ebc70e12dcc117ba99bb10bb687eed1a220a7b` / merge `4fdb6966c085819e69823136fb5e2cd8c56ba58f`.' in tasks

          evidence = Path('evidence/mstr-000b/B009-compatibility.md').read_text()
          required = [
              '**Task:** B009',
              '**State:** COMPLETE_CANONICAL',
              '**Implementation PR:** `#63`',
              '**Final implementation head:** `88ebc70e12dcc117ba99bb10bb687eed1a220a7b`',
              '**Canonical implementation merge:** `4fdb6966c085819e69823136fb5e2cd8c56ba58f`',
              'ENTRY_GATE_TASK = B009',
              'MODEL_WEIGHT_ACCESS = NONE',
              'TRAINING_EXECUTION = NONE',
          ]
          assert all(item in evidence for item in required)
          print('B009_CLOSEOUT_SEMANTICS=PASS')
          PY

      - name: Run exact-head frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q tests/contract/test_b009_training_runtime_compatibility.py
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
          git diff --check "$EXPECTED_MAIN...$CLOSEOUT_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B009_CLOSEOUT_EXACT_HEAD_GATES=PASS'

      - name: Restore live truth and final ref recheck
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$CLOSEOUT_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$CLOSEOUT_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B009_CLOSEOUT_EXACT_HEAD_QUALIFICATION=PASS'
