name: Verify B018 canonical closeout post-merge

on:
  push:
    branches:
      - evidence/b018-postcloseout-2605846

permissions:
  contents: read

env:
  EXPECTED_MAIN: 2605846607fc98291ded4e53e9bb6bb6c3cf52a0
  EXPECTED_PARENT_MAIN: 7e4996e92128e4e02ec6dbcf6ed29eed2b753838
  EXPECTED_CLOSEOUT_HEAD: 7481a10a2394a7f7d81db453327f318615bb1ac6

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bind canonical closeout merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT_MAIN"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_CLOSEOUT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$EXPECTED_CLOSEOUT_HEAD^{tree}")"

  task_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Verify B018 terminal state, successor frontier, and drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          if python -m mstr_qualify task eligible B018 > /tmp/b018.json; then exit 1; fi
          python -m mstr_qualify task eligible B019 > /tmp/b019.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          python -m mstr_qualify task eligible B020 > /tmp/b020.json
          python -m mstr_qualify task eligible B022 > /tmp/b022.json
          python -m mstr_qualify task eligible B025 > /tmp/b025.json
          python -m mstr_qualify task drift > /tmp/drift.json
          cat /tmp/drift.json
          python - <<'PY'
          import json

          b18 = json.load(open('/tmp/b018.json'))
          b19 = json.load(open('/tmp/b019.json'))
          b11 = json.load(open('/tmp/b011.json'))
          b20 = json.load(open('/tmp/b020.json'))
          b22 = json.load(open('/tmp/b022.json'))
          b25 = json.load(open('/tmp/b025.json'))
          drift = json.load(open('/tmp/drift.json'))

          assert b18['canonical_main'] == '2605846607fc98291ded4e53e9bb6bb6c3cf52a0'
          assert b18['eligible'] is False
          assert b18['state_consistency_result']['observed_state'] == 'COMPLETE_CANONICAL'
          assert b18['state_consistency_result']['satisfied'] is True
          assert b18['authority_result']['required'] is False
          assert 'task.already_terminal' in b18['reasons']

          assert b19['eligible'] is True
          assert b19['state_consistency_result']['observed_state'] == 'PENDING'
          assert b19['authority_result']['required'] is False
          assert b19['authority_result']['satisfied'] is True
          assert b19['reasons'] == []

          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state'] == 'BLOCKED'
          assert b11['authority_result']['required'] is True
          assert b11['authority_result']['satisfied'] is False

          for result in (b20, b22, b25):
              assert result['eligible'] is True
              assert result['state_consistency_result']['observed_state'] == 'PENDING'
              assert result['authority_result']['required'] is False
              assert result['authority_result']['satisfied'] is True

          assert drift['status'] == 'clean' and drift['findings'] == []
          PY

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m mstr_qualify validate
      - run: pytest -q
      - run: ruff check src tests
      - run: mypy

  complete:
    needs: [identity, task_gate, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Final immutable canonical-main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo 'B018_CLOSEOUT_POSTMERGE=PASS'
          echo 'B018_STATE=COMPLETE_CANONICAL'
          echo 'B019_ENTRY=ELIGIBLE'
          echo 'B011_REMAINS_BLOCKED=PASS'
          echo 'TASK_DRIFT=CLEAN'
