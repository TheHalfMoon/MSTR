name: PR172 T031 replay postmerge verification

on:
  push:
    branches:
      - evidence/pr172-t031-replay-postmerge-603a686

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  REPO: TheHalfMoon/MSTR
  PR_NUMBER: "172"
  OLD_BASE: 119a9bcca1c97b9edbcacd6d8d457b31206bb162
  PR_HEAD: f512c166f9dd7ed04dc88bdf097eaa59f3754d2c
  MERGE_SHA: 603a6865fdbf5a5434565e870d73054c5b574f2a
  MERGE_TREE: 28e985a23668ec40098a8f9436b8db5172dfb1c6
  QUALIFICATION_RUN: "34033216978"
  REVIEW_RUN: "34033438680"
  PREMERGE_RUN: "34033707751"
  REVIEW_SUBMISSION: "5125316526"

jobs:
  canonical_state:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact canonical merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify merge identity lifecycle and canonical executor binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          mapfile -t parents < <(git show -s --format='%P' "$MERGE_SHA" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$OLD_BASE"
          test "${parents[1]}" = "$PR_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MERGE_SHA"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def readj(p): return json.loads(Path(p).read_text())
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          b=readj('artifacts/manifests/T031-executor-toolchain-binding.json')
          o=readj('artifacts/manifests/T031-t029-producer-replay-overlay.json')
          a=readj('artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json')
          e=readj('artifacts/manifests/T031-local-measurement-execution-envelope.json')
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          assert b['source_main']=='119a9bcca1c97b9edbcacd6d8d457b31206bb162'
          assert b['authority_sha256']==sha('artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json')
          assert b['envelope_sha256']==sha('artifacts/manifests/T031-local-measurement-execution-envelope.json')
          pairs={
            'toolchain_lock_sha256':'artifacts/manifests/T031-executor-toolchain-lock.json',
            'producer_replay_overlay_sha256':'artifacts/manifests/T031-t029-producer-replay-overlay.json',
            'toolchain_helper_sha256':'colab/mstr_executor_toolchain.py',
            'producer_replay_helper_sha256':'colab/mstr_t031_replay.py',
            'governance_script_sha256':'colab/mstr_t031_governance.py',
            'source_script_sha256':'colab/mstr_t031_source.py',
            'artifact_script_sha256':'colab/mstr_t031_artifacts.py',
            'measurement_script_sha256':'colab/mstr_t031_measure.py',
            'executor_script_sha256':'colab/mstr_t031_execute.py',
            'workflow_sha256':'.github/workflows/t031-measure.yml',
          }
          for k,p in pairs.items(): assert b[k]==sha(p),(k,b[k],sha(p))
          assert b['producer_replay']=={
            'acceptance_gate':'EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH',
            'base_lock_semantics':'PINNED_PIP_AND_SYSTEM_IDENTITY_WITH_FULL_REPLAY_CLOSURE',
            'historical_transitive_identity_claim':False,
            'package_count':40,
            'python_version':'3.11.16',
            'status':'EVIDENCE_BOUNDED_REPLAY',
          }
          assert o['package_count']==40 and len(o['packages'])==40
          assert o['resolution_evidence']['run_id']==34031883766
          assert o['resolution_evidence']['artifact_id']==9988881418
          assert o['resolution_evidence']['model_access']=='NONE'
          assert o['resolution_evidence']['training'] is False
          assert o['resolution_evidence']['paid_cost_usd']==0.0
          assert o['reconstruction_basis']['historical_transitive_identity_claim'] is False
          assert o['reconstruction_basis']['equivalence_gate']=='EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH'
          boundary=b['execution_boundary']
          for k in ['authority_transfer','b012_execution','t032_execution','t033_execution','t034_admission_decision','training']:
              assert boundary[k] is False,k
          assert boundary['paid_cost_usd']==0.0 and boundary['git_model_binaries']==0 and boundary['founder_machine_model_binaries']==0
          dispatch=b['dispatch_boundary']
          assert dispatch['canonicalization_required'] is True
          assert dispatch['checkout_ref']=='main'
          assert dispatch['connector_dispatch_issue']==167
          assert dispatch['connector_dispatch_author']=='TheHalfMoon'
          assert dispatch['connector_dispatch_author_association']=='OWNER'
          assert dispatch['max_parallel_candidates']==1
          assert e['dispatch_state']=='BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING'
          PY
          python - <<'PY'
          import json,os,urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          pr=get(f'pulls/{os.environ["PR_NUMBER"]}')
          assert pr['merged'] is True and pr['state']=='closed',pr
          assert pr['merge_commit_sha']==os.environ['MERGE_SHA'],pr['merge_commit_sha']
          assert pr['head']['sha']==os.environ['PR_HEAD'],pr['head']['sha']
          for rid in ('QUALIFICATION_RUN','REVIEW_RUN','PREMERGE_RUN'):
              run=get(f'actions/runs/{os.environ[rid]}')
              assert run['status']=='completed' and run['conclusion']=='success',(rid,run['status'],run['conclusion'])
          review=get(f'pulls/{os.environ["PR_NUMBER"]}/reviews/{os.environ["REVIEW_SUBMISSION"]}')
          assert review['commit_id']==os.environ['PR_HEAD'] and review['state']=='COMMENTED',review
          assert 'Findings: NONE' in (review.get('body') or '')
          PY
          echo 'T031_EXECUTOR_BINDING=CANONICAL'
          echo 'DISPATCH_PRECONDITION=SATISFIED'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact canonical merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Re-run canonical postmerge quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check colab/mstr_t031_replay.py colab/mstr_t031_execute.py colab/mstr_t031_governance.py tests/contract/test_t031_executor_binding.py
          python -m mypy src/mstr_qualify
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test -z "$(git status --porcelain)"

  final_postmerge:
    needs: [canonical_state, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reverify canonical main immediately before dispatch eligibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$MERGE_SHA"
          echo 'POSTMERGE_VERDICT=PASS'
          echo 'T031_EXECUTOR_BINDING=CANONICAL'
          echo 'DISPATCH_PRECONDITION=SATISFIED'
          echo "CANONICAL_MAIN=$MERGE_SHA"
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
