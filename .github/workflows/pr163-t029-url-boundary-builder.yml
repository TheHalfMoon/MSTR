name: PR163 T029 URL boundary builder

on:
  push:
    branches:
      - evidence/pr163-t029-url-boundary-builder-971bcd1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_MAIN: 5cadbd754686ebff6f5327e9746f0b074b35e318
      EXPECTED_TARGET: 971bcd120e254e369247159cad8bf7ce7e12a80c
      TARGET_BRANCH: fix/000-t029-recovery-current-main
      BUILDER_COMMIT: c27c31079c104e01e8dbcd48f70358465b0e1168
    steps:
      - name: Verify exact remote identities before repair
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          TARGET_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$TARGET_SHA" = "$EXPECTED_TARGET"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TARGET }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Materialize bounded URL-boundary and evidence repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BUILDER_COMMIT"
          git show "$BUILDER_COMMIT:.github/scripts/pr163_t029_url_boundary_builder.py" > /tmp/builder.py
          python /tmp/builder.py
          ruff format colab/mstr_t029_quantize.py tests/unit/test_t029_quantize_runner.py

      - name: Verify exact three-file scope and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_TARGET"
          git diff --name-only "$EXPECTED_TARGET" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          colab/mstr_t029_quantize.py
          evidence/T029-q4-profiles.md
          tests/unit/test_t029_quantize_runner.py
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Install repository development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Focused T029 tests
        run: python -m pytest -q tests/unit/test_t029_quantize_runner.py tests/contract/test_t029_quantization_manifest.py

      - name: Repository validation
        run: mstr-qualify validate

      - name: Full pytest
        run: python -m pytest -q

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Commit bounded repair locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add colab/mstr_t029_quantize.py evidence/T029-q4-profiles.md tests/unit/test_t029_quantize_runner.py
          git commit -m "fix(mstr-000): harden T029 URL authority boundary"

      - name: Guarded fast-forward push to target branch
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          TARGET_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$TARGET_SHA" = "$EXPECTED_TARGET"
          git merge-base --is-ancestor "$EXPECTED_TARGET" HEAD
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
