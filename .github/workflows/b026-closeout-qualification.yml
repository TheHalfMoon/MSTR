name: Qualify B026 canonical closeout exact head

on:
  push:
    branches: [evidence/b026-closeout-qualify-b6de64e]

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  BASE_SHA: 1aed67793fa14e6c9a7bbe4067ad521d16617b26
  HEAD_SHA: b6de64e6dd160920cfa4596cde0e75399be0bb3a
  HEAD_TREE: 255a41837ac7608da6d4d407d05fa486ccfeeac8
  TARGET_BRANCH: docs/000b-b026-canonicalize
  PR_NUMBER: '140'
  BUILDER_RUN: '33683895169'
  POSTMERGE_RUN: '33683456723'
  GH_TOKEN: ${{ github.token }}

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Verify immutable closeout identity and five-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" '
            .state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and
            .commits == 1 and .changed_files == 5
          ' /tmp/pr.json

          printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B026-research-ladder.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort > /tmp/expected
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE_SHA...$HEAD_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- src schemas configs/research specs/002-code-model-supremacy-foundation/contracts docs/data artifacts/authorities)"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILDER_RUN}" > /tmp/builder.json
          jq -e '.status == "completed" and .conclusion == "success" and (.name | contains("B026 canonical closeout"))' /tmp/builder.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${POSTMERGE_RUN}" > /tmp/postmerge.json
          jq -e '.status == "completed" and .conclusion == "success" and (.name | contains("B026 research-ladder implementation"))' /tmp/postmerge.json

  machine_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Re-prove terminal state, successor eligibility, and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$HEAD_SHA"
          git update-ref refs/remotes/origin/main "$HEAD_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json

          set +e
          mstr-qualify task eligible B026 > /tmp/b026.json; b026_rc=$?
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_rc=$?
          set -e
          test "$b026_rc" -eq 1
          test "$b011_rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null' /tmp/b026.json
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json

          mstr-qualify task eligible B027 > /tmp/b027.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0' /tmp/b027.json
          jq -e '[.prerequisite_results[] | select(.task_id == "B026" and .observed_state == "COMPLETE_CANONICAL" and .evidence_present == true and .satisfied == true)] | length == 1' /tmp/b027.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused closeout tests
        run: python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
      - name: Offline validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src
      - name: Re-prove provenance and authority containment
        shell: bash
        run: |
          set -euo pipefail
          grep -F '**State:** COMPLETE_CANONICAL' evidence/mstr-000b/B026-research-ladder.md
          grep -F '**Implementation PR:** #137' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'ENTRY_GATE_TASK = B026' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'CodeRabbit comment `5516237548`' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'post-merge implementation verification: run `33683456723` — SUCCESS' evidence/mstr-000b/B026-research-ladder.md
          grep -F -- '- [x] **B026 Freeze multi-fidelity MSTR Research Ladder v0.**' specs/002-code-model-supremacy-foundation/tasks.md
          for marker in \
            'MODEL_WEIGHT_ACCESS = NONE' \
            'MODEL_EXECUTION = NONE' \
            'RESEARCH_CAMPAIGN_EXECUTION = NONE' \
            'VERIFIER_EXECUTION = NONE' \
            'PAID_COMPUTE = NONE' \
            'NETWORK_MODEL_OR_TEACHER_CALL = NONE' \
            'WEIGHT_CHANGING_TRAINING = NONE' \
            'PRODUCTION_RELEASE = NONE'; do
            grep -F "$marker" evidence/mstr-000b/B026-research-ladder.md
          done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"

  complete:
    needs: [identity_scope, machine_gate, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Final immutable exact-head recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          echo 'B026_CLOSEOUT_EXACT_HEAD_QUALIFICATION=PASS'
