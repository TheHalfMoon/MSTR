name: Postmerge proof A015 Direction-to-Done contract

on:
  push:
    branches:
      - evidence/a015-postmerge-462a9d5

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 462a9d5ce32f01408a538d7fe55a585e432397a7
          fetch-depth: 0
      - name: Verify exact A015 merge identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "462a9d5ce32f01408a538d7fe55a585e432397a7"
          test "$(git rev-parse HEAD^{tree})" = "4cbcce5f00cd9b7b669ba05d1880d4b02eb52c18"
          test "$(git rev-parse HEAD^1)" = "28a4a972182c0f58f7c6500239f625a0e2143d0a"
          test "$(git rev-parse HEAD^2)" = "5bf16bba43711c40c62bd3a838ee4f138c01fc06"
          test "$(git rev-parse HEAD^2^{tree})" = "4cbcce5f00cd9b7b669ba05d1880d4b02eb52c18"
          MAIN_SHA=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)
          test "$MAIN_SHA" = "462a9d5ce32f01408a538d7fe55a585e432397a7"
          gh api repos/${GITHUB_REPOSITORY}/pulls/116 --jq '[.state,.merged,.head.sha,.base.sha] | @tsv' | grep -F $'closed\ttrue\t5bf16bba43711c40c62bd3a838ee4f138c01fc06\t28a4a972182c0f58f7c6500239f625a0e2143d0a'
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33428990007 --jq .conclusion)" = success
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33429274513 --jq .conclusion)" = success
          grep -F '**State:** IMPLEMENTATION_CANDIDATE' evidence/mstr-000a/A015-direction-to-done.md
          grep -F -- '- [ ] **A015 Freeze `DirectionTaskManifest` and the MSTR Direction-to-Done v0 task taxonomy.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A016 Implement research-loop diagnostics.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F 'B023_VERIFIER_HEALTH_EXECUTION = NOT_IMPLEMENTED_BY_A015' evidence/mstr-000a/A015-direction-to-done.md

  quality:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 462a9d5ce32f01408a538d7fe55a585e432397a7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen repository quality gates on canonical merge
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_direction_task_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src

  complete:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 462a9d5ce32f01408a538d7fe55a585e432397a7
          fetch-depth: 0
      - name: Final immutable canonical-main recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "462a9d5ce32f01408a538d7fe55a585e432397a7"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "462a9d5ce32f01408a538d7fe55a585e432397a7"
          test "$(gh api repos/${GITHUB_REPOSITORY}/pulls/116 --jq .merge_commit_sha)" = "462a9d5ce32f01408a538d7fe55a585e432397a7"
