name: Verify B029 canonical post-closeout

on:
  push:
    branches:
      - evidence/pr150-b029-postcloseout

permissions:
  contents: read
  pull-requests: read

env:
  MERGE_SHA: 2d19b6296d550b5b60c1b511d71c6ce86a38d195
  PREVIOUS_MAIN: b3223bb384d8723c37a28526be691cedf8174dc3
  CLOSEOUT_HEAD: 70b39b3fd4dd4cd4b1ebe228e687e969bb201112
  EXPECTED_TREE: 3e6b404e65e1eec6c5f07bdafc8aa92ee3638cb3

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove exact canonical merge topology and PR truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^1)" = "$PREVIOUS_MAIN"
          test "$(git rev-parse HEAD^2)" = "$CLOSEOUT_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          gh api repos/${GITHUB_REPOSITORY}/pulls/150 > /tmp/pr.json
          jq -e --arg head "$CLOSEOUT_HEAD" --arg merge "$MERGE_SHA" '.state == "closed" and .merged == true and .head.sha == $head and .merge_commit_sha == $merge' /tmp/pr.json >/dev/null
      - name: Install canonical tooling
        run: python -m pip install -e '.[dev]'
      - name: Prove canonical B029 terminal state and frontier
        run: |
          set -euo pipefail
          if mstr-qualify task eligible B029 > /tmp/b029.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null' /tmp/b029.json >/dev/null
          mstr-qualify task eligible B030 > /tmp/b030.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .reasons == [] and .authority_result.required == false' /tmp/b030.json >/dev/null
          if mstr-qualify task eligible B031 > /tmp/b031.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:A019")) != null and (.reasons | index("prerequisite.unsatisfied:A020")) != null and (.reasons | index("prerequisite.unsatisfied:B030")) != null' /tmp/b031.json >/dev/null
          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json >/dev/null
          if mstr-qualify task eligible B013 > /tmp/b013.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.state_consistency_result.observed_state == "BLOCKED" and ((.reasons | index("prerequisite.unsatisfied:B012")) != null)' /tmp/b013.json >/dev/null
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json >/dev/null
          grep -F '**State:** COMPLETE_CANONICAL' evidence/mstr-000b/B029-adaptive-inference.md
          grep -F 'ENTRY_GATE_TASK = B029' evidence/mstr-000b/B029-adaptive-inference.md
          grep -F 'ENTRY_GATE_CANONICAL_MAIN = 1179515986ee2311ec1cd675fd899a6143c03761' evidence/mstr-000b/B029-adaptive-inference.md
          grep -F 'ENTRY_GATE_ELIGIBLE = true' evidence/mstr-000b/B029-adaptive-inference.md
      - name: Focused B029 closeout regression
        run: python -m pytest -q tests/contract/test_task_gate.py tests/contract/test_convergence_external_bindings.py tests/contract/test_adaptive_inference_contract.py
      - name: Offline validation
        run: python -m mstr_qualify validate
      - name: Full test suite
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Canonical mypy
        run: python -m mypy src
      - name: Final immutable canonical recheck
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          echo 'B029_POST_CLOSEOUT=PASS'
          echo 'B030_FRONTIER=ELIGIBLE'
