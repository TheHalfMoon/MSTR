name: Prospectively validate and build B007 closeout

on:
  push:

permissions:
  contents: write

env:
  EXPECTED_MAIN: b9b0a8ca7b9b7528f5da518baa83b23e2348c6f6
  TARGET_BRANCH: docs/000b-b007-canonicalize
  SOURCE_BUILDER_BRANCH: evidence/b007-closeout-build3-b9b0a8c
  SOURCE_BUILDER_HEAD: c400c20b28235e3d28be4bc2176c9be6082a1328
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard live canonical truth and source builder identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH" "$SOURCE_BUILDER_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$SOURCE_BUILDER_BRANCH)" = "$SOURCE_BUILDER_HEAD"
          git branch -f main "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B007 > /tmp/b007-before.json
          set +e
          python -m mstr_qualify task eligible B008 > /tmp/b008-before.json
          b8_rc=$?
          set -e
          test "$b8_rc" -eq 1
          python -m mstr_qualify task drift > /tmp/drift-before.json
          python - <<'PY'
          import json, os
          m=os.environ['EXPECTED_MAIN']
          b7=json.load(open('/tmp/b007-before.json')); b8=json.load(open('/tmp/b008-before.json')); d=json.load(open('/tmp/drift-before.json'))
          assert b7['canonical_main']==m and b7['eligible'] is True and b7['state_consistency_result']['observed_state']=='PENDING', b7
          assert b8['canonical_main']==m and b8['eligible'] is False and b8['reasons']==['prerequisite.unsatisfied:B007'], b8
          assert d['canonical_main']==m and d['status']=='clean' and d['findings']==[], d
          print('B007_PRECLOSEOUT_PRODUCTION_TRUTH=PASS')
          PY
      - name: Reuse exact successful materialization instruction from pinned builder
        shell: bash
        run: |
          set -euo pipefail
          git show "$SOURCE_BUILDER_HEAD:.github/workflows/evidence-b007-closeout-build3-b9b0a8c.yml" > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/source.yml').read_text().splitlines()
          target='      - name: Materialize five-file closeout and create clean local candidate commit'
          start=lines.index(target)
          run_idx=next(i for i in range(start+1,len(lines)) if lines[i]=='        run: |')
          body=[]
          for line in lines[run_idx+1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  raise AssertionError(f'unexpected indentation: {line!r}')
          assert body and body[0]=='set -euo pipefail'
          Path('/tmp/materialize.sh').write_text('\n'.join(body)+'\n')
          print('PINNED_MATERIALIZATION_EXTRACT=PASS')
          PY
          bash /tmp/materialize.sh
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          echo "B007_LOCAL_CANDIDATE=$(git rev-parse HEAD)"
      - name: Prospective candidate simulation and frozen gates
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          git branch -f main "$candidate"
          git update-ref refs/remotes/origin/main "$candidate"
          set +e
          python -m mstr_qualify task eligible B007 > /tmp/b007-candidate.json
          b7_rc=$?
          set -e
          test "$b7_rc" -eq 1
          python -m mstr_qualify task eligible B008 > /tmp/b008-candidate.json
          python -m mstr_qualify task drift > /tmp/drift-candidate.json
          python - <<'PY'
          import json, subprocess
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          b7=json.load(open('/tmp/b007-candidate.json')); b8=json.load(open('/tmp/b008-candidate.json')); d=json.load(open('/tmp/drift-candidate.json'))
          assert b7['canonical_main']==head and b7['task_id']=='B007' and b7['eligible'] is False, b7
          assert 'task.already_terminal' in b7['reasons'] and b7['state_consistency_result']['observed_state']=='COMPLETE_CANONICAL', b7
          assert b8['canonical_main']==head and b8['task_id']=='B008' and b8['eligible'] is True and b8['reasons']==[], b8
          assert b8['prerequisite_results'][0]['task_id']=='B007' and b8['prerequisite_results'][0]['satisfied'] is True, b8
          assert d['canonical_main']==head and d['status']=='clean' and d['findings']==[], d
          print('B007_PROSPECTIVE_TERMINAL=PASS')
          print('B008_PROSPECTIVE_ELIGIBLE=PASS')
          print('B007_PROSPECTIVE_DRIFT=clean')
          PY
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py | tee /tmp/targeted.txt
          pytest -q | tee /tmp/full.txt
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
      - name: Record validation without rewriting history and re-prove final candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targeted=Path('/tmp/targeted.txt').read_text().strip().splitlines()[-1]
          full=Path('/tmp/full.txt').read_text().strip().splitlines()[-1]
          p=Path('evidence/mstr-000b/B007-tokenizer-protocol.md'); s=p.read_text()
          assert s.count('CLOSEOUT_TARGETED_GOVERNANCE = TBD')==1
          assert s.count('CLOSEOUT_FULL_PYTEST = TBD')==1
          s=s.replace('CLOSEOUT_TARGETED_GOVERNANCE = TBD',f'CLOSEOUT_TARGETED_GOVERNANCE = {targeted}',1)
          s=s.replace('CLOSEOUT_FULL_PYTEST = TBD',f'CLOSEOUT_FULL_PYTEST = {full}',1)
          p.write_text(s)
          PY
          test "$(git diff --name-only)" = 'evidence/mstr-000b/B007-tokenizer-protocol.md'
          git diff --check
          git add evidence/mstr-000b/B007-tokenizer-protocol.md
          git diff --cached --check
          git commit -m 'docs(mstr-000b): record B007 closeout validation'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          final=$(git rev-parse HEAD)
          git branch -f main "$final"
          git update-ref refs/remotes/origin/main "$final"
          set +e
          python -m mstr_qualify task eligible B007 > /tmp/b007-final.json
          b7_rc=$?
          set -e
          test "$b7_rc" -eq 1
          python -m mstr_qualify task eligible B008 > /tmp/b008-final.json
          python -m mstr_qualify task drift > /tmp/drift-final.json
          python - <<'PY'
          import json, subprocess
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          b7=json.load(open('/tmp/b007-final.json')); b8=json.load(open('/tmp/b008-final.json')); d=json.load(open('/tmp/drift-final.json'))
          assert b7['canonical_main']==head and b7['eligible'] is False and 'task.already_terminal' in b7['reasons'], b7
          assert b8['canonical_main']==head and b8['eligible'] is True and b8['reasons']==[], b8
          assert d['canonical_main']==head and d['status']=='clean' and d['findings']==[], d
          print('B007_FINAL_PROSPECTIVE_TERMINAL=PASS')
          print('B008_FINAL_PROSPECTIVE_ELIGIBLE=PASS')
          print('B007_FINAL_PROSPECTIVE_DRIFT=clean')
          PY
      - name: Restore live refs, guard exact scope, and fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          final=$(git rev-parse HEAD)
          git fetch origin main "$TARGET_BRANCH" "$SOURCE_BUILDER_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$SOURCE_BUILDER_BRANCH)" = "$SOURCE_BUILDER_HEAD"
          git branch -f main "$EXPECTED_MAIN"
          expected=$(printf '%s\n' configs/task-gate/mstr-000b.json evidence/mstr-000b/B007-tokenizer-protocol.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py | sort)
          test "$(git diff --name-only "$EXPECTED_MAIN"...HEAD | sort)" = "$expected"
          git diff --check "$EXPECTED_MAIN"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "B007_CLOSEOUT_HEAD=$final"
          echo "B007_CLOSEOUT_BUILDER_RUN=$GITHUB_RUN_ID"
          echo 'PROSPECTIVE_LOCAL_MAIN_SIMULATION_ONLY=YES'
          echo 'TOKENIZER_ARTIFACT_DOWNLOAD=NONE'
          echo 'TOKENIZER_MEASUREMENT=NONE'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'PAID_COMPUTE=NONE'
          echo 'B008_MATERIAL_EXECUTION=NOT_STARTED'
