name: Verify B005 post-repair ebd31e7

on:
  push:
    branches:
      - evidence/b005-postrepair-ebd31e7

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: ebd31e7657cb42479b28a4cb1cc8a5ce2ae56b6a
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact canonical main identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "POSTREPAIR_EXACT_MAIN=PASS"

      - name: Install exact main tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify B005 terminal canonical state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from mstr_qualify.task_gate import DEFAULT_TASK_CATALOG, load_task_catalog
          root = Path('.').resolve()
          catalog = load_task_catalog(DEFAULT_TASK_CATALOG, repository_root=root)
          node = catalog.nodes['B005']
          assert node['canonical_state'] in node['closeout_rule']['terminal_states'], node
          assert catalog.checked['B005'] is True, catalog.checked['B005']
          assert node['canonical_state'] == 'COMPLETE_CANONICAL', node
          print('B005_TERMINAL_COMPLETE_CANONICAL=PASS')
          PY

      - name: Verify B006 production eligibility
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task eligible B006 > /tmp/b006.json
          cat /tmp/b006.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/b006.json', encoding='utf-8'))
          assert data['task_id']=='B006', data
          assert data['canonical_main']=='ebd31e7657cb42479b28a4cb1cc8a5ce2ae56b6a', data
          assert data['eligible'] is True, data
          assert data['reasons']==[], data
          print('B006_PRODUCTION_ELIGIBLE_TRUE=PASS')
          PY

      - name: Verify production canonical drift clean
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task drift > /tmp/drift.json
          cat /tmp/drift.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/drift.json', encoding='utf-8'))
          assert data['status']=='clean', data
          assert data['canonical_main']=='ebd31e7657cb42479b28a4cb1cc8a5ce2ae56b6a', data
          assert data['findings']==[], data
          assert data['tasks_checked']==34, data
          print('POSTREPAIR_CANONICAL_DRIFT_CLEAN=PASS')
          PY

      - name: Targeted governance tests
        run: pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_task_drift.py tests/integration/test_task_drift_cli.py

      - name: Full test suite
        run: pytest -q

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy

      - name: Validate
        run: python -m mstr_qualify validate

      - name: Re-verify canonical main after all gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B005_POSTREPAIR_CANONICAL_VERIFICATION=PASS"
