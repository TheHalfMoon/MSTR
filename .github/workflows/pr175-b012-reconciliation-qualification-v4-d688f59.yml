name: PR175 B012 reconciliation qualification v4 d688f59

on:
  push:
    branches:
      - evidence/pr175-b012-reconciliation-qualification-v4-d688f59

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  exact_head:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d688f5922a427a25dd48f27c607603edc4e74de1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify exact reconciliation topology and non-authorizing truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          HEAD=d688f5922a427a25dd48f27c607603edc4e74de1
          TREE=569fb23fe58a16bd15383e44666ca8284c3a8d02
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/governance/pr174-b012-merge-race-reconciliation | awk '{print $1}')" = "$HEAD"
          test "$(git diff --name-only "$BASE".."$HEAD")" = 'evidence/B012-pr174-merge-race-reconciliation.md'
          git diff --check "$BASE".."$HEAD"
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          headers = {
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          text = Path('evidence/B012-pr174-merge-race-reconciliation.md').read_text(encoding='utf-8')
          for marker in (
              'PR174_MANDATORY_PREMERGE_FINAL_GUARD = FAILURE',
              'RETROACTIVE_PREMERGE_PASS = PROHIBITED',
              '34045379758', '34045539668', '34045842975', '34045909273', '34046087930',
              '34046125440', '9993670738',
              'd86c27d3d59d2903c3def289a21dedc2ac5625fe1db39542e27ea89be4f96999',
              'llama-bench timed out after 900s',
              'B012_EXECUTION_FAILED_CLOSED',
              'This reconciliation does not authorize a retry.',
              'any applicable recovery-policy or new-evidence requirements',
              'This artifact creates no new Founder authority',
          ):
              assert marker in text, marker
          assert 'A canonical retry is permitted' not in text

          authority = json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text())
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          assert authority['scope']['new_candidate_access'] is False
          assert authority['scope']['training'] is False
          assert authority['scope']['paid_compute'] is False
          assert authority['scope']['paid_model_api'] is False
          assert authority['scope']['production_release'] is False

          pr174 = get('https://api.github.com/repos/TheHalfMoon/MSTR/pulls/174')
          assert pr174['merged'] is True
          assert pr174['merge_commit_sha'] == 'a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          mandatory = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34045842975')
          assert mandatory['conclusion'] == 'failure'
          jobs = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34045842975/jobs?per_page=100')['jobs']
          by = {job['name']: job['conclusion'] for job in jobs}
          assert by['canonical_eligibility'] == 'success'
          assert by['exact_head_gates'] == 'success'
          assert by['final_premerge'] == 'failure'
          assert get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34045909273')['conclusion'] == 'success'
          assert get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34046087930')['conclusion'] == 'failure'

          drift = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34046125440')
          assert drift['conclusion'] == 'failure'
          artifacts = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34046125440/artifacts?per_page=100')['artifacts']
          target = next(a for a in artifacts if a['id'] == 9993670738)
          assert target['name'] == 'b012-mellum-4b-34046125440'
          assert target['digest'] == 'sha256:d86c27d3d59d2903c3def289a21dedc2ac5625fe1db39542e27ea89be4f96999'
          print('PR175_NON_AUTHORIZING_RECONCILIATION_TRUTH=PASS')
          print('DRIFT_WINDOW_MODEL_QUALITY_VERDICT=NONE')
          PY
      - name: Run canonical frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          git diff --exit-code
          git diff --cached --exit-code
          echo 'FROZEN_QUALITY_GATES=PASS'

  canonical_eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify B012 eligibility on exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          BASE=a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git symbolic-ref --short HEAD)" = 'main'
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012
          echo 'B012_CANONICAL_ELIGIBILITY=PASS'

  final:
    needs: [exact_head, canonical_eligibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Final exact refs guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = 'a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/governance/pr174-b012-merge-race-reconciliation | awk '{print $1}')" = 'd688f5922a427a25dd48f27c607603edc4e74de1'
          echo 'PR175_B012_RECONCILIATION_QUALIFICATION=PASS'
          echo 'HISTORICAL_PR174_FINAL_PREMERGE=FAILURE'
          echo 'RETRY_AUTHORITY_CREATED=false'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
