name: PR174 B012 repair postmerge a2b2788

on:
  push:
    branches:
      - evidence/pr174-b012-repair-postmerge-a2b2788

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify exact canonical merge identity
        shell: bash
        run: |
          set -euo pipefail
          MERGE=a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          BASE=4d9e423f7fa2aa6d4f706d5c9ad61dafb24b2513
          HEAD=6290127080459879aa494efdb91aa44bc629a9fc
          test "$(git rev-parse HEAD)" = "$MERGE"
          test "$(git rev-parse HEAD^{tree})" = '2013b367c3163ab37170b28f611999b54e2dad1f'
          test "$(git rev-parse HEAD^1)" = "$BASE"
          test "$(git rev-parse HEAD^2)" = "$HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MERGE"
          test "$(sha256sum colab/mstr_b012_source.py | awk '{print $1}')" = '890c9d1536ae4046a827789530c186dd02afca80bae8930ef22c2cb6e9ddcf26'
      - name: Verify B012 canonical eligibility and frozen quality
        shell: bash
        run: |
          set -euo pipefail
          git branch --force main HEAD
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012
          python -m pytest -q tests/contract/test_b012_source_envelope.py tests/contract/test_b012_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check colab/mstr_b012_source.py tests/contract/test_b012_source_envelope.py tests/contract/test_b012_executor_binding.py
          python -m mypy src/mstr_qualify
          git diff --exit-code
          git diff --cached --exit-code
      - name: Final canonical main guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = 'a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          echo 'PR174_B012_REPAIR_POSTMERGE=PASS'
          echo 'B012_CANONICAL_ELIGIBILITY=PASS'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
