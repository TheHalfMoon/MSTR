name: Mandatory repaired A017 closeout premerge verification

on:
  push:
    branches:
      - evidence/a017-closeout-premerge2-32052b3

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  admission:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact repaired A017 closeout admission
        shell: bash
        run: |
          set -euo pipefail
          BASE='11c528c0ad015f7505dd143c700e710a0f08d86a'
          HEAD='32052b3566cbc9808fdba3248f0f71277d0ff532'
          TREE='bedb9d42ff7cc5caf55557d7fea06f6fd1619e3b'
          git fetch origin main closeout/000a-a017 --quiet
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/closeout/000a-a017)" = "$HEAD"
          test "$(git show -s --format=%T "$HEAD")" = "$TREE"
          pr="$(gh api repos/TheHalfMoon/MSTR/pulls/121)"
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.merged' <<<"$pr")" = 'false'
          test "$(jq -r '.draft' <<<"$pr")" = 'false'
          test "$(jq -r '.base.sha' <<<"$pr")" = "$BASE"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$HEAD"
          reviews="$(gh api repos/TheHalfMoon/MSTR/pulls/121/reviews)"
          jq -e '.[] | select(.id == 5075803581 and .state == "COMMENTED" and .commit_id == "32052b3566cbc9808fdba3248f0f71277d0ff532")' <<<"$reviews" >/dev/null
          fresh_qual="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33487106824)"
          test "$(jq -r '.conclusion' <<<"$fresh_qual")" = 'success'
          stale_qual="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33441835774)"
          stale_premerge="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33486590938)"
          test "$(jq -r '.conclusion' <<<"$stale_qual")" = 'success'
          test "$(jq -r '.conclusion' <<<"$stale_premerge")" = 'success'
          test 'fefed09b18b1b1f817c1f3e3ef9bb95abb6536b7' != "$HEAD"
          fix_run="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33486981728)"
          test "$(jq -r '.conclusion' <<<"$fix_run")" = 'success'
          expected="$(printf '%s\n' 'evidence/mstr-000a/A017-trajectory-contract.md' 'specs/001-agent-harness-verified-loop-foundation/tasks.md')"
          actual="$(git diff --name-only "$BASE..$HEAD")"
          test "$actual" = "$expected"
          git diff --check "$BASE..$HEAD"
          evidence="$(git show "$HEAD:evidence/mstr-000a/A017-trajectory-contract.md")"
          grep -F '**State:** COMPLETE_CANONICAL' <<<"$evidence"
          tasks="$(git show "$HEAD:specs/001-agent-harness-verified-loop-foundation/tasks.md")"
          grep -F -- '- [x] **A017 Freeze failure taxonomy and training trajectory contract.**' <<<"$tasks"
          grep -F -- '- [ ] **A018 Implement trajectory recorder/replay/admission.**' <<<"$tasks"
          grep -F 'Canonical implementation: PR #120 / final head `2270cbbd6a1110e2823679ea3ca2d7b77a92d256` / merge `11c528c0ad015f7505dd143c700e710a0f08d86a`; post-merge proof run `33441203968` = `SUCCESS`.' <<<"$tasks"
          threads="$(gh api graphql -f query='query { repository(owner:"TheHalfMoon", name:"MSTR") { pullRequest(number:121) { reviewThreads(first:100) { nodes { isResolved } } } } }')"
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$threads")" = '0'

  quality:
    needs: admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32052b3566cbc9808fdba3248f0f71277d0ff532
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Run repaired A017 closeout premerge quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src

  complete:
    needs: quality
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final immutable repaired A017 closeout premerge recheck
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main closeout/000a-a017 --quiet
          test "$(git rev-parse origin/main)" = '11c528c0ad015f7505dd143c700e710a0f08d86a'
          test "$(git rev-parse origin/closeout/000a-a017)" = '32052b3566cbc9808fdba3248f0f71277d0ff532'
          test "$(git show -s --format=%T origin/closeout/000a-a017)" = 'bedb9d42ff7cc5caf55557d7fea06f6fd1619e3b'
          pr="$(gh api repos/TheHalfMoon/MSTR/pulls/121)"
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.head.sha' <<<"$pr")" = '32052b3566cbc9808fdba3248f0f71277d0ff532'
          test "$(jq -r '.base.sha' <<<"$pr")" = '11c528c0ad015f7505dd143c700e710a0f08d86a'
          threads="$(gh api graphql -f query='query { repository(owner:"TheHalfMoon", name:"MSTR") { pullRequest(number:121) { reviewThreads(first:100) { nodes { isResolved } } } } }')"
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$threads")" = '0'
