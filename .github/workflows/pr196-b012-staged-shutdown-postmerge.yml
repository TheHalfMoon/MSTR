name: PR196 B012 staged shutdown postmerge

on:
  push:
    branches:
      - evidence/pr196-b012-staged-shutdown-postmerge-2d35efe

permissions:
  contents: read
  pull-requests: read

jobs:
  postmerge:
    runs-on: ubuntu-24.04
    env:
      REPO: TheHalfMoon/MSTR
      MAIN: 2d35efe6d7350f6aa0241ee9de128134cd321f90
      TREE: aa43402ec11fbff58ebe830d2bea47fbe0599d30
      OLD_MAIN: 98feee7765cbf64428f149f885519cef76800caf
      SUBJECT: c8b604384073227ca99833bfa0085e30b2b7b5ac
      PR: '196'
      QUAL_RUN: '34243869812'
      QUAL_HEAD: 8e62220ff629103b9c9bc181c7af3590d1fd9fa6
      REVIEW_RUN: '34245265851'
      REVIEW_HEAD: 48d0e6a4abb82f5f84ad8ea2e9f9517366210f7c
      PREMERGE_RUN: '34245827930'
      PREMERGE_HEAD: 2672e8985fda54d1bb33a27d2c8e0a52c357d30b
      INCIDENT_SHA256: a067895cc6f0356b917d896f7da59faab0db4dcd27c29d76bc157968c2d8134b
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MAIN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.16
          check-latest: false

      - name: Prove exact canonical merge identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$MAIN"
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$OLD_MAIN $SUBJECT"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg merge "$MAIN" --arg base "$OLD_MAIN" --arg head "$SUBJECT" '.state=="closed" and .merged==true and .merge_commit_sha==$merge and .base.sha==$base and .head.sha==$head and .changed_files==8' /tmp/pr.json >/dev/null

      - name: Prove complete premerge evidence chain
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/review.json
          gh api "repos/$REPO/actions/runs/$PREMERGE_RUN" > /tmp/premerge.json
          jq -e --arg head "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' /tmp/qual.json >/dev/null
          jq -e --arg head "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' /tmp/review.json >/dev/null
          jq -e --arg head "$PREMERGE_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' /tmp/premerge.json >/dev/null

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Prove exact-main B012 remains eligible and authority satisfied
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git symbolic-ref --short HEAD)" = main
          test "$(git rev-parse HEAD)" = "$MAIN"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['MAIN']
          assert d['eligible'] is True
          assert d['authority_result']['required'] is True
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['superseded'] is False
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert a['task_id']=='B012'
          PY

      - name: Prove canonical incident fail-closed semantics
        shell: bash
        run: |
          set -euo pipefail
          INCIDENT='artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-staged-recovery-run-34231845282.json'
          test "$(sha256sum "$INCIDENT" | cut -d' ' -f1)" = "$INCIDENT_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          incident=json.loads(Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-staged-recovery-run-34231845282.json').read_text(encoding='utf-8'))
          binding=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text(encoding='utf-8'))
          assert binding['status']=='BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR'
          assert incident['task_id']=='B012'
          assert incident['candidate_id']=='qwen3.5-0.8b-control'
          assert incident['run_id']==34231845282
          assert incident['job_id']==102079676195
          assert incident['workflow_head_sha']=='98feee7765cbf64428f149f885519cef76800caf'
          assert incident['failure_classification']=='B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_PARTIAL_DURABLE_PROGRESS_RAW_CODE_UNPROVEN'
          assert incident['durable_stages']==['init','source','quantize']
          assert incident['durable_artifact_count']==3
          assert incident['source_verification']['file_count']==9
          assert incident['source_verification']['total_download_bytes']==1769897109
          assert incident['regenerated_q4']['q4_k_m_sha256']=='177a8435373b58e09910ee68e6643f656b5d93b6d64e03ee4c37be4a86c995fa'
          assert incident['regenerated_q4']['q4_k_m_size_bytes']==541903296
          assert incident['raw_code_stage_conclusion']=='cancelled'
          assert incident['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert incident['raw_code_checkpoint_artifact']=='NONE'
          assert incident['finalize_stage_conclusion']=='skipped'
          assert incident['final_evidence_artifact']=='NONE'
          assert incident['ephemeral_cleanup_completion']=='NOT_PROVEN'
          assert incident['candidate_execution_completion']=='NOT_PROVEN'
          assert incident['candidate_admission_decision']=='NONE'
          assert incident['model_quality_verdict']=='NONE'
          assert incident['durable_binary_artifacts'] is False
          assert incident['training'] is False
          assert incident['paid_cost_usd']==0.0
          assert incident['paid_model_api'] is False
          assert incident['candidate_expansion'] is False
          assert incident['revision_or_file_expansion'] is False
          assert incident['retry_authority_created'] is False
          assert incident['external_dispatch_authority_created'] is False
          assert incident['same_staged_topology_redispatch_authorized_by_this_evidence'] is False
          assert incident['separate_topology_repair_required'] is True
          PY

      - name: Exact-main quality verification
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final exact-main guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg merge "$MAIN" '.state=="closed" and .merged==true and .merge_commit_sha==$merge' /tmp/pr-final.json >/dev/null
          echo 'PR196_POSTMERGE=PASS'
