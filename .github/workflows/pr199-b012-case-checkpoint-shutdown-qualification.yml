name: PR199 B012 case-checkpoint shutdown qualification

on:
  push:
    branches:
      - evidence/pr199-b012-case-checkpoint-shutdown-qualification-4605a16

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 145be15a32448d00fada0e2d9bf736f265c942a1
      HEAD: 4605a16f80f46d1f79d31194ce314bdd692d00cd
      TREE: ab507a6a37108b0dd4170508f57bf0fcd0180b60
      PR: '199'
      SUBJECT_BRANCH: governance/b012-qwen-case-checkpoint-runner-shutdown-34265475666
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact incident subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove exact identities and ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          git fetch origin main "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$SUBJECT_BRANCH)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git rev-list --count "$BASE..$HEAD")" = "16"

      - name: Prove live PR identity and exact fourteen-file scope
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
            mergeable=$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' /tmp/pr.json)
            [[ "$mergeable" != unknown ]] && break
            sleep 2
          done
          jq '{state,draft,mergeable,mergeable_state,base:.base.sha,head:.head.sha,changed_files}' /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==14' /tmp/pr.json >/dev/null
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            'artifacts/manifests/B012-executor-toolchain-binding.json'
            'artifacts/results/equivalent/B012/checkpoints/34265475666/B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json'
            'artifacts/results/equivalent/B012/checkpoints/34265475666/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-01-init.json'
            'artifacts/results/equivalent/B012/checkpoints/34265475666/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-02-source.json'
            'artifacts/results/equivalent/B012/checkpoints/34265475666/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-03-quantize.json'
            'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-case-checkpoint-recovery-run-34265475666.json'
            'evidence/mstr-000b/B012-qwen-case-checkpoint-recovery-runner-shutdown-34265475666.md'
            'tests/contract/test_b012_executor_binding.py'
            'tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py'
            'tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py'
            'tests/contract/test_b012_qwen_raw_code_recovery.py'
            'tests/contract/test_b012_qwen_staged_recovery_topology.py'
            'tests/contract/test_b012_runner_shutdown_evidence.py'
            'tests/contract/test_b012_stage_checkpoint_topology.py'
          )
          [[ ${#actual[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done
          git diff --check "$BASE...$HEAD"

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Exact-main B012 eligibility and authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert all(d['semantic_checks'].values())
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert a['task_id']=='B012'
          assert a['cost_resource_ceiling']['limits'][0]['max']==0.0
          PY
          git checkout --detach "$HEAD"

      - name: Prove incident evidence identities and fail-closed binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          root=Path('artifacts/results/equivalent/B012')
          incident=root/'failures/B012-qwen3.5-0.8b-control-raw-code-case-checkpoint-recovery-run-34265475666.json'
          cp=root/'checkpoints/34265475666'
          paths={
            'init': cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-01-init.json',
            'source': cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-02-source.json',
            'quantize': cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-03-quantize.json',
            'state': cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json',
          }
          expected={
            'incident':'e03d0030cb500a2fc97ec3a2f66c17b463028582643d9169c7be6994bc955152',
            'init':'fabc44925fdb8243d5eeca856b6e9b5fd83db54c4dc9cca27967409382721fb4',
            'source':'38f9693bd55f77f8634ce01dec0e932e990790735399ade55f0a4230bdbf585e',
            'quantize':'ed15864153a8e4b26fffca5298dcbd80763e9c7edd0106845555b8325b079205',
            'state':'e5accce8487556a649db0c147a3c5876c0b31f8c1c0b334e48510f3680f58733',
          }
          assert sha(incident)==expected['incident']
          for key,path in paths.items(): assert sha(path)==expected[key], key
          i=json.loads(incident.read_text(encoding='utf-8'))
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text(encoding='utf-8'))
          assert i['run_id']==34265475666 and i['run_attempt']==1 and i['job_id']==102193622602
          assert i['canonical_main_at_start']=='145be15a32448d00fada0e2d9bf736f265c942a1'
          assert i['failure_classification']=='B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_PARTIAL_DURABLE_PROGRESS_RAW_CODE_UNPROVEN'
          assert i['durable_stages']==['init','source','quantize']
          assert i['interrupted_stage']=='raw-code-python-clamp'
          assert i['durable_raw_code_case_count']==0 and i['durable_raw_code_cases']==[]
          assert i['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert i['model_quality_verdict']=='NONE' and i['candidate_admission_decision']=='NONE'
          assert i['ephemeral_cleanup_completion']=='NOT_PROVEN'
          assert i['retry_authority_created'] is False
          assert i['external_dispatch_authority_created'] is False
          assert i['cross_run_resume_authority_created'] is False
          assert i['same_case_checkpoint_topology_redispatch_authorized_by_this_evidence'] is False
          assert b['status']=='BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR'
          s=b['qwen_raw_code_case_checkpoint_runner_shutdown']
          assert s['run_id']==34265475666 and s['failure_evidence_sha256']==expected['incident']
          assert s['durable_raw_code_case_count']==0 and s['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert s['retry_authority_created'] is False
          assert s['external_dispatch_authority_created'] is False
          assert s['cross_run_resume_authority_created'] is False
          assert s['same_case_checkpoint_topology_redispatch_authorized_by_this_evidence'] is False
          q=json.loads(paths['quantize'].read_text(encoding='utf-8'))
          assert q['checkpoint_payload']['matches_prior_stage03'] is True
          assert q['checkpoint_payload']['q4_k_m_sha256']=='177a8435373b58e09910ee68e6643f656b5d93b6d64e03ee4c37be4a86c995fa'
          assert q['checkpoint_payload']['q4_k_m_size_bytes']==541903296
          PY

      - name: Focused B012 incident contracts
        run: |
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py

      - name: Canonical schema validation
        run: python -m mstr_qualify validate

      - name: Ruff lint
        run: python -m ruff check .

      - name: Changed Python Ruff format
        run: |
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py

      - name: Full pytest
        run: python -m pytest -q

      - name: Mypy
        run: python -m mypy src/mstr_qualify

      - name: Final immutable live guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .base.sha==$base and .head.sha==$head and .changed_files==14' /tmp/pr-final.json >/dev/null
          echo 'PR199_QUALIFICATION=PASS'
