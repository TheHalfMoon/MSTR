name: Mandatory premerge verification for B023 canonical closeout

on:
  push:
    branches:
      - evidence/b023-closeout-premerge-2392929

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  checks: read

env:
  EXPECTED_BASE: f71a15f967250c5c523749be9f9f3066feccb902
  EXPECTED_HEAD: 2392929d247ba8e5b37617b22244b9e11b129959
  EXPECTED_TREE: 2d2e163131009fc4425b769b036ee0502abbaaa8
  EXPECTED_BRANCH: docs/000b-b023-canonicalize
  PR_NUMBER: '134'
  QUALIFICATION_RUN: '33533860140'
  QUALIFICATION_SHA: db1dd0d7d9b7b22fe764dae6c070cffa044feebc
  QUALIFICATION_BRANCH: evidence/b023-closeout-qualify-2392929
  REVIEW_REQUEST_COMMENT: '5497392869'
  REVIEW_RESULT_COMMENT: '5497449092'

jobs:
  identity_evidence_review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify exact PR identity and bounded closeout scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EXPECTED_HEAD"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '.state == "open" and .draft == false and .mergeable == true and .base.sha == $base and .head.sha == $head and .commits == 1 and .changed_files == 5' /tmp/pr.json

          printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B023-verifier-health-implementation.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort > /tmp/expected-files
          git diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check "$EXPECTED_BASE...$EXPECTED_HEAD"
          test -z "$(grep '^src/mstr_qualify/verifier/' /tmp/actual-files || true)"
          test -z "$(grep '^schemas/' /tmp/actual-files || true)"
          test -z "$(grep '^specs/002-code-model-supremacy-foundation/contracts/' /tmp/actual-files || true)"

      - name: Verify exact-head qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" > /tmp/qualification.json
          jq -e \
            --arg branch "$QUALIFICATION_BRANCH" \
            --arg sha "$QUALIFICATION_SHA" \
            '.status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == $branch and .head_sha == $sha and .path == ".github/workflows/evidence-b023-closeout-qualify-2392929.yml"' \
            /tmp/qualification.json

          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/evidence-b023-closeout-qualify-2392929.yml?ref=${QUALIFICATION_SHA}" --jq '.content' | base64 -d > /tmp/qualification.yml
          grep -F "EXPECTED_MAIN: $EXPECTED_BASE" /tmp/qualification.yml
          grep -F "EXPECTED_HEAD: $EXPECTED_HEAD" /tmp/qualification.yml
          grep -F "EXPECTED_TREE: $EXPECTED_TREE" /tmp/qualification.yml
          grep -F "PR_NUMBER: '134'" /tmp/qualification.yml

      - name: Verify independent Codex exact-head review and zero unresolved threads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="${EXPECTED_HEAD:0:10}"

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${REVIEW_REQUEST_COMMENT}" > /tmp/review-request.json
          jq -e --arg head "$EXPECTED_HEAD" --arg base "$EXPECTED_BASE" '.user.login == "TheHalfMoon" and (.body | contains("@codex review")) and (.body | contains($head)) and (.body | contains($base))' /tmp/review-request.json

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${REVIEW_RESULT_COMMENT}" > /tmp/review-result.json
          jq -e --arg prefix "$prefix" '.user.login == "chatgpt-codex-connector[bot]" and .performed_via_github_app.slug == "chatgpt-codex-connector" and .created_at == .updated_at and (.body | contains("Codex Review: Didn'\''t find any major issues.")) and (.body | contains("**Reviewed commit:** `" + $prefix + "`"))' /tmp/review-result.json

          request_created=$(jq -r '.created_at' /tmp/review-request.json)
          result_created=$(jq -r '.created_at' /tmp/review-result.json)
          test "$result_created" \> "$request_created"

          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner='TheHalfMoon' -f name='MSTR' -F number=134 > /tmp/threads.json
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0' /tmp/threads.json

          gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD}/check-runs?per_page=100" > /tmp/checks.json
          jq -e '[.check_runs[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required" or .conclusion == "stale"))] | length == 0' /tmp/checks.json

  prospective_machine_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Prove prospective canonical frontier and external-authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"

          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json

          if mstr-qualify task eligible B023 > /tmp/b023.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null' /tmp/b023.json

          mstr-qualify task eligible B024 > /tmp/b024.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and (.reasons | length) == 0' /tmp/b024.json

          if mstr-qualify task eligible B026 > /tmp/b026.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and (.reasons | index("prerequisite.unsatisfied:B024")) != null and (.reasons | index("prerequisite.unsatisfied:B022")) == null and (.reasons | index("prerequisite.unsatisfied:B025")) == null' /tmp/b026.json

          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json

          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"

  candidate_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Run exact-head closeout quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_verifier_health.py tests/contract/test_verifier_health_contract.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          grep -F 'MODEL_EXECUTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'MODEL_WEIGHT_ACCESS = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'VERIFIER_SUBPROCESS_EXECUTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'PAID_COMPUTE = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'LARGE_DATASET_INGESTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'PRIVATE_USER_DATA_INGESTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'WEIGHT_CHANGING_TRAINING = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EXPECTED_HEAD"

  complete:
    needs: [identity_evidence_review, prospective_machine_gate, candidate_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Final immutable identity, qualification, review, and thread recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="${EXPECTED_HEAD:0:10}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EXPECTED_HEAD"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '.state == "open" and .draft == false and .mergeable == true and .base.sha == $base and .head.sha == $head and .commits == 1 and .changed_files == 5'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" | jq -e --arg sha "$QUALIFICATION_SHA" '.status == "completed" and .conclusion == "success" and .head_sha == $sha'
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${REVIEW_RESULT_COMMENT}" | jq -e --arg prefix "$prefix" '.user.login == "chatgpt-codex-connector[bot]" and .performed_via_github_app.slug == "chatgpt-codex-connector" and (.body | contains("Codex Review: Didn'\''t find any major issues.")) and (.body | contains("**Reviewed commit:** `" + $prefix + "`"))'
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner='TheHalfMoon' -f name='MSTR' -F number=134 | jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0'

          echo "B023_CLOSEOUT_PREMERGE_HEAD=$EXPECTED_HEAD"
          echo "B023_CODEX_REVIEW_COMMENT=$REVIEW_RESULT_COMMENT"
          echo "B023_CLOSEOUT_PREMERGE=PASS"
          echo "MODEL_EXECUTION=NONE"
          echo "WEIGHT_CHANGING_TRAINING=NONE"
