name: T031 historical PyPI forensics

on:
  push:
    branches:
      - fix/t031-historical-pypi-forensics

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout forensic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact historical Python patch
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify bounded forensic preconditions
        env:
          EXPECTED_MAIN: 603a6865fdbf5a5434565e870d73054c5b574f2a
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          python --version
          echo "T031_FORENSIC_SCOPE=PACKAGE_METADATA_AND_PACKAGE_WHEELS_ONLY"
          echo "MODEL_ACCESS=NONE"
          echo "TRAINING=false"
          echo "PAID_COST_USD=0.0"

      - name: Reconstruct historical package closure at T029 install cutoff
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t031-historical"
          python tools/t031_historical_pypi_forensics.py \
            --workdir "$RUNNER_TEMP/t031-historical/work" \
            --output "$RUNNER_TEMP/t031-historical/t031-historical-pypi-closure.json"

      - name: Verify no-model result contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "t031-historical/t031-historical-pypi-closure.json").read_text())
          assert report["model_access"] == "NONE"
          assert report["training"] is False
          assert report["paid_cost_usd"] == 0.0
          assert report["historical_install_cutoff_utc"] == "2026-08-26T10:44:06Z"
          assert report["source_t029_run_id"] == 32959729068
          assert report["python_version"] == "3.11.16"
          assert report["pip_check"] == "No broken requirements found."
          direct = report["direct_selected_versions"]
          print(json.dumps(direct, sort_keys=True))
          print(f"PACKAGE_COUNT={report['package_count']}")
          print("MODEL_ACCESS=NONE")
          print("TRAINING=false")
          print("PAID_COST_USD=0.0")
          PY

      - name: Upload durable no-model forensic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t031-historical-pypi-forensics
          path: ${{ runner.temp }}/t031-historical/t031-historical-pypi-closure.json
          if-no-files-found: error
          retention-days: 14
