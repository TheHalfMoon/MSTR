name: PR193 B012 Qwen shutdown independent semantic review

on:
  push:
    branches:
      - evidence/pr193-independent-review-15287f0

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
      SUBJECT_BRANCH: fix/b012-qwen-recovery-runner-shutdown-34169060075
      SUBJECT_SHA: 15287f04bf279b7896a926e655c344f7be96d38c
      SUBJECT_TREE: ac9f512e6d6b46cf85f0b055174dfe6c7571e59b
      QUALIFICATION_RUN: '34173514002'
      QUALIFICATION_HEAD: 62f573d8d4fd2da3d85cca2899ae901270c9ee0b
      INCIDENT_RUN: '34169060075'
      INCIDENT_JOB: '101885732522'
      INCIDENT_EVIDENCE_SHA256: 3994421abe4d368746672f539edca2c509188147cadf9f1d6fd142f9ff9dc8ea
      BLOCKED_STATUS: BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Require successful exact qualification and unchanged live topology
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          q=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN")
          [[ "$(jq -r .status <<<"$q")" == completed ]]
          [[ "$(jq -r .conclusion <<<"$q")" == success ]]
          [[ "$(jq -r .head_sha <<<"$q")" == "$QUALIFICATION_HEAD" ]]
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/193" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$SUBJECT_SHA" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==7' /tmp/pr.json >/dev/null

      - name: Independently prove bounded seven-file change and unchanged execution surfaces
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            'artifacts/manifests/B012-executor-toolchain-binding.json' \
            'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json' \
            'evidence/mstr-000b/B012-qwen-recovery-runner-shutdown-34169060075.md' \
            'tests/contract/test_b012_executor_binding.py' \
            'tests/contract/test_b012_qwen_raw_code_recovery.py' \
            'tests/contract/test_b012_runner_shutdown_evidence.py' \
            'tests/contract/test_b012_stage_checkpoint_topology.py')
          [[ "$(git diff --name-only "$BASE_SHA...$SUBJECT_SHA" | sort)" == "$expected" ]]
          for path in \
            .github/workflows/b012-qwen-raw-code-recovery.yml \
            configs/workflows/b012-qwen-raw-code-recovery.yml \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            colab/mstr_b012_governance.py \
            benchmarks/manifests/B012-raw-code-proxy.json \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json; do
            git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- "$path"
          done

      - name: Independently review incident truth and authority containment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_SHA"
          incident=artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json
          binding=artifacts/manifests/B012-executor-toolchain-binding.json
          [[ "$(sha256sum "$incident" | cut -d' ' -f1)" == "$INCIDENT_EVIDENCE_SHA256" ]]
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads(Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json').read_text())
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          assert e['schema_version']=='mstr.b012-infrastructure-cancellation.v1'
          assert e['failure_classification']=='B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_NO_DURABLE_RECOVERY_RESULT'
          assert e['run_id']==34169060075 and e['job_id']==101885732522
          assert e['workflow_conclusion']=='failure'
          assert e['execution_step_conclusion']=='cancelled'
          assert e['artifact_upload_step_conclusion']=='skipped'
          assert e['cleanup_step_conclusion']=='skipped'
          assert e['durable_artifact_count']==0
          assert e['executor_authored_failure_json'] is False
          assert e['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert e['model_quality_verdict']=='NONE'
          assert e['model_access_before_shutdown']=='UNKNOWN_UNRECORDED'
          assert e['regenerated_q4_identity_before_shutdown']=='UNKNOWN_UNRECORDED'
          assert e['candidate_execution_completion']=='NOT_PROVEN'
          assert e['ephemeral_cleanup_completion']=='NOT_PROVEN'
          for key in ('retry_authority_created','external_dispatch_authority_created','candidate_expansion','revision_or_file_expansion','training','paid_compute_authority_created','paid_model_api'):
              assert e[key] is False, key
          assert b['status']==os.environ['BLOCKED_STATUS']
          q=b['qwen_raw_code_recovery_runner_shutdown']
          assert q['failure_evidence_sha256']==os.environ['INCIDENT_EVIDENCE_SHA256']
          assert q['same_recovery_topology_as_failed_run_34163308005'] is True
          assert q['repeating_same_recovery_topology_authorized_by_this_evidence'] is False
          assert q['retry_authority_created'] is False
          assert q['external_dispatch_authority_created'] is False
          assert q['candidate_expansion'] is False
          assert q['revision_or_file_expansion'] is False
          assert q['training'] is False
          assert q['paid_model_api'] is False
          PY
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_RUN" --jq .conclusion)" == failure ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_RUN/artifacts" --jq .total_count)" == 0 ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_RUN/jobs?per_page=100" > /tmp/jobs.json
          python - <<'PY'
          import json, os
          jobs=json.load(open('/tmp/jobs.json',encoding='utf-8'))['jobs']
          j=next(x for x in jobs if x['id']==int(os.environ['INCIDENT_JOB']))
          steps={x['name']:x['conclusion'] for x in j['steps']}
          assert steps['Recover Qwen raw-code evidence only']=='cancelled'
          assert steps['Upload Qwen raw-code recovery JSON']=='skipped'
          assert steps['Remove ephemeral B012 recovery binaries']=='skipped'
          PY

      - name: Prove fail-closed binding precedes model-affecting recovery work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('colab/mstr_b012_qwen_raw_code_recovery.py').read_text(encoding='utf-8')
          activation=text.index('_, envelope, lock, manifest = _require_recovery_activation(repo_root)')
          replay=text.index('install_replay_toolchain(', activation)
          tools=text.index('_prepare_minimal_tools(', replay)
          download=text.index('download_candidate(', tools)
          quantize=text.index('convert_quantize(', download)
          raw=text.index('run_raw_code_proxy(', quantize)
          assert activation < replay < tools < download < quantize < raw
          helper=text[text.index('def _require_recovery_activation'):text.index('def _prepare_minimal_tools')]
          assert helper.index('_require_binding(repo_root)') < helper.index('read_json(repo_root / RECOVERY_MANIFEST_PATH)')
          print('FAIL_CLOSED_BINDING_PRECEDES_RECOVERY_WORK=PASS')
          PY

      - name: Re-prove exact-main task gate and inherited formatter baseline
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/b012.json',encoding='utf-8'))
          assert d['eligible'] is True and d['canonical_main']==os.environ['BASE_SHA']
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          PY
          set +e
          python -m ruff format --check --diff . > /tmp/base-format.diff 2>&1
          code=$?
          set -e
          [[ "$code" -eq 1 ]]

      - name: Fresh semantic contracts, formatter regression guard, and full quality
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_SHA"
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          set +e
          python -m ruff format --check --diff . > /tmp/subject-format.diff 2>&1
          code=$?
          set -e
          [[ "$code" -eq 1 ]]
          python - <<'PY'
          from pathlib import Path
          def paths(p):
              return {line[4:].split(':cell ',1)[0] for line in Path(p).read_text(encoding='utf-8').splitlines() if line.startswith('--- ')}
          base=paths('/tmp/base-format.diff'); subject=paths('/tmp/subject-format.diff')
          assert base
          assert not (subject-base), sorted(subject-base)
          PY
          python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify

      - name: Final independent no-drift review conclusion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote origin "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          [[ "$(gh api repos/$GITHUB_REPOSITORY/pulls/193 --jq .state)" == open ]]
          echo 'PR193_INDEPENDENT_SEMANTIC_REVIEW=PASS'
          echo 'REVIEW_FINDINGS=NONE'
          echo 'AUTHORITY_EXPANSION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
