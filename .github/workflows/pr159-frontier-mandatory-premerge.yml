name: Mandatory premerge verification PR 159 frontier plan

on:
  push:
    branches:
      - evidence/pr159-frontier-mandatory-premerge

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

env:
  EXPECTED_BASE: b9aa4f7de8b924d283d09fa8d93dbaceb0f6b4cd
  EXPECTED_HEAD: 7b22890d72e12829cf412e643527d24831feb30f
  EXPECTED_TREE: 876dc3546583e6871af4dbb2917294615b5592e8
  TARGET_BRANCH: plan/000b-frontier-acceleration-2026-09
  PR_NUMBER: '159'
  QUALIFICATION_RUN: '33878935851'
  REVIEW_RUN: '33880015571'
  QUALIFICATION_EVIDENCE_HEAD: 3d79406218c5ac13f7acbff16975a41c8f8466a6
  REVIEW_EVIDENCE_HEAD: aacfe12c22403202b3eb54ad7f15f51b23dee861
  QUALIFICATION_WORKFLOW_PATH: .github/workflows/pr159-frontier-acceleration-qualification-v2.yml
  REVIEW_WORKFLOW_PATH: .github/workflows/pr159-frontier-independent-review-v3.yml

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout live canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: base
          persist-credentials: false

      - name: Checkout exact planning candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact live identity, mergeability, and immutable scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git -C base branch --show-current)" = "main"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git -C candidate merge-base "$EXPECTED_BASE" "$EXPECTED_HEAD")" = "$EXPECTED_BASE"
          test "$(git -C candidate rev-list --count "$EXPECTED_BASE".."$EXPECTED_HEAD")" = "10"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '
            .state == "open" and .draft == false and .merged == false and
            .mergeable == true and .base.ref == "main" and .base.sha == $base and
            .head.sha == $head and .commits == 10 and .changed_files == 9
          ' /tmp/pr.json >/dev/null
          cat > /tmp/expected-files <<'EOF'
          docs/canonical/MSTR_FRONTIER_ACCELERATION_STRATEGY.md
          specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md
          specs/002-code-model-supremacy-foundation/clarification-closeout.md
          specs/002-code-model-supremacy-foundation/implementation-handoff.md
          specs/002-code-model-supremacy-foundation/plan.md
          specs/002-code-model-supremacy-foundation/quickstart.md
          specs/002-code-model-supremacy-foundation/research-frontier-2026-09-04.md
          specs/002-code-model-supremacy-foundation/spec.md
          specs/002-code-model-supremacy-foundation/tasks.md
          EOF
          sed -i 's/^          //' /tmp/expected-files
          sort -o /tmp/expected-files /tmp/expected-files
          git -C candidate diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git -C candidate diff --check "$EXPECTED_BASE...$EXPECTED_HEAD"
          test -z "$(git -C candidate diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" -- \
            configs/task-gate src schemas artifacts/authorities .github/workflows README.md docs/canonical/CURRENT_STATE.md)"

      - name: Verify exact qualification and independent semantic-review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" > /tmp/qualification-run.json
          jq -e --arg sha "$QUALIFICATION_EVIDENCE_HEAD" --arg path "$QUALIFICATION_WORKFLOW_PATH" '
            .status == "completed" and .conclusion == "success" and .head_sha == $sha and
            .path == $path and .event == "push"
          ' /tmp/qualification-run.json >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN}" > /tmp/review-run.json
          jq -e --arg sha "$REVIEW_EVIDENCE_HEAD" --arg path "$REVIEW_WORKFLOW_PATH" '
            .status == "completed" and .conclusion == "success" and .head_sha == $sha and
            .path == $path and .event == "push"
          ' /tmp/review-run.json >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/contents/${QUALIFICATION_WORKFLOW_PATH}?ref=${QUALIFICATION_EVIDENCE_HEAD}" --jq .content | base64 -d > /tmp/qualification.yml
          grep -F "EXPECTED_BASE: $EXPECTED_BASE" /tmp/qualification.yml >/dev/null
          grep -F "TARGET_HEAD: $EXPECTED_HEAD" /tmp/qualification.yml >/dev/null
          grep -F "TARGET_BRANCH: $TARGET_BRANCH" /tmp/qualification.yml >/dev/null
          ! grep -Eq '^[[:space:]]*(contents|pull-requests|actions|checks|statuses):[[:space:]]*write' /tmp/qualification.yml

          gh api "repos/${GITHUB_REPOSITORY}/contents/${REVIEW_WORKFLOW_PATH}?ref=${REVIEW_EVIDENCE_HEAD}" --jq .content | base64 -d > /tmp/review.yml
          grep -F "EXPECTED_BASE: $EXPECTED_BASE" /tmp/review.yml >/dev/null
          grep -F "TARGET_HEAD: $EXPECTED_HEAD" /tmp/review.yml >/dev/null
          grep -F "QUALIFICATION_RUN: '$QUALIFICATION_RUN'" /tmp/review.yml >/dev/null
          ! grep -Eq '^[[:space:]]*(contents|pull-requests|actions|checks|statuses):[[:space:]]*write' /tmp/review.yml
          echo 'EVIDENCE_BINDING=PASS'

      - name: Reconcile live reviews and unresolved review threads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length')" -eq 0
          gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner=TheHalfMoon -f repo=MSTR -F number=159 > /tmp/threads.json
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0' /tmp/threads.json >/dev/null
          echo 'REVIEW_RECONCILIATION=PASS'

      - name: Verify branch protection, rulesets, statuses, and check-run boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" > /tmp/branch.json
          jq -e '.protected == false and (.protection.enabled // false) == false and ((.protection.required_status_checks.contexts // []) | length == 0)' /tmp/branch.json >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true" > /tmp/rulesets.json
          jq -e 'length == 0' /tmp/rulesets.json >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD}/status" > /tmp/status.json
          jq -e '[.statuses[]? | select(.state == "failure" or .state == "error")] | length == 0' /tmp/status.json >/dev/null
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD}/check-runs" > /tmp/check-runs.json
          jq -e '[.check_runs[]? | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required")] | length == 0' /tmp/check-runs.json >/dev/null
          echo 'REQUIRED_CHECK_BOUNDARY=PASS'

      - name: Install canonical-base tooling
        working-directory: base
        run: python -m pip install -e '.[dev]'

      - name: Verify machine eligibility and canonical task drift
        working-directory: base
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task eligible B011 > /tmp/b011-eligibility.json
          jq -e --arg main "$EXPECTED_BASE" '
            .task_id == "B011" and .canonical_main == $main and .eligible == true and
            .authority_result.required == true and .authority_result.satisfied == true and
            .state_consistency_result.observed_state == "PENDING" and
            .state_consistency_result.satisfied == true and (.reasons | length == 0)
          ' /tmp/b011-eligibility.json >/dev/null
          python -m mstr_qualify task drift > /tmp/task-drift.json
          jq -e '.status == "pass"' /tmp/task-drift.json >/dev/null
          echo 'MACHINE_ELIGIBILITY=PASS'

      - name: Verify planning semantics and unchanged authority boundary
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          base = "b9aa4f7de8b924d283d09fa8d93dbaceb0f6b4cd"
          task_path = Path("specs/002-code-model-supremacy-foundation/tasks.md")
          old_tasks = subprocess.check_output(["git", "show", f"{base}:{task_path.as_posix()}"], text=True)
          tasks = task_path.read_text()
          plan = Path("specs/002-code-model-supremacy-foundation/plan.md").read_text()
          quick = Path("specs/002-code-model-supremacy-foundation/quickstart.md").read_text()
          checklist = Path("specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md").read_text()
          handoff = Path("specs/002-code-model-supremacy-foundation/implementation-handoff.md").read_text()
          strategy = Path("docs/canonical/MSTR_FRONTIER_ACCELERATION_STRATEGY.md").read_text()
          research = Path("specs/002-code-model-supremacy-foundation/research-frontier-2026-09-04.md").read_text()
          authority = json.loads(Path("artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json").read_text())
          b010 = json.loads(Path("artifacts/manifests/B010-new-candidate-weight-access.json").read_text())

          def states(text: str) -> dict[str, str]:
              return {task: mark for mark, task in re.findall(r"^- \[([ x])\] \*\*(B\d{3})\b", text, re.M)}

          assert states(old_tasks) == states(tasks), "planning PR changed B-task checkbox state"
          low = strategy.lower()
          plan_low = plan.lower()
          assert "B013" in tasks and "equivalent qualification" in tasks.lower()
          assert "freshness gate" in plan_low and "b013" in plan_low
          assert "checkpoint-lineage" in plan_low or "checkpoint lineage" in plan_low
          assert "q4" in plan_low and "sub-q4" in plan_low
          assert "targeted trajectory feedback" in plan_low or "targeted_trajectory_feedback" in plan_low
          assert "sealed headline evaluation" in plan_low
          assert "K2 Horizon 3.7B" in strategy and "K2 Horizon 3.7B" in research
          assert "preselect" in low
          assert "anchor" in low and "challenger" in low and "sherry" in low
          assert "future git history" in low or "future-git-history" in low
          assert "public-solution" in low or "public solution" in low
          assert "outbound network" in low or "network access" in low
          assert "No official Cursor Composer 3 release was verified" in strategy
          auth_text = json.dumps(authority, sort_keys=True)
          b010_text = json.dumps(b010, sort_keys=True)
          assert "K2" not in auth_text and "K2" not in b010_text, "historical B010/B011 authority widened"
          assert "mellum-4b" in auth_text and "qwen3.5-0.8b-control" in auth_text
          for text, name in ((quick, "quickstart"), (checklist, "readiness"), (handoff, "handoff")):
              assert "MSTR_FRONTIER_ACCELERATION_STRATEGY.md" in text, f"strategy not inherited by {name}"
          print("SEMANTIC_SCOPE=PASS")
          PY

      - name: Install exact candidate tooling
        working-directory: candidate
        run: python -m pip install -e '.[dev]'

      - name: Offline repository validation
        working-directory: candidate
        run: python -m mstr_qualify validate

      - name: Full test suite
        working-directory: candidate
        run: python -m pytest -q

      - name: Ruff
        working-directory: candidate
        run: python -m ruff check .

      - name: Strict mypy
        working-directory: candidate
        run: python -m mypy

      - name: Final immutable live recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr-final.json
          jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '
            .state == "open" and .draft == false and .merged == false and
            .mergeable == true and .base.sha == $base and .head.sha == $head
          ' /tmp/pr-final.json >/dev/null
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length')" -eq 0
          gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner=TheHalfMoon -f repo=MSTR -F number=159 > /tmp/threads-final.json
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0' /tmp/threads-final.json >/dev/null
          echo 'MANDATORY_PREMERGE=PASS'
