name: PR194 B012 Qwen staged repair qualification v2

on:
  push:
    branches:
      - evidence/pr194-qualification-v2-7c638a6

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE: 5e15cfd0d5eb696154a757edd9382dfea65359cf
      HEAD: 7c638a6db7d9f7401bb973d714fcac3902212f54
      TREE: 5bb38d3ed4195c2447da9b3ede59302dea74f936
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false
      - name: Prove exact non-active five-file scope
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          [[ "$(git rev-parse HEAD)" == "$HEAD" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$TREE" ]]
          [[ "$(git rev-parse origin/main)" == "$BASE" ]]
          [[ "$(git merge-base "$BASE" "$HEAD")" == "$BASE" ]]
          expected=$(printf '%s\n' \
            'artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json' \
            'colab/mstr_b012_qwen_raw_code_recovery_staged.py' \
            'configs/workflows/b012-qwen-raw-code-recovery-staged.yml' \
            'evidence/mstr-000b/B012-qwen-staged-recovery-topology.md' \
            'tests/contract/test_b012_qwen_staged_recovery_topology.py')
          [[ "$(git diff --name-only "$BASE...$HEAD" | sort)" == "$expected" ]]
          git diff --quiet "$BASE" "$HEAD" -- .github/workflows/b012-qwen-raw-code-recovery.yml
          git diff --quiet "$BASE" "$HEAD" -- artifacts/manifests/B012-executor-toolchain-binding.json
      - name: Exact-main B012 eligibility and formatter baseline
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/b012.json',encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['superseded'] is False
          PY
          set +e
          python -m ruff format --check --diff . > /tmp/base-format.diff 2>&1
          code=$?
          set -e
          [[ "$code" -eq 1 ]]
      - name: Prove hash binding, drift guards, and focused contracts
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD"
          python -m pytest -q tests/contract/test_b012_qwen_staged_recovery_topology.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path('artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json').read_text())
          s=Path(m['staged_script_path'])
          w=Path(m['staged_workflow_spec_path'])
          assert hashlib.sha256(s.read_bytes()).hexdigest()==m['staged_script_sha256']
          assert hashlib.sha256(w.read_bytes()).hexdigest()==m['staged_workflow_sha256']
          text=s.read_text()
          assert text.count('_require_same_main(repo_root, state)') >= 3
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['authority_boundary']['retry_authority_created'] is False
          assert m['authority_boundary']['external_dispatch_authority_created'] is False
          PY
      - name: Fresh full repository quality and formatter regression guard
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          python -m ruff format --check colab/mstr_b012_qwen_raw_code_recovery_staged.py tests/contract/test_b012_qwen_staged_recovery_topology.py
          set +e
          python -m ruff format --check --diff . > /tmp/head-format.diff 2>&1
          code=$?
          set -e
          [[ "$code" -eq 1 ]]
          python - <<'PY'
          from pathlib import Path
          def paths(path):
              out=set()
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.startswith('--- '): out.add(line[4:].split(':cell ',1)[0])
              return out
          base=paths('/tmp/base-format.diff'); head=paths('/tmp/head-format.diff')
          assert base
          assert not (head-base), f'new formatter debt: {sorted(head-base)}'
          PY
      - name: Final immutable live guard
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$BASE" ]]
          [[ "$(git ls-remote origin refs/heads/fix/b012-qwen-staged-recovery-topology | cut -f1)" == "$HEAD" ]]
          echo 'PR194_QUALIFICATION_V2=PASS'
          echo 'MODEL_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
