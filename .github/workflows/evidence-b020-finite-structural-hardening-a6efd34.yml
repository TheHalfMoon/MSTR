name: Harden B020 structural numeric finiteness

on:
  push:
    branches:
      - evidence/b020-finite-structural-hardening-a6efd34

permissions:
  contents: write

env:
  EXPECTED_MAIN: ef90e96ba3d4e2c253987d1d104e0de26ce93529
  EXPECTED_OLD_HEAD: a6efd344fcd68f99be9a9a98eeff9b537be14e9f
  TARGET_BRANCH: feat/000b-b020-difficulty-calibration-contract

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6efd344fcd68f99be9a9a98eeff9b537be14e9f
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable baseline and materialize hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_OLD_HEAD"
          python - <<'PY'
          from pathlib import Path

          source = Path('src/mstr_qualify/schemas.py')
          text = source.read_text(encoding='utf-8')
          anchor = '    failure_distribution = instance.get("failure_distribution")\n'
          insertion = '''    structural_features = instance.get("structural_features")
    if isinstance(structural_features, dict):
        for key, value in structural_features.items():
            if (
                isinstance(value, (int, float))
                and not isinstance(value, bool)
                and not math.isfinite(float(value))
            ):
                errors.append(
                    f"$.structural_features[{key!r}]: numeric value must be finite"
                )

    failure_distribution = instance.get("failure_distribution")
'''
          if text.count(anchor) != 1:
              raise SystemExit('B020 structural-feature insertion anchor is not unique')
          source.write_text(text.replace(anchor, insertion, 1), encoding='utf-8')

          test_path = Path('tests/contract/test_difficulty_calibration_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          test_anchor = '''def test_b020_non_finite_probability_fails_closed() -> None:
    value = fixture()
    value["estimated_solve_probability"] = math.nan
    assert any("must be finite" in item for item in errors(value))


'''
          test_insertion = test_anchor + '''def test_b020_non_finite_structural_numeric_feature_fails_closed() -> None:
    for non_finite in (math.nan, math.inf, -math.inf):
        value = fixture()
        value["structural_features"]["numeric_probe"] = non_finite
        assert any("numeric value must be finite" in item for item in errors(value))


'''
          if tests.count(test_anchor) != 1:
              raise SystemExit('B020 structural-feature test anchor is not unique')
          test_path.write_text(tests.replace(test_anchor, test_insertion, 1), encoding='utf-8')

          evidence_path = Path('evidence/mstr-000b/B020-difficulty-contract.md')
          evidence = evidence_path.read_text(encoding='utf-8')
          evidence_anchor = '`structural_features` is a non-empty flat descriptor map. B020 records evidence shape only; it does not prescribe a learned feature extractor, execute a student model, or calibrate a real checkpoint.\n'
          evidence_replacement = '`structural_features` is a non-empty flat descriptor map. Numeric feature values must be finite; `NaN` and infinities fail closed. B020 records evidence shape only; it does not prescribe a learned feature extractor, execute a student model, or calibrate a real checkpoint.\n'
          if evidence.count(evidence_anchor) != 1:
              raise SystemExit('B020 evidence hardening anchor is not unique')
          evidence_path.write_text(evidence.replace(evidence_anchor, evidence_replacement, 1), encoding='utf-8')
          PY
          ruff format src/mstr_qualify/schemas.py tests/contract/test_difficulty_calibration_contract.py
          ruff check --fix src/mstr_qualify/schemas.py tests/contract/test_difficulty_calibration_contract.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            evidence/mstr-000b/B020-difficulty-contract.md
            src/mstr_qualify/schemas.py
            tests/contract/test_difficulty_calibration_contract.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
      - name: Re-run focused and full quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_difficulty_calibration_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src
          cmp schemas/mstr-difficulty-calibration-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-difficulty-calibration-v0.schema.json
      - name: Commit and fast-forward exact feature head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_OLD_HEAD"
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add evidence/mstr-000b/B020-difficulty-contract.md src/mstr_qualify/schemas.py tests/contract/test_difficulty_calibration_contract.py
          git commit -m "fix(mstr-000b): reject non-finite B020 structural features"
          candidate=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_OLD_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$candidate"
          echo "B020_HARDENED_HEAD=$candidate"
