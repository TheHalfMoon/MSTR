name: B001 reconcile current main

on:
  push:
    branches:
      - evidence/b001-reconcile-c2d0

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_B001_HEAD: 7e3d2e9b3c318ffaf186acdb9ed9ddcdcc835ea6
      EXPECTED_MAIN: c2d0ee8a6b9d47275c4d309cd187c1ed0d35fb02
      TARGET_BRANCH: feat/000b-b001-task-contracts
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout guarded B001 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact branch and main identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_B001_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Merge canonical main and resolve readiness truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-ff --no-commit "$EXPECTED_MAIN"
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md"
            git checkout --ours specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md
            git add specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path("specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md")
          text = path.read_text(encoding="utf-8")
          old = "- [x] Live main/open PRs reconciled. B001 implementation re-read exact live `main` and the open PR set before mutation; pre-merge drift was re-reconciled after B005 moved `main` to `ead69ae26265b133c782ae8fd2795c126253a3b6`."
          new = "- [x] Live main/open PRs reconciled. B001 implementation re-read exact live `main` and the open PR set before mutation; drift was re-reconciled through A004 canonical closeout on `main` `c2d0ee8a6b9d47275c4d309cd187c1ed0d35fb02`, while preserving the already-canonical B005 readiness checks."
          if text.count(old) != 1:
              raise SystemExit("expected B001 readiness reconciliation line exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git add specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git diff --cached --check

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify all frozen gates on reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check src tests
          mypy
          python -m mstr_qualify validate

      - name: Commit merge and verify PR scope
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "merge(main): reconcile B001 with canonical A004 closeout"
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            evidence/mstr-000b/B001-task-contract.md \
            schemas/mstr-task-eligibility-v0.schema.json \
            schemas/mstr-task-node-v0.schema.json \
            specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md \
            specs/002-code-model-supremacy-foundation/contracts/README.md \
            specs/002-code-model-supremacy-foundation/contracts/mstr-task-eligibility-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-task-node-v0.schema.json \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/schemas.py \
            tests/contract/test_schemas.py \
            tests/contract/test_task_contracts.py \
            tests/fixtures/mstr-000b/B001/task-node-fail-closed.json \
            tests/fixtures/schemas/invalid/mstr-task-eligibility-v0.json \
            tests/fixtures/schemas/invalid/mstr-task-node-v0.json \
            tests/fixtures/schemas/valid/mstr-task-eligibility-v0.json \
            tests/fixtures/schemas/valid/mstr-task-node-v0.json \
            tests/integration/test_cli_offline.py | sort)"
          test "$actual" = "$expected"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "NEW_B001_HEAD=$(git rev-parse HEAD)"
