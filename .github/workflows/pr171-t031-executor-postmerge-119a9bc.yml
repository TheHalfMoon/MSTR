name: PR171 T031 executor postmerge verification

on:
  push:
    branches:
      - evidence/pr171-t031-executor-postmerge-119a9bc

permissions:
  contents: read
  pull-requests: read

env:
  REPO: TheHalfMoon/MSTR
  PR_NUMBER: "171"
  PREVIOUS_MAIN: 891af2215a2244a6a0912d49d782f42bcc38b6ef
  MERGED_HEAD: 0b25193c160a16750294977f225dca421bc5d211
  MERGE_SHA: 119a9bcca1c97b9edbcacd6d8d457b31206bb162
  MERGE_TREE: f3cd47b76a0e837c3f9357fa62d566d5b1e4a9cc

jobs:
  canonical_identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify merge topology main identity and binding hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git rev-parse HEAD^1)" = "$PREVIOUS_MAIN"
          test "$(git rev-parse HEAD^2)" = "$MERGED_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MERGE_SHA"
          pr="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")"
          python - "$pr" <<'PY'
          import json, os, sys
          p=json.loads(sys.argv[1])
          assert p['state']=='closed'
          assert p['merged_at'] is not None
          assert p['merge_commit_sha']==os.environ['MERGE_SHA']
          assert p['head']['sha']==os.environ['MERGED_HEAD']
          PY
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          b=json.loads(Path('artifacts/manifests/T031-executor-toolchain-binding.json').read_text())
          pairs=[
            ('artifacts/manifests/T031-executor-toolchain-lock.json','toolchain_lock_sha256'),
            ('colab/mstr_executor_toolchain.py','toolchain_helper_sha256'),
            ('colab/mstr_t031_governance.py','governance_script_sha256'),
            ('colab/mstr_t031_source.py','source_script_sha256'),
            ('colab/mstr_t031_artifacts.py','artifact_script_sha256'),
            ('colab/mstr_t031_measure.py','measurement_script_sha256'),
            ('colab/mstr_t031_execute.py','executor_script_sha256'),
            ('.github/workflows/t031-measure.yml','workflow_sha256'),
          ]
          for path,key in pairs:
            actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
            assert actual==b[key], (path,actual,b[key])
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          assert b['execution_boundary']['authority_transfer'] is False
          assert b['execution_boundary']['training'] is False
          assert b['execution_boundary']['b012_execution'] is False
          assert b['execution_boundary']['t032_execution'] is False
          assert b['execution_boundary']['t033_execution'] is False
          assert b['execution_boundary']['t034_admission_decision'] is False
          assert b['measurement_protocol']['hosted_lane_claim']=='AUTHORIZED_EPHEMERAL_REFERENCE_NOT_U1_8GB_HARDWARE_CLAIM'
          PY
          workflow="$(cat .github/workflows/t031-measure.yml)"
          grep -F 'issue_comment:' <<<"$workflow"
          ! grep -F 'workflow_dispatch:' <<<"$workflow"
          ! grep -E '^  push:' <<<"$workflow"
          grep -F "github.event.issue.number == 167" <<<"$workflow"
          grep -F "github.event.comment.author_association == 'OWNER'" <<<"$workflow"
          grep -F 'ref: main' <<<"$workflow"
          echo 'MODEL_ACCESS=NONE'

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Re-run canonical main quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check colab/mstr_executor_toolchain.py colab/mstr_t031_artifacts.py colab/mstr_t031_execute.py colab/mstr_t031_governance.py colab/mstr_t031_measure.py colab/mstr_t031_source.py tests/contract/test_t031_executor_binding.py
          python -m mypy src/mstr_qualify
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test -z "$(git status --porcelain)"

  final_postmerge:
    needs: [canonical_identity, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm canonical dispatch precondition
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/branches/main" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$main_sha" = "$MERGE_SHA"
          echo "POSTMERGE_VERDICT=PASS"
          echo "CANONICAL_MAIN=$MERGE_SHA"
          echo "T031_EXECUTOR_BINDING=CANONICAL"
          echo "DISPATCH_PRECONDITION=SATISFIED"
          echo "MODEL_ACCESS=NONE"
