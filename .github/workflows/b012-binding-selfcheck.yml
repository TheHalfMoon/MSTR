name: B012 executor binding self-check

on:
  push:
    branches:
      - feat/b012-executor-toolchain-binding

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact binding head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact B012 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify exact main ancestry and materialized binding
        env:
          EXPECTED_MAIN: 603a6865fdbf5a5434565e870d73054c5b574f2a
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          python - <<'PY'
          from pathlib import Path
          from mstr_b012_governance import _require_binding

          binding, envelope, lock = _require_binding(Path("."))
          assert binding["task_id"] == "B012"
          assert binding["status"] == "SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL"
          assert binding["candidate_ids"] == ["mellum-4b", "qwen3.5-0.8b-control"]
          assert binding["resolution_evidence"]["model_access"] == "NONE"
          assert binding["resolution_evidence"]["training"] is False
          assert binding["resolution_evidence"]["paid_cost_usd"] == 0.0
          assert binding["execution_boundary"]["authority_transfer"] is False
          assert binding["execution_boundary"]["training"] is False
          assert binding["execution_boundary"]["new_candidates"] is False
          assert binding["source_integrity"]["aggregate_required_source_download_bytes"] == 9817996174
          assert envelope["candidate_ids"] == binding["candidate_ids"]
          assert lock["task_id"] == "B012"
          print("B012_MATERIALIZED_BINDING_SELF_CHECK=PASS")
          print("MODEL_ACCESS=NONE")
          print("TRAINING=false")
          print("PAID_COST_USD=0.0")
          PY
