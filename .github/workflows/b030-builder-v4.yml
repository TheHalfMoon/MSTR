name: Qualify B030 contract builder v4

on:
  push:
    branches:
      - evidence/b030-builder-v4-2d19b62

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_MAIN: 2d19b6296d550b5b60c1b511d71c6ce86a38d195
      CANDIDATE_HEAD: 24cb6199dd5b3c4b9fcb45eed46d00c24cc1f2f8
      EXPECTED_TREE: 857b7d61e7b15ce12afaf47c2edaefe15a21d0dc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove exact base, head, tree, and five-file scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git merge-base "$EXPECTED_MAIN" "$CANDIDATE_HEAD")" = "$EXPECTED_MAIN"
          test "$(git rev-list --count "$EXPECTED_MAIN".."$CANDIDATE_HEAD")" = "3"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_MAIN"..."$CANDIDATE_HEAD" > /tmp/files.txt
          cat > /tmp/expected.txt <<'EOF'
          evidence/mstr-000b/B030-long-horizon-quality.md
          schemas/mstr-repository-health-delta-v0.schema.json
          specs/002-code-model-supremacy-foundation/contracts/mstr-repository-health-delta-v0.schema.json
          tests/contract/test_repository_health_delta_contract.py
          tests/fixtures/schemas/valid/mstr-repository-health-delta-v0.json
          EOF
          diff -u /tmp/expected.txt /tmp/files.txt
      - name: Re-prove canonical B030 eligibility on canonical main
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_MAIN"
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          mstr-qualify task eligible B030 > /tmp/b030.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .reasons == [] and .authority_result.required == false' /tmp/b030.json >/dev/null
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json >/dev/null
      - name: Return to exact candidate and install candidate tooling
        run: |
          set -euo pipefail
          git checkout --detach "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          python -m pip install -e '.[dev]'
      - name: Parse and meta-validate B030 schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          runtime = Path('schemas/mstr-repository-health-delta-v0.schema.json')
          design = Path('specs/002-code-model-supremacy-foundation/contracts/mstr-repository-health-delta-v0.schema.json')
          assert runtime.read_bytes() == design.read_bytes()
          schema = json.loads(runtime.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          PY
      - name: Focused B030 contract suite
        run: pytest -q tests/contract/test_repository_health_delta_contract.py
      - name: Offline validation
        run: mstr-qualify validate
      - name: Full test suite
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: Canonical mypy
        run: mypy src
      - name: Final immutable recheck
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/000b-b030-repository-health-delta | cut -f1)" = "$CANDIDATE_HEAD"
