name: Qualify exact B006 closeout 872a86d

on:
  push:
    branches: [evidence/b006-closeout-qualify-872a86d]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: c96e2fb228a7f3fb0399484a9e6bb1e1d1eb086c
      EXPECTED_HEAD: 872a86db052af21e29aa680255ccf8bcb2d2505b
      TARGET_BRANCH: docs/000b-b006-canonicalize
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/000b-b006-canonicalize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact identities and five-file containment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git branch -f main "$EXPECTED_MAIN"
          changed="$(git diff --name-only "$EXPECTED_MAIN"..."$EXPECTED_HEAD" | sort)"
          expected="$(printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/candidates/B006-candidate-reconciliation.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort)"
          test "$changed" = "$expected"
          git diff --check "$EXPECTED_MAIN"..."$EXPECTED_HEAD"
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/task-gate/mstr-000b.json').read_text())
          assert cfg['tasks']['B006']['canonical_state']=='COMPLETE_CANONICAL'
          assert cfg['tasks']['B007']['canonical_state']=='PENDING'
          assert cfg['tasks']['B007']['prerequisites']==['B006']
          tasks=Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text()
          assert '- [x] **B006 Create/reconcile candidate records for newly relevant code-specialized models.**' in tasks
          assert 'Canonical implementation: PR #57 / final head `98b549e9d8b2550725861e133ee8f909690dc9c8` / merge `c96e2fb228a7f3fb0399484a9e6bb1e1d1eb086c`.' in tasks
          ev=Path('evidence/mstr-000b/candidates/B006-candidate-reconciliation.md').read_text()
          for required in (
              '**State:** COMPLETE_CANONICAL',
              '**Implementation PR:** `#57`',
              '**Final implementation head:** `98b549e9d8b2550725861e133ee8f909690dc9c8`',
              '**Canonical implementation merge:** `c96e2fb228a7f3fb0399484a9e6bb1e1d1eb086c`',
              'B007_MATERIAL_EXECUTION = NOT_STARTED',
          ):
              assert required in ev, required
          print('B006_CLOSEOUT_SCOPE_AND_IDENTITY=PASS')
          PY
      - name: Install and prove terminal-successor semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python - <<'PY'
          import os
          from mstr_qualify.task_gate import evaluate_task_snapshot
          main=os.environ['EXPECTED_MAIN']
          b6=evaluate_task_snapshot('B006', canonical_main=main)
          b7=evaluate_task_snapshot('B007', canonical_main=main)
          assert b6['eligible'] is False, b6
          assert b6['state_consistency_result']['observed_state']=='COMPLETE_CANONICAL', b6
          assert 'task.already_terminal' in b6['reasons'], b6
          assert b7['eligible'] is True and b7['reasons']==[], b7
          assert b7['prerequisite_results'][0]['task_id']=='B006'
          assert b7['prerequisite_results'][0]['satisfied'] is True
          print('B006_TERMINAL=PASS')
          print('B007_SUCCESSOR_ELIGIBLE=PASS')
          PY
      - name: Frozen repository gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
      - name: Final immutability guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo B006_CLOSEOUT_EXACT_HEAD_QUALIFICATION=PASS
