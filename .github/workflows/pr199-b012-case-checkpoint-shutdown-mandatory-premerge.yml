name: PR199 B012 case-checkpoint shutdown mandatory premerge

on:
  push:
    branches:
      - evidence/pr199-b012-case-checkpoint-shutdown-mandatory-premerge-e02653b

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPO: TheHalfMoon/MSTR
      PR: '199'
      BASE: 145be15a32448d00fada0e2d9bf736f265c942a1
      HEAD: e02653b8b3b87100a9a8a5b5122a15636634c52b
      TREE: dbe5f46cc4f8ef3179f8ea1180f63ee5d5929cfb
      SUBJECT_BRANCH: governance/b012-qwen-case-checkpoint-runner-shutdown-34265475666
      QUAL_RUN: '34273248053'
      QUAL_HEAD: 54c4bbb019877433879a861adbeb8a6e3681f3d7
      REVIEW_RUN: '34273792833'
      REVIEW_HEAD: c346970efe2b24cbe3e266eb6fbc032edc3e64d5
      INCIDENT_SHA256: e03d0030cb500a2fc97ec3a2f66c17b463028582643d9169c7be6994bc955152
      FAILURE_CLASS: B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_PARTIAL_DURABLE_PROGRESS_RAW_CODE_UNPROVEN
      BLOCKED_STATUS: BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Reverify immutable PR qualification and review chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$SUBJECT_BRANCH)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git rev-list --count "$BASE..$HEAD")" = "17"

          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
            mergeable=$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' /tmp/pr.json)
            [[ "$mergeable" != unknown ]] && break
            sleep 2
          done
          jq -e --arg b "$BASE" --arg h "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.ref=="main" and .base.sha==$b and .head.sha==$h and .changed_files==14' /tmp/pr.json >/dev/null

          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          jq -e --arg q "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$q and .run_attempt==1' /tmp/qual.json >/dev/null
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/review.json
          jq -e --arg r "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$r and .run_attempt==1' /tmp/review.json >/dev/null

      - name: Prove review state has no blockers
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" > /tmp/reviews.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/reviews.json', encoding='utf-8'))
          assert all(x.get('state') != 'CHANGES_REQUESTED' for x in data)
          print(f'SUBMITTED_REVIEWS={len(data)}')
          PY
          gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}pageInfo{hasNextPage}}}}}' \
            -f owner=TheHalfMoon -f repo=MSTR -F number=199 > /tmp/threads.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/threads.json', encoding='utf-8'))['data']['repository']['pullRequest']['reviewThreads']
          assert d['pageInfo']['hasNextPage'] is False
          assert all(x['isResolved'] is True for x in d['nodes'])
          print(f'REVIEW_THREADS={len(d["nodes"])}')
          PY

      - name: Prove exact incident-only scope and frozen execution surfaces
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            'artifacts/manifests/B012-executor-toolchain-binding.json'
            'artifacts/results/equivalent/B012/checkpoints/34265475666/B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json'
            'artifacts/results/equivalent/B012/checkpoints/34265475666/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-01-init.json'
            'artifacts/results/equivalent/B012/checkpoints/34265475666/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-02-source.json'
            'artifacts/results/equivalent/B012/checkpoints/34265475666/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-03-quantize.json'
            'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-case-checkpoint-recovery-run-34265475666.json'
            'evidence/mstr-000b/B012-qwen-case-checkpoint-recovery-runner-shutdown-34265475666.md'
            'tests/contract/test_b012_executor_binding.py'
            'tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py'
            'tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py'
            'tests/contract/test_b012_qwen_raw_code_recovery.py'
            'tests/contract/test_b012_qwen_staged_recovery_topology.py'
            'tests/contract/test_b012_runner_shutdown_evidence.py'
            'tests/contract/test_b012_stage_checkpoint_topology.py'
          )
          [[ ${#actual[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done
          git diff --check "$BASE...$HEAD"
          test -z "$(git diff --name-only "$BASE...$HEAD" -- '.github/workflows/**' 'colab/**' 'src/**' 'benchmarks/manifests/**' 'configs/workflows/**' 'artifacts/authorities/**')"

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reprove B012 exact-main machine eligibility and authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B012 > /tmp/eligibility.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/eligibility.json', encoding='utf-8'))
          assert d['schema_version']=='mstr.task-eligibility.v0'
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['required'] is True
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['state_consistency_result']['satisfied'] is True
          assert d['supersession_result']['satisfied'] is True
          assert all(x['satisfied'] and x['reasons']==[] for x in d['prerequisite_results'])
          assert all(d['semantic_checks'].values())
          print('B012_EXACT_MAIN_ELIGIBILITY=PASS')
          PY
          git checkout --detach "$HEAD"

      - name: Reprove incident fail-closed semantics and exact hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('artifacts/results/equivalent/B012')
          incident=root/'failures/B012-qwen3.5-0.8b-control-raw-code-case-checkpoint-recovery-run-34265475666.json'
          cp=root/'checkpoints/34265475666'
          paths=[
            cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-01-init.json',
            cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-02-source.json',
            cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-03-quantize.json',
            cp/'B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json',
          ]
          expected=[
            'fabc44925fdb8243d5eeca856b6e9b5fd83db54c4dc9cca27967409382721fb4',
            '38f9693bd55f77f8634ce01dec0e932e990790735399ade55f0a4230bdbf585e',
            'ed15864153a8e4b26fffca5298dcbd80763e9c7edd0106845555b8325b079205',
            'e5accce8487556a649db0c147a3c5876c0b31f8c1c0b334e48510f3680f58733',
          ]
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(incident)==os.environ['INCIDENT_SHA256']
          for p,d in zip(paths,expected): assert sha(p)==d, p
          i=json.loads(incident.read_text(encoding='utf-8'))
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text(encoding='utf-8'))
          assert i['failure_classification']==os.environ['FAILURE_CLASS']
          assert i['canonical_main_at_start']==os.environ['BASE']
          assert i['durable_stages']==['init','source','quantize']
          assert i['durable_raw_code_case_count']==0
          assert i['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert i['candidate_execution_completion']=='NOT_PROVEN'
          assert i['candidate_admission_decision']=='NONE'
          assert i['model_quality_verdict']=='NONE'
          assert i['ephemeral_cleanup_completion']=='NOT_PROVEN'
          assert i['separate_topology_repair_required'] is True
          assert i['paid_cost_usd']==0.0
          for key in ('training','paid_model_api','candidate_expansion','revision_or_file_expansion','retry_authority_created','external_dispatch_authority_created','same_case_checkpoint_topology_redispatch_authorized_by_this_evidence','cross_run_resume_authority_created'):
              assert i[key] is False, key
          assert b['status']==os.environ['BLOCKED_STATUS']
          s=b['qwen_raw_code_case_checkpoint_runner_shutdown']
          assert s['run_id']==34265475666
          assert s['failure_evidence_sha256']==os.environ['INCIDENT_SHA256']
          assert s['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert s['model_quality_verdict']=='NONE'
          assert s['candidate_execution_completion']=='NOT_PROVEN'
          assert s['ephemeral_cleanup_completion']=='NOT_PROVEN'
          for key in ('retry_authority_created','external_dispatch_authority_created','same_case_checkpoint_topology_redispatch_authorized_by_this_evidence','cross_run_resume_authority_created'):
              assert s[key] is False, key
          print('INCIDENT_FAIL_CLOSED=PASS')
          PY

      - name: Mandatory repository quality
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mypy src/mstr_qualify

      - name: Final guarded-merge readiness proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/final-qual.json
          jq -e --arg q "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$q and .run_attempt==1' /tmp/final-qual.json >/dev/null
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/final-review.json
          jq -e --arg r "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$r and .run_attempt==1' /tmp/final-review.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/final-pr.json
          jq -e --arg b "$BASE" --arg h "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$b and .head.sha==$h and .changed_files==14' /tmp/final-pr.json >/dev/null
          echo 'PR199_MANDATORY_PREMERGE=SUCCESS'
