name: PR170 T031 authority independent semantic security review

on:
  push:
    branches:
      - evidence/pr170-t031-authority-independent-review-7e122ef

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  REPO: TheHalfMoon/MSTR
  PR_NUMBER: "170"
  BASE_SHA: 81639ff15e31d7f6a3b8aeaa7ceae4b80b009feb
  TARGET_HEAD: 7e122ef13ab3ec8478bded2c15fffb693f37310d
  TARGET_TREE: eb65a0b673aea94266c7d5ed43c69e9ea3b65bfc
  QUALIFICATION_RUN: "33986311560"
  QUALIFICATION_EVIDENCE_HEAD: afd72eeb392bff12e5ec88009309c016f0a69f50

jobs:
  semantic_security_governance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed authority head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify T031 authority provenance and containment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" "$TARGET_HEAD")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..$TARGET_HEAD")" -eq 1
          git diff --check "$BASE_SHA...$TARGET_HEAD"
          changed="$(git diff --name-only "$BASE_SHA...$TARGET_HEAD" | sort)"
          expected="$(printf '%s\n' artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json artifacts/manifests/T031-local-measurement-execution-envelope.json tests/contract/test_t031_authority.py | sort)"
          test "$changed" = "$expected"

          qual_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runs/$QUALIFICATION_RUN")"
          python - "$qual_json" <<'PY'
          import json, os, sys
          run = json.loads(sys.argv[1])
          assert run['status'] == 'completed'
          assert run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['QUALIFICATION_EVIDENCE_HEAD']
          PY
          git show "$QUALIFICATION_EVIDENCE_HEAD:.github/workflows/pr170-t031-authority-qualification-7e122ef.yml" | grep -F "TARGET_HEAD: $TARGET_HEAD"
          git show "$QUALIFICATION_EVIDENCE_HEAD:.github/workflows/pr170-t031-authority-qualification-7e122ef.yml" | grep -F "TARGET_TREE: $TARGET_TREE"
          git show "$QUALIFICATION_EVIDENCE_HEAD:.github/workflows/pr170-t031-authority-qualification-7e122ef.yml" | grep -F "BASE_SHA: $BASE_SHA"

          decision_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/issues/comments/5553875809")"
          python - "$decision_json" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])['body']
          assert 'FOUNDER_T031_LOCAL_MEASUREMENT_DECISION=AUTHORIZE_EXACT_T029_CANDIDATES' in body
          assert 'exactly the eight canonical T029 candidates/revisions' in body
          assert 'zero-USD regeneration/measurement boundaries' in body
          assert 'creates no authority for B012, B010/B012 candidates, T032, T033, T034' in body
          assert 'training or weight-changing operations' in body
          assert 'paid compute/API use' in body
          assert 'Git model binaries' in body
          assert 'founder-machine model binaries' in body
          PY

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def load(path: str):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def digest(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          authority_path = 'artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json'
          envelope_path = 'artifacts/manifests/T031-local-measurement-execution-envelope.json'
          t027_path = 'artifacts/manifests/T027-weight-access.json'
          t028_path = 'artifacts/manifests/T028-network-scope-addendum.json'
          t029_path = 'artifacts/manifests/quantization/T029-q4-profiles.json'
          runtime_path = 'configs/runtimes/llama-cpp-cpu.json'
          b012_path = 'artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json'

          authority = load(authority_path)
          envelope = load(envelope_path)
          t027 = load(t027_path)
          t028 = load(t028_path)
          t029 = load(t029_path)
          b012 = load(b012_path)
          scope = authority['scope']

          ids = [
              'granite-4.1-3b',
              'ministral-3-3b',
              'qwen2.5-coder-1.5b',
              'qwen3-4b',
              'qwen3.5-2b',
              'qwen3.5-4b',
              'smollm3-3b',
              'yi-coder-1.5b',
          ]
          b012_ids = ['mellum-4b', 'qwen3.5-0.8b-control']

          assert authority['authority_id'] == 'T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION'
          assert authority['task_id'] == 'T031'
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['external_effect_class'] == 'MODEL_WEIGHT_ACCESS'
          assert scope['decision'] == 'FOUNDER_T031_LOCAL_MEASUREMENT_DECISION=AUTHORIZE_EXACT_T029_CANDIDATES'
          assert scope['decision_surface'] == {'issue': 167, 'comment_id': 5553875809}
          assert scope['candidate_ids'] == ids
          assert scope['bounded_execution_envelope']['path'] == envelope_path
          assert scope['bounded_execution_envelope']['sha256'] == digest(envelope_path)
          assert scope['bounded_execution_envelope']['dispatch_state'] == 'BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING'

          false_keys = (
              'b010_b012_candidates',
              'candidate_revision_or_file_expansion',
              'gated_terms_acceptance',
              'git_model_binaries',
              'large_dataset_ingestion',
              'new_candidates',
              'paid_compute',
              'paid_model_api',
              'production_release',
              't032_execution',
              't033_execution',
              't034_admission_decision',
              'training',
              'weight_changing_training',
          )
          for key in false_keys:
              assert scope[key] is False, key
          assert scope['founder_machine_large_artifacts'] == 0

          assert envelope['authority_id'] == authority['authority_id']
          assert envelope['task_id'] == 'T031'
          assert envelope['candidate_ids'] == ids
          assert envelope['canonical_entry_main'] == '81639ff15e31d7f6a3b8aeaa7ceae4b80b009feb'
          assert envelope['dispatch_state'] == 'BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING'
          assert envelope['toolchain_provisioning']['state'] == 'BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING'
          assert envelope['durable_outputs_only'] is True
          assert envelope['measurement_contract']['contexts'] == [4096, 8192, 16384]
          assert envelope['measurement_contract']['measurements'] == [
              'artifact_bytes', 'load_behavior', 'memory_behavior', 'paging_behavior',
              'prefill_behavior', 'decode_behavior'
          ]
          assert envelope['resource_ceiling']['paid_cost_usd'] == 0.0
          assert envelope['resource_ceiling']['paid_compute'] is False
          assert envelope['resource_ceiling']['paid_model_api'] is False
          assert envelope['resource_ceiling']['gpu_layers'] == 0
          assert envelope['runner_envelope']['runner_class'] == 'GITHUB_HOSTED_EPHEMERAL'
          assert envelope['runner_envelope']['runs_on'] == 'ubuntu-24.04'
          assert envelope['runner_envelope']['max_parallel_candidates'] == 1
          assert envelope['runner_envelope']['founder_machine_model_binaries'] == 0
          assert envelope['runner_envelope']['git_model_binaries'] == 0

          network = envelope['model_artifact_network']
          assert network['https_get_only'] is True
          assert network['hosts'] == ['huggingface.co', 'us.aws.cdn.hf.co']
          for key in ('abort_on_authentication_requirement', 'abort_on_gated_terms', 'abort_on_payment', 'abort_on_unlisted_redirect'):
              assert network[key] is True, key

          prohibited = set(envelope['prohibited_operations'])
          required_prohibited = {
              'B010_OR_B012_CANDIDATES', 'NEW_CANDIDATES', 'CANDIDATE_REVISION_OR_FILE_EXPANSION',
              'T032_EXECUTION', 'T033_EXECUTION', 'T034_ADMISSION_DECISION',
              'WEIGHT_CHANGING_TRAINING', 'TRAINING', 'LARGE_SCALE_RL',
              'LARGE_OR_PRIVATE_DATASET_INGESTION', 'PAID_COMPUTE', 'PAID_MODEL_API',
              'GATED_TERMS_ACCEPTANCE', 'ACCOUNT_REQUIRED_MODEL_ACCESS', 'PRODUCTION_RELEASE',
              'GIT_MODEL_BINARIES', 'FOUNDER_MACHINE_MODEL_BINARIES'
          }
          assert required_prohibited <= prohibited

          source = envelope['source_identity']
          assert source['t027_manifest']['path'] == t027_path
          assert source['t027_manifest']['sha256'] == digest(t027_path)
          assert source['t028_network_addendum']['path'] == t028_path
          assert source['t028_network_addendum']['sha256'] == digest(t028_path)
          assert t028['amends_manifest']['path'] == t027_path
          assert t028['amends_manifest']['sha256'] == digest(t027_path)
          assert t028['observed_redirect_hosts'] == ['huggingface.co', 'us.aws.cdn.hf.co']
          assert t028['added_hosts'] == ['us.aws.cdn.hf.co']

          t027_by_id = {item['candidate_id']: item for item in t027['candidates']}
          q4_by_id = {item['candidate_id']: item for item in t029['profiles']}
          source_by_id = {item['candidate_id']: item for item in source['candidate_sources']}
          assert set(source_by_id) == set(ids)
          assert set(ids) <= set(t027_by_id)
          assert set(q4_by_id) == set(ids)

          aggregate = 0
          for candidate_id in ids:
              src = source_by_id[candidate_id]
              frozen = t027_by_id[candidate_id]
              q4 = q4_by_id[candidate_id]
              assert src['exact_model_id'] == frozen['exact_model_id']
              assert src['exact_revision'] == frozen['exact_revision']
              assert src['required_artifact_files'] == frozen['required_artifact_files']
              assert src['expected_file_integrity'] == frozen['expected_file_integrity']
              assert src['expected_total_download_bytes'] == frozen['expected_total_download_bytes']
              assert src['account_required'] is False
              assert src['authentication_required'] is False
              assert src['gated_access'] is False
              assert src['terms_acceptance_required'] is False
              assert src['q4_profile'] == q4
              assert q4['result_classification'] == 'Q4_PROFILE_READY'
              assert q4['resource_cost'] == 'USD 0.00'
              assert q4['llama_cpp_commit'] == 'fc35562ba46fbbf8e30cac85edbb39642c37d248'
              assert set(q4['quantization_arms']) == {'Q4_K_M', 'Q4_K_S'}
              aggregate += src['expected_total_download_bytes']

          assert aggregate == 48742940294
          assert envelope['resource_ceiling']['aggregate_required_source_download_bytes'] == aggregate
          assert envelope['q4_identity']['t029_profile_manifest']['path'] == t029_path
          assert envelope['q4_identity']['t029_profile_manifest']['sha256'] == digest(t029_path)
          assert envelope['q4_identity']['llama_cpp_commit'] == 'fc35562ba46fbbf8e30cac85edbb39642c37d248'
          assert set(envelope['q4_identity']['required_arms']) == {'Q4_K_M', 'Q4_K_S'}
          assert envelope['runtime_identity']['profile']['path'] == runtime_path
          assert envelope['runtime_identity']['profile']['sha256'] == digest(runtime_path)
          assert envelope['runtime_identity']['llama_cpp_commit'] == '3173a56471c1753650cd806694145ffd6dcace67'
          assert envelope['runtime_identity']['runtime_id'] == 'llama.cpp-llama-bench-cpu'
          assert envelope['runtime_identity']['device'] == 'none'
          assert envelope['runtime_identity']['gpu_layers'] == 0

          assert b012['authority_id'] == 'B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert b012['scope']['candidate_ids'] == b012_ids
          assert set(ids).isdisjoint(b012_ids)
          assert 'mellum-4b' not in source_by_id
          assert 'qwen3.5-0.8b-control' not in source_by_id
          PY

  independent_quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed authority head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Re-run full frozen quality independently
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_authority.py tests/contract/test_b012_authority.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"

  final_review:
    needs: [semantic_security_governance, independent_quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Emit exact-head substantive review verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/branches/main" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          pr_head="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          test "$main_sha" = "$BASE_SHA"
          test "$pr_head" = "$TARGET_HEAD"
          echo "INDEPENDENT_REVIEW_VERDICT=PASS"
          echo "FINDINGS=NONE"
          echo "T031_SCOPE=EXACT_EIGHT_T029_CANDIDATES_ONLY"
          echo "B010_B012_T032_T033_T034_TRAINING=NOT_AUTHORIZED"
          echo "EXTERNAL_EXECUTION=NOT_DISPATCHED"
