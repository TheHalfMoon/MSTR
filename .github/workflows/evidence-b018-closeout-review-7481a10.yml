name: Independent adversarial review of B018 closeout

on:
  push:
    branches:
      - evidence/b018-closeout-review-7481a10

permissions:
  contents: read

env:
  EXPECTED_MAIN: 7e4996e92128e4e02ec6dbcf6ed29eed2b753838
  EXPECTED_HEAD: 7481a10a2394a7f7d81db453327f318615bb1ac6
  TARGET_BRANCH: docs/000b-b018-canonicalize

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7481a10a2394a7f7d81db453327f318615bb1ac6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Bind exact immutable review target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          expected=$(printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B018-self-alignment-contract.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_self_alignment_contract.py \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
      - name: Adversarial governance and authority review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          base_sha = '7e4996e92128e4e02ec6dbcf6ed29eed2b753838'

          def base_text(path: str) -> str:
              return subprocess.check_output(
                  ['git', 'show', f'{base_sha}:{path}'], text=True
              )

          base_cfg = json.loads(base_text('configs/task-gate/mstr-000b.json'))
          head_cfg = json.loads(Path('configs/task-gate/mstr-000b.json').read_text())
          changed = [
              task_id
              for task_id in base_cfg['tasks']
              if base_cfg['tasks'][task_id] != head_cfg['tasks'][task_id]
          ]
          assert changed == ['B018'], changed
          assert base_cfg['tasks']['B018']['canonical_state'] == 'PENDING'
          assert head_cfg['tasks']['B018']['canonical_state'] == 'COMPLETE_CANONICAL'
          for unchanged in ['B011', 'B019', 'B020', 'B022', 'B025']:
              assert head_cfg['tasks'][unchanged] == base_cfg['tasks'][unchanged], unchanged

          evidence = Path('evidence/mstr-000b/B018-self-alignment-contract.md').read_text()
          for required in [
              '**Implementation PR:** #76',
              '**Final implementation head:** `23c83ebae95ca3f0d893840e9d994b33712f124f`',
              '**Canonical implementation merge:** `7e4996e92128e4e02ec6dbcf6ed29eed2b753838`',
              '**State:** COMPLETE_CANONICAL',
              'run `33188891501` — SUCCESS',
              'run `33189093479` / job `98909650689` — SUCCESS',
              'run `33189307397` — SUCCESS',
              'run `33189815147` — SUCCESS',
              'MODEL_WEIGHT_ACCESS = NONE',
              'MODEL_EXECUTION = NONE',
              'LARGE_DATASET_INGESTION = NONE',
              'PAID_COMPUTE = NONE',
              'WEIGHT_CHANGING_TRAINING = NONE',
              'PRODUCTION_RELEASE = NONE',
              'B020_DIFFICULTY_CALIBRATION_AUTHORITY = NONE',
              'B022_VERIFIER_HEALTH_AUTHORITY = NONE',
          ]:
              assert required in evidence, required
          assert 'B011 remains blocked' in evidence
          assert '`7481a10a2394a7f7d81db453327f318615bb1ac6`' not in evidence

          tasks = Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text()
          assert '- [x] **B018 Freeze execution-filtered student self-alignment contract.**' in tasks
          assert (
              'Canonical implementation: PR #76 / final head '
              '`23c83ebae95ca3f0d893840e9d994b33712f124f` / merge '
              '`7e4996e92128e4e02ec6dbcf6ed29eed2b753838`.'
          ) in tasks
          assert '- [ ] **B019 Freeze bounded teacher-rescue policy.**' in tasks
          assert '- [ ] **B020 Freeze checkpoint-relative difficulty calibration contract.**' in tasks
          assert '- [ ] **B022 Freeze `VerifierHealthRecord` contract.**' in tasks
          PY
      - name: Regression and frozen quality review
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_self_alignment_contract.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy
      - name: Final immutable remote recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          echo 'B018_CLOSEOUT_INDEPENDENT_REVIEW=PASS'
          echo 'B011_AUTHORITY_UNCHANGED=PASS'
          echo 'B019_TASK_NODE_UNCHANGED=PASS'
          echo 'B020_B022_AUTHORITY_UNCHANGED=PASS'
