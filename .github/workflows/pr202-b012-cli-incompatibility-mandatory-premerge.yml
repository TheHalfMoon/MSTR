name: PR202 B012 CLI incompatibility mandatory premerge

on:
  push:
    branches:
      - evidence/pr202-b012-cli-incompatibility-mandatory-premerge-870e9d7

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  REPO: TheHalfMoon/MSTR
  BASE: 66cd090fc75286bfc24db4bdf8fe58b64394e228
  HEAD: 870e9d70335817007a07e3115f17545c584e3c86
  TREE: 616eb2183621d7d81df02df83ece354ccd7099a5
  PR: '202'
  SUBJECT_BRANCH: governance/b012-qwen-one-shot-cli-incompatibility-34288154926
  QUAL_RUN: '34294460806'
  QUAL_HEAD: 9898177c9f94ae2c63059fc6b05aca2dba565218
  REVIEW_RUN: '34295567734'
  REVIEW_HEAD: e2ee84d25661d3313bad14b17aad5123e7989d2c
  GH_TOKEN: ${{ github.token }}

jobs:
  mandatory_premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove immutable live identities and evidence chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$SUBJECT_BRANCH)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/review.json
          jq -e --arg h "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/qual.json >/dev/null
          jq -e --arg h "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/review.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==17' /tmp/pr.json >/dev/null

      - name: Prove exact incident scope and frozen protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE" "$HEAD" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          artifacts/manifests/B012-executor-toolchain-binding.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-case-failure.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-01-init.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-02-source.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-03-quantize.json
          artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-one-shot-runtime-cli-incompatibility-run-34288154926.json
          evidence/mstr-000b/B012-qwen-one-shot-runtime-cli-incompatibility-34288154926.md
          tests/contract/test_b012_executor_binding.py
          tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py
          tests/contract/test_b012_qwen_one_shot_runtime_cli_incompatibility_evidence.py
          tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          tests/contract/test_b012_qwen_raw_code_one_shot_topology.py
          tests/contract/test_b012_qwen_raw_code_recovery.py
          tests/contract/test_b012_qwen_staged_recovery_topology.py
          tests/contract/test_b012_runner_shutdown_evidence.py
          tests/contract/test_b012_stage_checkpoint_topology.py
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --check "$BASE" "$HEAD"
          for path in \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B012-equivalent-qualification-execution-envelope.json \
            artifacts/manifests/B012-executor-toolchain-lock.json \
            artifacts/manifests/B012-qwen-raw-code-one-shot-topology-repair.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            .github/workflows/b012-qwen-raw-code-recovery.yml \
            colab/mstr_b012_qwen_raw_code_one_shot.py \
            colab/mstr_b012_raw_code_one_shot.py; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done

      - name: Prove no blocking reviews or unresolved threads
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" > /tmp/reviews.json
          test "$(jq '[.[] | select(.state=="CHANGES_REQUESTED")] | length' /tmp/reviews.json)" -eq 0
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner=TheHalfMoon -f name=MSTR -F number=202 > /tmp/threads.json
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false)] | length' /tmp/threads.json)" -eq 0

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reprove exact-main B012 eligibility and Founder authority before merge
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert all(d['semantic_checks'].values())
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['scope']['candidate_ids']==['mellum-4b','qwen3.5-0.8b-control']
          assert a['scope']['training'] is False
          assert a['scope']['paid_compute'] is False
          assert a['scope']['paid_model_api'] is False
          assert a['cost_resource_ceiling']['limits'][0]['max']==0.0
          PY
          git checkout --detach "$HEAD"

      - name: Reprove incident fail-closed semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          incident=json.loads((root/'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-one-shot-runtime-cli-incompatibility-run-34288154926.json').read_text())
          binding=json.loads((root/'artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          assert incident['failure_classification']=='B012_EXECUTOR_RUNTIME_CLI_INCOMPATIBILITY_RAW_CODE_UNEXECUTED'
          assert incident['execution']['durable_raw_code_cases']==[]
          assert incident['execution']['model_quality_verdict']=='NONE'
          assert incident['execution']['candidate_admission_decision']=='NONE'
          assert incident['canonical_effect']['b012_state']=='PENDING'
          assert incident['canonical_effect']['b013_opening_authorized'] is False
          assert binding['status']=='BLOCKED_PENDING_QWEN_RAW_CODE_RUNTIME_CONTRACT_REPAIR'
          bound=binding['qwen_raw_code_one_shot_runtime_cli_incompatibility']
          for key in ('same_topology_redispatch_authorized','retry_authority_created','external_dispatch_authority_created','cross_run_resume_authority_created','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert bound[key] is False, key
          PY

      - name: Mandatory quality gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q tests/contract/test_b012*.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check tests/contract/test_b012_qwen_one_shot_runtime_cli_incompatibility_evidence.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final guarded-merge readiness proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==17' /tmp/pr-final.json >/dev/null
          echo 'PR202_MANDATORY_PREMERGE=PASS'
          echo 'MODEL_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'PAID_COST_USD=0.0'
