name: Verify B017 implementation post-merge

on:
  push:

permissions:
  contents: read

env:
  EXPECTED_MAIN: 79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c
  EXPECTED_PARENT_MAIN: f7a386214a1346b75dd3311390aa1e19bf354bb1
  EXPECTED_CANDIDATE: 6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bind canonical merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT_MAIN"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$EXPECTED_CANDIDATE^{tree}")"

  task_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - name: Verify post-merge task state and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B017 > /tmp/b017.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json
          b17=json.load(open('/tmp/b017.json')); b11=json.load(open('/tmp/b011.json')); drift=json.load(open('/tmp/drift.json'))
          assert b17['canonical_main']== '79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c'
          assert b17['eligible'] is True and b17['state_consistency_result']['observed_state']=='PENDING'
          assert b17['authority_result']['required'] is False
          assert b11['eligible'] is False and b11['state_consistency_result']['observed_state']=='BLOCKED'
          assert b11['authority_result']['required'] is True and b11['authority_result']['satisfied'] is False
          assert drift['status']=='clean' and drift['findings']==[]
          PY

  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: 79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/test_software_evolution_projection.py tests/contract/test_software_evolution_contract.py

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: 79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - run: python -m mstr_qualify validate
      - run: pytest -q
      - run: ruff check src tests
      - run: mypy

  complete:
    needs: [identity, task_gate, focused, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Final canonical main immutability recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo 'B017_POSTMERGE_IMPLEMENTATION=PASS'
          echo 'B017_STATE=PENDING_CLOSEOUT'
          echo 'B011_REMAINS_BLOCKED=PASS'
