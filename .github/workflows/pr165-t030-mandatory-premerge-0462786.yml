name: Mandatory premerge PR165 T030 exact head

on:
  push:
    branches:
      - evidence/pr165-t030-mandatory-premerge-0462786

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: pr165-t030-mandatory-premerge-0462786
  cancel-in-progress: false

env:
  PR_NUMBER: '165'
  BASE_SHA: 226609e3a29a5e5d038bbd0e9c744f3ff2877112
  HEAD_SHA: 0462786550d24096272b7541ab286e838b4a1c2e
  HEAD_TREE: b016ab6a3899accc352d8f177a2ba76451259f66
  TARGET_BRANCH: reconcile/000-t030-portable-cpu-runtime-adapters
  QUALIFICATION_RUN: '33971815139'
  QUALIFICATION_EVIDENCE_HEAD: f48819767b1d571819736562aba22e84a84b3a85
  REVIEW_RUN: '33972061731'
  REVIEW_EVIDENCE_HEAD: 540d3346863f8be053e8ac199703a884a33998da
  REVIEW_SUBMISSION_ID: '5121599106'

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify live GitHub merge gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          root = "https://api.github.com/repos/TheHalfMoon/MSTR"

          def get(path: str):
              request = urllib.request.Request(f"{root}{path}", headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          pr = get(f"/pulls/{os.environ['PR_NUMBER']}")
          assert pr["state"] == "open" and pr["draft"] is False and pr["merged"] is False
          assert pr["mergeable"] is True
          assert pr["base"]["ref"] == "main" and pr["base"]["sha"] == os.environ["BASE_SHA"]
          assert pr["head"]["ref"] == os.environ["TARGET_BRANCH"] and pr["head"]["sha"] == os.environ["HEAD_SHA"]
          assert pr["commits"] == 17 and pr["changed_files"] == 10

          expected_files = {
              "artifacts/decisions/T030-runtime-interface-scan.json",
              "configs/runtimes/llama-cpp-cpu.json",
              "evidence/T030-runtime-adapters.md",
              "src/mstr_qualify/runtimes/__init__.py",
              "src/mstr_qualify/runtimes/benchmark_cli.py",
              "tests/integration/test_runtime_adapters.py",
              "tests/security/test_runtime_benchmark_boundary.py",
              "tests/security/test_runtime_environment_boundary.py",
              "tests/security/test_runtime_profile_alias_boundary.py",
              "tests/unit/test_runtime_benchmark_cli.py",
          }
          assert {item["filename"] for item in get(f"/pulls/{os.environ['PR_NUMBER']}/files?per_page=100")} == expected_files

          for run_env, head_env in (
              ("QUALIFICATION_RUN", "QUALIFICATION_EVIDENCE_HEAD"),
              ("REVIEW_RUN", "REVIEW_EVIDENCE_HEAD"),
          ):
              run = get(f"/actions/runs/{os.environ[run_env]}")
              assert run["status"] == "completed" and run["conclusion"] == "success"
              assert run["head_sha"] == os.environ[head_env]

          review = get(f"/pulls/{os.environ['PR_NUMBER']}/reviews/{os.environ['REVIEW_SUBMISSION_ID']}")
          assert review["state"] == "COMMENTED"
          assert review["commit_id"] == os.environ["HEAD_SHA"]
          assert "Findings: NONE." in review["body"]
          assert os.environ["REVIEW_RUN"] in review["body"]
          assert "T031 measurement authority is not inferred from T030" in review["body"]

          reviews = get(f"/pulls/{os.environ['PR_NUMBER']}/reviews?per_page=100")
          assert not any(
              item["state"] == "CHANGES_REQUESTED" and item.get("commit_id") == os.environ["HEAD_SHA"]
              for item in reviews
          )

          branch = get("/branches/main")
          assert branch["name"] == "main" and branch["commit"]["sha"] == os.environ["BASE_SHA"]
          assert branch["protected"] is False
          assert get("/rulesets") == []

          combined = get(f"/commits/{os.environ['HEAD_SHA']}/status")
          assert combined["state"] == "success"
          assert all(item["state"] == "success" for item in combined["statuses"])

          checks = get(f"/commits/{os.environ['HEAD_SHA']}/check-runs?per_page=100")
          assert all(item["status"] == "completed" for item in checks["check_runs"])
          assert all(item["conclusion"] in {"success", "neutral", "skipped"} for item in checks["check_runs"])

          authority = urllib.request.Request(
              f"{root}/contents/artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json?ref={os.environ['BASE_SHA']}",
              headers=headers,
          )
          try:
              urllib.request.urlopen(authority)
          except urllib.error.HTTPError as exc:
              assert exc.code == 404
          else:
              raise AssertionError("B012 authority unexpectedly exists")

          query = """query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}"""
          payload = json.dumps({"query": query, "variables": {"owner": "TheHalfMoon", "name": "MSTR", "number": 165}}).encode()
          gql_headers = dict(headers)
          gql_headers["Content-Type"] = "application/json"
          request = urllib.request.Request("https://api.github.com/graphql", data=payload, headers=gql_headers, method="POST")
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          assert "errors" not in result
          threads = result["data"]["repository"]["pullRequest"]["reviewThreads"]["nodes"]
          assert all(node["isResolved"] for node in threads)
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Verify exact target topology and semantic boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- artifacts/authorities artifacts/manifests configs/task-gate .github/workflows docs/canonical specs)"
          grep -Fq 'self._verify_loaded_artifact_identity()' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '_BLOCKED_RUNTIME_ENV_PREFIXES = ("LLAMA_ARG_", "HF_")' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '"--model-url"' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '"--docker-repo"' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '"--hf-repo"' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '"--rpc"' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq 'T031_EXECUTION_AUTHORITY = NONE_INFERRED_BY_T030' evidence/T030-runtime-adapters.md

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-run mandatory frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/unit/test_runtime_benchmark_cli.py \
            tests/security/test_runtime_benchmark_boundary.py \
            tests/security/test_runtime_profile_alias_boundary.py \
            tests/security/test_runtime_environment_boundary.py \
            tests/integration/test_runtime_adapters.py
          python -m mstr_qualify validate
          python -m pytest -q
          ruff check .
          mypy
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test -z "$(git status --porcelain)"

  merge_authorization:
    needs: [governance, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recheck immutable expected head and emit merge authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          echo 'MANDATORY_PREMERGE=PASS'
          echo "EXPECTED_HEAD_SHA=$HEAD_SHA"
          echo "EXPECTED_BASE_SHA=$BASE_SHA"
          echo 'MERGE_AUTHORIZED=YES_FOR_EXACT_HEAD_ONLY'
          echo 'T031_EXECUTION_AUTHORITY=NONE_INFERRED'
