name: PR201 B012 one-shot activation mandatory premerge v2

on:
  push:
    branches:
      - evidence/pr201-b012-one-shot-mandatory-premerge-v2-1f203ad

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  REPO: TheHalfMoon/MSTR
  BASE: 04096a180e47ed8f81ee81c1bf3d9e471be607fc
  HEAD: 1f203ad7087d3ef28f9b24f23909a2a10eaada96
  TREE: f02010637016ac4b12ee3112b9fe7fb221ab98fd
  PR: '201'
  QUAL_RUN: '34285319693'
  QUAL_HEAD: b56c72f2fb5d789d8b00b0b7f0ee462a22a9813f
  REVIEW_RUN: '34286709760'
  REVIEW_HEAD: f223cd622f5e8753491603faf07fd266646e45f0
  PREMERGE_V1_RUN: '34287081209'
  PREMERGE_V1_HEAD: 6cc20596a0bee391e4523c31dad52004b2e70e59
  SUBJECT_BRANCH: fix/b012-qwen-raw-code-one-shot-activation
  GH_TOKEN: ${{ github.token }}

jobs:
  premerge_v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove immutable live identities and prior harness-only premerge failure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$SUBJECT_BRANCH)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          gh api "repos/$REPO/actions/runs/$PREMERGE_V1_RUN" > /tmp/premerge-v1.json
          jq -e --arg h "$PREMERGE_V1_HEAD" '.status=="completed" and .conclusion=="failure" and .head_sha==$h and .run_attempt==1' /tmp/premerge-v1.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==13' /tmp/pr.json >/dev/null

      - name: Prove exact qualification and independent-review chain
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/review.json
          jq -e --arg h "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/qual.json >/dev/null
          jq -e --arg h "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/review.json >/dev/null

      - name: Prove exact thirteen-file scope and frozen authority benchmark surfaces
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            '.github/workflows/b012-qwen-raw-code-recovery.yml'
            'artifacts/manifests/B012-executor-toolchain-binding.json'
            'artifacts/manifests/B012-qwen-raw-code-one-shot-topology-repair.json'
            'evidence/mstr-000b/B012-qwen-one-shot-mode-activation.md'
            'tests/contract/test_b012_executor_binding.py'
            'tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py'
            'tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py'
            'tests/contract/test_b012_qwen_raw_code_one_shot_topology.py'
            'tests/contract/test_b012_qwen_raw_code_one_shot_workflow.py'
            'tests/contract/test_b012_qwen_raw_code_recovery.py'
            'tests/contract/test_b012_qwen_staged_recovery_topology.py'
            'tests/contract/test_b012_runner_shutdown_evidence.py'
            'tests/contract/test_b012_stage_checkpoint_topology.py'
          )
          [[ ${#actual[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done
          for path in \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B010-new-candidate-weight-access.json \
            artifacts/manifests/B011-acquired-candidates.json \
            artifacts/manifests/B012-equivalent-qualification-execution-envelope.json \
            artifacts/manifests/B012-executor-toolchain-lock.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_qwen_raw_code_one_shot.py \
            colab/mstr_b012_raw_code_one_shot.py \
            configs/workflows/b012-qwen-raw-code-one-shot-recovery.yml; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done
          git diff --check "$BASE...$HEAD"

      - name: Prove no blocking reviews or unresolved threads
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" > /tmp/reviews.json
          test "$(jq '[.[] | select(.state=="CHANGES_REQUESTED")] | length' /tmp/reviews.json)" -eq 0
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner=TheHalfMoon -f name=MSTR -F number=201 > /tmp/threads.json
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false)] | length' /tmp/threads.json)" -eq 0

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reprove exact-main B012 eligibility and Founder authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012' and d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert all(d['semantic_checks'].values())
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert a['task_id']=='B012'
          assert a['cost_resource_ceiling']['limits'][0]['max']==0.0
          PY
          git checkout --detach "$HEAD"

      - name: Reprove exact one-shot activation binding storage supersession and dispatch separation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          mp=Path('artifacts/manifests/B012-qwen-raw-code-one-shot-topology-repair.json')
          bp=Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          active=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          spec=Path('configs/workflows/b012-qwen-raw-code-one-shot-recovery.yml')
          case_spec=Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          wrapper=Path('colab/mstr_b012_qwen_raw_code_one_shot.py')
          helper=Path('colab/mstr_b012_raw_code_one_shot.py')
          m=json.loads(mp.read_text(encoding='utf-8'))
          b=json.loads(bp.read_text(encoding='utf-8'))
          act=m['activation']; ab=m['authority_boundary']; bound=b['qwen_raw_code_one_shot_activation']
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['task_id']=='B012' and m['candidate_id']=='qwen3.5-0.8b-control'
          assert act['activation_base_main']=='04096a180e47ed8f81ee81c1bf3d9e471be607fc'
          assert act['repair_package_merge_commit']=='04096a180e47ed8f81ee81c1bf3d9e471be607fc'
          assert act['repair_package_postmerge_run_id']==34282489164
          assert act['repair_package_postmerge_evidence_head']=='3618b69ab145f5ed4d18502ca5064812aa6081cd'
          assert act['active_workflow_materialized'] is True
          assert act['activation_is_separate_repository_change'] is True
          assert act['activation_repository_change_only'] is True
          assert act['package_performs_model_access'] is False
          assert act['package_performs_model_execution'] is False
          assert active.read_bytes()==spec.read_bytes()
          assert active.read_bytes()!=case_spec.read_bytes()
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          assert bound['repair_manifest_sha256']==sha(mp)
          assert bound['active_workflow_sha256']==sha(active)
          assert bound['one_shot_script_sha256']==sha(wrapper)
          assert bound['one_shot_raw_code_helper_sha256']==sha(helper)
          for key in ('authority_scope_modified','authority_transfer','candidate_expansion','candidate_revision_or_file_expansion','cross_run_resume_authority_created','external_dispatch_authority_created','paid_compute','paid_model_api','production_release','retry_authority_created','training','weight_changing_training'):
              assert ab[key] is False, key
          assert ab['paid_cost_usd']==0.0
          assert ab['git_model_binaries']==0 and ab['founder_machine_model_binaries']==0
          for key in ('retry_authority_created','external_dispatch_authority_created','cross_run_resume_authority_created','candidate_expansion','revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert bound[key] is False, key
          assert bound['model_access']=='NONE' and bound['model_execution']=='NONE' and bound['paid_cost_usd']==0.0
          text=active.read_text(encoding='utf-8')
          assert "github.event.issue.number == 162" in text
          assert "github.event.comment.user.login == 'TheHalfMoon'" in text
          assert "github.event.comment.author_association == 'OWNER'" in text
          assert "github.event.comment.body == 'B012_RECOVER_RAW_CODE_ONE_SHOT qwen3.5-0.8b-control 34155931982'" in text
          assert 'B012_RECOVER_RAW_CODE_CASE_CHECKPOINT' not in text
          assert text.count('actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02')==7
          assert '.gguf' not in text and '.safetensors' not in text
          storage=Path('docs/canonical/STORAGE_ARCHITECTURE.md').read_text(encoding='utf-8')
          assert 'GIT_TREE_BINARIES      = PROHIBITED' in storage
          assert 'MODEL_BINARIES_ON_MAC = PROHIBITED' in storage
          assert 'ACTIONS_EPHEMERAL_RUNNER      = approved autonomous executor' in storage
          PY

      - name: Mandatory quality gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_topology.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_workflow.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_topology.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_workflow.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final guarded-merge readiness proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/q.json
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/r.json
          gh api "repos/$REPO/actions/runs/$PREMERGE_V1_RUN" > /tmp/p1.json
          jq -e --arg h "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/q.json >/dev/null
          jq -e --arg h "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/r.json >/dev/null
          jq -e --arg h "$PREMERGE_V1_HEAD" '.status=="completed" and .conclusion=="failure" and .head_sha==$h and .run_attempt==1' /tmp/p1.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/p.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==13' /tmp/p.json >/dev/null
          echo 'PREMERGE_V1_CLASSIFICATION=HARNESS_FIELD_NAME_MISMATCH_ONLY'
          echo 'PR201_MANDATORY_PREMERGE_V2=PASS'
