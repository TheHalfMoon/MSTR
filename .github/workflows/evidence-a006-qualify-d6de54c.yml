name: Qualify A006 exact head

on:
  push:
    branches:
      - evidence/a006-finalizer-97904ac

permissions:
  contents: read

env:
  EXPECTED_BASE: 97904ac5ad17e7142e88944ee83dbb304ecb197f
  EXPECTED_HEAD: d6de54c685622ad0d230c11d7173b3559676b37c
  TARGET_BRANCH: feat/000a-a006-protected-finalizer

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d6de54c685622ad0d230c11d7173b3559676b37c
          fetch-depth: 0
      - name: Verify exact identity, entry main, and A006 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          mapfile -t actual < <(git diff --name-only "$EXPECTED_BASE" "$EXPECTED_HEAD" | sort)
          expected=(
            evidence/mstr-000a/A006-finalizer.md
            src/mstr_qualify/verifier/__init__.py
            src/mstr_qualify/verifier/finalizer.py
            tests/security/test_finalizer_boundary.py
            tests/unit/test_finalizer.py
          )
          test "${#actual[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}" | sort)
          grep -Fq 'A005 = COMPLETE_CANONICAL' evidence/mstr-000a/A006-finalizer.md
          grep -Fq 'MODEL_WEIGHT_ACCESS = NONE' evidence/mstr-000a/A006-finalizer.md
          test -z "$(git diff --name-only "$EXPECTED_BASE" "$EXPECTED_HEAD" -- schemas configs/task-gate specs/001-agent-harness-verified-loop-foundation/tasks.md AGENTS.md .specify/memory/constitution.md)"

  quality_semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d6de54c685622ad0d230c11d7173b3559676b37c
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run A006 focused and full quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/unit/test_finalizer.py tests/security/test_finalizer_boundary.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src
          python - <<'PY'
          from mstr_qualify.harness.event_log import create_event
          from mstr_qualify.verifier.finalizer import FinalizerError, finalize_run

          events = []
          def add(event_type, payload, source):
              event = create_event(
                  run_id="a006-qualification",
                  seq=len(events),
                  event_type=event_type,
                  logical_time=len(events),
                  payload=payload,
                  model_visible=False,
                  source=source,
                  prev_sha256=str(events[-1]["sha256"]) if events else None,
              )
              events.append(event)

          add("run.started", {}, "harness")
          add("run.stop_proposed", {"reason": "candidate complete"}, "model")
          add("verifier.result", {"verifier_id": "tests", "status": "PASS", "result_identity": "tests-pass"}, "verifier")
          decision = finalize_run(events, required_verifier_ids=["tests"])
          assert decision.terminal_class == "VERIFIED_SUCCESS"
          assert decision.completion_event["source"] == "verifier"
          assert decision.completion_event["model_visible"] is False

          malformed = events[:2]
          add_bad = create_event(
              run_id="a006-qualification",
              seq=2,
              event_type="verifier.result",
              logical_time=2,
              payload={"verifier_id": "tests", "status": {}, "result_identity": "bad"},
              model_visible=False,
              source="verifier",
              prev_sha256=str(malformed[-1]["sha256"]),
          )
          malformed.append(add_bad)
          try:
              finalize_run(malformed, required_verifier_ids=["tests"])
          except FinalizerError as exc:
              assert exc.code == "finalizer.verifier_status_invalid"
          else:
              raise AssertionError("malformed verifier status did not fail closed")
          PY
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"

  complete:
    needs: [identity_scope, quality_semantics]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d6de54c685622ad0d230c11d7173b3559676b37c
          fetch-depth: 0
      - name: Final immutable exact-head recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          echo "A006_HEAD=$EXPECTED_HEAD"
          echo "EXTERNAL_EFFECT=NONE"
