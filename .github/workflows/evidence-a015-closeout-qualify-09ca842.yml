name: Qualify A015 canonical closeout

on:
  push:
    branches:
      - evidence/a015-closeout-qualify-09ca842

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  identity_scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09ca84266e9a7dd79a36d416b9cfe65144bbb073
          fetch-depth: 0
      - name: Verify exact A015 closeout identity and lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "09ca84266e9a7dd79a36d416b9cfe65144bbb073"
          test "$(git rev-parse HEAD^{tree})" = "20928dd6fdc118b0f8fa50d4848bfdc67f66d8eb"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "462a9d5ce32f01408a538d7fe55a585e432397a7"
          test "$(git merge-base HEAD 462a9d5ce32f01408a538d7fe55a585e432397a7)" = "462a9d5ce32f01408a538d7fe55a585e432397a7"
          mapfile -t FILES < <(git diff --name-only 462a9d5ce32f01408a538d7fe55a585e432397a7...HEAD | sort)
          test "${#FILES[@]}" -eq 2
          test "${FILES[0]}" = "evidence/mstr-000a/A015-direction-to-done.md"
          test "${FILES[1]}" = "specs/001-agent-harness-verified-loop-foundation/tasks.md"
          git diff --check 462a9d5ce32f01408a538d7fe55a585e432397a7...HEAD
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33427721219 --jq .conclusion)" = success
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33428444420 --jq .conclusion)" = failure
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33428990007 --jq .conclusion)" = success
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33429274513 --jq .conclusion)" = success
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33430200851 --jq .conclusion)" = failure
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33430301950 --jq .conclusion)" = success
          python - <<'PY'
          from pathlib import Path
          tasks = Path('specs/001-agent-harness-verified-loop-foundation/tasks.md').read_text()
          evidence = Path('evidence/mstr-000a/A015-direction-to-done.md').read_text()
          assert '**State:** COMPLETE_CANONICAL' in evidence
          assert '- [x] **A014 ' in tasks
          assert '- [x] **A015 ' in tasks
          assert '- [ ] **A016 ' in tasks
          assert '33430200851 / FAILURE' in evidence
          assert '33430301950 / SUCCESS' in evidence
          assert 'B023_VERIFIER_HEALTH_EXECUTION = NOT_IMPLEMENTED_BY_A015' in evidence
          assert 'WEIGHT_CHANGING_TRAINING = NONE' in evidence
          PY

  quality:
    needs: identity_scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09ca84266e9a7dd79a36d416b9cfe65144bbb073
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen repository quality gates
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_direction_task_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src

  complete:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09ca84266e9a7dd79a36d416b9cfe65144bbb073
          fetch-depth: 0
      - name: Final immutable A015 closeout recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "09ca84266e9a7dd79a36d416b9cfe65144bbb073"
          test "$(git rev-parse HEAD^{tree})" = "20928dd6fdc118b0f8fa50d4848bfdc67f66d8eb"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "462a9d5ce32f01408a538d7fe55a585e432397a7"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/docs/000a-a015-closeout --jq .object.sha)" = "09ca84266e9a7dd79a36d416b9cfe65144bbb073"
