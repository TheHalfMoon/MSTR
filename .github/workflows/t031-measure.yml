name: T031 governed local measurement

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact Founder-authorized T029 candidate
        required: true
        type: choice
        options:
          - granite-4.1-3b
          - ministral-3-3b
          - qwen2.5-coder-1.5b
          - qwen3-4b
          - qwen3.5-2b
          - qwen3.5-4b
          - smollm3-3b
          - yi-coder-1.5b
  push:
    branches:
      - "execute/t031-*"

permissions:
  contents: read

concurrency:
  group: t031-governed-model-execution
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: "0"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Resolve exact candidate and trigger boundary
        id: boundary
        shell: bash
        env:
          DISPATCH_CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            candidate="$DISPATCH_CANDIDATE"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            created="$(python -c 'import json,os; print(json.load(open(
              os.environ["GITHUB_EVENT_PATH"]))["created"])')"
            deleted="$(python -c 'import json,os; print(json.load(open(
              os.environ["GITHUB_EVENT_PATH"]))["deleted"])')"
            [[ "$created" == "True" && "$deleted" != "True" ]]
            candidate="${GITHUB_REF_NAME#execute/t031-}"
            [[ "execute/t031-$candidate" == "$GITHUB_REF_NAME" ]]
          else
            echo "Unsupported trigger: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          case "$candidate" in
            granite-4.1-3b|ministral-3-3b|qwen2.5-coder-1.5b|qwen3-4b|\
              qwen3.5-2b|qwen3.5-4b|smollm3-3b|yi-coder-1.5b) ;;
            *) echo "Candidate outside exact T031 authority: $candidate" >&2; exit 1 ;;
          esac
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Checkout live canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Execute governed T031 measurement
        shell: bash
        env:
          T031_CANDIDATE: ${{ steps.boundary.outputs.candidate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t031-out"
          python colab/mstr_t031_execute.py \
            --candidate "$T031_CANDIDATE" \
            --output-dir "$RUNNER_TEMP/t031-out" \
            --workdir "$RUNNER_TEMP/t031-work"

      - name: Upload durable JSON evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t031-${{ steps.boundary.outputs.candidate }}
          path: |
            ${{ runner.temp }}/t031-out/*.json
            ${{ runner.temp }}/t031-out/*.jsonl
          if-no-files-found: error
          retention-days: 14
