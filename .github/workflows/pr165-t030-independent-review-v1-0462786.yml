name: Independent semantic security review PR165 T030 exact head v1

on:
  push:
    branches:
      - evidence/pr165-t030-independent-review-v1-0462786

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pr165-t030-independent-review-v1-0462786
  cancel-in-progress: false

env:
  PR_NUMBER: '165'
  BASE_SHA: 226609e3a29a5e5d038bbd0e9c744f3ff2877112
  HEAD_SHA: 0462786550d24096272b7541ab286e838b4a1c2e
  HEAD_TREE: b016ab6a3899accc352d8f177a2ba76451259f66
  TARGET_BRANCH: reconcile/000-t030-portable-cpu-runtime-adapters
  QUALIFICATION_RUN: '33971815139'
  QUALIFICATION_EVIDENCE_HEAD: f48819767b1d571819736562aba22e84a84b3a85
  LLAMA_CPP_REVISION: 3173a56471c1753650cd806694145ffd6dcace67

jobs:
  semantics_security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify live identity and prerequisite qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          root = "https://api.github.com/repos/TheHalfMoon/MSTR"

          def get(path: str):
              request = urllib.request.Request(f"{root}{path}", headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          pr = get(f"/pulls/{os.environ['PR_NUMBER']}")
          assert pr["state"] == "open" and pr["draft"] is False and pr["merged"] is False
          assert pr["base"]["ref"] == "main" and pr["base"]["sha"] == os.environ["BASE_SHA"]
          assert pr["head"]["ref"] == os.environ["TARGET_BRANCH"] and pr["head"]["sha"] == os.environ["HEAD_SHA"]
          assert pr["commits"] == 17 and pr["changed_files"] == 10

          qualification = get(f"/actions/runs/{os.environ['QUALIFICATION_RUN']}")
          assert qualification["status"] == "completed"
          assert qualification["conclusion"] == "success"
          assert qualification["head_sha"] == os.environ["QUALIFICATION_EVIDENCE_HEAD"]

          expected = {
              "artifacts/decisions/T030-runtime-interface-scan.json",
              "configs/runtimes/llama-cpp-cpu.json",
              "evidence/T030-runtime-adapters.md",
              "src/mstr_qualify/runtimes/__init__.py",
              "src/mstr_qualify/runtimes/benchmark_cli.py",
              "tests/integration/test_runtime_adapters.py",
              "tests/security/test_runtime_benchmark_boundary.py",
              "tests/security/test_runtime_environment_boundary.py",
              "tests/security/test_runtime_profile_alias_boundary.py",
              "tests/unit/test_runtime_benchmark_cli.py",
          }
          assert {item["filename"] for item in get(f"/pulls/{os.environ['PR_NUMBER']}/files?per_page=100")} == expected

          authority = urllib.request.Request(
              f"{root}/contents/artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json?ref={os.environ['BASE_SHA']}",
              headers=headers,
          )
          try:
              urllib.request.urlopen(authority)
          except urllib.error.HTTPError as exc:
              assert exc.code == 404
          else:
              raise AssertionError("B012 authority unexpectedly exists")
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Review exact implementation semantics and security boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual.txt
          printf '%s\n' \
            artifacts/decisions/T030-runtime-interface-scan.json \
            configs/runtimes/llama-cpp-cpu.json \
            evidence/T030-runtime-adapters.md \
            src/mstr_qualify/runtimes/__init__.py \
            src/mstr_qualify/runtimes/benchmark_cli.py \
            tests/integration/test_runtime_adapters.py \
            tests/security/test_runtime_benchmark_boundary.py \
            tests/security/test_runtime_environment_boundary.py \
            tests/security/test_runtime_profile_alias_boundary.py \
            tests/unit/test_runtime_benchmark_cli.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- artifacts/authorities artifacts/manifests configs/task-gate .github/workflows docs/canonical specs)"

          python - <<'PY'
          import json
          from pathlib import Path

          profile = json.loads(Path("configs/runtimes/llama-cpp-cpu.json").read_text())
          assert profile == {
              "runtime_id": "llama.cpp-llama-bench-cpu",
              "executable": "llama-bench",
              "upstream_repository": "https://github.com/ggml-org/llama.cpp",
              "upstream_revision": "3173a56471c1753650cd806694145ffd6dcace67",
              "supported_formats": ["gguf"],
              "arguments": {
                  "model": "-m",
                  "prompt_tokens": "-p",
                  "generation_tokens": "-n",
                  "threads": "-t",
                  "gpu_layers": "-ngl",
                  "repetitions": "-r",
                  "output": ["--device", "none", "-o", "json"],
              },
          }

          decision = json.loads(Path("artifacts/decisions/T030-runtime-interface-scan.json").read_text())
          assert decision["execution_performed"] is False
          assert decision["model_weight_access_performed"] is False
          primary = decision["runtime_candidates"][0]
          assert primary["upstream_revision"] == profile["upstream_revision"]
          assert primary["adapter_state"] == "RECONCILED_IMPLEMENTATION_UNEXECUTED_FINAL_SECURITY_HARDENED"
          assert primary["interface"]["model_url"] == ["-mu", "--model-url"]
          assert primary["interface"]["docker_repo"] == ["-dr", "--docker-repo"]
          assert "LLAMA_ARG_*" in primary["network_policy"] and "HF_*" in primary["network_policy"]
          assert "immediately before every benchmark process" in primary["artifact_identity_policy"]
          assert decision["runtime_candidates"][1]["adapter_state"] == "DEFERRED_INTERFACE_NOT_PROVEN"

          evidence = Path("evidence/T030-runtime-adapters.md").read_text()
          for token in (
              "POST_LOAD_ARTIFACT_SHA_MUTATION -> REJECT_BEFORE_PROCESS",
              "MODEL_URL_OR_DOCKER_ACQUISITION_FLAGS -> REJECT",
              "INHERITED_RUNTIME_NETWORK_OR_DEVICE_ENV -> REMOVED",
              "T031_EXECUTION_AUTHORITY = NONE_INFERRED_BY_T030",
              "B012_AUTHORITY = NONE",
              "RUN = 33971084397",
              "LATER_DISPOSITION = SUPERSEDED_BY_MATERIAL_SUBSTANTIVE_REVIEW_FINDINGS",
          ):
              assert token in evidence, token
          PY

          grep -Fq 'self._verify_loaded_artifact_identity()' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq 'runtime.artifact_hash_changed_after_load' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '_BLOCKED_RUNTIME_ENV_PREFIXES = ("LLAMA_ARG_", "HF_")' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq 'env=_sanitized_runtime_environment()' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '"--model-url"' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '"--docker-repo"' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '"--hf-repo"' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq '"--rpc"' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq 'reported_devices != "none"' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq 'self._profile.upstream_revision.startswith(build_commit)' src/mstr_qualify/runtimes/benchmark_cli.py
          grep -Fq 'test_artifact_mutation_after_load_fails_before_process' tests/security/test_runtime_benchmark_boundary.py
          grep -Fq 'test_subprocess_runner_sanitizes_upstream_option_environment' tests/security/test_runtime_environment_boundary.py

      - name: Independently verify pinned upstream option semantics
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/ggml-org/llama.cpp/$LLAMA_CPP_REVISION/common/arg.cpp" -o /tmp/arg.cpp
          curl -fsSL "https://raw.githubusercontent.com/ggml-org/llama.cpp/$LLAMA_CPP_REVISION/tools/llama-bench/README.md" -o /tmp/llama-bench-readme.md
          for token in '--model-url' '--docker-repo' '--hf-repo' '--hf-file' '--hf-token' '--rpc' '--device'; do
            grep -Fq -- "$token" /tmp/arg.cpp
          done
          for token in 'LLAMA_ARG_MODEL_URL' 'LLAMA_ARG_DOCKER_REPO' 'LLAMA_ARG_HF_REPO' 'LLAMA_ARG_HF_FILE' 'HF_TOKEN' 'LLAMA_ARG_RPC' 'LLAMA_ARG_DEVICE' 'LLAMA_ARG_N_GPU_LAYERS'; do
            grep -Fq -- "$token" /tmp/arg.cpp
          done
          for token in '--model' '--n-prompt' '--n-gen' '--threads' '--n-gpu-layers' '--device' '--repetitions'; do
            grep -Fq -- "$token" /tmp/llama-bench-readme.md
          done

  independent_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently rerun focused and frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/unit/test_runtime_benchmark_cli.py \
            tests/security/test_runtime_benchmark_boundary.py \
            tests/security/test_runtime_profile_alias_boundary.py \
            tests/security/test_runtime_environment_boundary.py \
            tests/integration/test_runtime_adapters.py
          python -m mstr_qualify validate
          python -m pytest -q
          ruff check src tests
          mypy
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test -z "$(git status --porcelain)"

  final_verdict:
    needs: [semantics_security, independent_quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recheck exact live identity and emit review verdict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          echo 'FINDINGS=NONE'
          echo 'INDEPENDENT_SUBSTANTIVE_SEMANTIC_SECURITY_REVIEW=PASS'
          echo "REVIEWED_HEAD=$HEAD_SHA"
          echo "REVIEWED_TREE=$HEAD_TREE"
