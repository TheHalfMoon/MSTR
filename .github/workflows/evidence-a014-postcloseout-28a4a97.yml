name: Postcloseout A014 canonical verification

on:
  push:
    branches:
      - evidence/a014-postcloseout-28a4a97

permissions:
  contents: read
  pull-requests: read

env:
  PREVIOUS_MAIN: 87f1636e434ec36f508528ab4a78204adf103856
  CLOSEOUT_HEAD: 1c7f2b3902766a105750f602f9982eeff796aa01
  MERGE_SHA: 28a4a972182c0f58f7c6500239f625a0e2143d0a
  MERGE_TREE: 3137e69d681449051acdc1d68378cb64c4f2535c
  CLOSEOUT_PR: "115"
  CLOSEOUT_QUALIFICATION: "33424324451"
  CLOSEOUT_PREMERGE: "33424600379"
  FAILED_CLOSEOUT_QUALIFICATION: "33423959583"

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - name: Prove exact canonical A014 closeout merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          mapfile -t parents < <(git show -s --format=%P "$MERGE_SHA" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$PREVIOUS_MAIN"
          test "${parents[1]}" = "$CLOSEOUT_HEAD"
          test "$(git rev-parse "$CLOSEOUT_HEAD^{tree}")" = "$MERGE_TREE"
          git diff --check "$PREVIOUS_MAIN" "$MERGE_SHA"

          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TheHalfMoon/MSTR/pulls/$CLOSEOUT_PR")"
          jq -e --arg head "$CLOSEOUT_HEAD" --arg merge "$MERGE_SHA" '.state == "closed" and .merged_at != null and .head.sha == $head and .merge_commit_sha == $merge' <<<"$pr_json"

          for run_id in "$CLOSEOUT_QUALIFICATION" "$CLOSEOUT_PREMERGE"; do
            run_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/$run_id")"
            jq -e '.status == "completed" and .conclusion == "success"' <<<"$run_json"
          done
          failed_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/$FAILED_CLOSEOUT_QUALIFICATION")"
          jq -e '.status == "completed" and .conclusion == "failure"' <<<"$failed_json"

          grep -F -- '**State:** `COMPLETE_CANONICAL`' evidence/mstr-000a/A014-verifier-shortcuts.md
          grep -F -- 'A014_STATE = COMPLETE_CANONICAL_CANDIDATE' evidence/mstr-000a/A014-verifier-shortcuts.md
          grep -F -- 'A015_STATE = PENDING' evidence/mstr-000a/A014-verifier-shortcuts.md
          grep -F -- 'INITIAL_CLOSEOUT_QUALIFICATION = 33423959583 / FAILURE / IDENTITY_SCOPE / TRAILING_WHITESPACE' evidence/mstr-000a/A014-verifier-shortcuts.md
          grep -F -- '- [x] **A014 Implement verifier runner + reward-shortcut battery.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A015 Freeze `DirectionTaskManifest` and MSTR Direction-to-Done v0 task taxonomy.**' specs/001-agent-harness-verified-loop-foundation/tasks.md

  quality:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-prove canonical A014 closeout quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: [identity, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - name: Final canonical A014 closeout ref recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
