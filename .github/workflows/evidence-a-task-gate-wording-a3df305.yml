name: Qualify MSTR-000A task-gate wording reconciliation

on:
  push:
    branches:
      - evidence/a-task-gate-wording-a3df305

permissions:
  contents: read

env:
  BASE_SHA: 6b0681adc6f0b31bf32907ed80c072bc4ccccff1
  TARGET_SHA: a3df30547d900366cdcbc178744d5d166ce70741
  TARGET_TREE: e73f9f73dfe705e3eb277a2bed0dd81d5e2e3ca3

jobs:
  identity_scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact governance repair identity and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$TARGET_SHA")
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "specs/001-agent-harness-verified-loop-foundation/checklists/implementation-readiness.md"
          grep -F -- 'the canonical B002 validator/catalog covers MSTR-000B `B001-B034`' specs/001-agent-harness-verified-loop-foundation/checklists/implementation-readiness.md
          grep -F -- 'B003+ = machine eligibility REQUIRED once B002 is COMPLETE_CANONICAL' AGENTS.md
          grep -F -- 'loads the canonical MSTR-000B task catalog covering B001-B034' evidence/mstr-000b/B002-task-gate.md
          test -f configs/task-gate/mstr-000b.json
          test "$(find configs/task-gate -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 1
          grep -F -- '_TASK_LINE_RE = re.compile(' src/mstr_qualify/task_gate.py
          grep -F -- '(?P<task_id>B\d{3})' src/mstr_qualify/task_gate.py
          git diff --check "$BASE_SHA" "$TARGET_SHA"

  quality:
    needs: identity_scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: [identity_scope, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Final immutable target recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
