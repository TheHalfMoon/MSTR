name: Qualify exact B023 canonical closeout

on:
  push:
    branches:
      - evidence/b023-closeout-qualify-2392929

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN: f71a15f967250c5c523749be9f9f3066feccb902
  EXPECTED_HEAD: 2392929d247ba8e5b37617b22244b9e11b129959
  EXPECTED_TREE: 2d2e163131009fc4425b769b036ee0502abbaaa8
  PR_NUMBER: '134'

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2392929d247ba8e5b37617b22244b9e11b129959
          fetch-depth: 0
      - name: Verify exact PR identity, ancestry, tree, and five-file scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.commits' <<<"$pr")" -eq 1
          test "$(jq -r '.changed_files' <<<"$pr")" -eq 5
          mapfile -t actual < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' | sort)
          expected=(
            configs/task-gate/mstr-000b.json
            evidence/mstr-000b/B023-verifier-health-implementation.md
            specs/002-code-model-supremacy-foundation/tasks.md
            tests/contract/test_task_gate.py
            tests/integration/test_task_gate_cli.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 5
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          test "$(git diff --name-only "$EXPECTED_MAIN"..."$EXPECTED_HEAD" -- src/mstr_qualify/verifier src/mstr_qualify/schemas.py schemas specs/002-code-model-supremacy-foundation/contracts tests/fixtures/verifier-health .specify/memory/constitution.md | wc -l)" -eq 0
          git diff --check "$EXPECTED_MAIN"..."$EXPECTED_HEAD"

  catalog_semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2392929d247ba8e5b37617b22244b9e11b129959
          fetch-depth: 0
      - name: Prove only B023 machine state changes and closeout provenance is exact
        shell: bash
        run: |
          set -euo pipefail
          git show "$EXPECTED_MAIN:configs/task-gate/mstr-000b.json" > /tmp/base.json
          cp configs/task-gate/mstr-000b.json /tmp/head.json
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('/tmp/base.json').read_text())
          head = json.loads(Path('/tmp/head.json').read_text())
          assert base.keys() == head.keys()
          assert base['tasks'].keys() == head['tasks'].keys()
          for task_id in base['tasks']:
              before = base['tasks'][task_id]
              after = head['tasks'][task_id]
              if task_id == 'B023':
                  expected = dict(before)
                  expected['canonical_state'] = 'COMPLETE_CANONICAL'
                  assert before['canonical_state'] == 'PENDING'
                  assert after == expected
              else:
                  assert after == before, task_id
          PY
          evidence=evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F '**State:** COMPLETE_CANONICAL' "$evidence"
          grep -F '**Implementation PR:** #133' "$evidence"
          grep -F 'da0480c0eb39e4097cb2d3fd3337a7fc49ab75dc' "$evidence"
          grep -F 'f71a15f967250c5c523749be9f9f3066feccb902' "$evidence"
          grep -F 'ENTRY_GATE_TASK = B023' "$evidence"
          grep -F 'ENTRY_GATE_CANONICAL_MAIN = fdca133e53a47b8966faef172812da58503576a0' "$evidence"
          grep -F 'ENTRY_GATE_ELIGIBLE = true' "$evidence"
          grep -F 'run `33526148972` — SUCCESS' "$evidence"
          grep -F 'run `33527138891` — SUCCESS' "$evidence"
          grep -F 'review `5080178013` — NO ISSUES FOUND' "$evidence"
          grep -F 'run `33528450915` — SUCCESS' "$evidence"
          grep -F 'run `33528911288` — SUCCESS' "$evidence"
          grep -F 'MODEL_EXECUTION = NONE' "$evidence"
          grep -F 'MODEL_WEIGHT_ACCESS = NONE' "$evidence"
          grep -F 'VERIFIER_SUBPROCESS_EXECUTION = NONE' "$evidence"
          grep -F 'WEIGHT_CHANGING_TRAINING = NONE' "$evidence"

  prospective_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2392929d247ba8e5b37617b22244b9e11b129959
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove prospective terminal semantics, downstream frontier, and authority block
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json
          if mstr-qualify task eligible B023 > /tmp/b023.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and .authority_result.required == false and (.reasons | index("task.already_terminal")) != null' /tmp/b023.json
          mstr-qualify task eligible B024 > /tmp/b024.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and (.reasons | length) == 0' /tmp/b024.json
          if mstr-qualify task eligible B026 > /tmp/b026.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING" and (.reasons | index("prerequisite.unsatisfied:B024")) != null and (.reasons | index("prerequisite.unsatisfied:B022")) == null and (.reasons | index("prerequisite.unsatisfied:B025")) == null' /tmp/b026.json
          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json

  full_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2392929d247ba8e5b37617b22244b9e11b129959
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact-head closeout and canonical quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_verifier_health.py tests/contract/test_verifier_health_contract.py
          mstr-qualify validate
          pytest -q
          ruff check .
          mypy src

  complete:
    needs: [identity_scope, catalog_semantics, prospective_gate, full_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b023-closeout-qualify-2392929
          fetch-depth: 0
      - name: Final immutable main, closeout head, tree, and PR recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/docs/000b-b023-canonicalize | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          tree=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${EXPECTED_HEAD}" --jq '.tree.sha')
          test "$tree" = "$EXPECTED_TREE"
