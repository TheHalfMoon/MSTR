name: B023 horizontal-whitespace parser repair builder

on:
  push:
    branches:
      - evidence/b023-binding-horizontal-whitespace-review-repair-builder

permissions:
  contents: write

env:
  BASE_SHA: db12d1467bb81185a9affffb4d470626ceceddfa
  SOURCE_SHA: b7f38eda1de80afe34d51aa9fcdbe196f99db121
  SOURCE_BRANCH: fix/b023-cross-workstream-bindings-file-output-safe-atomic-20260901
  TARGET_BRANCH: fix/b023-cross-workstream-bindings-horizontal-safe-atomic-20260901

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable inputs and target absence
        shell: bash
        run: |
          set -euo pipefail
          cp .github/evidence-tools/b023_horizontal_whitespace_patch.py /tmp/b023_patch.py
          git fetch origin main "$SOURCE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$SOURCE_SHA"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target branch already exists" >&2
            exit 1
          fi
          echo "INPUT_IDENTITY=PASS"
      - name: Reconstruct exact source candidate from canonical base
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$BASE_SHA"
          git checkout "$SOURCE_SHA" -- \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md \
            src/mstr_qualify/task_gate.py \
            tests/contract/test_task_gate.py
      - name: Apply reviewed parser hardening
        run: |
          python /tmp/b023_patch.py
          git diff --check
      - name: Verify exact four-file scope and pending task ledger
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md \
            src/mstr_qualify/task_gate.py \
            tests/contract/test_task_gate.py | sort > /tmp/expected
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          test -z "$(git diff --name-only "$BASE_SHA" -- .github/workflows .github/evidence-tools)"
          test -z "$(git diff --name-only "$BASE_SHA" -- specs/002-code-model-supremacy-foundation/tasks.md)"
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md
          echo "SCOPE=PASS"
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused task-gate tests
        run: python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src
      - name: Prospective B023 eligibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from mstr_qualify.task_gate import evaluate_task_snapshot

          result = evaluate_task_snapshot(
              'B023',
              repository_root=Path.cwd(),
              catalog_path=Path('configs/task-gate/mstr-000b.json'),
              canonical_main='db12d1467bb81185a9affffb4d470626ceceddfa',
          )
          assert result['eligible'] is True, result
          rows = {item['task_id']: item for item in result['prerequisite_results']}
          assert set(rows) == {'A006', 'A014', 'B002', 'B022'}, rows
          assert all(rows[item]['satisfied'] is True for item in rows), rows
          print('B023_PROSPECTIVE_ELIGIBLE=PASS')
          PY
      - name: Create one-parent atomic candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MSTR Evidence Builder"
          git config user.email "mstr-evidence-builder@users.noreply.github.com"
          git add \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md \
            src/mstr_qualify/task_gate.py \
            tests/contract/test_task_gate.py
          git commit -m "fix(task-gate): restrict external markdown whitespace"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..HEAD")" -eq 1
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - name: Final guarded push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SOURCE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$SOURCE_SHA"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target branch appeared during qualification" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE"
          echo "GUARDED_PUSH=PASS"
