name: PR198 B012 case-checkpoint activation postmerge

on:
  push:
    branches:
      - evidence/pr198-b012-case-checkpoint-activation-postmerge-145be15

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 4deca995306c197e5cefaf8202e64fe5469f873c
      SUBJECT: 0cf22bf5aab2dc73be1dea18d2008b77ca34425f
      MERGE: 145be15a32448d00fada0e2d9bf736f265c942a1
      PR: '198'
      QUAL_RUN: '34262561948'
      REVIEW_RUN: '34263326436'
      PREMERGE_RUN: '34263764312'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove canonical merge identity and evidence chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$MERGE"
          test "$(git rev-parse origin/main)" = "$MERGE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE"
          parents="$(git show -s --format=%P HEAD)"
          test "$parents" = "$BASE $SUBJECT"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg merge "$MERGE" --arg head "$SUBJECT" '.state=="closed" and .merged==true and .merge_commit_sha==$merge and .head.sha==$head' /tmp/pr.json >/dev/null
          for run in "$QUAL_RUN" "$REVIEW_RUN" "$PREMERGE_RUN"; do
            gh api "repos/$REPO/actions/runs/$run" > "/tmp/run-$run.json"
            jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1' "/tmp/run-$run.json" >/dev/null
          done

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Prove canonical activation and dispatch separation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          mp=Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          bp=Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          active=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          spec=Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          script=Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          m=json.loads(mp.read_text(encoding='utf-8')); b=json.loads(bp.read_text(encoding='utf-8'))
          act=m['activation']; bound=b['qwen_raw_code_case_checkpoint_activation']; d=m['durability_boundary']; t=m['topology']
          assert m['task_id']=='B012' and m['candidate_id']=='qwen3.5-0.8b-control'
          assert act['active_workflow_materialized'] is True
          assert act['activation_repository_change_only'] is True
          assert act['activation_model_access']=='NONE' and act['activation_model_execution']=='NONE' and act['activation_paid_cost_usd']==0.0
          assert active.read_bytes()==spec.read_bytes()
          assert m['case_checkpoint_script_sha256']==sha(script)
          assert m['case_checkpoint_workflow_sha256']==sha(spec)==sha(active)
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          assert bound['repair_id']==m['repair_id']
          assert bound['repair_manifest_sha256']==sha(mp)
          assert bound['case_checkpoint_script_sha256']==sha(script)
          assert bound['active_workflow_sha256']==sha(active)
          for key in ('retry_authority_created','external_dispatch_authority_created','candidate_expansion','revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert bound[key] is False, key
          assert bound['model_access']=='NONE' and bound['model_execution']=='NONE' and bound['paid_cost_usd']==0.0
          assert d['checkpoint_write_must_succeed_before_completed_state_commit'] is True
          assert d['each_completed_raw_code_case_upload_precedes_next_case'] is True
          assert d['actions_artifacts_are_transient_transport_not_canonical_evidence'] is True
          assert d['all_checkpoint_artifacts_must_be_canonicalized_to_git_before_dispatch_closeout'] is True
          assert d['missing_or_expired_checkpoint_artifact_fails_closed'] is True
          assert t['maximum_uncheckpointed_raw_code_cases']==1
          assert t['raw_code_case_order']==['python-clamp','python-dedupe','python-safe-divide']
          text=active.read_text(encoding='utf-8')
          assert "github.event.issue.number == 162" in text
          assert "github.event.comment.user.login == 'TheHalfMoon'" in text
          assert "github.event.comment.author_association == 'OWNER'" in text
          assert "github.event.comment.body == 'B012_RECOVER_RAW_CODE_CASE_CHECKPOINT qwen3.5-0.8b-control 34155931982'" in text
          assert text.count('actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02')==7
          PY

      - name: Reprove exact-main B012 eligibility and Founder authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012' and d['canonical_main']==os.environ['MERGE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL' and a['task_id']=='B012'
          assert a['cost_resource_ceiling']['limits'][0]['max']==0.0
          PY

      - name: Postmerge repository quality
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q tests/contract/test_b012_executor_binding.py tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py tests/contract/test_b012_qwen_raw_code_recovery.py tests/contract/test_b012_qwen_staged_recovery_topology.py tests/contract/test_b012_runner_shutdown_evidence.py tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check tests/contract/test_b012_executor_binding.py tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py tests/contract/test_b012_qwen_raw_code_recovery.py tests/contract/test_b012_qwen_staged_recovery_topology.py tests/contract/test_b012_runner_shutdown_evidence.py tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final canonical-main guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg merge "$MERGE" '.merged==true and .merge_commit_sha==$merge' /tmp/pr-final.json >/dev/null
          echo 'PR198_POSTMERGE=PASS'
