name: Prove B007 entry 9b4e885

on:
  push:
    branches: [evidence/b007-entry-9b4e885]

permissions:
  contents: read

jobs:
  entry:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 9b4e885f215fd922ecf79ff9e15bdb1479396668
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove production entry condition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B007 > /tmp/b007.json
          python -m mstr_qualify task drift > /tmp/drift.json
          cat /tmp/b007.json
          cat /tmp/drift.json
          python - <<'PY'
          import json, os
          b=json.load(open('/tmp/b007.json'))
          d=json.load(open('/tmp/drift.json'))
          main=os.environ['EXPECTED_MAIN']
          assert b['canonical_main']==main and b['task_id']=='B007', b
          assert b['eligible'] is True and b['reasons']==[], b
          assert b['state_consistency_result']['observed_state']=='PENDING', b
          assert b['prerequisite_results'][0]['task_id']=='B006', b
          assert b['prerequisite_results'][0]['satisfied'] is True, b
          assert d['canonical_main']==main and d['status']=='clean' and d['findings']==[], d
          print('B007_EXACT_MAIN_ENTRY=PASS')
          PY
      - name: Final entry immutability
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          echo B007_ENTRY_IMMUTABILITY=PASS
