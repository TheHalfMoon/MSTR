name: PR197 B012 case-checkpoint qualification 82fa7c4

on:
  push:
    branches:
      - evidence/pr197-b012-case-checkpoint-qualification-82fa7c4

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPO: TheHalfMoon/MSTR
      PR: '197'
      BASE: 2d35efe6d7350f6aa0241ee9de128134cd321f90
      HEAD: 82fa7c419dd438381fb4045226593ce9e3c8fcf6
      TREE: ccb9352c4f980b88636ec4cfbbb85095530110a6
      SUBJECT_BRANCH: fix/b012-qwen-raw-code-case-checkpoint-topology
      REPAIR_PARENT: be5dc182c7f15602b5da0999ad7f55108233c568
      BUILDER_RUN: '34257760888'
      BUILDER_HEAD: 750ccdc04de62bd84e67a4bcc3ace47e97358c6f
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact repaired subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove immutable PR identity and builder lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$REPAIR_PARENT"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$SUBJECT_BRANCH)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git rev-list --count "$BASE..$HEAD")" = '2'
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg b "$BASE" --arg h "$HEAD" '.state=="open" and .draft==false and .base.ref=="main" and .base.sha==$b and .head.sha==$h and .changed_files==5' /tmp/pr.json >/dev/null
          gh api "repos/$REPO/actions/runs/$BUILDER_RUN" > /tmp/builder.json
          jq -e --arg bh "$BUILDER_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$bh' /tmp/builder.json >/dev/null

      - name: Prove exact five-file scope and frozen canonical surfaces
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            'artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json' \
            'colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py' \
            'configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml' \
            'evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md' \
            'tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py' | sort)
          test "$(git diff --name-only "$BASE...$HEAD" | sort)" = "$expected"
          git diff --check "$BASE...$HEAD"
          for path in \
            .github/workflows/b012-qwen-raw-code-recovery.yml \
            artifacts/manifests/B012-executor-toolchain-binding.json \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B012-equivalent-qualification-execution-envelope.json \
            artifacts/manifests/B012-executor-toolchain-lock.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_raw_code.py; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done
          echo 'FROZEN_CANONICAL_SURFACES=PASS'

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reprove B012 exact-main machine eligibility
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE"
          git branch -f main "$BASE"
          test "$(git rev-parse HEAD)" = "$BASE"
          python -m mstr_qualify task eligible B012 > /tmp/eligibility.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/eligibility.json', encoding='utf-8'))
          assert d['schema_version']=='mstr.task-eligibility.v0'
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']=={
              'required': True,
              'authority_id': 'B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION',
              'satisfied': True,
              'reasons': [],
          }
          assert all(x['evidence_present'] is True for x in d['prerequisite_results'])
          assert all(x['satisfied'] is True and x['reasons']==[] for x in d['prerequisite_results'])
          assert d['supersession_result']['satisfied'] is True
          assert d['state_consistency_result']['satisfied'] is True
          assert d['candidate_pool_result']['satisfied'] is True
          assert all(d['semantic_checks'].values())
          print('B012_EXACT_MAIN_ELIGIBILITY=PASS')
          PY
          git checkout --detach "$HEAD"

      - name: Prove repaired durability and non-authorizing semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path=Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          script_path=Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          workflow_path=Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          evidence_path=Path('evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md')
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['base_main']=='2d35efe6d7350f6aa0241ee9de128134cd321f90'
          assert m['candidate_id']=='qwen3.5-0.8b-control'
          assert m['prior_qualification_run_id']==34155931982
          assert m['case_checkpoint_script_sha256']==sha(script_path)
          assert m['case_checkpoint_workflow_sha256']==sha(workflow_path)
          d=m['durability_boundary']
          assert d['checkpoint_write_must_succeed_before_completed_state_commit'] is True
          assert d['actions_artifact_retention_days']==7
          assert d['actions_artifacts_are_transient_transport_not_canonical_evidence'] is True
          assert d['canonical_long_term_evidence_store']=='GIT_JSON_REPORTS_MANIFESTS_EVIDENCE'
          assert d['storage_policy_path']=='docs/canonical/STORAGE_ARCHITECTURE.md'
          assert d['all_checkpoint_artifacts_must_be_canonicalized_to_git_before_dispatch_closeout'] is True
          assert d['missing_or_expired_checkpoint_artifact_fails_closed'] is True
          assert m['activation']['active_workflow_materialized'] is False
          authority=m['authority_boundary']
          for key in ('authority_scope_modified','authority_transfer','retry_authority_created','external_dispatch_authority_created','candidate_expansion','candidate_revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert authority[key] is False, key
          text=script_path.read_text(encoding='utf-8')
          start=text.index('def _complete_stage(')
          end=text.index('\ndef _stage_init', start)
          block=text[start:end]
          assert block.index('_checkpoint_path(output_dir, stage)') < block.index('_state_path(output_dir)')
          evidence=evidence_path.read_text(encoding='utf-8')
          assert 'Every required checkpoint artifact from an authorized case-checkpoint dispatch MUST be captured, hash-verified, and canonicalized into Git evidence before B012 dispatch closeout or any candidate-admission decision.' in evidence
          print('REPAIRED_DURABILITY_SEMANTICS=PASS')
          PY

      - name: Focused B012 repair contracts
        run: |
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py

      - name: Repository validation and static quality
        run: |
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py

      - name: Full repository tests
        run: python -m pytest -q

      - name: Mypy
        run: python -m mypy src/mstr_qualify

      - name: Final immutable qualification guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/final.json
          jq -e --arg b "$BASE" --arg h "$HEAD" '.state=="open" and .draft==false and .base.sha==$b and .head.sha==$h and .changed_files==5' /tmp/final.json >/dev/null
          echo 'PR197_EXACT_HEAD_QUALIFICATION=SUCCESS'
