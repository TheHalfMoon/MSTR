name: B012 case-checkpoint repair builder

on:
  push:
    branches:
      - evidence/b012-case-checkpoint-repair-builder-1d0e70c

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      BASE: 2d35efe6d7350f6aa0241ee9de128134cd321f90
      SUBJECT: 1d0e70c1a867f444cd71542658573d02f3c30747
      SUBJECT_TREE: 73458138de06d197647231dc6bc5945dbbbd89a2
    steps:
      - name: Checkout exact repair subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SUBJECT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Prove exact base subject and five-file scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          test "$(git show -s --format=%T HEAD)" = "$SUBJECT_TREE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" "$SUBJECT")" = "$BASE"
          git diff --name-only "$BASE..$SUBJECT" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json
          colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py
          configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml
          evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md
          tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test "$(wc -l < /tmp/actual.txt)" -eq 5

      - name: Prove frozen execution and authority surfaces are unchanged
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/b012-qwen-raw-code-recovery.yml \
            artifacts/manifests/B012-executor-toolchain-binding.json \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B012-equivalent-qualification-execution-envelope.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_raw_code.py \
            configs/mstr-000b/executor-toolchain-lock.json; do
            test "$(git rev-parse "$BASE:$path")" = "$(git rev-parse "$SUBJECT:$path")"
          done

      - name: Prove repair manifest hashes and fail-closed semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          m=json.loads(Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json').read_text())
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['base_main']=='2d35efe6d7350f6aa0241ee9de128134cd321f90'
          assert m['case_checkpoint_script_sha256']==sha(m['case_checkpoint_script_path'])
          assert m['case_checkpoint_workflow_sha256']==sha(m['case_checkpoint_workflow_spec_path'])
          assert m['raw_code_manifest_sha256']==sha(m['raw_code_manifest_path'])
          assert m['topology']['raw_code_case_order']==['python-clamp','python-dedupe','python-safe-divide']
          assert m['topology']['maximum_uncheckpointed_raw_code_cases']==1
          assert m['topology']['max_job_minutes']==45
          assert m['activation']['active_workflow_materialized'] is False
          assert m['activation']['separate_activation_pr_required'] is True
          assert m['triggering_incident']['run_id']==34231845282
          assert m['triggering_incident']['canonical_incident_postmerge_run_id']==34250328560
          assert m['triggering_incident']['model_quality_verdict']=='NONE'
          assert m['triggering_incident']['candidate_admission_decision']=='NONE'
          for key in ('authority_scope_modified','authority_transfer','retry_authority_created','external_dispatch_authority_created','candidate_expansion','candidate_revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert m['authority_boundary'][key] is False, key
          PY

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reprove B012 exact-main machine eligibility
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "$BASE"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text())
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True
          assert d['authority_result']['required'] is True
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['superseded'] is False
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          PY
          git checkout --detach "$SUBJECT"
          test "$(git rev-parse HEAD)" = "$SUBJECT"

      - name: Focused repair contracts
        run: |
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py

      - name: Repository validation and static quality
        run: |
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py

      - name: Full repository tests
        run: python -m pytest -q

      - name: Mypy
        run: python -m mypy src/mstr_qualify

      - name: Final immutable subject guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          test "$(git show -s --format=%T HEAD)" = "$SUBJECT_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/fix/b012-qwen-raw-code-case-checkpoint-topology | cut -f1)" = "$SUBJECT"
          echo 'B012_CASE_CHECKPOINT_REPAIR_BUILDER=PASS'
