name: Repair B027 canonical ref trust after review

on:
  push:
    branches:
      - evidence/b027-canonical-ref-review-repair

permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  EXPECTED_MAIN: 312d40eee8400a0dab94633f891b206f66a82855
  EXPECTED_OLD_HEAD: 315984b5b0d4013d19baf3868f385bbfce6bdfa4
  CANDIDATE_BRANCH: feat/000b-b027-ladder-pilot
  PR_NUMBER: '141'
  GH_TOKEN: ${{ github.token }}

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_BRANCH }}
          fetch-depth: 0

      - name: Checkout repair driver
        uses: actions/checkout@v4
        with:
          ref: evidence/b027-canonical-ref-review-repair
          path: _repair
          fetch-depth: 1

      - name: Verify immutable repair entry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$CANDIDATE_BRANCH | cut -f1)" = "$EXPECTED_OLD_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$EXPECTED_MAIN" --arg head "$EXPECTED_OLD_HEAD" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head' /tmp/pr.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" --paginate > /tmp/review-comments.json
          jq -e '[.[] | select(.id == 3919398422 and .path == "scripts/research/b027_ladder_pilot.py")] | length == 1' /tmp/review-comments.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install canonical development gates
        run: python -m pip install -e '.[dev]'

      - name: Apply canonical-ref trust repair
        shell: bash
        run: |
          set -euo pipefail
          python _repair/tools/b027_repair.py
          python -m ruff check scripts/research/b027_ladder_pilot.py tests/contract/test_b027_ladder_pilot.py
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$CANDIDATE_BRANCH | cut -f1)" = "$EXPECTED_OLD_HEAD"

      - name: Commit trust-boundary repair before regeneration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add scripts/research/b027_ladder_pilot.py tests/contract/test_b027_ladder_pilot.py
          git commit -m 'fix(mstr-000b): preserve canonical refs during B027 validation'

      - name: Remove stale self-attested campaign tree
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/results/research/B027/entry-eligibility.json /tmp/b027-entry-eligibility.json
          rm -rf artifacts/results/research/B027
          mkdir -p artifacts/results/research/B027
          cp /tmp/b027-entry-eligibility.json artifacts/results/research/B027/entry-eligibility.json
          rm -f evidence/mstr-000b/B027-ladder-pilot.md
          git add -A artifacts/results/research/B027 evidence/mstr-000b/B027-ladder-pilot.md
          git commit -m 'evidence(mstr-000b): reset B027 pilot after ref-trust repair'

      - name: Rebuild bounded B027 campaign without canonical ref mutation
        shell: bash
        run: |
          set -euo pipefail
          origin_before="$(git rev-parse refs/remotes/origin/main)"
          local_before="$(git rev-parse --verify refs/heads/main 2>/dev/null || true)"
          test "$origin_before" = "$EXPECTED_MAIN"
          python scripts/research/b027_ladder_pilot.py | tee /tmp/b027-rebuilt-summary.json
          origin_after="$(git rev-parse refs/remotes/origin/main)"
          local_after="$(git rev-parse --verify refs/heads/main 2>/dev/null || true)"
          test "$origin_after" = "$origin_before"
          test "$local_after" = "$local_before"
          jq -e '.campaign_id == "b027-offline-ladder-pilot-v0" and (.final_head | length) == 40 and (.frozen_evaluation_identity | startswith("sha256:"))' /tmp/b027-rebuilt-summary.json
          grep -q 'PENDING_POST_MERGE_VALIDATION' artifacts/results/research/B027/campaign-ledger.json
          grep -q 'PROSPECTIVE_NO_CANONICAL_REF_REWRITE' artifacts/results/research/B027/campaign-ledger.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

      - name: Run repaired focused and full gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/contract/test_b027_ladder_pilot.py tests/contract/test_research_ladder_contract.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          ! grep -q 'update-ref' scripts/research/b027_ladder_pilot.py
          test ! -e artifacts/authorities/B027.json
          test ! -e artifacts/results/research/B027/registry/b027-l2.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$CANDIDATE_BRANCH | cut -f1)" = "$EXPECTED_OLD_HEAD"

      - name: Publish repaired exact B027 candidate with old-head guard
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/$CANDIDATE_BRANCH | cut -f1)"
          test "$remote_head" = "$EXPECTED_OLD_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git push origin HEAD:"refs/heads/$CANDIDATE_BRANCH"
          echo "B027_REPAIRED_HEAD=$(git rev-parse HEAD)"
          echo "B027_REPAIRED_TREE=$(git rev-parse HEAD^{tree})"
          echo "B027_COMMITS_FROM_MAIN=$(git rev-list --count "$EXPECTED_MAIN"..HEAD)"
          echo "B027_CHANGED_FILES=$(git diff --name-only "$EXPECTED_MAIN"..HEAD | wc -l | tr -d ' ')"
          echo 'MODEL_EXECUTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
