name: B012 Qwen CLI incompatibility incident builder

on:
  push:
    branches:
      - evidence/b012-qwen-cli-incompatibility-builder-ddcb989

permissions:
  contents: write

env:
  TARGET_BRANCH: governance/b012-qwen-one-shot-cli-incompatibility-34288154926
  EXPECTED_TARGET_HEAD: ddcb9897d8caae59f8dcdec4692fe31f1916064f
  EXPECTED_MAIN: 66cd090fc75286bfc24db4bdf8fe58b64394e228
  INCIDENT_SHA256: 20e30ef5382189dc22407df0caaab171668c91863cdf972a66bfd90e4615f03d

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact incident branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Guard exact branch and canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_TARGET_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

      - name: Patch fail-closed binding and current-state B012 contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          OLD = "SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL"
          NEW = "BLOCKED_PENDING_QWEN_RAW_CODE_RUNTIME_CONTRACT_REPAIR"
          binding_path = Path("artifacts/manifests/B012-executor-toolchain-binding.json")
          incident_path = Path("artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-one-shot-runtime-cli-incompatibility-run-34288154926.json")
          incident_bytes = incident_path.read_bytes()
          assert hashlib.sha256(incident_bytes).hexdigest() == "20e30ef5382189dc22407df0caaab171668c91863cdf972a66bfd90e4615f03d"
          incident = json.loads(incident_bytes)

          binding = json.loads(binding_path.read_text(encoding="utf-8"))
          assert binding["status"] == OLD
          key = "qwen_raw_code_one_shot_runtime_cli_incompatibility"
          assert key not in binding
          binding["status"] = NEW
          binding[key] = {
              "run_id": 34288154926,
              "run_attempt": 1,
              "job_id": 102268410928,
              "candidate_id": "qwen3.5-0.8b-control",
              "canonical_main_at_start": "66cd090fc75286bfc24db4bdf8fe58b64394e228",
              "failure_classification": "B012_EXECUTOR_RUNTIME_CLI_INCOMPATIBILITY_RAW_CODE_UNEXECUTED",
              "failure_evidence_path": str(incident_path),
              "failure_evidence_sha256": "20e30ef5382189dc22407df0caaab171668c91863cdf972a66bfd90e4615f03d",
              "executor_failure_path": incident["canonical_source_files"]["failure"]["path"],
              "executor_failure_sha256": incident["canonical_source_files"]["failure"]["sha256"],
              "state_path": incident["canonical_source_files"]["state"]["path"],
              "state_sha256": incident["canonical_source_files"]["state"]["sha256"],
              "checkpoint_01_sha256": incident["canonical_source_files"]["checkpoint_01_init"]["sha256"],
              "checkpoint_02_sha256": incident["canonical_source_files"]["checkpoint_02_source"]["sha256"],
              "checkpoint_03_sha256": incident["canonical_source_files"]["checkpoint_03_quantize"]["sha256"],
              "durable_stages": ["init", "source", "quantize"],
              "durable_raw_code_case_count": 0,
              "raw_code_result": "NONE_DURABLY_PROVEN",
              "model_quality_verdict": "NONE",
              "candidate_admission_decision": "NONE",
              "candidate_execution_completion": "NOT_PROVEN",
              "cleanup_completion": "PROVEN_WORKFLOW_SUCCESS",
              "runtime_repository": "https://github.com/ggml-org/llama.cpp.git",
              "runtime_commit": "3173a56471c1753650cd806694145ffd6dcace67",
              "runtime_binary": "llama-cli",
              "parser_example": "LLAMA_EXAMPLE_CLI",
              "rejected_argument": "--no-conversation",
              "argument_scope": "LLAMA_EXAMPLE_COMPLETION_ONLY",
              "runtime_contract_repair_required": True,
              "runtime_migration_requires_equivalence_review": True,
              "same_topology_redispatch_authorized": False,
              "cross_run_resume_authority_created": False,
              "retry_authority_created": False,
              "external_dispatch_authority_created": False,
              "task_eligibility_entry_run_id": 34290864636,
              "candidate_expansion": False,
              "revision_or_file_expansion": False,
              "training": False,
              "weight_changing_training": False,
              "paid_compute": False,
              "paid_model_api": False,
              "paid_cost_usd": 0.0,
              "production_release": False,
          }
          binding_path.write_text(json.dumps(binding, indent=2) + "\n", encoding="utf-8")

          changed = []
          replacements = 0
          for path in sorted(Path("tests/contract").glob("test_b012*.py")):
              text = path.read_text(encoding="utf-8")
              count = text.count(OLD)
              if count:
                  path.write_text(text.replace(OLD, NEW), encoding="utf-8")
                  changed.append(str(path))
                  replacements += count
          assert replacements >= 8, replacements
          print(f"binding_status_replacements={replacements}")
          print("changed_status_contracts=" + ",".join(changed))

          test_path = Path("tests/contract/test_b012_qwen_one_shot_runtime_cli_incompatibility_evidence.py")
          assert not test_path.exists()
          test_path.write_text('''from __future__ import annotations

import hashlib
import json
from pathlib import Path

ROOT = Path(__file__).resolve().parents[2]
BINDING = ROOT / "artifacts/manifests/B012-executor-toolchain-binding.json"
INCIDENT = ROOT / "artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-one-shot-runtime-cli-incompatibility-run-34288154926.json"
CHECKPOINT_DIR = ROOT / "artifacts/results/equivalent/B012/checkpoints/34288154926"
FAILURE = CHECKPOINT_DIR / "B012-qwen3.5-0.8b-control-raw-code-recovery-case-failure.json"
STATE = CHECKPOINT_DIR / "B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json"
CP1 = CHECKPOINT_DIR / "B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-01-init.json"
CP2 = CHECKPOINT_DIR / "B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-02-source.json"
CP3 = CHECKPOINT_DIR / "B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-03-quantize.json"
RAW_HELPER = ROOT / "colab/mstr_b012_raw_code.py"
TOOLCHAIN_LOCK = ROOT / "artifacts/manifests/B012-executor-toolchain-lock.json"
RAW_MANIFEST = ROOT / "benchmarks/manifests/B012-raw-code-proxy.json"


def _read(path: Path) -> dict[str, object]:
    return json.loads(path.read_text(encoding="utf-8"))


def _sha256(path: Path) -> str:
    return hashlib.sha256(path.read_bytes()).hexdigest()


def test_one_shot_cli_incompatibility_is_canonical_and_fail_closed() -> None:
    binding = _read(BINDING)
    incident = _read(INCIDENT)
    failure = _read(FAILURE)
    state = _read(STATE)

    assert _sha256(INCIDENT) == "20e30ef5382189dc22407df0caaab171668c91863cdf972a66bfd90e4615f03d"
    assert binding["status"] == "BLOCKED_PENDING_QWEN_RAW_CODE_RUNTIME_CONTRACT_REPAIR"
    bound = binding["qwen_raw_code_one_shot_runtime_cli_incompatibility"]
    assert bound["run_id"] == 34288154926
    assert bound["run_attempt"] == 1
    assert bound["job_id"] == 102268410928
    assert bound["failure_evidence_sha256"] == _sha256(INCIDENT)
    assert bound["runtime_contract_repair_required"] is True
    assert bound["runtime_migration_requires_equivalence_review"] is True
    assert bound["same_topology_redispatch_authorized"] is False
    assert bound["retry_authority_created"] is False
    assert bound["external_dispatch_authority_created"] is False
    assert bound["cross_run_resume_authority_created"] is False

    assert incident["failure_classification"] == "B012_EXECUTOR_RUNTIME_CLI_INCOMPATIBILITY_RAW_CODE_UNEXECUTED"
    assert incident["root_cause"]["runtime_commit"] == "3173a56471c1753650cd806694145ffd6dcace67"
    assert incident["root_cause"]["runtime_binary"] == "llama-cli"
    assert incident["root_cause"]["parser_example"] == "LLAMA_EXAMPLE_CLI"
    assert incident["root_cause"]["rejected_argument"] == "--no-conversation"
    assert incident["root_cause"]["argument_scope"] == "LLAMA_EXAMPLE_COMPLETION_ONLY"
    assert incident["root_cause"]["runner_shutdown_observed"] is False
    assert incident["root_cause"]["timeout_observed"] is False
    assert incident["execution"]["durable_raw_code_cases"] == []
    assert incident["execution"]["raw_code_result"] == "NONE_DURABLY_PROVEN"
    assert incident["execution"]["model_quality_verdict"] == "NONE"
    assert incident["execution"]["candidate_admission_decision"] == "NONE"
    assert incident["execution"]["candidate_execution_completion"] == "NOT_PROVEN"
    assert incident["execution"]["cleanup"] == "PROVEN_WORKFLOW_SUCCESS"
    assert incident["canonical_effect"]["b012_state"] == "PENDING"
    assert incident["canonical_effect"]["b013_opening_authorized"] is False

    assert failure["completed_raw_code_cases"] == []
    assert failure["model_quality_verdict"] == "NONE"
    assert failure["candidate_admission_decision"] == "NONE"
    assert "error: invalid argument: --no-conversation" in failure["error"]
    assert state["completed_stages"] == ["init", "source", "quantize"]
    assert state["raw_code_case_results"] == {}
    assert not (CHECKPOINT_DIR / "B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-04a-raw-code-python-clamp.json").exists()


def test_one_shot_cli_incident_preserves_exact_durable_sources() -> None:
    assert _sha256(FAILURE) == "b0aff98dabafd1335b27a771cd74e4cffa9364da3a7d22154db618a7173743ef"
    assert _sha256(STATE) == "4c5c6521180b17949d77bdedf2d18c04dfb7f3345dde40db14527ff3b407e3b8"
    assert _sha256(CP1) == "fb6b5165037691699a36ed53a5d239d500a2818ed230f06932743bfc6072f14f"
    assert _sha256(CP2) == "d95e154bb519cd89359483f49566ad7bcda05127991bd8b1116d8a250e7e5b58"
    assert _sha256(CP3) == "0f09abec985a3bb26987f529d86a9d9b1ed6dd2859250700520a81be733322e7"
    cp2 = _read(CP2)
    cp3 = _read(CP3)
    assert cp2["checkpoint_payload"]["verified_file_count"] == 9
    assert cp2["checkpoint_payload"]["verified_download_bytes"] == 1769897109
    assert cp3["checkpoint_payload"]["q4_k_m_sha256"] == "177a8435373b58e09910ee68e6643f656b5d93b6d64e03ee4c37be4a86c995fa"
    assert cp3["checkpoint_payload"]["q4_k_m_size_bytes"] == 541903296


def test_failed_executor_is_preserved_until_separate_runtime_contract_repair() -> None:
    helper = RAW_HELPER.read_text(encoding="utf-8")
    assert helper.count('"--no-conversation"') == 1
    lock = _read(TOOLCHAIN_LOCK)
    raw = _read(RAW_MANIFEST)
    assert lock["llama_cpp"]["runtime_commit"] == "3173a56471c1753650cd806694145ffd6dcace67"
    assert raw["execution"]["runtime"] == "llama.cpp-llama-cli-cpu"
    assert raw["execution"] == {
        "runtime": "llama.cpp-llama-cli-cpu",
        "context_tokens": 2048,
        "generated_tokens": 96,
        "threads": 2,
        "gpu_layers": 0,
        "temperature": 0.0,
        "seed": 42,
        "network_model_calls": 0,
    }
''', encoding="utf-8")
          PY

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused B012 contracts and static quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/contract/test_b012*.py -q
          python -m ruff check tests/contract/test_b012*.py
          python -m ruff format --check tests/contract/test_b012*.py
          git diff --check

      - name: Guard canonical main and exact target before write
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_TARGET_HEAD"

      - name: Commit and push incident reblock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/manifests/B012-executor-toolchain-binding.json tests/contract/test_b012*.py
          git diff --cached --quiet && { echo "no incident reblock changes" >&2; exit 1; }
          git commit -m "governance(b012): reblock Qwen raw-code runtime contract"
          git push origin HEAD:"$TARGET_BRANCH"
