name: Build A008 canonical closeout

on:
  push:
    branches:
      - evidence/a008-closeout-build-d6a2c83

permissions:
  contents: write

env:
  CANONICAL_MAIN: d6a2c83227be09b8cd37f62de0d8e841eba9854d
  TARGET_BRANCH: docs/000a-a008-canonicalize
  EXPECTED_TARGET_BEFORE: 7729ca07f992422c28b35e82264a35da6561f2f2

jobs:
  build_closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/000a-a008-canonicalize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact two-file closeout and materialize canonical task ledger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_BEFORE"
          test "$(git rev-parse HEAD^)" = "$CANONICAL_MAIN"
          mapfile -t existing < <(git diff --name-only "$CANONICAL_MAIN" HEAD | sort)
          test "${#existing[@]}" -eq 1
          test "${existing[0]}" = "evidence/mstr-000a/A008-mstr-harness.md"
          python - <<'PY'
          from pathlib import Path

          path = Path("specs/001-agent-harness-verified-loop-foundation/tasks.md")
          text = path.read_text()
          old = """- [ ] **A008 Implement H1 MSTR-native typed harness.**  \n  Adds typed tools/results, stale-safe edits, selective context, recovery cadence, compact state, and measured cache/prefix semantics where applicable.  \n  Outputs: native harness profile/config + tests + `evidence/mstr-000a/A008-mstr-harness.md`.\n"""
          new = """- [x] **A008 Implement H1 MSTR-native typed harness.**\n  Adds typed tools/results, stale-safe edits, selective context, recovery cadence, compact state, and measured cache/prefix semantics where applicable.\n  Outputs: native harness profile/config + tests + `evidence/mstr-000a/A008-mstr-harness.md`.\n  Canonical implementation: PR #100 / final head `79af1ad6c68bbd6026037e49851428be4e650e5c` / merge `d6a2c83227be09b8cd37f62de0d8e841eba9854d`.\n"""
          if text.count(old) != 1:
              raise SystemExit("exact A008 task stanza not found exactly once")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          mapfile -t working < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//' | sort)
          test "${#working[@]}" -eq 1
          test "${working[0]}" = "specs/001-agent-harness-verified-loop-foundation/tasks.md"
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add specs/001-agent-harness-verified-loop-foundation/tasks.md
          git commit -m "docs(mstr-000a): mark A008 canonical"
      - name: Run prospective A008 closeout quality and state proof
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/unit/harness/test_native.py tests/security/test_native_harness_boundary.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src
          mapfile -t actual < <(git diff --name-only "$CANONICAL_MAIN" HEAD | sort)
          expected=(
            evidence/mstr-000a/A008-mstr-harness.md
            specs/001-agent-harness-verified-loop-foundation/tasks.md
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}" | sort)
          grep -Fq -- '- [x] **A008 Implement H1 MSTR-native typed harness.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -Fq 'Canonical implementation: PR #100 / final head `79af1ad6c68bbd6026037e49851428be4e650e5c` / merge `d6a2c83227be09b8cd37f62de0d8e841eba9854d`.' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -Fq '**State:** `COMPLETE_CANONICAL`' evidence/mstr-000a/A008-mstr-harness.md
          grep -Fq 'POST_MERGE_VERIFICATION_RUN = 33357267885 / SUCCESS' evidence/mstr-000a/A008-mstr-harness.md
          grep -Fq -- '- [ ] **A009 Implement H2 WePLD-native adapter.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          test -z "$(git diff --name-only "$CANONICAL_MAIN" HEAD -- src schemas tests AGENTS.md .specify/memory/constitution.md configs/task-gate)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
      - name: Push exact A008 closeout candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:$TARGET_BRANCH
          head="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$head"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
          echo "A008_CLOSEOUT_HEAD=$head"
          echo "A008_CLOSEOUT_TREE=$(git rev-parse HEAD^{tree})"
          echo "A008_CLOSEOUT_FILES=2"
          echo "EXTERNAL_EFFECT=NONE"
