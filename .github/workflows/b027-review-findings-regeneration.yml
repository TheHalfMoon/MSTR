name: Regenerate B027 after exact-head review findings

on:
  push:
    branches:
      - evidence/b027-review-findings-regeneration

permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  EXPECTED_MAIN: 312d40eee8400a0dab94633f891b206f66a82855
  EXPECTED_OLD_HEAD: 3615c5d037bcfa72ebeec66cafc06fd7b9d50405
  CANDIDATE_BRANCH: feat/000b-b027-ladder-pilot
  PR_NUMBER: '141'
  GH_TOKEN: ${{ github.token }}

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_BRANCH }}
          fetch-depth: 0

      - name: Verify immutable regeneration entry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$CANDIDATE_BRANCH | cut -f1)" = "$EXPECTED_OLD_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$EXPECTED_MAIN" --arg head "$EXPECTED_OLD_HEAD" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head' /tmp/pr.json
          test ! -e artifacts/authorities/B027.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install canonical development gates
        run: python -m pip install -e '.[dev]'

      - name: Verify repaired source before regeneration
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check scripts/research/b027_ladder_pilot.py tests/contract/test_b027_ladder_pilot.py
          grep -q '_validate_records_synthetic_merge((l0, l1), l1_registry)' scripts/research/b027_ladder_pilot.py
          grep -q 'pilot.run()' tests/contract/test_b027_ladder_pilot.py
          ! grep -q 'update-ref' scripts/research/b027_ladder_pilot.py
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$CANDIDATE_BRANCH | cut -f1)" = "$EXPECTED_OLD_HEAD"

      - name: Reset stale campaign artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          cp artifacts/results/research/B027/entry-eligibility.json /tmp/b027-entry-eligibility.json
          rm -rf artifacts/results/research/B027
          mkdir -p artifacts/results/research/B027
          cp /tmp/b027-entry-eligibility.json artifacts/results/research/B027/entry-eligibility.json
          rm -f evidence/mstr-000b/B027-ladder-pilot.md
          git add -A artifacts/results/research/B027 evidence/mstr-000b/B027-ladder-pilot.md
          git commit -m 'evidence(mstr-000b): reset B027 after semantic-review repair'

      - name: Rebuild bounded B027 campaign with semantic preflight
        shell: bash
        run: |
          set -euo pipefail
          origin_before="$(git rev-parse refs/remotes/origin/main)"
          local_before="$(git rev-parse --verify refs/heads/main 2>/dev/null || true)"
          test "$origin_before" = "$EXPECTED_MAIN"
          python scripts/research/b027_ladder_pilot.py | tee /tmp/b027-regenerated-summary.json
          origin_after="$(git rev-parse refs/remotes/origin/main)"
          local_after="$(git rev-parse --verify refs/heads/main 2>/dev/null || true)"
          test "$origin_after" = "$origin_before"
          test "$local_after" = "$local_before"
          jq -e '.campaign_id == "b027-offline-ladder-pilot-v0" and (.final_head | length) == 40 and (.frozen_evaluation_identity | startswith("sha256:"))' /tmp/b027-regenerated-summary.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

      - name: Verify regenerated evaluator and campaign bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          result_root = root / 'artifacts' / 'results' / 'research' / 'B027'
          evaluator = 'sha256:' + hashlib.sha256(
              (root / 'scripts' / 'research' / 'b027_ladder_pilot.py').read_bytes()
          ).hexdigest()
          manifest = json.loads((result_root / 'campaign-manifest.json').read_text(encoding='utf-8'))
          ledger = json.loads((result_root / 'campaign-ledger.json').read_text(encoding='utf-8'))
          assert manifest['harness_sha256'] == evaluator.removeprefix('sha256:')
          assert manifest['frozen_evaluation_identity'] == evaluator
          assert ledger['frozen_evaluation_identity'] == evaluator
          assert ledger['canonical_history_status'] == 'PENDING_POST_MERGE_VALIDATION'
          assert ledger['candidate_validation_kind'] == 'PROSPECTIVE_NO_CANONICAL_REF_REWRITE'
          assert [row['decision'] for row in ledger['sequence']] == ['PROMOTE', 'STOP']
          assert ledger['sequence'][1]['early_discard_gate'] == 'code_proxy_thresholds'
          assert not any(ledger['governed_effects'].values())
          for row in ledger['sequence']:
              record_path = result_root / 'registry' / f"{row['experiment_id']}.json"
              raw = record_path.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == row['record_sha256']
              record = json.loads(raw)
              assert record['frozen_evaluation_identity'] == evaluator
          PY
          test ! -e artifacts/results/research/B027/registry/b027-l2.json
          test ! -e artifacts/authorities/B027.json

      - name: Run regenerated focused and full gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/contract/test_b027_ladder_pilot.py tests/contract/test_research_ladder_contract.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          git diff --name-only "$EXPECTED_MAIN"..HEAD > /tmp/changed.txt
          while IFS= read -r path; do
            case "$path" in
              scripts/research/b027_ladder_pilot.py|artifacts/results/research/B027/*|evidence/mstr-000b/B027-ladder-pilot.md|tests/contract/test_b027_ladder_pilot.py) ;;
              *) echo "OUT_OF_SCOPE=$path" >&2; exit 1 ;;
            esac
          done < /tmp/changed.txt
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$CANDIDATE_BRANCH | cut -f1)" = "$EXPECTED_OLD_HEAD"

      - name: Publish regenerated exact candidate with old-head guard
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/$CANDIDATE_BRANCH | cut -f1)"
          test "$remote_head" = "$EXPECTED_OLD_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git push origin HEAD:"refs/heads/$CANDIDATE_BRANCH"
          echo "B027_REGENERATED_HEAD=$(git rev-parse HEAD)"
          echo "B027_REGENERATED_TREE=$(git rev-parse HEAD^{tree})"
          echo "B027_COMMITS_FROM_MAIN=$(git rev-list --count "$EXPECTED_MAIN"..HEAD)"
          echo "B027_CHANGED_FILES=$(git diff --name-only "$EXPECTED_MAIN"..HEAD | wc -l | tr -d ' ')"
          echo 'MODEL_EXECUTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
