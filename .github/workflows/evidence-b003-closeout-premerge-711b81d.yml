name: Evidence B003 closeout pre-merge gate

on:
  push:
    branches:
      - evidence/b003-closeout-premerge-711b81d

permissions:
  contents: read

env:
  EXPECTED_MAIN: 8bea74269fb81a4c898b7a2864bf103d15fd98a9
  EXPECTED_HEAD: 711b81d17fdcd941c881fb3e27ad6494fb271a0b
  TARGET_BRANCH: docs/000b-b003-canonicalize
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  premerge:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact live canonical main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify live refs and closeout head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"
          python - <<'PY'
          import subprocess
          expected = {
              'configs/task-gate/mstr-000b.json',
              'evidence/mstr-000b/B003-drift-detector.md',
              'specs/002-code-model-supremacy-foundation/tasks.md',
              'tests/contract/test_task_gate.py',
              'tests/integration/test_task_gate_cli.py',
          }
          changed = set(subprocess.run(
              ['git', 'diff', '--name-only', '8bea74269fb81a4c898b7a2864bf103d15fd98a9..refs/remotes/origin/docs/000b-b003-canonicalize'],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines())
          assert changed == expected, (changed, expected)
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify production pre-closeout governance state
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B003 > /tmp/b003.json
          set +e
          python -m mstr_qualify task drift > /tmp/drift.json
          drift_rc=$?
          set -e
          test "$drift_rc" -eq 1
          python - <<'PY'
          import json
          b003 = json.load(open('/tmp/b003.json', encoding='utf-8'))
          drift = json.load(open('/tmp/drift.json', encoding='utf-8'))
          assert b003['task_id'] == 'B003', b003
          assert b003['eligible'] is True and b003['reasons'] == [], b003
          assert b003['canonical_main'] == '8bea74269fb81a4c898b7a2864bf103d15fd98a9', b003
          codes = sorted(item['code'] for item in drift['findings'])
          assert codes == [
              'entry_gate.final_head_missing',
              'evidence.implementation_identity_missing',
              'implementation.merged_while_active',
          ], drift
          assert drift['canonical_main'] == '8bea74269fb81a4c898b7a2864bf103d15fd98a9', drift
          print('PREMERGE_B003_PRODUCTION_ELIGIBLE=true')
          print('PREMERGE_EXPECTED_DRIFT_CODES=' + ','.join(codes))
          PY

      - name: Verify immutable live main and closeout head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"
          echo "FINAL_PREMERGE_MAIN=$(git rev-parse HEAD)"
          echo "FINAL_PREMERGE_HEAD=$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)"
