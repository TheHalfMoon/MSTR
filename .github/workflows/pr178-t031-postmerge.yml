name: PR178 T031 postmerge 610bf7d

on:
  push:
    branches:
      - evidence/pr178-t031-postmerge-610bf7d

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  MERGE_SHA: 610bf7dacc5ee921d99a4fa2eb9023553021e84c
  BASE_SHA: f207ed9080fba1bb597a4091029dfd2a381eb346
  REVIEWED_HEAD: a8fa069838e05661d3f32dec960c450363ed5a18
  REVIEWED_TREE: e48c611e695c468ff9508696f2db44139e88d62f
  QUALIFICATION_RUN: "34066070646"
  REVIEW_RUN: "34066244950"
  PREMERGE_RUN: "34066462934"
  EXPECTED_REPLAY_SHA256: 749eaf1f72a27a47a2a3d993d36a8147f71057428e24cee3271abd8a088e93fb
  EXPECTED_FAILURE_SHA256: 22165fc42c064a5f7b9b3c98de9c88d71d154fa0133ec25df71f835f1556b9c3
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  postmerge_identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify merge topology and exact reviewed tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$MERGE_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          root = 'https://api.github.com/repos/TheHalfMoon/MSTR'
          def get(path):
              req = urllib.request.Request(root + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          commit = get(f'/commits/{os.environ["MERGE_SHA"]}')
          assert commit['sha'] == os.environ['MERGE_SHA']
          assert commit['commit']['tree']['sha'] == os.environ['REVIEWED_TREE']
          assert [parent['sha'] for parent in commit['parents']] == [
              os.environ['BASE_SHA'], os.environ['REVIEWED_HEAD']
          ]
          pr = get('/pulls/178')
          assert pr['state'] == 'closed'
          assert pr['merged'] is True
          assert pr['merge_commit_sha'] == os.environ['MERGE_SHA']
          assert pr['head']['sha'] == os.environ['REVIEWED_HEAD']
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          for run_id in (os.environ['QUALIFICATION_RUN'], os.environ['REVIEW_RUN'], os.environ['PREMERGE_RUN']):
              run = get(f'/actions/runs/{run_id}')
              assert run['conclusion'] == 'success', (run_id, run['conclusion'])
          print('PR178_MERGE_TOPOLOGY=PASS')
          print('PR178_REVIEWED_TREE_IDENTITY=PASS')
          print('PR178_PR_STATE=MERGED')
          PY

  postmerge_quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify canonical bindings and full regression
        shell: bash
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = main
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$REVIEWED_TREE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MERGE_SHA"
          test "$(sha256sum colab/mstr_t031_replay.py | awk '{print $1}')" = "$EXPECTED_REPLAY_SHA256"
          test "$(sha256sum artifacts/results/local/T031/failures/T031-granite-4.1-3b-run-34065259852.json | awk '{print $1}')" = "$EXPECTED_FAILURE_SHA256"
          python -m pip install -e '.[dev]'
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          helper = Path('colab/mstr_t031_replay.py')
          helper_sha = hashlib.sha256(helper.read_bytes()).hexdigest()
          assert helper_sha == '749eaf1f72a27a47a2a3d993d36a8147f71057428e24cee3271abd8a088e93fb'

          t031 = json.loads(Path('artifacts/manifests/T031-executor-toolchain-binding.json').read_text())
          b012 = json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          authority = json.loads(Path('artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json').read_text())
          assert t031['producer_replay_helper_sha256'] == helper_sha
          assert b012['replay_helper_sha256'] == helper_sha
          assert t031['producer_replay']['version_consistency_semantics'] == (
              'PEP_440_EQUIVALENCE_AFTER_EXACT_HASH_BOUND_WHEEL_INSTALLATION'
          )
          assert t031['producer_replay']['acceptance_gate'] == 'EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH'
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['candidate_ids'] == [
              'granite-4.1-3b', 'ministral-3-3b', 'qwen2.5-coder-1.5b', 'qwen3-4b',
              'qwen3.5-2b', 'qwen3.5-4b', 'smollm3-3b', 'yi-coder-1.5b',
          ]
          for key in (
              'b010_b012_candidates', 'candidate_revision_or_file_expansion', 'new_candidates',
              'paid_compute', 'paid_model_api', 'production_release', 't032_execution',
              't033_execution', 't034_admission_decision', 'training', 'weight_changing_training',
          ):
              assert authority['scope'][key] is False, key
          print('T031_PEP440_REPAIR_CANONICAL=PASS')
          print('T031_AUTHORITY_BOUNDARY=PASS')
          print('B012_SHARED_REPLAY_BINDING=PASS')
          PY
          python -m pytest -q tests/contract/test_t031_replay_version_equivalence.py tests/contract/test_t031_executor_binding.py tests/contract/test_b012_executor_binding.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          python -m mstr_qualify validate
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MERGE_SHA"
          echo 'PR178_POSTMERGE_QUALITY=PASS'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'

  final_postmerge:
    needs: [postmerge_identity, postmerge_quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Final canonical main guard
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$MERGE_SHA"
          echo 'PR178_POSTMERGE=PASS'
          echo "CANONICAL_MAIN=$MERGE_SHA"
          echo 'MODEL_EXECUTION_AUTHORIZED_BY_POSTMERGE=false'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
