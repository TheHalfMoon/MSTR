name: Format and qualify B010 new-candidate access preflight

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: e3ee155a7e0ed491984908998546900e594bda9a
      TARGET_BRANCH: research/000b-b010-new-candidate-weight-access
      SOURCE_HEAD: ac5e71f9d0940cffdf3db0d049d6776af617392a
      SOURCE_WORKFLOW: .github/workflows/evidence-b010-build-e3ee155.yml
      METADATA_RUN: '33161954193'
      METADATA_JOB: '98818272943'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/000b-b010-new-candidate-weight-access
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact unchanged entry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH" evidence/b010-build-e3ee155
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/evidence/b010-build-e3ee155)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B010_BUILD7_REMOTE_BINDING=PASS'
      - name: Extract source bodies and format generated contract
        shell: bash
        run: |
          set -euo pipefail
          git show "$SOURCE_HEAD:$SOURCE_WORKFLOW" > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/source.yml').read_text(encoding='utf-8')
          def extract(step_name: str, destination: str) -> None:
              marker = f'      - name: {step_name}\n'
              start = source.index(marker)
              run_marker = '        run: |\n'
              body_start = source.index(run_marker, start) + len(run_marker)
              next_step = source.find('\n      - name: ', body_start)
              raw = source[body_start:] if next_step == -1 else source[body_start:next_step]
              lines = raw.splitlines()
              body = [line[10:] if line.startswith('          ') else line for line in lines]
              Path(destination).write_text('\n'.join(body) + '\n', encoding='utf-8')
          extract('Guard exact B010 entry', '/tmp/guard.sh')
          extract('Materialize B010 artifact evidence and contract', '/tmp/materialize.sh')
          extract('Qualify exact local implementation candidate', '/tmp/qualify.sh')
          extract('Recheck refs and push target only', '/tmp/push.sh')
          materialize = Path('/tmp/materialize.sh')
          text = materialize.read_text(encoding='utf-8')
          marker = "expected=$(printf '%s\\n' \\\n"
          assert text.count(marker) == 1
          repair_lines = [
              "python - <<'PY2'",
              "from pathlib import Path",
              "p = Path('tests/contract/test_b010_new_candidate_weight_access.py')",
              "text = p.read_text(encoding='utf-8')",
              "authority_marker = '    authority = manifest[\\\"authority_boundary\\\"]\\n'",
              "start = text.index(authority_marker)",
              "tail = '    authority = manifest[\\\"authority_boundary\\\"]\\n    assert authority[\\\"founder_machine_large_artifacts\\\"] == 0\\n    for key, value in authority.items():\\n        if key != \\\"founder_machine_large_artifacts\\\":\\n            assert value is False, key\\n'",
              "text = text[:start] + tail",
              "old = '    assert \\\"destroyed\\\" in b008.lower()\\n'",
              "new = '    assert \\\"All temporary tokenizer files are deleted in the ephemeral runner before completion.\\\" in b008\\n'",
              "assert text.count(old) == 1",
              "text = text.replace(old, new, 1)",
              "p.write_text(text, encoding='utf-8')",
              "PY2",
              "python -m py_compile tests/contract/test_b010_new_candidate_weight_access.py",
              "ruff format tests/contract/test_b010_new_candidate_weight_access.py",
              "ruff check tests/contract/test_b010_new_candidate_weight_access.py",
              "",
          ]
          materialize.write_text(text.replace(marker, '\n'.join(repair_lines) + marker, 1), encoding='utf-8')
          qualify = Path('/tmp/qualify.sh')
          text = qualify.read_text(encoding='utf-8')
          old_refs = 'git branch -f main "$EXPECTED_MAIN"\ngit update-ref refs/remotes/origin/main "$EXPECTED_MAIN"\n'
          new_refs = 'git branch -f main "$candidate"\ngit update-ref refs/remotes/origin/main "$candidate"\n'
          assert text.count(old_refs) == 1
          text = text.replace(old_refs, new_refs, 1)
          assert text.count('import json, os\n') == 1
          text = text.replace('import json, os\n', 'import json, os, subprocess\n', 1)
          old_expected = "expected = os.environ['EXPECTED_MAIN']\n"
          new_expected = "expected = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()\n"
          assert text.count(old_expected) == 1
          qualify.write_text(text.replace(old_expected, new_expected, 1), encoding='utf-8')
          PY
          bash -n /tmp/guard.sh
          bash -n /tmp/materialize.sh
          bash -n /tmp/qualify.sh
          bash -n /tmp/push.sh
          echo 'B010_BUILD7_HARNESS_FORMATTED=PASS'
      - name: Re-prove exact B010 entry
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/guard.sh
      - name: Materialize formatted B010 candidate
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/materialize.sh
      - name: Simulate candidate and run frozen gates
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/qualify.sh
      - name: Restore live refs and push target only
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/push.sh
