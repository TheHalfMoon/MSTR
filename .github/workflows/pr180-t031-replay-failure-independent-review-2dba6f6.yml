name: PR180 T031 replay failure independent review

on:
  push:
    branches:
      - evidence/pr180-t031-replay-failure-independent-review-2dba6f6

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  SUBJECT_BRANCH: fix/t031-block-failed-59-wheel-replay-34067212730
  SUBJECT_SHA: 2dba6f6d34691ab7686a33de28724aeea67833e3
  SUBJECT_TREE: 4100d850d1f74e61c7bcf1122d084d676855468b
  BASE_SHA: 61bacde1ee21831080accc8a226433562a6aeaf9
  QUALIFICATION_RUN: "34069553031"
  FAILED_RUN: "34067212730"
  FAILED_JOB: "101577971224"
  FAILED_ARTIFACT: "9999577687"
  FAILED_ARTIFACT_ZIP_SHA256: 328c8441041696d91f0aa7ba55b1899544c579592da112649acc772faa00bfeb
  FAILED_JSON_SHA256: 5c22b31305e6aae047671a445bf0c44d0b89df39e6c8226ddb4476b1c78ccfa3
  EXPECTED_T029_F16: b76f61cdf1a11375c734431f661fabe937b7214a54d6defda5f6683bd3473d4d
  OBSERVED_F16: b86ef357954d1b1e5b982cc76a830e8305cc86049ca1bc4e9fcc22c7ab91a5d7

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact review subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Prove live PR identity topology and containment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/TheHalfMoon/MSTR/pulls/180",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as response:
              pr = json.load(response)
          assert pr["state"] == "open"
          assert pr["base"]["ref"] == "main"
          assert pr["base"]["sha"] == os.environ["BASE_SHA"]
          assert pr["head"]["ref"] == os.environ["SUBJECT_BRANCH"]
          assert pr["head"]["sha"] == os.environ["SUBJECT_SHA"]
          assert pr["changed_files"] == 3
          PY
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            "artifacts/results/local/T031/failures/T031-granite-4.1-3b-run-34067212730.json"
            "evidence/T031-59-wheel-replay-equivalence-failure.md"
            "tests/contract/test_t031_59_wheel_replay_failure.py"
          )
          [[ "${#changed[@]}" -eq 3 ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          git checkout --detach "$SUBJECT_SHA"

      - name: Verify qualification identity and success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/{os.environ['QUALIFICATION_RUN']}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as response:
              run = json.load(response)
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert run["head_branch"] == "evidence/pr180-t031-replay-failure-qualification-v2-2dba6f6"
          PY

      - name: Independently verify failed execution metadata and durable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          def get(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          run = get(f"https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/{os.environ['FAILED_RUN']}")
          assert run["status"] == "completed"
          assert run["conclusion"] == "failure"
          assert run["head_sha"] == "610bf7dacc5ee921d99a4fa2eb9023553021e84c"
          jobs = get(f"https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/{os.environ['FAILED_RUN']}/jobs?per_page=100")
          job = next(item for item in jobs["jobs"] if str(item["id"]) == os.environ["FAILED_JOB"])
          assert job["name"] == "measure"
          assert job["conclusion"] == "failure"
          steps = {step["name"]: step["conclusion"] for step in job["steps"]}
          assert steps["Execute governed T031 measurement"] == "failure"
          assert steps["Upload durable JSON evidence only"] == "success"
          artifacts = get(f"https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/{os.environ['FAILED_RUN']}/artifacts?per_page=100")
          artifact = next(item for item in artifacts["artifacts"] if str(item["id"]) == os.environ["FAILED_ARTIFACT"])
          assert artifact["name"] == "t031-granite-4.1-3b"
          assert artifact["digest"] == "sha256:" + os.environ["FAILED_ARTIFACT_ZIP_SHA256"]
          assert artifact["expired"] is False
          PY
          printf '%s  %s\n' "$FAILED_JSON_SHA256" artifacts/results/local/T031/failures/T031-granite-4.1-3b-run-34067212730.json | sha256sum -c -

      - name: Review failure semantics and claim boundaries
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          current = json.loads(Path("artifacts/results/local/T031/failures/T031-granite-4.1-3b-run-34067212730.json").read_text())
          first = json.loads(Path("artifacts/results/local/T031/failures/T031-granite-4.1-3b-run-33999224131.json").read_text())
          expected = os.environ["EXPECTED_T029_F16"]
          observed = os.environ["OBSERVED_F16"]
          assert current["result_classification"] == "T031_EXECUTION_FAILED_CLOSED"
          assert current["error_type"] == "ToolchainError"
          assert current["candidate_id"] == "granite-4.1-3b"
          assert expected in current["error"] and observed in current["error"]
          assert expected in first["error"] and observed in first["error"]
          assert current["paid_cost_usd"] == 0.0
          assert current["training"] is False
          replay = current["producer_replay"]
          assert replay["package_count"] == 59
          assert replay["historical_transitive_identity_claim"] is False
          assert replay["equivalence_gate"] == "EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH"
          evidence = Path("evidence/T031-59-wheel-replay-equivalence-failure.md").read_text()
          for marker in (
              "MODEL_QUALITY_VERDICT=NONE",
              "RUNTIME_MEASUREMENT_ACCEPTED=false",
              "T029_EXPECTED_HASH_REWRITTEN=false",
              "TRAINING=false",
              "PAID_COST_USD=0.0",
              "T032_EXECUTION=false",
              "T033_EXECUTION=false",
              "T034_ADMISSION_DECISION=false",
              "CANDIDATE_EXPANSION=false",
              "No same-action Granite retry is authorized by this evidence.",
          ):
              assert marker in evidence
          assert "does not identify a single package or system component as the root cause" in evidence
          PY

      - name: Run independent focused and full quality verification
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_59_wheel_replay_failure.py tests/contract/test_t031_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check tests/contract/test_t031_59_wheel_replay_failure.py
          python -m mypy src/mstr_qualify

      - name: Final immutable live review guard
        run: |
          set -euo pipefail
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          echo "PR180_INDEPENDENT_REVIEW=PASS"
          echo "FINDINGS=NONE"
          echo "MODEL_EXECUTION=NONE"
          echo "MODEL_ACCESS=NONE"
          echo "TRAINING=false"
          echo "PAID_COST_USD=0.0"
