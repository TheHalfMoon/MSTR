name: Guard B003 second review repair v2

on:
  push:
    branches:
      - evidence/b003-review2-repair-v2

permissions:
  contents: write

jobs:
  repair-b003:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: 85865add4411b3b48800b441a87adcbe68c1d38c
      EXPECTED_MAIN: 0754d552752c2f6c099df2b480de99028e2e26e5
      TARGET_BRANCH: feat/000b-b003-drift-detector
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact guarded target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify live repair preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"

      - name: Apply bounded second-review repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} match count: {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          source = Path('src/mstr_qualify/task_drift.py')
          replace_once(
              source,
              '_MERGE_SUBJECT_RE = re.compile(r"^Merge pull request #(?P<pr>\\d+)\\b")\n',
              '''_MERGE_SUBJECT_RES = (\n    re.compile(r"^Merge pull request #(?P<pr>\\d+)\\b"),\n    re.compile(r"^Merge PR #(?P<pr>\\d+)\\b"),\n    re.compile(r"\\(#(?P<pr>\\d+)\\)\\s*$"),\n)\n''',
              'merge subject patterns',
          )
          replace_once(
              source,
              '''def _merge_commits_by_pr(root: Path) -> dict[int, tuple[str, ...]]:\n    completed = _git(root, "log", "HEAD", "--format=%H%x09%s", code="task_drift.log")\n''',
              '''def _pr_from_commit_subject(subject: str) -> int | None:\n    for pattern in _MERGE_SUBJECT_RES:\n        match = pattern.search(subject)\n        if match is not None:\n            return int(match.group("pr"))\n    return None\n\n\ndef _merge_commits_by_pr(root: Path) -> dict[int, tuple[str, ...]]:\n    completed = _git(root, "log", "HEAD", "--format=%H%x09%s", code="task_drift.log")\n''',
              'merge subject helper',
          )
          replace_once(
              source,
              '''        match = _MERGE_SUBJECT_RE.match(subject)\n        if match and _HEX40_RE.fullmatch(sha):\n            matches.setdefault(int(match.group("pr")), []).append(sha)\n''',
              '''        pr_number = _pr_from_commit_subject(subject)\n        if pr_number is not None and _HEX40_RE.fullmatch(sha):\n            matches.setdefault(pr_number, []).append(sha)\n''',
              'merge history parser',
          )
          replace_once(
              source,
              '''    if terminal and evidence_state is not None and evidence_state != "COMPLETE_CANONICAL":\n''',
              '''    if terminal and evidence_state != "COMPLETE_CANONICAL":\n''',
              'terminal evidence state must exist',
          )
          replace_once(
              source,
              '''        if len(history_merges) > 1:\n            findings.append(\n''',
              '''        if not history_merges:\n            findings.append(\n                _finding(\n                    task_id,\n                    "git.pr_merge_unverifiable",\n                    pr_number=evidence_pr,\n                )\n            )\n        if len(history_merges) > 1:\n            findings.append(\n''',
              'unverifiable PR merge fail closed',
          )
          replace_once(
              source,
              '''    identity_comparison_required = (\n        implementation is not None\n        or bool(history_merges)\n        or any(value is not None for value in identity_values.values())\n    )\n''',
              '''    identity_comparison_required = (\n        (terminal and task_id not in {"B001", "B002"})\n        or implementation is not None\n        or bool(history_merges)\n        or any(value is not None for value in identity_values.values())\n    )\n''',
              'B003+ terminal identity requirement',
          )

          tests = Path('tests/unit/test_task_drift.py')
          replace_once(
              tests,
              '''def _merge_b003_implementation(root: Path, *, include_gate: bool) -> tuple[str, str, str]:\n''',
              '''def _merge_b003_implementation(\n    root: Path,\n    *,\n    include_gate: bool,\n    merge_style: str = "merge",\n) -> tuple[str, str, str]:\n''',
              'merge helper signature',
          )
          replace_once(
              tests,
              '''    _git(\n        root,\n        "merge",\n        "--no-ff",\n        "impl-b003",\n        "-m",\n        "Merge pull request #3 from fixture/impl-b003",\n    )\n    merge_sha = _git(root, "rev-parse", "HEAD")\n''',
              '''    if merge_style == "merge":\n        _git(\n            root,\n            "merge",\n            "--no-ff",\n            "impl-b003",\n            "-m",\n            "Merge pull request #3 from fixture/impl-b003",\n        )\n    elif merge_style == "squash":\n        _git(root, "merge", "--squash", "impl-b003")\n        _git(root, "commit", "-m", "implement B003 fixture (#3)")\n    elif merge_style == "rebase":\n        _git(root, "cherry-pick", final_head)\n    else:\n        raise AssertionError(f"unsupported merge style: {merge_style}")\n    merge_sha = _git(root, "rev-parse", "HEAD")\n''',
              'merge helper styles',
          )
          replace_once(
              tests,
              '''    elif name == "terminal_missing_identity_field":\n        gate_main, final_head, merge_sha = _merge_b003_implementation(root, include_gate=True)\n''',
              '''    elif name == "terminal_all_identity_missing":\n        gate_main = _git(root, "rev-parse", "HEAD")\n        tasks = root / "specs" / "002-code-model-supremacy-foundation" / "tasks.md"\n        text = tasks.read_text(encoding="utf-8")\n        text = text.replace("- [ ] **B003 Drift task.**", "- [x] **B003 Drift task.**", 1)\n        tasks.write_text(text, encoding="utf-8")\n        catalog = root / "configs" / "task-gate" / "mstr-000b.json"\n        payload = json.loads(catalog.read_text(encoding="utf-8"))\n        payload["tasks"]["B003"]["canonical_state"] = "COMPLETE_CANONICAL"\n        catalog.write_text(json.dumps(payload, indent=2) + "\\n", encoding="utf-8")\n        _write_b003_evidence(\n            root,\n            state="COMPLETE_CANONICAL",\n            gate_main=gate_main,\n        )\n        _commit_main(root, "terminal B003 without implementation identity")\n    elif name == "terminal_missing_state":\n        gate_main, final_head, merge_sha = _merge_b003_implementation(root, include_gate=True)\n        _close_b003(root, gate_main=gate_main, final_head=final_head, merge_sha=merge_sha)\n        evidence = root / "evidence" / "mstr-000b" / "B003.md"\n        text = evidence.read_text(encoding="utf-8")\n        state_line = "**State:** COMPLETE_CANONICAL\\n"\n        assert text.count(state_line) == 1\n        evidence.write_text(text.replace(state_line, "", 1), encoding="utf-8")\n        _commit_main(root, "remove canonical evidence state")\n    elif name == "squash_implementation_merged_while_active":\n        _merge_b003_implementation(root, include_gate=True, merge_style="squash")\n    elif name == "rebase_implementation_merge_unverifiable":\n        _merge_b003_implementation(root, include_gate=True, merge_style="rebase")\n    elif name == "terminal_missing_identity_field":\n        gate_main, final_head, merge_sha = _merge_b003_implementation(root, include_gate=True)\n''',
              'new review fixture cases',
          )

          fixture = Path('tests/fixtures/task_drift_cases.json')
          replace_once(
              fixture,
              '''    {\n      "name": "terminal_missing_identity_field",\n      "expected_codes": ["evidence.implementation_identity_missing"]\n    },\n    {\n      "name": "valid_terminal_b003",\n''',
              '''    {\n      "name": "terminal_all_identity_missing",\n      "expected_codes": ["evidence.implementation_identity_missing"]\n    },\n    {\n      "name": "terminal_missing_state",\n      "expected_codes": ["evidence.terminal_state_mismatch"]\n    },\n    {\n      "name": "squash_implementation_merged_while_active",\n      "expected_codes": [\n        "implementation.merged_while_active",\n        "evidence.implementation_identity_missing"\n      ]\n    },\n    {\n      "name": "rebase_implementation_merge_unverifiable",\n      "expected_codes": [\n        "git.pr_merge_unverifiable",\n        "evidence.implementation_identity_missing"\n      ]\n    },\n    {\n      "name": "terminal_missing_identity_field",\n      "expected_codes": ["evidence.implementation_identity_missing"]\n    },\n    {\n      "name": "valid_terminal_b003",\n''',
              'review fixture manifest additions',
          )
          PY

      - name: Verify repair scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile src/mstr_qualify/task_drift.py tests/unit/test_task_drift.py
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          expected = {
              'src/mstr_qualify/task_drift.py',
              'tests/unit/test_task_drift.py',
              'tests/fixtures/task_drift_cases.json',
          }
          changed = set(subprocess.run(
              ['git', 'diff', '--name-only'], check=True, capture_output=True, text=True
          ).stdout.splitlines())
          assert changed == expected, (changed, expected)
          cases = json.loads(Path('tests/fixtures/task_drift_cases.json').read_text(encoding='utf-8'))['cases']
          assert len(cases) == 11, len(cases)
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Run targeted B003 tests
        run: pytest -q tests/unit/test_task_drift.py tests/integration/test_task_drift_cli.py

      - name: Prove repaired detector sees canonical main as clean
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git worktree add --detach /tmp/b003-main "$EXPECTED_MAIN"
          git -C /tmp/b003-main update-ref refs/heads/main "$EXPECTED_MAIN"
          git -C /tmp/b003-main update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          python - <<'PY'
          from pathlib import Path
          from mstr_qualify.task_drift import detect_canonical_drift
          report = detect_canonical_drift(repository_root=Path('/tmp/b003-main'))
          assert report['status'] == 'clean', report
          assert report['findings'] == [], report
          assert report['tasks_checked'] == 34, report
          print('SECOND_REPAIR_CANONICAL_DRIFT_STATUS=clean')
          PY

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Guarded fast-forward repair push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mstr_qualify/task_drift.py tests/unit/test_task_drift.py tests/fixtures/task_drift_cases.json
          git commit -m "fix(mstr-000b): close B003 drift fail-open gaps"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "SECOND_REPAIRED_B003_HEAD=$(git rev-parse HEAD)"
