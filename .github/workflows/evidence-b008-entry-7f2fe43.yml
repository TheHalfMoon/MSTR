name: Prove B008 exact-main entry gate

on:
  push:

permissions:
  contents: read

jobs:
  entry:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 7f2fe43797db4b94103ca07c172de5672806f624
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Exact-main B008 eligibility and drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B008 | tee /tmp/b008-entry.json
          python -m mstr_qualify task drift | tee /tmp/drift.json
          python - <<'PY'
          import json, os
          main=os.environ['EXPECTED_MAIN']
          e=json.load(open('/tmp/b008-entry.json'))
          d=json.load(open('/tmp/drift.json'))
          assert e['canonical_main']==main and e['eligible'] is True and e['reasons']==[], e
          assert e['state_consistency_result']['observed_state']=='PENDING', e
          assert any(p['task_id']=='B007' and p['satisfied'] is True for p in e['prerequisite_results']), e
          assert d['canonical_main']==main and d['status']=='clean' and d['findings']==[], d
          print('B008_ENTRY_GATE=PASS')
          PY

      - name: Enumerate canonical candidate records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('artifacts/candidates').glob('*.json')):
              data=json.loads(p.read_text())
              arch=data.get('architecture', {})
              rights=data.get('rights', {})
              rows.append({
                  'path': str(p),
                  'candidate_id': data.get('candidate_id'),
                  'upstream_id': data.get('upstream_id'),
                  'upstream_revision': data.get('upstream_revision'),
                  'candidate_role': data.get('candidate_role'),
                  'status': data.get('status'),
                  'rights_decision': rights.get('decision'),
                  'account_gate_required': rights.get('account_gate_required'),
                  'clickthrough_gate_required': rights.get('clickthrough_gate_required'),
                  'tokenizer_id': arch.get('tokenizer_id'),
                  'tokenizer_revision': arch.get('tokenizer_revision'),
              })
          print('B008_CANDIDATE_INVENTORY_JSON=' + json.dumps(rows, sort_keys=True, separators=(',', ':')))
          static=[r for r in rows if r['status']=='static_qualified']
          print('B008_STATIC_QUALIFIED_JSON=' + json.dumps(static, sort_keys=True, separators=(',', ':')))
          print(f'B008_CANDIDATE_COUNT={len(rows)}')
          print(f'B008_STATIC_QUALIFIED_COUNT={len(static)}')
          PY

      - name: Final entry immutability and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'TOKENIZER_ARTIFACT_DOWNLOAD=NONE'
          echo 'TOKENIZER_MEASUREMENT=NONE'
          echo 'PAID_COMPUTE=NONE'
          echo 'B008_MATERIAL_EXECUTION=NOT_STARTED'
