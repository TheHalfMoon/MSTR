name: Requalify repaired B006 closeout a9a0dfa

on:
  push:
    branches: [evidence/b006-closeout-qualify-a9a0dfa]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: c96e2fb228a7f3fb0399484a9e6bb1e1d1eb086c
      EXPECTED_HEAD: a9a0dfac7f1040198c1c0e9dbb0590c578b0d16f
      TARGET_BRANCH: docs/000b-b006-canonicalize
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/000b-b006-canonicalize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact repaired head and five-file scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git branch -f main "$EXPECTED_MAIN"
          changed="$(git diff --name-only "$EXPECTED_MAIN"..."$EXPECTED_HEAD" | sort)"
          expected="$(printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/candidates/B006-candidate-reconciliation.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort)"
          test "$changed" = "$expected"
          git diff --check "$EXPECTED_MAIN"..."$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          s=Path('tests/integration/test_task_gate_cli.py').read_text()
          block=s.split('def test_task_eligible_b006_terminal_returns_one',1)[1].split('def test_task_eligible_b007_successor_returns_zero',1)[0]
          assert 'def fake_evaluate_task_eligibility(task_id: str)' in block
          assert 'assert task_id == "B006"' in block
          assert 'lambda task_id: expected' not in block
          print('B006_CLI_DISPATCH_REPAIR=PASS')
          PY
      - name: Prove terminal-successor semantics and frozen gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python - <<'PY'
          import os
          from mstr_qualify.task_gate import evaluate_task_snapshot
          main=os.environ['EXPECTED_MAIN']
          b6=evaluate_task_snapshot('B006', canonical_main=main)
          b7=evaluate_task_snapshot('B007', canonical_main=main)
          assert b6['eligible'] is False and 'task.already_terminal' in b6['reasons'], b6
          assert b6['state_consistency_result']['observed_state']=='COMPLETE_CANONICAL', b6
          assert b7['eligible'] is True and b7['reasons']==[], b7
          assert b7['prerequisite_results'][0]['task_id']=='B006'
          assert b7['prerequisite_results'][0]['satisfied'] is True
          print('B006_TERMINAL=PASS')
          print('B007_SUCCESSOR_ELIGIBLE=PASS')
          PY
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
      - name: Final immutability guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo B006_CLOSEOUT_REPAIRED_EXACT_HEAD_QUALIFICATION=PASS
