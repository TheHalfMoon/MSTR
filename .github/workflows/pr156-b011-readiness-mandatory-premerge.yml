name: Mandatory premerge PR156 B011 readiness

on:
  push:
    branches:
      - evidence/pr156-b011-readiness-mandatory-premerge

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: read

env:
  BASE_SHA: 7884af6b159534671ad4259addfcb319d7084d36
  TARGET_SHA: f5b421cc81cb3add30be3c459cc3519d921ab39e
  PR_NUMBER: '156'
  QUALIFICATION_RUN: '33863065554'
  REVIEW_RUN: '33863708117'
  CHECKLIST: specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md

jobs:
  mandatory_premerge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify evidence dependencies and immutable PR identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse ${TARGET_SHA}^)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" > /tmp/qual.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN}" > /tmp/review.json
          jq -e '.status == "completed" and .conclusion == "success" and .head_branch == "evidence/pr156-b011-readiness-qualification"' /tmp/qual.json >/dev/null
          jq -e '.status == "completed" and .conclusion == "success" and .head_branch == "evidence/pr156-b011-readiness-independent-review"' /tmp/review.json >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$TARGET_SHA" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and .commits == 1 and .changed_files == 1 and .mergeable == true' /tmp/pr.json >/dev/null
          test "$(git diff --name-only "$BASE_SHA" "$TARGET_SHA")" = "$CHECKLIST"
          echo 'PR156_PREMERGE_IDENTITY=PASS'
      - name: Reconcile reviews threads protection rulesets statuses and checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" > /tmp/reviews.json
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner=TheHalfMoon -f name=MSTR -F number=${PR_NUMBER} > /tmp/threads.json
          test "$(jq 'length' /tmp/reviews.json)" -eq 0
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' /tmp/threads.json)" -eq 0
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" > /tmp/main-branch.json
          jq -e '.protected == false' /tmp/main-branch.json >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/rulesets" > /tmp/rulesets.json
          test "$(jq 'length' /tmp/rulesets.json)" -eq 0
          gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status" > /tmp/status.json
          jq -e '[.statuses[] | select(.context == "CodeRabbit" and .state == "success")] | length == 1' /tmp/status.json >/dev/null
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs" > /tmp/checks.json
          jq -e '[.check_runs[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | length == 0' /tmp/checks.json >/dev/null
          echo 'PR156_PREMERGE_RECONCILIATION=PASS'
      - name: Re-prove checklist semantics and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          checklist = Path('specs/002-code-model-supremacy-foundation/checklists/implementation-readiness.md').read_text(encoding='utf-8')
          section = checklist.split('## Before B011\n', 1)[1].split('\n## Before Any Weight-Changing Training', 1)[0]
          assert section.count('- [x]') == 4 and '- [ ]' not in section
          training = checklist.split('## Before Any Weight-Changing Training\n', 1)[1].split('\n## Blocking Conditions', 1)[0]
          assert training.count('- [ ]') == 12

          manifest_path = Path('artifacts/manifests/B010-new-candidate-weight-access.json')
          authority_path = Path('artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert manifest_sha == '4c2fd1469cdcf728063ab8f5b6a603191ffdc9e1a4d4c2d794abd2a24950c3ef'
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['b010_manifest']['sha256'] == manifest_sha
          assert authority['scope']['decision'] == 'FOUNDER_B011_MODEL_WEIGHT_ACCESS_DECISION=AUTHORIZE_EXACT_B010_ENVELOPE'
          assert manifest['decision']['new_weight_access_required_candidates'] == ['mellum-4b','qwen3.5-0.8b-control']
          assert sum(c['expected_required_download_bytes'] for c in manifest['candidate_access_envelopes']) == 9817996174
          for key in ['paid_compute','paid_model_api','gated_terms_acceptance','quantization_execution','weight_changing_training','large_dataset_ingestion','production_release','git_model_binaries']:
              assert authority['scope'][key] is False
          assert authority['scope']['founder_machine_large_artifacts'] == 0
          print('PR156_PREMERGE_SEMANTICS=PASS')
          PY
      - name: Install exact candidate tooling
        run: python -m pip install -e '.[dev]'
      - name: Re-prove exact-main B011 eligibility and downstream closure
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$BASE_SHA"
          git update-ref refs/remotes/origin/main "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          mstr-qualify task eligible B011 > /tmp/b011.json
          jq -e '.task_id == "B011" and .eligible == true and .authority_result.required == true and .authority_result.satisfied == true and .authority_result.authority_id == "B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED" and .state_consistency_result.observed_state == "PENDING" and (.reasons | length == 0)' /tmp/b011.json >/dev/null
          if mstr-qualify task eligible B012 > /tmp/b012.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B011")) != null' /tmp/b012.json >/dev/null
          if mstr-qualify task eligible B013 > /tmp/b013.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B012")) != null' /tmp/b013.json >/dev/null
          git checkout --detach "$TARGET_SHA"
          echo 'PR156_PREMERGE_TASK_GATE=PASS'
      - name: Fresh full quality verification
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          echo 'PR156_PREMERGE_QUALITY=PASS'
      - name: Final live guarded-merge readiness recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr-final.json
          jq -e --arg base "$BASE_SHA" --arg head "$TARGET_SHA" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and .mergeable == true and .changed_files == 1' /tmp/pr-final.json >/dev/null
          test "$(git diff --name-only "$BASE_SHA" "$TARGET_SHA")" = "$CHECKLIST"
          echo 'PR156_MANDATORY_PREMERGE=PASS'
