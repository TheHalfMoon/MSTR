name: Qualify B006 exact head 98b549e

on:
  push:
    branches: [evidence/b006-qualify-98b549e]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: ebd31e7657cb42479b28a4cb1cc8a5ce2ae56b6a
      EXPECTED_HEAD: 98b549e9d8b2550725861e133ee8f909690dc9c8
      TARGET_BRANCH: research/000b-b006-candidate-reconciliation
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 98b549e9d8b2550725861e133ee8f909690dc9c8
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard exact identities and install
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          python -m pip install -e '.[dev]'
      - name: Verify bounded diff schemas rights and B005 coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from mstr_qualify.rights import evaluate_component_rights
          expected={
            'artifacts/candidates/bitnet-b1.58-2b4t-control.json','artifacts/candidates/codegemma-2b-reference.json',
            'artifacts/candidates/falcon-h1-3b-legal-review.json','artifacts/candidates/lfm2.5-1.2b-reference.json',
            'artifacts/candidates/lfm2.5-2.6b-reference.json','artifacts/candidates/mellum-4b.json',
            'artifacts/candidates/ministral-3-3b.json','artifacts/candidates/qwen3.5-0.8b.json',
            'artifacts/candidates/qwen3.5-2b.json','artifacts/candidates/qwen3.5-4b.json',
            'artifacts/candidates/stable-code-3b-reference.json','artifacts/candidates/starcoder2-3b-reference.json',
            'artifacts/candidates/yi-coder-1.5b.json','evidence/mstr-000b/candidates/B006-candidate-reconciliation.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['EXPECTED_MAIN']}..HEAD"],text=True).splitlines())
          assert changed==expected,f'diff mismatch: {sorted(changed ^ expected)}'
          validator=Draft202012Validator(json.loads(Path('schemas/candidate-record.schema.json').read_text()))
          records=sorted(p for p in expected if p.endswith('.json'))
          pass_ids={'mellum-4b','qwen3.5-0.8b-control','qwen3.5-2b','qwen3.5-4b','yi-coder-1.5b','ministral-3-3b'}
          fail_ids={'starcoder2-3b-reference','stable-code-3b-reference','codegemma-2b-reference','falcon-h1-3b-legal-review','bitnet-b1.58-2b4t-control','lfm2.5-2.6b-reference','lfm2.5-1.2b-reference'}
          seen=set(); by_upstream={}
          for p in records:
            d=json.loads(Path(p).read_text()); errs=list(validator.iter_errors(d))
            assert not errs,f'{p} schema: {[e.message for e in errs]}'
            cid=d['candidate_id']; seen.add(cid); by_upstream[d['upstream_id']]=d
            r=evaluate_component_rights(cid,d['rights'])
            if cid in pass_ids:
              assert r.eligible_for_primary and r.computed_decision=='pass_permissive',f'{cid} should pass: {r}'
              assert d['status']=='static_qualified',f'{cid} unexpected status {d["status"]}'
            elif cid in fail_ids:
              assert not r.eligible_for_primary and r.computed_decision=='fail',f'{cid} should fail: {r}'
              assert d['status'] in {'reference_only','discovered'},f'{cid} unexpected status {d["status"]}'
            else: raise AssertionError(f'unclassified record {cid}')
          assert seen==pass_ids|fail_ids,f'id set mismatch: {seen ^ (pass_ids|fail_ids)}'
          discovery=json.loads(Path('artifacts/manifests/B005-code-backbone-discovery.json').read_text())
          required_new={'JetBrains/Mellum-4b-base','bigcode/starcoder2-3b','stabilityai/stable-code-3b','google/codegemma-2b','tiiuae/Falcon-H1-3B-Base','microsoft/bitnet-b1.58-2B-4T-bf16','LiquidAI/LFM2.5-2.6B-Base','LiquidAI/LFM2.5-1.2B-Base','Qwen/Qwen3.5-0.8B-Base'}
          actual_new=set(discovery['newly_relevant_for_b006'])
          assert actual_new==required_new,f'B005 new mismatch: {actual_new ^ required_new}'
          assert required_new<=set(by_upstream),f'missing new upstream: {required_new-set(by_upstream)}'
          assert 'zai-org/GLM-5.3-Flash' not in by_upstream and 'moonshotai/Kimi-K2-Base' not in by_upstream,'screened frontier ref improperly qualified'
          required_reval={'Qwen/Qwen3.5-2B-Base','Qwen/Qwen3.5-4B-Base','01-ai/Yi-Coder-1.5B','mistralai/Ministral-3-3B-Base-2512'}
          actual_reval={r['repo_id'] for r in discovery['existing_records_requiring_material_revalidation']}
          assert actual_reval==required_reval,f'revalidation mismatch: {actual_reval ^ required_reval}'
          assert required_reval<=set(by_upstream),f'missing revalidation upstream: {required_reval-set(by_upstream)}'
          exact={'Qwen/Qwen3.5-2B-Base':2274069824,'Qwen/Qwen3.5-4B-Base':4659865088,'01-ai/Yi-Coder-1.5B':1476495360,'mistralai/Ministral-3-3B-Base-2512':4251743232}
          for uid,count in exact.items(): assert by_upstream[uid]['architecture']['parameter_count_total']==count,f'{uid} count mismatch'
          evidence=Path('evidence/mstr-000b/candidates/B006-candidate-reconciliation.md').read_text()
          for marker in ['MODEL_WEIGHT_ACCESS = NONE','TOKENIZER_ARTIFACT_DOWNLOAD = NONE','GATED_TERMS_ACCEPTANCE = NONE','MODEL_EXECUTION = NONE','WEIGHT_CHANGING_TRAINING = NONE','NEW_AUTHORITY_CREATED = NO']:
            assert marker in evidence,f'missing evidence marker {marker}'
          print('B006_BOUNDED_SCHEMA_RIGHTS=PASS')
          PY
          git diff --check "$EXPECTED_MAIN"..HEAD
      - name: Frozen repository gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/unit/test_rights.py tests/contract/test_schemas.py
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
      - name: Final immutability guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo B006_EXACT_HEAD_QUALIFICATION=PASS
          echo MODEL_WEIGHT_ACCESS=NONE
          echo TOKENIZER_ARTIFACT_DOWNLOAD=NONE
          echo GATED_TERMS_ACCEPTANCE=NONE
          echo MODEL_EXECUTION=NONE
          echo PAID_COMPUTE=NONE
          echo WEIGHT_CHANGING_TRAINING=NONE
