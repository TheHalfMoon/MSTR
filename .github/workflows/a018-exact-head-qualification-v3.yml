name: A018 exact-head qualification v3

on:
  push:
    branches:
      - evidence/a018-qualification3-fc04967

permissions:
  contents: read

env:
  TARGET_SHA: fc04967b2cbe874489f3b09a38fb80c1650f2461
  TARGET_TREE: 047b1b36bd83ce6fbfd52de97e3e38fa52db7d32
  BASE_SHA: f222df1b939fc5db792021d6883d977014502dba

jobs:
  identity_scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact candidate identity and immutable main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$BASE_SHA" "$TARGET_SHA")" = "$BASE_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$BASE_SHA"
      - name: Verify exact five-file scope
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat >"$expected" <<'EOF'
          evidence/mstr-000a/A018-trajectory-factory.md
          src/mstr_qualify/trajectory/__init__.py
          src/mstr_qualify/trajectory/admission.py
          src/mstr_qualify/trajectory/recorder.py
          tests/unit/trajectory/test_trajectory_factory.py
          EOF
          git diff --name-only "$BASE_SHA...$TARGET_SHA" | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          git diff --check "$BASE_SHA...$TARGET_SHA"
      - name: Verify governance state remains implementation candidate
        shell: bash
        run: |
          set -euo pipefail
          grep -F '**State:** `IMPLEMENTATION_CANDIDATE`' evidence/mstr-000a/A018-trajectory-factory.md
          grep -F -- '- [x] **A017 Freeze failure taxonomy and training trajectory contract.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A018 Implement trajectory recorder/replay/admission.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A019 Run cross-harness baseline/tournament' specs/001-agent-harness-verified-loop-foundation/tasks.md

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused A018 tests
        run: python -m pytest tests/unit/trajectory/test_trajectory_factory.py -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src

  complete:
    runs-on: ubuntu-latest
    needs:
      - identity_scope
      - quality
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Recheck immutable exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$BASE_SHA"
