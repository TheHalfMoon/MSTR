name: Qualify B027 exact head b5e1525

on:
  push:
    branches:
      - evidence/b027-qualify-b5e1525

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  EXPECTED_MAIN: 312d40eee8400a0dab94633f891b206f66a82855
  EXPECTED_HEAD: b5e152552f3b840fd74f2fe9b092eca17b56a91d
  EXPECTED_TREE: 20e60c673a203e3fc7f09da817ffc6ad64ac5f76
  EXPECTED_COMMITS: '32'
  EXPECTED_FILES: '60'
  PR_NUMBER: '141'
  REGEN_RUN: '33757330474'
  GH_TOKEN: ${{ github.token }}

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify immutable identity and bounded B027 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          test "$(git rev-list --count "$EXPECTED_MAIN..$EXPECTED_HEAD")" = "$EXPECTED_COMMITS"
          git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_HEAD" > /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt | tr -d ' ')" = "$EXPECTED_FILES"
          while IFS= read -r path; do
            case "$path" in
              scripts/research/b027_ladder_pilot.py|artifacts/results/research/B027/*|evidence/mstr-000b/B027-ladder-pilot.md|tests/contract/test_b027_ladder_pilot.py) ;;
              *) echo "OUT_OF_SCOPE=$path" >&2; exit 1 ;;
            esac
          done < /tmp/changed.txt
          test ! -e artifacts/authorities/B027.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/000b-b027-ladder-pilot | cut -f1)" = "$EXPECTED_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$EXPECTED_MAIN" --arg head "$EXPECTED_HEAD" --argjson commits "$EXPECTED_COMMITS" --argjson files "$EXPECTED_FILES" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and .commits == $commits and .changed_files == $files' /tmp/pr.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REGEN_RUN}" > /tmp/regen.json
          jq -e '.status == "completed" and .conclusion == "success" and (.name | contains("Regenerate B027"))' /tmp/regen.json

  semantic_campaign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Verify campaign identities and prospective semantics
        shell: bash
        run: |
          set -euo pipefail
          origin_before="$(git rev-parse refs/remotes/origin/main)"
          local_before="$(git rev-parse --verify refs/heads/main 2>/dev/null || true)"
          test "$origin_before" = "$EXPECTED_MAIN"
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          expected_head = os.environ['EXPECTED_HEAD']
          result_root = root / 'artifacts' / 'results' / 'research' / 'B027'
          script = root / 'scripts' / 'research' / 'b027_ladder_pilot.py'
          evaluator = 'sha256:' + hashlib.sha256(script.read_bytes()).hexdigest()
          spec = importlib.util.spec_from_file_location('b027_exact_head_qualification', script)
          assert spec is not None and spec.loader is not None
          pilot = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(pilot)

          manifest = json.loads((result_root / 'campaign-manifest.json').read_text(encoding='utf-8'))
          ledger = json.loads((result_root / 'campaign-ledger.json').read_text(encoding='utf-8'))
          assert manifest['harness_sha256'] == evaluator.removeprefix('sha256:')
          assert manifest['frozen_evaluation_identity'] == evaluator
          assert ledger['frozen_evaluation_identity'] == evaluator
          assert ledger['canonical_entry_main'] == os.environ['EXPECTED_MAIN']
          assert ledger['canonical_history_status'] == 'PENDING_POST_MERGE_VALIDATION'
          assert ledger['candidate_validation_kind'] == 'PROSPECTIVE_NO_CANONICAL_REF_REWRITE'
          assert ledger['campaign_result'] == 'QUALIFIED_PROMOTION_AND_EARLY_DISCARD'
          assert [row['level'] for row in ledger['sequence']] == ['L0_CONTRACT_SMOKE', 'L1_CODE_PROXY']
          assert [row['decision'] for row in ledger['sequence']] == ['PROMOTE', 'STOP']
          assert ledger['sequence'][1]['early_discard_gate'] == 'code_proxy_thresholds'
          assert ledger['levels_not_executed'] == ['L2_EXECUTABLE_REPO', 'L3_DIRECTION_TO_DONE', 'L4_Q4_UNIVERSAL_LAPTOP']
          assert not any(ledger['governed_effects'].values())
          assert ledger['paid_cost_usd'] == 0
          assert ledger['model_execution_count'] == 0
          assert ledger['network_model_or_teacher_call_count'] == 0

          records = []
          for row in ledger['sequence']:
              path = result_root / 'registry' / f"{row['experiment_id']}.json"
              raw = path.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == row['record_sha256']
              record = json.loads(raw)
              pilot._validate_record_candidate(record, expected_head)
              assert record['frozen_evaluation_identity'] == evaluator
              assert not any(record['governed_effects'].values())
              assert record['external_effect_authority'] is None
              records.append(record)

          l0, l1 = records
          assert l1['parent_identity'] == l0['promoted_result_id_or_na']
          assert l1['predecessor_promotion']['experiment_id'] == l0['experiment_id']
          assert l1['predecessor_promotion']['experiment_record_sha256'] == ledger['sequence'][0]['record_sha256']
          pilot._validate_records_synthetic_merge((l0, l1), expected_head)
          PY
          test "$(git rev-parse refs/remotes/origin/main)" = "$origin_before"
          test "$(git rev-parse --verify refs/heads/main 2>/dev/null || true)" = "$local_before"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/000b-b027-ladder-pilot | cut -f1)" = "$EXPECTED_HEAD"

  canonical_entry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Re-prove canonical B027 eligibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B027 > /tmp/b027.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0 and ([.prerequisite_results[] | select(.task_id == "B026" and .observed_state == "COMPLETE_CANONICAL" and .satisfied == true)] | length == 1)' /tmp/b027.json
          set +e
          mstr-qualify task eligible B011 > /tmp/b011.json
          rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/000b-b027-ladder-pilot | cut -f1)" = "$EXPECTED_HEAD"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Run exact-head quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/contract/test_b027_ladder_pilot.py tests/contract/test_research_ladder_contract.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/000b-b027-ladder-pilot | cut -f1)" = "$EXPECTED_HEAD"

  complete:
    needs: [identity_scope, semantic_campaign, canonical_entry, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Final immutable exact-head recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/feat/000b-b027-ladder-pilot | cut -f1)" = "$EXPECTED_HEAD"
          echo "B027_QUALIFIED_HEAD=$EXPECTED_HEAD"
          echo "B027_QUALIFIED_TREE=$EXPECTED_TREE"
          echo 'PREMERGE_CANONICAL_HISTORY=SIMULATED_ONLY'
          echo 'POSTMERGE_CANONICAL_VALIDATION=MANDATORY'
          echo 'MODEL_EXECUTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
