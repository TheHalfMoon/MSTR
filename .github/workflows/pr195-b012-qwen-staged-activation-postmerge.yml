name: PR195 B012 Qwen staged activation postmerge

on:
  push:
    branches:
      - evidence/pr195-b012-qwen-staged-activation-postmerge-98feee7

permissions:
  contents: read
  pull-requests: read

jobs:
  postmerge:
    runs-on: ubuntu-24.04
    env:
      REPO: TheHalfMoon/MSTR
      MAIN: 98feee7765cbf64428f149f885519cef76800caf
      TREE: 090bab8caec5438448ccb3a0a844478d0356d6b3
      OLD_MAIN: 0cff2d57ab78c0189c8557f3e2ec59300bd8082d
      SUBJECT: d362f6e2db9397c4969b384c3f364c46d8b45dcb
      PR: '195'
      QUAL_RUN: '34228831583'
      QUAL_HEAD: 28f1d8c5198b8fa54e56d96d27797f5e9ec3b2b9
      REVIEW_RUN: '34230182059'
      REVIEW_HEAD: eca9751d6fc4d32f2baac3f026574717774b84b3
      PREMERGE_RUN: '34230685802'
      PREMERGE_HEAD: 6ecdf73c5bc41fe1137d8d6ecc516f58749ffce9
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MAIN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.16
          check-latest: false

      - name: Prove exact canonical merge identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$MAIN"
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$OLD_MAIN $SUBJECT"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg merge "$MAIN" --arg base "$OLD_MAIN" --arg head "$SUBJECT" '.state=="closed" and .merged==true and .merge_commit_sha==$merge and .base.sha==$base and .head.sha==$head and .changed_files==9' /tmp/pr.json >/dev/null

      - name: Prove complete evidence chain
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/review.json
          gh api "repos/$REPO/actions/runs/$PREMERGE_RUN" > /tmp/premerge.json
          jq -e --arg head "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' /tmp/qual.json >/dev/null
          jq -e --arg head "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' /tmp/review.json >/dev/null
          jq -e --arg head "$PREMERGE_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' /tmp/premerge.json >/dev/null

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Prove exact-main B012 remains eligible and authority satisfied
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git symbolic-ref --short HEAD)" = main
          test "$(git rev-parse HEAD)" = "$MAIN"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['MAIN']
          assert d['eligible'] is True
          assert d['authority_result']['required'] is True
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['superseded'] is False
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert a['task_id']=='B012'
          PY

      - name: Prove canonical staged workflow and non-authorizing boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          mp=Path('artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json')
          active=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          m=json.loads(mp.read_text(encoding='utf-8'))
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text(encoding='utf-8'))
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['candidate_id']=='qwen3.5-0.8b-control'
          assert m['activation']['active_workflow_materialized'] is True
          assert m['activation']['activation_repository_change_only'] is True
          assert active.read_bytes()==Path(m['staged_workflow_spec_path']).read_bytes()
          assert sha(active)==m['staged_workflow_sha256']=='e5a666641af6557efb2aba7091a51db3deef973f6177ab682207a4326d3f4bbe'
          assert sha(m['staged_script_path'])==m['staged_script_sha256']=='f856a353144ad0cc5e63827b46b7e1f41de61116944bef4b86c6e5cd09dd0c32'
          assert m['expected_q4_k_m_sha256']=='177a8435373b58e09910ee68e6643f656b5d93b6d64e03ee4c37be4a86c995fa'
          assert m['expected_q4_k_m_size_bytes']==541903296
          assert m['prior_qualification_run_id']==34155931982
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          ab=m['authority_boundary']
          assert ab['existing_authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          for key in ('authority_scope_modified','authority_transfer','candidate_expansion','candidate_revision_or_file_expansion','external_dispatch_authority_created','paid_compute','paid_model_api','production_release','retry_authority_created','training','weight_changing_training'):
              assert ab[key] is False, key
          assert m['activation']['activation_model_access']=='NONE'
          assert m['activation']['activation_model_execution']=='NONE'
          assert m['activation']['activation_paid_cost_usd']==0.0
          text=active.read_text(encoding='utf-8')
          assert "github.event.issue.number == 162" in text
          assert "github.event.comment.user.login == 'TheHalfMoon'" in text
          assert "github.event.comment.author_association == 'OWNER'" in text
          assert "github.event.comment.body == 'B012_RECOVER_RAW_CODE_STAGED qwen3.5-0.8b-control 34155931982'" in text
          assert text.count('actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02')==5
          assert '.gguf' not in text and '.safetensors' not in text
          PY

      - name: Exact-main quality verification
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final exact-main guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg merge "$MAIN" '.state=="closed" and .merged==true and .merge_commit_sha==$merge' /tmp/pr-final.json >/dev/null
          echo 'PR195_POSTMERGE=PASS'
