name: Qualify T030 runtime adapter exact head ea89a90

on:
  push:
    branches:
      - evidence/t030-runtime-ea89a90

permissions:
  contents: read

env:
  EXPECTED_MAIN: 97904ac5ad17e7142e88944ee83dbb304ecb197f
  TARGET_HEAD: ea89a90552b9929ddf18cceea126db6ea0b3ae24
  TARGET_BRANCH: feat/000-t030-portable-cpu-runtime-adapters

jobs:
  identity_scope:
    runs-on: ubuntu-latest
    steps:
      - name: Check immutable refs
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          TARGET_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$TARGET_SHA" = "$TARGET_HEAD"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Check exact T030 scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$EXPECTED_MAIN" "$TARGET_HEAD" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          artifacts/decisions/T030-runtime-interface-scan.json
          configs/runtimes/llama-cpp-cpu.json
          evidence/T030-runtime-adapters.md
          src/mstr_qualify/runtimes/__init__.py
          src/mstr_qualify/runtimes/benchmark_cli.py
          tests/integration/test_runtime_adapters.py
          tests/security/test_runtime_benchmark_boundary.py
          tests/unit/test_runtime_benchmark_cli.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
      - name: Check frozen CPU and no-network profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          profile = json.loads(Path("configs/runtimes/llama-cpp-cpu.json").read_text())
          output = profile["arguments"]["output"]
          assert output == ["--device", "none", "-o", "json"]
          serialized = json.dumps(profile, sort_keys=True)
          for forbidden in ("--hf-repo", "--hf-file", "--hf-token", "--rpc", "-rpc"):
              assert forbidden not in serialized
          PY

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Focused T023 and T030 tests
        run: >-
          python -m pytest -q
          tests/unit/test_runtime_protocol.py
          tests/unit/test_runtime_benchmark_cli.py
          tests/security/test_runtime_benchmark_boundary.py
          tests/integration/test_runtime_adapters.py
      - name: Offline schema validation
        run: mstr-qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Recheck immutable refs after quality gates
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          TARGET_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$TARGET_SHA" = "$TARGET_HEAD"

  complete:
    needs: [identity_scope, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Final exact-head recheck
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          TARGET_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$TARGET_SHA" = "$TARGET_HEAD"
