name: PR176 T031 replay independent substantive review 08697e7

on:
  push:
    branches:
      - evidence/pr176-t031-replay-independent-review-08697e7

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  BASE_SHA: 90fb88734006de8296825034345ba89ed6614794
  TARGET_HEAD: 08697e7f8bb95aabc8f25677074ebeee18771169
  TARGET_TREE: 27ab4f780234a969435daa873007bcb934933d1a
  TARGET_BRANCH: fix/t031-historical-59wheel-binding-truth
  QUALIFICATION_RUN: "34057263503"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  independent_substantive_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify immutable review subject and qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$BASE_SHA" "$TARGET_HEAD")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$TARGET_HEAD"
          test "$(git diff --name-only "$BASE_SHA".."$TARGET_HEAD" | wc -l)" = 9
          git diff --check "$BASE_SHA".."$TARGET_HEAD"
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          root = 'https://api.github.com/repos/TheHalfMoon/MSTR'
          def get(path):
              request = urllib.request.Request(root + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = get(f'/actions/runs/{os.environ["QUALIFICATION_RUN"]}')
          assert run['conclusion'] == 'success'
          jobs = get(f'/actions/runs/{os.environ["QUALIFICATION_RUN"]}/jobs?per_page=100')['jobs']
          conclusions = {job['name']: job['conclusion'] for job in jobs}
          assert conclusions['exact_identity'] == 'success'
          assert conclusions['authority_and_binding'] == 'success'
          assert conclusions['canonical_quality'] == 'success'
          assert conclusions['final_qualification'] == 'success'
          pr = get('/pulls/176')
          assert pr['state'] == 'open'
          assert pr['head']['sha'] == os.environ['TARGET_HEAD']
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['changed_files'] == 9
          print('REVIEW_SUBJECT_IDENTITY=PASS')
          print(f'QUALIFICATION_RUN_{os.environ["QUALIFICATION_RUN"]}=PASS')
          PY
      - name: Independent correctness security and governance assertions
        shell: bash
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          from mstr_t031_historical_replay import _load_historical_packages

          root = Path('.')
          authority = json.loads((root / 'artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json').read_text())
          binding = json.loads((root / 'artifacts/manifests/T031-executor-toolchain-binding.json').read_text())
          overlay_path = root / binding['producer_replay_overlay_path']
          overlay = json.loads(overlay_path.read_text())
          executor = (root / 'colab/mstr_t031_execute.py').read_text(encoding='utf-8')
          governance = (root / 'colab/mstr_t031_governance.py').read_text(encoding='utf-8')
          historical = (root / 'colab/mstr_t031_historical_replay.py').read_text(encoding='utf-8')

          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          expected_candidates = [
              'granite-4.1-3b', 'ministral-3-3b', 'qwen2.5-coder-1.5b', 'qwen3-4b',
              'qwen3.5-2b', 'qwen3.5-4b', 'smollm3-3b', 'yi-coder-1.5b',
          ]
          assert authority['scope']['candidate_ids'] == expected_candidates
          assert binding['candidate_ids'] == expected_candidates
          for key in (
              'b010_b012_candidates', 'candidate_revision_or_file_expansion', 'new_candidates',
              'paid_compute', 'paid_model_api', 'production_release', 't032_execution',
              't033_execution', 't034_admission_decision', 'training', 'weight_changing_training',
          ):
              assert authority['scope'][key] is False, key
          assert authority['scope']['git_model_binaries'] is False
          assert authority['scope']['founder_machine_large_artifacts'] == 0

          assert binding['producer_replay']['package_count'] == 59
          assert binding['producer_replay']['historical_transitive_identity_claim'] is False
          assert binding['producer_replay']['acceptance_gate'] == 'EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH'
          assert overlay['historical_t029_observation']['package_versions_recorded_by_t029'] is False
          assert overlay['reconstruction_basis']['historical_transitive_identity_claim'] is False
          assert overlay['reconstruction_basis']['equivalence_gate'] == 'EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH'
          assert overlay['historical_smoke_evidence']['closure_installable'] is True
          assert overlay['historical_smoke_evidence']['stage_semantics_proven'] is False
          assert overlay['historical_smoke_evidence']['model_access'] == 'NONE'
          assert overlay['historical_smoke_evidence']['training'] is False
          assert overlay['historical_smoke_evidence']['paid_cost_usd'] == 0.0

          packages, shards = _load_historical_packages(overlay=overlay, overlay_path=overlay_path)
          assert len(packages) == 59
          assert len(shards) == 3
          allowed_hosts = {'files.pythonhosted.org', 'download.pytorch.org', 'download-r2.pytorch.org'}
          for package in packages:
              assert urlparse(str(package['url'])).scheme == 'https'
              assert urlparse(str(package['url'])).hostname in allowed_hosts
              assert isinstance(package['sha256'], str) and len(str(package['sha256'])) == 64
          assert 'uploaded > cutoff' in historical
          assert 'require_file_sha256(shard_path, digest)' in historical
          assert 'install_historical_replay_toolchain' in executor
          assert 'install_replay_toolchain(' not in executor
          assert 'historical_transitive_identity_claim' in governance
          assert 'EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH' in governance

          pairs = {
              'historical_replay_helper_sha256': 'colab/mstr_t031_historical_replay.py',
              'governance_script_sha256': 'colab/mstr_t031_governance.py',
              'executor_script_sha256': 'colab/mstr_t031_execute.py',
              'producer_replay_overlay_sha256': binding['producer_replay_overlay_path'],
          }
          for key, path in pairs.items():
              assert binding[key] == hashlib.sha256((root / path).read_bytes()).hexdigest()

          boundary = binding['execution_boundary']
          for key in ('authority_transfer', 'b012_execution', 't032_execution', 't033_execution', 't034_admission_decision', 'training'):
              assert boundary[key] is False, key
          assert boundary['paid_cost_usd'] == 0.0
          assert boundary['git_model_binaries'] == 0
          assert boundary['founder_machine_model_binaries'] == 0

          print('PR176_SUBSTANTIVE_CORRECTNESS_REVIEW=PASS')
          print('PR176_SECURITY_BOUNDARY_REVIEW=PASS')
          print('PR176_GOVERNANCE_BOUNDARY_REVIEW=PASS')
          print('HISTORICAL_TRANSITIVE_IDENTITY_CLAIM=false')
          print('T029_EXACT_ARTIFACT_EQUIVALENCE_GATE=RETAINED')
          print('AUTHORITY_EXPANSION=false')
          print('FINDINGS=NONE')
          print('MODEL_ACCESS=NONE')
          print('TRAINING=false')
          print('PAID_COST_USD=0.0')
          PY
      - name: Independent full regression
        shell: bash
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          test -z "$(git status --porcelain)"
      - name: Final immutable review-subject guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$TARGET_HEAD"
          echo 'PR176_INDEPENDENT_SUBSTANTIVE_REVIEW=PASS'
