name: t031-authority-repair-builder

on:
  push:
    branches:
      - builder/t031-authority-repair-20260905

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_MAIN: e5e47644fb7122cbb47b43cdf13d072f82ebfdf7
      TARGET_BRANCH: governance/t031-founder-authority-exact-t029-candidates
      SOURCE_BUILDER: d9e80f14a061731af4178085dd1bce596b880bd6
      AUTHORITY_COMMENT_ID: "5553875809"
    steps:
      - name: Checkout repair harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository quality dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify exact canonical entry and target absence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target branch already exists" >&2
            exit 1
          fi

      - name: Recover reviewed materialization script and rebuild from exact main
        shell: bash
        run: |
          set -euo pipefail
          git show "$SOURCE_BUILDER:.github/workflows/t031-authority-builder.yml" > /tmp/source-builder.yml
          python - <<'PY'
          from pathlib import Path

          lines = Path("/tmp/source-builder.yml").read_text(encoding="utf-8").splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == "PY")
          block = []
          for line in lines[start:end]:
              if line.startswith("          "):
                  block.append(line[10:])
              else:
                  block.append(line)
          Path("/tmp/materialize_t031.py").write_text("\n".join(block) + "\n", encoding="utf-8")
          PY
          git checkout --detach "$EXPECTED_MAIN"
          test -z "$(git status --porcelain)"
          python /tmp/materialize_t031.py
          python -m ruff format tests/contract/test_t031_authority.py

      - name: Verify exact candidate scope
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json
          artifacts/manifests/T031-local-measurement-execution-envelope.json
          tests/contract/test_t031_authority.py
          EOF
          )
          actual="$(git status --short | awk '{print $2}' | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check

      - name: Run focused T031 authority regression
        run: python -m pytest -q tests/contract/test_t031_authority.py

      - name: Run offline validation and full repository quality
        run: |
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify

      - name: Publish one-commit target candidate from exact main
        shell: bash
        run: |
          set -euo pipefail
          git add \
            artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json \
            artifacts/manifests/T031-local-measurement-execution-envelope.json \
            tests/contract/test_t031_authority.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name "TheHalfMoon"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "governance(t031): capture exact T029 measurement authority"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
