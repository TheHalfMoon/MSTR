name: Enforce B016 premerge gate

on:
  push:

permissions:
  contents: read

jobs:
  premerge:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 2cd82ba78bcb886962a163013fa2861d5dd2b013
      EXPECTED_HEAD: 33eb53b7ae4c2fd43d639af9c6e67512fb883423
      TARGET_BRANCH: feat/000b-b016-software-evolution-contract
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2cd82ba78bcb886962a163013fa2861d5dd2b013
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebind exact live main and target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B016_PREMERGE_IDENTITY=PASS'
      - name: Re-run exact-main eligibility and drift
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git branch -f main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B016 > /tmp/b016.json
          if python -m mstr_qualify task eligible B015 > /tmp/b015.json; then exit 1; fi
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json, os
          expected = os.environ['EXPECTED_MAIN']
          b16=json.load(open('/tmp/b016.json')); b15=json.load(open('/tmp/b015.json')); b11=json.load(open('/tmp/b011.json')); drift=json.load(open('/tmp/drift.json'))
          assert b16['canonical_main']==expected and b16['eligible'] is True and b16['reasons']==[]
          assert b16['state_consistency_result']['observed_state']=='PENDING'
          assert b16['authority_result']['required'] is False
          assert b15['eligible'] is False and b15['state_consistency_result']['observed_state']=='COMPLETE_CANONICAL'
          assert 'task.already_terminal' in b15['reasons']
          assert b11['eligible'] is False and b11['state_consistency_result']['observed_state']=='BLOCKED'
          assert b11['authority_result']['required'] is True and b11['authority_result']['satisfied'] is False
          assert drift['status']=='clean' and drift['findings']==[]
          print('B016_EXACT_MAIN_PREMERGE_ELIGIBILITY=PASS')
          PY
      - name: Reconfirm exact candidate and smoke gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cmp schemas/mstr-software-evolution-record-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-software-evolution-record-v0.schema.json
          pytest -q tests/contract/test_schemas.py tests/contract/test_software_evolution_contract.py tests/integration/test_cli_offline.py
          python -m mstr_qualify validate
          ruff check src tests
          mypy src
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          echo 'B016_PREMERGE_CANDIDATE_GATES=PASS'
      - name: Final immutable remote recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          echo 'B016_PREMERGE=PASS'
          echo 'B011_REMAINS_BLOCKED=PASS'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'LARGE_DATASET_INGESTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
