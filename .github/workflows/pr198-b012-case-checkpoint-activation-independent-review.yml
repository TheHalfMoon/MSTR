name: PR198 B012 case-checkpoint activation independent review

on:
  push:
    branches:
      - evidence/pr198-b012-case-checkpoint-activation-independent-review-0cf22bf

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 4deca995306c197e5cefaf8202e64fe5469f873c
      HEAD: 0cf22bf5aab2dc73be1dea18d2008b77ca34425f
      TREE: d4b125338dad52f14e71d12c8e384856f2dc8b4e
      PR: '198'
      QUAL_RUN: '34262561948'
      QUAL_HEAD: 390dc2742c1f8e5397d8a16959603032ba089744
      SUBJECT_BRANCH: fix/b012-qwen-case-checkpoint-activation
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact reviewed subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove exact subject and successful qualification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$SUBJECT_BRANCH)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          jq -e --arg q "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$q and .run_attempt==1' /tmp/qual.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==10' /tmp/pr.json >/dev/null

      - name: Prove exact scope and immutable authority surfaces
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            '.github/workflows/b012-qwen-raw-code-recovery.yml'
            'artifacts/manifests/B012-executor-toolchain-binding.json'
            'artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json'
            'evidence/mstr-000b/B012-qwen-case-checkpoint-activation.md'
            'tests/contract/test_b012_executor_binding.py'
            'tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py'
            'tests/contract/test_b012_qwen_raw_code_recovery.py'
            'tests/contract/test_b012_qwen_staged_recovery_topology.py'
            'tests/contract/test_b012_runner_shutdown_evidence.py'
            'tests/contract/test_b012_stage_checkpoint_topology.py'
          )
          [[ ${#actual[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done
          for path in \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B010-new-candidate-weight-access.json \
            artifacts/manifests/B011-acquired-candidates.json \
            artifacts/manifests/B012-equivalent-qualification-execution-envelope.json \
            artifacts/manifests/B012-executor-toolchain-lock.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done
          git diff --check "$BASE...$HEAD"

      - name: Prove review state has no blocking submission or unresolved thread
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" > /tmp/reviews.json
          test "$(jq '[.[] | select(.state=="CHANGES_REQUESTED")] | length' /tmp/reviews.json)" -eq 0
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner=TheHalfMoon -f name=MSTR -F number=198 > /tmp/threads.json
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false)] | length' /tmp/threads.json)" -eq 0

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Independently review authority activation and storage semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          manifest_path=Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          binding_path=Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          authority_path=Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json')
          active=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          spec=Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          script=Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          b=json.loads(binding_path.read_text(encoding='utf-8'))
          a=json.loads(authority_path.read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert a['task_id']=='B012'
          assert a['cost_resource_ceiling']['limits'][0]['max']==0.0
          assert m['task_id']=='B012' and m['candidate_id']=='qwen3.5-0.8b-control'
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          act=m['activation']
          assert act['activation_base_main']=='4deca995306c197e5cefaf8202e64fe5469f873c'
          assert act['repair_package_merge_commit']==act['activation_base_main']
          assert act['repair_package_postmerge_run_id']==34261221062
          assert act['repair_package_postmerge_evidence_head']=='f5dac568a809fe9fed707c3c2d8a298c859d16bb'
          assert act['active_workflow_materialized'] is True
          assert act['activation_repository_change_only'] is True
          assert act['activation_model_access']=='NONE'
          assert act['activation_model_execution']=='NONE'
          assert act['activation_paid_cost_usd']==0.0
          assert active.read_bytes()==spec.read_bytes()
          assert m['case_checkpoint_script_sha256']==sha(script)
          assert m['case_checkpoint_workflow_sha256']==sha(spec)==sha(active)
          boundary=m['authority_boundary']
          assert boundary['existing_authority_id']==a['authority_id']
          for key in ('authority_scope_modified','authority_transfer','retry_authority_created','external_dispatch_authority_created','candidate_expansion','candidate_revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert boundary[key] is False, key
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          bound=b['qwen_raw_code_case_checkpoint_activation']
          assert bound['repair_id']==m['repair_id']
          assert bound['repair_manifest_sha256']==sha(manifest_path)
          assert bound['case_checkpoint_script_sha256']==sha(script)
          assert bound['active_workflow_sha256']==sha(active)
          for key in ('retry_authority_created','external_dispatch_authority_created','candidate_expansion','revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert bound[key] is False, key
          assert bound['model_access']=='NONE' and bound['model_execution']=='NONE' and bound['paid_cost_usd']==0.0
          d=m['durability_boundary']
          assert d['checkpoint_write_must_succeed_before_completed_state_commit'] is True
          assert d['each_completed_raw_code_case_upload_precedes_next_case'] is True
          assert d['actions_artifacts_are_transient_transport_not_canonical_evidence'] is True
          assert d['canonical_long_term_evidence_store']=='GIT_JSON_REPORTS_MANIFESTS_EVIDENCE'
          assert d['storage_policy_path']=='docs/canonical/STORAGE_ARCHITECTURE.md'
          assert d['all_checkpoint_artifacts_must_be_canonicalized_to_git_before_dispatch_closeout'] is True
          assert d['missing_or_expired_checkpoint_artifact_fails_closed'] is True
          t=m['topology']
          assert t['maximum_uncheckpointed_raw_code_cases']==1
          assert t['raw_code_case_order']==['python-clamp','python-dedupe','python-safe-divide']
          assert t['durable_checkpoint_format']=='JSON_ONLY'
          PY

      - name: Independently review owner dispatch and ordered checkpoint workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/b012-qwen-raw-code-recovery.yml').read_text(encoding='utf-8')
          assert "github.event.issue.number == 162" in text
          assert "github.event.comment.user.login == 'TheHalfMoon'" in text
          assert "github.event.comment.author_association == 'OWNER'" in text
          assert "github.event.comment.body == 'B012_RECOVER_RAW_CODE_CASE_CHECKPOINT qwen3.5-0.8b-control 34155931982'" in text
          assert text.count('actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02')==7
          assert text.count('retention-days: 7')==7
          assert 'actions/download-artifact@' not in text and 'actions/cache@' not in text
          assert '.gguf' not in text and '.safetensors' not in text
          stages=['--stage init','--stage source','--stage quantize','--stage raw-code-python-clamp','--stage raw-code-python-dedupe','--stage raw-code-python-safe-divide','--stage finalize']
          pos=[text.index(s) for s in stages]
          assert pos==sorted(pos)
          uploads=['Upload stage 01 JSON checkpoint','Upload stage 02 JSON checkpoint','Upload stage 03 JSON checkpoint','Upload raw-code python-clamp JSON checkpoint','Upload raw-code python-dedupe JSON checkpoint','Upload raw-code python-safe-divide JSON checkpoint']
          for upload,next_stage in zip(uploads,stages[1:]):
              assert text.index(upload)<text.index(next_stage)
          PY

      - name: Independently exercise checkpoint-before-state failure truthfulness
        shell: bash
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          cat > /tmp/test_case_checkpoint_review.py <<'PY'
          import json
          from pathlib import Path
          import pytest
          import mstr_b012_qwen_raw_code_recovery_case_checkpoint as c

          def read(path): return json.loads(path.read_text(encoding='utf-8'))

          def test_checkpoint_failure_cannot_commit_completed_state(tmp_path, monkeypatch):
              prior={'task_id':'B012','candidate_id':c.CANDIDATE_ID,'canonical_main_at_start':'a'*40,'completed_stages':['init','source','quantize'],'last_completed_stage':'quantize','model_access_state':'EXACT_Q4_REGENERATED_VERIFIED'}
              state_path=c._state_path(tmp_path)
              state_path.write_text(json.dumps(prior,indent=2)+'\n',encoding='utf-8')
              working=dict(prior); working['completed_stages']=list(prior['completed_stages'])
              real=c._write
              checkpoint=c._checkpoint_path(tmp_path,'raw-code-python-clamp')
              def guarded(path,payload):
                  if path==checkpoint: raise OSError('synthetic checkpoint failure')
                  real(path,payload)
              monkeypatch.setattr(c,'_write',guarded)
              with pytest.raises(OSError,match='synthetic checkpoint failure'):
                  c._complete_stage(output_dir=tmp_path,state=working,stage='raw-code-python-clamp',checkpoint_payload={'synthetic':True})
              persisted=read(state_path)
              assert persisted['completed_stages']==['init','source','quantize']
              assert persisted['last_completed_stage']=='quantize'

          def test_single_case_selection_is_exact_and_order_is_frozen():
              raw=json.loads(Path('benchmarks/manifests/B012-raw-code-proxy.json').read_text(encoding='utf-8'))
              assert list(c.CASE_IDS)==['python-clamp','python-dedupe','python-safe-divide']
              for case_id in c.CASE_IDS:
                  selected=c._single_case_manifest(raw,case_id)
                  assert len(selected['tasks'])==1
                  assert selected['tasks'][0]['id']==case_id
                  assert selected['execution']==raw['execution']
                  assert selected['verification']==raw['verification']
          PY
          python -m pytest -q /tmp/test_case_checkpoint_review.py

      - name: Independent focused and full quality confirmation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final immutable review guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual-final.json
          jq -e --arg q "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$q and .run_attempt==1' /tmp/qual-final.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==10' /tmp/pr-final.json >/dev/null
          echo 'PR198_INDEPENDENT_REVIEW=PASS'
