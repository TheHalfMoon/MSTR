name: B023 binding parser review repair builder

on:
  push:
    branches:
      - evidence/b023-binding-parser-review-repair-builder

permissions:
  contents: write

env:
  BASE_SHA: db12d1467bb81185a9affffb4d470626ceceddfa
  SOURCE_SHA: a48cdf77247ec19364f720b768c4a602ad94477b
  SOURCE_TREE: ae29894f93f67cd285ba0529da71b4cdf0f78a5a
  SOURCE_BRANCH: fix/b023-cross-workstream-bindings-hardened-v2-atomic-20260901
  TARGET_BRANCH: fix/b023-cross-workstream-bindings-final-atomic-20260901

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact live base and reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$SOURCE_BRANCH | cut -f1)" = "$SOURCE_SHA"
          git fetch origin "$SOURCE_BRANCH"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test -z "$(git ls-remote origin refs/heads/$TARGET_BRANCH)"
      - name: Construct parser-hardened four-file candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" "$BASE_SHA"
          git checkout "$SOURCE_SHA" -- \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md \
            src/mstr_qualify/task_gate.py \
            tests/contract/test_task_gate.py
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/mstr_qualify/task_gate.py')
          source = source_path.read_text(encoding='utf-8')
          source = source.replace(
              '    except OSError:\n        return None\n    pattern = re.compile(\n        rf"^- \\[(?P<mark>[ xX])\\] \\*\\*{re.escape(task_id)} .+?\\.\\*\\*",\n        re.MULTILINE,\n    )\n',
              '    except (OSError, UnicodeError):\n        return None\n    pattern = re.compile(\n        rf"^- \\[(?P<mark>[ xX])\\] \\*\\*{re.escape(task_id)}\\s+[^*\\r\\n]+?\\*\\*\\s*$",\n        re.MULTILINE,\n    )\n',
              1,
          )
          source = source.replace(
              '    except OSError:\n        return False, False\n    task_matches = list(\n',
              '    except (OSError, UnicodeError):\n        return False, False\n    task_matches = list(\n',
              1,
          )
          assert 'except (OSError, UnicodeError):\n        return None' in source
          assert 'except (OSError, UnicodeError):\n        return False, False' in source
          assert '.+?\\.\\*\\*' not in source[source.index('def _external_task_checked'):source.index('def _external_evidence_claims')]
          source_path.write_text(source, encoding='utf-8')

          tests_path = Path('tests/contract/test_task_gate.py')
          tests = tests_path.read_text(encoding='utf-8')
          tests += r'''


def test_external_prerequisite_checklist_title_does_not_require_trailing_period(
    tmp_path: Path,
) -> None:
    catalog_path = _write_external_binding_fixture(
        tmp_path,
        "**Task:** `MSTR-000A / A006`\n**State:** `COMPLETE_CANONICAL`\n",
    )
    external_tasks = (
        tmp_path / "specs" / "001-agent-harness-verified-loop-foundation" / "tasks.md"
    )
    external_tasks.write_text("- [x] **A006 Implement boundary**\n", encoding="utf-8")

    result = evaluate_task_snapshot(
        "B001",
        repository_root=tmp_path,
        catalog_path=catalog_path,
        canonical_main=_CANONICAL_MAIN,
    )

    assert result["eligible"] is True
    predecessor = result["prerequisite_results"][0]
    assert predecessor["satisfied"] is True
    assert predecessor["reasons"] == []


def test_external_prerequisite_non_utf8_checklist_fails_closed_without_exception(
    tmp_path: Path,
) -> None:
    catalog_path = _write_external_binding_fixture(
        tmp_path,
        "**Task:** `MSTR-000A / A006`\n**State:** `COMPLETE_CANONICAL`\n",
    )
    external_tasks = (
        tmp_path / "specs" / "001-agent-harness-verified-loop-foundation" / "tasks.md"
    )
    external_tasks.write_bytes(b"- [x] **A006 External task**\n\xff\xfe")

    result = evaluate_task_snapshot(
        "B001",
        repository_root=tmp_path,
        catalog_path=catalog_path,
        canonical_main=_CANONICAL_MAIN,
    )

    assert result["eligible"] is False
    predecessor = result["prerequisite_results"][0]
    assert "prerequisite.external_checkbox_unverifiable" in predecessor["reasons"]


def test_external_prerequisite_non_utf8_state_evidence_fails_closed_without_exception(
    tmp_path: Path,
) -> None:
    catalog_path = _write_external_binding_fixture(
        tmp_path,
        "**Task:** `MSTR-000A / A006`\n**State:** `COMPLETE_CANONICAL`\n",
    )
    evidence = tmp_path / "evidence" / "mstr-000a" / "A006-finalizer.md"
    evidence.write_bytes(b"**Task:** `MSTR-000A / A006`\n\xff\xfe")

    result = evaluate_task_snapshot(
        "B001",
        repository_root=tmp_path,
        catalog_path=catalog_path,
        canonical_main=_CANONICAL_MAIN,
    )

    assert result["eligible"] is False
    predecessor = result["prerequisite_results"][0]
    assert predecessor["evidence_present"] is False
    assert "prerequisite.external_identity_unproven" in predecessor["reasons"]
    assert "prerequisite.external_state_unproven" in predecessor["reasons"]
'''
          tests_path.write_text(tests, encoding='utf-8')

          evidence_path = Path(
              'evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md'
          )
          evidence = evidence_path.read_text(encoding='utf-8').rstrip()
          evidence += '''

## Final parser hardening from independent review

Independent review of the qualified candidate identified two additional fail-closed robustness defects. External checklist parsing no longer depends on an undocumented trailing period in task-title prose; it binds the exact task id and any non-empty bold task title instead. External checklist and state-evidence reads now treat invalid UTF-8 as unverifiable evidence rather than allowing `UnicodeDecodeError` to abort eligibility evaluation. Dedicated contract tests cover period-free checklist titles and malformed UTF-8 in both bound external artifact classes.
'''
          evidence_path.write_text(evidence, encoding='utf-8')
          PY
          git diff --check
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat >"$expected" <<'EOF'
          configs/task-gate/mstr-000b.json
          evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md
          src/mstr_qualify/task_gate.py
          tests/contract/test_task_gate.py
          EOF
          git diff --name-only "$BASE_SHA" | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md
      - name: Run complete frozen gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
      - name: Commit atomic candidate and prove prospective eligibility
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MSTR Evidence Builder'
          git config user.email 'mstr-evidence-builder@users.noreply.github.com'
          git add configs/task-gate/mstr-000b.json evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py
          git commit -m 'fix(task-gate): harden external artifact parsing'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          CANDIDATE_SHA="$candidate" python - <<'PY'
          import os
          from mstr_qualify.task_gate import evaluate_task_snapshot
          candidate = os.environ['CANDIDATE_SHA']
          result = evaluate_task_snapshot('B023', canonical_main=candidate)
          assert result['eligible'] is True, result
          prereqs = {row['task_id']: row for row in result['prerequisite_results']}
          for task_id in ('A006', 'A014', 'B002', 'B022'):
              assert prereqs[task_id]['satisfied'] is True, prereqs[task_id]
          print('B023_PROSPECTIVE_ELIGIBILITY=PASS')
          PY
          test "$(git diff --name-only "$BASE_SHA..HEAD" | wc -l)" -eq 4
          test -z "$(git diff --name-only "$BASE_SHA..HEAD" | grep '^\.github/workflows/' || true)"
          echo "CANDIDATE_SHA=$candidate"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Guarded push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$SOURCE_BRANCH | cut -f1)" = "$SOURCE_SHA"
          test -z "$(git ls-remote origin refs/heads/$TARGET_BRANCH)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$(git rev-parse HEAD)"
