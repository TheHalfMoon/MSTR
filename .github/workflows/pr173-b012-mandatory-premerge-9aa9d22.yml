name: PR173 B012 mandatory premerge 9aa9d22

on:
  push:
    branches:
      - evidence/pr173-b012-mandatory-premerge-9aa9d22

permissions:
  contents: read
  pull-requests: read

jobs:
  canonical_eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Revalidate B012 eligibility on exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          BASE=603a6865fdbf5a5434565e870d73054c5b574f2a
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012
          echo 'B012_PREMERGE_CANONICAL_ELIGIBILITY=PASS'

  exact_head_gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9aa9d221e8b0be9d8af5d1e9efb2b11b89c13b6b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify expected topology and exact review subject
        shell: bash
        run: |
          set -euo pipefail
          BASE=603a6865fdbf5a5434565e870d73054c5b574f2a
          HEAD=9aa9d221e8b0be9d8af5d1e9efb2b11b89c13b6b
          TREE=0d62b79860d7f6468238491de0a97846d3fd1de0
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/feat/b012-executor-toolchain-binding | awk '{print $1}')" = "$HEAD"
          git diff --check "$BASE".."$HEAD"
          test "$(git diff --name-only "$BASE".."$HEAD" | wc -l)" = 10
      - name: Verify recorded independent review via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              'https://api.github.com/repos/TheHalfMoon/MSTR/pulls/173/reviews',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          reviews = json.load(urllib.request.urlopen(request, timeout=30))
          matches = [r for r in reviews if r.get('id') == 5125852654]
          assert len(matches) == 1
          review = matches[0]
          assert review['state'] == 'COMMENTED'
          assert review['commit_id'] == '9aa9d221e8b0be9d8af5d1e9efb2b11b89c13b6b'
          body = review.get('body') or ''
          assert 'Findings: NONE.' in body
          assert '34043135072' in body
          assert '34043604690' in body
          print('PR173_REVIEW_BINDING=PASS')
          PY
      - name: Re-run frozen exact-head quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_b012_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_governance.py \
            colab/mstr_b012_source.py \
            colab/mstr_b012_artifacts.py \
            colab/mstr_b012_raw_code.py \
            colab/mstr_b012_execute.py \
            tests/contract/test_b012_executor_binding.py
          python -m mypy src/mstr_qualify
          git diff --exit-code
          git diff --cached --exit-code

  final_premerge:
    needs: [canonical_eligibility, exact_head_gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Guard expected refs immediately before merge eligibility
        shell: bash
        run: |
          set -euo pipefail
          BASE=603a6865fdbf5a5434565e870d73054c5b574f2a
          HEAD=9aa9d221e8b0be9d8af5d1e9efb2b11b89c13b6b
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/feat/b012-executor-toolchain-binding | awk '{print $1}')" = "$HEAD"
          echo 'PR173_MANDATORY_PREMERGE=PASS'
          echo "EXPECTED_BASE=$BASE"
          echo "EXPECTED_HEAD=$HEAD"
          echo 'QUALIFICATION_RUN=34043135072'
          echo 'REVIEW_RUN=34043604690'
          echo 'REVIEW_ID=5125852654'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
