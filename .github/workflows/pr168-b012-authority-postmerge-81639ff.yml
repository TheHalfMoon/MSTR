name: Postmerge verify PR168 B012 authority

on:
  push:
    branches:
      - evidence/pr168-b012-authority-postmerge-81639ff

permissions:
  contents: read
  pull-requests: read

env:
  MERGE_SHA: 81639ff15e31d7f6a3b8aeaa7ceae4b80b009feb
  MERGE_TREE: 875e722d32687525cd4209ee23b0d5660fad3dad
  OLD_MAIN: e5e47644fb7122cbb47b43cdf13d072f82ebfdf7
  CANDIDATE_HEAD: 1b5528bd824dd4c7896d07f50e12a9353e7e903e
  PR_NUMBER: "168"

jobs:
  exact_main_postmerge:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify canonical merge identity and PR terminal state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          mapfile -t parents < <(git show -s --format='%P' "$MERGE_SHA" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$OLD_MAIN"
          test "${parents[1]}" = "$CANDIDATE_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg merge "$MERGE_SHA" --arg head "$CANDIDATE_HEAD" '.state == "closed" and .merged == true and .merge_commit_sha == $merge and .head.sha == $head' /tmp/pr.json >/dev/null
          git update-ref refs/heads/main "$MERGE_SHA"
          git update-ref refs/remotes/origin/main "$MERGE_SHA"
          echo 'PR168_POSTMERGE_IDENTITY=PASS'
      - name: Install canonical tooling
        run: python -m pip install -e '.[dev]'
      - name: Prove exact-main B012 authority, eligibility, and fail-closed dispatch
        shell: bash
        run: |
          set -euo pipefail
          mstr-qualify task eligible B012 > /tmp/b012.json
          jq -e '.task_id == "B012" and .eligible == true and .authority_result.required == true and .authority_result.satisfied == true and .authority_result.authority_id == "B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION" and .state_consistency_result.observed_state == "PENDING" and (.reasons | length == 0)' /tmp/b012.json >/dev/null
          if mstr-qualify task eligible B013 > /tmp/b013.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B012")) != null' /tmp/b013.json >/dev/null
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          authority_path = Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json')
          envelope_path = Path('artifacts/manifests/B012-equivalent-qualification-execution-envelope.json')
          authority = json.loads(authority_path.read_text())
          envelope = json.loads(envelope_path.read_text())
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['decision'] == 'FOUNDER_B012_EQUIVALENT_QUALIFICATION_DECISION=AUTHORIZE_EXACT_B010_CANDIDATES'
          assert authority['scope']['decision_surface'] == {'issue': 162, 'comment_id': 5553875175}
          assert authority['scope']['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          assert authority['scope']['bounded_execution_envelope']['sha256'] == hashlib.sha256(envelope_path.read_bytes()).hexdigest()
          assert envelope['dispatch_state'] == 'BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING'
          assert envelope['toolchain_provisioning']['state'] == 'BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING'
          assert envelope['resource_ceiling']['paid_cost_usd'] == 0.0
          assert envelope['resource_ceiling']['gpu_layers'] == 0
          assert envelope['runner_envelope']['git_model_binaries'] == 0
          assert envelope['runner_envelope']['founder_machine_model_binaries'] == 0
          combined = authority_path.read_text() + envelope_path.read_text()
          for forbidden in ('T031', 'T032', 'T033', 'T034'):
              assert forbidden not in combined
          print('PR168_POSTMERGE_B012_AUTHORITY=PASS')
          print('B012_EXECUTION_DISPATCH=BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING')
          PY
      - name: Fresh canonical quality verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/contract/test_b012_authority.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/contract/test_convergence_external_bindings.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          echo 'PR168_POSTMERGE_QUALITY=PASS'
      - name: Final canonical main immutability recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git rev-parse refs/heads/main)" = "$MERGE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MERGE_SHA"
          echo 'PR168_B012_AUTHORITY_POSTMERGE=PASS'
