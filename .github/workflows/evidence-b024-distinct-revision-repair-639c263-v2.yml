name: Repair B024 distinct repair revisions v2

on:
  push:
    branches:
      - evidence/b024-distinct-revision-repair-639c263

permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  BASE_SHA: 1ffa71c94bda161ec7be7784de3a6a4be81570ad
  OLD_HEAD: 639c263b2c349f21dddc2539d46748f67e544a0e
  OLD_TREE: e6c574422446a39503f9311434c953dd015aecbb
  TARGET_BRANCH: feat/000b-b024-test-generation-curriculum
  QUALIFICATION_RUN: '33539898060'
  INITIAL_CODEX_REVIEW_ID: '5081151219'
  NEGATIVE_REPAIR_RUN: '33540266330'

jobs:
  repair_validate_publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: repo
    steps:
      - name: Checkout repair controller
        uses: actions/checkout@v4
        with:
          path: evidence-src
          fetch-depth: 0
      - name: Checkout exact current B024 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OLD_HEAD }}
          path: repo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: repo/pyproject.toml

      - name: Verify immutable entry and negative-run provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OLD_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$OLD_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$OLD_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" > /tmp/qualification.json
          jq -e '.status == "completed" and .conclusion == "success"' /tmp/qualification.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/135/reviews/${INITIAL_CODEX_REVIEW_ID}" > /tmp/review.json
          jq -e '.user.login == "chatgpt-codex-connector[bot]" and .commit_id == "f052704cdb89b0e8d99135aa8d844c18a6b7a698"' /tmp/review.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NEGATIVE_REPAIR_RUN}" > /tmp/negative.json
          jq -e '.status == "completed" and .conclusion == "failure"' /tmp/negative.json

      - name: Apply distinct-revision remediation with Ruff-safe formatting
        shell: bash
        run: |
          set -euo pipefail
          python ../evidence-src/.github/evidence/b024_distinct_revision_repair.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/mstr_qualify/schemas.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '                "$.fix_revision: FAIL_BEFORE_PASS_AFTER requires a revision distinct from base_revision"\n',
              '                "$.fix_revision: FAIL_BEFORE_PASS_AFTER requires a revision "\n'
              '                "distinct from base_revision"\n',
          )
          path.write_text(text, encoding="utf-8")
          PY
          printf '%s\n' \
            docs/data/TEST_GENERATION_CURRICULUM.md \
            evidence/mstr-000b/B024-test-curriculum.md \
            src/mstr_qualify/schemas.py \
            tests/contract/test_test_generation_example_contract.py | sort > /tmp/expected-files
          git status --porcelain=v1 --untracked-files=all | sed 's/^...//' | sort > /tmp/status-files
          diff -u /tmp/expected-files /tmp/status-files
          git add --pathspec-from-file=/tmp/expected-files
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/staged-files
          diff -u /tmp/expected-files /tmp/staged-files
          git -c user.name='MSTR Evidence Builder' -c user.email='evidence-builder@users.noreply.github.com' \
            commit -m 'fix(mstr-000b): require distinct repair revisions'
          test "$(git rev-parse HEAD^)" = "$OLD_HEAD"
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Run focused B024 regression suite
        run: |
          python -m pytest \
            tests/contract/test_test_generation_example_contract.py \
            tests/contract/test_schemas.py \
            tests/integration/test_cli_offline.py \
            tests/contract/test_task_gate.py \
            -q
      - name: Validate offline schemas
        run: python -m mstr_qualify validate
      - name: Run full pytest
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run strict mypy
        run: python -m mypy src

      - name: Re-prove canonical ordering and authority
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$BASE_SHA"
          git update-ref refs/heads/main "$BASE_SHA"
          git update-ref refs/remotes/origin/main "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B024 > /tmp/b024.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true' /tmp/b024.json
          set +e
          mstr-qualify task eligible B026 > /tmp/b026.json
          rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.eligible == false and ([.prerequisite_results[] | select(.task_id == "B024" and .satisfied == false)] | length == 1)' /tmp/b026.json
          set +e
          mstr-qualify task eligible B011 > /tmp/b011.json
          rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.eligible == false and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          git switch --detach "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD^)" = "$OLD_HEAD"
          grep -F 'FAIL_BEFORE_PASS_AFTER_DISTINCT_BASE_FIX_REVISIONS = required' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'WEIGHT_CHANGING_TRAINING = NONE' evidence/mstr-000b/B024-test-curriculum.md

      - name: Guarded fast-forward publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD^)" = "$OLD_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$OLD_HEAD"
          git diff --name-only "$OLD_HEAD...$CANDIDATE_HEAD" | sort > /tmp/final-files
          diff -u /tmp/expected-files /tmp/final-files
          git diff --check "$OLD_HEAD...$CANDIDATE_HEAD"
          git push origin "$CANDIDATE_HEAD:refs/heads/$TARGET_BRANCH"
          echo "B024_DISTINCT_REVISION_REPAIR=PASS"
          echo "B024_REPAIRED_HEAD=$CANDIDATE_HEAD"
          echo "B024_REPAIRED_TREE=$CANDIDATE_TREE"
          echo "MODEL_EXECUTION=NONE"
          echo "WEIGHT_CHANGING_TRAINING=NONE"
