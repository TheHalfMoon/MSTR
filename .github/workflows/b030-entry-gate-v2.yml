name: Verify B030 exact-main entry gate v2

on:
  push:
    branches:
      - evidence/b030-entry-v2-2d19b62

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_MAIN: 2d19b6296d550b5b60c1b511d71c6ce86a38d195
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove exact canonical main and no conflicting B030 PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          count="$(gh api 'search/issues?q=repo:TheHalfMoon/MSTR+is:pr+is:open+B030' --jq '.total_count')"
          test "$count" = "0"
      - name: Install canonical tooling
        run: python -m pip install -e '.[dev]'
      - name: Prove B030 machine eligibility and bounded frontier
        run: |
          set -euo pipefail
          mstr-qualify task eligible B030 > /tmp/b030.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .reasons == [] and .authority_result.required == false' /tmp/b030.json >/dev/null
          if mstr-qualify task eligible B031 > /tmp/b031.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:A019")) != null and (.reasons | index("prerequisite.unsatisfied:A020")) != null and (.reasons | index("prerequisite.unsatisfied:B030")) != null' /tmp/b031.json >/dev/null
          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json >/dev/null
          if mstr-qualify task eligible B013 > /tmp/b013.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.state_consistency_result.observed_state == "BLOCKED" and ((.reasons | index("prerequisite.unsatisfied:B012")) != null)' /tmp/b013.json >/dev/null
      - name: Prove clean canonical drift
        run: |
          set -euo pipefail
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json >/dev/null
      - name: Offline validation
        run: mstr-qualify validate
      - name: Full test suite
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: Canonical mypy
        run: mypy src
      - name: Final immutable exact-main recheck
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
