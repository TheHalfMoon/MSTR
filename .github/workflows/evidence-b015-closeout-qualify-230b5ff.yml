name: Qualify exact B015 closeout head

on:
  push:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 5104f7ef63ba37caa518868ad89d0f78fe70641f
      EXPECTED_HEAD: 230b5ffd02990fe67fee0f2b76002f24ab27f82a
      TARGET_BRANCH: docs/000b-b015-canonicalize
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 230b5ffd02990fe67fee0f2b76002f24ab27f82a
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact closeout identity and scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          expected=$(printf '%s\n' \
            artifacts/decisions/B015-language-target-policy.json \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B015-language-mix.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_b015_language_target_policy.py \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          test "$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | wc -l)" -eq 7
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          echo 'B015_CLOSEOUT_EXACT_IDENTITY=PASS'
      - name: Re-prove terminal and live frontier machine truth
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git branch -f main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"
          if python -m mstr_qualify task eligible B015 > /tmp/b015.json; then exit 1; fi
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          for task in B016 B018 B020 B022 B025; do
            python -m mstr_qualify task eligible "$task" > "/tmp/$task.json"
          done
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json

          b15 = json.load(open('/tmp/b015.json'))
          assert b15['eligible'] is False
          assert b15['state_consistency_result']['observed_state'] == 'COMPLETE_CANONICAL'
          assert 'task.already_terminal' in b15['reasons']
          for task in ['B016', 'B018', 'B020', 'B022', 'B025']:
              payload = json.load(open(f'/tmp/{task}.json'))
              assert payload['eligible'] is True and payload['reasons'] == []
              assert payload['authority_result']['required'] is False
          b11 = json.load(open('/tmp/b011.json'))
          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state'] == 'BLOCKED'
          assert b11['authority_result']['required'] is True
          assert b11['authority_result']['satisfied'] is False
          drift = json.load(open('/tmp/drift.json'))
          assert drift['status'] == 'clean' and drift['findings'] == []
          print('B015_CLOSEOUT_MACHINE_REQUALIFICATION=PASS')
          PY
      - name: Run frozen exact-head gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_b015_language_target_policy.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy src
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          echo 'B015_CLOSEOUT_EXACT_HEAD_GATES=PASS'
      - name: Final immutable remote recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          echo 'B015_CLOSEOUT_QUALIFICATION=PASS'
          echo 'B011_REMAINS_BLOCKED=PASS'
