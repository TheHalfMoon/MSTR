name: Final independent review B007 closeout 8410856

on:
  push:

permissions:
  contents: read

env:
  EXPECTED_MAIN: b9b0a8ca7b9b7528f5da518baa83b23e2348c6f6
  EXPECTED_HEAD: 8410856e23f130be3f7e61dcf4cced2f9ce9aa53
  TARGET_BRANCH: docs/000b-b007-canonicalize
  ENTRY_MAIN: 9b4e885f215fd922ecf79ff9e15bdb1479396668
  IMPLEMENTATION_HEAD: 965fbdbf152272397ae6ef721260e806be5d251c
  IMPLEMENTATION_MERGE: b9b0a8ca7b9b7528f5da518baa83b23e2348c6f6
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adversarial identity provenance and exact authority vocabulary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          expected=$(printf '%s\n' configs/task-gate/mstr-000b.json evidence/mstr-000b/B007-tokenizer-protocol.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py | sort)
          test "$(git diff --name-only "$EXPECTED_MAIN"..."$EXPECTED_HEAD" | sort)" = "$expected"
          git diff --check "$EXPECTED_MAIN"..."$EXPECTED_HEAD"
          test "$(git rev-parse "$EXPECTED_MAIN:benchmarks/fixtures/tokenizer-economics/B007-corpus.json")" = "$(git rev-parse "$EXPECTED_HEAD:benchmarks/fixtures/tokenizer-economics/B007-corpus.json")"
          test "$(git rev-parse "$EXPECTED_MAIN:benchmarks/manifests/B007-tokenizer-economics.json")" = "$(git rev-parse "$EXPECTED_HEAD:benchmarks/manifests/B007-tokenizer-economics.json")"
          test "$(git rev-parse "$EXPECTED_MAIN:specs/002-code-model-supremacy-foundation/contracts/b007-tokenizer-economics-corpus-v0.schema.json")" = "$(git rev-parse "$EXPECTED_HEAD:specs/002-code-model-supremacy-foundation/contracts/b007-tokenizer-economics-corpus-v0.schema.json")"
          test "$(git rev-parse "$EXPECTED_MAIN:specs/002-code-model-supremacy-foundation/contracts/b007-tokenizer-economics-protocol-v0.schema.json")" = "$(git rev-parse "$EXPECTED_HEAD:specs/002-code-model-supremacy-foundation/contracts/b007-tokenizer-economics-protocol-v0.schema.json")"
          python - <<'PY'
          from pathlib import Path
          import json, os
          entry=os.environ['ENTRY_MAIN']; impl=os.environ['IMPLEMENTATION_HEAD']; merge=os.environ['IMPLEMENTATION_MERGE']
          cfg=json.loads(Path('configs/task-gate/mstr-000b.json').read_text())['tasks']['B007']
          assert cfg['canonical_state']=='COMPLETE_CANONICAL', cfg
          assert cfg['closeout_rule']['require_all_outputs'] is True, cfg
          assert set(cfg['outputs'])=={
              'benchmarks/manifests/B007-tokenizer-economics.json',
              'benchmarks/fixtures/tokenizer-economics/B007-corpus.json',
          }, cfg
          ev=Path('evidence/mstr-000b/B007-tokenizer-protocol.md').read_text()
          assert '**Implementation PR:** `#59`' in ev
          assert f'**Final implementation head:** `{impl}`' in ev
          assert f'**Canonical implementation merge:** `{merge}`' in ev
          assert 'ENTRY_GATE_TASK = B007' in ev
          assert f'ENTRY_GATE_CANONICAL_MAIN = {entry}' in ev
          assert 'ENTRY_GATE_ELIGIBLE = true' in ev
          assert 'B008 eligibility after this state transition is only machine scheduling eligibility' in ev
          expected_authority={
              'MODEL_INFERENCE':'NOT_AUTHORIZED',
              'MODEL_WEIGHT_ACCESS':'NOT_AUTHORIZED',
              'TOKENIZER_ARTIFACT_DOWNLOAD':'NOT_AUTHORIZED_BY_B007',
              'TOKENIZER_MEASUREMENT':'NOT_EXECUTED_BY_B007',
              'PAID_COMPUTE':'NOT_AUTHORIZED',
              'LARGE_DATASET_INGESTION':'NOT_AUTHORIZED',
              'B008_EXECUTION_AUTHORITY':'NOT_CREATED',
              'FOUNDER_MACHINE_LARGE_ARTIFACTS':'ZERO',
          }
          observed={}
          for raw in ev.splitlines():
              if ' = ' not in raw:
                  continue
              key,value=raw.split(' = ',1)
              if key in expected_authority:
                  observed[key]=value.strip()
          assert observed==expected_authority, observed
          assert 'does not create tokenizer acquisition/measurement' in ev
          tasks=Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text()
          assert '- [x] **B007 Freeze tokenizer-economics benchmark corpus/protocol.**' in tasks
          assert f'Canonical implementation: PR #59 / final head `{impl}` / merge `{merge}`.' in tasks
          print('B007_REVIEW_IDENTITY_PROVENANCE=PASS')
          print('B007_REVIEW_AUTHORITY_EXACT_FAIL_CLOSED=PASS')
          print('B007_REVIEW_PROTOCOL_BYTES_UNCHANGED=PASS')
          PY
      - name: Attempt successor bypass by removing required corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          candidate=$(git rev-parse HEAD)
          git branch -f main "$candidate"
          git update-ref refs/remotes/origin/main "$candidate"
          set +e
          python -m mstr_qualify task eligible B007 > /tmp/b007-intact.json
          b7=$?
          set -e
          test "$b7" -eq 1
          python -m mstr_qualify task eligible B008 > /tmp/b008-intact.json
          python -m mstr_qualify task drift > /tmp/drift-intact.json
          python - <<'PY'
          import json, subprocess
          h=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          b7=json.load(open('/tmp/b007-intact.json')); b8=json.load(open('/tmp/b008-intact.json')); d=json.load(open('/tmp/drift-intact.json'))
          assert b7['canonical_main']==h and b7['eligible'] is False and b7['reasons']==['task.already_terminal'], b7
          assert b8['canonical_main']==h and b8['eligible'] is True and b8['reasons']==[], b8
          assert d['canonical_main']==h and d['status']=='clean' and d['findings']==[], d
          PY
          pytest -q tests/contract/test_task_gate.py -k b008_fails_closed_when_b007_corpus_is_missing | tee /tmp/missing-corpus.txt
          grep -q '1 passed' /tmp/missing-corpus.txt
          python - <<'PY'
          from pathlib import Path
          s=Path('tests/integration/test_task_gate_cli.py').read_text()
          assert 'assert task_id == "B007"' in s
          assert 'assert task_id == "B008"' in s
          assert 'def test_task_eligible_b007_terminal_returns_one' in s
          assert 'def test_task_eligible_b008_successor_returns_zero' in s
          print('B007_REVIEW_MISSING_CORPUS_FAIL_CLOSED=PASS')
          print('B007_REVIEW_CLI_DISPATCH=PASS')
          PY
      - name: Independent frozen gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py | tee /tmp/targeted.txt
          grep -q '^55 passed' /tmp/targeted.txt
          pytest -q | tee /tmp/full.txt
          grep -q '^522 passed' /tmp/full.txt
          ruff check src tests
          mypy src
          python -m mstr_qualify validate | tee /tmp/validate.txt
          grep -q '"status": "pass"' /tmp/validate.txt
          echo B007_CLOSEOUT_INDEPENDENT_REVIEW_GATES=PASS
      - name: Reviewer live-ref immutability
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo B007_CLOSEOUT_REVIEWER_IMMUTABILITY=PASS
          echo TOKENIZER_ARTIFACT_DOWNLOAD=NONE
          echo TOKENIZER_MEASUREMENT=NONE
          echo MODEL_WEIGHT_ACCESS=NONE
          echo MODEL_EXECUTION=NONE
          echo PAID_COMPUTE=NONE
          echo B008_MATERIAL_EXECUTION=NOT_STARTED
