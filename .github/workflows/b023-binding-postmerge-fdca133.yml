name: B023 binding repair postmerge proof

on:
  push:
    branches:
      - evidence/b023-binding-postmerge-fdca133

permissions:
  contents: read

env:
  EXPECTED_MAIN: fdca133e53a47b8966faef172812da58503576a0
  EXPECTED_TREE: 4dcb096d1229f3245100edfb70b23a7f3dd65f1d
  EXPECTED_OLD_MAIN: db12d1467bb81185a9affffb4d470626ceceddfa
  EXPECTED_PR_HEAD: 98bdae609adda62376a6eba17886f4c7049cc29a

jobs:
  postmerge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact merge identity and canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_OLD_MAIN"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PR_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md
      - name: Re-run frozen quality gates on exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
      - name: Prove drift clean and B023 exact-main eligibility
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          mstr-qualify task drift > /tmp/drift.json
          cat /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B023 > /tmp/b023.json
          cat /tmp/b023.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING"' /tmp/b023.json
          jq -e '[.prerequisite_results[] | .task_id] | sort == ["A006","A014","B002","B022"]' /tmp/b023.json
          jq -e '[.prerequisite_results[] | .satisfied] | all(. == true)' /tmp/b023.json
          jq -e '[.prerequisite_results[] | select(.task_id == "A006" or .task_id == "A014") | .observed_state] | all(. == "COMPLETE_CANONICAL")' /tmp/b023.json
          echo "B023_EXACT_MAIN_ELIGIBLE=PASS"
      - name: Final canonical immutability recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo "POSTMERGE_PROOF=PASS"
          echo "B023_IMPLEMENTATION_AUTHORITY=ENTRY_GATE_ONLY"
          echo "MODEL_EXECUTION=NONE"
          echo "WEIGHT_CHANGING_TRAINING=NONE"
