name: Qualify B026 exact implementation head

on:
  push:
    branches: [evidence/b026-qualify-a2414b1]

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  BASE_SHA: 823cd7ec3b4c537876a0795d0f0f8d4bd75acd85
  HEAD_SHA: a2414b1bf58a5bce3a69ee965e74d8ac9d0ba7a8
  HEAD_TREE: 359cae043052e5e88a02699f220f17c3b57cd997
  TARGET_BRANCH: feat/000b-b026-research-ladder
  PR_NUMBER: '137'
  BUILDER_RUN: '33565430381'

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.HEAD_SHA }}', fetch-depth: 0}
      - name: Verify exact candidate identity and scope
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and .commits == 1 and .changed_files == 15' /tmp/pr.json

          printf '%s\n' \
            configs/research/mstr-research-ladder-v0.json \
            evidence/mstr-000b/B026-research-ladder.md \
            schemas/mstr-material-result-identity-v0.schema.json \
            schemas/mstr-research-experiment-v2.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/README.md \
            specs/002-code-model-supremacy-foundation/contracts/mstr-material-result-identity-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-research-experiment-v2.schema.json \
            src/mstr_qualify/schemas.py \
            tests/contract/test_research_ladder_contract.py \
            tests/contract/test_schemas.py \
            tests/fixtures/schemas/invalid/mstr-material-result-identity-v0.json \
            tests/fixtures/schemas/invalid/mstr-research-experiment-v2.json \
            tests/fixtures/schemas/valid/mstr-material-result-identity-v0.json \
            tests/fixtures/schemas/valid/mstr-research-experiment-v2.json \
            tests/integration/test_cli_offline.py | sort > /tmp/expected
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE_SHA...$HEAD_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- specs/002-code-model-supremacy-foundation/tasks.md configs/task-gate/mstr-000b.json)"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILDER_RUN}" > /tmp/builder.json
          jq -e '.status == "completed" and .conclusion == "success" and .name == "Build guarded B026 research ladder v3"' /tmp/builder.json

  machine_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.HEAD_SHA }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: pyproject.toml}
      - name: Re-prove exact B026 task frontier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$HEAD_SHA"
          git update-ref refs/remotes/origin/main "$HEAD_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B026 > /tmp/b026.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0' /tmp/b026.json
          set +e
          mstr-qualify task eligible B027 > /tmp/b027.json; b027_rc=$?
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_rc=$?
          set -e
          test "$b027_rc" -eq 1
          test "$b011_rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING" and ([.prerequisite_results[] | select(.task_id == "B026" and .observed_state == "PENDING" and .satisfied == false)] | length == 1)' /tmp/b027.json
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.HEAD_SHA }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: pyproject.toml}
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused B026 and registry tests
        run: python -m pytest tests/contract/test_schemas.py tests/contract/test_research_ladder_contract.py tests/integration/test_cli_offline.py -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src
      - name: Verify exact contracts and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          cmp schemas/mstr-material-result-identity-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-material-result-identity-v0.schema.json
          cmp schemas/mstr-research-experiment-v2.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-research-experiment-v2.schema.json
          grep -F '**State:** `IMPLEMENTATION_ACTIVE`' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'B026_ELIGIBLE = true' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'RESEARCH_CAMPAIGN_EXECUTION = NONE' evidence/mstr-000b/B026-research-ladder.md
          for marker in 'MODEL_WEIGHT_ACCESS = NONE' 'MODEL_EXECUTION = NONE' 'TEST_GENERATION_EXECUTION = NONE' 'VERIFIER_EXECUTION = NONE' 'PAID_COMPUTE = NONE' 'NETWORK_MODEL_OR_TEACHER_CALL = NONE' 'LARGE_DATASET_INGESTION = NONE' 'PRIVATE_USER_DATA_INGESTION = NONE' 'WEIGHT_CHANGING_TRAINING = NONE' 'LARGE_SCALE_RL = NONE' 'PRODUCTION_RELEASE = NONE'; do grep -F "$marker" evidence/mstr-000b/B026-research-ladder.md; done
          jq -e '.promotion_policy.sequential_only == true and .promotion_policy.promotion_criteria_predeclared == true and .promotion_policy.weak_experiments_must_not_run_expensive_levels == true and .promotion_policy.missing_material_identity_invalidates_promotion == true and .promotion_policy.frozen_evaluation_identity_required == true and .promotion_policy.task_eligibility_never_grants_external_effect_authority == true' configs/research/mstr-research-ladder-v0.json
          jq -e '[.levels[].level] == ["L0_CONTRACT_SMOKE","L1_CODE_PROXY","L2_EXECUTABLE_REPO","L3_DIRECTION_TO_DONE","L4_Q4_UNIVERSAL_LAPTOP"]' configs/research/mstr-research-ladder-v0.json
          jq -e '.authority_boundary.contract_freeze_only == true and ([.authority_boundary | to_entries[] | select(.key != "contract_freeze_only") | .value] | all(. == false))' configs/research/mstr-research-ladder-v0.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"

  complete:
    needs: [identity_scope, machine_gate, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.HEAD_SHA }}', fetch-depth: 0}
      - name: Final immutable exact-head recheck
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -e --arg head "$HEAD_SHA" '.state == "open" and .draft == false and .head.sha == $head and .changed_files == 15 and .commits == 1'
          echo 'B026_EXACT_HEAD_QUALIFICATION=PASS'
