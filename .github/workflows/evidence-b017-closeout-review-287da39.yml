name: Independent adversarial review of B017 closeout

on:
  push:

permissions:
  contents: read

env:
  EXPECTED_MAIN: 79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c
  EXPECTED_HEAD: 287da395632bc454ef0abe0e9b322800286711a7
  TARGET_BRANCH: docs/000b-b017-canonicalize

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: 287da395632bc454ef0abe0e9b322800286711a7, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'
      - name: Bind exact immutable review target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          expected=$(printf '%s\n' configs/task-gate/mstr-000b.json evidence/mstr-000b/B017-evolution-fixture-pilot.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_software_evolution_projection.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
      - name: Adversarial governance and authority review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def base_text(path: str) -> str:
              return subprocess.check_output(['git','show',f'79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c:{path}'], text=True)

          base_cfg=json.loads(base_text('configs/task-gate/mstr-000b.json'))
          head_cfg=json.loads(Path('configs/task-gate/mstr-000b.json').read_text())
          changed=[]
          for task_id in base_cfg['tasks']:
              if base_cfg['tasks'][task_id] != head_cfg['tasks'][task_id]:
                  changed.append(task_id)
          assert changed == ['B017'], changed
          assert base_cfg['tasks']['B017']['canonical_state']=='PENDING'
          assert head_cfg['tasks']['B017']['canonical_state']=='COMPLETE_CANONICAL'
          assert head_cfg['tasks']['B011']==base_cfg['tasks']['B011']
          assert head_cfg['tasks']['B018']==base_cfg['tasks']['B018']
          assert head_cfg['tasks']['B020']==base_cfg['tasks']['B020']
          assert head_cfg['tasks']['B022']==base_cfg['tasks']['B022']
          assert head_cfg['tasks']['B025']==base_cfg['tasks']['B025']

          evidence=Path('evidence/mstr-000b/B017-evolution-fixture-pilot.md').read_text()
          for required in [
              '**Implementation PR:** #73',
              '**Final implementation head:** `6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3`',
              '**Canonical implementation merge:** `79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c`',
              '**State:** COMPLETE_CANONICAL',
              'MODEL_WEIGHT_ACCESS = NONE',
              'MODEL_EXECUTION = NONE',
              'LARGE_DATASET_INGESTION = NONE',
              'WEIGHT_CHANGING_TRAINING = NONE',
              'PRODUCTION_RELEASE = NONE',
          ]:
              assert required in evidence, required
          assert 'B011 remains blocked' in evidence

          tasks=Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text()
          assert '- [x] **B017 Build a tiny fixture-only software-evolution extractor/projection proof.**' in tasks
          assert 'Canonical implementation: PR #73 / final head `6bab90d46fca0323fe9c1d66f37a69e8b13d8ae3` / merge `79e1b5ceca4ed39e10f53b0f85f93ffb7b02208c`.' in tasks
          assert '- [ ] **B018 Freeze execution-filtered student self-alignment contract.**' in tasks
          PY
      - name: Regression and frozen quality review
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/unit/test_software_evolution_projection.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy
      - name: Final immutable remote recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          echo 'B017_CLOSEOUT_INDEPENDENT_REVIEW=PASS'
          echo 'B011_AUTHORITY_UNCHANGED=PASS'
