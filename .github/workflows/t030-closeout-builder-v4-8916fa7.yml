name: T030 closeout builder v4

on:
  push:
    branches:
      - evidence/t030-closeout-builder-v4-8916fa7

permissions:
  contents: write

jobs:
  build_closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact closeout target
        uses: actions/checkout@v4
        with:
          ref: closeout/000-t030-canonical
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact implementation merge base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8916fa7138ad56d18452b7a20db9c8cb982648ba"
          test "$(git rev-parse HEAD^{tree})" = "b016ab6a3899accc352d8f177a2ba76451259f66"

      - name: Apply exact three-file governance patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/t030_closeout_patch.py
          python /tmp/t030_closeout_patch.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/canonical/CURRENT_STATE.md evidence/T030-runtime-adapters.md specs/000-universal-laptop-interaction-contract/tasks.md | sort)"
          test "$changed" = "$expected"

      - name: Commit and push bounded closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add docs/canonical/CURRENT_STATE.md evidence/T030-runtime-adapters.md specs/000-universal-laptop-interaction-contract/tasks.md
          git commit -m "docs(mstr-000): close T030 canonically"
          git push origin HEAD:closeout/000-t030-canonical
