name: PR178 T031 PEP440 independent substantive review a8fa069

on:
  push:
    branches:
      - evidence/pr178-t031-pep440-independent-review-a8fa069

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  BASE_SHA: f207ed9080fba1bb597a4091029dfd2a381eb346
  TARGET_HEAD: a8fa069838e05661d3f32dec960c450363ed5a18
  TARGET_TREE: e48c611e695c468ff9508696f2db44139e88d62f
  TARGET_BRANCH: fix/t031-pep440-replay-version-equivalence
  QUALIFICATION_RUN: "34066070646"
  EXPECTED_REPLAY_SHA256: 749eaf1f72a27a47a2a3d993d36a8147f71057428e24cee3271abd8a088e93fb
  EXPECTED_FAILURE_SHA256: 22165fc42c064a5f7b9b3c98de9c88d71d154fa0133ec25df71f835f1556b9c3
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  independent_substantive_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable review subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Verify immutable subject and exact qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$BASE_SHA" "$TARGET_HEAD")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$TARGET_HEAD"
          git diff --check "$BASE_SHA".."$TARGET_HEAD"
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          expected_files = [
              'artifacts/manifests/B012-executor-toolchain-binding.json',
              'artifacts/manifests/T031-executor-toolchain-binding.json',
              'artifacts/results/local/T031/failures/T031-granite-4.1-3b-run-34065259852.json',
              'colab/mstr_t031_replay.py',
              'evidence/T031-current-main-pep440-replay-version-repair.md',
              'tests/contract/test_t031_replay_version_equivalence.py',
          ]
          observed = subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['BASE_SHA'], os.environ['TARGET_HEAD']],
              text=True,
          ).splitlines()
          assert observed == expected_files, (observed, expected_files)

          headers = {
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          root = 'https://api.github.com/repos/TheHalfMoon/MSTR'
          def get(path):
              req = urllib.request.Request(root + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          run = get(f'/actions/runs/{os.environ["QUALIFICATION_RUN"]}')
          assert run['conclusion'] == 'success'
          jobs = get(f'/actions/runs/{os.environ["QUALIFICATION_RUN"]}/jobs?per_page=100')['jobs']
          conclusions = {job['name']: job['conclusion'] for job in jobs}
          assert conclusions == {
              'exact_head_qualification': 'success',
              'final_live_refs': 'success',
          }
          pr = get('/pulls/178')
          assert pr['state'] == 'open'
          assert pr['head']['sha'] == os.environ['TARGET_HEAD']
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['changed_files'] == 6
          print('PR178_REVIEW_SUBJECT_IDENTITY=PASS')
          print('PR178_QUALIFICATION_IDENTITY=PASS')
          PY

      - name: Independently review correctness security and governance
        shell: bash
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from packaging.version import Version

          root = Path('.')
          base = os.environ['BASE_SHA']
          helper_path = 'colab/mstr_t031_replay.py'
          helper = (root / helper_path).read_text(encoding='utf-8')
          helper_digest = hashlib.sha256((root / helper_path).read_bytes()).hexdigest()
          assert helper_digest == os.environ['EXPECTED_REPLAY_SHA256']

          diff = subprocess.check_output(
              ['git', 'diff', '--unified=0', base, os.environ['TARGET_HEAD'], '--', helper_path],
              text=True,
          )
          semantic_changes = [
              line for line in diff.splitlines()
              if (line.startswith('+') or line.startswith('-'))
              and not line.startswith('+++')
              and not line.startswith('---')
          ]
          assert semantic_changes == [
              '+        "from packaging.version import Version;"',
              '-        "assert actual==expected,(actual,expected);"',
              '+        "assert set(actual)==set(expected),(actual,expected);"',
              '+        "assert all(Version(actual[name])==Version(expected[name]) for name in expected),"',
              '+        "(actual,expected);"',
          ], semantic_changes
          assert '"--no-index"' in helper
          assert '"--no-deps"' in helper
          assert '"pip", "check"' in helper
          assert Version('13.0.3') == Version('13.0.3.0')
          assert Version('13.0.3') != Version('13.0.4')

          t031 = json.loads((root / 'artifacts/manifests/T031-executor-toolchain-binding.json').read_text())
          authority = json.loads((root / t031['authority_path']).read_text())
          overlay = json.loads((root / t031['producer_replay_overlay_path']).read_text())
          expected_candidates = [
              'granite-4.1-3b', 'ministral-3-3b', 'qwen2.5-coder-1.5b', 'qwen3-4b',
              'qwen3.5-2b', 'qwen3.5-4b', 'smollm3-3b', 'yi-coder-1.5b',
          ]
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['candidate_ids'] == expected_candidates
          assert t031['candidate_ids'] == expected_candidates
          assert t031['contexts'] == [4096, 8192, 16384]
          assert t031['producer_replay_helper_sha256'] == helper_digest
          assert t031['producer_replay_overlay_sha256'] == hashlib.sha256(
              (root / t031['producer_replay_overlay_path']).read_bytes()
          ).hexdigest()
          assert t031['producer_replay']['package_count'] == 59
          assert t031['producer_replay']['historical_transitive_identity_claim'] is False
          assert t031['producer_replay']['acceptance_gate'] == 'EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH'
          assert t031['producer_replay']['version_consistency_semantics'] == (
              'PEP_440_EQUIVALENCE_AFTER_EXACT_HASH_BOUND_WHEEL_INSTALLATION'
          )
          assert overlay['reconstruction_basis']['equivalence_gate'] == 'EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH'
          assert overlay['reconstruction_basis']['historical_transitive_identity_claim'] is False

          for key in (
              'b010_b012_candidates', 'candidate_revision_or_file_expansion', 'new_candidates',
              'paid_compute', 'paid_model_api', 'production_release', 't032_execution',
              't033_execution', 't034_admission_decision', 'training', 'weight_changing_training',
          ):
              assert authority['scope'][key] is False, key
          boundary = t031['execution_boundary']
          for key in ('authority_transfer', 'b012_execution', 't032_execution', 't033_execution', 't034_admission_decision', 'training'):
              assert boundary[key] is False, key
          assert boundary['paid_cost_usd'] == 0.0

          failure_path = root / 'artifacts/results/local/T031/failures/T031-granite-4.1-3b-run-34065259852.json'
          assert hashlib.sha256(failure_path.read_bytes()).hexdigest() == os.environ['EXPECTED_FAILURE_SHA256']
          failure = json.loads(failure_path.read_text())
          assert failure['result_classification'] == 'T031_EXECUTION_FAILED_CLOSED'
          assert failure['candidate_id'] == 'granite-4.1-3b'
          assert failure['canonical_main_at_start'] == base
          assert failure['paid_cost_usd'] == 0.0
          assert failure['training'] is False

          current_b012 = json.loads((root / 'artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          base_b012 = json.loads(subprocess.check_output(
              ['git', 'show', f'{base}:artifacts/manifests/B012-executor-toolchain-binding.json'], text=True
          ))
          current_replay = current_b012.pop('replay_helper_sha256')
          base_replay = base_b012.pop('replay_helper_sha256')
          assert current_replay == helper_digest
          assert base_replay != current_replay
          assert current_b012 == base_b012

          print('PR178_SUBSTANTIVE_CORRECTNESS_REVIEW=PASS')
          print('PR178_SECURITY_BOUNDARY_REVIEW=PASS')
          print('PR178_GOVERNANCE_BOUNDARY_REVIEW=PASS')
          print('PEP440_SCOPE=POST_HASH_METADATA_EQUIVALENCE_ONLY')
          print('T029_EXACT_ARTIFACT_EQUIVALENCE_GATE=RETAINED')
          print('B012_CHANGE=SHARED_REPLAY_HASH_REBIND_ONLY')
          print('AUTHORITY_EXPANSION=false')
          print('FINDINGS=NONE')
          print('MODEL_ACCESS=NONE')
          print('TRAINING=false')
          print('PAID_COST_USD=0.0')
          PY

      - name: Independent regression
        shell: bash
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_t031_replay_version_equivalence.py \
            tests/contract/test_t031_executor_binding.py \
            tests/contract/test_b012_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          test -z "$(git status --porcelain)"

      - name: Final immutable review subject guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$TARGET_HEAD"
          echo 'PR178_INDEPENDENT_SUBSTANTIVE_REVIEW=PASS'
          echo 'FINDINGS=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
