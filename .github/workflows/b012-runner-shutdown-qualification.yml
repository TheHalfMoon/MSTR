name: B012 runner shutdown evidence qualification e300ba6

on:
  push:
    branches:
      - evidence/b012-runner-shutdown-qualification-e300ba6

permissions:
  contents: read

env:
  BASE_SHA: 610bf7dacc5ee921d99a4fa2eb9023553021e84c
  SUBJECT_SHA: e300ba69fd13f3a45c08b5689168b9050eed58db
  SUBJECT_BRANCH: fix/b012-runner-shutdown-evidence-34064172421
  FAILURE_EVIDENCE_SHA256: e5abc34f9d251951d4b38508fd0c6f67d8200282f564279a4c6fada65e354030
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  canonical_eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify B012 machine eligibility on canonical main
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = main
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligibility.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/b012-eligibility.json', encoding='utf-8'))
          assert payload['task_id'] == 'B012'
          assert payload['eligible'] is True
          print('B012_MACHINE_ELIGIBILITY=PASS')
          PY
          test -z "$(git status --porcelain)"

  exact_head_qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact incident-evidence head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e300ba69fd13f3a45c08b5689168b9050eed58db
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Qualify exact incident evidence and full repository
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | awk '{print $1}')" = "$SUBJECT_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(sha256sum artifacts/results/equivalent/B012/failures/B012-mellum-4b-run-34064172421.json | awk '{print $1}')" = "$FAILURE_EVIDENCE_SHA256"
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_timeout_binding.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_t031_executor_binding.py \
            tests/contract/test_t031_replay_version_equivalence.py
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            tests/contract/test_b012_runner_shutdown_evidence.py
          python -m mypy src
          python -m mstr_qualify validate
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | awk '{print $1}')" = "$SUBJECT_SHA"
          echo 'B012_RUNNER_SHUTDOWN_EVIDENCE_QUALIFICATION=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'

  final_qualification:
    needs: [canonical_eligibility, exact_head_qualification]
    runs-on: ubuntu-24.04
    steps:
      - name: Final exact live-ref guard
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$SUBJECT_BRANCH | awk '{print $1}')" = "$SUBJECT_SHA"
          echo 'B012_RUNNER_SHUTDOWN_FINAL_QUALIFICATION=PASS'
          echo "BASE=$BASE_SHA"
          echo "HEAD=$SUBJECT_SHA"
