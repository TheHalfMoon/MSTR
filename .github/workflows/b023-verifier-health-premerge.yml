name: Mandatory premerge verification for repaired B023 verifier health

on:
  push:
    branches:
      - evidence/b023-verifier-health-premerge-da0480c

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

env:
  EXPECTED_BASE: fdca133e53a47b8966faef172812da58503576a0
  EXPECTED_HEAD: da0480c0eb39e4097cb2d3fd3337a7fc49ab75dc
  EXPECTED_TREE: 097cf6373e918e60f6c20bb81e3b7f28435177d3
  EXPECTED_BRANCH: feat/000b-b023-verifier-health-evaluator
  PR_NUMBER: '133'
  QUALIFICATION_RUN: '33527138891'
  QUALIFICATION_SHA: 4149d408c677ce1e15962cbf9200a590707daa3d
  QUALIFICATION_BRANCH: evidence/b023-verifier-health-qualify-da0480c
  REVIEW_CHECK_ID: '99917483113'

jobs:
  identity_evidence_review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify exact PR identity and bounded implementation scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git merge-base "$EXPECTED_BASE" "$EXPECTED_HEAD")" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EXPECTED_HEAD"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '.state == "open" and .draft == false and .mergeable == true and .base.sha == $base and .head.sha == $head and .changed_files == 4' /tmp/pr.json

          printf '%s\n' \
            evidence/mstr-000b/B023-verifier-health-implementation.md \
            src/mstr_qualify/verifier/__init__.py \
            src/mstr_qualify/verifier/health.py \
            tests/unit/test_verifier_health.py | sort > /tmp/expected-files
          git diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check "$EXPECTED_BASE...$EXPECTED_HEAD"
          test -z "$(grep '^\.github/' /tmp/actual-files || true)"
          test -z "$(grep '^specs/002-code-model-supremacy-foundation/tasks.md$' /tmp/actual-files || true)"
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md

      - name: Verify fresh exact-head qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" > /tmp/qualification.json
          jq -e \
            --arg branch "$QUALIFICATION_BRANCH" \
            --arg sha "$QUALIFICATION_SHA" \
            '.status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == $branch and .head_sha == $sha and .path == ".github/workflows/b023-verifier-health-qualification.yml"' \
            /tmp/qualification.json

          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/b023-verifier-health-qualification.yml?ref=${QUALIFICATION_SHA}" --jq '.content' | base64 -d > /tmp/qualification.yml
          grep -F "BASE_SHA: $EXPECTED_BASE" /tmp/qualification.yml
          grep -F "TARGET_SHA: $EXPECTED_HEAD" /tmp/qualification.yml
          grep -F "TARGET_TREE: $EXPECTED_TREE" /tmp/qualification.yml
          grep -F "TARGET_BRANCH: $EXPECTED_BRANCH" /tmp/qualification.yml
          grep -F "PR_NUMBER: '133'" /tmp/qualification.yml

      - name: Verify independent external exact-head review and zero unresolved threads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/check-runs/${REVIEW_CHECK_ID}" > /tmp/review-check.json
          jq -e \
            --arg head "$EXPECTED_HEAD" \
            '.name == "cubic · AI code reviewer" and .head_sha == $head and .status == "completed" and .conclusion == "success" and .app.slug == "cubic-dev-ai" and (.output.title == "AI review completed") and (.output.summary | contains("1 review")) and (.output.summary | contains("0 issues found"))' \
            /tmp/review-check.json

          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner='TheHalfMoon' -f name='MSTR' -F number=133 > /tmp/threads.json
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0' /tmp/threads.json

  canonical_machine_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BASE }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-prove exact-main task drift and B023 eligibility
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_BASE"
          git update-ref refs/remotes/origin/main "$EXPECTED_BASE"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B023 > /tmp/b023.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true' /tmp/b023.json
          jq -e '[.prerequisite_results[] | select(.task_id == "A006" or .task_id == "A014" or .task_id == "B002" or .task_id == "B022") | .satisfied] | length == 4 and all(. == true)' /tmp/b023.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          echo "B023_EXACT_MAIN_ELIGIBLE=PASS"

  candidate_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused B023, B022, and A018 tests
        run: >-
          python -m pytest
          tests/unit/test_verifier_health.py
          tests/contract/test_verifier_health_contract.py
          tests/unit/trajectory/test_trajectory_factory.py
          -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src
      - name: Re-prove frozen B023 authority boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MODEL_EXECUTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'MODEL_WEIGHT_ACCESS = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'NETWORK_EXECUTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'PAID_COMPUTE = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'LARGE_DATASET_INGESTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'PRIVATE_USER_DATA_INGESTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'WEIGHT_CHANGING_TRAINING = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EXPECTED_HEAD"

  complete:
    needs: [identity_evidence_review, canonical_machine_gate, candidate_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Final immutable identity, evidence, review, and thread recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/$EXPECTED_BRANCH | cut -f1)" = "$EXPECTED_HEAD"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '.state == "open" and .draft == false and .mergeable == true and .base.sha == $base and .head.sha == $head and .changed_files == 4'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" | jq -e --arg sha "$QUALIFICATION_SHA" '.status == "completed" and .conclusion == "success" and .head_sha == $sha'
          gh api "repos/${GITHUB_REPOSITORY}/check-runs/${REVIEW_CHECK_ID}" | jq -e --arg head "$EXPECTED_HEAD" '.head_sha == $head and .status == "completed" and .conclusion == "success" and .app.slug == "cubic-dev-ai" and (.output.summary | contains("0 issues found"))'
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner='TheHalfMoon' -f name='MSTR' -F number=133 | jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0'

          echo "B023_REPAIRED_PREMERGE_HEAD=$EXPECTED_HEAD"
          echo "B023_REPAIRED_PREMERGE=PASS"
          echo "MODEL_EXECUTION=NONE"
          echo "WEIGHT_CHANGING_TRAINING=NONE"
