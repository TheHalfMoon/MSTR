name: Mandatory A018 closeout premerge verification

on:
  push:
    branches:
      - evidence/a018-closeout-premerge-7336bc6

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  admission:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact A018 closeout admission
        shell: bash
        run: |
          set -euo pipefail
          BASE='b34a17441c24712144ce21b64c41ec18eeb12352'
          HEAD='7336bc60e396480a21de62b5e029f77f8d752d5c'
          TREE='13785c0703827f73ebe9fe4b56f28bdb1f3af779'
          git fetch origin main docs/000a-a018-closeout --quiet
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/docs/000a-a018-closeout)" = "$HEAD"
          test "$(git show -s --format=%T "$HEAD")" = "$TREE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          pr="$(gh api repos/TheHalfMoon/MSTR/pulls/123)"
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.merged' <<<"$pr")" = 'false'
          test "$(jq -r '.draft' <<<"$pr")" = 'false'
          test "$(jq -r '.base.sha' <<<"$pr")" = "$BASE"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$HEAD"
          reviews="$(gh api repos/TheHalfMoon/MSTR/pulls/123/reviews)"
          jq -e '.[] | select(.id == 5076971515 and .state == "COMMENTED" and .commit_id == "7336bc60e396480a21de62b5e029f77f8d752d5c")' <<<"$reviews" >/dev/null
          fresh_qual="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33498284633)"
          test "$(jq -r '.conclusion' <<<"$fresh_qual")" = 'success'
          stale_qual="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33498100142)"
          test "$(jq -r '.conclusion' <<<"$stale_qual")" = 'failure'
          expected="$(printf '%s\n' 'evidence/mstr-000a/A018-trajectory-factory.md' 'specs/001-agent-harness-verified-loop-foundation/tasks.md')"
          actual="$(git diff --name-only "$BASE..$HEAD")"
          test "$actual" = "$expected"
          git diff --check "$BASE..$HEAD"
          evidence="$(git show "$HEAD:evidence/mstr-000a/A018-trajectory-factory.md")"
          grep -F '**State:** `COMPLETE_CANONICAL`' <<<"$evidence"
          grep -F 'FINAL_QUALIFICATION = 33491507890 / SUCCESS' <<<"$evidence"
          grep -F 'INDEPENDENT_REVIEW = 5076280749 / NO_BLOCKING_FINDING' <<<"$evidence"
          grep -F 'MANDATORY_PREMERGE = 33491799986 / SUCCESS' <<<"$evidence"
          grep -F 'IMPLEMENTATION_MERGE = b34a17441c24712144ce21b64c41ec18eeb12352' <<<"$evidence"
          grep -F 'POST_MERGE_PROOF = 33492060094 / SUCCESS' <<<"$evidence"
          tasks="$(git show "$HEAD:specs/001-agent-harness-verified-loop-foundation/tasks.md")"
          grep -F -- '- [x] **A018 Implement trajectory recorder/replay/admission.**' <<<"$tasks"
          grep -F -- '- [ ] **A019 Run cross-harness baseline/tournament' <<<"$tasks"
          grep -F -- '- [ ] **A020 Implement and qualify `MSTR-RESEARCH-LOOP-v0`' <<<"$tasks"
          grep -F 'Canonical implementation: PR #122 / final head `fc04967b2cbe874489f3b09a38fb80c1650f2461` / merge `b34a17441c24712144ce21b64c41ec18eeb12352`; post-merge proof run `33492060094` = `SUCCESS`.' <<<"$tasks"
          threads="$(gh api graphql -f query='query { repository(owner:"TheHalfMoon", name:"MSTR") { pullRequest(number:123) { reviewThreads(first:100) { nodes { isResolved } } } } }')"
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$threads")" = '0'

  quality:
    needs: admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7336bc60e396480a21de62b5e029f77f8d752d5c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Run A018 closeout premerge quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/unit/trajectory/test_trajectory_factory.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src

  complete:
    needs: quality
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final immutable A018 closeout premerge recheck
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main docs/000a-a018-closeout --quiet
          test "$(git rev-parse origin/main)" = 'b34a17441c24712144ce21b64c41ec18eeb12352'
          test "$(git rev-parse origin/docs/000a-a018-closeout)" = '7336bc60e396480a21de62b5e029f77f8d752d5c'
          test "$(git show -s --format=%T origin/docs/000a-a018-closeout)" = '13785c0703827f73ebe9fe4b56f28bdb1f3af779'
          pr="$(gh api repos/TheHalfMoon/MSTR/pulls/123)"
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.head.sha' <<<"$pr")" = '7336bc60e396480a21de62b5e029f77f8d752d5c'
          test "$(jq -r '.base.sha' <<<"$pr")" = 'b34a17441c24712144ce21b64c41ec18eeb12352'
          threads="$(gh api graphql -f query='query { repository(owner:"TheHalfMoon", name:"MSTR") { pullRequest(number:123) { reviewThreads(first:100) { nodes { isResolved } } } } }')"
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$threads")" = '0'
