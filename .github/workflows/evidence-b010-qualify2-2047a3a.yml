name: Requalify exact B010 implementation head

on:
  push:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: e3ee155a7e0ed491984908998546900e594bda9a
      EXPECTED_HEAD: 2047a3aa8b7063736a490d00d1fe10709aba23e2
      TARGET_BRANCH: research/000b-b010-new-candidate-weight-access
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2047a3aa8b7063736a490d00d1fe10709aba23e2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact identity and three-file scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          expected=$(printf '%s\n' \
            artifacts/manifests/B010-new-candidate-weight-access.json \
            evidence/mstr-000b/B010-weight-access-preflight.md \
            tests/contract/test_b010_new_candidate_weight_access.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          test "$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | wc -l)" -eq 3
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B010_EXACT_HEAD_IDENTITY=PASS'
      - name: Re-prove exact manifest semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('artifacts/manifests/B010-new-candidate-weight-access.json').read_text())
          assert m['state'] == 'IMPLEMENTED_PENDING_CANONICAL_CLOSEOUT'
          d = m['decision']
          expected_ids = ['mellum-4b', 'qwen3.5-0.8b-control']
          assert d['qualification_candidates'] == expected_ids
          assert d['new_weight_access_required_candidates'] == expected_ids
          assert d['no_new_access_marker'] is None
          assert d['no_new_candidates_marker'] is None
          envs = {row['candidate_id']: row for row in m['candidate_access_envelopes']}
          assert set(envs) == set(expected_ids)
          mellum = envs['mellum-4b']
          assert mellum['upstream_id'] == 'JetBrains/Mellum-4b-base'
          assert mellum['exact_revision'] == '83cce2605fbdf6a3868627e9b0a5924e0072b94d'
          assert mellum['expected_weight_bytes'] == 8038527904
          assert mellum['expected_required_download_bytes'] == 8048099065
          mweights = {f['path']: (f['size_bytes'], f['sha256']) for f in mellum['required_files'] if f['artifact_class'] == 'MODEL_WEIGHT'}
          assert mweights == {
              'model-00001-of-00002.safetensors': (4986625856, '04bf4f574526ebecd75283af1f7ed0a412362388ddd28360c1581706cb3a00d2'),
              'model-00002-of-00002.safetensors': (3051902048, '8fa0269d11332e13874280dbf5a15d5d6086d038656832c16e984544caf4b21b'),
          }
          q = envs['qwen3.5-0.8b-control']
          assert q['upstream_id'] == 'Qwen/Qwen3.5-0.8B-Base'
          assert q['exact_revision'] == 'dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68'
          assert q['expected_weight_bytes'] == 1746942600
          assert q['expected_required_download_bytes'] == 1769897109
          qweights = {f['path']: (f['size_bytes'], f['sha256']) for f in q['required_files'] if f['artifact_class'] == 'MODEL_WEIGHT'}
          assert qweights == {
              'model.safetensors-00001-of-00001.safetensors': (1746942600, 'c2b1e5a17d9c1e27685d92ed9b382911ebb99955ecd89052d1721241adfbab6c'),
          }
          tokenizer = next(f for f in q['required_files'] if f['path'] == 'tokenizer.json')
          assert tokenizer['sha256'] == 'fe000e3ed39ed12b8d2481d527d44f93c65d37e87645d2dcc80d1bf9d50d2927'
          for row in envs.values():
              rights = row['rights_status']
              assert rights['license'] == 'Apache-2.0'
              assert rights['gated_terms_acceptance_required'] is False
              assert rights['account_required'] is False
              assert rights['clickthrough_required'] is False
              assert row['expected_usd'] == 0.0 and row['usd_ceiling'] == 0.0
              assert row['new_weight_access_required'] is True
          assert m['b011_handoff']['authorized_by_b010'] is False
          assert m['b011_handoff']['requires_separate_founder_authorization'] is True
          a = m['authority_boundary']
          assert a['founder_machine_large_artifacts'] == 0
          assert all(v is False for k, v in a.items() if k != 'founder_machine_large_artifacts')
          print('B010_MANIFEST_SEMANTICS=PASS')
          PY
      - name: Simulate exact candidate as canonical main
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git branch -f main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"
          python -m mstr_qualify task eligible B010 > /tmp/b010.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then
            echo 'B011 unexpectedly eligible' >&2
            exit 1
          fi
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json, os
          b10 = json.load(open('/tmp/b010.json'))
          b11 = json.load(open('/tmp/b011.json'))
          drift = json.load(open('/tmp/drift.json'))
          assert b10['canonical_main'] == os.environ['EXPECTED_HEAD']
          assert b10['eligible'] is True and b10['reasons'] == []
          assert b10['state_consistency_result']['observed_state'] == 'PENDING'
          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state'] == 'BLOCKED'
          assert drift['status'] == 'clean' and drift['findings'] == []
          print('B010_TASK_GATE_SIMULATION=PASS')
          PY
      - name: Run frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_b010_new_candidate_weight_access.py
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B010_EXACT_HEAD_QUALIFICATION=PASS'
      - name: Final remote identity recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          echo 'B010_QUALIFICATION_REMOTE_RECHECK=PASS'
