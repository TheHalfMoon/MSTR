name: PR187 B012 Qwen Q4 provenance independent review

on:
  push:
    branches:
      - evidence/pr187-b012-qwen-q4-provenance-independent-review-7c4e18a

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR_NUMBER: "187"
      BASE_SHA: f78359f87ab5f5259e5569bea178261dbd9cc8e7
      SUBJECT_BRANCH: fix/b012-qwen-q4-provenance-repair
      SUBJECT_SHA: 7c4e18a84b8246f3ec3e79d2bc94a4eec5167945
      SUBJECT_TREE: 66120bf247e7d9b9da34d5d47603493c8dce4c30
      QUALIFICATION_RUN: "34164502333"
      CORRECT_Q4_SHA: 177a8435373b58e09910ee68e6643f656b5d93b6d64e03ee4c37be4a86c995fa
    steps:
      - name: Checkout review evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.16
          check-latest: false

      - name: Verify review isolation and exact live PR identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse HEAD^)" == "$SUBJECT_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          mapfile -t review_delta < <(git diff --name-only "$SUBJECT_SHA...HEAD")
          [[ "${#review_delta[@]}" -eq 1 ]]
          [[ "${review_delta[0]}" == ".github/workflows/pr187-b012-qwen-q4-provenance-independent-review-7c4e18a.yml" ]]
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          python - "$pr" <<'PY'
          import json, os, sys
          pr=json.loads(sys.argv[1])
          assert pr["state"] == "open"
          assert pr["draft"] is False
          assert pr["base"]["sha"] == os.environ["BASE_SHA"]
          assert pr["head"]["sha"] == os.environ["SUBJECT_SHA"]
          assert pr["changed_files"] == 8
          PY
          q="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}")"
          python - "$q" <<'PY'
          import json, os, sys
          run=json.loads(sys.argv[1])
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          PY

      - name: Review immutable source-of-truth artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pr187-artifacts
          mkdir -p /tmp/pr187-artifacts/stage03 /tmp/pr187-artifacts/stage05 /tmp/pr187-artifacts/recovery
          gh run download 34155931982 -n b012-qwen3.5-0.8b-control-stage-03-quantize-34155931982 -D /tmp/pr187-artifacts/stage03
          gh run download 34155931982 -n b012-qwen3.5-0.8b-control-stage-05-decode-34155931982 -D /tmp/pr187-artifacts/stage05
          gh run download 34163308005 -n b012-qwen3.5-0.8b-control-raw-code-recovery-34163308005 -D /tmp/pr187-artifacts/recovery
          python - <<'PY'
          import json, os
          from pathlib import Path
          correct=os.environ["CORRECT_Q4_SHA"]
          stage03=json.loads((Path('/tmp/pr187-artifacts/stage03')/'B012-qwen3.5-0.8b-control-checkpoint-03-quantize.json').read_text())
          stage05=json.loads((Path('/tmp/pr187-artifacts/stage05')/'B012-qwen3.5-0.8b-control-stage-state.json').read_text())
          failed=json.loads((Path('/tmp/pr187-artifacts/recovery')/'B012-qwen3.5-0.8b-control-raw-code-recovery-failure.json').read_text())
          assert stage03['checkpoint_payload']['q4_k_m_sha256'] == correct
          assert stage03['checkpoint_payload']['q4_k_m_size_bytes'] == 541903296
          assert stage05['q4_k_m_sha256'] == correct
          assert stage05['q4_k_m_size_bytes'] == 541903296
          assert stage05['last_completed_stage'] == 'decode'
          assert failed['result_classification'] == 'B012_RAW_CODE_RECOVERY_FAILED_CLOSED'
          assert failed['error'] == 'B012 Qwen recovery regenerated Q4 SHA-256 mismatch'
          assert failed['candidate_admission_decision'] == 'NONE'
          PY

      - name: Review exact subject scope and semantics
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            "artifacts/manifests/B012-executor-toolchain-binding.json"
            "artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json"
            "artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34163308005.json"
            "artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-run-34155931982.json"
            "colab/mstr_b012_qwen_raw_code_recovery.py"
            "evidence/B012-qwen-q4-provenance-repair-34163308005.md"
            "evidence/B012-qwen-raw-code-runner-shutdown-34155931982.md"
            "tests/contract/test_b012_qwen_raw_code_recovery.py"
          )
          [[ "${#changed[@]}" -eq 8 ]]
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null; done
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- .github/workflows/b012-qwen-raw-code-recovery.yml
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- configs/workflows/b012-qwen-raw-code-recovery.yml
          git checkout --detach "$SUBJECT_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          correct=os.environ['CORRECT_Q4_SHA']
          incident=json.loads(Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-run-34155931982.json').read_text())
          manifest=json.loads(Path('artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json').read_text())
          failure=json.loads(Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34163308005.json').read_text())
          source=Path('colab/mstr_b012_qwen_raw_code_recovery.py').read_text()
          assert incident['q4_k_m_sha256'] == correct
          assert manifest['expected_q4_k_m_sha256'] == correct
          assert failure['candidate_admission_decision'] == 'NONE'
          assert failure['model_quality_verdict'] == 'NONE'
          assert manifest['activation']['retry_authority_created'] is False
          assert manifest['activation']['external_dispatch_authority_created'] is False
          assert 'regenerated_q4_sha256' in source
          assert 'regenerated_q4_size_bytes' in source
          PY

      - name: Run independent focused and full regression
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_b012_qwen_raw_code_recovery.py tests/contract/test_b012_runner_shutdown_evidence.py tests/contract/test_b012_executor_binding.py
          python -m mstr_qualify validate
          ruff check .
          ruff format --check .
          pytest -q
          mypy src/mstr_qualify

      - name: Final live subject guard and review verdict
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          echo 'REVIEW_FINDINGS=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
