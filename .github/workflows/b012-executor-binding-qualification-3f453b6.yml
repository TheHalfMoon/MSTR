name: B012 executor binding qualification 3f453b6

on:
  push:
    branches:
      - evidence/b012-executor-binding-qualification-92e44d4

permissions:
  contents: read

jobs:
  exact_identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3f453b656e5872694fe0b5b7dfbeee22667f3106
          fetch-depth: 0
          persist-credentials: false
      - name: Exact head base tree live-ref and file-scope gates
        shell: bash
        run: |
          set -euo pipefail
          BASE=603a6865fdbf5a5434565e870d73054c5b574f2a
          HEAD=3f453b656e5872694fe0b5b7dfbeee22667f3106
          TREE=adeab77f0f7fa51f5e937e285137d686b61e585a
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/feat/b012-executor-toolchain-binding | awk '{print $1}')" = "$HEAD"
          git diff --check "$BASE".."$HEAD"
          cat > /tmp/expected <<'EOF'
          .github/workflows/b012-qualify.yml
          artifacts/manifests/B012-executor-toolchain-binding.json
          artifacts/manifests/B012-executor-toolchain-lock.json
          benchmarks/manifests/B012-raw-code-proxy.json
          colab/mstr_b012_artifacts.py
          colab/mstr_b012_execute.py
          colab/mstr_b012_governance.py
          colab/mstr_b012_raw_code.py
          colab/mstr_b012_source.py
          tests/contract/test_b012_executor_binding.py
          EOF
          sort /tmp/expected -o /tmp/expected
          git diff --name-only "$BASE".."$HEAD" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

  binding_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3f453b656e5872694fe0b5b7dfbeee22667f3106
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify immutable B012 binding and authority boundary
        shell: bash
        env:
          PYTHONPATH: colab
        run: |
          set -euo pipefail
          python -m py_compile \
            colab/mstr_b012_governance.py \
            colab/mstr_b012_source.py \
            colab/mstr_b012_artifacts.py \
            colab/mstr_b012_raw_code.py \
            colab/mstr_b012_execute.py \
            tests/contract/test_b012_executor_binding.py
          python - <<'PY'
          from pathlib import Path
          from mstr_b012_governance import _require_binding

          binding, envelope, lock = _require_binding(Path('.'))
          assert binding['task_id'] == 'B012'
          assert binding['status'] == 'SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          assert binding['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          assert binding['source_main'] == '603a6865fdbf5a5434565e870d73054c5b574f2a'
          assert binding['resolution_evidence']['run_id'] == 34037510185
          assert binding['resolution_evidence']['model_access'] == 'NONE'
          assert binding['resolution_evidence']['training'] is False
          assert binding['resolution_evidence']['paid_cost_usd'] == 0.0
          assert binding['execution_boundary']['authority_transfer'] is False
          assert binding['execution_boundary']['new_candidates'] is False
          assert binding['execution_boundary']['training'] is False
          assert envelope['candidate_ids'] == binding['candidate_ids']
          assert lock['task_id'] == 'B012'
          print('B012_BINDING_CONTRACT=PASS')
          print('MODEL_ACCESS=NONE')
          print('TRAINING=false')
          print('PAID_COST_USD=0.0')
          PY

  replay_install_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3f453b656e5872694fe0b5b7dfbeee22667f3106
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Install and verify reused pinned package closure without model access
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/colab"
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from mstr_t031_replay import install_replay_toolchain

          with tempfile.TemporaryDirectory() as td:
              python_exe, identity = install_replay_toolchain(
                  base_lock_path=Path('artifacts/manifests/T031-executor-toolchain-lock.json'),
                  overlay_path=Path('artifacts/manifests/T031-t029-producer-replay-overlay.json'),
                  root=Path(td),
              )
              assert python_exe.is_file()
              assert identity['python_version'] == '3.11.16'
              assert identity['package_count'] == 40
              assert identity['packages']['torch'] == '2.13.0+cpu'
              assert identity['packages']['transformers'] == '5.15.1'
              assert identity['historical_transitive_identity_claim'] is False
          print('B012_REUSED_TOOLCHAIN_INSTALL_SMOKE=PASS')
          print('B012_TOOLCHAIN_REUSE_CLASS=EXPLICIT_PINNED_DEPENDENCY_REUSE_NO_AUTHORITY_TRANSFER')
          print('MODEL_ACCESS=NONE')
          print('TRAINING=false')
          print('PAID_COST_USD=0.0')
          PY

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3f453b656e5872694fe0b5b7dfbeee22667f3106
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Frozen repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_b012_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_governance.py \
            colab/mstr_b012_source.py \
            colab/mstr_b012_artifacts.py \
            colab/mstr_b012_raw_code.py \
            colab/mstr_b012_execute.py \
            tests/contract/test_b012_executor_binding.py
          python -m mypy src/mstr_qualify
          test -z "$(git status --porcelain)"

  final_qualification:
    needs: [exact_identity, binding_contract, replay_install_smoke, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reverify exact live refs
        shell: bash
        run: |
          set -euo pipefail
          BASE=603a6865fdbf5a5434565e870d73054c5b574f2a
          HEAD=3f453b656e5872694fe0b5b7dfbeee22667f3106
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/feat/b012-executor-toolchain-binding | awk '{print $1}')" = "$HEAD"
          echo 'B012_EXECUTOR_BINDING_EXACT_HEAD_QUALIFICATION=PASS'
          echo "BASE_SHA=$BASE"
          echo "TARGET_HEAD=$HEAD"
          echo 'TARGET_TREE=adeab77f0f7fa51f5e937e285137d686b61e585a'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
