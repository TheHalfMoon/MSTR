name: PR176 T031 replay repair exact-head qualification

on:
  push:
    branches:
      - evidence/pr176-t031-replay-qualification-08697e7

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr176-t031-replay-qualification-08697e7
  cancel-in-progress: false

env:
  PR_NUMBER: '176'
  BASE_SHA: 90fb88734006de8296825034345ba89ed6614794
  HEAD_SHA: 08697e7f8bb95aabc8f25677074ebeee18771169
  HEAD_TREE: 27ab4f780234a969435daa873007bcb934933d1a
  TARGET_BRANCH: fix/t031-historical-59wheel-binding-truth

jobs:
  exact_identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact topology and bounded file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$HEAD_SHA"
          git diff --check "$BASE_SHA".."$HEAD_SHA"
          cat > /tmp/expected <<'EOF'
          artifacts/manifests/T031-executor-toolchain-binding.json
          artifacts/manifests/T031-t029-historical-producer-replay-overlay.json
          artifacts/manifests/T031-t029-historical-pypi-packages-01.json
          artifacts/manifests/T031-t029-historical-pypi-packages-02.json
          artifacts/manifests/T031-t029-historical-pypi-packages-03.json
          colab/mstr_t031_execute.py
          colab/mstr_t031_governance.py
          colab/mstr_t031_historical_replay.py
          tests/contract/test_t031_executor_binding.py
          EOF
          sort /tmp/expected -o /tmp/expected
          git diff --name-only "$BASE_SHA".."$HEAD_SHA" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          echo 'PR176_EXACT_IDENTITY=PASS'

  authority_and_binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact authority and hash-bound reconstruction truth
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/colab"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from mstr_t031_historical_replay import _load_historical_packages

          root = Path('.')
          authority_path = root / 'artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json'
          authority = json.loads(authority_path.read_text())
          assert authority['authority_id'] == 'T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION'
          assert authority['task_id'] == 'T031'
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          scope = authority['scope']
          assert scope['decision'] == 'FOUNDER_T031_LOCAL_MEASUREMENT_DECISION=AUTHORIZE_EXACT_T029_CANDIDATES'
          assert scope['b010_b012_candidates'] is False
          assert scope['candidate_revision_or_file_expansion'] is False
          assert scope['new_candidates'] is False
          assert scope['paid_compute'] is False
          assert scope['paid_model_api'] is False
          assert scope['production_release'] is False
          assert scope['t032_execution'] is False
          assert scope['t033_execution'] is False
          assert scope['t034_admission_decision'] is False
          assert scope['training'] is False
          assert scope['weight_changing_training'] is False
          assert scope['founder_machine_large_artifacts'] == 0

          binding = json.loads((root / 'artifacts/manifests/T031-executor-toolchain-binding.json').read_text())
          pairs = {
              'toolchain_lock_sha256': 'artifacts/manifests/T031-executor-toolchain-lock.json',
              'producer_replay_overlay_sha256': 'artifacts/manifests/T031-t029-historical-producer-replay-overlay.json',
              'toolchain_helper_sha256': 'colab/mstr_executor_toolchain.py',
              'producer_replay_helper_sha256': 'colab/mstr_t031_replay.py',
              'historical_replay_helper_sha256': 'colab/mstr_t031_historical_replay.py',
              'governance_script_sha256': 'colab/mstr_t031_governance.py',
              'source_script_sha256': 'colab/mstr_t031_source.py',
              'artifact_script_sha256': 'colab/mstr_t031_artifacts.py',
              'measurement_script_sha256': 'colab/mstr_t031_measure.py',
              'executor_script_sha256': 'colab/mstr_t031_execute.py',
              'workflow_sha256': '.github/workflows/t031-measure.yml',
          }
          for key, path in pairs.items():
              actual = hashlib.sha256((root / path).read_bytes()).hexdigest()
              assert binding[key] == actual, (key, binding[key], actual)

          assert binding['source_main'] == 'a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          assert binding['producer_replay']['package_count'] == 59
          assert binding['producer_replay']['historical_transitive_identity_claim'] is False
          assert binding['producer_replay']['reconstruction_semantics'] == 'HASH_BOUND_PRE_CUTOFF_RECONSTRUCTION_NOT_HISTORICAL_TRANSITIVE_IDENTITY_PROOF'
          assert binding['producer_replay']['acceptance_gate'] == 'EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH'

          overlay_path = root / binding['producer_replay_overlay_path']
          overlay = json.loads(overlay_path.read_text())
          assert overlay['historical_t029_observation']['package_versions_recorded_by_t029'] is False
          assert overlay['reconstruction_basis']['historical_transitive_identity_claim'] is False
          assert overlay['reconstruction_basis']['equivalence_gate'] == 'EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH'
          assert overlay['historical_smoke_evidence']['run_id'] == 34042093348
          assert overlay['historical_smoke_evidence']['model_access'] == 'NONE'
          packages, shards = _load_historical_packages(overlay=overlay, overlay_path=overlay_path)
          assert len(packages) == 59 and len(shards) == 3

          boundary = binding['execution_boundary']
          for key in ('authority_transfer', 'b012_execution', 't032_execution', 't033_execution', 't034_admission_decision', 'training'):
              assert boundary[key] is False, key
          assert boundary['paid_cost_usd'] == 0.0
          assert boundary['git_model_binaries'] == 0
          assert boundary['founder_machine_model_binaries'] == 0
          print('T031_AUTHORITY=PASS')
          print('T031_HASH_BOUND_RECONSTRUCTION_BINDING=PASS')
          print('MODEL_ACCESS=NONE')
          print('TRAINING=false')
          print('PAID_COST_USD=0.0')
          PY
          python -m py_compile colab/mstr_executor_toolchain.py colab/mstr_t031_replay.py colab/mstr_t031_historical_replay.py colab/mstr_t031_artifacts.py colab/mstr_t031_execute.py colab/mstr_t031_governance.py colab/mstr_t031_measure.py colab/mstr_t031_source.py tests/contract/test_t031_executor_binding.py

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false
      - name: Run focused and full frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src/mstr_qualify
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test -z "$(git status --porcelain)"

  final_qualification:
    needs: [exact_identity, authority_and_binding, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reverify exact live refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$HEAD_SHA"
          echo 'PR176_T031_REPAIR_QUALIFICATION=PASS'
          echo "BASE_SHA=$BASE_SHA"
          echo "TARGET_HEAD=$HEAD_SHA"
          echo "TARGET_TREE=$HEAD_TREE"
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
