name: Build B008 tokenizer economics results v5

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 7f2fe43797db4b94103ca07c172de5672806f624
      TARGET_BRANCH: feat/000b-b008-tokenizer-economics
      SOURCE_BRANCH: evidence/b008-measure-build-7f2fe43
      SOURCE_HEAD: 1b446bb6552bac1d046101641dadf42825020492
      ENTRY_RUN: "33151438249"
      ENTRY_JOB: "98784106816"
      LOADABILITY_RUN: "33151738043"
      LOADABILITY_JOB: "98785061204"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/000b-b008-tokenizer-economics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard exact B008 material entry with local canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH" "$SOURCE_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$SOURCE_BRANCH)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git branch -f main "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]' 'huggingface_hub==0.34.4' 'tokenizers==0.22.0'
          python -m mstr_qualify task eligible B008 > /tmp/b008.json
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json
          import os
          e = json.load(open('/tmp/b008.json'))
          d = json.load(open('/tmp/drift.json'))
          m = os.environ['EXPECTED_MAIN']
          assert e['canonical_main'] == m and e['eligible'] is True and e['reasons'] == [], e
          assert e['state_consistency_result']['observed_state'] == 'PENDING', e
          assert d['canonical_main'] == m and d['status'] == 'clean' and d['findings'] == [], d
          print('B008_MEASUREMENT_ENTRY=PASS')
          PY

      - name: Materialize and repair Python source before acquisition
        shell: bash
        run: |
          set -euo pipefail
          git show "$SOURCE_HEAD:.github/workflows/evidence-b008-measure-build-7f2fe43.yml" > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/source.yml').read_text().splitlines()
          target = '      - name: Materialize reproducible measurement implementation and contract test'
          start = lines.index(target)
          run_idx = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run_idx + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  raise AssertionError(line)
          Path('/tmp/materialize.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/materialize.sh
          ruff format benchmarks/tokenizer_economics/b008_measure.py tests/contract/test_b008_tokenizer_economics_results.py
          python - <<'PY'
          from pathlib import Path

          path = Path('benchmarks/tokenizer_economics/b008_measure.py')
          source = path.read_text().splitlines()
          out = []
          replaced = set()

          def indent_of(line: str) -> str:
              return line[: len(line) - len(line.lstrip())]

          for line in source:
              stripped = line.strip()
              indent = indent_of(line)
              if stripped == 'import sys':
                  replaced.add('unused_sys')
                  continue
              if '"overflow_or_truncation_observation": "encoding.overflowing recorded; no truncation requested",' in line:
                  out.extend([
                      indent + '"overflow_or_truncation_observation": (',
                      indent + '    "encoding.overflowing recorded; "',
                      indent + '    "no truncation requested"',
                      indent + '),',
                  ])
                  replaced.add('overflow')
                  continue
              if '"token_count_api_identity": "tokenizers.Tokenizer.encode(text, add_special_tokens=False).ids length",' in line:
                  out.extend([
                      indent + '"token_count_api_identity": (',
                      indent + '    "tokenizers.Tokenizer.encode(text, "',
                      indent + '    "add_special_tokens=False).ids length"',
                      indent + '),',
                  ])
                  replaced.add('token_api')
                  continue
              if stripped.startswith('"The measured set is derived from canonical candidate records with'):
                  out.extend([
                      indent + '(',
                      indent + '    "The measured set is derived from canonical candidate records with "',
                      indent + '    "`status=static_qualified`, `rights.decision=pass_permissive`, and no "',
                      indent + '    "account/clickthrough gate. Exactly 10 candidates satisfy that rule "',
                      indent + '    "on the entry main."',
                      indent + '),',
                  ])
                  replaced.add('candidate_prose')
                  continue
              if stripped.startswith('"Higher weighted bytes/token means denser payload'):
                  out.extend([
                      indent + '(',
                      indent + '    "Higher weighted bytes/token means denser payload under this fixed "',
                      indent + '    "synthetic corpus. The 8192-token payload is a corpus-ratio estimate, "',
                      indent + '    "not a context-window claim."',
                      indent + '),',
                  ])
                  replaced.add('results_prose')
                  continue
              if stripped.startswith('"| Candidate | Bytes/token | Total tokens | 8K payload bytes |'):
                  out.extend([
                      indent + '(',
                      indent + '    "| Candidate | Bytes/token | Total tokens | 8K payload bytes | "',
                      indent + '    "Diff tokens | Stacktrace tokens | Tool JSON tokens | Path tokens |"',
                      indent + '),',
                  ])
                  replaced.add('table_header')
                  continue
              if "f\"| `{result['candidate_id']}` |" in line and "cats['file_paths']" in line:
                  out.extend([
                      indent + '"".join(',
                      indent + '    [',
                      indent + '        f"| `{result[\'candidate_id\']}` | ",',
                      indent + '        f"{agg[\'weighted_bytes_per_token\']:.6f} | ",',
                      indent + '        f"{agg[\'total_tokens\']} | ",',
                      indent + '        f"{agg[\'estimated_effective_payload_bytes_at_8192_tokens\']} | ",',
                      indent + '        f"{cats[\'diff\'][\'total_tokens\']} | ",',
                      indent + '        f"{cats[\'stack_trace\'][\'total_tokens\']} | ",',
                      indent + '        f"{cats[\'tool_json\'][\'total_tokens\']} | ",',
                      indent + '        f"{cats[\'file_paths\'][\'total_tokens\']} |",',
                      indent + '    ]',
                      indent + ')',
                  ])
                  replaced.add('table_row')
                  continue
              if stripped.startswith('"- Corpus integrity is checked against the frozen B007 manifest'):
                  out.extend([
                      indent + '(',
                      indent + '    "- Corpus integrity is checked against the frozen B007 manifest "',
                      indent + '    "before any tokenizer is used."',
                      indent + '),',
                  ])
                  replaced.add('corpus_contract')
                  continue
              if stripped.startswith('"- Only pinned `tokenizer.json` is acquired for each candidate'):
                  out.extend([
                      indent + '(',
                      indent + '    "- Only pinned `tokenizer.json` is acquired for each candidate; that "',
                      indent + '    "exact file is SHA-256 inventoried and is the only tokenizer artifact "',
                      indent + '    "loaded."',
                      indent + '),',
                  ])
                  replaced.add('artifact_contract')
                  continue
              if stripped.startswith('"- `tokenizers.Tokenizer.from_file` is used with'):
                  out.extend([
                      indent + '(',
                      indent + '    "- `tokenizers.Tokenizer.from_file` is used with "',
                      indent + '    "`add_special_tokens=false`; chat templates, padding, truncation, "',
                      indent + '    "pre-normalization, BOS and EOS injection are not used."',
                      indent + '),',
                  ])
                  replaced.add('runtime_contract')
                  continue
              if stripped.startswith('"- Identifier-like spans use the frozen ASCII regex'):
                  out.extend([
                      indent + '(',
                      indent + '    "- Identifier-like spans use the frozen ASCII regex and are encoded "',
                      indent + '    "in isolation. p50/p95 use deterministic nearest-rank percentiles."',
                      indent + '),',
                  ])
                  replaced.add('identifier_contract')
                  continue
              if stripped.startswith('"- Structural observations are recorded for diff'):
                  out.extend([
                      indent + '(',
                      indent + '    "- Structural observations are recorded for diff, file paths, stack "',
                      indent + '    "traces and tool JSON fixtures."',
                      indent + '),',
                  ])
                  replaced.add('structural_contract')
                  continue
              if stripped.startswith('"These results compare tokenizer economics on the deterministic B007'):
                  out.extend([
                      indent + '(',
                      indent + '    "These results compare tokenizer economics on the deterministic B007 "',
                      indent + '    "synthetic fixture only. They do not establish population-level code "',
                      indent + '    "efficiency, model quality, inference quality, trainability, or "',
                      indent + '    "production fitness."',
                      indent + '),',
                  ])
                  replaced.add('claim_boundary')
                  continue
              if stripped.startswith('"This task does not perform model inference, accept gated terms'):
                  out.extend([
                      indent + '(',
                      indent + '    "This task does not perform model inference, accept gated terms, use "',
                      indent + '    "paid compute, or place tokenizer artifacts on the founder machine."',
                      indent + '),',
                  ])
                  replaced.add('authority_boundary')
                  continue
              out.append(line)

          required = {
              'unused_sys', 'overflow', 'token_api', 'candidate_prose', 'results_prose',
              'table_header', 'table_row', 'corpus_contract', 'artifact_contract',
              'runtime_contract', 'identifier_contract', 'structural_contract',
              'claim_boundary', 'authority_boundary',
          }
          assert replaced == required, (required - replaced, replaced - required)
          path.write_text('\n'.join(out) + '\n')
          PY
          ruff format benchmarks/tokenizer_economics/b008_measure.py tests/contract/test_b008_tokenizer_economics_results.py
          python - <<'PY'
          from pathlib import Path
          for path in [
              Path('benchmarks/tokenizer_economics/b008_measure.py'),
              Path('tests/contract/test_b008_tokenizer_economics_results.py'),
          ]:
              too_long = [
                  (i, len(line), line)
                  for i, line in enumerate(path.read_text().splitlines(), 1)
                  if len(line) > 100
              ]
              assert not too_long, (path, too_long)
          print('B008_SOURCE_STYLE_PREFLIGHT=PASS')
          PY
          python -m py_compile benchmarks/tokenizer_economics/b008_measure.py tests/contract/test_b008_tokenizer_economics_results.py
          ruff check benchmarks/tokenizer_economics/b008_measure.py tests/contract/test_b008_tokenizer_economics_results.py
          git diff --check
          echo 'B008_MATERIALIZATION=PASS'

      - name: Execute pinned tokenizer-only B008 measurement
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/tokenizer_economics/b008_measure.py \
            --output-dir artifacts/results/tokenizer/B008 \
            --evidence evidence/mstr-000b/B008-tokenizer-economics.md
          test "$(find artifacts/results/tokenizer/B008 -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          test ! -e /tmp/b008-tokenizer-measurement
          echo 'B008_MEASUREMENT=PASS'

      - name: Validate exact implementation scope and frozen gates
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            benchmarks/tokenizer_economics/b008_measure.py \
            evidence/mstr-000b/B008-tokenizer-economics.md \
            tests/contract/test_b008_tokenizer_economics_results.py \
            artifacts/results/tokenizer/B008/granite-4.1-3b.json \
            artifacts/results/tokenizer/B008/mellum-4b.json \
            artifacts/results/tokenizer/B008/ministral-3-3b.json \
            artifacts/results/tokenizer/B008/qwen2.5-coder-1.5b.json \
            artifacts/results/tokenizer/B008/qwen3-4b.json \
            artifacts/results/tokenizer/B008/qwen3.5-0.8b-control.json \
            artifacts/results/tokenizer/B008/qwen3.5-2b.json \
            artifacts/results/tokenizer/B008/qwen3.5-4b.json \
            artifacts/results/tokenizer/B008/smollm3-3b.json \
            artifacts/results/tokenizer/B008/yi-coder-1.5b.json | sort)
          actual=$(git status --porcelain=v1 --untracked-files=all | sed 's/^...//' | sort)
          test "$actual" = "$expected"
          test "$(find . -name 'tokenizer.json' -not -path './.git/*' | wc -l)" -eq 0
          git diff --check
          pytest -q tests/contract/test_b008_tokenizer_economics_results.py | tee /tmp/b008-targeted.txt
          pytest -q | tee /tmp/full.txt
          ruff check src tests benchmarks/tokenizer_economics/b008_measure.py
          mypy src
          python -m mstr_qualify validate
          echo 'B008_FROZEN_GATES=PASS'

      - name: Commit and guarded fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/tokenizer_economics/b008_measure.py \
            evidence/mstr-000b/B008-tokenizer-economics.md \
            tests/contract/test_b008_tokenizer_economics_results.py \
            artifacts/results/tokenizer/B008
          git diff --cached --check
          git commit -m 'feat(mstr-000b): measure B008 tokenizer economics'
          final=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          git fetch origin main "$TARGET_BRANCH" "$SOURCE_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$SOURCE_BRANCH)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "B008_IMPLEMENTATION_HEAD=$final"
          echo "B008_MEASUREMENT_RUN=$GITHUB_RUN_ID"
          echo 'REMOTE_FILE_PER_CANDIDATE=tokenizer.json-only'
          echo 'MODEL_INFERENCE=NONE'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'GATED_TERMS_ACCEPTANCE=NONE'
          echo 'PAID_COMPUTE=NONE'
          echo 'FOUNDER_MACHINE_LARGE_ARTIFACTS=ZERO'
