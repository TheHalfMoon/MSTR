name: B012 activation exact-head qualification 3030980

on:
  push:
    branches:
      - evidence/b012-activation-builder-b04db4a

permissions:
  contents: read

env:
  BASE_SHA: b04db4aa42de3c4b5adcba2f54052a6ab2d3fcec
  TARGET_BRANCH: fix/b012-activate-stage-checkpoint-topology
  TARGET_HEAD: 30309808dfe5e352e5289653bcea97cf18bc2ec3
  TARGET_TREE: 21c21200967de1cbfc82c268309a74e669d8fc6a
  REPAIR_POSTMERGE_RUN: "34148201124"
  EXPECTED_STAGED_SHA256: 1cffee33a17c524dac0743a975d6538e845361d8ae7f8dedf808e4c740f5250e
  EXPECTED_WORKFLOW_SHA256: 383cae4a3729045b9d5a5b2e23ef3430a410070fceefc507b78eaaeaf0232f29
  EXPECTED_REPAIR_SHA256: 2dfc075480fb1549b811fe0976ddef745e0399ccc6c9a301b180684e4f88429e

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify canonical main and B012 machine eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$TARGET_BRANCH")" == "$TARGET_HEAD" ]]
          git checkout -B main origin/main
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligible.json
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          gate = json.loads(Path('/tmp/b012-eligible.json').read_text(encoding='utf-8'))
          assert gate['eligible'] is True
          assert gate['canonical_main'] == os.environ['BASE_SHA']
          req = urllib.request.Request(
              'https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/' + os.environ['REPAIR_POSTMERGE_RUN'],
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'mstr-b012-exact-head-qualification',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              run = json.load(response)
          assert run['status'] == 'completed'
          assert run['conclusion'] == 'success'
          print('B012_MACHINE_ELIGIBLE=true')
          print('REPAIR_POSTMERGE_EVIDENCE=PASS')
          PY

      - name: Checkout and guard exact activation subject
        run: |
          set -euo pipefail
          git checkout --detach "origin/$TARGET_BRANCH"
          [[ "$(git rev-parse HEAD)" == "$TARGET_HEAD" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$TARGET_TREE" ]]
          [[ "$(git merge-base "$BASE_SHA" HEAD)" == "$BASE_SHA" ]]
          git diff --name-only "$BASE_SHA..HEAD" | sort -u > /tmp/changed
          cat >/tmp/expected <<'EOF'
          .github/workflows/b012-qualify.yml
          artifacts/manifests/B012-executor-toolchain-binding.json
          artifacts/manifests/B012-runner-shutdown-topology-repair.json
          tests/contract/test_b012_executor_binding.py
          tests/contract/test_b012_runner_shutdown_evidence.py
          tests/contract/test_b012_stage_checkpoint_topology.py
          EOF
          sort -u /tmp/expected -o /tmp/expected
          diff -u /tmp/expected /tmp/changed
          echo "ACTIVATION_HEAD=$TARGET_HEAD"
          echo "ACTIVATION_TREE=$TARGET_TREE"
          echo 'SIX_FILE_CONTAINMENT=PASS'

      - name: Verify staged binding activation guard
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path.cwd()
          active = root / '.github/workflows/b012-qualify.yml'
          staged_workflow = root / 'configs/workflows/b012-qualify-staged.yml'
          staged_executor = root / 'colab/mstr_b012_staged.py'
          repair_path = root / 'artifacts/manifests/B012-runner-shutdown-topology-repair.json'
          binding_path = root / 'artifacts/manifests/B012-executor-toolchain-binding.json'

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert active.read_bytes() == staged_workflow.read_bytes()
          assert digest(active) == os.environ['EXPECTED_WORKFLOW_SHA256']
          assert digest(staged_workflow) == os.environ['EXPECTED_WORKFLOW_SHA256']
          assert digest(staged_executor) == os.environ['EXPECTED_STAGED_SHA256']
          assert digest(repair_path) == os.environ['EXPECTED_REPAIR_SHA256']

          workflow_text = active.read_text(encoding='utf-8')
          assert 'mstr_b012_staged.py' in workflow_text
          assert 'mstr_b012_execute.py' not in workflow_text

          repair = json.loads(repair_path.read_text(encoding='utf-8'))
          binding = json.loads(binding_path.read_text(encoding='utf-8'))
          assert repair['activation_state'] == 'ACTIVATED_BY_SEPARATE_CANONICAL_BINDING_CHANGE'
          assert repair['candidate_workflow_sha256'] == os.environ['EXPECTED_WORKFLOW_SHA256']
          assert repair['staged_executor_sha256'] == os.environ['EXPECTED_STAGED_SHA256']
          assert binding['status'] == 'SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          assert binding['workflow_sha256'] == os.environ['EXPECTED_WORKFLOW_SHA256']
          assert binding['runner_shutdown_topology_repair_manifest_sha256'] == os.environ['EXPECTED_REPAIR_SHA256']
          assert binding['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          activation = binding['runner_shutdown_topology_activation']
          assert activation['repair_manifest_sha256'] == os.environ['EXPECTED_REPAIR_SHA256']
          assert activation['staged_executor_sha256'] == os.environ['EXPECTED_STAGED_SHA256']
          assert activation['active_workflow_sha256'] == os.environ['EXPECTED_WORKFLOW_SHA256']
          assert activation['repair_merge_commit'] == os.environ['BASE_SHA']
          assert activation['repair_postmerge_run_id'] == int(os.environ['REPAIR_POSTMERGE_RUN'])
          assert activation['activation_is_separate_repository_change'] is True
          assert activation['retry_authority_created'] is False
          assert activation['external_dispatch_authority_created'] is False
          assert activation['model_access'] == 'NONE'
          assert activation['training'] is False
          assert activation['paid_cost_usd'] == 0.0

          recovery = repair['recovery_semantics']
          assert recovery['prior_failure_classification_preserved'] is True
          assert recovery['retry_authority_created'] is False
          assert recovery['external_dispatch_authority_created'] is False

          sys.path.insert(0, str(root / 'colab'))
          import mstr_b012_staged as staged
          staged_binding, _, _ = staged._require_staged_binding(root)
          assert staged_binding['status'] == 'SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          print('STAGED_BINDING_ACTIVATION_GUARD=PASS')
          PY

      - name: Run focused B012 qualification
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m mstr_qualify validate
          python -m ruff check \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            colab/mstr_b012_staged.py
          python -m ruff format --check \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            colab/mstr_b012_staged.py

      - name: Run full repository gates
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify

      - name: Final remote ref guards and evidence declaration
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          [[ "$REMOTE_MAIN" == "$BASE_SHA" ]]
          [[ "$REMOTE_HEAD" == "$TARGET_HEAD" ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_HEAD" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$TARGET_TREE" ]]
          echo "FINAL_REMOTE_MAIN=$REMOTE_MAIN"
          echo "FINAL_REMOTE_ACTIVATION_HEAD=$REMOTE_HEAD"
          echo "FINAL_ACTIVATION_TREE=$TARGET_TREE"
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
