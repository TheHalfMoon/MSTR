name: Reconcile current state before T030 closeout

on:
  push:
    branches:
      - evidence/t030-closeout-state-reconcile-240afb2

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact closeout candidate
        uses: actions/checkout@v4
        with:
          ref: closeout/000-t030-canonical
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "240afb2c8ddc5c6a9f8f15786fe4de8e5e963005"
          test "$(git rev-parse HEAD^)" = "8916fa7138ad56d18452b7a20db9c8cb982648ba"

      - name: Reconcile canonical snapshot from task ledgers
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/reconcile_state.py
          python /tmp/reconcile_state.py
          git diff --check
          test "$(git diff --name-only)" = "docs/canonical/CURRENT_STATE.md"

      - name: Commit and push state reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add docs/canonical/CURRENT_STATE.md
          git commit -m "docs(canonical): reconcile live MSTR workstream state"
          git push origin HEAD:closeout/000-t030-canonical
