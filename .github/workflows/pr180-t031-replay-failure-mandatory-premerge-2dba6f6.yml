name: PR180 T031 replay failure mandatory premerge

on:
  push:
    branches:
      - evidence/pr180-t031-replay-failure-mandatory-premerge-2dba6f6

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUBJECT_BRANCH: fix/t031-block-failed-59-wheel-replay-34067212730
      SUBJECT_SHA: 2dba6f6d34691ab7686a33de28724aeea67833e3
      SUBJECT_TREE: 4100d850d1f74e61c7bcf1122d084d676855468b
      BASE_SHA: 61bacde1ee21831080accc8a226433562a6aeaf9
      QUALIFICATION_RUN: '34069553031'
      REVIEW_RUN: '34069861909'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove live PR topology and exact containment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          live_main="$(git rev-parse origin/main)"
          live_subject="$(git rev-parse "origin/$SUBJECT_BRANCH")"
          [[ "$live_main" == "$BASE_SHA" ]]
          [[ "$live_subject" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            "artifacts/results/local/T031/failures/T031-granite-4.1-3b-run-34067212730.json"
            "evidence/T031-59-wheel-replay-equivalence-failure.md"
            "tests/contract/test_t031_59_wheel_replay_failure.py"
          )
          [[ "${#changed[@]}" -eq "${#expected[@]}" ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          git checkout --detach "$SUBJECT_SHA"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]

      - name: Verify qualification and independent review run identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected = {
              os.environ['QUALIFICATION_RUN']: ('completed', 'success'),
              os.environ['REVIEW_RUN']: ('completed', 'success'),
          }
          for run_id, wanted in expected.items():
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)
              actual = (data['status'], data['conclusion'])
              if actual != wanted:
                  raise SystemExit(f'run {run_id} not successful: {actual!r}')
          PY

      - name: Verify PR state and absence of change-requested reviews
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(path):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          pr = get('/pulls/180')
          assert pr['state'] == 'open'
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['sha'] == os.environ['SUBJECT_SHA']
          reviews = get('/pulls/180/reviews?per_page=100')
          if any(r.get('state') == 'CHANGES_REQUESTED' for r in reviews):
              raise SystemExit('CHANGES_REQUESTED review exists')
          comments = get('/pulls/180/comments?per_page=100')
          if any(c.get('in_reply_to_id') is None and c.get('body', '').strip().startswith('BLOCKING:') for c in comments):
              raise SystemExit('blocking review comment exists')
          PY

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Re-run exact focused and repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_t031_59_wheel_replay_failure.py \
            tests/contract/test_t031_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check tests/contract/test_t031_59_wheel_replay_failure.py
          python -m mypy src/mstr_qualify

      - name: Final immutable live-ref guard
        shell: bash
        run: |
          set -euo pipefail
          live_main="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          live_subject="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git "refs/heads/$SUBJECT_BRANCH" | cut -f1)"
          [[ "$live_main" == "$BASE_SHA" ]]
          [[ "$live_subject" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          echo 'PR180_PREMERGE=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
