name: PR194 B012 Qwen staged repair qualification v5

on:
  push:
    branches:
      - evidence/pr194-qualification-v5-e58435c

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 5e15cfd0d5eb696154a757edd9382dfea65359cf
      HEAD: e58435cbb02ec30ba60df1f24f7574f8712dc1ca
      TREE: bd04fe85b9d69747b1936c1c180012449042cfbb
      PR: '194'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.16
          check-latest: false

      - name: Prove exact subject head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "actual_head=$actual expected_head=$HEAD"
          test "$actual" = "$HEAD"

      - name: Prove exact subject tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git show -s --format=%T HEAD)"
          echo "actual_tree=$actual expected_tree=$TREE"
          test "$actual" = "$TREE"

      - name: Prove exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          actual="$(git rev-parse origin/main)"
          echo "actual_main=$actual expected_main=$BASE"
          test "$actual" = "$BASE"

      - name: Prove exact ancestry
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git merge-base "$BASE" "$HEAD")"
          echo "merge_base=$actual expected_base=$BASE"
          test "$actual" = "$BASE"

      - name: Prove live PR identity and bounded non-active scope
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
            mergeable=$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' /tmp/pr.json)
            [[ "$mergeable" != unknown ]] && break
            sleep 2
          done
          jq '{state,draft,mergeable,mergeable_state,base:.base.sha,head:.head.sha,changed_files}' /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==5' /tmp/pr.json >/dev/null
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            'artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json'
            'colab/mstr_b012_qwen_raw_code_recovery_staged.py'
            'configs/workflows/b012-qwen-raw-code-recovery-staged.yml'
            'evidence/mstr-000b/B012-qwen-staged-recovery-topology.md'
            'tests/contract/test_b012_qwen_staged_recovery_topology.py'
          )
          [[ ${#actual[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done
          for path in \
            .github/workflows/b012-qwen-raw-code-recovery.yml \
            colab/mstr_b012_governance.py \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            benchmarks/manifests/B012-raw-code-proxy.json; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Exact-main B012 eligibility
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git symbolic-ref --short HEAD)" = main
          test "$(git rev-parse HEAD)" = "$BASE"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          with open('/tmp/b012.json', encoding='utf-8') as fh:
              d=json.load(fh)
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['superseded'] is False
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          PY

      - name: Capture canonical formatter baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m ruff format --check --diff . > /tmp/base-format.diff 2>&1
          code=$?
          set -e
          echo "base_formatter_exit=$code"
          test "$code" -eq 1
          git checkout --detach "$HEAD"

      - name: Prove repair hash binding and semantic boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path=Path('artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json')
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          script=Path(m['staged_script_path'])
          workflow=Path(m['staged_workflow_spec_path'])
          sha=lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          assert m['task_id']=='B012'
          assert m['candidate_id']=='qwen3.5-0.8b-control'
          assert m['base_main']=='5e15cfd0d5eb696154a757edd9382dfea65359cf'
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert sha(script)==m['staged_script_sha256']
          assert sha(workflow)==m['staged_workflow_sha256']
          boundary=m['authority_boundary']
          for key in ('authority_scope_modified','authority_transfer','candidate_expansion','candidate_revision_or_file_expansion','external_dispatch_authority_created','paid_compute','paid_model_api','retry_authority_created','training','weight_changing_training'):
              assert boundary[key] is False, key
          durability=m['durability_boundary']
          assert durability['caught_stage_failures_preserve_in_progress_model_access_state'] is True
          assert durability['final_result_completed_stages_include_finalize'] is True
          assert m['topology']['stages']==['init','source','quantize','raw-code','finalize']
          assert m['topology']['durable_checkpoint_after_each_completed_stage'] is True
          text=script.read_text(encoding='utf-8')
          for token in (
              'EXACT_B010_FILE_REACQUISITION_IN_PROGRESS',
              'EXACT_Q4_REGENERATION_IN_PROGRESS',
              'RAW_CODE_EXECUTION_IN_PROGRESS',
              'EXACT_Q4_REGENERATED_VERIFIED',
              'RAW_CODE_EXECUTION_COMPLETE',
              '"completed_stages": list(STAGES)',
              '_require_same_main(repo_root, state)',
          ):
              assert token in text, token
          PY

      - name: Focused staged-recovery contracts
        run: PYTHONPATH=colab python -m pytest -q tests/contract/test_b012_qwen_staged_recovery_topology.py

      - name: Canonical schema validation
        run: python -m mstr_qualify validate

      - name: Ruff lint
        run: python -m ruff check .

      - name: Changed-file Ruff format
        run: python -m ruff format --check colab/mstr_b012_qwen_raw_code_recovery_staged.py tests/contract/test_b012_qwen_staged_recovery_topology.py

      - name: Full pytest
        run: python -m pytest -q

      - name: Mypy
        run: python -m mypy src/mstr_qualify

      - name: Repository formatter no-regression
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m ruff format --check --diff . > /tmp/head-format.diff 2>&1
          code=$?
          set -e
          echo "head_formatter_exit=$code"
          test "$code" -eq 1
          python - <<'PY'
          from pathlib import Path
          def paths(path):
              out=set()
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.startswith('--- '):
                      out.add(line[4:].split(':cell ',1)[0])
              return out
          base=paths('/tmp/base-format.diff')
          head=paths('/tmp/head-format.diff')
          assert base, 'canonical formatter debt baseline unexpectedly empty'
          new=head-base
          assert not new, f'new formatter debt introduced: {sorted(new)}'
          PY

      - name: Final immutable live guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/fix/b012-qwen-staged-recovery-topology | cut -f1)" = "$HEAD"
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
            mergeable=$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' /tmp/pr-final.json)
            [[ "$mergeable" != unknown ]] && break
            sleep 2
          done
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==5' /tmp/pr-final.json >/dev/null
          echo 'PR194_QUALIFICATION_V5=PASS'
