name: B029 exact-main entry gate v2

on:
  push:
    branches:
      - evidence/b029-entry-1179515-v2

permissions:
  contents: read

env:
  CANONICAL_MAIN: 1179515986ee2311ec1cd675fd899a6143c03761

jobs:
  eligible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove exact canonical main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_MAIN"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
          test -z "$(git status --porcelain)"
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Prove clean drift and B029 eligibility
        run: |
          set -euo pipefail
          mstr-qualify task drift > /tmp/drift.json
          mstr-qualify task eligible B029 > /tmp/b029.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/drift.json', encoding='utf-8'))
          e=json.load(open('/tmp/b029.json', encoding='utf-8'))
          assert d['status']=='clean' and d['findings']==[], d
          assert e['task_id']=='B029', e
          assert e['canonical_main']=='1179515986ee2311ec1cd675fd899a6143c03761', e
          assert e['eligible'] is True, e
          assert e['reasons'] == [], e
          assert e['authority_result']['required'] is False, e
          assert e['authority_result']['satisfied'] is True, e
          assert e['authority_result']['reasons'] == [], e
          assert e['candidate_pool_result']['required'] is False, e
          assert e['candidate_pool_result']['satisfied'] is True, e
          assert e['candidate_pool_result']['reasons'] == [], e
          assert all(row['satisfied'] is True for row in e['prerequisite_results']), e
          assert {row['task_id'] for row in e['prerequisite_results']} == {'A005','A006','A008','A010','B020'}, e
          assert e['state_consistency_result']['observed_state'] == 'PENDING', e
          assert e['state_consistency_result']['satisfied'] is True, e
          assert e['supersession_result']['superseded'] is False, e
          assert e['supersession_result']['satisfied'] is True, e
          print('B029_ENTRY_GATE=PASS')
          PY
      - name: Final immutable recheck
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
          test "$(git rev-parse HEAD)" = "$CANONICAL_MAIN"
          echo 'B029_ENTRY_IMMUTABLE=PASS'
