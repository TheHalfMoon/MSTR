name: PR182 B012 topology repair qualification

on:
  push:
    branches:
      - evidence/pr182-b012-topology-qualification-1233edd

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: 4e72c3e1a4e196ad67d932c71c896511968da08e
      SUBJECT_BRANCH: fix/b012-stage-checkpoint-topology-repair
      SUBJECT_SHA: 1233edd9f5b58a8117eb06c4d8a98bee2dad0310
      SUBJECT_TREE: 460b2e726647f73c33da26fae95e4e4897193999
      STAGED_SHA256: c1c44fe92fd22b9ae74a1d0d83d50d26b75161b6ddbfffd29d17958bf5c1b6e4
      CANDIDATE_WORKFLOW_SHA256: 383cae4a3729045b9d5a5b2e23ef3430a410070fceefc507b78eaaeaf0232f29
      REPAIR_SHA256: e39caea0f3600a287ae004cd2148f76d75232d85bca802e602609b59d6b266ce
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Prove exact base subject tree and four-file containment
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            "artifacts/manifests/B012-runner-shutdown-topology-repair.json"
            "colab/mstr_b012_staged.py"
            "configs/workflows/b012-qualify-staged.yml"
            "tests/contract/test_b012_stage_checkpoint_topology.py"
          )
          [[ "${#changed[@]}" -eq 4 ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- .github/workflows/b012-qualify.yml
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- artifacts/manifests/B012-executor-toolchain-binding.json

      - name: Reverify B012 machine eligibility on actual canonical main
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligibility.json
          python - <<'PY'
          import json, os
          data = json.load(open('/tmp/b012-eligibility.json', encoding='utf-8'))
          assert data['task_id'] == 'B012'
          assert data['canonical_main'] == os.environ['BASE_SHA']
          assert data['eligible'] is True
          assert data['authority_result']['satisfied'] is True
          assert data['state_consistency_result']['observed_state'] == 'PENDING'
          PY
          git checkout --detach "$SUBJECT_SHA"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]

      - name: Verify repair digests and inert activation boundary
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$STAGED_SHA256" colab/mstr_b012_staged.py | sha256sum -c -
          printf '%s  %s\n' "$CANDIDATE_WORKFLOW_SHA256" configs/workflows/b012-qualify-staged.yml | sha256sum -c -
          printf '%s  %s\n' "$REPAIR_SHA256" artifacts/manifests/B012-runner-shutdown-topology-repair.json | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          binding = json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          repair = json.loads(Path('artifacts/manifests/B012-runner-shutdown-topology-repair.json').read_text())
          assert binding['status'] == 'BLOCKED_PENDING_RUNNER_SHUTDOWN_TOPOLOGY_REPAIR'
          assert 'runner_shutdown_topology_repair_manifest_sha256' not in binding
          assert repair['activation_state'] == 'INERT_UNTIL_SEPARATE_CANONICAL_BINDING_ACTIVATION'
          assert repair['recovery_semantics']['retry_authority_created'] is False
          assert repair['recovery_semantics']['external_dispatch_authority_created'] is False
          assert repair['model_execution_performed_by_repair'] is False
          assert repair['model_access_performed_by_repair'] is False
          assert repair['training_performed_by_repair'] is False
          assert repair['paid_cost_usd'] == 0.0
          PY

      - name: Run focused topology and preserved B012 contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m py_compile colab/mstr_b012_staged.py
          python -m mstr_qualify validate

      - name: Run full quality gate
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check colab/mstr_b012_staged.py tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mypy src/mstr_qualify

      - name: Final live subject and canonical-main guard
        run: |
          set -euo pipefail
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          echo 'PR182_QUALIFICATION=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
