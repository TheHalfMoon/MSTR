name: A004 closeout exact-head gates

on:
  push:
    branches:
      - evidence/a004-closeout-c91d603-gates

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: c91d603ab3175260348706b3f879b86900511510
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact closeout head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "TARGET_HEAD=$(git rev-parse HEAD)"
          test -z "$(git status --short)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project development tooling
        run: python -m pip install -e '.[dev]'

      - name: Frozen gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check src tests
          mypy
          python -m mstr_qualify validate
