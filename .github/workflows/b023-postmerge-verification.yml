name: Post-merge verification for B023 verifier-health implementation

on:
  push:
    branches:
      - evidence/b023-postmerge-f71a15f

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN: f71a15f967250c5c523749be9f9f3066feccb902
  EXPECTED_PARENT1: fdca133e53a47b8966faef172812da58503576a0
  EXPECTED_PARENT2: da0480c0eb39e4097cb2d3fd3337a7fc49ab75dc
  EXPECTED_TREE: 097cf6373e918e60f6c20bb81e3b7f28435177d3
  PR_NUMBER: '133'

jobs:
  merge_identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Verify exact implementation merge identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT1"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PARENT2"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg merge "$EXPECTED_MAIN" --arg head "$EXPECTED_PARENT2" '.state == "closed" and .merged == true and .merge_commit_sha == $merge and .head.sha == $head' /tmp/pr.json

  task_frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove canonical drift and pre-closeout frontier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json

          mstr-qualify task eligible B023 > /tmp/b023.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true' /tmp/b023.json

          if mstr-qualify task eligible B024 > /tmp/b024.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING" and (.reasons | index("prerequisite.unsatisfied:B023")) != null' /tmp/b024.json

          if mstr-qualify task eligible B026 > /tmp/b026.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING" and (.reasons | index("prerequisite.unsatisfied:B024")) != null' /tmp/b026.json

          if mstr-qualify task eligible B025 > /tmp/b025.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null' /tmp/b025.json

          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo "B023_POSTMERGE_PENDING_ELIGIBLE=PASS"
          echo "B024_BLOCKED_ON_B023_CLOSEOUT=PASS"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run canonical B023 quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/unit/test_verifier_health.py tests/contract/test_verifier_health_contract.py tests/unit/trajectory/test_trajectory_factory.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  authority_boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Re-prove implementation authority boundary on canonical main
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MODEL_EXECUTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'MODEL_WEIGHT_ACCESS = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'VERIFIER_SUBPROCESS_EXECUTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'NETWORK_EXECUTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'PAID_COMPUTE = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'PRIVATE_USER_DATA_INGESTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'WEIGHT_CHANGING_TRAINING = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  complete:
    needs: [merge_identity, task_frontier, quality, authority_boundary]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Final immutable canonical-main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT1"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PARENT2"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo "B023_POSTMERGE_MAIN=$EXPECTED_MAIN"
          echo "B023_CANONICAL_CLOSEOUT=NOT_YET_DONE"
          echo "MODEL_EXECUTION=NONE"
          echo "WEIGHT_CHANGING_TRAINING=NONE"
