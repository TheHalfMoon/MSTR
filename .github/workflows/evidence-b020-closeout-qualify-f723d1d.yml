name: Qualify exact B020 canonical closeout candidate

on:
  push:
    branches:
      - evidence/b020-closeout-qualify-f723d1d

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN: f5a4892bff6bc20e376efcaa8f554c15ac88bca8
  EXPECTED_HEAD: f723d1d1753cbdf603e9b2fd770f54059c6c63e5
  PR_NUMBER: '82'

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f723d1d1753cbdf603e9b2fd770f54059c6c63e5
          fetch-depth: 0
      - name: Verify exact PR identity and six-file scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_MAIN"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          mapfile -t actual < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' | sort)
          expected=(
            configs/task-gate/mstr-000b.json
            evidence/mstr-000b/B020-difficulty-contract.md
            specs/002-code-model-supremacy-foundation/tasks.md
            tests/contract/test_difficulty_calibration_contract.py
            tests/contract/test_task_gate.py
            tests/integration/test_task_gate_cli.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 6
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          git diff --check "$EXPECTED_MAIN"..."$EXPECTED_HEAD"

  catalog_semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f723d1d1753cbdf603e9b2fd770f54059c6c63e5
          fetch-depth: 0
      - name: Verify only B020 machine state changed
        shell: bash
        run: |
          set -euo pipefail
          git show "$EXPECTED_MAIN:configs/task-gate/mstr-000b.json" > /tmp/base.json
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          base = json.loads(Path('/tmp/base.json').read_text())
          head = json.loads(Path('configs/task-gate/mstr-000b.json').read_text())
          assert base.keys() == head.keys()
          assert base['tasks'].keys() == head['tasks'].keys()
          for task_id in base['tasks']:
              before = base['tasks'][task_id]
              after = head['tasks'][task_id]
              if task_id == 'B020':
                  assert before['canonical_state'] == 'PENDING'
                  assert after['canonical_state'] == 'COMPLETE_CANONICAL'
                  normalized = copy.deepcopy(after)
                  normalized['canonical_state'] = 'PENDING'
                  assert normalized == before
              else:
                  assert after == before, task_id
          base_no_tasks = dict(base)
          head_no_tasks = dict(head)
          base_no_tasks.pop('tasks')
          head_no_tasks.pop('tasks')
          assert head_no_tasks == base_no_tasks
          PY
          grep -F '[x] **B020 Freeze checkpoint-relative difficulty calibration contract.**' specs/002-code-model-supremacy-foundation/tasks.md
          grep -F 'PR #81 / final head `189509470eae10f1080938b0b2b873f375842f35` / merge `f5a4892bff6bc20e376efcaa8f554c15ac88bca8`' specs/002-code-model-supremacy-foundation/tasks.md
          evidence=evidence/mstr-000b/B020-difficulty-contract.md
          grep -Fx 'ENTRY_GATE_TASK = B020' "$evidence"
          grep -Fx 'ENTRY_GATE_CANONICAL_MAIN = ef90e96ba3d4e2c253987d1d104e0de26ce93529' "$evidence"
          grep -Fx 'ENTRY_GATE_RUN = 33198484632' "$evidence"
          grep -Fx 'ENTRY_GATE_JOB = 98941644785' "$evidence"
          grep -Fx 'ENTRY_GATE_ELIGIBLE = true' "$evidence"
          grep -Fx 'ENTRY_GATE_DRIFT = clean' "$evidence"
          grep -F '**State:** COMPLETE_CANONICAL' "$evidence"

  prospective_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f723d1d1753cbdf603e9b2fd770f54059c6c63e5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify prospective drift and task frontier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json
          if mstr-qualify task eligible B020 > /tmp/b020.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.task_id == "B020" and .eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and .authority_result.required == false and (.reasons | index("task.already_terminal") != null)' /tmp/b020.json
          mstr-qualify task eligible B021 > /tmp/b021.json
          jq -e '.task_id == "B021" and .eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and (.reasons | length) == 0' /tmp/b021.json
          mstr-qualify task eligible B022 > /tmp/b022.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false' /tmp/b022.json
          mstr-qualify task eligible B025 > /tmp/b025.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false' /tmp/b025.json
          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  full_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f723d1d1753cbdf603e9b2fd770f54059c6c63e5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused and frozen full quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_difficulty_calibration_contract.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: [identity_scope, catalog_semantics, prospective_gate, full_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b020-closeout-qualify-f723d1d
          fetch-depth: 0
      - name: Final immutable main, head, and PR check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/docs/000b-b020-canonicalize-v2 | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
