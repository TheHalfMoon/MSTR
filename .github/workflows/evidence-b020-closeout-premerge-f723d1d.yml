name: Mandatory premerge verification for exact B020 closeout

on:
  push:
    branches:
      - evidence/b020-closeout-premerge-f723d1d

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN: f5a4892bff6bc20e376efcaa8f554c15ac88bca8
  EXPECTED_HEAD: f723d1d1753cbdf603e9b2fd770f54059c6c63e5
  PR_NUMBER: '82'
  REVIEW_ID: '5056976741'

jobs:
  pr_scope_review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f723d1d1753cbdf603e9b2fd770f54059c6c63e5
          fetch-depth: 0
      - name: Verify exact PR, scope, review, and threads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_MAIN"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.changed_files' <<<"$pr")" -eq 6
          reviews=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews")
          jq -e --argjson id "$REVIEW_ID" --arg head "$EXPECTED_HEAD" '.[] | select(.id == $id and .state == "COMMENTED" and .commit_id == $head)' <<<"$reviews" >/dev/null
          query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}'
          threads=$(gh api graphql -f query="$query" -F owner='TheHalfMoon' -F name='MSTR' -F number="$PR_NUMBER")
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0' <<<"$threads"
          git diff --check "$EXPECTED_MAIN"..."$EXPECTED_HEAD"

  prospective_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f723d1d1753cbdf603e9b2fd770f54059c6c63e5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-prove prospective drift and authority frontier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json
          if mstr-qualify task eligible B020 > /tmp/b020.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal") != null)' /tmp/b020.json
          mstr-qualify task eligible B021 > /tmp/b021.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false' /tmp/b021.json
          mstr-qualify task eligible B022 > /tmp/b022.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false' /tmp/b022.json
          mstr-qualify task eligible B025 > /tmp/b025.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false' /tmp/b025.json
          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  full_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f723d1d1753cbdf603e9b2fd770f54059c6c63e5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact-head closeout quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_difficulty_calibration_contract.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: [pr_scope_review, prospective_gate, full_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b020-closeout-premerge-f723d1d
          fetch-depth: 0
      - name: Final immutable main, closeout head, and PR check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/docs/000b-b020-canonicalize-v2 | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
