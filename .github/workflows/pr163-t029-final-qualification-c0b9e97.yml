name: Qualify PR163 T029 final exact head

on:
  push:
    branches:
      - evidence/pr163-t029-final-qualification-c0b9e97

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  EXPECTED_MAIN: 5cadbd754686ebff6f5327e9746f0b074b35e318
  TARGET_HEAD: c0b9e977dedf38282872e469aa364dae8e5abf50
  TARGET_TREE: 15fb0a0088e1be09d1071c960dbea1fd91df5cb5
  TARGET_BRANCH: fix/000-t029-recovery-current-main
  PR_NUMBER: '163'
  QWEN_ARTIFACT_ID: '9603552151'
  QWEN_ARCHIVE_SHA256: 69a78e2185337b58940b2dc3ab993d182fa9be9f3eaad95fa43a5bf682f9e4a3
  QWEN_REPORT_SHA256: aad35a2f4db1aff3f2a436a7b98d03a92def063067fc9f294d4a0fcabd8f5d61
  QWEN_Q4KS_SHA256: a6fe3727940dde3382e2f2a353a51bc2e6970d4e660260428899c29c8e4583e9
  MINISTRAL_RUN_ID: '33263175072'
  MINISTRAL_JOB_ID: '99232907513'
  MINISTRAL_ARTIFACT_ID: '9729481097'
  MINISTRAL_ARCHIVE_SHA256: 2ee155799e1e163cd1c0c90290fec2ce7f1a621dbc6f93960cd620c956a006c5
  MINISTRAL_REPORT_SHA256: 120dfabdc328bb7f2adceffd534c651edef57d6dfb9f5dbf0add627f1364b194

jobs:
  identity_scope:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact live identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_HEAD"
          python - <<'PY'
          import json
          import os
          import urllib.request
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              'https://api.github.com/repos/TheHalfMoon/MSTR/pulls/163',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
              },
          )
          with urllib.request.urlopen(req) as response:
              pr = json.load(response)
          assert pr['state'] == 'open'
          assert pr['draft'] is False
          assert pr['base']['ref'] == 'main'
          assert pr['base']['sha'] == os.environ['EXPECTED_MAIN']
          assert pr['head']['ref'] == os.environ['TARGET_BRANCH']
          assert pr['head']['sha'] == os.environ['TARGET_HEAD']
          assert pr['changed_files'] == 9
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Verify topology tree and exact nine-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$EXPECTED_MAIN" "$TARGET_HEAD")" = "$EXPECTED_MAIN"
          git diff --check "$EXPECTED_MAIN" "$TARGET_HEAD"
          git diff --name-only "$EXPECTED_MAIN" "$TARGET_HEAD" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/t029-quantize.yml
          artifacts/manifests/quantization/T029-ministral-recovery-provenance.json
          artifacts/manifests/quantization/T029-q4-profiles.json
          artifacts/manifests/quantization/T029-qwen3.5-2b-historical-provenance.json
          colab/mstr_t029_quantize.py
          evidence/T029-q4-profiles.md
          evidence/T029-runner-recovery.md
          tests/contract/test_t029_quantization_manifest.py
          tests/unit/test_t029_quantize_runner.py
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test ! -e artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json
          test -z "$(git diff --name-only "$EXPECTED_MAIN" "$TARGET_HEAD" -- configs/task-gate artifacts/authorities docs/canonical/CURRENT_STATE.md specs/002-code-model-supremacy-foundation/tasks.md)"

  primary_artifacts_semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Download and verify Qwen and Ministral primary artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/qwen /tmp/ministral
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/TheHalfMoon/MSTR/actions/artifacts/$QWEN_ARTIFACT_ID/zip" \
            -o /tmp/qwen.zip
          test "$(sha256sum /tmp/qwen.zip | cut -d' ' -f1)" = "$QWEN_ARCHIVE_SHA256"
          unzip -q /tmp/qwen.zip -d /tmp/qwen
          test "$(sha256sum /tmp/qwen/t029-qwen3.5-2b.json | cut -d' ' -f1)" = "$QWEN_REPORT_SHA256"

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/TheHalfMoon/MSTR/actions/artifacts/$MINISTRAL_ARTIFACT_ID/zip" \
            -o /tmp/ministral.zip
          test "$(sha256sum /tmp/ministral.zip | cut -d' ' -f1)" = "$MINISTRAL_ARCHIVE_SHA256"
          unzip -q /tmp/ministral.zip -d /tmp/ministral
          test "$(sha256sum /tmp/ministral/t029-ministral-3-3b.json | cut -d' ' -f1)" = "$MINISTRAL_REPORT_SHA256"
      - name: Verify historical run/job truth and reconciled semantics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
          }
          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          qwen_run = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/32959707029')
          assert qwen_run['conclusion'] == 'success'
          qwen_jobs = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/32959707029/jobs')['jobs']
          qwen_job = next(job for job in qwen_jobs if job['id'] == 98149126772)
          assert qwen_job['conclusion'] == 'success'

          ministral_run = get(
              f"https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/{os.environ['MINISTRAL_RUN_ID']}"
          )
          assert ministral_run['conclusion'] == 'failure'
          ministral_jobs = get(
              f"https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/{os.environ['MINISTRAL_RUN_ID']}/jobs"
          )['jobs']
          ministral_job = next(
              job for job in ministral_jobs if str(job['id']) == os.environ['MINISTRAL_JOB_ID']
          )
          assert ministral_job['conclusion'] == 'success'

          qwen_report = json.loads(Path('/tmp/qwen/t029-qwen3.5-2b.json').read_text())
          ministral_report = json.loads(Path('/tmp/ministral/t029-ministral-3-3b.json').read_text())
          manifest = json.loads(
              Path('artifacts/manifests/quantization/T029-q4-profiles.json').read_text()
          )
          qwen_prov = json.loads(
              Path('artifacts/manifests/quantization/T029-qwen3.5-2b-historical-provenance.json').read_text()
          )
          ministral_prov = json.loads(
              Path('artifacts/manifests/quantization/T029-ministral-recovery-provenance.json').read_text()
          )

          expected = {
              'granite-4.1-3b', 'ministral-3-3b', 'qwen2.5-coder-1.5b',
              'qwen3-4b', 'qwen3.5-2b', 'qwen3.5-4b', 'smollm3-3b',
              'yi-coder-1.5b',
          }
          profiles = manifest['profiles']
          assert {profile['candidate_id'] for profile in profiles} == expected
          assert len(profiles) == 8
          assert manifest['pending'] == []
          assert manifest['completion_state'] == 'Q4_PROFILE_SET_READY_NOT_T029_COMPLETE_CANONICAL'
          assert all(profile['result_classification'] == 'Q4_PROFILE_READY' for profile in profiles)
          for profile in profiles:
              assert len(profile['f16_sha256']) == 64
              for arm in profile['quantization_arms'].values():
                  assert len(arm['output_sha256']) == 64
                  assert arm['output_size_bytes'] > 0

          qwen = next(profile for profile in profiles if profile['candidate_id'] == 'qwen3.5-2b')
          qwen_q4ks = qwen_report['quantization_arms']['Q4_K_S']
          assert qwen_report['result_classification'] == 'Q4_PROFILE_READY'
          assert qwen_q4ks['status'] == 'OK'
          assert qwen_q4ks['output_sha256'] == os.environ['QWEN_Q4KS_SHA256']
          assert len(qwen_q4ks['output_sha256']) == 64
          assert qwen_q4ks['output_sha256'] == qwen['quantization_arms']['Q4_K_S']['output_sha256']
          assert qwen_q4ks['output_size_bytes'] == qwen['quantization_arms']['Q4_K_S']['output_size_bytes']
          assert qwen_prov['q4_k_s_sha256'] == os.environ['QWEN_Q4KS_SHA256']
          assert qwen_prov['q4_k_s_sha256_length'] == 64
          assert qwen_prov['primary_artifact_verdict'] == 'Q4_PROFILE_READY'
          assert qwen_prov['reconciliation_negative_run'] == 33964325389

          ministral = next(profile for profile in profiles if profile['candidate_id'] == 'ministral-3-3b')
          assert ministral_report['result_classification'] == 'Q4_PROFILE_READY'
          assert ministral_prov['workflow_run_conclusion'] == 'failure'
          assert ministral_prov['material_job_conclusion'] == 'success'
          assert ministral_report['conversion']['gguf_f16_sha256'] == ministral['f16_sha256']
          for arm_key in ('Q4_K_M', 'Q4_K_S'):
              report_arm = ministral_report['quantization_arms'][arm_key]
              manifest_arm = ministral['quantization_arms'][arm_key]
              assert report_arm['status'] == 'OK'
              assert report_arm['output_sha256'] == manifest_arm['output_sha256']
              assert report_arm['output_size_bytes'] == manifest_arm['output_size_bytes']

          tasks = Path('specs/000-universal-laptop-interaction-contract/tasks.md').read_text()
          assert '- [ ] T029 [US1]' in tasks
          evidence = Path('evidence/T029-q4-profiles.md').read_text()
          runner_evidence = Path('evidence/T029-runner-recovery.md').read_text()
          assert 'T029_EXECUTION_PROFILE_SET = 8_FULLY_VERIFIED' in evidence
          assert 'T029_FUTURE_REGENERATION_EXECUTION_READY = NO' in evidence
          assert 'T029_COMPLETE_CANONICAL = NO' in evidence
          assert 'T029_Q4_PROFILE_SET = 8_FULLY_VERIFIED' in runner_evidence
          assert 'T029_COMPLETE_CANONICAL = NO' in runner_evidence
          PY
      - name: Verify network and authority fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'UNAUTHORIZED      = arbitrary browsing, package indexes (pypi/npm)' \
            specs/000-universal-laptop-interaction-contract/evidence/T027-weight-access-preflight.md
          grep -F 'pip install numpy torch --index-url https://pypi.org/simple/' .github/workflows/t029-quantize.yml
          grep -F 'git", "clone"' colab/mstr_t029_quantize.py
          grep -F -- '--network-addendum artifacts/manifests/T028-network-scope-addendum.json' .github/workflows/t029-quantize.yml
          test ! -e artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json
          grep -F 'B012_AUTHORITY = NONE' evidence/T029-q4-profiles.md
          grep -F 'K2_AUTHORITY = NONE' evidence/T029-q4-profiles.md

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Focused T029 tests
        run: python -m pytest -q tests/contract/test_t029_quantization_manifest.py tests/unit/test_t029_quantize_runner.py
      - name: Repository validation
        run: mstr-qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy

  final_immutability:
    needs: [identity_scope, primary_artifacts_semantics, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Recheck exact live identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_HEAD"
          python - <<'PY'
          import json
          import os
          import urllib.request
          req = urllib.request.Request(
              'https://api.github.com/repos/TheHalfMoon/MSTR/pulls/163',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
              },
          )
          with urllib.request.urlopen(req) as response:
              pr = json.load(response)
          assert pr['state'] == 'open'
          assert pr['draft'] is False
          assert pr['base']['sha'] == os.environ['EXPECTED_MAIN']
          assert pr['head']['sha'] == os.environ['TARGET_HEAD']
          PY
          echo 'QUALIFICATION=PASS'
