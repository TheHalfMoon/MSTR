name: Post-merge verification for B026 research-ladder implementation

on:
  push:
    branches: [evidence/b026-postmerge-1aed677]

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  EXPECTED_MAIN: 1aed67793fa14e6c9a7bbe4067ad521d16617b26
  EXPECTED_PARENT1: 823cd7ec3b4c537876a0795d0f0f8d4bd75acd85
  EXPECTED_PARENT2: ba672f8eaaa9fe96e9ffdcba39e10f6d4123e421
  EXPECTED_TREE: 1080c3c7b894a2e17a71eae72546316156d816f2
  PR_NUMBER: '137'
  PREMERGE_RUN: '33682188378'
  GH_TOKEN: ${{ github.token }}

jobs:
  merge_identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Verify exact guarded implementation merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT1"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PARENT2"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg merge "$EXPECTED_MAIN" --arg head "$EXPECTED_PARENT2" '
            .state == "closed" and .merged == true and .merge_commit_sha == $merge and
            .head.sha == $head and .commits == 9 and .changed_files == 17
          ' /tmp/pr.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREMERGE_RUN}" > /tmp/premerge.json
          jq -e '.status == "completed" and .conclusion == "success" and (.name | contains("B026 mandatory premerge"))' /tmp/premerge.json

  task_frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Prove canonical drift and pre-closeout frontier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json

          mstr-qualify task eligible B026 > /tmp/b026.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0' /tmp/b026.json

          set +e
          mstr-qualify task eligible B027 > /tmp/b027.json; b027_rc=$?
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_rc=$?
          set -e
          test "$b027_rc" -eq 1
          test "$b011_rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING" and ([.prerequisite_results[] | select(.task_id == "B026" and .observed_state == "PENDING" and .satisfied == false)] | length == 1)' /tmp/b027.json
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo 'B026_POSTMERGE_PENDING_ELIGIBLE=PASS'
          echo 'B027_BLOCKED_ON_B026_CLOSEOUT=PASS'

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run canonical B026 quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/contract/test_research_ladder_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py tests/contract/test_task_gate.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          cmp schemas/mstr-material-result-identity-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-material-result-identity-v0.schema.json
          cmp schemas/mstr-research-experiment-v2.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-research-experiment-v2.schema.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  authority_boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Re-prove implementation authority boundary on canonical main
        shell: bash
        run: |
          set -euo pipefail
          for marker in \
            'MODEL_WEIGHT_ACCESS = NONE' \
            'MODEL_EXECUTION = NONE' \
            'RESEARCH_CAMPAIGN_EXECUTION = NONE' \
            'TEST_GENERATION_EXECUTION = NONE' \
            'VERIFIER_EXECUTION = NONE' \
            'TEACHER_API_EXECUTION = NONE' \
            'PAID_MODEL_API = NONE' \
            'PAID_COMPUTE = NONE' \
            'NETWORK_MODEL_OR_TEACHER_CALL = NONE' \
            'LARGE_DATASET_INGESTION = NONE' \
            'PRIVATE_USER_DATA_INGESTION = NONE' \
            'PRODUCTION_TRACE_INGESTION = NONE' \
            'WEIGHT_CHANGING_TRAINING = NONE' \
            'LARGE_SCALE_RL = NONE' \
            'PRODUCTION_RELEASE = NONE'; do
            grep -F "$marker" evidence/mstr-000b/B026-research-ladder.md
          done
          grep -F -- '- [ ] **B026 Freeze multi-fidelity MSTR Research Ladder v0.**' specs/002-code-model-supremacy-foundation/tasks.md
          test ! -e artifacts/results/q4-promotion
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  complete:
    needs: [merge_identity, task_frontier, quality, authority_boundary]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Final immutable canonical-main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT1"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PARENT2"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo "B026_POSTMERGE_MAIN=$EXPECTED_MAIN"
          echo 'B026_CANONICAL_CLOSEOUT=NOT_YET_DONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
