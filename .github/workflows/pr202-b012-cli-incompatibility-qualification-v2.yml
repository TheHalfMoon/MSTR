name: PR202 B012 CLI incompatibility qualification v2

on:
  push:
    branches:
      - evidence/pr202-b012-cli-incompatibility-qualification-v2-2590b70

permissions:
  contents: read
  actions: read

concurrency:
  group: pr202-b012-cli-incompatibility-qualification-v2
  cancel-in-progress: false

env:
  REPO: TheHalfMoon/MSTR
  PR_NUMBER: '202'
  EXPECTED_MAIN: 66cd090fc75286bfc24db4bdf8fe58b64394e228
  EXPECTED_SUBJECT: 2590b700065f87feb8795941be6a12aa7293b2b4
  FAILED_RUN: '34288154926'
  FAILED_JOB: '102268410928'
  INCIDENT_ENTRY_RUN: '34290864636'
  INCIDENT_SHA256: 20e30ef5382189dc22407df0caaab171668c91863cdf972a66bfd90e4615f03d
  QUALIFICATION_V1_RUN: '34292116627'
  QUALIFICATION_V1_HEAD: bf444b5e13d4eae71451ebbe5b1d296f923daf12
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SUBJECT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove immutable PR, subject, base, and ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$EXPECTED_SUBJECT" --quiet
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          pr_head="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          pr_base="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.base.sha')"
          test "$pr_head" = "$EXPECTED_SUBJECT"
          test "$pr_base" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$EXPECTED_SUBJECT"
          git update-ref refs/heads/main "$EXPECTED_MAIN"

      - name: Prove exact 17-file incident-only scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files <<'EOF'
          artifacts/manifests/B012-executor-toolchain-binding.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-case-failure.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-01-init.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-02-source.json
          artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-03-quantize.json
          artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-one-shot-runtime-cli-incompatibility-run-34288154926.json
          evidence/mstr-000b/B012-qwen-one-shot-runtime-cli-incompatibility-34288154926.md
          tests/contract/test_b012_executor_binding.py
          tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py
          tests/contract/test_b012_qwen_one_shot_runtime_cli_incompatibility_evidence.py
          tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          tests/contract/test_b012_qwen_raw_code_one_shot_topology.py
          tests/contract/test_b012_qwen_raw_code_recovery.py
          tests/contract/test_b012_qwen_staged_recovery_topology.py
          tests/contract/test_b012_runner_shutdown_evidence.py
          tests/contract/test_b012_stage_checkpoint_topology.py
          EOF
          sed -i 's/^          //' /tmp/expected-files
          sort -o /tmp/expected-files /tmp/expected-files
          git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_SUBJECT" | sort > /tmp/actual-files
          test "$(wc -l < /tmp/actual-files)" -eq 17
          diff -u /tmp/expected-files /tmp/actual-files
          test -z "$(git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_SUBJECT" -- colab .github/workflows benchmarks/manifests/B012-raw-code-proxy.json artifacts/manifests/B012-executor-toolchain-lock.json)"

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reprove exact-main B012 eligibility and Founder authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_MAIN"
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['EXPECTED_MAIN']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert all(d['semantic_checks'].values())
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['scope']['candidate_ids']==['mellum-4b','qwen3.5-0.8b-control']
          assert a['scope']['training'] is False
          assert a['scope']['paid_compute'] is False
          assert a['scope']['paid_model_api'] is False
          assert a['cost_resource_ceiling']['limits'][0]['max']==0.0
          PY
          git checkout --detach "$EXPECTED_SUBJECT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT"

      - name: Verify failed run and durable artifact identities
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$FAILED_RUN" > /tmp/run.json
          jq -e --arg head "$EXPECTED_MAIN" '.status=="completed" and .conclusion=="failure" and .run_attempt==1 and .head_sha==$head and .name=="B012 Qwen raw-code one-shot recovery"' /tmp/run.json >/dev/null
          gh api "repos/$REPO/actions/runs/$FAILED_RUN/jobs" > /tmp/jobs.json
          jq -e --argjson job "$FAILED_JOB" '.jobs | length==1 and .[0].id==$job and .[0].conclusion=="failure"' /tmp/jobs.json >/dev/null
          gh api "repos/$REPO/actions/runs/$FAILED_RUN/artifacts" > /tmp/artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/artifacts.json').read_text())
          got={a['id']:(a['name'],a['digest'],a['size_in_bytes']) for a in d['artifacts']}
          expected={
            10080491362:('b012-qwen-raw-code-one-shot-stage-01-init-34288154926','sha256:f9901fa1f59e8a9d1913c2ca794d95735a0ff85753eaaa0e148a592c9c782495',2944),
            10080513976:('b012-qwen-raw-code-one-shot-stage-02-source-34288154926','sha256:ccceafbce9e4414a4d64648d08268cf8fca78d40f097e03c9828a82de8cc53e4',5244),
            10080541374:('b012-qwen-raw-code-one-shot-stage-03-quantize-34288154926','sha256:bff7116601dee3124be48361cc144798944de6fdef74b8a6e25a14e281b1ea8f',6690),
            10080542101:('b012-qwen-raw-code-one-shot-stage-04a-python-clamp-34288154926','sha256:14d67ce0a098d9e59f2b1067ceaa079b0dc082f1f321263f272ba81138ce4168',7649),
          }
          assert got==expected, (got, expected)
          PY
          gh api "repos/$REPO/actions/runs/$INCIDENT_ENTRY_RUN" | jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1' >/dev/null
          gh api "repos/$REPO/actions/runs/$QUALIFICATION_V1_RUN" > /tmp/qualification-v1.json
          jq -e --arg head "$QUALIFICATION_V1_HEAD" '.status=="completed" and .conclusion=="failure" and .run_attempt==1 and .head_sha==$head and .name=="PR202 B012 CLI incompatibility qualification"' /tmp/qualification-v1.json >/dev/null

      - name: Verify exact incident hashes and fail-closed semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('.')
          incident=root/'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-one-shot-runtime-cli-incompatibility-run-34288154926.json'
          failure=root/'artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-case-failure.json'
          state=root/'artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-case-state.json'
          cp1=root/'artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-01-init.json'
          cp2=root/'artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-02-source.json'
          cp3=root/'artifacts/results/equivalent/B012/checkpoints/34288154926/B012-qwen3.5-0.8b-control-raw-code-recovery-checkpoint-03-quantize.json'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(incident)==os.environ['INCIDENT_SHA256']
          assert sha(failure)=='b0aff98dabafd1335b27a771cd74e4cffa9364da3a7d22154db618a7173743ef'
          assert sha(state)=='4c5c6521180b17949d77bdedf2d18c04dfb7f3345dde40db14527ff3b407e3b8'
          assert sha(cp1)=='fb6b5165037691699a36ed53a5d239d500a2818ed230f06932743bfc6072f14f'
          assert sha(cp2)=='d95e154bb519cd89359483f49566ad7bcda05127991bd8b1116d8a250e7e5b58'
          assert sha(cp3)=='0f09abec985a3bb26987f529d86a9d9b1ed6dd2859250700520a81be733322e7'
          i=json.loads(incident.read_text())
          b=json.loads((root/'artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          assert i['failure_classification']=='B012_EXECUTOR_RUNTIME_CLI_INCOMPATIBILITY_RAW_CODE_UNEXECUTED'
          assert i['execution']['durable_raw_code_cases']==[]
          assert i['execution']['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert i['execution']['model_quality_verdict']=='NONE'
          assert i['execution']['candidate_admission_decision']=='NONE'
          assert i['execution']['candidate_execution_completion']=='NOT_PROVEN'
          assert i['execution']['cleanup']=='PROVEN_WORKFLOW_SUCCESS'
          assert i['canonical_effect']['b012_state']=='PENDING'
          assert i['canonical_effect']['b013_opening_authorized'] is False
          assert i['root_cause']['runtime_commit']=='3173a56471c1753650cd806694145ffd6dcace67'
          assert i['root_cause']['runtime_binary']=='llama-cli'
          assert i['root_cause']['parser_example']=='LLAMA_EXAMPLE_CLI'
          assert i['root_cause']['rejected_argument']=='--no-conversation'
          assert i['root_cause']['argument_scope']=='LLAMA_EXAMPLE_COMPLETION_ONLY'
          assert b['status']=='BLOCKED_PENDING_QWEN_RAW_CODE_RUNTIME_CONTRACT_REPAIR'
          x=b['qwen_raw_code_one_shot_runtime_cli_incompatibility']
          assert x['failure_evidence_sha256']==os.environ['INCIDENT_SHA256']
          assert x['same_topology_redispatch_authorized'] is False
          assert x['retry_authority_created'] is False
          assert x['external_dispatch_authority_created'] is False
          assert x['cross_run_resume_authority_created'] is False
          PY
          for f in artifacts/results/equivalent/B012/checkpoints/34288154926/*.json artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-one-shot-runtime-cli-incompatibility-run-34288154926.json; do python -m json.tool "$f" >/dev/null; done

      - name: Run focused B012 contracts
        run: python -m pytest tests/contract/test_b012*.py -q

      - name: Run Ruff lint and format checks
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m ruff format --check .

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Run mypy
        run: python -m mypy src tests

      - name: Final immutable qualification guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')" = "$EXPECTED_SUBJECT"
          test "$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.base.sha')" = "$EXPECTED_MAIN"
          echo 'PR202_B012_CLI_INCOMPATIBILITY_QUALIFICATION_V2=PASS'
          echo 'MODEL_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'PAID_COST_USD=0.0'
