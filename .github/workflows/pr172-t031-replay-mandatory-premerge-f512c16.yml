name: PR172 T031 replay mandatory premerge

on:
  push:
    branches:
      - evidence/pr172-t031-replay-mandatory-premerge-f512c16

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  REPO: TheHalfMoon/MSTR
  PR_NUMBER: "172"
  BASE_SHA: 119a9bcca1c97b9edbcacd6d8d457b31206bb162
  TARGET_HEAD: f512c166f9dd7ed04dc88bdf097eaa59f3754d2c
  TARGET_TREE: 28e985a23668ec40098a8f9436b8db5172dfb1c6
  QUALIFICATION_RUN: "34033216978"
  QUALIFICATION_HEAD: 9ff2c3a275313256163eab714b34d84e8f1aebf6
  QUALIFICATION_BRANCH: evidence/pr172-t031-replay-qualification-f512c16
  REVIEW_RUN: "34033438680"
  REVIEW_HEAD: 8dbef715a23ec873d82d785dcae7fc9929d7ae51
  REVIEW_BRANCH: evidence/pr172-t031-replay-independent-review-f512c16
  REVIEW_SUBMISSION: "5125316526"

jobs:
  evidence_and_live_state:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact refs scope qualification review threads and repository rules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$BASE_SHA" "$TARGET_HEAD")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/fix/t031-t029-producer-replay | awk '{print $1}')" = "$TARGET_HEAD"
          git diff --check "$BASE_SHA...$TARGET_HEAD"
          cat > /tmp/expected <<'EOF'
          .github/workflows/t031-measure.yml
          artifacts/manifests/T031-executor-toolchain-binding.json
          artifacts/manifests/T031-t029-producer-replay-overlay.json
          artifacts/results/local/T031/failures/T031-granite-4.1-3b-run-33999224131.json
          colab/mstr_t031_execute.py
          colab/mstr_t031_governance.py
          colab/mstr_t031_replay.py
          evidence/T031-first-execution-failure-and-replay-repair.md
          tests/contract/test_t031_executor_binding.py
          EOF
          sort /tmp/expected -o /tmp/expected
          git diff --name-only "$BASE_SHA...$TARGET_HEAD" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          q=get(f'actions/runs/{os.environ["QUALIFICATION_RUN"]}')
          assert q['status']=='completed' and q['conclusion']=='success',q
          assert q['head_sha']==os.environ['QUALIFICATION_HEAD'] and q['head_branch']==os.environ['QUALIFICATION_BRANCH']
          r=get(f'actions/runs/{os.environ["REVIEW_RUN"]}')
          assert r['status']=='completed' and r['conclusion']=='success',r
          assert r['head_sha']==os.environ['REVIEW_HEAD'] and r['head_branch']==os.environ['REVIEW_BRANCH']
          review=get(f'pulls/{os.environ["PR_NUMBER"]}/reviews/{os.environ["REVIEW_SUBMISSION"]}')
          assert review['commit_id']==os.environ['TARGET_HEAD'],review
          assert review['state']=='COMMENTED',review
          body=review.get('body') or ''
          assert 'Findings: NONE' in body
          assert os.environ['QUALIFICATION_RUN'] in body and os.environ['REVIEW_RUN'] in body
          reviews=get(f'pulls/{os.environ["PR_NUMBER"]}/reviews?per_page=100')
          assert not any(x.get('state')=='CHANGES_REQUESTED' for x in reviews),reviews
          pr=get(f'pulls/{os.environ["PR_NUMBER"]}')
          assert pr['state']=='open' and pr['head']['sha']==os.environ['TARGET_HEAD'] and pr['base']['sha']==os.environ['BASE_SHA'],pr
          PY
          test "$(git ls-remote origin refs/heads/$QUALIFICATION_BRANCH | awk '{print $1}')" = "$QUALIFICATION_HEAD"
          test "$(git ls-remote origin refs/heads/$REVIEW_BRANCH | awk '{print $1}')" = "$REVIEW_HEAD"
          query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}'
          payload="$(python - "$query" <<'PY'
          import json,sys
          print(json.dumps({'query':sys.argv[1],'variables':{'owner':'TheHalfMoon','name':'MSTR','number':172}}))
          PY
          )"
          threads="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' https://api.github.com/graphql -d "$payload")"
          python - "$threads" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1]); assert not data.get('errors'),data.get('errors')
          nodes=data['data']['repository']['pullRequest']['reviewThreads']['nodes']
          assert all(x['isResolved'] for x in nodes),nodes
          PY
          branch="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/branches/main")"
          rulesets="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/rulesets")"
          python - "$branch" "$rulesets" <<'PY'
          import json,sys
          branch=json.loads(sys.argv[1]); rules=json.loads(sys.argv[2])
          assert branch['commit']['sha']=='119a9bcca1c97b9edbcacd6d8d457b31206bb162'
          assert branch['protected'] is False
          assert rules==[]
          PY
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Re-run mandatory premerge quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check colab/mstr_t031_replay.py colab/mstr_t031_execute.py colab/mstr_t031_governance.py tests/contract/test_t031_executor_binding.py
          python -m mypy src/mstr_qualify
          git diff --check "$BASE_SHA...$TARGET_HEAD"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"

  final_premerge:
    needs: [evidence_and_live_state, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Guard expected head immediately before merge authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/branches/main" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")"
          pr_head="$(python - "$pr_json" <<'PY'
          import json,sys
          print(json.loads(sys.argv[1])['head']['sha'])
          PY
          )"
          pr_base="$(python - "$pr_json" <<'PY'
          import json,sys
          print(json.loads(sys.argv[1])['base']['sha'])
          PY
          )"
          test "$main_sha" = "$BASE_SHA"
          test "$pr_base" = "$BASE_SHA"
          test "$pr_head" = "$TARGET_HEAD"
          echo 'PREMERGE_VERDICT=PASS'
          echo "AUTHORIZED_EXPECTED_HEAD=$TARGET_HEAD"
          echo "AUTHORIZED_EXPECTED_BASE=$BASE_SHA"
          echo "QUALIFICATION_RUN=$QUALIFICATION_RUN"
          echo "REVIEW_RUN=$REVIEW_RUN"
          echo "REVIEW_SUBMISSION=$REVIEW_SUBMISSION"
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
