## Rights-gate interpretation

The production rights evaluator does not treat `pass_conditional` as primary admission. Any unknown required right, account/clickthrough gate, downstream separate-license burden, or nonempty field/scale restriction produces `eligible_for_primary=false`. B006 follows that evaluator mechanically; technical attractiveness never overrides rights evidence.

