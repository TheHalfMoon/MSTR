Both snapshots used public Hugging Face JSON metadata only and explicitly performed no model-weight access, tokenizer download, gated-term acceptance, or model execution.

## External legal/source observations

- BigCode CodeML OpenRAIL-M: distribution requires use-based restrictions to be carried as enforceable downstream provisions.
- Stability AI Community License in the exact Stable Code revision is dated 2024-07-05 and conditions free commercial use on under USD 1M annual revenue; it also imposes downstream/AUP restrictions.
- Google CodeGemma public metadata is manually gated and points to Gemma Terms.
- Falcon-H1 metadata points to Falcon terms whose currently linked first license defines the Work as Falcon 2 11B; B006 therefore does not infer H1 rights.
- Liquid LFM Open License v1.0 grants broad derivative rights but ends free commercial rights at the USD 10M annual-revenue threshold.
- Microsoft BitNet declares MIT for model weights/code, but the model card separately identifies the tokenizer as the LLaMA 3 tokenizer; FR-016 requires separate component confidence, so B006 blocks primary rights without downloading or accepting anything.

## Reconciliation decisions

### Qwen3.5 Base provenance
The exact 2B/4B/0.8B Base repositories contain repository-specific language saying they are the pre-trained-only models. B006 treats the broad “Training Stage: Pre-training & Post-training” text as family/model-overview wording rather than contradictory checkpoint provenance. This preserves the exact Base checkpoint classification while recording the ambiguity.

### Yi-Coder parameter identity
The pinned HF metadata API reports `1,476,495,360` serialized parameters. The earlier `1,480,000,000` record was a rounded estimate and is corrected. The public `Yi-Coder-1.5B-Chat` sibling remains distinct from `Yi-Coder-1.5B`, supporting the existing control role for the plain checkpoint.

### Ministral parameter accounting
