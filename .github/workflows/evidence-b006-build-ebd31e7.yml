## Scope and authority

B006 converts the nine `newly_relevant_for_b006` rows and four mandatory revalidation rows from the canonical B005 discovery manifest into candidate-record classifications. It does not acquire, resolve, download, execute, fine-tune, quantize, or admit model/tokenizer weights. GLM-5.3-Flash and Kimi-K2-Base remain outside B006 qualification because B005 screened them out on universal-laptop product scale.

