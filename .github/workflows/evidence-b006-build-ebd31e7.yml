      - name: Install candidate tooling and validate schema/rights
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from mstr_qualify.rights import evaluate_component_rights

          schema=json.loads(Path('schemas/candidate-record.schema.json').read_text(encoding='utf-8'))
          validator=Draft202012Validator(schema)
          new_files=[
              'mellum-4b.json','starcoder2-3b-reference.json','stable-code-3b-reference.json','codegemma-2b-reference.json',
              'falcon-h1-3b-legal-review.json','bitnet-b1.58-2b4t-control.json','lfm2.5-2.6b-reference.json','lfm2.5-1.2b-reference.json','qwen3.5-0.8b-control.json',
              'qwen3.5-2b.json','qwen3.5-4b.json','yi-coder-1.5b.json','ministral-3-3b.json',
          ]
          expected_pass={'mellum-4b','qwen3.5-0.8b-control','qwen3.5-2b','qwen3.5-4b','yi-coder-1.5b','ministral-3-3b'}
          expected_fail={'starcoder2-3b-reference','stable-code-3b-reference','codegemma-2b-reference','falcon-h1-3b-legal-review','bitnet-b1.58-2b4t-control','lfm2.5-2.6b-reference','lfm2.5-1.2b-reference'}
          seen=set()
          for name in new_files:
              data=json.loads((Path('artifacts/candidates')/name).read_text(encoding='utf-8'))
              validator.validate(data)
              result=evaluate_component_rights(data['candidate_id'],data['rights'])
              seen.add(data['candidate_id'])
              if data['candidate_id'] in expected_pass:
                  assert result.eligible_for_primary and result.computed_decision=='pass_permissive', (name,result)
              elif data['candidate_id'] in expected_fail:
                  assert not result.eligible_for_primary and result.computed_decision=='fail' and result.reason_codes, (name,result)
              else:
                  raise AssertionError(('unexpected candidate',data['candidate_id']))
          assert seen == expected_pass | expected_fail, (seen, expected_pass | expected_fail)
          assert json.loads(Path('artifacts/candidates/yi-coder-1.5b.json').read_text())['architecture']['parameter_count_total']==1476495360
          print('B006_SCHEMA_AND_RIGHTS=PASS')
          PY
