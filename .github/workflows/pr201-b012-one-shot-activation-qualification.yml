name: PR201 B012 one-shot activation qualification

on:
  push:
    branches:
      - evidence/pr201-b012-one-shot-activation-qualification-1f203ad

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 04096a180e47ed8f81ee81c1bf3d9e471be607fc
      HEAD: 1f203ad7087d3ef28f9b24f23909a2a10eaada96
      TREE: f02010637016ac4b12ee3112b9fe7fb221ab98fd
      PR: '201'
      SUBJECT_BRANCH: fix/b012-qwen-raw-code-one-shot-activation
      REPAIR_POSTMERGE_RUN: '34282489164'
      REPAIR_POSTMERGE_EVIDENCE_HEAD: 3618b69ab145f5ed4d18502ca5064812aa6081cd
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact activation subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove exact identities ancestry and repair prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          git fetch origin main "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$SUBJECT_BRANCH)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          gh api "repos/$REPO/actions/runs/$REPAIR_POSTMERGE_RUN" > /tmp/postmerge.json
          jq -e --arg head "$REPAIR_POSTMERGE_EVIDENCE_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' /tmp/postmerge.json >/dev/null

      - name: Prove live PR identity and exact thirteen-file scope
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
            mergeable=$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' /tmp/pr.json)
            [[ "$mergeable" != unknown ]] && break
            sleep 2
          done
          jq '{state,draft,mergeable,mergeable_state,base:.base.sha,head:.head.sha,changed_files}' /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==13' /tmp/pr.json >/dev/null
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            '.github/workflows/b012-qwen-raw-code-recovery.yml'
            'artifacts/manifests/B012-executor-toolchain-binding.json'
            'artifacts/manifests/B012-qwen-raw-code-one-shot-topology-repair.json'
            'evidence/mstr-000b/B012-qwen-one-shot-mode-activation.md'
            'tests/contract/test_b012_executor_binding.py'
            'tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py'
            'tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py'
            'tests/contract/test_b012_qwen_raw_code_one_shot_topology.py'
            'tests/contract/test_b012_qwen_raw_code_one_shot_workflow.py'
            'tests/contract/test_b012_qwen_raw_code_recovery.py'
            'tests/contract/test_b012_qwen_staged_recovery_topology.py'
            'tests/contract/test_b012_runner_shutdown_evidence.py'
            'tests/contract/test_b012_stage_checkpoint_topology.py'
          )
          [[ ${#actual[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done
          git diff --check "$BASE...$HEAD"

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Exact-main B012 eligibility and Founder authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert all(d['semantic_checks'].values())
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL'
          assert a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert a['task_id']=='B012'
          assert a['cost_resource_ceiling']['limits'][0]['max']==0.0
          PY
          git checkout --detach "$HEAD"

      - name: Prove exact one-shot activation binding and supersession semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          manifest_path=Path('artifacts/manifests/B012-qwen-raw-code-one-shot-topology-repair.json')
          binding_path=Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          active=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          spec=Path('configs/workflows/b012-qwen-raw-code-one-shot-recovery.yml')
          wrapper=Path('colab/mstr_b012_qwen_raw_code_one_shot.py')
          helper=Path('colab/mstr_b012_raw_code_one_shot.py')
          case_spec=Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          b=json.loads(binding_path.read_text(encoding='utf-8'))
          a=m['activation']
          bound=b['qwen_raw_code_one_shot_activation']
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['task_id']=='B012' and m['candidate_id']=='qwen3.5-0.8b-control'
          assert m['prior_qualification_run_id']==34155931982
          assert m['triggering_incident']['run_id']==34265475666
          assert a['activation_base_main']==os.environ['BASE']
          assert a['repair_package_merge_commit']==os.environ['BASE']
          assert a['repair_package_postmerge_run_id']==int(os.environ['REPAIR_POSTMERGE_RUN'])
          assert a['repair_package_postmerge_evidence_head']==os.environ['REPAIR_POSTMERGE_EVIDENCE_HEAD']
          assert a['active_workflow_materialized'] is True
          assert a['activation_repository_change_only'] is True
          assert a['activation_is_separate_repository_change'] is True
          assert a['package_performs_model_access'] is False
          assert a['package_performs_model_execution'] is False
          assert active.read_bytes()==spec.read_bytes()
          assert sha(active)=='9dd880bf058a41e54b87340445e45df72b41c84149f70571c36ca8284bd7da8a'
          assert sha(wrapper)=='59566e753b50b019398fa99dfc3ddbb9387850056587fc3940bf52842edb6b82'
          assert sha(helper)=='46d0b9560ebb5b97e266c64380b97b251fff543359839503bf6145b36e84aa03'
          assert sha(manifest_path)=='e3b0983f4d20809f0b8b125b16791b2b6d826d586f4c5f1b083e0a993c6f7126'
          assert sha(case_spec)=='f15941577213c5e96a1ebb3993989693628eae5f2e28620f90e03110d303d127'
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          assert bound['repair_id']==m['repair_id']
          assert bound['candidate_id']=='qwen3.5-0.8b-control'
          assert bound['prior_qualification_run_id']==34155931982
          assert bound['triggering_incident_run_id']==34265475666
          assert bound['repair_manifest_sha256']==sha(manifest_path)
          assert bound['one_shot_script_sha256']==sha(wrapper)
          assert bound['one_shot_raw_code_helper_sha256']==sha(helper)
          assert bound['active_workflow_sha256']==sha(active)
          assert bound['activation_base_main']==os.environ['BASE']
          assert bound['repair_package_merge_commit']==os.environ['BASE']
          assert bound['repair_package_postmerge_run_id']==int(os.environ['REPAIR_POSTMERGE_RUN'])
          assert bound['repair_package_postmerge_evidence_head']==os.environ['REPAIR_POSTMERGE_EVIDENCE_HEAD']
          for key in ('retry_authority_created','external_dispatch_authority_created','cross_run_resume_authority_created','candidate_expansion','revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert bound[key] is False, key
          assert bound['model_access']=='NONE'
          assert bound['model_execution']=='NONE'
          assert bound['paid_cost_usd']==0.0
          text=active.read_text(encoding='utf-8')
          assert "github.event.issue.number == 162" in text
          assert "github.event.comment.user.login == 'TheHalfMoon'" in text
          assert "github.event.comment.author_association == 'OWNER'" in text
          assert "github.event.comment.body == 'B012_RECOVER_RAW_CODE_ONE_SHOT qwen3.5-0.8b-control 34155931982'" in text
          assert '--no-conversation' in Path('colab/mstr_b012_raw_code_one_shot.py').read_text(encoding='utf-8')
          assert 'B012_RECOVER_RAW_CODE_CASE_CHECKPOINT' not in text
          assert text.count('actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02')==7
          assert text.count('retention-days: 7')==7
          assert '.gguf' not in text and '.safetensors' not in text
          PY

      - name: Focused activation contracts
        run: |
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_topology.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_workflow.py

      - name: Canonical schema validation
        run: python -m mstr_qualify validate

      - name: Ruff lint
        run: python -m ruff check .

      - name: Changed Python Ruff format
        run: |
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_case_checkpoint_runner_shutdown_evidence.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_topology.py \
            tests/contract/test_b012_qwen_raw_code_one_shot_workflow.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py

      - name: Full pytest
        run: python -m pytest -q

      - name: Mypy
        run: python -m mypy src/mstr_qualify

      - name: Final immutable live guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr-final.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .base.sha==$base and .head.sha==$head and .changed_files==13' /tmp/pr-final.json >/dev/null
          echo 'PR201_QUALIFICATION=PASS'
