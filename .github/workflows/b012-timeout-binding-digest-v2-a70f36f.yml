name: B012 timeout recovery governed binding digest v2 a70f36f

on:
  push:
    branches:
      - evidence/b012-timeout-binding-digest-v2-a70f36f

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a70f36f455e1635c9f2e9cdf4f97ec408a26e12d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify recovery surface and emit immutable digests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a70f36f455e1635c9f2e9cdf4f97ec408a26e12d
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_b012_timeout_budget.py
          python -m ruff check colab/mstr_b012_measure.py colab/mstr_b012_execute.py colab/mstr_b012_governance.py tests/contract/test_b012_timeout_budget.py tests/contract/test_b012_executor_binding.py
          python -m py_compile colab/mstr_b012_measure.py colab/mstr_b012_execute.py colab/mstr_b012_governance.py
          echo "LOCK_SHA256=$(sha256sum artifacts/manifests/B012-executor-toolchain-lock.json | awk '{print $1}')"
          echo "MEASURE_HELPER_SHA256=$(sha256sum colab/mstr_b012_measure.py | awk '{print $1}')"
          echo "GOVERNANCE_SHA256=$(sha256sum colab/mstr_b012_governance.py | awk '{print $1}')"
          echo "EXECUTOR_SHA256=$(sha256sum colab/mstr_b012_execute.py | awk '{print $1}')"
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
