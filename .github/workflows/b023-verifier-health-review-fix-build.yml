name: B023 verifier-health review-fix build

on:
  push:
    branches:
      - evidence/b023-verifier-health-review-fix-build-da0480c

permissions:
  contents: read

env:
  BASE_SHA: fdca133e53a47b8966faef172812da58503576a0
  TARGET_SHA: da0480c0eb39e4097cb2d3fd3337a7fc49ab75dc
  TARGET_TREE: 097cf6373e918e60f6c20bb81e3b7f28435177d3
  TARGET_BRANCH: feat/000b-b023-verifier-health-evaluator

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact live identities and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$BASE_SHA" "$TARGET_SHA")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          printf '%s\n' \
            evidence/mstr-000b/B023-verifier-health-implementation.md \
            src/mstr_qualify/verifier/__init__.py \
            src/mstr_qualify/verifier/health.py \
            tests/unit/test_verifier_health.py | sort > /tmp/expected
          git diff --name-only "$BASE_SHA...$TARGET_SHA" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(grep '^\.github/workflows/' /tmp/actual || true)"
          grep -F -- '- [ ] **B023 Implement verifier-health evaluator on controlled fixtures.**' specs/002-code-model-supremacy-foundation/tasks.md
      - name: Verify review-fix semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'if isinstance(stage_ids, str) or not stage_ids or any(' src/mstr_qualify/verifier/health.py
          grep -F 'evaluate_verifier_health(_observation(), stage_ids="MSTR-002-SFT")' tests/unit/test_verifier_health.py
          grep -F 'scalar string passed as `stage_ids`' evidence/mstr-000b/B023-verifier-health-implementation.md

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused B023, B022, and A018 tests
        run: >-
          python -m pytest
          tests/unit/test_verifier_health.py
          tests/contract/test_verifier_health_contract.py
          tests/unit/trajectory/test_trajectory_factory.py
          -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src

  complete:
    runs-on: ubuntu-24.04
    needs: [identity_scope, quality]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Recheck immutable identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
