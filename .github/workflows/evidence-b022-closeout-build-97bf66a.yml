name: Build B022 canonical closeout atomically

on:
  push:
    branches:
      - evidence/b022-closeout-build-97bf66a

permissions:
  contents: write

env:
  EXPECTED_MAIN: 97bf66a98bad51ff0d574d90a04fa47b802708ee
  TARGET_BRANCH: docs/000b-b022-canonicalize

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b022-closeout-build-97bf66a
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve builder and prove immutable clean target
        shell: bash
        run: |
          set -euo pipefail
          cp tools/evidence/build_b022_closeout.py /tmp/build_b022_closeout.py
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
      - name: Materialize exact six-file closeout candidate
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/build_b022_closeout.py
          git diff --check
          mapfile -t actual < <(git diff --name-only | sort)
          expected=(
            configs/task-gate/mstr-000b.json
            evidence/mstr-000b/B022-verifier-health.md
            specs/002-code-model-supremacy-foundation/tasks.md
            tests/contract/test_task_gate.py
            tests/contract/test_verifier_health_contract.py
            tests/integration/test_task_gate_cli.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 6
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          test -z "$(git diff --name-only -- schemas/mstr-verifier-health-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-verifier-health-v0.schema.json tests/fixtures/schemas src/mstr_qualify/schemas.py src/mstr_qualify/cli.py)"
      - name: Run closeout and canonical quality gates before push
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_verifier_health_contract.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
      - name: Commit, prove prospective terminal semantics, and fast-forward target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B022-verifier-health.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/contract/test_verifier_health_contract.py \
            tests/integration/test_task_gate_cli.py
          git commit -m "docs(mstr-000b): canonicalize B022 closeout"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          git update-ref refs/heads/main HEAD
          git update-ref refs/remotes/origin/main HEAD
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json
          if mstr-qualify task eligible B022 > /tmp/b022.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null' /tmp/b022.json
          if mstr-qualify task eligible B023 > /tmp/b023.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B022")) == null and (.reasons | index("prerequisite.unsatisfied:A006")) != null and (.reasons | index("prerequisite.unsatisfied:A014")) != null' /tmp/b023.json
          mstr-qualify task eligible B025 > /tmp/b025.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .reasons == []' /tmp/b025.json
          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.satisfied == false' /tmp/b011.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "B022_CLOSEOUT_HEAD=$(git rev-parse HEAD)"
          echo "B022_CLOSEOUT_TREE=$(git rev-parse HEAD^{tree})"
          echo "B022_CLOSEOUT_FILES=6"
