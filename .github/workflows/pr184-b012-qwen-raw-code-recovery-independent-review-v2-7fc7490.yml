name: PR184 B012 Qwen raw-code recovery independent review v2

on:
  push:
    branches:
      - evidence/pr184-b012-qwen-raw-code-recovery-independent-review-v2-7fc7490

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: 7ebb02c3c46c64d226d412def8bc88fd5f2c1594
      SUBJECT_BRANCH: fix/b012-qwen-raw-code-runner-shutdown-recovery
      SUBJECT_SHA: 7fc74906e2ddd82a044a5fee3fbf73ac188ad11e
      SUBJECT_TREE: 54ecb7ad01fb29eecd7abd5049cf9a4c8fb80383
      QUALIFICATION_RUN_ID: "34159617069"
      QUALIFICATION_EVIDENCE_COMMIT: ebf535b466244b8e96a822cc1fffe9761c34cb31
      QUALIFICATION_BRANCH: evidence/pr184-b012-qwen-raw-code-recovery-qualification-v2-7fc7490
      QUALIFICATION_WORKFLOW_PATH: .github/workflows/pr184-b012-qwen-raw-code-recovery-qualification-v2-7fc7490.yml
      PR_NUMBER: "184"
    steps:
      - name: Checkout independent review branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify live PR and qualification provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" "$QUALIFICATION_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          [[ "$(git rev-parse "$QUALIFICATION_EVIDENCE_COMMIT^")" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse "origin/$QUALIFICATION_BRANCH")" == "$QUALIFICATION_EVIDENCE_COMMIT" ]]
          git show "$QUALIFICATION_EVIDENCE_COMMIT:$QUALIFICATION_WORKFLOW_PATH" | grep -F "SUBJECT_SHA: $SUBJECT_SHA" >/dev/null
          git show "$QUALIFICATION_EVIDENCE_COMMIT:$QUALIFICATION_WORKFLOW_PATH" | grep -F "SUBJECT_TREE: $SUBJECT_TREE" >/dev/null
          git show "$QUALIFICATION_EVIDENCE_COMMIT:$QUALIFICATION_WORKFLOW_PATH" | grep -F "BASE_SHA: $BASE_SHA" >/dev/null
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "mstr-pr184-independent-review-v2",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = get(
              "https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/"
              + os.environ["QUALIFICATION_RUN_ID"]
          )
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert run["head_sha"] == os.environ["QUALIFICATION_EVIDENCE_COMMIT"]

          pr = get(
              "https://api.github.com/repos/TheHalfMoon/MSTR/pulls/"
              + os.environ["PR_NUMBER"]
          )
          assert pr["state"] == "open"
          assert pr["draft"] is False
          assert pr["base"]["ref"] == "main"
          assert pr["base"]["sha"] == os.environ["BASE_SHA"]
          assert pr["head"]["ref"] == os.environ["SUBJECT_BRANCH"]
          assert pr["head"]["sha"] == os.environ["SUBJECT_SHA"]
          assert pr["changed_files"] == 6
          print("LIVE_PR_AND_QUALIFICATION_PROVENANCE=PASS")
          PY

      - name: Checkout exact subject for substantive review
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_SHA"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          python -m pip install -e '.[dev]'

      - name: Review containment incident truth and authority boundary
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            "artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json"
            "artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-run-34155931982.json"
            "colab/mstr_b012_qwen_raw_code_recovery.py"
            "configs/workflows/b012-qwen-raw-code-recovery.yml"
            "evidence/B012-qwen-raw-code-runner-shutdown-34155931982.md"
            "tests/contract/test_b012_qwen_raw_code_recovery.py"
          )
          [[ "${#changed[@]}" -eq 6 ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- .github/workflows/b012-qualify.yml
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- artifacts/manifests/B012-executor-toolchain-binding.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest_path = Path("artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json")
          incident_path = Path("artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-run-34155931982.json")
          runner_path = Path("colab/mstr_b012_qwen_raw_code_recovery.py")
          workflow_path = Path("configs/workflows/b012-qwen-raw-code-recovery.yml")
          active_path = Path(".github/workflows/b012-qwen-raw-code-recovery.yml")
          binding = json.loads(Path("artifacts/manifests/B012-executor-toolchain-binding.json").read_text())
          authority = json.loads(Path("artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json").read_text())
          manifest = json.loads(manifest_path.read_text())
          incident = json.loads(incident_path.read_text())

          assert manifest["status"] == "INERT_PENDING_SEPARATE_ACTIVATION"
          assert not active_path.exists()
          assert "qwen_raw_code_recovery_manifest_sha256" not in binding
          assert authority["status"] == "AUTHORIZED_CANONICAL"
          assert authority["scope"]["candidate_ids"] == ["mellum-4b", "qwen3.5-0.8b-control"]
          assert manifest["candidate_id"] == "qwen3.5-0.8b-control"
          assert manifest["incident_evidence_sha256"] == sha(incident_path)
          assert manifest["recovery_script_sha256"] == sha(runner_path)
          assert manifest["recovery_workflow_sha256"] == sha(workflow_path)
          assert incident["workflow_run_id"] == 34155931982
          assert incident["workflow_job_id"] == 101847640786
          assert incident["classification"] == "B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_AFTER_STAGE05_NO_RAW_CODE_RESULT"
          assert incident["completed_durable_stages"] == ["init", "source", "quantize", "prefill", "decode"]
          assert incident["last_durable_stage"] == "decode"
          assert incident["interrupted_stage"] == "raw-code"
          assert incident["interrupted_step_conclusion"] == "cancelled"
          assert incident["raw_code_result"] == "NONE"
          assert incident["model_quality_verdict"] == "NONE"
          assert incident["candidate_admission_decision"] == "NONE"
          assert incident["retry_authority_created"] is False
          assert incident["external_dispatch_authority_created"] is False
          scope = manifest["recovery_scope"]
          assert scope["reacquire_exact_b010_qwen_files"] is True
          assert scope["regenerate_exact_q4_k_m_and_q4_k_s"] is True
          assert scope["require_q4_k_m_identity_match_to_prior_stage03"] is True
          assert scope["rerun_prefill"] is False
          assert scope["rerun_decode"] is False
          assert scope["run_raw_code_proxy"] is True
          for key in (
              "candidate_expansion",
              "revision_or_file_expansion",
              "training",
              "paid_compute",
              "paid_model_api",
              "git_model_binaries",
              "founder_machine_model_binaries",
          ):
              assert scope[key] is False
          assert scope["durable_outputs"] == ["JSON"]
          assert manifest["activation"]["separate_activation_pr_required"] is True
          assert manifest["activation"]["canonical_postmerge_verification_required"] is True
          assert manifest["activation"]["retry_authority_created"] is False
          assert manifest["activation"]["external_dispatch_authority_created"] is False
          print("INCIDENT_TRUTH_AND_AUTHORITY_BOUNDARY=PASS")
          PY

      - name: Review fail-closed recovery implementation and workflow spec
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runner = Path("colab/mstr_b012_qwen_raw_code_recovery.py").read_text(encoding="utf-8")
          workflow = Path("configs/workflows/b012-qwen-raw-code-recovery.yml").read_text(encoding="utf-8")
          assert 'CANDIDATE_ID = "qwen3.5-0.8b-control"' in runner
          assert "PRIOR_RUN_ID = 34155931982" in runner
          assert 'PRIOR_MAIN = "7ebb02c3c46c64d226d412def8bc88fd5f2c1594"' in runner
          assert 'EXPECTED_Q4_K_M_SHA256 = "47f87d507130b70d7b54a159e7bf982e4fbe7dc75eae74e3cd9c9c9284805626"' in runner
          assert "EXPECTED_Q4_K_M_SIZE_BYTES = 541903296" in runner
          assert "ACTIVATED_CANONICAL" in runner
          assert "qwen_raw_code_recovery_manifest_sha256" in runner
          assert "require_file_sha256" in runner
          assert "download_candidate" in runner
          assert "convert_quantize" in runner
          assert "run_raw_code_proxy" in runner
          assert 'target="llama-quantize"' in runner
          assert 'target="llama-cli"' in runner
          assert "llama-bench" not in runner
          assert "measure_set_bounded" not in runner
          assert "_stage_prefill" not in runner
          assert "_stage_decode" not in runner
          assert "B012_RAW_CODE_RECOVERY_FAILED_CLOSED" in runner
          assert "github.event.issue.number == 162" in workflow
          assert "github.event.comment.user.login == 'TheHalfMoon'" in workflow
          assert "github.event.comment.author_association == 'OWNER'" in workflow
          assert "github.event.comment.body == 'B012_RECOVER_RAW_CODE qwen3.5-0.8b-control 34155931982'" in workflow
          assert "runs-on: ubuntu-24.04" in workflow
          assert "timeout-minutes: 45" in workflow
          assert "cancel-in-progress: false" in workflow
          assert "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" in workflow
          expected_upload = "$" + "{{ runner.temp }}/b012-recovery-results/*.json"
          assert expected_upload in workflow
          assert ".gguf" not in workflow
          assert ".safetensors" not in workflow
          assert 'rm -rf "$RUNNER_TEMP/b012-recovery-work"' in workflow
          print("FAIL_CLOSED_RECOVERY_IMPLEMENTATION_REVIEW=PASS")
          PY

      - name: Re-run focused and full quality independently
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m py_compile colab/mstr_b012_qwen_raw_code_recovery.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m mypy src/mstr_qualify

      - name: Final independent live-ref guard
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          echo 'PR184_INDEPENDENT_REVIEW_V2=PASS'
          echo 'MATERIAL_FINDINGS=0'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
