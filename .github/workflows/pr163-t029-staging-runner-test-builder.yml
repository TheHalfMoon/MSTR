name: Build PR163 T029 runner and tests on staging

on:
  push:
    branches:
      - evidence/pr163-t029-staging-runner-test-builder-a647a02

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_MAIN: 5cadbd754686ebff6f5327e9746f0b074b35e318
      EXPECTED_STAGING: a647a02fae25ea1176264a14739e2bcf5efebfbd
      STAGING_BRANCH: staging/pr163-t029-network-hardening-a647a02
      BUILDER_COMMIT: 89737e2cfce6fd7d4750e4647770d1ad29e77f5f
    steps:
      - name: Verify exact remote identities
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          STAGING_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$STAGING_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$STAGING_SHA" = "$EXPECTED_STAGING"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_STAGING }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reproduce exact tested runner and tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BUILDER_COMMIT"
          git show "$BUILDER_COMMIT:.github/scripts/pr163_t029_network_hardening_builder.py" > /tmp/builder.py
          python /tmp/builder.py
          python -m pip install 'ruff==0.16.6'
          ruff format colab/mstr_t029_quantize.py tests/unit/test_t029_quantize_runner.py
          git checkout "$EXPECTED_STAGING" -- .github/workflows/t029-quantize.yml
          git diff --check "$EXPECTED_STAGING"
          git diff --name-only "$EXPECTED_STAGING" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          colab/mstr_t029_quantize.py
          tests/unit/test_t029_quantize_runner.py
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test "$(sha256sum colab/mstr_t029_quantize.py | cut -d' ' -f1)" = "5c7057bc51464ad08340094df2f1577d2f12fadde9dcc6c864e4caef8caed050"
          test "$(sha256sum tests/unit/test_t029_quantize_runner.py | cut -d' ' -f1)" = "8a870692d3c1b4e67606e1a071298b1e700f83089edfeda0ef7fcfaa6f0710e1"

      - name: Commit exact runner and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add colab/mstr_t029_quantize.py tests/unit/test_t029_quantize_runner.py
          git commit -m "fix(mstr-000): enforce T029 artifact network allowlist"

      - name: Guarded push to staging
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          STAGING_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$STAGING_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$STAGING_SHA" = "$EXPECTED_STAGING"
          git merge-base --is-ancestor "$EXPECTED_STAGING" HEAD
          git push origin "HEAD:refs/heads/$STAGING_BRANCH"
