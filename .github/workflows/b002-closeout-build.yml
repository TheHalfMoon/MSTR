name: Build guarded B002 closeout candidate

on:
  push:
    branches:
      - evidence/b002-closeout-build-298a97e

permissions:
  contents: write

jobs:
  build-closeout:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 298a97e957fe98edec2c9fdd3f78f0f909ec09fa
      TARGET_BRANCH: docs/000b-b002-canonicalize
      BUILDER_BRANCH: evidence/b002-closeout-build-298a97e
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout guarded closeout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact target and canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          git fetch origin main "$TARGET_BRANCH" "$BUILDER_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Apply bounded closeout transition
        shell: bash
        run: |
          set -euo pipefail
          git show "refs/remotes/origin/$BUILDER_BRANCH:tools/evidence/b002_closeout_build.py" > /tmp/b002_closeout_build.py
          python /tmp/b002_closeout_build.py

      - name: Verify exact closeout scope and source syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile tests/contract/test_task_gate.py
          python - <<'PY'
          import json
          from pathlib import Path
          changed = set(line for line in __import__('subprocess').run(
              ['git', 'diff', '--name-only'], check=True, capture_output=True, text=True
          ).stdout.splitlines() if line)
          expected = {
              'configs/task-gate/mstr-000b.json',
              'evidence/mstr-000b/B002-task-gate.md',
              'specs/002-code-model-supremacy-foundation/tasks.md',
              'tests/contract/test_task_gate.py',
          }
          assert changed == expected, (changed, expected)
          catalog = json.loads(Path('configs/task-gate/mstr-000b.json').read_text(encoding='utf-8'))
          assert catalog['tasks']['B002']['canonical_state'] == 'COMPLETE_CANONICAL'
          tasks = Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text(encoding='utf-8')
          assert '- [x] **B002 Implement offline task eligibility validator.**' in tasks
          evidence = Path('evidence/mstr-000b/B002-task-gate.md').read_text(encoding='utf-8')
          assert '**State:** COMPLETE_CANONICAL' in evidence
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Run targeted task-gate tests
        run: pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py

      - name: Prove B003 successor eligibility in closeout candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from mstr_qualify.task_gate import evaluate_task_snapshot
          result = evaluate_task_snapshot('B003', canonical_main='a' * 40)
          assert result['eligible'] is True, result
          predecessor = result['prerequisite_results'][0]
          assert predecessor['task_id'] == 'B002'
          assert predecessor['observed_state'] == 'COMPLETE_CANONICAL'
          assert predecessor['satisfied'] is True
          print('B003_CLOSEOUT_CANDIDATE_ELIGIBLE=true')
          PY

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Guarded commit and fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B002-task-gate.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py
          test -z "$(git diff --name-only)"
          git commit -m "docs(mstr-000b): canonicalize B002 closeout"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "B002_CLOSEOUT_HEAD=$(git rev-parse HEAD)"
