name: Premerge A011 canonical closeout

on:
  push:
    branches:
      - evidence/a011-closeout-premerge-87223ac

permissions:
  contents: read
  pull-requests: read

env:
  CANONICAL_MAIN: 477de59557bdaf016ab8f9bcf5c98981daba8cb2
  CLOSEOUT_HEAD: 87223ac50ea434fa1bcf1592407a409a81dfc459
  CLOSEOUT_TREE: 55467dadd91ce03016a6113848c1f72011989300
  CLOSEOUT_BRANCH: docs/000a-a011-closeout
  PR_NUMBER: "108"
  QUALIFICATION_RUN: "33394849456"
  REVIEW_ID: "5066783660"

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CLOSEOUT_HEAD }}
          fetch-depth: 0
      - name: Verify closeout PR admission and exact evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$CLOSEOUT_TREE"
          test "$(git rev-parse HEAD^)" = "$CANONICAL_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
          test "$(git ls-remote origin refs/heads/$CLOSEOUT_BRANCH | cut -f1)" = "$CLOSEOUT_HEAD"
          test "$(git diff --name-only "$CANONICAL_MAIN".."$CLOSEOUT_HEAD" | wc -l)" -eq 2
          test "$(git diff --name-only "$CANONICAL_MAIN".."$CLOSEOUT_HEAD" | sort | paste -sd ' ' -)" = "evidence/mstr-000a/A011-env-verifier-contracts.md specs/001-agent-harness-verified-loop-foundation/tasks.md"
          git diff --check "$CANONICAL_MAIN".."$CLOSEOUT_HEAD"
          grep -F -- '**State:** `COMPLETE_CANONICAL`' evidence/mstr-000a/A011-env-verifier-contracts.md
          grep -F -- '- [x] **A011 Freeze environment/setup/verifier manifest schemas and effect boundaries.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A012 Implement clean-checkout environment reset/setup abstraction.**' specs/001-agent-harness-verified-loop-foundation/tasks.md

          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TheHalfMoon/MSTR/pulls/$PR_NUMBER")"
          jq -e --arg head "$CLOSEOUT_HEAD" --arg base "$CANONICAL_MAIN" '.state == "open" and .draft == false and .head.sha == $head and .base.ref == "main" and .base.sha == $base and .mergeable == true' <<<"$pr_json"

          run_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/$QUALIFICATION_RUN")"
          jq -e '.status == "completed" and .conclusion == "success"' <<<"$run_json"

          reviews_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TheHalfMoon/MSTR/pulls/$PR_NUMBER/reviews?per_page=100")"
          jq -e --argjson review_id "$REVIEW_ID" --arg head "$CLOSEOUT_HEAD" 'any(.[]; .id == $review_id and .commit_id == $head and (.state == "COMMENTED" or .state == "APPROVED"))' <<<"$reviews_json"

          query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}'
          graphql_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' https://api.github.com/graphql -d "$(jq -nc --arg q "$query" '{query:$q,variables:{owner:"TheHalfMoon",name:"MSTR",number:108}}')")"
          jq -e '([.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length) == 0' <<<"$graphql_json"

  quality:
    needs: admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CLOSEOUT_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run mandatory closeout premerge quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CLOSEOUT_HEAD }}
          fetch-depth: 0
      - name: Final immutable closeout merge-admission recheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$CLOSEOUT_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
          test "$(git ls-remote origin refs/heads/$CLOSEOUT_BRANCH | cut -f1)" = "$CLOSEOUT_HEAD"
          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TheHalfMoon/MSTR/pulls/$PR_NUMBER")"
          jq -e --arg head "$CLOSEOUT_HEAD" --arg base "$CANONICAL_MAIN" '.state == "open" and .draft == false and .head.sha == $head and .base.sha == $base and .mergeable == true' <<<"$pr_json"
