name: Evidence B003 repaired exact-head qualification

on:
  push:
    branches:
      - evidence/b003-55ff6ef-final-gates

permissions:
  contents: read

env:
  TARGET_SHA: 55ff6ef0f39801c97f062d5305584e0e3fc5bc33
  EXPECTED_MAIN: 0754d552752c2f6c099df2b480de99028e2e26e5
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  qualify-b003:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact B003 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact target and canonical main identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"
          git diff --exit-code

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify implementation scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/mstr_qualify/task_drift.py \
            src/mstr_qualify/cli.py \
            tests/unit/test_task_drift.py \
            tests/integration/test_task_drift_cli.py
          python - <<'PY'
          import subprocess
          expected = {
              'evidence/mstr-000b/B003-drift-detector.md',
              'src/mstr_qualify/cli.py',
              'src/mstr_qualify/task_drift.py',
              'tests/fixtures/task_drift_cases.json',
              'tests/integration/test_task_drift_cli.py',
              'tests/unit/test_task_drift.py',
          }
          changed = set(subprocess.run(
              ['git', 'diff', '--name-only', '0754d552752c2f6c099df2b480de99028e2e26e5..HEAD'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines())
          assert changed == expected, (changed, expected)
          PY

      - name: Run targeted B003 tests
        run: pytest -q tests/unit/test_task_drift.py tests/integration/test_task_drift_cli.py

      - name: Re-prove exact-main eligibility and drift cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git worktree add --detach /tmp/b003-main "$EXPECTED_MAIN"
          git -C /tmp/b003-main update-ref refs/heads/main "$EXPECTED_MAIN"
          git -C /tmp/b003-main update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          test -z "$(git -C /tmp/b003-main status --short)"
          (
            cd /tmp/b003-main
            PYTHONPATH=src python -m mstr_qualify task eligible B003 > /tmp/b003-entry.json
          )
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/b003-entry.json', encoding='utf-8'))
          assert payload['task_id'] == 'B003', payload
          assert payload['eligible'] is True, payload
          assert payload['canonical_main'] == '0754d552752c2f6c099df2b480de99028e2e26e5', payload
          assert payload['reasons'] == [], payload
          print('B003_EXACT_MAIN_ELIGIBLE=true')
          PY
          python - <<'PY'
          from pathlib import Path
          from mstr_qualify.task_drift import detect_canonical_drift
          report = detect_canonical_drift(repository_root=Path('/tmp/b003-main'))
          assert report['canonical_main'] == '0754d552752c2f6c099df2b480de99028e2e26e5', report
          assert report['status'] == 'clean', report
          assert report['findings'] == [], report
          assert report['tasks_checked'] == 34, report
          print('CANONICAL_DRIFT_STATUS=clean')
          PY

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Verify immutable exact head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"
          git diff --exit-code
          echo "FINAL_B003_SHA=$(git rev-parse HEAD)"
          echo "FINAL_MAIN_SHA=$(git rev-parse refs/remotes/origin/main)"
