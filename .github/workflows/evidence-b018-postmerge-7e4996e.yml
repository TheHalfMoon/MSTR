name: Verify B018 implementation post-merge

on:
  push:
    branches:
      - evidence/b018-postmerge-7e4996e

permissions:
  contents: read

env:
  EXPECTED_MAIN: 7e4996e92128e4e02ec6dbcf6ed29eed2b753838
  EXPECTED_PARENT_MAIN: 73b60aa9421f51be52560bbbca6e8dd46b77b6c9
  EXPECTED_CANDIDATE: 23c83ebae95ca3f0d893840e9d994b33712f124f

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bind canonical merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT_MAIN"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$EXPECTED_CANDIDATE^{tree}")"

  task_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Verify post-merge task state and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B018 > /tmp/b018.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json

          b18 = json.load(open('/tmp/b018.json'))
          b11 = json.load(open('/tmp/b011.json'))
          drift = json.load(open('/tmp/drift.json'))
          assert b18['canonical_main'] == '7e4996e92128e4e02ec6dbcf6ed29eed2b753838'
          assert b18['eligible'] is True
          assert b18['state_consistency_result']['observed_state'] == 'PENDING'
          assert b18['authority_result']['required'] is False
          assert b18['authority_result']['satisfied'] is True
          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state'] == 'BLOCKED'
          assert b11['authority_result']['required'] is True
          assert b11['authority_result']['satisfied'] is False
          assert drift['status'] == 'clean' and drift['findings'] == []
          PY

  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e4996e92128e4e02ec6dbcf6ed29eed2b753838
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Re-run B018 focused contract and fixture gates on canonical main
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_self_alignment_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py
          python -m mstr_qualify validate tests/fixtures/schemas/valid/mstr-self-alignment-generation-v0.json
          if python -m mstr_qualify validate tests/fixtures/schemas/invalid/mstr-self-alignment-generation-v0.json; then exit 1; fi

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e4996e92128e4e02ec6dbcf6ed29eed2b753838
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m mstr_qualify validate
      - run: pytest -q
      - run: ruff check src tests
      - run: mypy

  complete:
    needs: [identity, task_gate, focused, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Final canonical main immutability recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo 'B018_POSTMERGE_IMPLEMENTATION=PASS'
          echo 'B018_STATE=PENDING_CLOSEOUT'
          echo 'B011_REMAINS_BLOCKED=PASS'
