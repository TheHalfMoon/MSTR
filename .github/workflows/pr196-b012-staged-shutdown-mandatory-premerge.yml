name: PR196 B012 staged shutdown mandatory premerge

on:
  push:
    branches:
      - evidence/pr196-b012-staged-shutdown-mandatory-premerge-c8b6043

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPO: TheHalfMoon/MSTR
      PR: '196'
      BASE: 98feee7765cbf64428f149f885519cef76800caf
      HEAD: c8b604384073227ca99833bfa0085e30b2b7b5ac
      TREE: aa43402ec11fbff58ebe830d2bea47fbe0599d30
      SUBJECT_BRANCH: governance/b012-qwen-staged-recovery-runner-shutdown-34231845282
      QUAL_RUN: '34243869812'
      QUAL_HEAD: 8e62220ff629103b9c9bc181c7af3590d1fd9fa6
      REVIEW_RUN: '34245265851'
      REVIEW_HEAD: 48d0e6a4abb82f5f84ad8ea2e9f9517366210f7c
      INCIDENT_SHA256: a067895cc6f0356b917d896f7da59faab0db4dcd27c29d76bc157968c2d8134b
      FAILURE_CLASS: B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_PARTIAL_DURABLE_PROGRESS_RAW_CODE_UNPROVEN
      BLOCKED_STATUS: BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Reverify immutable PR qualification and review chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$SUBJECT_BRANCH)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"

          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg b "$BASE" --arg h "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.ref=="main" and .base.sha==$b and .head.sha==$h and .changed_files==8' /tmp/pr.json >/dev/null

          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          jq -e --arg q "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$q' /tmp/qual.json >/dev/null
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/review.json
          jq -e --arg r "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$r' /tmp/review.json >/dev/null

      - name: Prove review state has no blockers
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" > /tmp/reviews.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/reviews.json', encoding='utf-8'))
          assert all(x.get('state') != 'CHANGES_REQUESTED' for x in data)
          print(f'SUBMITTED_REVIEWS={len(data)}')
          PY
          gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}pageInfo{hasNextPage}}}}}' \
            -f owner=TheHalfMoon -f repo=MSTR -F number=196 > /tmp/threads.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/threads.json', encoding='utf-8'))['data']['repository']['pullRequest']['reviewThreads']
          assert d['pageInfo']['hasNextPage'] is False
          assert all(x['isResolved'] is True for x in d['nodes'])
          print(f'REVIEW_THREADS={len(d["nodes"])}')
          PY

      - name: Prove exact incident-only scope and frozen execution surfaces
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            'artifacts/manifests/B012-executor-toolchain-binding.json' \
            'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-staged-recovery-run-34231845282.json' \
            'evidence/mstr-000b/B012-qwen-staged-recovery-runner-shutdown-34231845282.md' \
            'tests/contract/test_b012_executor_binding.py' \
            'tests/contract/test_b012_qwen_raw_code_recovery.py' \
            'tests/contract/test_b012_qwen_staged_recovery_topology.py' \
            'tests/contract/test_b012_runner_shutdown_evidence.py' \
            'tests/contract/test_b012_stage_checkpoint_topology.py' | sort)
          test "$(git diff --name-only "$BASE...$HEAD" | sort)" = "$expected"
          git diff --check "$BASE...$HEAD"
          for path in \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B010-new-candidate-weight-access.json \
            artifacts/manifests/B012-qwen-raw-code-recovery-staged-topology.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_governance.py \
            colab/mstr_b012_executor.py \
            colab/mstr_b012_qwen_raw_code_recovery_staged.py \
            colab/mstr_b012_raw_code.py \
            configs/workflows/b012-qwen-raw-code-recovery-staged.yml \
            .github/workflows/b012-qwen-raw-code-recovery.yml; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reprove B012 exact-main machine eligibility
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE"
          test "$(git rev-parse HEAD)" = "$BASE"
          git branch -f main "$BASE"
          python -m mstr_qualify task eligible B012 > /tmp/eligibility.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/eligibility.json', encoding='utf-8'))
          assert d['schema_version']=='mstr.task-eligibility.v0'
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True
          assert d['reasons']==[]
          assert d['authority_result']=={
              'required': True,
              'authority_id': 'B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION',
              'satisfied': True,
              'reasons': [],
          }
          assert all(x['evidence_present'] is True for x in d['prerequisite_results'])
          assert all(x['satisfied'] is True and x['reasons']==[] for x in d['prerequisite_results'])
          assert d['supersession_result']['satisfied'] is True
          assert d['state_consistency_result']['satisfied'] is True
          assert d['candidate_pool_result']['satisfied'] is True
          assert all(d['semantic_checks'].values())
          print('B012_EXACT_MAIN_ELIGIBILITY=PASS')
          PY
          git checkout --detach "$HEAD"

      - name: Reprove incident fail-closed semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-staged-recovery-run-34231845282.json')
          i=json.loads(p.read_text(encoding='utf-8'))
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text(encoding='utf-8'))
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['INCIDENT_SHA256']
          assert i['failure_classification']==os.environ['FAILURE_CLASS']
          assert i['durable_stages']==['init','source','quantize']
          assert i['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert i['candidate_execution_completion']=='NOT_PROVEN'
          assert i['candidate_admission_decision']=='NONE'
          assert i['model_quality_verdict']=='NONE'
          assert i['ephemeral_cleanup_completion']=='NOT_PROVEN'
          assert i['separate_topology_repair_required'] is True
          for key in ('training','paid_model_api','candidate_expansion','revision_or_file_expansion','retry_authority_created','external_dispatch_authority_created','same_staged_topology_redispatch_authorized_by_this_evidence'):
              assert i[key] is False, key
          assert i['paid_cost_usd']==0.0
          assert b['status']==os.environ['BLOCKED_STATUS']
          s=b['qwen_raw_code_staged_recovery_runner_shutdown']
          assert s['run_id']==34231845282
          assert s['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert s['model_quality_verdict']=='NONE'
          assert s['candidate_execution_completion']=='NOT_PROVEN'
          assert s['ephemeral_cleanup_completion']=='NOT_PROVEN'
          for key in ('retry_authority_created','external_dispatch_authority_created','same_staged_topology_redispatch_authorized_by_this_evidence'):
              assert s[key] is False, key
          print('INCIDENT_FAIL_CLOSED=PASS')
          PY

      - name: Mandatory repository quality
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py

      - name: Final guarded-merge readiness proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/pulls/$PR" > /tmp/final-pr.json
          jq -e --arg b "$BASE" --arg h "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$b and .head.sha==$h and .changed_files==8' /tmp/final-pr.json >/dev/null
          echo 'MANDATORY_PREMERGE=SUCCESS'
