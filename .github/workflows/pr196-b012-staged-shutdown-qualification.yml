name: PR196 B012 staged shutdown qualification

on:
  push:
    branches:
      - evidence/pr196-b012-staged-shutdown-qualification-c8b6043

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR_NUMBER: '196'
      BASE_SHA: 98feee7765cbf64428f149f885519cef76800caf
      SUBJECT_SHA: c8b604384073227ca99833bfa0085e30b2b7b5ac
      SUBJECT_TREE: aa43402ec11fbff58ebe830d2bea47fbe0599d30
      BUILDER_RUN_ID: '34242768025'
      INCIDENT_SHA256: a067895cc6f0356b917d896f7da59faab0db4dcd27c29d76bc157968c2d8134b
      FAILURE_CLASS: B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_PARTIAL_DURABLE_PROGRESS_RAW_CODE_UNPROVEN
      BLOCKED_STATUS: BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Reverify immutable PR and builder truth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main governance/b012-qwen-staged-recovery-runner-shutdown-34231845282
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse origin/governance/b012-qwen-staged-recovery-runner-shutdown-34231845282)" == "$SUBJECT_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          [[ "$(git rev-parse "$SUBJECT_SHA^")" == "$BASE_SHA" ]]

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --output /tmp/pr.json
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BUILDER_RUN_ID" \
            --output /tmp/builder.json
          python - <<'PY'
          import json
          import os

          pr=json.load(open('/tmp/pr.json', encoding='utf-8'))
          assert pr['number']==int(os.environ['PR_NUMBER'])
          assert pr['state']=='open'
          assert pr['draft'] is False
          assert pr['base']['ref']=='main'
          assert pr['base']['sha']==os.environ['BASE_SHA']
          assert pr['head']['sha']==os.environ['SUBJECT_SHA']
          assert pr['head']['ref']=='governance/b012-qwen-staged-recovery-runner-shutdown-34231845282'
          assert pr['mergeable'] is True
          assert pr['changed_files']==8

          builder=json.load(open('/tmp/builder.json', encoding='utf-8'))
          assert builder['id']==int(os.environ['BUILDER_RUN_ID'])
          assert builder['status']=='completed'
          assert builder['conclusion']=='success'
          PY

      - name: Verify exact subject scope and incident semantics
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            'artifacts/manifests/B012-executor-toolchain-binding.json' \
            'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-staged-recovery-run-34231845282.json' \
            'evidence/mstr-000b/B012-qwen-staged-recovery-runner-shutdown-34231845282.md' \
            'tests/contract/test_b012_executor_binding.py' \
            'tests/contract/test_b012_qwen_raw_code_recovery.py' \
            'tests/contract/test_b012_qwen_staged_recovery_topology.py' \
            'tests/contract/test_b012_runner_shutdown_evidence.py' \
            'tests/contract/test_b012_stage_checkpoint_topology.py' | sort)
          [[ "$(git diff --name-only "$BASE_SHA..$SUBJECT_SHA" | sort)" == "$expected" ]]
          git diff --check "$BASE_SHA..$SUBJECT_SHA"
          git checkout --detach "$SUBJECT_SHA"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          incident_path=Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-staged-recovery-run-34231845282.json')
          incident=json.loads(incident_path.read_text(encoding='utf-8'))
          binding=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text(encoding='utf-8'))
          assert hashlib.sha256(incident_path.read_bytes()).hexdigest()==os.environ['INCIDENT_SHA256']
          assert incident['run_id']==34231845282
          assert incident['job_id']==102079676195
          assert incident['canonical_main_at_start']==os.environ['BASE_SHA']
          assert incident['candidate_id']=='qwen3.5-0.8b-control'
          assert incident['failure_classification']==os.environ['FAILURE_CLASS']
          assert incident['durable_stages']==['init','source','quantize']
          assert incident['raw_code_stage_conclusion']=='cancelled'
          assert incident['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert incident['finalize_stage_conclusion']=='skipped'
          assert incident['ephemeral_cleanup_completion']=='NOT_PROVEN'
          assert incident['candidate_admission_decision']=='NONE'
          assert incident['model_quality_verdict']=='NONE'
          assert incident['training'] is False
          assert incident['paid_cost_usd']==0.0
          assert incident['paid_model_api'] is False
          assert incident['candidate_expansion'] is False
          assert incident['revision_or_file_expansion'] is False
          assert incident['retry_authority_created'] is False
          assert incident['external_dispatch_authority_created'] is False
          assert incident['same_staged_topology_redispatch_authorized_by_this_evidence'] is False
          assert binding['status']==os.environ['BLOCKED_STATUS']
          shutdown=binding['qwen_raw_code_staged_recovery_runner_shutdown']
          assert shutdown['run_id']==34231845282
          assert shutdown['failure_classification']==os.environ['FAILURE_CLASS']
          assert shutdown['retry_authority_created'] is False
          assert shutdown['external_dispatch_authority_created'] is False
          PY

      - name: Reprove B012 eligibility and repository quality
        shell: bash
        run: |
          set -euo pipefail
          git branch -f main "$BASE_SHA"
          [[ "$(git rev-parse refs/heads/main)" == "$BASE_SHA" ]]

          git checkout --detach "$BASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 > /tmp/eligibility.json
          python - <<'PY'
          import json
          import os
          d=json.load(open('/tmp/eligibility.json', encoding='utf-8'))
          assert d['schema_version']=='mstr.task-eligibility.v0'
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['BASE_SHA']
          assert d['eligible'] is True
          assert d['reasons']==[]
          assert d['authority_result']=={
              'required': True,
              'authority_id': 'B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION',
              'satisfied': True,
              'reasons': [],
          }
          assert all(x['evidence_present'] is True for x in d['prerequisite_results'])
          assert all(x['satisfied'] is True and x['reasons']==[] for x in d['prerequisite_results'])
          assert d['supersession_result']['satisfied'] is True
          assert d['state_consistency_result']['satisfied'] is True
          assert d['candidate_pool_result']['satisfied'] is True
          assert all(d['semantic_checks'].values())
          PY

          git checkout --detach "$SUBJECT_SHA"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify

      - name: Verify no new formatter debt
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          set +e
          python -m ruff format --check --diff . > /tmp/base-format.diff 2>&1
          base_code=$?
          set -e
          [[ "$base_code" -eq 0 || "$base_code" -eq 1 ]]
          git checkout --detach "$SUBJECT_SHA"
          set +e
          python -m ruff format --check --diff . > /tmp/subject-format.diff 2>&1
          subject_code=$?
          set -e
          [[ "$subject_code" -eq 0 || "$subject_code" -eq 1 ]]
          python - <<'PY'
          from pathlib import Path

          def changed_paths(path: str) -> set[str]:
              out=set()
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.startswith('--- '):
                      out.add(line[4:].split(':cell ',1)[0])
              return out

          base=changed_paths('/tmp/base-format.diff')
          subject=changed_paths('/tmp/subject-format.diff')
          assert not (subject-base), f'new formatter debt: {sorted(subject-base)}'
          print(f'BASE_FORMAT_DEBT_PATHS={len(base)}')
          print(f'SUBJECT_FORMAT_DEBT_PATHS={len(subject)}')
          print('QUALIFICATION=SUCCESS')
          PY

      - name: Final immutable head guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/governance/b012-qwen-staged-recovery-runner-shutdown-34231845282 | cut -f1)" == "$SUBJECT_SHA" ]]
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --output /tmp/final-pr.json
          python - <<'PY'
          import json
          import os
          pr=json.load(open('/tmp/final-pr.json', encoding='utf-8'))
          assert pr['state']=='open'
          assert pr['base']['sha']==os.environ['BASE_SHA']
          assert pr['head']['sha']==os.environ['SUBJECT_SHA']
          assert pr['mergeable'] is True
          print('FINAL_IMMUTABLE_GUARD=SUCCESS')
          PY
