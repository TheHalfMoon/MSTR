name: PR198 B012 case-checkpoint activation mandatory premerge

on:
  push:
    branches:
      - evidence/pr198-b012-case-checkpoint-activation-mandatory-premerge-0cf22bf

permissions:
  contents: read
  pull-requests: read

jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: TheHalfMoon/MSTR
      BASE: 4deca995306c197e5cefaf8202e64fe5469f873c
      HEAD: 0cf22bf5aab2dc73be1dea18d2008b77ca34425f
      TREE: d4b125338dad52f14e71d12c8e384856f2dc8b4e
      PR: '198'
      QUAL_RUN: '34262561948'
      QUAL_HEAD: 390dc2742c1f8e5397d8a16959603032ba089744
      REVIEW_RUN: '34263326436'
      REVIEW_HEAD: 5d03aa10a137c90785209ac024a57b94aa171efd
      SUBJECT_BRANCH: fix/b012-qwen-case-checkpoint-activation
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove immutable live identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$SUBJECT_BRANCH)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==10' /tmp/pr.json >/dev/null

      - name: Prove exact qualification and independent-review chain
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/qual.json
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/review.json
          jq -e --arg h "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/qual.json >/dev/null
          jq -e --arg h "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/review.json >/dev/null

      - name: Prove exact scope and frozen authority execution benchmark surfaces
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "$BASE...$HEAD" | sort)
          expected=(
            '.github/workflows/b012-qwen-raw-code-recovery.yml'
            'artifacts/manifests/B012-executor-toolchain-binding.json'
            'artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json'
            'evidence/mstr-000b/B012-qwen-case-checkpoint-activation.md'
            'tests/contract/test_b012_executor_binding.py'
            'tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py'
            'tests/contract/test_b012_qwen_raw_code_recovery.py'
            'tests/contract/test_b012_qwen_staged_recovery_topology.py'
            'tests/contract/test_b012_runner_shutdown_evidence.py'
            'tests/contract/test_b012_stage_checkpoint_topology.py'
          )
          [[ ${#actual[@]} -eq ${#expected[@]} ]]
          for i in "${!expected[@]}"; do [[ "${actual[$i]}" == "${expected[$i]}" ]]; done
          for path in \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B010-new-candidate-weight-access.json \
            artifacts/manifests/B011-acquired-candidates.json \
            artifacts/manifests/B012-equivalent-qualification-execution-envelope.json \
            artifacts/manifests/B012-executor-toolchain-lock.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml; do
            git diff --quiet "$BASE" "$HEAD" -- "$path"
          done
          git diff --check "$BASE...$HEAD"

      - name: Prove no blocking reviews or unresolved threads
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" > /tmp/reviews.json
          test "$(jq '[.[] | select(.state=="CHANGES_REQUESTED")] | length' /tmp/reviews.json)" -eq 0
          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner=TheHalfMoon -f name=MSTR -F number=198 > /tmp/threads.json
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false)] | length' /tmp/threads.json)" -eq 0

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reprove exact-main B012 eligibility and Founder authority
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('/tmp/b012.json').read_text(encoding='utf-8'))
          assert d['task_id']=='B012' and d['canonical_main']==os.environ['BASE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert all(d['semantic_checks'].values())
          a=json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text(encoding='utf-8'))
          assert a['status']=='AUTHORIZED_CANONICAL' and a['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION' and a['task_id']=='B012'
          assert a['cost_resource_ceiling']['limits'][0]['max']==0.0
          PY
          git checkout --detach "$HEAD"

      - name: Reprove activation durability storage and dispatch separation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          mp=Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          bp=Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          active=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          spec=Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          script=Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          m=json.loads(mp.read_text(encoding='utf-8')); b=json.loads(bp.read_text(encoding='utf-8'))
          act=m['activation']; bound=b['qwen_raw_code_case_checkpoint_activation']; d=m['durability_boundary']; t=m['topology']; ab=m['authority_boundary']
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION' and m['task_id']=='B012' and m['candidate_id']=='qwen3.5-0.8b-control'
          assert act['activation_base_main']=='4deca995306c197e5cefaf8202e64fe5469f873c'
          assert act['repair_package_merge_commit']==act['activation_base_main']
          assert act['repair_package_postmerge_run_id']==34261221062 and act['repair_package_postmerge_evidence_head']=='f5dac568a809fe9fed707c3c2d8a298c859d16bb'
          assert act['active_workflow_materialized'] is True and act['activation_repository_change_only'] is True
          assert act['activation_model_access']=='NONE' and act['activation_model_execution']=='NONE' and act['activation_paid_cost_usd']==0.0
          assert active.read_bytes()==spec.read_bytes()
          assert m['case_checkpoint_script_sha256']==sha(script) and m['case_checkpoint_workflow_sha256']==sha(spec)==sha(active)
          assert b['status']=='SATISFIES_DISPATCH_PRECONDITION_WHEN_CANONICAL'
          assert bound['repair_id']==m['repair_id'] and bound['repair_manifest_sha256']==sha(mp) and bound['case_checkpoint_script_sha256']==sha(script) and bound['active_workflow_sha256']==sha(active)
          for key in ('authority_scope_modified','authority_transfer','retry_authority_created','external_dispatch_authority_created','candidate_expansion','candidate_revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert ab[key] is False, key
          for key in ('retry_authority_created','external_dispatch_authority_created','candidate_expansion','revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert bound[key] is False, key
          assert bound['model_access']=='NONE' and bound['model_execution']=='NONE' and bound['paid_cost_usd']==0.0
          assert d['checkpoint_write_must_succeed_before_completed_state_commit'] is True
          assert d['each_completed_raw_code_case_upload_precedes_next_case'] is True
          assert d['actions_artifacts_are_transient_transport_not_canonical_evidence'] is True
          assert d['canonical_long_term_evidence_store']=='GIT_JSON_REPORTS_MANIFESTS_EVIDENCE'
          assert d['all_checkpoint_artifacts_must_be_canonicalized_to_git_before_dispatch_closeout'] is True
          assert d['missing_or_expired_checkpoint_artifact_fails_closed'] is True
          assert t['maximum_uncheckpointed_raw_code_cases']==1 and t['raw_code_case_order']==['python-clamp','python-dedupe','python-safe-divide']
          text=active.read_text(encoding='utf-8')
          assert "github.event.issue.number == 162" in text
          assert "github.event.comment.user.login == 'TheHalfMoon'" in text
          assert "github.event.comment.author_association == 'OWNER'" in text
          assert "github.event.comment.body == 'B012_RECOVER_RAW_CODE_CASE_CHECKPOINT qwen3.5-0.8b-control 34155931982'" in text
          assert text.count('actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02')==7
          assert '.gguf' not in text and '.safetensors' not in text
          PY

      - name: Mandatory quality gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=colab python -m pytest -q tests/contract/test_b012_executor_binding.py tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py tests/contract/test_b012_qwen_raw_code_recovery.py tests/contract/test_b012_qwen_staged_recovery_topology.py tests/contract/test_b012_runner_shutdown_evidence.py tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check tests/contract/test_b012_executor_binding.py tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py tests/contract/test_b012_qwen_raw_code_recovery.py tests/contract/test_b012_qwen_staged_recovery_topology.py tests/contract/test_b012_runner_shutdown_evidence.py tests/contract/test_b012_stage_checkpoint_topology.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final guarded-merge readiness proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$SUBJECT_BRANCH | cut -f1)" = "$HEAD"
          gh api "repos/$REPO/actions/runs/$QUAL_RUN" > /tmp/q.json
          gh api "repos/$REPO/actions/runs/$REVIEW_RUN" > /tmp/r.json
          jq -e --arg h "$QUAL_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/q.json >/dev/null
          jq -e --arg h "$REVIEW_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h and .run_attempt==1' /tmp/r.json >/dev/null
          gh api "repos/$REPO/pulls/$PR" > /tmp/p.json
          jq -e --arg base "$BASE" --arg head "$HEAD" '.state=="open" and .draft==false and .mergeable==true and .base.sha==$base and .head.sha==$head and .changed_files==10' /tmp/p.json >/dev/null
          echo 'PR198_MANDATORY_PREMERGE=PASS'
