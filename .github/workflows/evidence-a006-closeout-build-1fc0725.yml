name: Build A006 canonical closeout

on:
  push:
    branches:
      - evidence/a006-closeout-build-1fc0725

permissions:
  contents: read

env:
  CANONICAL_MAIN: 1fc07252dcad95c7f1377c76fa8ab9f9da3dd7f2
  CLOSEOUT_HEAD: d5c4967894db47a35551a24ce491537c77729457
  CLOSEOUT_TREE: 8c22b8e1618c3818bb2ce5c505d8641462da9450
  TARGET_BRANCH: docs/000a-a006-canonicalize

jobs:
  build_closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d5c4967894db47a35551a24ce491537c77729457
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact two-file closeout and prospective canonical state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$CLOSEOUT_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$CLOSEOUT_HEAD"
          mapfile -t actual < <(git diff --name-only "$CANONICAL_MAIN" "$CLOSEOUT_HEAD" | sort)
          expected=(
            evidence/mstr-000a/A006-finalizer.md
            specs/001-agent-harness-verified-loop-foundation/tasks.md
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}" | sort)
          grep -Fq -- '- [x] **A006 Implement protected finalizer / verifier boundary.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -Fq '**State:** `COMPLETE_CANONICAL`' evidence/mstr-000a/A006-finalizer.md
          grep -Fq -- '- [ ] **A007 Implement H0 neutral-minimal harness.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          test -z "$(git diff --name-only "$CANONICAL_MAIN" "$CLOSEOUT_HEAD" -- src schemas tests AGENTS.md .specify/memory/constitution.md configs/task-gate)"
      - name: Run prospective closeout quality and state proof
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/unit/test_finalizer.py tests/security/test_finalizer_boundary.py tests/security/test_finalizer_identity_boundary.py tests/security/test_finalizer_post_stop_boundary.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANONICAL_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$CLOSEOUT_HEAD"
          echo "A006_CLOSEOUT_HEAD=$CLOSEOUT_HEAD"
          echo "A006_CLOSEOUT_TREE=$CLOSEOUT_TREE"
          echo "A006_CLOSEOUT_FILES=2"
          echo "EXTERNAL_EFFECT=NONE"
