name: Verify B015 canonical closeout on main

on:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 2cd82ba78bcb886962a163013fa2861d5dd2b013
      PREVIOUS_MAIN: 5104f7ef63ba37caa518868ad89d0f78fe70641f
      CLOSEOUT_HEAD: 230b5ffd02990fe67fee0f2b76002f24ab27f82a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2cd82ba78bcb886962a163013fa2861d5dd2b013
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact signed canonical closeout merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git show -s --format='%P' HEAD)" = "$PREVIOUS_MAIN $CLOSEOUT_HEAD"
          for p in \
            artifacts/decisions/B015-language-target-policy.json \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B015-language-mix.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_b015_language_target_policy.py \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py; do
            test "$(git rev-parse "$EXPECTED_MAIN:$p")" = "$(git rev-parse "$CLOSEOUT_HEAD:$p")"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B015_POSTCLOSEOUT_IDENTITY=PASS'
      - name: Prove terminal state and live frontier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git branch -f main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          if python -m mstr_qualify task eligible B015 > /tmp/b015.json; then exit 1; fi
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          for task in B016 B018 B020 B022 B025; do
            python -m mstr_qualify task eligible "$task" > "/tmp/$task.json"
          done
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json
          import os

          expected = os.environ['EXPECTED_MAIN']
          b15 = json.load(open('/tmp/b015.json'))
          assert b15['canonical_main'] == expected
          assert b15['eligible'] is False
          assert b15['state_consistency_result']['observed_state'] == 'COMPLETE_CANONICAL'
          assert b15['state_consistency_result']['satisfied'] is True
          assert 'task.already_terminal' in b15['reasons']
          for task in ['B016', 'B018', 'B020', 'B022', 'B025']:
              payload = json.load(open(f'/tmp/{task}.json'))
              assert payload['canonical_main'] == expected
              assert payload['eligible'] is True and payload['reasons'] == []
              assert payload['state_consistency_result']['observed_state'] == 'PENDING'
              assert payload['authority_result']['required'] is False
          b11 = json.load(open('/tmp/b011.json'))
          assert b11['canonical_main'] == expected
          assert b11['eligible'] is False
          assert b11['state_consistency_result']['observed_state'] == 'BLOCKED'
          assert b11['authority_result']['required'] is True
          assert b11['authority_result']['satisfied'] is False
          drift = json.load(open('/tmp/drift.json'))
          assert drift['canonical_main'] == expected
          assert drift['status'] == 'clean' and drift['findings'] == []
          print('B015_POSTCLOSEOUT_MACHINE_TRUTH=PASS')
          PY
      - name: Run frozen repository gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_b015_language_target_policy.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
          git diff --check "$PREVIOUS_MAIN...$EXPECTED_MAIN"
          echo 'B015_POSTCLOSEOUT_GATES=PASS'
      - name: Final canonical main recheck
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo 'B015_POSTCLOSEOUT_VERIFICATION=PASS'
          echo 'B016_FRONTIER_READY=PASS'
          echo 'B011_REMAINS_BLOCKED=PASS'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'LARGE_DATASET_INGESTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
