name: Post-merge verification PR 151 B030 v2

on:
  push:
    branches:
      - evidence/pr151-b030-postmerge-v2

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_PREVIOUS_MAIN: 2d19b6296d550b5b60c1b511d71c6ce86a38d195
  EXPECTED_HEAD: 00502aba975e4fa1c2780e5cca1c779fc6b64f27
  EXPECTED_MERGE: 986cdfdaa2ddc64458a7681caf174f3a0e434a1f
  EXPECTED_TREE: 85a5107313597cbf656af16799a961e8c8f10ef5
  PR_NUMBER: '151'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MERGE }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact merge topology and live main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PREVIOUS_MAIN"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_MERGE"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg head "$EXPECTED_HEAD" --arg merge "$EXPECTED_MERGE" '.state == "closed" and .merged == true and .head.sha == $head and .merge_commit_sha == $merge' /tmp/pr.json >/dev/null
          echo 'PR151_MERGE_TOPOLOGY=PASS'

      - name: Verify implementation landed without premature closeout
        shell: bash
        run: |
          set -euo pipefail
          cmp schemas/mstr-repository-health-delta-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-repository-health-delta-v0.schema.json
          grep -F '**State:** `PENDING`' evidence/mstr-000b/B030-long-horizon-quality.md
          grep -F -- '- [ ] **B030 ' specs/002-code-model-supremacy-foundation/tasks.md
          python - <<'PY'
          import json
          data=json.load(open('configs/task-gate/mstr-000b.json', encoding='utf-8'))
          node=data['tasks']['B030']
          assert node['canonical_state'] == 'PENDING'
          print('B030_PREMATURE_CLOSEOUT=NO')
          PY

      - name: Install merged tooling
        run: python -m pip install -e '.[dev]'

      - name: Parse and meta-validate B030 schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          p = Path('schemas/mstr-repository-health-delta-v0.schema.json')
          schema = json.loads(p.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          assert p.read_bytes() == Path('specs/002-code-model-supremacy-foundation/contracts/mstr-repository-health-delta-v0.schema.json').read_bytes()
          print('B030_SCHEMA_PARSE_META=PASS')
          PY

      - name: Focused B030 contract suite
        run: python -m pytest -q tests/contract/test_repository_health_delta_contract.py

      - name: Full test suite
        run: python -m pytest -q

      - name: Ruff
        run: python -m ruff check .

      - name: Canonical mypy
        run: python -m mypy src

      - name: Offline validation
        run: python -m mstr_qualify validate

      - name: Final live main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_MERGE"
          echo 'B030_IMPLEMENTATION_POSTMERGE=PASS'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'HARNESS_EXECUTION=NONE'
          echo 'PAID_COMPUTE=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
          echo 'PRODUCTION_RELEASE=NONE'
