name: PR197 B012 case-checkpoint qualification

on:
  push:
    branches:
      - evidence/pr197-b012-case-checkpoint-qualification-be5dc18

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR_NUMBER: '197'
      BASE_SHA: 2d35efe6d7350f6aa0241ee9de128134cd321f90
      SUBJECT_SHA: be5dc182c7f15602b5da0999ad7f55108233c568
      SUBJECT_TREE: 9a41288f0037a0b6c62b29ce3b6c5d4d7dc4d1d4
      SUBJECT_BRANCH: fix/b012-qwen-raw-code-case-checkpoint-topology
      BUILDER_RUN_ID: '34255366255'
      SCRIPT_SHA256: c1c6269b4a9ee1eae77a568bd0b0c6e1688012e2bff797d3938f68acd63dabd3
      WORKFLOW_SPEC_SHA256: f15941577213c5e96a1ebb3993989693628eae5f2e28620f90e03110d303d127
      RAW_CODE_MANIFEST_SHA256: 038586bb8156add6bb2de8573a9d15d0f1201909c36820a6cc608a2b5d393349
      ACTIVE_WORKFLOW_SHA256: e5a666641af6557efb2aba7091a51db3deef973f6177ab682207a4326d3f4bbe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Reverify immutable PR and builder truth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --output /tmp/pr.json
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BUILDER_RUN_ID" \
            --output /tmp/builder.json
          python - <<'PY'
          import json, os
          pr=json.load(open('/tmp/pr.json', encoding='utf-8'))
          assert pr['number']==int(os.environ['PR_NUMBER'])
          assert pr['state']=='open' and pr['draft'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['BASE_SHA']
          assert pr['head']['ref']==os.environ['SUBJECT_BRANCH']
          assert pr['head']['sha']==os.environ['SUBJECT_SHA']
          assert pr['changed_files']==5
          assert pr['mergeable'] is True
          builder=json.load(open('/tmp/builder.json', encoding='utf-8'))
          assert builder['id']==int(os.environ['BUILDER_RUN_ID'])
          assert builder['status']=='completed' and builder['conclusion']=='success'
          PY

      - name: Verify exact five-file scope and frozen surfaces
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            'artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json' \
            'colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py' \
            'configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml' \
            'evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md' \
            'tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py' | sort)
          [[ "$(git diff --name-only "$BASE_SHA..$SUBJECT_SHA" | sort)" == "$expected" ]]
          git diff --check "$BASE_SHA..$SUBJECT_SHA"
          for path in \
            .github/workflows/b012-qwen-raw-code-recovery.yml \
            artifacts/manifests/B012-executor-toolchain-binding.json \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B012-equivalent-qualification-execution-envelope.json \
            artifacts/manifests/B012-executor-toolchain-lock.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_raw_code.py; do
            [[ "$(git rev-parse "$BASE_SHA:$path")" == "$(git rev-parse "$SUBJECT_SHA:$path")" ]]
          done

      - name: Verify repair hashes and non-authorizing semantics
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_SHA"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          m=json.loads(Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json').read_text(encoding='utf-8'))
          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['base_main']==os.environ['BASE_SHA']
          assert m['candidate_id']=='qwen3.5-0.8b-control'
          assert m['case_checkpoint_script_sha256']==sha(m['case_checkpoint_script_path'])==os.environ['SCRIPT_SHA256']
          assert m['case_checkpoint_workflow_sha256']==sha(m['case_checkpoint_workflow_spec_path'])==os.environ['WORKFLOW_SPEC_SHA256']
          assert m['raw_code_manifest_sha256']==sha(m['raw_code_manifest_path'])==os.environ['RAW_CODE_MANIFEST_SHA256']
          assert sha('.github/workflows/b012-qwen-raw-code-recovery.yml')==m['active_workflow_at_repair_base_sha256']==os.environ['ACTIVE_WORKFLOW_SHA256']
          assert m['topology']['raw_code_case_order']==['python-clamp','python-dedupe','python-safe-divide']
          assert m['topology']['maximum_uncheckpointed_raw_code_cases']==1
          assert m['topology']['durable_upload_after_each_raw_code_case'] is True
          assert m['activation']['active_workflow_materialized'] is False
          assert m['activation']['separate_activation_pr_required'] is True
          assert m['activation']['package_performs_model_access'] is False
          assert m['activation']['package_performs_model_execution'] is False
          assert m['triggering_incident']['run_id']==34231845282
          assert m['triggering_incident']['canonical_incident_postmerge_run_id']==34250328560
          assert m['triggering_incident']['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert m['triggering_incident']['model_quality_verdict']=='NONE'
          assert m['triggering_incident']['candidate_admission_decision']=='NONE'
          for key in ('authority_scope_modified','authority_transfer','retry_authority_created','external_dispatch_authority_created','candidate_expansion','candidate_revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert m['authority_boundary'][key] is False, key
          PY

      - name: Reprove exact-main B012 eligibility
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 > /tmp/eligibility.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/eligibility.json', encoding='utf-8'))
          assert d['schema_version']=='mstr.task-eligibility.v0'
          assert d['task_id']=='B012' and d['canonical_main']==os.environ['BASE_SHA']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['required'] is True
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True and d['authority_result']['reasons']==[]
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert d['supersession_result']['satisfied'] is True
          assert d['state_consistency_result']['satisfied'] is True
          assert d['candidate_pool_result']['satisfied'] is True
          assert all(d['semantic_checks'].values())
          PY

      - name: Reprove exact-head contracts and repository quality
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_SHA"
          python -m pip install -e '.[dev]'
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py

      - name: Verify no new formatter debt
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          set +e
          python -m ruff format --check --diff . > /tmp/base-format.diff 2>&1
          base_code=$?
          set -e
          [[ "$base_code" -eq 0 || "$base_code" -eq 1 ]]
          git checkout --detach "$SUBJECT_SHA"
          set +e
          python -m ruff format --check --diff . > /tmp/subject-format.diff 2>&1
          subject_code=$?
          set -e
          [[ "$subject_code" -eq 0 || "$subject_code" -eq 1 ]]
          python - <<'PY'
          from pathlib import Path
          def changed_paths(path):
              out=set()
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.startswith('--- '): out.add(line[4:].split(':cell ',1)[0])
              return out
          base=changed_paths('/tmp/base-format.diff')
          subject=changed_paths('/tmp/subject-format.diff')
          assert not (subject-base), f'new formatter debt: {sorted(subject-base)}'
          print(f'BASE_FORMAT_DEBT_PATHS={len(base)}')
          print(f'SUBJECT_FORMAT_DEBT_PATHS={len(subject)}')
          print('PR197_EXACT_HEAD_QUALIFICATION=SUCCESS')
          PY

      - name: Final immutable head guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote origin "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --output /tmp/final-pr.json
          python - <<'PY'
          import json, os
          pr=json.load(open('/tmp/final-pr.json', encoding='utf-8'))
          assert pr['state']=='open'
          assert pr['base']['sha']==os.environ['BASE_SHA']
          assert pr['head']['sha']==os.environ['SUBJECT_SHA']
          assert pr['changed_files']==5
          assert pr['mergeable'] is True
          print('FINAL_IMMUTABLE_GUARD=SUCCESS')
          PY
