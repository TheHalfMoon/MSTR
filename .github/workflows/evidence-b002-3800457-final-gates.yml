name: Evidence B002 trust-hardened final head

on:
  push:
    branches:
      - evidence/b002-3800457-final-gates

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 3800457d6073a82a81271de55437ec65abc5fad9
      EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact B002 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact target and live-known canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"
          echo "TARGET_SHA=$(git rev-parse HEAD)"
          echo "CANONICAL_MAIN=$(git rev-parse FETCH_HEAD)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          python --version
          pytest --version
          ruff --version
          mypy --version
          python -c 'import jsonschema; print("jsonschema", jsonschema.__version__)'

      - name: Prove caller-supplied canonical main is removed
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m mstr_qualify task eligible B002 --canonical-main "$TARGET_SHA" >/tmp/task-out.json 2>/tmp/task-err.json
          code=$?
          set -e
          test "$code" -eq 2
          grep -q -- "unrecognized arguments: --canonical-main" /tmp/task-err.json

      - name: Targeted B002 tests
        run: pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Verify immutable exact head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --short)"
          git diff --exit-code
          echo "FINAL_TARGET_SHA=$(git rev-parse HEAD)"
