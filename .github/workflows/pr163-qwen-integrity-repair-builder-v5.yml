name: Repair PR163 Qwen T029 integrity evidence v5

on:
  push:
    branches:
      - evidence/pr163-qwen-integrity-repair-builder-v5-cb4d990

permissions:
  contents: write

env:
  EXPECTED_MAIN: 5cadbd754686ebff6f5327e9746f0b074b35e318
  EXPECTED_TARGET: cb4d9903cdbd1eb721c7437bf611dc8a51d723be
  TARGET_BRANCH: fix/000-t029-recovery-current-main
  BUILDER_COMMIT: 93ff02096bea5d0efe695cd41a3a5a9a9c89632e

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact remote identities before repair
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          TARGET_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$TARGET_SHA" = "$EXPECTED_TARGET"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TARGET }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize fail-closed repair from exact pinned evidence script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BUILDER_COMMIT"
          git show "$BUILDER_COMMIT:.github/scripts/pr163_qwen_integrity_repair_builder_v3.py" > /tmp/builder.py
          python /tmp/builder.py

      - name: Format generated contract test without changing semantic value
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff<1,>=0.12'
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/contract/test_t029_quantization_manifest.py')
          text = path.read_text(encoding='utf-8')
          old = '            "reason": "PRIMARY_ACTIONS_ARTIFACT_RECORDED_INVALID_65_HEX_SHA256_REQUIRES_GOVERNED_REPAIR_EXECUTION",\n'
          new = (
              '            "reason": (\n'
              '                "PRIMARY_ACTIONS_ARTIFACT_RECORDED_INVALID_65_HEX_SHA256_"\n'
              '                "REQUIRES_GOVERNED_REPAIR_EXECUTION"\n'
              '            ),\n'
          )
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          ruff format tests/contract/test_t029_quantization_manifest.py

      - name: Verify exact eight-file repair scope and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git add -N artifacts/manifests/quantization/T029-qwen3.5-2b-historical-provenance.json
          git diff --check "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_MAIN" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          artifacts/manifests/quantization/T029-ministral-recovery-provenance.json
          artifacts/manifests/quantization/T029-q4-profiles.json
          artifacts/manifests/quantization/T029-qwen3.5-2b-historical-provenance.json
          colab/mstr_t029_quantize.py
          evidence/T029-q4-profiles.md
          evidence/T029-runner-recovery.md
          tests/contract/test_t029_quantization_manifest.py
          tests/unit/test_t029_quantize_runner.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Install repository development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Focused T029 integrity tests
        run: python -m pytest -q tests/unit/test_t029_quantize_runner.py tests/contract/test_t029_quantization_manifest.py

      - name: Repository validation
        run: mstr-qualify validate

      - name: Full pytest
        run: python -m pytest -q

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Commit bounded repair locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add \
            artifacts/manifests/quantization/T029-q4-profiles.json \
            artifacts/manifests/quantization/T029-qwen3.5-2b-historical-provenance.json \
            evidence/T029-q4-profiles.md \
            evidence/T029-runner-recovery.md \
            tests/contract/test_t029_quantization_manifest.py
          git commit -m "fix(mstr-000): fail closed invalid T029 qwen hash evidence"

      - name: Guarded fast-forward push to target branch
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          TARGET_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$TARGET_SHA" = "$EXPECTED_TARGET"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
