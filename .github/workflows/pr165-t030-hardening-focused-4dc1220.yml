name: PR165 T030 final hardening focused verification

on:
  push:
    branches:
      - evidence/pr165-t030-hardening-focused-4dc1220

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4dc1220bd6f3b8e14ffa978b363e443c15f1232b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify network and artifact-identity hardening
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/unit/test_runtime_benchmark_cli.py \
            tests/security/test_runtime_benchmark_boundary.py \
            tests/security/test_runtime_profile_alias_boundary.py \
            tests/security/test_runtime_environment_boundary.py \
            tests/integration/test_runtime_adapters.py
          ruff check src/mstr_qualify/runtimes/benchmark_cli.py tests/security/test_runtime_benchmark_boundary.py tests/security/test_runtime_profile_alias_boundary.py tests/security/test_runtime_environment_boundary.py
          mypy
          git diff --check 226609e3a29a5e5d038bbd0e9c744f3ff2877112 4dc1220bd6f3b8e14ffa978b363e443c15f1232b
