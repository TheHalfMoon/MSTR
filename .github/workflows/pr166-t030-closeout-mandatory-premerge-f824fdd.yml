name: PR166 T030 closeout mandatory premerge

on:
  push:
    branches:
      - evidence/pr166-t030-closeout-mandatory-premerge-f824fdd

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: pr166-t030-closeout-mandatory-premerge-f824fdd
  cancel-in-progress: false

env:
  REPO: TheHalfMoon/MSTR
  PR_NUMBER: "166"
  BASE_SHA: 8916fa7138ad56d18452b7a20db9c8cb982648ba
  TARGET_HEAD: f824fdd082457de0542eed703b8e4b7b4edf5002
  TARGET_TREE: c94b97fcdf20a56e2de08db9eab4667ebe632644
  QUALIFICATION_RUN: "33975903756"
  QUALIFICATION_EVIDENCE_HEAD: 06d7d585b533272e297ce6e50ed605977ebf9ab5
  REVIEW_RUN: "33976132142"
  REVIEW_EVIDENCE_HEAD: 33243bb0fa0b39ef7aa1ff209ea0d6468b95fdfe
  REVIEW_SUBMISSION_ID: "5121927896"

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0

      - name: Verify live PR, evidence chain, review state and repository policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" "$TARGET_HEAD")" = "$BASE_SHA"
          git diff --check "$BASE_SHA...$TARGET_HEAD"

          changed="$(git diff --name-only "$BASE_SHA...$TARGET_HEAD" | sort)"
          expected="$(printf '%s\n' docs/canonical/CURRENT_STATE.md evidence/T030-runtime-adapters.md specs/000-universal-laptop-interaction-contract/tasks.md | sort)"
          test "$changed" = "$expected"

          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          pr_number = os.environ['PR_NUMBER']
          target = os.environ['TARGET_HEAD']
          base = os.environ['BASE_SHA']

          def get(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          pr = get(f'https://api.github.com/repos/{repo}/pulls/{pr_number}')
          assert pr['state'] == 'open'
          assert pr['draft'] is False
          assert pr['head']['sha'] == target
          assert pr['base']['sha'] == base
          assert pr['changed_files'] == 3
          assert pr['mergeable'] is not False

          for run_id, evidence_head in [
              (os.environ['QUALIFICATION_RUN'], os.environ['QUALIFICATION_EVIDENCE_HEAD']),
              (os.environ['REVIEW_RUN'], os.environ['REVIEW_EVIDENCE_HEAD']),
          ]:
              run = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
              assert run['status'] == 'completed'
              assert run['conclusion'] == 'success'
              assert run['head_sha'] == evidence_head

          reviews = get(f'https://api.github.com/repos/{repo}/pulls/{pr_number}/reviews?per_page=100')
          assert not any(r['state'] == 'CHANGES_REQUESTED' for r in reviews)
          exact = [r for r in reviews if str(r['id']) == os.environ['REVIEW_SUBMISSION_ID']]
          assert len(exact) == 1
          assert exact[0]['state'] == 'COMMENTED'
          assert exact[0]['commit_id'] == target
          assert 'Findings: NONE' in (exact[0].get('body') or '')

          inline = get(f'https://api.github.com/repos/{repo}/pulls/{pr_number}/comments?per_page=100')
          assert inline == []

          rulesets = get(f'https://api.github.com/repos/{repo}/rulesets')
          assert rulesets == []
          branch = get(f'https://api.github.com/repos/{repo}/branches/main')
          assert branch['commit']['sha'] == base
          assert branch['protected'] is False

          status = get(f'https://api.github.com/repos/{repo}/commits/{target}/status')
          assert status['state'] in {'success', 'pending'}
          assert not any(s['state'] in {'failure', 'error'} for s in status.get('statuses', []))
          checks = get(f'https://api.github.com/repos/{repo}/commits/{target}/check-runs?per_page=100')
          bad = {'failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale'}
          assert not any(c.get('conclusion') in bad for c in checks.get('check_runs', []))
          PY

          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ['GH_TOKEN']
          query = '''query($owner:String!, $name:String!, $number:Int!) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                reviewThreads(first:100) { nodes { isResolved } }
              }
            }
          }'''
          payload = json.dumps({'query': query, 'variables': {'owner': 'TheHalfMoon', 'name': 'MSTR', 'number': 166}}).encode()
          req = urllib.request.Request('https://api.github.com/graphql', data=payload, headers={
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(req) as response:
              data = json.load(response)
          assert 'errors' not in data, data
          threads = data['data']['repository']['pullRequest']['reviewThreads']['nodes']
          assert all(t['isResolved'] for t in threads), threads
          PY

          git show "$QUALIFICATION_EVIDENCE_HEAD:.github/workflows/pr166-t030-closeout-qualification-f824fdd.yml" | grep -F 'TARGET_HEAD: f824fdd082457de0542eed703b8e4b7b4edf5002'
          git show "$REVIEW_EVIDENCE_HEAD:.github/workflows/pr166-t030-closeout-independent-review-f824fdd.yml" | grep -F 'TARGET_HEAD: f824fdd082457de0542eed703b8e4b7b4edf5002'
          test ! -e artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json

  semantics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0

      - name: Verify closeout semantics and bounded authority
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx -- '- [x] T030 [US1] Implement/qualify portable CPU runtime adapters; acceleration is separate bonus data → `src/mstr_qualify/runtimes/<runtime>.py`, `configs/runtimes/*.json`, `tests/integration/test_runtime_adapters.py`, `evidence/T030-runtime-adapters.md`.' specs/000-universal-laptop-interaction-contract/tasks.md
          grep -Fqx -- '- [ ] T031 [US1] Measure 4K/8K/16K artifact/load/memory/paging/prefill/decode behavior → `artifacts/results/local/T031/*.jsonl`, `evidence/T031-local-memory-throughput.md`.' specs/000-universal-laptop-interaction-contract/tasks.md
          grep -F 'T000-T030 = COMPLETE_CANONICAL' docs/canonical/CURRENT_STATE.md
          grep -F 'T031 = NEXT / MATERIAL_EXECUTION_AUTHORITY_AND_EPHEMERAL_ARTIFACT_RECONCILIATION_REQUIRED / NOT_COMPLETE_CANONICAL' docs/canonical/CURRENT_STATE.md
          grep -F 'B012 = PENDING / BLOCKED_BY_EXACT_FOUNDER_AUTHORITY' docs/canonical/CURRENT_STATE.md
          grep -F 'T030_COMPLETE_CANONICAL = YES_ON_CLOSEOUT_MERGE' evidence/T030-runtime-adapters.md
          grep -F 'T031_EXECUTION_AUTHORITY = NOT_CREATED_BY_T030' evidence/T030-runtime-adapters.md
          grep -F 'B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION = ABSENT' evidence/T030-runtime-adapters.md
          test ! -e artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0

      - name: Run mandatory frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q
          ruff check .
          mypy
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"

  final_premerge:
    needs: [governance, semantics, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Final live expected-head authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/branches/main" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")"
          python - "$pr_json" <<'PY'
          import json, os, sys
          pr = json.loads(sys.argv[1])
          assert pr['state'] == 'open'
          assert pr['draft'] is False
          assert pr['head']['sha'] == os.environ['TARGET_HEAD']
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          PY
          test "$main_sha" = "$BASE_SHA"
          echo "MANDATORY_PREMERGE=PASS"
          echo "EXPECTED_HEAD_SHA=$TARGET_HEAD"
          echo "EXPECTED_BASE_SHA=$BASE_SHA"
          echo "T031_EXECUTION_AUTHORITY=NOT_CREATED"
          echo "B012_AUTHORITY=ABSENT"
