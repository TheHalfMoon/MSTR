name: Harden B002 canonical-main trust v2

on:
  push:
    branches:
      - evidence/b002-main-trust-repair-v2

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: 8c0ee4d59f49cea60f5d215ef4c8126775f96118
      EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
      TARGET_BRANCH: feat/000b-b002-task-gate
      SOURCE_BRANCH: evidence/b002-main-trust-repair-v2
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout guarded B002 branch
        uses: actions/checkout@v4
        with:
          ref: feat/000b-b002-task-gate
          fetch-depth: 0

      - name: Verify exact target and main identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main "$SOURCE_BRANCH" "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"

      - name: Apply fail-closed repair script
        shell: bash
        run: |
          set -euo pipefail
          git show "refs/remotes/origin/$SOURCE_BRANCH:.github/scripts/b002_main_trust_repair.py" > /tmp/b002_main_trust_repair.py
          python -m py_compile /tmp/b002_main_trust_repair.py
          python /tmp/b002_main_trust_repair.py
          python - <<'PY'
          from pathlib import Path
          for raw in (
              "src/mstr_qualify/cli.py",
              "src/mstr_qualify/task_gate.py",
              "tests/contract/test_task_gate.py",
              "tests/integration/test_task_gate_cli.py",
          ):
              path = Path(raw)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

      - name: Verify bounded source mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/task_gate.py \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort)"
          test "$actual" = "$expected"
          python -m py_compile \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/task_gate.py \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Run targeted B002 tests
        run: pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Guarded commit and fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/task_gate.py \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py
          test -z "$(git diff --name-only)"
          git commit -m "fix(mstr-000b): remove canonical-main self-attestation"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "NEW_B002_HEAD=$(git rev-parse HEAD)"
