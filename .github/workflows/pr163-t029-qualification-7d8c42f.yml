name: Qualify PR163 T029 recovery exact head

on:
  push:
    branches:
      - evidence/pr163-t029-qualification-7d8c42f

permissions:
  contents: read
  actions: read

env:
  EXPECTED_MAIN: 5cadbd754686ebff6f5327e9746f0b074b35e318
  TARGET_HEAD: 7d8c42f55a9de7ab07a619ce95e1dee5c1dc0a82
  TARGET_BRANCH: fix/000-t029-recovery-current-main
  HISTORICAL_RUN_ID: '33263175072'
  HISTORICAL_JOB_ID: '99232907513'
  ARTIFACT_ID: '9729481097'
  ARTIFACT_ARCHIVE_SHA256: 2ee155799e1e163cd1c0c90290fec2ce7f1a621dbc6f93960cd620c956a006c5
  ARTIFACT_REPORT_SHA256: 120dfabdc328bb7f2adceffd534c651edef57d6dfb9f5dbf0add627f1364b194

jobs:
  identity_scope_provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact remote identities
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          TARGET_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$TARGET_SHA" = "$TARGET_HEAD"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0

      - name: Verify exact seven-file bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_MAIN" "$TARGET_HEAD"
          git diff --name-only "$EXPECTED_MAIN" "$TARGET_HEAD" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          artifacts/manifests/quantization/T029-ministral-recovery-provenance.json
          artifacts/manifests/quantization/T029-q4-profiles.json
          colab/mstr_t029_quantize.py
          evidence/T029-q4-profiles.md
          evidence/T029-runner-recovery.md
          tests/contract/test_t029_quantization_manifest.py
          tests/unit/test_t029_quantize_runner.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test ! -e colab/MSTR_T029_ministral_recovery.ipynb
          test ! -e evidence/T029-colab-recovery.md

      - name: Verify durable historical run, job, artifact, and report identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          run = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/33263175072')
          assert run['conclusion'] == 'failure'
          jobs = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/33263175072/jobs')['jobs']
          job = next(j for j in jobs if j['id'] == 99232907513)
          assert job['name'] == 'ministral_retry'
          assert job['conclusion'] == 'success'
          artifact = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/artifacts/9729481097')
          assert artifact['name'] == 't029-recovery-ministral-3-3b'
          assert artifact['expired'] is False
          assert artifact['digest'] == 'sha256:2ee155799e1e163cd1c0c90290fec2ce7f1a621dbc6f93960cd620c956a006c5'
          PY
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/TheHalfMoon/MSTR/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/t029.zip
          echo "$ARTIFACT_ARCHIVE_SHA256  /tmp/t029.zip" | sha256sum -c -
          unzip -p /tmp/t029.zip t029-ministral-3-3b.json > /tmp/t029-ministral-3-3b.json
          echo "$ARTIFACT_REPORT_SHA256  /tmp/t029-ministral-3-3b.json" | sha256sum -c -

      - name: Verify manifest and provenance semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('artifacts/manifests/quantization/T029-q4-profiles.json').read_text())
          prov = json.loads(Path('artifacts/manifests/quantization/T029-ministral-recovery-provenance.json').read_text())
          report = json.loads(Path('/tmp/t029-ministral-3-3b.json').read_text())
          expected = {
              'granite-4.1-3b','ministral-3-3b','qwen2.5-coder-1.5b','qwen3-4b',
              'qwen3.5-2b','qwen3.5-4b','smollm3-3b','yi-coder-1.5b'
          }
          profiles = manifest['profiles']
          assert {p['candidate_id'] for p in profiles} == expected
          assert len(profiles) == 8
          assert manifest['pending'] == []
          assert manifest['completion_state'] == 'Q4_PROFILE_SET_READY_NOT_T029_COMPLETE_CANONICAL'
          assert all(p['result_classification'] == 'Q4_PROFILE_READY' for p in profiles)
          ministral = next(p for p in profiles if p['candidate_id'] == 'ministral-3-3b')
          assert prov['workflow_run_conclusion'] == 'failure'
          assert prov['material_job_conclusion'] == 'success'
          assert prov['artifact_report_sha256'] == '120dfabdc328bb7f2adceffd534c651edef57d6dfb9f5dbf0add627f1364b194'
          assert report['result_classification'] == 'Q4_PROFILE_READY'
          assert report['model_revision'] == ministral['model_revision'] == prov['model_revision']
          assert report['llama_cpp_commit'] == ministral['llama_cpp_commit'] == prov['llama_cpp_commit']
          assert report['conversion']['gguf_f16_sha256'] == ministral['f16_sha256'] == prov['f16_sha256']
          assert report['conversion']['gguf_f16_size_bytes'] == ministral['f16_size_bytes'] == prov['f16_size_bytes']
          for arm_key, report_key, hash_key, size_key in [
              ('Q4_K_M','Q4_K_M','q4_k_m_sha256','q4_k_m_size_bytes'),
              ('Q4_K_S','Q4_K_S','q4_k_s_sha256','q4_k_s_size_bytes'),
          ]:
              r = report['quantization_arms'][report_key]
              m = ministral['quantization_arms'][arm_key]
              assert r['status'] == 'OK'
              assert r['output_sha256'] == m['output_sha256'] == prov[hash_key]
              assert r['output_size_bytes'] == m['output_size_bytes'] == prov[size_key]
          text = Path('evidence/T029-q4-profiles.md').read_text()
          assert 'T029_COMPLETE_CANONICAL = NO' in text
          assert 'B012_AUTHORITY = NONE' in text
          assert 'K2_AUTHORITY = NONE' in text
          PY

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Focused T029 reconciliation tests
        run: python -m pytest -q tests/unit/test_t029_quantize_runner.py tests/contract/test_t029_quantization_manifest.py
      - name: Offline schema validation
        run: mstr-qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src

  final_immutability:
    needs: [identity_scope_provenance, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Recheck exact remote identities
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)"
          TARGET_SHA="$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN"
          test "$TARGET_SHA" = "$TARGET_HEAD"
