name: Adversarially review exact B009 canonical closeout head

on:
  push:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 4fdb6966c085819e69823136fb5e2cd8c56ba58f
      CLOSEOUT_HEAD: 1b393c045f0a22853fb4f4835b27bcaa255bb1d6
      TARGET_BRANCH: docs/000b-b009-canonicalize
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1b393c045f0a22853fb4f4835b27bcaa255bb1d6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bind exact reviewed head and audit authority containment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$CLOSEOUT_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$CLOSEOUT_HEAD"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          base = '4fdb6966c085819e69823136fb5e2cd8c56ba58f'
          head = '1b393c045f0a22853fb4f4835b27bcaa255bb1d6'
          changed = subprocess.check_output(['git','diff','--name-only',f'{base}...{head}'], text=True).splitlines()
          assert changed == sorted([
              'configs/task-gate/mstr-000b.json',
              'evidence/mstr-000b/B009-compatibility.md',
              'specs/002-code-model-supremacy-foundation/tasks.md',
              'tests/contract/test_task_gate.py',
              'tests/integration/test_task_gate_cli.py',
          ])

          base_catalog = json.loads(subprocess.check_output(['git','show',f'{base}:configs/task-gate/mstr-000b.json'], text=True))
          head_catalog = json.loads(Path('configs/task-gate/mstr-000b.json').read_text())
          assert base_catalog['tasks'].keys() == head_catalog['tasks'].keys()
          for task_id in base_catalog['tasks']:
              if task_id == 'B009':
                  before = dict(base_catalog['tasks'][task_id])
                  after = dict(head_catalog['tasks'][task_id])
                  assert before.pop('canonical_state') == 'PENDING'
                  assert after.pop('canonical_state') == 'COMPLETE_CANONICAL'
                  assert before == after
              else:
                  assert base_catalog['tasks'][task_id] == head_catalog['tasks'][task_id]

          decision_before = subprocess.check_output(['git','show',f'{base}:artifacts/decisions/B009-training-runtime-compatibility.json'], text=True)
          decision_after = Path('artifacts/decisions/B009-training-runtime-compatibility.json').read_text()
          assert decision_before == decision_after

          evidence = Path('evidence/mstr-000b/B009-compatibility.md').read_text()
          forbidden = [
              'MODEL_WEIGHT_ACCESS = AUTHORIZED',
              'MODEL_EXECUTION = AUTHORIZED',
              'TOKENIZER_ARTIFACT_DOWNLOAD = AUTHORIZED',
              'CONVERSION_EXECUTION = AUTHORIZED',
              'QUANTIZATION_EXECUTION = AUTHORIZED',
              'TRAINING_EXECUTION = AUTHORIZED',
              'GATED_TERMS_ACCEPTANCE = AUTHORIZED',
              'PAID_MODEL_API = AUTHORIZED',
              'PAID_COMPUTE = AUTHORIZED',
              'LARGE_DATASET_INGESTION = AUTHORIZED',
              'PRODUCTION_RELEASE = AUTHORIZED',
          ]
          assert not any(token in evidence for token in forbidden)
          print('B009_CLOSEOUT_AUTHORITY_CONTAINMENT=PASS')
          PY
          git diff --check "$EXPECTED_MAIN...$CLOSEOUT_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove B010 fails closed if B009 required artifact disappears
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git branch -f main "$CLOSEOUT_HEAD"
          git update-ref refs/remotes/origin/main "$CLOSEOUT_HEAD"
          mv artifacts/decisions/B009-training-runtime-compatibility.json /tmp/B009-training-runtime-compatibility.json
          if python -m mstr_qualify task eligible B010 > /tmp/b010-missing-artifact.json; then
            echo 'B010 unexpectedly eligible with missing B009 required artifact' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/b010-missing-artifact.json'))
          assert payload['eligible'] is False
          assert 'prerequisite.unsatisfied:B009' in payload['reasons']
          predecessor = payload['prerequisite_results'][0]
          assert predecessor['task_id'] == 'B009'
          assert predecessor['satisfied'] is False
          assert 'prerequisite.required_artifact_missing' in predecessor['reasons']
          exact = 'missing:artifacts/decisions/B009-training-runtime-compatibility.json'
          assert exact in predecessor['reasons']
          print('B009_CLOSEOUT_MISSING_ARTIFACT_FAIL_CLOSED=PASS')
          PY
          mv /tmp/B009-training-runtime-compatibility.json artifacts/decisions/B009-training-runtime-compatibility.json
          git diff --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove B010 fails closed if B009 terminal state and checkbox diverge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('specs/002-code-model-supremacy-foundation/tasks.md')
          text = p.read_text()
          old = '- [x] **B009 Freeze candidate trainability / conversion / runtime compatibility matrix.**\n'
          new = '- [ ] **B009 Freeze candidate trainability / conversion / runtime compatibility matrix.**\n'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))
          PY
          if python -m mstr_qualify task eligible B010 > /tmp/b010-state-divergence.json; then
            echo 'B010 unexpectedly eligible with B009 state/checkbox divergence' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/b010-state-divergence.json'))
          assert payload['eligible'] is False
          assert 'prerequisite.unsatisfied:B009' in payload['reasons']
          predecessor = payload['prerequisite_results'][0]
          assert predecessor['task_id'] == 'B009'
          assert predecessor['satisfied'] is False
          assert predecessor['state_consistency_result']['satisfied'] is False
          print('B009_CLOSEOUT_STATE_DIVERGENCE_FAIL_CLOSED=PASS')
          PY
          git checkout -- specs/002-code-model-supremacy-foundation/tasks.md
          git diff --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run focused review tests and final immutable-ref check
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q tests/contract/test_b009_training_runtime_compatibility.py
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$CLOSEOUT_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$CLOSEOUT_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B009_CLOSEOUT_INDEPENDENT_ADVERSARIAL_REVIEW=PASS'
