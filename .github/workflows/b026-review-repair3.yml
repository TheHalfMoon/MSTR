name: Guard final B026 exact-head review semantics repair

on:
  push:
    branches: [evidence/b026-review-repair3-87d31a1]

permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: read
  statuses: read

env:
  BASE_SHA: 823cd7ec3b4c537876a0795d0f0f8d4bd75acd85
  OLD_HEAD: 87d31a1c6488c80d8c6e35a4aadaf84a42fa20ac
  OLD_TREE: 1b15df29644ba35f2c9ecfa053f7c5195f6b4dd7
  TARGET_BRANCH: feat/000b-b026-research-ladder
  PR_NUMBER: '137'
  QUALIFICATION_RUN: '33641437879'
  QUALIFICATION_BRANCH: evidence/b026-qualify2-87d31a1
  QUALIFICATION_WORKFLOW_HEAD: 35d3fd3fb564a025728c7499757ddb4b8c82589b
  CODERABBIT_REVIEW_ID: PRR_kwDOUCYTYs8AAAABL3Tj7A
  CODERABBIT_RUN_ID: 2914d85c-a8dd-4db3-8d5c-3aef880343e0
  CODERABBIT_STATUS_ID: '53388944096'
  GH_TOKEN: ${{ github.token }}

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify immutable entry and exact review provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$OLD_HEAD"
          git cat-file -e "$OLD_HEAD^{commit}"
          test "$(git rev-parse "$OLD_HEAD^{tree}")" = "$OLD_TREE"

          pr="$(gh api repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER)"
          jq -e --arg base "$BASE_SHA" --arg head "$OLD_HEAD" '
            .state == "open" and .draft == false and .base.sha == $base and
            .head.sha == $head and .commits == 4 and .changed_files == 17
          ' <<<"$pr"

          qualification="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$QUALIFICATION_RUN)"
          test "$(jq -r '.status' <<<"$qualification")" = completed
          test "$(jq -r '.conclusion' <<<"$qualification")" = success
          test "$(jq -r '.head_branch' <<<"$qualification")" = "$QUALIFICATION_BRANCH"
          test "$(jq -r '.head_sha' <<<"$qualification")" = "$QUALIFICATION_WORKFLOW_HEAD"

          reviews="$(gh api repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER/reviews?per_page=100)"
          jq -e --arg id "$CODERABBIT_REVIEW_ID" --arg run "$CODERABBIT_RUN_ID" '
            any(.[];
              .node_id == $id and
              .user.login == "coderabbitai[bot]" and
              (.body | contains("Actionable comments posted: 3")) and
              (.body | contains($run))
            )
          ' <<<"$reviews"

          status="$(gh api repos/${GITHUB_REPOSITORY}/commits/$OLD_HEAD/status)"
          jq -e --argjson status_id "$CODERABBIT_STATUS_ID" '
            any(.statuses[];
              .id == $status_id and .context == "CodeRabbit" and
              .state == "success" and .description == "Review completed"
            )
          ' <<<"$status"

          for spec in \
            '3915326233|`PROMOTE` forbids `NOT_APPLICABLE` gates in both schema copies' \
            '3915326236|Add the four new required fields to the `ResearchExperimentRecordV2` block' \
            '3915326254|Restrict Q4 promotion evidence for non-L4 PROMOTE records'; do
            id="${spec%%|*}"; needle="${spec#*|}"
            comment="$(gh api repos/${GITHUB_REPOSITORY}/pulls/comments/$id)"
            test "$(jq -r '.user.login' <<<"$comment")" = 'coderabbitai[bot]'
            test "$(jq -r '.original_commit_id' <<<"$comment")" = "$OLD_HEAD"
            current_anchor="$(jq -r '.commit_id' <<<"$comment")"
            test "$current_anchor" = "$OLD_HEAD"
            grep -F "$needle" <<<"$(jq -r '.body' <<<"$comment")"
          done

          cp .github/scripts/b026_review_repair3_builder.py /tmp/b026_review_repair3_builder.py
          python -m py_compile /tmp/b026_review_repair3_builder.py
          git checkout --detach "$OLD_HEAD"
          test "$(git rev-parse HEAD)" = "$OLD_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$OLD_TREE"
          test -z "$(git status --porcelain)"

      - name: Build bounded final review repair candidate
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/b026_review_repair3_builder.py
          printf '%s\n' \
            configs/research/mstr-research-ladder-v0.json \
            evidence/mstr-000b/B026-research-ladder.md \
            schemas/mstr-research-experiment-v2.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-research-experiment-v2.schema.json \
            specs/002-code-model-supremacy-foundation/data-model.md \
            src/mstr_qualify/schemas.py \
            tests/contract/test_research_ladder_contract.py \
            tests/integration/test_cli_offline.py | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check
          test -z "$(git diff --name-only -- specs/002-code-model-supremacy-foundation/tasks.md configs/task-gate/mstr-000b.json)"
          test -z "$(git diff --name-only -- artifacts/authorities artifacts/results/research)"
          cmp schemas/mstr-research-experiment-v2.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-research-experiment-v2.schema.json
          cmp schemas/mstr-material-result-identity-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-material-result-identity-v0.schema.json

          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add --pathspec-from-file=/tmp/expected
          git commit -m 'fix(mstr-000b): reconcile final B026 review semantics'
          test "$(git rev-parse HEAD^)" = "$OLD_HEAD"
          test "$(git diff --name-only "$OLD_HEAD...HEAD" | wc -l)" -eq 8
          test -z "$(git status --porcelain)"

      - name: Install development gates
        run: python -m pip install -e '.[dev]'

      - name: Re-prove bounded machine frontier
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          git update-ref refs/heads/main "$candidate"
          git update-ref refs/remotes/origin/main "$candidate"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B026 > /tmp/b026.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0' /tmp/b026.json
          set +e
          mstr-qualify task eligible B027 > /tmp/b027.json; b027_rc=$?
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_rc=$?
          set -e
          test "$b027_rc" -eq 1
          test "$b011_rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING" and ([.prerequisite_results[] | select(.task_id == "B026" and .observed_state == "PENDING" and .satisfied == false)] | length == 1)' /tmp/b027.json
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json

      - name: Focused B026 final review tests
        run: python -m pytest tests/contract/test_research_ladder_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py -q

      - name: Offline schema and explicit CLI validation
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m mstr_qualify validate tests/fixtures/schemas/valid/mstr-material-result-identity-v0.json
          python -m mstr_qualify validate tests/fixtures/schemas/valid/mstr-research-experiment-v2.json
          set +e
          python -m mstr_qualify validate tests/fixtures/schemas/invalid/mstr-material-result-identity-v0.json; material_rc=$?
          python -m mstr_qualify validate tests/fixtures/schemas/invalid/mstr-research-experiment-v2.json; experiment_rc=$?
          set -e
          test "$material_rc" -eq 1
          test "$experiment_rc" -eq 1

      - name: Full pytest
        run: python -m pytest -q

      - name: Ruff
        run: python -m ruff check .

      - name: Strict mypy
        run: python -m mypy src

      - name: Verify repaired semantics and unchanged authority boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '([.levels[] | (.promotion_requires | index("every required hard gate has status PASS") != null)] | all)' configs/research/mstr-research-ladder-v0.json
          jq -e '([.levels[] | (.promotion_requires | index("no hard gate is failed") == null)] | all)' configs/research/mstr-research-ladder-v0.json
          jq -e '."$defs".hard_gate_result.properties.status.enum == ["PASS","FAIL","NOT_APPLICABLE"] and (."$defs".hard_gate_result.properties.status.description | contains("NOT_APPLICABLE is valid only for non-PROMOTE records"))' schemas/mstr-research-experiment-v2.schema.json
          cmp schemas/mstr-research-experiment-v2.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-research-experiment-v2.schema.json
          cmp schemas/mstr-material-result-identity-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-material-result-identity-v0.schema.json
          python - <<'PY'
          from pathlib import Path
          data_model = Path('specs/002-code-model-supremacy-foundation/data-model.md').read_text(encoding='utf-8')
          start = data_model.index('```text\nResearchExperimentRecordV2\n')
          end = data_model.index('\n```', start)
          block = data_model[start:end]
          for field in ('governing_task_id','promoted_result_id_or_na','q4_promotion_record_identity_or_na','governed_effects'):
              if f'- {field}' not in block:
                  raise SystemExit(f'missing data-model field: {field}')
          for phrase in (
              'does not create a cumulative-consumption ledger',
              'future external-effect executor must prove cumulative authority consumption',
          ):
              if phrase not in data_model:
                  raise SystemExit(f'missing authority-consumption boundary: {phrase}')

          schemas = Path('src/mstr_qualify/schemas.py').read_text(encoding='utf-8')
          required = (
              'schema_dir: Path | None = None,',
              'schema_dir=schema_dir,\n                            repository_root=repository_root,',
              'schema_dir=schema_dir,\n                visited_records=_research_visited or frozenset(),',
              'only L4 PROMOTE may bind Q4 promotion evidence',
          )
          missing = [needle for needle in required if needle not in schemas]
          if missing:
              raise SystemExit(f'missing semantic repair markers: {missing}')
          PY
          grep -F 'Fresh exact-head CodeRabbit review findings on `87d31a1c6488c80d8c6e35a4aadaf84a42fa20ac`' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'PRR_kwDOUCYTYs8AAAABL3Tj7A' evidence/mstr-000b/B026-research-ladder.md
          grep -F '2914d85c-a8dd-4db3-8d5c-3aef880343e0' evidence/mstr-000b/B026-research-ladder.md
          grep -F 'These exact-head findings are not considered resolved by this evidence text.' evidence/mstr-000b/B026-research-ladder.md
          for marker in \
            'MODEL_WEIGHT_ACCESS = NONE' \
            'MODEL_EXECUTION = NONE' \
            'RESEARCH_CAMPAIGN_EXECUTION = NONE' \
            'TEST_GENERATION_EXECUTION = NONE' \
            'VERIFIER_EXECUTION = NONE' \
            'TEACHER_API_EXECUTION = NONE' \
            'PAID_MODEL_API = NONE' \
            'PAID_COMPUTE = NONE' \
            'NETWORK_MODEL_OR_TEACHER_CALL = NONE' \
            'LARGE_DATASET_INGESTION = NONE' \
            'PRIVATE_USER_DATA_INGESTION = NONE' \
            'PRODUCTION_TRACE_INGESTION = NONE' \
            'WEIGHT_CHANGING_TRAINING = NONE' \
            'LARGE_SCALE_RL = NONE' \
            'PRODUCTION_RELEASE = NONE'; do
            grep -F "$marker" evidence/mstr-000b/B026-research-ladder.md
          done
          jq -e '.authority_boundary.contract_freeze_only == true and ([.authority_boundary | to_entries[] | select(.key != "contract_freeze_only") | .value] | all(. == false))' configs/research/mstr-research-ladder-v0.json
          test -z "$(git diff --name-only "$BASE_SHA...HEAD" -- specs/002-code-model-supremacy-foundation/tasks.md configs/task-gate/mstr-000b.json artifacts/authorities artifacts/results/research)"

      - name: Guarded fast-forward repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$OLD_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$OLD_HEAD"
          pr="$(gh api repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER)"
          jq -e --arg base "$BASE_SHA" --arg head "$OLD_HEAD" '
            .state == "open" and .draft == false and .base.sha == $base and .head.sha == $head
          ' <<<"$pr"
          git push origin "$candidate:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$candidate"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          echo "B026_FINAL_REVIEW_REPAIRED_HEAD=$candidate"
