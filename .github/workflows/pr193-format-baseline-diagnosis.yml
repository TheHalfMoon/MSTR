name: PR193 canonical format baseline diagnosis

on:
  push:
    branches:
      - evidence/pr193-format-baseline-5e74e77

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Checkout exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          git checkout --detach "$BASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]

      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'

      - name: Capture canonical Ruff format result
        id: format
        shell: bash
        run: |
          set +e
          python -m ruff format --check --diff . > /tmp/ruff-format.txt 2>&1
          code=$?
          set -e
          printf 'exit_code=%s\n' "$code" >> /tmp/ruff-format.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/ruff-format.txt

      - name: Upload canonical Ruff format diagnosis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr193-canonical-format-baseline-${{ github.run_id }}
          path: /tmp/ruff-format.txt
          if-no-files-found: error
          retention-days: 1

      - name: Assert canonical formatting baseline
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.format.outputs.exit_code }}" == "0" ]]
