name: Independent review B006 closeout a9a0dfa

on:
  push:
    branches: [evidence/b006-closeout-review-a9a0dfa]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: c96e2fb228a7f3fb0399484a9e6bb1e1d1eb086c
      EXPECTED_HEAD: a9a0dfac7f1040198c1c0e9dbb0590c578b0d16f
      TARGET_BRANCH: docs/000b-b006-canonicalize
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/000b-b006-canonicalize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adversarial closeout review
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git branch -f main "$EXPECTED_MAIN"
          mapfile -t files < <(git diff --name-only "$EXPECTED_MAIN"..."$EXPECTED_HEAD" | sort)
          test "${#files[@]}" -eq 5
          printf '%s\n' "${files[@]}" | grep -qx 'configs/task-gate/mstr-000b.json'
          printf '%s\n' "${files[@]}" | grep -qx 'evidence/mstr-000b/candidates/B006-candidate-reconciliation.md'
          printf '%s\n' "${files[@]}" | grep -qx 'specs/002-code-model-supremacy-foundation/tasks.md'
          printf '%s\n' "${files[@]}" | grep -qx 'tests/contract/test_task_gate.py'
          printf '%s\n' "${files[@]}" | grep -qx 'tests/integration/test_task_gate_cli.py'
          ! printf '%s\n' "${files[@]}" | grep -Eq '^(src/|artifacts/candidates/|benchmarks/|schemas/)'
          git diff --check "$EXPECTED_MAIN"..."$EXPECTED_HEAD"
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/task-gate/mstr-000b.json').read_text())
          b6=cfg['tasks']['B006']; b7=cfg['tasks']['B007']
          assert b6['canonical_state']=='COMPLETE_CANONICAL'
          assert b6['closeout_rule']['require_all_outputs'] is True
          assert b6['outputs'], b6
          assert b6['evidence_outputs'], b6
          assert b7['canonical_state']=='PENDING'
          assert b7['prerequisites']==['B006']
          cli=Path('tests/integration/test_task_gate_cli.py').read_text()
          b6block=cli.split('def test_task_eligible_b006_terminal_returns_one',1)[1].split('def test_task_eligible_b007_successor_returns_zero',1)[0]
          b7block=cli.split('def test_task_eligible_b007_successor_returns_zero',1)[1].split('def test_task_eligible_configuration_error_returns_two',1)[0]
          assert 'assert task_id == "B006"' in b6block
          assert 'assert task_id == "B007"' in b7block
          contract=Path('tests/contract/test_task_gate.py').read_text()
          assert 'def test_b007_fails_closed_when_b006_candidate_outputs_are_missing' in contract
          assert '"prerequisite.required_artifact_missing"' in contract
          ev=Path('evidence/mstr-000b/candidates/B006-candidate-reconciliation.md').read_text()
          for forbidden in ('MODEL_WEIGHT_ACCESS = AUTHORIZED','TOKENIZER_ARTIFACT_DOWNLOAD = AUTHORIZED','MODEL_EXECUTION = AUTHORIZED','PAID_COMPUTE = AUTHORIZED','B007_MATERIAL_EXECUTION = STARTED'):
              assert forbidden not in ev, forbidden
          for required in ('MODEL_WEIGHT_ACCESS = NONE','TOKENIZER_ARTIFACT_DOWNLOAD = NONE','MODEL_EXECUTION = NONE','PAID_COMPUTE = NONE','NEW_AUTHORITY_CREATED = NO','B007_MATERIAL_EXECUTION = NOT_STARTED'):
              assert required in ev, required
          print('B006_CLOSEOUT_ADVERSARIAL_REVIEW=PASS')
          PY
      - name: Independent behavioral proof and gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python - <<'PY'
          import os
          from mstr_qualify.task_gate import evaluate_task_snapshot
          main=os.environ['EXPECTED_MAIN']
          b6=evaluate_task_snapshot('B006', canonical_main=main)
          b7=evaluate_task_snapshot('B007', canonical_main=main)
          assert b6['eligible'] is False
          assert 'task.already_terminal' in b6['reasons']
          assert b7['eligible'] is True and b7['reasons']==[]
          assert b7['prerequisite_results'][0]['satisfied'] is True
          print('B006_REVIEW_TERMINAL=PASS')
          print('B007_REVIEW_ELIGIBLE=PASS')
          PY
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
      - name: Reviewer immutability
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo B006_CLOSEOUT_INDEPENDENT_REVIEW=PASS
