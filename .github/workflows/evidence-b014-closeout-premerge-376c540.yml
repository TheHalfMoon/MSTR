name: Enforce B014 closeout premerge gate

on:
  push:

permissions:
  contents: read

jobs:
  premerge:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: f6925f3e0d8378fedd6ec1d3aed30b725115e07e
      EXPECTED_HEAD: 376c540d46ea76b7bacd906152afda1260bca17f
      TARGET_BRANCH: docs/000b-b014-canonicalize
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f6925f3e0d8378fedd6ec1d3aed30b725115e07e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebind exact live main and target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git rev-parse "$EXPECTED_HEAD^")" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B014_CLOSEOUT_PREMERGE_IDENTITY=PASS'
      - name: Re-run mandatory B002 gate on exact current main
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git branch -f main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B014 > /tmp/b014-main.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011-main.json; then
            echo 'B011 unexpectedly eligible on current main' >&2
            exit 1
          fi
          python -m mstr_qualify task drift > /tmp/drift-main.json
          python - <<'PY'
          import json, os
          b14=json.load(open('/tmp/b014-main.json'))
          b11=json.load(open('/tmp/b011-main.json'))
          drift=json.load(open('/tmp/drift-main.json'))
          assert b14['canonical_main']==os.environ['EXPECTED_MAIN']
          assert b14['eligible'] is True and b14['reasons']==[]
          assert b14['state_consistency_result']['observed_state']=='PENDING'
          assert b14['authority_result']['required'] is False
          assert not b11['eligible']
          assert b11['state_consistency_result']['observed_state']=='BLOCKED'
          assert b11['authority_result']['required'] is True and b11['authority_result']['satisfied'] is False
          assert drift['status']=='clean' and drift['findings']==[]
          print('B014_CLOSEOUT_EXACT_MAIN_PREMERGE_ELIGIBILITY=PASS')
          PY
      - name: Reconfirm exact closeout candidate truth
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_HEAD"
          git branch -f main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"
          if python -m mstr_qualify task eligible B014 > /tmp/b014-closeout.json; then exit 1; fi
          if python -m mstr_qualify task eligible B011 > /tmp/b011-closeout.json; then exit 1; fi
          for task in B015 B016 B018 B020 B022 B025; do python -m mstr_qualify task eligible "$task" > "/tmp/$task.json"; done
          python -m mstr_qualify task drift > /tmp/drift-closeout.json
          python - <<'PY'
          import json
          b14=json.load(open('/tmp/b014-closeout.json'))
          assert not b14['eligible'] and b14['state_consistency_result']['observed_state']=='COMPLETE_CANONICAL'
          assert 'task.already_terminal' in b14['reasons']
          for task in ['B015','B016','B018','B020','B022','B025']:
              p=json.load(open(f'/tmp/{task}.json'))
              assert p['eligible'] is True and p['reasons']==[]
              assert p['authority_result']['required'] is False
          b11=json.load(open('/tmp/b011-closeout.json'))
          assert not b11['eligible'] and b11['state_consistency_result']['observed_state']=='BLOCKED'
          assert b11['authority_result']['required'] is True and b11['authority_result']['satisfied'] is False
          drift=json.load(open('/tmp/drift-closeout.json'))
          assert drift['status']=='clean' and drift['findings']==[]
          print('B014_CLOSEOUT_CANDIDATE_PREMERGE_TRUTH=PASS')
          PY
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          echo 'B014_CLOSEOUT_PREMERGE_SMOKE=PASS'
      - name: Final immutable remote recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          echo 'B014_CLOSEOUT_PREMERGE=PASS'
          echo 'B011_REMAINS_BLOCKED=PASS'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'LARGE_DATASET_INGESTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
