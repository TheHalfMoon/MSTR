name: B002 hardening v3

on:
  push:
    branches:
      - evidence/b002-hardening-v3

permissions:
  contents: write

env:
  EXPECTED_HEAD: 0f9bd02ee5eb47a63437545ecfe59f596b54dff7
  EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
  TARGET_BRANCH: feat/000b-b002-task-gate
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  harden-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout guarded B002 branch
        uses: actions/checkout@v4
        with:
          ref: feat/000b-b002-task-gate
          fetch-depth: 0

      - name: Verify exact feature and canonical main identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Harden exact-main and binding verification
        shell: python
        run: |
          from pathlib import Path

          gate = Path("src/mstr_qualify/task_gate.py")
          text = gate.read_text(encoding="utf-8")

          old_doc = (
              "The gate reads only repository-local canonical metadata. It never mutates task\n"
              "state, creates authority, contacts a remote service, or infers permission from\n"
              "an identifier alone. The caller is responsible for running the command against\n"
              "the exact canonical-main checkout required by repository governance; the result\n"
              "binds itself to the checked-out Git SHA so that claim is externally verifiable.\n"
          )
          new_doc = (
              "The gate reads only repository-local canonical metadata. It never mutates task\n"
              "state, creates authority, contacts a remote service, or infers permission from\n"
              "an identifier alone. Normal CLI evaluation fails closed unless the checkout is\n"
              "clean and HEAD matches the local canonical main ref; the result then binds to\n"
              "that exact Git SHA. Tests may inject an explicit canonical-main identity.\n"
          )
          if text.count(old_doc) != 1:
              raise SystemExit("task-gate module doc anchor mismatch")
          text = text.replace(old_doc, new_doc, 1)

          regex_anchor = '_HEX40_RE = re.compile(r"^[0-9a-f]{40}$")\n'
          regex_new = regex_anchor + (
              '_BINDING_ID_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$")\n'
          )
          if text.count(regex_anchor) != 1:
              raise SystemExit("binding regex anchor mismatch")
          text = text.replace(regex_anchor, regex_new, 1)

          catalog_anchor = (
              '    path = (catalog_path or (root / "configs" / "task-gate" / "mstr-000b.json")).resolve()\n'
              '    raw = _read_json_object(path, code="task_gate.catalog")\n'
          )
          catalog_new = (
              '    path = (catalog_path or (root / "configs" / "task-gate" / "mstr-000b.json")).resolve()\n'
              '    try:\n'
              '        path.relative_to(root)\n'
              '    except ValueError as exc:\n'
              '        raise QualificationError(\n'
              '            "task catalog must remain inside the repository",\n'
              '            code="task_gate.catalog_outside_repository",\n'
              '            details={"path": str(path), "root": str(root)},\n'
              '        ) from exc\n'
              '    raw = _read_json_object(path, code="task_gate.catalog")\n'
          )
          if text.count(catalog_anchor) != 1:
              raise SystemExit("catalog confinement anchor mismatch")
          text = text.replace(catalog_anchor, catalog_new, 1)

          start = text.index("def _git_head(root: Path) -> str:\n")
          end = text.index("\ndef _node_sha256", start)
          git_block = '''def _run_git(root: Path, *args: str) -> subprocess.CompletedProcess[str]:
              try:
                  return subprocess.run(
                      ["git", *args],
                      cwd=root,
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=10,
                  )
              except (OSError, subprocess.SubprocessError) as exc:
                  raise QualificationError(
                      "unable to inspect repository Git state",
                      code="task_gate.git_unavailable",
                      details={"root": str(root), "args": list(args)},
                  ) from exc


          def _git_head(root: Path) -> str:
              completed = _run_git(root, "rev-parse", "HEAD")
              value = completed.stdout.strip().lower()
              if completed.returncode != 0 or not _HEX40_RE.fullmatch(value):
                  raise QualificationError(
                      "current Git HEAD is not a 40-hex commit identity",
                      code="task_gate.git_head_invalid",
                      details={"returncode": completed.returncode, "value": value},
                  )
              return value


          def _git_ref(root: Path, ref: str) -> str | None:
              completed = _run_git(root, "rev-parse", "--verify", "--quiet", ref)
              if completed.returncode != 0:
                  return None
              value = completed.stdout.strip().lower()
              if not _HEX40_RE.fullmatch(value):
                  raise QualificationError(
                      "canonical main ref is not a 40-hex commit identity",
                      code="task_gate.main_ref_invalid",
                      details={"ref": ref, "value": value},
                  )
              return value


          def _require_canonical_main_checkout(root: Path, head: str) -> None:
              canonical = _git_ref(root, "refs/remotes/origin/main")
              if canonical is None:
                  canonical = _git_ref(root, "refs/heads/main")
              if canonical is None:
                  raise QualificationError(
                      "no local canonical main ref is available",
                      code="task_gate.main_ref_missing",
                      details={"root": str(root)},
                  )
              if head != canonical:
                  raise QualificationError(
                      "task eligibility must run at the local canonical main commit",
                      code="task_gate.not_canonical_main",
                      details={"head": head, "canonical_main": canonical},
                  )
              status = _run_git(root, "status", "--porcelain=v1", "--untracked-files=all")
              if status.returncode != 0:
                  raise QualificationError(
                      "unable to verify clean canonical checkout",
                      code="task_gate.git_status",
                      details={"returncode": status.returncode},
                  )
              if status.stdout.strip():
                  raise QualificationError(
                      "task eligibility refuses a dirty canonical checkout",
                      code="task_gate.dirty_checkout",
                      details={"entries": status.stdout.splitlines()},
                  )
          '''
          import textwrap
          git_block = textwrap.dedent(git_block)
          text = text[:start] + git_block + text[end:]

          authority_start = text.index(
              "def _authority_observed(root: Path, task_id: str, effect: str, authority_id: str) -> bool:\n"
          )
          authority_end = text.index("\ndef _candidate_pool_observed", authority_start)
          authority_block = '''def _authority_observed(root: Path, task_id: str, effect: str, authority_id: str) -> bool:
              """Verify one existing canonical authority envelope; never create authority."""

              if not _BINDING_ID_RE.fullmatch(authority_id):
                  return False
              path = root / "artifacts" / "authorities" / f"{authority_id}.json"
              if not path.is_file():
                  return False
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return False
              scope = data.get("scope") if isinstance(data, dict) else None
              ceiling = data.get("cost_resource_ceiling") if isinstance(data, dict) else None
              return bool(
                  isinstance(data, dict)
                  and data.get("authority_id") == authority_id
                  and data.get("task_id") == task_id
                  and data.get("external_effect_class") == effect
                  and data.get("status") == "AUTHORIZED_CANONICAL"
                  and isinstance(scope, dict)
                  and bool(scope)
                  and isinstance(ceiling, dict)
                  and bool(ceiling)
              )
          '''
          authority_block = textwrap.dedent(authority_block)
          text = text[:authority_start] + authority_block + text[authority_end:]

          pool_anchor = (
              "def _candidate_pool_observed(root: Path, requirement_id: str) -> bool:\n"
              '    path = root / "artifacts" / "decisions" / f"{requirement_id}.json"\n'
          )
          pool_new = (
              "def _candidate_pool_observed(root: Path, requirement_id: str) -> bool:\n"
              "    if not _BINDING_ID_RE.fullmatch(requirement_id):\n"
              "        return False\n"
              '    path = root / "artifacts" / "decisions" / f"{requirement_id}.json"\n'
          )
          if text.count(pool_anchor) != 1:
              raise SystemExit("candidate-pool safe-id anchor mismatch")
          text = text.replace(pool_anchor, pool_new, 1)

          evaluate_anchor = '''    catalog = load_task_catalog(catalog_path, repository_root=repository_root)
              node = catalog.nodes.get(task_id)
              if node is None:
                  raise QualificationError(
                      "unknown task id",
                      code="task_gate.task_unknown",
                      details={"task_id": task_id, "known": sorted(catalog.nodes)},
                  )
              main_sha = canonical_main or _git_head(catalog.repository_root)
              if not _HEX40_RE.fullmatch(main_sha):
                  raise QualificationError(
                      "canonical main identity must be 40 lowercase hex",
                      code="task_gate.canonical_main_invalid",
                      details={"value": main_sha},
                  )
          '''
          evaluate_anchor = textwrap.dedent(evaluate_anchor).replace("\n", "\n    ", 1)
          # Build this anchor explicitly to avoid indentation ambiguity.
          evaluate_anchor = (
              '    catalog = load_task_catalog(catalog_path, repository_root=repository_root)\n'
              '    node = catalog.nodes.get(task_id)\n'
              '    if node is None:\n'
              '        raise QualificationError(\n'
              '            "unknown task id",\n'
              '            code="task_gate.task_unknown",\n'
              '            details={"task_id": task_id, "known": sorted(catalog.nodes)},\n'
              '        )\n'
              '    main_sha = canonical_main or _git_head(catalog.repository_root)\n'
              '    if not _HEX40_RE.fullmatch(main_sha):\n'
              '        raise QualificationError(\n'
              '            "canonical main identity must be 40 lowercase hex",\n'
              '            code="task_gate.canonical_main_invalid",\n'
              '            details={"value": main_sha},\n'
              '        )\n'
          )
          evaluate_new = (
              '    root = (repository_root or _REPOSITORY_ROOT).resolve()\n'
              '    if canonical_main is None:\n'
              '        main_sha = _git_head(root)\n'
              '        _require_canonical_main_checkout(root, main_sha)\n'
              '    else:\n'
              '        main_sha = canonical_main\n'
              '    if not _HEX40_RE.fullmatch(main_sha):\n'
              '        raise QualificationError(\n'
              '            "canonical main identity must be 40 lowercase hex",\n'
              '            code="task_gate.canonical_main_invalid",\n'
              '            details={"value": main_sha},\n'
              '        )\n'
              '    catalog = load_task_catalog(catalog_path, repository_root=root)\n'
              '    node = catalog.nodes.get(task_id)\n'
              '    if node is None:\n'
              '        raise QualificationError(\n'
              '            "unknown task id",\n'
              '            code="task_gate.task_unknown",\n'
              '            details={"task_id": task_id, "known": sorted(catalog.nodes)},\n'
              '        )\n'
          )
          if text.count(evaluate_anchor) != 1:
              raise SystemExit("evaluate exact-main anchor mismatch")
          text = text.replace(evaluate_anchor, evaluate_new, 1)
          gate.write_text(text, encoding="utf-8")

          tests = Path("tests/contract/test_task_gate.py")
          test_text = tests.read_text(encoding="utf-8")
          if "import subprocess\n" not in test_text:
              test_text = test_text.replace("import json\n", "import json\nimport subprocess\n", 1)
          additions = r'''

          def _git(tmp_path: Path, *args: str) -> None:
              subprocess.run(
                  ["git", *args],
                  cwd=tmp_path,
                  check=True,
                  capture_output=True,
                  text=True,
              )


          def test_catalog_path_cannot_escape_repository(tmp_path: Path) -> None:
              root = tmp_path / "repo"
              root.mkdir()
              outside = tmp_path / "outside.json"
              outside.write_text("{}", encoding="utf-8")

              with pytest.raises(QualificationError) as captured:
                  load_task_catalog(outside, repository_root=root)

              assert captured.value.code == "task_gate.catalog_outside_repository"


          def test_unsafe_authority_id_cannot_traverse_artifact_directory(tmp_path: Path) -> None:
              catalog_path = _write_minimal_catalog(tmp_path, b001_checked=True)
              data = json.loads(catalog_path.read_text(encoding="utf-8"))
              data["tasks"]["B002"].update(
                  {
                      "external_effect_class": "PAID_COMPUTE",
                      "required_authority_id": "../escape",
                  }
              )
              catalog_path.write_text(json.dumps(data), encoding="utf-8")
              escaped = tmp_path / "artifacts" / "escape.json"
              escaped.parent.mkdir(parents=True)
              escaped.write_text(
                  json.dumps(
                      {
                          "authority_id": "../escape",
                          "task_id": "B002",
                          "external_effect_class": "PAID_COMPUTE",
                          "status": "AUTHORIZED_CANONICAL",
                          "scope": {"executor": "fixture"},
                          "cost_resource_ceiling": {"usd_max": 1},
                      }
                  ),
                  encoding="utf-8",
              )

              result = evaluate_task_eligibility(
                  "B002",
                  repository_root=tmp_path,
                  catalog_path=catalog_path,
                  canonical_main=_CANONICAL_MAIN,
              )

              assert result["eligible"] is False
              assert result["authority_result"]["satisfied"] is False
              assert "authority.canonical_envelope_missing_or_invalid" in result["reasons"]


          def test_authority_requires_scope_and_cost_resource_ceiling(tmp_path: Path) -> None:
              catalog_path = _write_minimal_catalog(tmp_path, b001_checked=True)
              data = json.loads(catalog_path.read_text(encoding="utf-8"))
              data["tasks"]["B002"].update(
                  {
                      "external_effect_class": "PAID_COMPUTE",
                      "required_authority_id": "AUTH-B002",
                  }
              )
              catalog_path.write_text(json.dumps(data), encoding="utf-8")
              authority = tmp_path / "artifacts" / "authorities" / "AUTH-B002.json"
              authority.parent.mkdir(parents=True)
              envelope = {
                  "authority_id": "AUTH-B002",
                  "task_id": "B002",
                  "external_effect_class": "PAID_COMPUTE",
                  "status": "AUTHORIZED_CANONICAL",
                  "scope": {"executor": "fixture"},
              }
              authority.write_text(json.dumps(envelope), encoding="utf-8")

              missing_ceiling = evaluate_task_eligibility(
                  "B002",
                  repository_root=tmp_path,
                  catalog_path=catalog_path,
                  canonical_main=_CANONICAL_MAIN,
              )
              assert missing_ceiling["eligible"] is False

              envelope["cost_resource_ceiling"] = {"usd_max": 0, "wall_minutes_max": 1}
              authority.write_text(json.dumps(envelope), encoding="utf-8")
              complete = evaluate_task_eligibility(
                  "B002",
                  repository_root=tmp_path,
                  catalog_path=catalog_path,
                  canonical_main=_CANONICAL_MAIN,
              )
              assert complete["eligible"] is True


          def test_unsafe_candidate_pool_id_cannot_traverse_decision_directory(tmp_path: Path) -> None:
              catalog_path = _write_minimal_catalog(tmp_path, b001_checked=True)
              data = json.loads(catalog_path.read_text(encoding="utf-8"))
              data["tasks"]["B002"].update(
                  {
                      "candidate_dependent": True,
                      "candidate_pool_requirement_id": "../escape",
                  }
              )
              catalog_path.write_text(json.dumps(data), encoding="utf-8")
              escaped = tmp_path / "artifacts" / "escape.json"
              escaped.parent.mkdir(parents=True)
              escaped.write_text(
                  json.dumps(
                      {
                          "candidate_pool_id": "../escape",
                          "stable_pool": True,
                      }
                  ),
                  encoding="utf-8",
              )

              result = evaluate_task_eligibility(
                  "B002",
                  repository_root=tmp_path,
                  catalog_path=catalog_path,
                  canonical_main=_CANONICAL_MAIN,
              )

              assert result["eligible"] is False
              assert result["candidate_pool_result"]["satisfied"] is False
              assert "candidate_pool.canonical_decision_missing_or_invalid" in result["reasons"]


          def test_real_evaluation_requires_clean_local_canonical_main(tmp_path: Path) -> None:
              catalog_path = _write_minimal_catalog(tmp_path, b001_checked=True)
              _git(tmp_path, "init", "-b", "main")
              _git(tmp_path, "config", "user.name", "B002 Test")
              _git(tmp_path, "config", "user.email", "b002@example.invalid")
              _git(tmp_path, "add", ".")
              _git(tmp_path, "commit", "-m", "fixture main")

              on_main = evaluate_task_eligibility(
                  "B002",
                  repository_root=tmp_path,
                  catalog_path=catalog_path,
              )
              assert on_main["eligible"] is True

              _git(tmp_path, "switch", "-c", "feature")
              (tmp_path / "feature.txt").write_text("feature\n", encoding="utf-8")
              _git(tmp_path, "add", "feature.txt")
              _git(tmp_path, "commit", "-m", "feature commit")
              with pytest.raises(QualificationError) as branch_error:
                  evaluate_task_eligibility(
                      "B002",
                      repository_root=tmp_path,
                      catalog_path=catalog_path,
                  )
              assert branch_error.value.code == "task_gate.not_canonical_main"

              _git(tmp_path, "switch", "main")
              with catalog_path.open("a", encoding="utf-8") as handle:
                  handle.write("\n")
              with pytest.raises(QualificationError) as dirty_error:
                  evaluate_task_eligibility(
                      "B002",
                      repository_root=tmp_path,
                      catalog_path=catalog_path,
                  )
              assert dirty_error.value.code == "task_gate.dirty_checkout"
          '''
          additions = textwrap.dedent(additions)
          if "test_real_evaluation_requires_clean_local_canonical_main" in test_text:
              raise SystemExit("hardening tests already present")
          tests.write_text(test_text.rstrip() + additions + "\n", encoding="utf-8")

          evidence = Path("evidence/mstr-000b/B002-task-gate.md")
          evidence_text = evidence.read_text(encoding="utf-8")
          marker = "## Qualification state\n"
          hardening = '''## Canonical-checkout and binding hardening

          Normal CLI evaluation now requires a clean checkout whose HEAD equals the local canonical main ref (`origin/main` when available, otherwise local `main`). A dirty tree or non-main commit is a configuration error, so uncommitted checkbox/evidence edits or feature-branch state cannot be presented as exact-main eligibility evidence. The resulting SHA must still be reconciled with live GitHub main by merge governance before a material action.

          Catalog overrides used by the Python API must resolve inside the repository. Authority and candidate-pool binding IDs are filename-safe before they are mapped to repository artifacts, preventing traversal through an identifier. A gated authority envelope is accepted only when it binds the exact task/effect, is `AUTHORIZED_CANONICAL`, has a non-empty structured `scope`, and has a non-empty structured `cost_resource_ceiling`; the gate never manufactures or widens either field.

          '''
          hardening = textwrap.dedent(hardening)
          if evidence_text.count(marker) != 1:
              raise SystemExit("B002 evidence qualification marker mismatch")
          evidence.write_text(evidence_text.replace(marker, hardening + marker, 1), encoding="utf-8")

      - name: Verify hardening mutation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' evidence/mstr-000b/B002-task-gate.md src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py | sort)"
          test "$actual" = "$expected"

      - name: Commit candidate before clean-checkout tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/mstr-000b/B002-task-gate.md src/mstr_qualify/task_gate.py tests/contract/test_task_gate.py
          git commit -m "fix(mstr-000b): harden B002 canonical task gate"
          test -z "$(git status --short)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify hardened B002 candidate
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy
          python -m mstr_qualify validate
          set +e
          python -m mstr_qualify task eligible B002 >/tmp/b002.out 2>/tmp/b002.err
          code=$?
          set -e
          test "$code" = "2"
          test ! -s /tmp/b002.out
          grep -F '"code": "task_gate.not_canonical_main"' /tmp/b002.err

      - name: Push only fully verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "NEW_B002_HEAD=$(git rev-parse HEAD)"
