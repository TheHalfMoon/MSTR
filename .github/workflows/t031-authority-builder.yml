name: t031-authority-builder

on:
  push:
    branches:
      - builder/t031-authority-capture-20260905

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_MAIN: e5e47644fb7122cbb47b43cdf13d072f82ebfdf7
      TARGET_BRANCH: governance/t031-founder-authority-exact-t029-candidates
      AUTHORITY_COMMENT_ID: "5553875809"
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository quality dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify exact canonical entry and target absence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target branch already exists" >&2
            exit 1
          fi
          git checkout --detach "$EXPECTED_MAIN"
          test -z "$(git status --porcelain)"

      - name: Materialize exact T031 authority and bounded pre-dispatch envelope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          base = os.environ["EXPECTED_MAIN"]
          comment_id = int(os.environ["AUTHORITY_COMMENT_ID"])

          def raw_sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def load(path: str) -> dict[str, object]:
              payload = json.loads((root / path).read_text(encoding="utf-8"))
              assert isinstance(payload, dict)
              return payload

          def write_json(path: str, payload: dict[str, object]) -> str:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              return raw_sha(target)

          t027_path = "artifacts/manifests/T027-weight-access.json"
          addendum_path = "artifacts/manifests/T028-network-scope-addendum.json"
          t029_path = "artifacts/manifests/quantization/T029-q4-profiles.json"
          runtime_path = "configs/runtimes/llama-cpp-cpu.json"
          t027 = load(t027_path)
          addendum = load(addendum_path)
          t029 = load(t029_path)
          runtime = load(runtime_path)

          expected_ids = [
              "granite-4.1-3b",
              "ministral-3-3b",
              "qwen2.5-coder-1.5b",
              "qwen3-4b",
              "qwen3.5-2b",
              "qwen3.5-4b",
              "smollm3-3b",
              "yi-coder-1.5b",
          ]
          profiles = t029["profiles"]
          assert isinstance(profiles, list)
          profile_by_id = {row["candidate_id"]: row for row in profiles}
          assert set(profile_by_id) == set(expected_ids)
          assert len(profile_by_id) == 8
          assert t029.get("pending") == []

          source_rows = t027["candidates"]
          assert isinstance(source_rows, list)
          source_by_id = {row["candidate_id"]: row for row in source_rows}
          assert set(source_by_id) == set(expected_ids)

          candidate_sources: list[dict[str, object]] = []
          aggregate_download = 0
          model_hosts: set[str] = set()
          for candidate_id in expected_ids:
              row = source_by_id[candidate_id]
              profile = profile_by_id[candidate_id]
              aggregate_download += int(row["expected_total_download_bytes"])
              model_hosts.update(str(host) for host in row["network_hosts_required_for_acquisition"])
              candidate_sources.append(
                  {
                      "candidate_id": candidate_id,
                      "exact_model_id": row["exact_model_id"],
                      "exact_revision": row["exact_revision"],
                      "required_artifact_files": row["required_artifact_files"],
                      "expected_file_integrity": row["expected_file_integrity"],
                      "expected_total_download_bytes": row["expected_total_download_bytes"],
                      "authentication_required": row["authentication_required"],
                      "account_required": row["account_required"],
                      "gated_access": row["gated_access"],
                      "terms_acceptance_required": row["terms_acceptance_required"],
                      "license_identity": row["license_identity"],
                      "q4_profile": profile,
                  }
              )

          added_hosts = addendum["added_hosts"]
          assert isinstance(added_hosts, list)
          model_hosts.update(str(host) for host in added_hosts)
          model_hosts.add("huggingface.co")

          quant_commits = {row["llama_cpp_commit"] for row in profiles}
          recipes = {row["conversion_recipe"] for row in profiles}
          assert quant_commits == {"fc35562ba46fbbf8e30cac85edbb39642c37d248"}
          assert recipes == {"convert_hf_to_gguf.py --outtype f16"}
          assert runtime["runtime_id"] == "llama.cpp-llama-bench-cpu"
          assert runtime["upstream_revision"] == "3173a56471c1753650cd806694145ffd6dcace67"

          envelope_path = "artifacts/manifests/T031-local-measurement-execution-envelope.json"
          envelope: dict[str, object] = {
              "schema_version": "mstr.t031-local-measurement-execution-envelope.v1",
              "task_id": "T031",
              "authority_id": "T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION",
              "founder_decision": "FOUNDER_T031_LOCAL_MEASUREMENT_DECISION=AUTHORIZE_EXACT_T029_CANDIDATES",
              "decision_surface": {"issue": 167, "comment_id": comment_id},
              "canonical_entry_main": base,
              "candidate_ids": expected_ids,
              "source_identity": {
                  "t027_manifest": {"path": t027_path, "sha256": raw_sha(root / t027_path)},
                  "t028_network_addendum": {
                      "path": addendum_path,
                      "sha256": raw_sha(root / addendum_path),
                  },
                  "candidate_sources": candidate_sources,
              },
              "q4_identity": {
                  "t029_profile_manifest": {"path": t029_path, "sha256": raw_sha(root / t029_path)},
                  "llama_cpp_commit": "fc35562ba46fbbf8e30cac85edbb39642c37d248",
                  "conversion_recipe": "convert_hf_to_gguf.py --outtype f16",
                  "required_arms": ["Q4_K_M", "Q4_K_S"],
              },
              "runtime_identity": {
                  "profile": {"path": runtime_path, "sha256": raw_sha(root / runtime_path)},
                  "runtime_id": runtime["runtime_id"],
                  "llama_cpp_commit": runtime["upstream_revision"],
                  "device": "none",
                  "gpu_layers": 0,
              },
              "measurement_contract": {
                  "contexts": [4096, 8192, 16384],
                  "measurements": [
                      "artifact_bytes",
                      "load_behavior",
                      "memory_behavior",
                      "paging_behavior",
                      "prefill_behavior",
                      "decode_behavior",
                  ],
                  "durable_result_glob": "artifacts/results/local/T031/*.jsonl",
                  "evidence_path": "evidence/T031-local-memory-throughput.md",
              },
              "runner_envelope": {
                  "provider": "GITHUB_ACTIONS",
                  "runner_class": "GITHUB_HOSTED_EPHEMERAL",
                  "runs_on": "ubuntu-24.04",
                  "max_parallel_candidates": 1,
                  "max_job_minutes": 120,
                  "founder_machine_model_binaries": 0,
                  "git_model_binaries": 0,
              },
              "resource_ceiling": {
                  "paid_cost_usd": 0.0,
                  "aggregate_required_source_download_bytes": aggregate_download,
                  "gpu_layers": 0,
                  "paid_compute": False,
                  "paid_model_api": False,
              },
              "model_artifact_network": {
                  "hosts": sorted(model_hosts),
                  "https_get_only": True,
                  "abort_on_authentication_requirement": True,
                  "abort_on_payment": True,
                  "abort_on_gated_terms": True,
                  "abort_on_unlisted_redirect": True,
              },
              "allowed_operations": [
                  "REACQUIRE_EXACT_T027_INPUTS_FOR_EIGHT_T029_CANDIDATES",
                  "VERIFY_EVERY_ACQUIRED_ARTIFACT",
                  "REGENERATE_EXACT_T029_F16_AND_Q4_IDENTITIES_OR_FAIL_CLOSED",
                  "EXECUTE_T030_PORTABLE_CPU_RUNTIME_FOR_T031_MEASUREMENTS",
                  "RETAIN_REVIEWED_JSONL_JSON_MARKDOWN_MANIFEST_RESULTS_ONLY",
              ],
              "prohibited_operations": [
                  "B010_OR_B012_CANDIDATES",
                  "NEW_CANDIDATES",
                  "CANDIDATE_REVISION_OR_FILE_EXPANSION",
                  "T032_EXECUTION",
                  "T033_EXECUTION",
                  "T034_ADMISSION_DECISION",
                  "WEIGHT_CHANGING_TRAINING",
                  "TRAINING",
                  "LARGE_SCALE_RL",
                  "LARGE_OR_PRIVATE_DATASET_INGESTION",
                  "PAID_COMPUTE",
                  "PAID_MODEL_API",
                  "GATED_TERMS_ACCEPTANCE",
                  "ACCOUNT_REQUIRED_MODEL_ACCESS",
                  "PRODUCTION_RELEASE",
                  "GIT_MODEL_BINARIES",
                  "FOUNDER_MACHINE_MODEL_BINARIES",
              ],
              "toolchain_provisioning": {
                  "state": "BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING",
                  "reason": (
                      "Historical T029 regeneration provisioning is not silently reused. "
                      "A bounded executor must pin toolchain acquisition hosts/revisions, thread "
                      "ceilings, cleanup behavior, and fail-closed checks before dispatch."
                  ),
              },
              "dispatch_state": "BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING",
              "durable_outputs_only": True,
          }
          envelope_sha = write_json(envelope_path, envelope)

          authority_path = "artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json"
          authority: dict[str, object] = {
              "authority_id": "T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION",
              "cost_resource_ceiling": {
                  "cost_model": "exact-t029-zero-usd-local-measurement-regeneration",
                  "limits": [
                      {"max": 0.0, "resource": "cost", "unit": "USD"},
                      {
                          "max": aggregate_download,
                          "resource": "aggregate_required_source_download_bytes",
                          "unit": "bytes",
                      },
                  ],
              },
              "external_effect_class": "MODEL_WEIGHT_ACCESS",
              "scope": {
                  "candidate_ids": expected_ids,
                  "decision": "FOUNDER_T031_LOCAL_MEASUREMENT_DECISION=AUTHORIZE_EXACT_T029_CANDIDATES",
                  "decision_surface": {"issue": 167, "comment_id": comment_id},
                  "bounded_execution_envelope": {
                      "path": envelope_path,
                      "sha256": envelope_sha,
                      "dispatch_state": envelope["dispatch_state"],
                  },
                  "allowed_operations": envelope["allowed_operations"],
                  "b010_b012_candidates": False,
                  "new_candidates": False,
                  "candidate_revision_or_file_expansion": False,
                  "t032_execution": False,
                  "t033_execution": False,
                  "t034_admission_decision": False,
                  "founder_machine_large_artifacts": 0,
                  "git_model_binaries": False,
                  "paid_compute": False,
                  "paid_model_api": False,
                  "gated_terms_acceptance": False,
                  "large_dataset_ingestion": False,
                  "production_release": False,
                  "weight_changing_training": False,
                  "training": False,
              },
              "status": "AUTHORIZED_CANONICAL",
              "task_id": "T031",
          }
          write_json(authority_path, authority)

          contract = root / "tests/contract/test_t031_authority.py"
          contract.write_text(
              '''from __future__ import annotations\n\nimport hashlib\nimport json\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nAUTHORITY = ROOT / "artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json"\nENVELOPE = ROOT / "artifacts/manifests/T031-local-measurement-execution-envelope.json"\n\n\ndef _load(path: Path) -> dict[str, object]:\n    payload = json.loads(path.read_text(encoding="utf-8"))\n    assert isinstance(payload, dict)\n    return payload\n\n\ndef _sha(path: Path) -> str:\n    return hashlib.sha256(path.read_bytes()).hexdigest()\n\n\ndef test_t031_authority_binds_exact_founder_decision_and_eight_t029_candidates() -> None:\n    authority = _load(AUTHORITY)\n    scope = authority["scope"]\n    assert isinstance(scope, dict)\n    assert authority["authority_id"] == "T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION"\n    assert authority["task_id"] == "T031"\n    assert authority["status"] == "AUTHORIZED_CANONICAL"\n    assert scope["decision"] == "FOUNDER_T031_LOCAL_MEASUREMENT_DECISION=AUTHORIZE_EXACT_T029_CANDIDATES"\n    assert scope["decision_surface"] == {"issue": 167, "comment_id": 5553875809}\n    assert scope["candidate_ids"] == [\n        "granite-4.1-3b",\n        "ministral-3-3b",\n        "qwen2.5-coder-1.5b",\n        "qwen3-4b",\n        "qwen3.5-2b",\n        "qwen3.5-4b",\n        "smollm3-3b",\n        "yi-coder-1.5b",\n    ]\n    assert scope["b010_b012_candidates"] is False\n    assert scope["t032_execution"] is False\n    assert scope["t033_execution"] is False\n    assert scope["t034_admission_decision"] is False\n    assert scope["training"] is False\n    assert scope["weight_changing_training"] is False\n\n\ndef test_t031_execution_envelope_freezes_identity_but_dispatch_remains_fail_closed() -> None:\n    authority = _load(AUTHORITY)\n    envelope = _load(ENVELOPE)\n    scope = authority["scope"]\n    assert isinstance(scope, dict)\n    binding = scope["bounded_execution_envelope"]\n    assert isinstance(binding, dict)\n    assert binding["sha256"] == _sha(ENVELOPE)\n    assert envelope["measurement_contract"]["contexts"] == [4096, 8192, 16384]  # type: ignore[index]\n    assert envelope["q4_identity"]["llama_cpp_commit"] == "fc35562ba46fbbf8e30cac85edbb39642c37d248"  # type: ignore[index]\n    assert envelope["runtime_identity"]["llama_cpp_commit"] == "3173a56471c1753650cd806694145ffd6dcace67"  # type: ignore[index]\n    assert envelope["runtime_identity"]["device"] == "none"  # type: ignore[index]\n    assert envelope["runtime_identity"]["gpu_layers"] == 0  # type: ignore[index]\n    assert envelope["runner_envelope"]["runs_on"] == "ubuntu-24.04"  # type: ignore[index]\n    assert envelope["resource_ceiling"]["paid_cost_usd"] == 0.0  # type: ignore[index]\n    assert envelope["dispatch_state"] == "BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING"\n    assert envelope["toolchain_provisioning"]["state"] == "BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING"  # type: ignore[index]\n\n\ndef test_t031_scope_does_not_contain_b012_candidate_ids() -> None:\n    envelope = _load(ENVELOPE)\n    candidate_ids = set(envelope["candidate_ids"])  # type: ignore[arg-type]\n    assert "mellum-4b" not in candidate_ids\n    assert "qwen3.5-0.8b-control" not in candidate_ids\n''',
              encoding="utf-8",
          )
          PY

      - name: Verify exact candidate scope
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json
          artifacts/manifests/T031-local-measurement-execution-envelope.json
          tests/contract/test_t031_authority.py
          EOF
          )
          actual="$(git status --short | awk '{print $2}' | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check

      - name: Run focused T031 authority regression
        run: python -m pytest -q tests/contract/test_t031_authority.py

      - name: Run offline validation and full repository quality
        run: |
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify

      - name: Publish one-commit target candidate from exact main
        shell: bash
        run: |
          set -euo pipefail
          git add \
            artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json \
            artifacts/manifests/T031-local-measurement-execution-envelope.json \
            tests/contract/test_t031_authority.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name "TheHalfMoon"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "governance(t031): capture exact T029 measurement authority"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
