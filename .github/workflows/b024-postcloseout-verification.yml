name: Verify B024 post-closeout canonical main

on:
  push:
    branches: [evidence/b024-postcloseout-823cd7e]

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  MERGE_SHA: 823cd7ec3b4c537876a0795d0f0f8d4bd75acd85
  PREVIOUS_MAIN: 138a2c2c1d86c050db79e3190ab24d7c1052fe44
  CLOSEOUT_HEAD: 615f5189c16e62ecd176a5dc997e9a472eddfc05
  MERGE_TREE: 6e84e0246ba9ba41e7b836cc98116f189d3c5282
  PR_NUMBER: '136'
  QUALIFICATION_RUN: '33561540768'
  PREMERGE_RUN: '33563734287'

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.MERGE_SHA }}', fetch-depth: 0}
      - name: Verify exact merge identity and provenance
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git rev-parse HEAD^1)" = "$PREVIOUS_MAIN"
          test "$(git rev-parse HEAD^2)" = "$CLOSEOUT_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg merge "$MERGE_SHA" --arg head "$CLOSEOUT_HEAD" '.state == "closed" and .merged == true and .merge_commit_sha == $merge and .head.sha == $head' /tmp/pr.json
          for run in "$QUALIFICATION_RUN" "$PREMERGE_RUN"; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" | jq -e '.status == "completed" and .conclusion == "success"'
          done

  frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.MERGE_SHA }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: pyproject.toml}
      - name: Prove canonical post-closeout task frontier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$MERGE_SHA"
          git update-ref refs/remotes/origin/main "$MERGE_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          set +e
          mstr-qualify task eligible B024 > /tmp/b024.json; b024_rc=$?
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_rc=$?
          set -e
          test "$b024_rc" -eq 1
          test "$b011_rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null' /tmp/b024.json
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          mstr-qualify task eligible B026 > /tmp/b026.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0' /tmp/b026.json
          jq -e '[.prerequisite_results[] | select((.task_id == "B022" or .task_id == "B024" or .task_id == "B025") and .observed_state == "COMPLETE_CANONICAL" and .evidence_present == true and .satisfied == true)] | length == 3' /tmp/b026.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.MERGE_SHA }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: pyproject.toml}
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused closeout tests
        run: python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
      - name: Offline validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src
      - name: Verify canonical evidence and authority markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F '**State:** COMPLETE_CANONICAL' evidence/mstr-000b/B024-test-curriculum.md
          grep -F '**Implementation PR:** #135' evidence/mstr-000b/B024-test-curriculum.md
          grep -F '**Canonical implementation merge:** `138a2c2c1d86c050db79e3190ab24d7c1052fe44`' evidence/mstr-000b/B024-test-curriculum.md
          for marker in 'MODEL_WEIGHT_ACCESS = NONE' 'MODEL_EXECUTION = NONE' 'TEST_GENERATION_EXECUTION = NONE' 'VERIFIER_EXECUTION = NONE' 'PAID_COMPUTE = NONE' 'WEIGHT_CHANGING_TRAINING = NONE' 'PRODUCTION_RELEASE = NONE'; do grep -F "$marker" evidence/mstr-000b/B024-test-curriculum.md; done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"

  complete:
    needs: [identity, frontier, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.MERGE_SHA }}', fetch-depth: 0}
      - name: Final immutable canonical-main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$PREVIOUS_MAIN"
          test "$(git rev-parse HEAD^2)" = "$CLOSEOUT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          echo 'B024_POST_CLOSEOUT_CANONICAL_VERIFICATION=PASS'
