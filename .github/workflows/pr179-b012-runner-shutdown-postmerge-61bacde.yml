name: PR179 B012 runner shutdown postmerge

on:
  push:
    branches:
      - evidence/pr179-b012-runner-shutdown-postmerge-61bacde

permissions:
  contents: read
  pull-requests: read

env:
  MERGE_SHA: 61bacde1ee21831080accc8a226433562a6aeaf9
  OLD_MAIN_SHA: 610bf7dacc5ee921d99a4fa2eb9023553021e84c
  SUBJECT_SHA: f7a2ca07d9b48f71644e87cc41cd0f45e52cab27
  MERGE_TREE_SHA: 6c1f64820551f771d182ec42700f851ecb4e9efb
  INCIDENT_EVIDENCE_SHA256: e5abc34f9d251951d4b38508fd0c6f67d8200282f564279a4c6fada65e354030
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  postmerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Verify merge identity, topology, tree, and live PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE_SHA"
          test "$(git rev-parse HEAD^1)" = "$OLD_MAIN_SHA"
          test "$(git rev-parse HEAD^2)" = "$SUBJECT_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              "https://api.github.com/repos/TheHalfMoon/MSTR/pulls/179",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "mstr-postmerge",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              pr = json.load(response)
          assert pr["state"] == "closed"
          assert pr["merged"] is True
          assert pr["merge_commit_sha"] == "61bacde1ee21831080accc8a226433562a6aeaf9"
          assert pr["base"]["sha"] == "610bf7dacc5ee921d99a4fa2eb9023553021e84c"
          assert pr["head"]["sha"] == "f7a2ca07d9b48f71644e87cc41cd0f45e52cab27"
          PY

      - name: Verify canonical B012 incident evidence and machine eligibility
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          test "$(sha256sum artifacts/results/equivalent/B012/failures/B012-mellum-4b-run-34064172421.json | awk '{print $1}')" = "$INCIDENT_EVIDENCE_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path(
              "artifacts/results/equivalent/B012/failures/B012-mellum-4b-run-34064172421.json"
          ).read_text())
          assert evidence["failure_classification"] == "B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_NO_DURABLE_RESULT"
          assert evidence["model_quality_verdict"] == "NONE"
          assert evidence["model_access_before_shutdown"] == "UNKNOWN_UNRECORDED"
          assert evidence["candidate_execution_completion"] == "NOT_PROVEN"
          assert evidence["executor_authored_failure_json"] is False
          assert evidence["retry_authority_created"] is False
          assert evidence["same_action_retry_performed_by_this_evidence"] is False
          assert evidence["training"] is False
          assert evidence["paid_model_api"] is False
          assert evidence["candidate_expansion"] is False

          binding = json.loads(Path("artifacts/manifests/B012-executor-toolchain-binding.json").read_text())
          recovery = binding["runner_shutdown_recovery"]
          assert recovery["run_id"] == 34064172421
          assert recovery["job_id"] == 101569918156
          assert recovery["candidate_id"] == "mellum-4b"
          assert recovery["failure_classification"] == evidence["failure_classification"]
          assert recovery["model_quality_verdict"] == "NONE"
          assert recovery["retry_authority_created"] is False
          PY
          python -m mstr_qualify task eligible B012 | tee "$RUNNER_TEMP/b012-postmerge-eligible.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path(os.environ["RUNNER_TEMP"] + "/b012-postmerge-eligible.json").read_text())
          assert data["task_id"] == "B012"
          assert data["eligible"] is True
          PY
          echo 'B012_MACHINE_ELIGIBILITY_POSTMERGE=PASS'

      - name: Run postmerge quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_timeout_binding.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_t031_executor_binding.py \
            tests/contract/test_t031_replay_version_equivalence.py
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check tests/contract/test_b012_runner_shutdown_evidence.py
          python -m mypy src
          python -m mstr_qualify validate
          test -z "$(git status --porcelain)"

      - name: Final live-main guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MERGE_SHA"
          echo 'PR179_POSTMERGE_VERIFICATION=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
