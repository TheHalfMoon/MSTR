name: PR171 security repair c332357

on:
  push:
    branches:
      - builder/pr171-security-repair-c332357

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/t031-governed-measurement-executor
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact target and canonical main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD=c332357f248704b1f6386dc8cbe8aacf603d3e79
          EXPECTED_MAIN=891af2215a2244a6a0912d49d782f42bcc38b6ef
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/feat/t031-governed-measurement-executor | awk '{print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"

      - name: Setup Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'

      - name: Install repository development tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'

      - name: Apply bounded security repairs
        shell: bash
        run: |
          set -euo pipefail

          cat > .github/workflows/t031-measure.yml <<'EOF'
          name: T031 governed local measurement

          on:
            issue_comment:
              types: [created]

          permissions:
            contents: read

          concurrency:
            group: t031-governed-model-execution
            cancel-in-progress: false

          jobs:
            measure:
              if: ${{ github.event.issue.number == 167 && github.actor == 'TheHalfMoon' && github.event.comment.user.login == 'TheHalfMoon' && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, 'T031_RUN ') }}
              runs-on: ubuntu-24.04
              timeout-minutes: 120
              env:
                PYTHONHASHSEED: "0"
                TOKENIZERS_PARALLELISM: "false"
              steps:
                - name: Resolve exact candidate and canonical dispatch boundary
                  id: boundary
                  shell: bash
                  env:
                    COMMENT_BODY: ${{ github.event.comment.body }}
                    COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
                    COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
                    ISSUE_NUMBER: ${{ github.event.issue.number }}
                  run: |
                    set -euo pipefail
                    [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]
                    [[ "$GITHUB_REF" == "refs/heads/main" ]]
                    [[ "$COMMENT_AUTHOR" == "TheHalfMoon" ]]
                    [[ "$COMMENT_ASSOCIATION" == "OWNER" ]]
                    [[ "$ISSUE_NUMBER" == "167" ]]
                    case "$COMMENT_BODY" in
                      "T031_RUN granite-4.1-3b") candidate="granite-4.1-3b" ;;
                      "T031_RUN ministral-3-3b") candidate="ministral-3-3b" ;;
                      "T031_RUN qwen2.5-coder-1.5b") candidate="qwen2.5-coder-1.5b" ;;
                      "T031_RUN qwen3-4b") candidate="qwen3-4b" ;;
                      "T031_RUN qwen3.5-2b") candidate="qwen3.5-2b" ;;
                      "T031_RUN qwen3.5-4b") candidate="qwen3.5-4b" ;;
                      "T031_RUN smollm3-3b") candidate="smollm3-3b" ;;
                      "T031_RUN yi-coder-1.5b") candidate="yi-coder-1.5b" ;;
                      *) echo "Comment is not an exact authorized T031 dispatch command" >&2; exit 1 ;;
                    esac
                    echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

                - name: Checkout live canonical main
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                  with:
                    ref: main
                    fetch-depth: 1
                    persist-credentials: false

                - name: Set up pinned Python
                  uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
                  with:
                    python-version: "3.11.9"
                    check-latest: false

                - name: Execute governed T031 measurement
                  shell: bash
                  env:
                    T031_CANDIDATE: ${{ steps.boundary.outputs.candidate }}
                  run: |
                    set -euo pipefail
                    mkdir -p "$RUNNER_TEMP/t031-out"
                    python colab/mstr_t031_execute.py \
                      --candidate "$T031_CANDIDATE" \
                      --output-dir "$RUNNER_TEMP/t031-out" \
                      --workdir "$RUNNER_TEMP/t031-work"

                - name: Upload durable JSON evidence only
                  if: ${{ always() }}
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
                  with:
                    name: t031-${{ steps.boundary.outputs.candidate }}
                    path: |
                      ${{ runner.temp }}/t031-out/*.json
                      ${{ runner.temp }}/t031-out/*.jsonl
                    if-no-files-found: error
                    retention-days: 14
          EOF

          python - <<'PY'
          from pathlib import Path

          helper_path = Path("colab/mstr_executor_toolchain.py")
          helper = helper_path.read_text(encoding="utf-8")
          helper = helper.replace(
              'def _run_checked(argv: list[str], *, env: dict[str, str] | None = None) -> str:\n'
              '    completed = subprocess.run(\n'
              '        argv,\n'
              '        capture_output=True,\n'
              '        text=True,\n'
              '        encoding="utf-8",\n'
              '        errors="replace",\n'
              '        check=False,\n'
              '        env=env,\n'
              '    )\n'
              '    if completed.returncode != 0:\n'
              '        diagnostic = (completed.stdout + "\\n" + completed.stderr).strip()[-4000:]\n'
              '        raise ToolchainError(f"command failed ({completed.returncode}): {argv!r}\\n{diagnostic}")\n'
              '    return completed.stdout.strip()\n',
              'def _run_checked(\n'
              '    argv: list[str], *, timeout_seconds: float, env: dict[str, str] | None = None\n'
              ') -> str:\n'
              '    try:\n'
              '        completed = subprocess.run(\n'
              '            argv,\n'
              '            capture_output=True,\n'
              '            text=True,\n'
              '            encoding="utf-8",\n'
              '            errors="replace",\n'
              '            check=False,\n'
              '            env=env,\n'
              '            timeout=timeout_seconds,\n'
              '        )\n'
              '    except subprocess.TimeoutExpired as exc:\n'
              '        raise ToolchainError(\n'
              '            f"command timed out after {timeout_seconds} seconds: {argv!r}"\n'
              '        ) from exc\n'
              '    if completed.returncode != 0:\n'
              '        diagnostic = (completed.stdout + "\\n" + completed.stderr).strip()[-4000:]\n'
              '        raise ToolchainError(f"command failed ({completed.returncode}): {argv!r}\\n{diagnostic}")\n'
              '    return completed.stdout.strip()\n',
          )
          replacements = {
              'output = _run_checked(argv)': 'output = _run_checked(argv, timeout_seconds=30)',
              '_run_checked([sys.executable, "-m", "venv", str(venv)])': '_run_checked([sys.executable, "-m", "venv", str(venv)], timeout_seconds=120)',
              '        ]\n    )\n    package_wheels = [str(path) for path, _ in downloads[1:]]': '        ],\n        timeout_seconds=300,\n    )\n    package_wheels = [str(path) for path, _ in downloads[1:]]',
              '            *package_wheels,\n        ]\n    )\n    shutil.rmtree(wheel_dir, ignore_errors=True)': '            *package_wheels,\n        ],\n        timeout_seconds=300,\n    )\n    shutil.rmtree(wheel_dir, ignore_errors=True)',
              '_run_checked(["git", "-C", str(destination), "init"], env=env)': '_run_checked(["git", "-C", str(destination), "init"], timeout_seconds=60, env=env)',
              '_run_checked(["git", "-C", str(destination), "remote", "add", "origin", repository], env=env)': '_run_checked(\n        ["git", "-C", str(destination), "remote", "add", "origin", repository],\n        timeout_seconds=60,\n        env=env,\n    )',
              '        env=env,\n    )\n    _run_checked(["git", "-C", str(destination), "checkout", "--detach", commit], env=env)': '        timeout_seconds=300,\n        env=env,\n    )\n    _run_checked(\n        ["git", "-C", str(destination), "checkout", "--detach", commit],\n        timeout_seconds=60,\n        env=env,\n    )',
              'actual = _run_checked(["git", "-C", str(destination), "rev-parse", "HEAD"], env=env)': 'actual = _run_checked(\n        ["git", "-C", str(destination), "rev-parse", "HEAD"],\n        timeout_seconds=60,\n        env=env,\n    )',
              '_run_checked(["cmake", "-S", str(destination), "-B", str(build_dir), *build_flags], env=env)': '_run_checked(\n        ["cmake", "-S", str(destination), "-B", str(build_dir), *build_flags],\n        timeout_seconds=300,\n        env=env,\n    )',
              '        ],\n        env=env,\n    )\n    executable = build_dir / "bin" / target': '        ],\n        timeout_seconds=900,\n        env=env,\n    )\n    executable = build_dir / "bin" / target',
          }
          for old, new in replacements.items():
              if old not in helper:
                  raise SystemExit(f"expected helper patch anchor missing: {old[:80]!r}")
              helper = helper.replace(old, new, 1)
          helper_path.write_text(helper, encoding="utf-8")

          executor_path = Path("colab/mstr_t031_execute.py")
          executor = executor_path.read_text(encoding="utf-8")
          old = (
              '    workdir = args.workdir.resolve()\n'
              '    if workdir.exists():\n'
              '        shutil.rmtree(workdir)\n'
              '    workdir.mkdir(parents=True)\n\n'
              '    started_utc = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())\n'
              '    head = "UNKNOWN"\n'
              '    try:\n'
              '        head = _require_live_main(repo_root)\n'
          )
          new = (
              '    workdir = args.workdir.resolve()\n\n'
              '    started_utc = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())\n'
              '    head = "UNKNOWN"\n'
              '    try:\n'
              '        if workdir.exists():\n'
              '            shutil.rmtree(workdir)\n'
              '        workdir.mkdir(parents=True)\n'
              '        head = _require_live_main(repo_root)\n'
          )
          if old not in executor:
              raise SystemExit("executor workdir patch anchor missing")
          executor_path.write_text(executor.replace(old, new, 1), encoding="utf-8")

          evidence_path = Path("evidence/T031-executor-toolchain-binding.md")
          evidence = evidence_path.read_text(encoding="utf-8")
          start = evidence.index("## Dispatch lifecycle\n")
          replacement = '''## Dispatch lifecycle

This binding PR itself performs no model access.

After this exact binding becomes canonical, connector dispatch uses an `issue_comment` event that
GitHub loads from the default branch. The only accepted surface is canonical Issue #167, the
existing Founder-decision surface. The comment must be created by repository owner `TheHalfMoon`,
carry `author_association=OWNER`, and exactly match `T031_RUN <authorized-candidate>` for one of the
eight bound candidates. All other comments are ignored before runner allocation or fail closed
before model access.

This removes branch-triggered execution entirely: no contributor-controlled branch can supply the
workflow definition used for T031 model access. The job explicitly checks that the event resolves to
`refs/heads/main`, then checks out live canonical `main` with persisted Git credentials disabled.

Global workflow concurrency is one candidate and `cancel-in-progress` is false. The executor
rechecks live `main` again immediately before model access and again before reporting success. A
main movement invalidates the run.

Only JSON/JSONL measurement evidence is uploaded. Any identity, authority, toolchain, network,
artifact, runtime, or live-main mismatch fails closed; failed runs remain failure evidence and are
never rewritten as success.
'''
          evidence_path.write_text(evidence[:start] + replacement, encoding="utf-8")

          test_path = Path("tests/contract/test_t031_executor_binding.py")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace("import hashlib\n", "import ast\nimport hashlib\n", 1)
          old_test = '''def test_workflow_dispatch_is_canonical_and_branch_creation_only() -> None:
    workflow = WORKFLOW.read_text(encoding="utf-8")
    binding = _read_json(BINDING)

    assert "workflow_dispatch:" in workflow
    assert '\"execute/t031-*\"' in workflow
    assert '[[ "$GITHUB_REF" == "refs/heads/main" ]]' in workflow
    assert '[[ "$created" == "True" && "$deleted" != "True" ]]' in workflow
    assert 'candidate="${GITHUB_REF_NAME#execute/t031-}"' in workflow
    assert "ref: main" in workflow
    assert "persist-credentials: false" in workflow
    assert "permissions:\\n  contents: read" in workflow
    assert "group: t031-governed-model-execution" in workflow
    assert "cancel-in-progress: false" in workflow
    for candidate in CANDIDATES:
        assert candidate in workflow

    dispatch = binding["dispatch_boundary"]
    assert isinstance(dispatch, dict)
    assert dispatch["canonicalization_required"] is True
    assert dispatch["connector_dispatch_event"] == "BRANCH_CREATION_ONLY"
    assert dispatch["checkout_ref"] == "main"
    assert dispatch["max_parallel_candidates"] == 1
    assert dispatch["max_job_minutes"] == 120
'''
          new_test = '''def test_issue_comment_dispatch_is_canonical_owner_scoped_and_branch_trigger_free() -> None:
    workflow = WORKFLOW.read_text(encoding="utf-8")
    binding = _read_json(BINDING)

    assert "issue_comment:" in workflow
    assert "workflow_dispatch:" not in workflow
    assert '\"execute/t031-*\"' not in workflow
    assert "\\n  push:" not in workflow
    assert 'github.event.issue.number == 167' in workflow
    assert "github.actor == 'TheHalfMoon'" in workflow
    assert "github.event.comment.user.login == 'TheHalfMoon'" in workflow
    assert "github.event.comment.author_association == 'OWNER'" in workflow
    assert '[[ "$GITHUB_REF" == "refs/heads/main" ]]' in workflow
    assert '[[ "$ISSUE_NUMBER" == "167" ]]' in workflow
    assert "ref: main" in workflow
    assert "persist-credentials: false" in workflow
    assert "permissions:\\n  contents: read" in workflow
    assert "group: t031-governed-model-execution" in workflow
    assert "cancel-in-progress: false" in workflow
    for candidate in CANDIDATES:
        assert f'T031_RUN {candidate}' in workflow

    dispatch = binding["dispatch_boundary"]
    assert isinstance(dispatch, dict)
    assert dispatch["canonicalization_required"] is True
    assert dispatch["connector_dispatch_surface"] == "ISSUE_COMMENT_CANONICAL_MAIN"
    assert dispatch["connector_dispatch_issue"] == 167
    assert dispatch["connector_dispatch_author"] == "TheHalfMoon"
    assert dispatch["connector_dispatch_author_association"] == "OWNER"
    assert dispatch["connector_dispatch_command"] == "T031_RUN <authorized-candidate>"
    assert dispatch["checkout_ref"] == "main"
    assert dispatch["max_parallel_candidates"] == 1
    assert dispatch["max_job_minutes"] == 120
'''
          if old_test not in test:
              raise SystemExit("workflow contract test patch anchor missing")
          test = test.replace(old_test, new_test, 1)
          test += '''\n\ndef test_toolchain_subprocesses_are_bounded_and_workdir_setup_fails_closed() -> None:
    helper = HELPER.read_text(encoding="utf-8")
    executor = EXECUTOR.read_text(encoding="utf-8")
    tree = ast.parse(helper)
    calls = [
        node
        for node in ast.walk(tree)
        if isinstance(node, ast.Call)
        and isinstance(node.func, ast.Name)
        and node.func.id == "_run_checked"
    ]
    assert calls
    for call in calls:
        assert any(keyword.arg == "timeout_seconds" for keyword in call.keywords)
    assert "timeout=timeout_seconds" in helper
    assert "except subprocess.TimeoutExpired as exc:" in helper
    assert executor.index("    try:\\n") < executor.index("        if workdir.exists():")
    assert executor.index("    try:\\n") < executor.index("        workdir.mkdir(parents=True)")
'''
          test_path.write_text(test, encoding="utf-8")
          PY

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          binding_path = Path("artifacts/manifests/T031-executor-toolchain-binding.json")
          binding = json.loads(binding_path.read_text(encoding="utf-8"))
          dispatch = binding["dispatch_boundary"]
          for key in (
              "manual_dispatch_branch",
              "connector_dispatch_branch_pattern",
              "connector_dispatch_event",
          ):
              dispatch.pop(key, None)
          dispatch.update(
              {
                  "connector_dispatch_surface": "ISSUE_COMMENT_CANONICAL_MAIN",
                  "connector_dispatch_issue": 167,
                  "connector_dispatch_author": "TheHalfMoon",
                  "connector_dispatch_author_association": "OWNER",
                  "connector_dispatch_command": "T031_RUN <authorized-candidate>",
              }
          )
          def sha(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          binding["toolchain_helper_sha256"] = sha("colab/mstr_executor_toolchain.py")
          binding["executor_script_sha256"] = sha("colab/mstr_t031_execute.py")
          binding["workflow_sha256"] = sha(".github/workflows/t031-measure.yml")
          binding_path.write_text(json.dumps(binding, indent=2) + "\n", encoding="utf-8")
          PY

          ruff format \
            colab/mstr_executor_toolchain.py \
            colab/mstr_t031_execute.py \
            tests/contract/test_t031_executor_binding.py

          # Ruff formatting may change bound Python hashes; refresh after formatting.
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p = Path("artifacts/manifests/T031-executor-toolchain-binding.json")
          b = json.loads(p.read_text())
          b["toolchain_helper_sha256"] = hashlib.sha256(Path("colab/mstr_executor_toolchain.py").read_bytes()).hexdigest()
          b["executor_script_sha256"] = hashlib.sha256(Path("colab/mstr_t031_execute.py").read_bytes()).hexdigest()
          b["workflow_sha256"] = hashlib.sha256(Path(".github/workflows/t031-measure.yml").read_bytes()).hexdigest()
          p.write_text(json.dumps(b, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Verify bounded diff and focused qualification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          allowed = {
              ".github/workflows/t031-measure.yml",
              "artifacts/manifests/T031-executor-toolchain-binding.json",
              "colab/mstr_executor_toolchain.py",
              "colab/mstr_t031_execute.py",
              "evidence/T031-executor-toolchain-binding.md",
              "tests/contract/test_t031_executor_binding.py",
          }
          changed = {x for x in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines() if x}
          if changed != allowed:
              raise SystemExit(f"unexpected repair scope: {sorted(changed)}")
          helper = Path("colab/mstr_executor_toolchain.py").read_text()
          tree = ast.parse(helper)
          calls = [n for n in ast.walk(tree) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == "_run_checked"]
          if not calls or any(not any(k.arg == "timeout_seconds" for k in c.keywords) for c in calls):
              raise SystemExit("unbounded _run_checked call remains")
          workflow = Path(".github/workflows/t031-measure.yml").read_text()
          if "execute/t031-" in workflow or "workflow_dispatch:" in workflow or "\n  push:" in workflow:
              raise SystemExit("unsafe non-default-branch dispatch surface remains")
          PY
          ruff check colab/mstr_executor_toolchain.py colab/mstr_t031_execute.py tests/contract/test_t031_executor_binding.py
          ruff format --check colab/mstr_executor_toolchain.py colab/mstr_t031_execute.py tests/contract/test_t031_executor_binding.py
          pytest -q tests/contract/test_t031_executor_binding.py

      - name: Commit one forward-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/t031-measure.yml \
            artifacts/manifests/T031-executor-toolchain-binding.json \
            colab/mstr_executor_toolchain.py \
            colab/mstr_t031_execute.py \
            evidence/T031-executor-toolchain-binding.md \
            tests/contract/test_t031_executor_binding.py
          git commit -m "fix(t031): harden canonical execution dispatch"

      - name: Guard remote state and fast-forward target branch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD=c332357f248704b1f6386dc8cbe8aacf603d3e79
          EXPECTED_MAIN=891af2215a2244a6a0912d49d782f42bcc38b6ef
          test "$(git ls-remote origin refs/heads/feat/t031-governed-measurement-executor | awk '{print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          git push origin HEAD:refs/heads/feat/t031-governed-measurement-executor
