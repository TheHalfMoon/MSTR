name: PR171 security repair c332357

on:
  push:
    branches:
      - builder/pr171-security-repair-c332357

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout builder helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: builder/pr171-security-repair-c332357
          path: builder
          persist-credentials: false

      - name: Checkout exact target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/t031-governed-measurement-executor
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact target and canonical main
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          EXPECTED_HEAD=c332357f248704b1f6386dc8cbe8aacf603d3e79
          EXPECTED_MAIN=891af2215a2244a6a0912d49d782f42bcc38b6ef
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/feat/t031-governed-measurement-executor | awk '{print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"

      - name: Setup Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'

      - name: Apply deterministic security patch
        shell: bash
        run: |
          set -euo pipefail
          python builder/.github/scripts/pr171_security_patch.py target
          python -m pip install -e 'target[dev]'
          ruff format \
            target/colab/mstr_executor_toolchain.py \
            target/colab/mstr_t031_execute.py \
            target/tests/contract/test_t031_executor_binding.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('target')
          p = root / 'artifacts/manifests/T031-executor-toolchain-binding.json'
          b = json.loads(p.read_text())
          for key, relative in {
              'toolchain_helper_sha256': 'colab/mstr_executor_toolchain.py',
              'executor_script_sha256': 'colab/mstr_t031_execute.py',
              'workflow_sha256': '.github/workflows/t031-measure.yml',
          }.items():
              b[key] = hashlib.sha256((root / relative).read_bytes()).hexdigest()
          p.write_text(json.dumps(b, indent=2) + '\n')
          PY

      - name: Verify bounded repair
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          allowed = {
              '.github/workflows/t031-measure.yml',
              'artifacts/manifests/T031-executor-toolchain-binding.json',
              'colab/mstr_executor_toolchain.py',
              'colab/mstr_t031_execute.py',
              'evidence/T031-executor-toolchain-binding.md',
              'tests/contract/test_t031_executor_binding.py',
          }
          changed = {x for x in subprocess.check_output(['git','diff','--name-only'], text=True).splitlines() if x}
          assert changed == allowed, (changed, allowed)
          helper = Path('colab/mstr_executor_toolchain.py').read_text()
          tree = ast.parse(helper)
          calls = [n for n in ast.walk(tree) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == '_run_checked']
          assert calls
          assert all(any(k.arg == 'timeout_seconds' for k in c.keywords) for c in calls)
          workflow = Path('.github/workflows/t031-measure.yml').read_text()
          assert 'issue_comment:' in workflow
          assert 'execute/t031-' not in workflow
          assert 'workflow_dispatch:' not in workflow
          assert '\n  push:' not in workflow
          PY
          ruff check colab/mstr_executor_toolchain.py colab/mstr_t031_execute.py tests/contract/test_t031_executor_binding.py
          ruff format --check colab/mstr_executor_toolchain.py colab/mstr_t031_execute.py tests/contract/test_t031_executor_binding.py
          pytest -q tests/contract/test_t031_executor_binding.py

      - name: Commit and fast-forward target branch
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          EXPECTED_HEAD=c332357f248704b1f6386dc8cbe8aacf603d3e79
          EXPECTED_MAIN=891af2215a2244a6a0912d49d782f42bcc38b6ef
          test "$(git ls-remote origin refs/heads/feat/t031-governed-measurement-executor | awk '{print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/t031-measure.yml \
            artifacts/manifests/T031-executor-toolchain-binding.json \
            colab/mstr_executor_toolchain.py \
            colab/mstr_t031_execute.py \
            evidence/T031-executor-toolchain-binding.md \
            tests/contract/test_t031_executor_binding.py
          git commit -m 'fix(t031): harden canonical execution dispatch'
          git push origin HEAD:refs/heads/feat/t031-governed-measurement-executor
