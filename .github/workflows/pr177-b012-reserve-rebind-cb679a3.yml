name: PR177 B012 reserve repair rebind cb679a3

on:
  push:
    branches:
      - evidence/pr177-b012-reserve-rebind-cb679a3

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reserve repair subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cb679a382fa11c18d9cf5a5513f9b9acb2ff36d8
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify repair and materialize exact hashes
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cb679a382fa11c18d9cf5a5513f9b9acb2ff36d8"
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_b012_timeout_budget.py
          python -m ruff check colab/mstr_b012_measure.py colab/mstr_b012_execute.py tests/contract/test_b012_timeout_budget.py
          python -m py_compile colab/mstr_b012_measure.py colab/mstr_b012_execute.py
          echo "MEASURE_HELPER_SHA256=$(sha256sum colab/mstr_b012_measure.py | awk '{print $1}')"
          echo "EXECUTOR_SHA256=$(sha256sum colab/mstr_b012_execute.py | awk '{print $1}')"
          echo "MODEL_EXECUTION_PERFORMED=false"
          echo "TRAINING=false"
          echo "PAID_COST_USD=0.0"
