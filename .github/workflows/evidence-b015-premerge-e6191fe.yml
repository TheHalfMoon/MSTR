name: Premerge B015 head e6191fe

on:
  push:

permissions:
  contents: read

jobs:
  premerge:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 205df4be5f2e25bd28b697816eac3ea6ce361aed
      EXPECTED_HEAD: e6191fefc9b870f3376f6faead6149841fe7dd31
      TARGET_BRANCH: feat/000b-b015-language-target-policy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 205df4be5f2e25bd28b697816eac3ea6ce361aed
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind live main and exact target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          expected=$(printf '%s\n' artifacts/decisions/B015-language-target-policy.json evidence/mstr-000b/B015-language-mix.md tests/contract/test_b015_language_target_policy.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
      - name: Mandatory exact-main task gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git branch -f main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B015 > /tmp/b015.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json, os
          b15=json.load(open('/tmp/b015.json')); b11=json.load(open('/tmp/b011.json')); drift=json.load(open('/tmp/drift.json'))
          assert b15['canonical_main']==os.environ['EXPECTED_MAIN']
          assert b15['eligible'] is True and b15['reasons']==[]
          assert b15['state_consistency_result']['observed_state']=='PENDING'
          assert b15['authority_result']['required'] is False
          pred=next(x for x in b15['prerequisite_results'] if x['task_id']=='B014')
          assert pred['observed_state']=='COMPLETE_CANONICAL' and pred['evidence_present'] is True and pred['satisfied'] is True
          assert b11['eligible'] is False and b11['state_consistency_result']['observed_state']=='BLOCKED'
          assert b11['authority_result']['required'] is True and b11['authority_result']['satisfied'] is False
          assert drift['status']=='clean' and drift['findings']==[]
          print('B015_PREMERGE_TASK_GATE=PASS')
          PY
      - name: Exact target smoke gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_HEAD"
          pytest -q tests/contract/test_b015_language_target_policy.py
          ruff check tests/contract/test_b015_language_target_policy.py
          mypy src
          python -m mstr_qualify validate
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B015_PREMERGE_SMOKE=PASS'
      - name: Final immutable remote recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          echo 'B015_PREMERGE=PASS'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'LARGE_DATASET_INGESTION=NONE'
          echo 'WEIGHT_CHANGING_TRAINING=NONE'
