name: Postmerge verify PR155 B011 authority

on:
  push:
    branches:
      - evidence/pr155-b011-authority-postmerge

permissions:
  contents: read
  pull-requests: read

env:
  MERGE_SHA: 7884af6b159534671ad4259addfcb319d7084d36
  MERGE_TREE: 7fa76c7e671ebb406c2a2cacba9a02205349d548
  OLD_MAIN: 3e3ec4c4ec9b179ab4a3cd7addd6e0a46ac9201b
  CANDIDATE_HEAD: 55c972f98399f3699113b4282c0922ef7ace8abf
  PR_NUMBER: '155'

jobs:
  exact_main_postmerge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify canonical merge identity and PR terminal state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          mapfile -t parents < <(git show -s --format='%P' "$MERGE_SHA" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$OLD_MAIN"
          test "${parents[1]}" = "$CANDIDATE_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg merge "$MERGE_SHA" --arg head "$CANDIDATE_HEAD" '.state == "closed" and .merged == true and .merge_commit_sha == $merge and .head.sha == $head' /tmp/pr.json >/dev/null
          echo 'PR155_POSTMERGE_IDENTITY=PASS'
      - name: Install canonical tooling
        run: python -m pip install -e '.[dev]'
      - name: Prove exact-main B011 authority and eligibility
        shell: bash
        run: |
          set -euo pipefail
          mstr-qualify task eligible B011 > /tmp/b011.json
          jq -e '.task_id == "B011" and .eligible == true and .authority_result.required == true and .authority_result.satisfied == true and .authority_result.authority_id == "B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED" and .state_consistency_result.observed_state == "PENDING" and (.reasons | length == 0)' /tmp/b011.json >/dev/null
          if mstr-qualify task eligible B012 > /tmp/b012.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B011")) != null' /tmp/b012.json >/dev/null
          if mstr-qualify task eligible B013 > /tmp/b013.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B012")) != null' /tmp/b013.json >/dev/null
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          auth_path = Path('artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json')
          b010_path = Path('artifacts/manifests/B010-new-candidate-weight-access.json')
          auth = json.loads(auth_path.read_text(encoding='utf-8'))
          catalog = json.loads(Path('configs/task-gate/mstr-000b.json').read_text(encoding='utf-8'))
          assert auth['status'] == 'AUTHORIZED_CANONICAL'
          assert auth['scope']['decision'] == 'FOUNDER_B011_MODEL_WEIGHT_ACCESS_DECISION=AUTHORIZE_EXACT_B010_ENVELOPE'
          assert auth['scope']['b010_manifest']['sha256'] == hashlib.sha256(b010_path.read_bytes()).hexdigest()
          assert catalog['tasks']['B011']['canonical_state'] == 'PENDING'
          assert 'B011' not in catalog['unresolved_bindings']
          print('PR155_POSTMERGE_AUTHORITY=PASS')
          PY
          echo 'PR155_POSTMERGE_B011_ELIGIBILITY=PASS'
      - name: Fresh canonical quality verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/contract/test_convergence_external_bindings.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          echo 'PR155_POSTMERGE_QUALITY=PASS'
      - name: Final canonical main immutability recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          echo 'PR155_B011_AUTHORITY_POSTMERGE=PASS'
