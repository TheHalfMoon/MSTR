name: PR163 T029 truth follow-on

on:
  push:
    branches:
      - evidence/pr163-t029-truth-followon-cef1887

permissions:
  contents: write

env:
  EXPECTED_MAIN: 5cadbd754686ebff6f5327e9746f0b074b35e318
  EXPECTED_TARGET: cef188706c9130bae10500ceb14078e04fa50f63
  TARGET_BRANCH: fix/000-t029-recovery-current-main
  BUILDER_COMMIT: 600c447b83fed4261ed8cac286f79881ad8b518e

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify exact remote identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_TARGET"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TARGET }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize bounded three-file correction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BUILDER_COMMIT"
          git show "$BUILDER_COMMIT:.github/scripts/pr163_t029_truth_followon.py" > /tmp/builder.py
          python /tmp/builder.py
      - name: Verify exact scope and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_TARGET"
          git diff --name-only "$EXPECTED_TARGET" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          artifacts/manifests/quantization/T029-q4-profiles.json
          evidence/T029-runner-recovery.md
          tests/contract/test_t029_quantization_manifest.py
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
      - name: Install repository development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Focused T029 tests
        run: python -m pytest -q tests/contract/test_t029_quantization_manifest.py tests/unit/test_t029_quantize_runner.py
      - name: Repository validation
        run: mstr-qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Commit bounded correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add artifacts/manifests/quantization/T029-q4-profiles.json \
            evidence/T029-runner-recovery.md \
            tests/contract/test_t029_quantization_manifest.py
          git commit -m "fix(mstr-000): make T029 reconciliation state explicit"
      - name: Guarded fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_TARGET"
          git merge-base --is-ancestor "$EXPECTED_TARGET" HEAD
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
