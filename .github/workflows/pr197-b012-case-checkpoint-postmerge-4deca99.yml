name: PR197 B012 case-checkpoint postmerge 4deca99

on:
  push:
    branches:
      - evidence/pr197-b012-case-checkpoint-postmerge-4deca99

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPO: TheHalfMoon/MSTR
      PR: '197'
      MERGE: 4deca995306c197e5cefaf8202e64fe5469f873c
      SUBJECT: 82fa7c419dd438381fb4045226593ce9e3c8fcf6
      PREMERGE_RUN: '34260407736'
      PREMERGE_HEAD: 64620f9a86ea004c8d3513ddfc6535257f7a3437
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove canonical merge identity and evidence chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$MERGE"
          test "$(git rev-parse origin/main)" = "$MERGE"
          parents=$(git show -s --format=%P "$MERGE")
          test "$(printf '%s' "$parents" | awk '{print $2}')" = "$SUBJECT"
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          jq -e --arg m "$MERGE" --arg h "$SUBJECT" '.state=="closed" and .merged==true and .merge_commit_sha==$m and .head.sha==$h' /tmp/pr.json >/dev/null
          gh api "repos/$REPO/actions/runs/$PREMERGE_RUN" > /tmp/premerge.json
          jq -e --arg h "$PREMERGE_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$h' /tmp/premerge.json >/dev/null
          echo 'CANONICAL_MERGE_IDENTITY=PASS'

      - name: Prove canonical repair and separate activation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          manifest_path=Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          script_path=Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          spec_path=Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          active_path=Path('.github/workflows/b012-qwen-raw-code-recovery.yml')
          binding_path=Path('artifacts/manifests/B012-executor-toolchain-binding.json')
          evidence_path=Path('evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md')
          raw_path=Path('benchmarks/manifests/B012-raw-code-proxy.json')

          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          b=json.loads(binding_path.read_text(encoding='utf-8'))
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()

          assert m['status']=='READY_FOR_SEPARATE_CANONICAL_ACTIVATION'
          assert m['case_checkpoint_script_sha256']==sha(script_path)
          assert m['case_checkpoint_workflow_sha256']==sha(spec_path)
          assert m['raw_code_manifest_sha256']==sha(raw_path)
          assert m['active_workflow_at_repair_base_sha256']==sha(active_path)
          assert m['activation']['active_workflow_materialized'] is False
          assert m['activation']['separate_activation_pr_required'] is True
          assert m['activation']['exact_issue_command']=='B012_RECOVER_RAW_CODE_CASE_CHECKPOINT qwen3.5-0.8b-control 34155931982'
          assert 'B012_RECOVER_RAW_CODE_STAGED qwen3.5-0.8b-control 34155931982' in active_path.read_text(encoding='utf-8')
          assert 'B012_RECOVER_RAW_CODE_CASE_CHECKPOINT' not in active_path.read_text(encoding='utf-8')
          assert b['status']=='BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR'
          d=m['durability_boundary']
          assert d['checkpoint_write_must_succeed_before_completed_state_commit'] is True
          assert d['actions_artifacts_are_transient_transport_not_canonical_evidence'] is True
          assert d['all_checkpoint_artifacts_must_be_canonicalized_to_git_before_dispatch_closeout'] is True
          assert d['missing_or_expired_checkpoint_artifact_fails_closed'] is True
          for key in ('authority_scope_modified','authority_transfer','retry_authority_created','external_dispatch_authority_created','candidate_expansion','candidate_revision_or_file_expansion','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert m['authority_boundary'][key] is False, key
          evidence=evidence_path.read_text(encoding='utf-8')
          assert 'canonicalized into Git evidence before B012 dispatch closeout or any candidate-admission decision' in evidence
          print('REPAIR_CANONICAL_ACTIVATION_SEPARATE=PASS')
          PY

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Reprove exact-main B012 eligibility
        shell: bash
        run: |
          set -euo pipefail
          git branch -f main "$MERGE"
          python -m mstr_qualify task eligible B012 > /tmp/eligibility.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/eligibility.json', encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['MERGE']
          assert d['eligible'] is True and d['reasons']==[]
          assert d['authority_result']['authority_id']=='B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION'
          assert d['authority_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert d['supersession_result']['satisfied'] is True
          assert d['state_consistency_result']['satisfied'] is True
          assert d['candidate_pool_result']['satisfied'] is True
          assert all(d['semantic_checks'].values())
          print('B012_EXACT_MAIN_ELIGIBILITY=PASS')
          PY

      - name: Postmerge repository quality
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py

      - name: Final canonical-main guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE"
          gh api "repos/$REPO/pulls/$PR" > /tmp/final-pr.json
          jq -e --arg m "$MERGE" '.state=="closed" and .merged==true and .merge_commit_sha==$m' /tmp/final-pr.json >/dev/null
          echo 'PR197_POSTMERGE=SUCCESS'
