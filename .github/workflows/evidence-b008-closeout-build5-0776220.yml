name: Repair and qualify B008 closeout

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_REMOTE_MAIN: 07762204ab126c0fccf9ca55a8b572bd6368d8bc
      TARGET_BRANCH: docs/000b-b008-canonicalize
      SOURCE_BRANCH: evidence/b008-closeout-build-0776220
      SOURCE_HEAD: 171ad5890e80fae0ba55ebb6bedb594565728bd9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/000b-b008-canonicalize
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard exact remote entry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH" "$SOURCE_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_REMOTE_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_REMOTE_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_REMOTE_MAIN"
          test "$(git rev-parse refs/remotes/origin/$SOURCE_BRANCH)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_REMOTE_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m pip install -e '.[dev]'
          git branch -f main "$EXPECTED_REMOTE_MAIN"
          python -m mstr_qualify task eligible B008 > /tmp/b008-entry.json
          if python -m mstr_qualify task eligible B009 > /tmp/b009-entry.json; then
            echo 'B009 unexpectedly eligible before B008 closeout' >&2
            exit 1
          fi
          python -m mstr_qualify task drift > /tmp/drift-entry.json
          python - <<'PY'
          import json
          import os

          expected = os.environ['EXPECTED_REMOTE_MAIN']
          b008 = json.load(open('/tmp/b008-entry.json'))
          b009 = json.load(open('/tmp/b009-entry.json'))
          drift = json.load(open('/tmp/drift-entry.json'))
          assert b008['canonical_main'] == expected
          assert b008['eligible'] is True and b008['reasons'] == []
          assert b008['state_consistency_result']['observed_state'] == 'PENDING'
          assert b009['canonical_main'] == expected
          assert b009['eligible'] is False
          assert 'prerequisite.unsatisfied:B008' in b009['reasons']
          assert drift['canonical_main'] == expected
          assert drift['status'] == 'clean' and drift['findings'] == []
          print('B008_CLOSEOUT_REMOTE_ENTRY=PASS')
          PY

      - name: Materialize repaired five-file closeout and commit locally
        shell: bash
        run: |
          set -euo pipefail
          git show "$SOURCE_HEAD:.github/workflows/evidence-b008-closeout-build-0776220.yml" > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/source.yml').read_text().splitlines()
          target = '      - name: Materialize five-file canonical closeout'
          start = lines.index(target)
          run_idx = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run_idx + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  raise AssertionError(line)
          Path('/tmp/materialize.sh').write_text('\n'.join(body) + '\n')
          PY
          export EXPECTED_MAIN="$EXPECTED_REMOTE_MAIN"
          export IMPLEMENTATION_HEAD=895983470f72128ad698023b3578553ed1cfe7c4
          export IMPLEMENTATION_MERGE=07762204ab126c0fccf9ca55a8b572bd6368d8bc
          export IMPLEMENTATION_PR='#61'
          export QUALIFY_RUN=33153394825
          export QUALIFY_JOB=98790425624
          export REVIEW_RUN=33153850333
          export REVIEW_JOB=98791884940
          export POSTMERGE_RUN=33154074016
          export POSTMERGE_JOB=98792580522
          bash /tmp/materialize.sh
          python - <<'PY'
          from pathlib import Path

          path = Path('evidence/mstr-000b/B008-tokenizer-economics.md')
          text = path.read_text()
          needle = 'ENTRY_GATE_JOB = 98784106816\nENTRY_GATE_CANONICAL_MAIN = '
          assert needle in text
          text = text.replace(
              needle,
              'ENTRY_GATE_JOB = 98784106816\nENTRY_GATE_TASK = B008\nENTRY_GATE_CANONICAL_MAIN = ',
              1,
          )
          path.write_text(text)
          PY
          expected=$(printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B008-tokenizer-economics.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py | sort)
          actual=$(git status --porcelain=v1 --untracked-files=all | sed 's/^...//' | sort)
          test "$actual" = "$expected"
          git add configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B008-tokenizer-economics.md \
            specs/002-code-model-supremacy-foundation/tasks.md \
            tests/contract/test_task_gate.py \
            tests/integration/test_task_gate_cli.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(mstr-000b): canonicalize B008 closeout'
          candidate=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$EXPECTED_REMOTE_MAIN"
          test "$(git diff --name-only "$EXPECTED_REMOTE_MAIN...$candidate" | wc -l)" -eq 5
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B008_LOCAL_CLOSEOUT_HEAD=$candidate"

      - name: Simulate repaired candidate as canonical main and run frozen gates
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_REMOTE_MAIN"
          git branch -f main "$candidate"
          git update-ref refs/remotes/origin/main "$candidate"
          test "$(git rev-parse main)" = "$candidate"
          test "$(git rev-parse refs/remotes/origin/main)" = "$candidate"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if python -m mstr_qualify task eligible B008 > /tmp/b008-candidate.json; then
            echo 'B008 unexpectedly eligible after terminal closeout candidate' >&2
            exit 1
          fi
          python -m mstr_qualify task eligible B009 > /tmp/b009-candidate.json
          python -m mstr_qualify task drift > /tmp/drift-candidate.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          candidate = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          b008 = json.load(open('/tmp/b008-candidate.json'))
          b009 = json.load(open('/tmp/b009-candidate.json'))
          drift = json.load(open('/tmp/drift-candidate.json'))
          assert b008['canonical_main'] == candidate
          assert b008['eligible'] is False
          assert b008['state_consistency_result']['observed_state'] == 'COMPLETE_CANONICAL'
          assert b008['state_consistency_result']['satisfied'] is True
          assert 'task.already_terminal' in b008['reasons']
          assert b009['canonical_main'] == candidate
          assert b009['eligible'] is True and b009['reasons'] == []
          assert b009['state_consistency_result']['observed_state'] == 'PENDING'
          predecessor = b009['prerequisite_results'][0]
          assert predecessor['task_id'] == 'B008' and predecessor['satisfied'] is True
          assert drift['canonical_main'] == candidate
          assert drift['status'] == 'clean' and drift['findings'] == []
          evidence = Path('evidence/mstr-000b/B008-tokenizer-economics.md').read_text()
          assert 'ENTRY_GATE_TASK = B008' in evidence
          print('B008_CLOSEOUT_LOCAL_EXACT_MAIN_SIMULATION=PASS')
          PY
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
          git diff --check "$EXPECTED_REMOTE_MAIN...HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B008_CLOSEOUT_FROZEN_GATES=PASS'

      - name: Restore remote truth, guard refs, and push target only
        shell: bash
        run: |
          set -euo pipefail
          final=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$EXPECTED_REMOTE_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_REMOTE_MAIN"
          git fetch origin main "$TARGET_BRANCH" "$SOURCE_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_REMOTE_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_REMOTE_MAIN"
          test "$(git rev-parse refs/remotes/origin/$SOURCE_BRANCH)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$final"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_REMOTE_MAIN"
          echo "B008_CLOSEOUT_HEAD=$final"
          echo "B008_CLOSEOUT_BUILDER_RUN=$GITHUB_RUN_ID"
          echo 'B009_SUCCESSOR_ELIGIBILITY=PROSPECTIVE_ONLY'
          echo 'MODEL_INFERENCE=NONE'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'PAID_COMPUTE=NONE'
          echo 'TRAINING=NONE'
