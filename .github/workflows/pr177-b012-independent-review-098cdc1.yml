name: PR177 B012 independent review 098cdc1

on:
  push:
    branches:
      - evidence/pr177-b012-independent-review-098cdc1

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  SUBJECT_SHA: 098cdc1a58c5abb16bba44ec958e94f99fa0a642
  SUBJECT_TREE: 9966d965a87b8ec7d4fe72370f70ee0819228db0
  BASE_SHA: 1fd324cddf3c2f852810e72a4c195199d7b884c4
  PRIOR_REVIEWED_SHA: 67b08187caac85bc3d1b4fb5f7641bdb2ff2287e
  TARGET_BRANCH: fix/b012-timeout-budget-recovery-current-main
  QUALIFICATION_RUN: "34063033077"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  independent_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact reviewed subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 098cdc1a58c5abb16bba44ec958e94f99fa0a642
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Bind exact topology and successful qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          test "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$SUBJECT_SHA"
          test "$(git diff --name-only "$BASE_SHA".."$SUBJECT_SHA" | wc -l)" = 7
          git diff --check "$BASE_SHA".."$SUBJECT_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.request
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/{os.environ['QUALIFICATION_RUN']}/jobs?per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              jobs = json.load(response)["jobs"]
          expected = {"focused", "canonical_quality", "final_qualification"}
          assert {job["name"] for job in jobs} == expected
          assert all(job["status"] == "completed" and job["conclusion"] == "success" for job in jobs)
          print("QUALIFICATION_BINDING=PASS")
          PY
      - name: Independently review formatting drift and authority semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          old = "67b08187caac85bc3d1b4fb5f7641bdb2ff2287e"
          new = "098cdc1a58c5abb16bba44ec958e94f99fa0a642"
          expected_changed = [
              "artifacts/manifests/B012-executor-toolchain-binding.json",
              "colab/mstr_b012_execute.py",
              "colab/mstr_b012_measure.py",
          ]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{old}..{new}"], text=True
          ).splitlines()
          assert changed == expected_changed
          for path in ("colab/mstr_b012_execute.py", "colab/mstr_b012_measure.py"):
              before = subprocess.check_output(["git", "show", f"{old}:{path}"], text=True)
              after = Path(path).read_text(encoding="utf-8")
              assert ast.dump(ast.parse(before), include_attributes=False) == ast.dump(
                  ast.parse(after), include_attributes=False
              ), path

          binding = json.loads(Path("artifacts/manifests/B012-executor-toolchain-binding.json").read_text(encoding="utf-8"))
          lock = json.loads(Path("artifacts/manifests/B012-executor-toolchain-lock.json").read_text(encoding="utf-8"))
          assert binding["candidate_ids"] == ["mellum-4b", "qwen3.5-0.8b-control"]
          boundary = binding["execution_boundary"]
          assert boundary["authority_transfer"] is False
          assert boundary["candidate_revision_or_file_expansion"] is False
          assert boundary["new_candidates"] is False
          assert boundary["training"] is False
          assert boundary["weight_changing_training"] is False
          assert boundary["paid_compute"] is False
          assert boundary["paid_model_api"] is False
          assert boundary["production_release"] is False
          assert boundary["paid_cost_usd"] == 0.0
          dispatch = binding["dispatch_boundary"]
          assert dispatch["surface"] == "ISSUE_COMMENT_CANONICAL_MAIN"
          assert dispatch["issue"] == 162
          assert dispatch["command"] == "B012_RUN <authorized-candidate>"
          assert dispatch["checkout_ref"] == "main"
          assert dispatch["max_parallel_candidates"] == 1
          assert dispatch["max_job_minutes"] == 120
          runtime = lock["task_binding"]["runtime_benchmark"]
          assert runtime["per_invocation_timeout_seconds"] == 900
          assert runtime["benchmark_wall_budget_seconds"] == 4800
          assert runtime["reserved_non_benchmark_seconds"] == 2400
          assert runtime["authorized_job_ceiling_seconds"] == 7200
          assert runtime["warmups_excluded"] == 1
          assert runtime["measured_repetitions"] == 3
          assert runtime["prompt_tokens"] == 8192
          assert runtime["decode_tokens"] == 128
          assert runtime["threads"] == 2
          assert runtime["gpu_layers"] == 0
          assert runtime["device"] == "none"

          measure_sha = hashlib.sha256(Path("colab/mstr_b012_measure.py").read_bytes()).hexdigest()
          executor_sha = hashlib.sha256(Path("colab/mstr_b012_execute.py").read_bytes()).hexdigest()
          assert measure_sha == binding["b012_measurement_helper_sha256"]
          assert executor_sha == binding["executor_script_sha256"]
          assert measure_sha == "767b65ba6d1073418c5e1afcc447060cf2c3fec77d39391acaafb826c290cf1c"
          assert executor_sha == "699745547b0743e70a9dc94c223b028a565615041b6e0d895c3f96026a6521b0"

          execute_source = Path("colab/mstr_b012_execute.py").read_text(encoding="utf-8")
          assert "execution_started_monotonic = time.monotonic()" in execute_source
          assert "benchmark_started = time.monotonic()" not in execute_source
          assert "benchmark_started = execution_started_monotonic + pre_benchmark_elapsed_seconds" in execute_source
          raw_manifest = json.loads(Path("benchmarks/manifests/B012-raw-code-proxy.json").read_text(encoding="utf-8"))
          tasks = raw_manifest.get("tasks")
          assert isinstance(tasks, list) and len(tasks) == 3
          assert 3 * 600 <= runtime["reserved_non_benchmark_seconds"]
          print("SEMANTIC_REVIEW=PASS")
          PY
      - name: Exercise fail-closed timing semantics and full regression
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_timeout_binding.py \
            tests/contract/test_b012_timeout_budget.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          python -m mstr_qualify validate
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$SUBJECT_SHA"
          echo 'FINDINGS=NONE'
          echo 'INDEPENDENT_REVIEW=PASS'
          echo 'MODEL_EXECUTION_PERFORMED=false'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
