name: Build MSTR-000B convergence cross-workstream binding reconciliation

on:
  push:
    branches: [evidence/b029-b031-binding-builder-b20349c]

permissions:
  contents: write

env:
  BASE_SHA: b20349c23ada1130f98e28c0e1e3db56ed692d13
  FEATURE_BRANCH: fix/000b-convergence-cross-workstream-bindings

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve evidence-only builder script
        run: cp .github/evidence-builders/b029-b031-binding-builder.py /tmp/builder.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Re-anchor exact canonical base
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          git switch -c "$FEATURE_BRANCH"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
      - name: Reconcile exact external prerequisite bindings
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/builder.py
          printf '%s\n' \
            configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B029-B031-cross-workstream-binding-reconciliation.md \
            tests/contract/test_convergence_external_bindings.py | sort > /tmp/expected
          (git diff --name-only; git ls-files --others --exclude-standard) \
            | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Commit prospective atomic candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TheHalfMoon Evidence Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add configs/task-gate/mstr-000b.json \
            evidence/mstr-000b/B029-B031-cross-workstream-binding-reconciliation.md \
            tests/contract/test_convergence_external_bindings.py
          git commit -m 'fix(task-gate): bind convergence cross-workstream prerequisites'
          test "$(git rev-list --count "$BASE_SHA..HEAD")" -eq 1
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Prove prospective machine frontier
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          git update-ref refs/heads/main "$candidate"
          git update-ref refs/remotes/origin/main "$candidate"

          mstr-qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/drift.json', encoding='utf-8'))
          assert payload['status'] == 'clean', payload
          assert payload['findings'] == [], payload
          PY

          mstr-qualify task eligible B029 > /tmp/b029.json
          mstr-qualify task eligible B030 > /tmp/b030.json
          set +e
          mstr-qualify task eligible B031 > /tmp/b031.json; b031_rc=$?
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_rc=$?
          mstr-qualify task eligible B013 > /tmp/b013.json; b013_rc=$?
          set -e
          test "$b031_rc" -eq 1
          test "$b011_rc" -eq 1
          test "$b013_rc" -eq 1

          python - <<'PY'
          import json

          def load(path):
              return json.load(open(path, encoding='utf-8'))

          b029 = load('/tmp/b029.json')
          b030 = load('/tmp/b030.json')
          b031 = load('/tmp/b031.json')
          b011 = load('/tmp/b011.json')
          b013 = load('/tmp/b013.json')

          assert b029['eligible'] is True, b029
          assert b030['eligible'] is True, b030
          assert b031['eligible'] is False, b031
          assert not any(
              'missing_task_binding:A019' in reason
              or 'missing_task_binding:A020' in reason
              for reason in b031['reasons']
          ), b031
          assert b011['eligible'] is False, b011
          assert b011['authority_result']['required'] is True, b011
          assert b011['authority_result']['satisfied'] is False, b011
          assert b013['eligible'] is False, b013
          print('B029_PROSPECTIVE_ELIGIBLE=PASS')
          print('B030_PROSPECTIVE_ELIGIBLE=PASS')
          print('B031_EXTERNAL_BINDINGS_RESOLVED=PASS')
          print('B011_B013_HARD_STOPS_PRESERVED=PASS')
          PY
      - name: Restore canonical refs for regression isolation
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          test "$candidate" != "$BASE_SHA"
          git update-ref refs/heads/main "$BASE_SHA"
          git update-ref refs/remotes/origin/main "$BASE_SHA"
          test "$(git rev-parse refs/heads/main)" = "$BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$candidate"
      - name: Run repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            tests/contract/test_task_gate.py \
            tests/contract/test_convergence_external_bindings.py \
            tests/integration/test_task_gate_cli.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
      - name: Guarded feature push
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$BASE_SHA"
          test -z "$(git ls-remote origin "refs/heads/$FEATURE_BRANCH")"
          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"
          pushed="$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)"
          test "$pushed" = "$(git rev-parse HEAD)"
          echo "GUARDED_FEATURE_PUSH=PASS"
