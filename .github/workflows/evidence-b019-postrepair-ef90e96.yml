name: Verify B019 drift repair on canonical main

on:
  push:
    branches:
      - evidence/b019-postrepair-ef90e96

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN: ef90e96ba3d4e2c253987d1d104e0de26ce93529
  EXPECTED_PARENT1: 1badcb9b159f99ed8f752a7412dfb5f52b995c01
  EXPECTED_PARENT2: 19c255a1aabe106bd991fdf9262fe34dec280068
  PR_NUMBER: '80'

jobs:
  merge_identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef90e96ba3d4e2c253987d1d104e0de26ce93529
          fetch-depth: 0
      - name: Verify canonical repair merge identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT1"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PARENT2"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "closed"
          test "$(jq -r '.merged' <<<"$pr")" = "true"
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_PARENT2"

  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef90e96ba3d4e2c253987d1d104e0de26ce93529
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove canonical task drift is clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and .canonical_main == env.EXPECTED_MAIN and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json

  task_state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef90e96ba3d4e2c253987d1d104e0de26ce93529
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify B019 terminal and live successor frontier
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          if mstr-qualify task eligible B019 > /tmp/b019.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and .authority_result.required == false and (.reasons | index("task.already_terminal") != null)' /tmp/b019.json
          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          mstr-qualify task eligible B020 > /tmp/b020.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false' /tmp/b020.json
          mstr-qualify task eligible B022 > /tmp/b022.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false' /tmp/b022.json
          mstr-qualify task eligible B025 > /tmp/b025.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false' /tmp/b025.json
          if mstr-qualify task eligible B021 > /tmp/b021.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING"' /tmp/b021.json

  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef90e96ba3d4e2c253987d1d104e0de26ce93529
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-run B019 repair regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_teacher_rescue_contract.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/unit/test_task_drift.py tests/integration/test_task_drift_cli.py

  full_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef90e96ba3d4e2c253987d1d104e0de26ce93529
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen full quality on canonical main
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: [merge_identity, drift, task_state, focused, full_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b019-postrepair-ef90e96
          fetch-depth: 0
      - name: Final immutable canonical-main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
