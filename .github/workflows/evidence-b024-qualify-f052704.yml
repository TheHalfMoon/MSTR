name: Qualify exact B024 test-generation implementation

on:
  push:
    branches:
      - evidence/b024-qualify-f052704

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  BASE_SHA: 1ffa71c94bda161ec7be7784de3a6a4be81570ad
  TARGET_SHA: f052704cdb89b0e8d99135aa8d844c18a6b7a698
  TARGET_TREE: 9ca48d12ffabc2daf103caedb68d184a7d9cac3d
  TARGET_BRANCH: feat/000b-b024-test-generation-curriculum
  PR_NUMBER: '135'
  BUILDER_RUN: '33537678698'

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact candidate identity and bounded scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$TARGET_SHA" \
            '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and .commits == 1 and .changed_files == 11' /tmp/pr.json

          printf '%s\n' \
            docs/data/TEST_GENERATION_CURRICULUM.md \
            evidence/mstr-000b/B024-test-curriculum.md \
            schemas/mstr-test-generation-example-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-test-generation-example-v0.schema.json \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/schemas.py \
            tests/contract/test_schemas.py \
            tests/contract/test_test_generation_example_contract.py \
            tests/fixtures/schemas/invalid/mstr-test-generation-example-v0.json \
            tests/fixtures/schemas/valid/mstr-test-generation-example-v0.json \
            tests/integration/test_cli_offline.py | sort > /tmp/expected-files
          git diff --name-only "$BASE_SHA...$TARGET_SHA" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check "$BASE_SHA...$TARGET_SHA"
          cmp \
            schemas/mstr-test-generation-example-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-test-generation-example-v0.schema.json
          test -z "$(grep '^configs/task-gate/' /tmp/actual-files || true)"
          test -z "$(grep '^specs/002-code-model-supremacy-foundation/tasks.md$' /tmp/actual-files || true)"
          grep -F '**State:** `IMPLEMENTATION_ACTIVE`' evidence/mstr-000b/B024-test-curriculum.md

      - name: Verify successful atomic builder provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILDER_RUN}" > /tmp/builder.json
          jq -e '.status == "completed" and .conclusion == "success" and .name == "Build and qualify atomic B024 test-generation contract"' /tmp/builder.json

  canonical_machine_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Re-prove exact-main B024 eligibility and downstream ordering
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git update-ref refs/heads/main "$BASE_SHA"
          git update-ref refs/remotes/origin/main "$BASE_SHA"

          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B024 > /tmp/b024.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true' /tmp/b024.json
          jq -e '([.prerequisite_results[] | select(.task_id == "B023" and .satisfied == true)] | length) == 1' /tmp/b024.json

          set +e
          mstr-qualify task eligible B026 > /tmp/b026.json
          rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '(.eligible == false) and (([.prerequisite_results[] | select(.task_id == "B024" and .satisfied == false)] | length) == 1)' /tmp/b026.json

          set +e
          mstr-qualify task eligible B011 > /tmp/b011.json
          rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"

  candidate_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused B024 contract and CLI tests
        run: >-
          python -m pytest
          tests/contract/test_test_generation_example_contract.py
          tests/contract/test_schemas.py
          tests/integration/test_cli_offline.py
          tests/contract/test_task_gate.py
          -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src
      - name: Re-prove B024 authority boundary and schema identity
        shell: bash
        run: |
          set -euo pipefail
          cmp \
            schemas/mstr-test-generation-example-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-test-generation-example-v0.schema.json
          grep -F 'MODEL_WEIGHT_ACCESS = NONE' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'MODEL_EXECUTION = NONE' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'TEST_GENERATION_EXECUTION = NONE' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'VERIFIER_EXECUTION = NONE' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'PAID_COMPUTE = NONE' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'LARGE_DATASET_INGESTION = NONE' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'PRIVATE_USER_DATA_INGESTION = NONE' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'WEIGHT_CHANGING_TRAINING = NONE' evidence/mstr-000b/B024-test-curriculum.md
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"

  complete:
    needs: [identity_scope, canonical_machine_gate, candidate_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Final immutable candidate/main recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -e --arg base "$BASE_SHA" --arg head "$TARGET_SHA" '.state == "open" and .draft == false and .base.sha == $base and .head.sha == $head and .changed_files == 11'
          echo "B024_QUALIFIED_HEAD=$TARGET_SHA"
          echo "B024_QUALIFIED_TREE=$TARGET_TREE"
          echo "B024_EXACT_HEAD_QUALIFICATION=PASS"
          echo "WEIGHT_CHANGING_TRAINING=NONE"
