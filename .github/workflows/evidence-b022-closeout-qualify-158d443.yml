name: Qualify exact B022 canonical closeout

on:
  push:
    branches:
      - evidence/b022-closeout-qualify-158d443

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN: 97bf66a98bad51ff0d574d90a04fa47b802708ee
  EXPECTED_HEAD: 158d44320db53afeac6ff907cd4e836183b0c987
  EXPECTED_TREE: 122feaf68fd807fce1e1f2e85707643ed4fd075f
  PR_NUMBER: '86'

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 158d44320db53afeac6ff907cd4e836183b0c987
          fetch-depth: 0
      - name: Verify exact PR identity, ancestry, tree, and six-file scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.commits' <<<"$pr")" -eq 1
          test "$(jq -r '.changed_files' <<<"$pr")" -eq 6
          mapfile -t actual < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' | sort)
          expected=(
            configs/task-gate/mstr-000b.json
            evidence/mstr-000b/B022-verifier-health.md
            specs/002-code-model-supremacy-foundation/tasks.md
            tests/contract/test_task_gate.py
            tests/contract/test_verifier_health_contract.py
            tests/integration/test_task_gate_cli.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 6
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          test "$(git diff --name-only "$EXPECTED_MAIN"..."$EXPECTED_HEAD" -- schemas/mstr-verifier-health-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-verifier-health-v0.schema.json tests/fixtures/verifier-health src/mstr_qualify/schemas.py src/mstr_qualify/cli.py specs/002-code-model-supremacy-foundation/plan.md .specify/memory/constitution.md | wc -l)" -eq 0
          git diff --check "$EXPECTED_MAIN"..."$EXPECTED_HEAD"

  catalog_semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 158d44320db53afeac6ff907cd4e836183b0c987
          fetch-depth: 0
      - name: Prove only B022 machine state changes and closeout provenance is exact
        shell: bash
        run: |
          set -euo pipefail
          git show "$EXPECTED_MAIN:configs/task-gate/mstr-000b.json" > /tmp/base.json
          cp configs/task-gate/mstr-000b.json /tmp/head.json
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('/tmp/base.json').read_text())
          head = json.loads(Path('/tmp/head.json').read_text())
          assert base.keys() == head.keys()
          assert base['tasks'].keys() == head['tasks'].keys()
          for task_id in base['tasks']:
              before = base['tasks'][task_id]
              after = head['tasks'][task_id]
              if task_id == 'B022':
                  expected = dict(before)
                  expected['canonical_state'] = 'COMPLETE_CANONICAL'
                  assert before['canonical_state'] == 'PENDING'
                  assert after == expected
              else:
                  assert after == before, task_id
          PY
          grep -F '**State:** COMPLETE_CANONICAL' evidence/mstr-000b/B022-verifier-health.md
          grep -F '**Implementation PR:** #85' evidence/mstr-000b/B022-verifier-health.md
          grep -F 'ab3330afdef9c9329b1d2bb2a7e5aab09064f62b' evidence/mstr-000b/B022-verifier-health.md
          grep -F '97bf66a98bad51ff0d574d90a04fa47b802708ee' evidence/mstr-000b/B022-verifier-health.md
          grep -F 'run `33245760496` — SUCCESS' evidence/mstr-000b/B022-verifier-health.md
          grep -F 'run `33245884971` — SUCCESS' evidence/mstr-000b/B022-verifier-health.md
          grep -F 'review `5057533717` — NO BLOCKING FINDINGS' evidence/mstr-000b/B022-verifier-health.md
          grep -F 'run `33245974810` — SUCCESS' evidence/mstr-000b/B022-verifier-health.md
          grep -F 'run `33246110168` — SUCCESS' evidence/mstr-000b/B022-verifier-health.md
          grep -F 'VERIFIER_EVALUATOR_EXECUTION = NONE' evidence/mstr-000b/B022-verifier-health.md
          grep -F 'B023_VERIFIER_HEALTH_EVALUATOR_AUTHORITY = NONE' evidence/mstr-000b/B022-verifier-health.md
          grep -F 'MODEL_WEIGHT_ACCESS = NONE' evidence/mstr-000b/B022-verifier-health.md
          grep -F 'MODEL_EXECUTION = NONE' evidence/mstr-000b/B022-verifier-health.md
          grep -F 'WEIGHT_CHANGING_TRAINING = NONE' evidence/mstr-000b/B022-verifier-health.md

  prospective_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 158d44320db53afeac6ff907cd4e836183b0c987
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove prospective terminal semantics and downstream frontier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json
          if mstr-qualify task eligible B022 > /tmp/b022.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and .authority_result.required == false and (.reasons | index("task.already_terminal")) != null' /tmp/b022.json
          if mstr-qualify task eligible B023 > /tmp/b023.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING" and (.reasons | index("prerequisite.unsatisfied:B022")) == null and (.reasons | index("prerequisite.unsatisfied:A006")) != null and (.reasons | index("prerequisite.unsatisfied:A014")) != null' /tmp/b023.json
          mstr-qualify task eligible B025 > /tmp/b025.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false' /tmp/b025.json
          if mstr-qualify task eligible B011 > /tmp/b011.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json

  full_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 158d44320db53afeac6ff907cd4e836183b0c987
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact-head closeout and canonical quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_task_gate.py tests/contract/test_verifier_health_contract.py tests/integration/test_task_gate_cli.py
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: [identity_scope, catalog_semantics, prospective_gate, full_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/b022-closeout-qualify-158d443
          fetch-depth: 0
      - name: Final immutable main, closeout head, tree, and PR recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/docs/000b-b022-canonicalize | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          tree=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${EXPECTED_HEAD}" --jq '.tree.sha')
          test "$tree" = "$EXPECTED_TREE"
