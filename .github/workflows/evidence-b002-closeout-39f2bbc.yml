name: Evidence B002 closeout exact-head qualification

on:
  push:
    branches:
      - evidence/b002-closeout-39f2bbc-gates

permissions:
  contents: read

jobs:
  qualify-closeout:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 39f2bbcf0e6e03181af73d7ec04f2bf3ddfd69c8
      EXPECTED_MAIN: 298a97e957fe98edec2c9fdd3f78f0f909ec09fa
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact B002 closeout head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact target and canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Compile closeout-aware task-gate tests
        run: python -m py_compile tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py

      - name: Verify closeout state sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('configs/task-gate/mstr-000b.json').read_text(encoding='utf-8'))
          assert catalog['tasks']['B002']['canonical_state'] == 'COMPLETE_CANONICAL'
          tasks = Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text(encoding='utf-8')
          assert '- [x] **B002 Implement offline task eligibility validator.**' in tasks
          evidence = Path('evidence/mstr-000b/B002-task-gate.md').read_text(encoding='utf-8')
          assert '**State:** COMPLETE_CANONICAL' in evidence
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Targeted task-gate tests
        run: pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py

      - name: Prove B002 terminal and B003 successor eligibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from mstr_qualify.task_gate import evaluate_task_snapshot
          main = 'a' * 40
          b002 = evaluate_task_snapshot('B002', canonical_main=main)
          assert b002['eligible'] is False, b002
          assert 'task.already_terminal' in b002['reasons'], b002
          b003 = evaluate_task_snapshot('B003', canonical_main=main)
          assert b003['eligible'] is True, b003
          predecessor = b003['prerequisite_results'][0]
          assert predecessor['task_id'] == 'B002'
          assert predecessor['observed_state'] == 'COMPLETE_CANONICAL'
          assert predecessor['satisfied'] is True
          print('B002_TERMINAL=true')
          print('B003_CLOSEOUT_HEAD_ELIGIBLE=true')
          PY

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Verify immutable exact head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --short)"
          git diff --exit-code
          echo "FINAL_CLOSEOUT_SHA=$(git rev-parse HEAD)"
