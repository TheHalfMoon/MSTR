name: PR182 B012 mandatory premerge

on:
  push:
    branches:
      - evidence/pr182-b012-mandatory-premerge-35678ec

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  PR_NUMBER: "182"
  BASE_SHA: 4e72c3e1a4e196ad67d932c71c896511968da08e
  SUBJECT_BRANCH: fix/b012-stage-checkpoint-topology-repair
  SUBJECT_SHA: 35678ec3ee90b58be35d336a9ddf2993c72f82a9
  SUBJECT_TREE: 5c18857b12565f6d5838b83c0fede8c9fdb8a556
  QUALIFICATION_RUN: "34145683090"
  QUALIFICATION_HEAD: 3c0105ac3dbb2943103e0c515e8c49406f02912f
  QUALIFICATION_BRANCH: evidence/pr182-b012-topology-qualification-v3-35678ec
  REVIEW_RUN: "34146954133"
  REVIEW_HEAD: 222075bb347a3709cf9cf825b8288d3d9ef1235a
  REVIEW_BRANCH: evidence/pr182-b012-independent-review-v2-35678ec
  STAGED_EXECUTOR_SHA256: 1cffee33a17c524dac0743a975d6538e845361d8ae7f8dedf808e4c740f5250e
  CANDIDATE_WORKFLOW_SHA256: 383cae4a3729045b9d5a5b2e23ef3430a410070fceefc507b78eaaeaf0232f29
  REPAIR_MANIFEST_SHA256: 97f791427adf1402f90a07a2a74c31d66c2e892d78c858885ce4078704c35b92

jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout premerge evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Prove exact base head tree evidence ancestry and scope
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" "$QUALIFICATION_BRANCH" "$REVIEW_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          [[ "$(git rev-parse "origin/$QUALIFICATION_BRANCH")" == "$QUALIFICATION_HEAD" ]]
          [[ "$(git rev-parse "origin/$REVIEW_BRANCH")" == "$REVIEW_HEAD" ]]
          [[ "$(git rev-parse "$QUALIFICATION_HEAD^")" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse "$REVIEW_HEAD^")" == "$SUBJECT_SHA" ]]
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            "artifacts/manifests/B012-runner-shutdown-topology-repair.json"
            "colab/mstr_b012_staged.py"
            "configs/workflows/b012-qualify-staged.yml"
            "tests/contract/test_b012_stage_checkpoint_topology.py"
          )
          [[ "${#changed[@]}" -eq 4 ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- .github/workflows/b012-qualify.yml
          git diff --quiet "$BASE_SHA" "$SUBJECT_SHA" -- artifacts/manifests/B012-executor-toolchain-binding.json

      - name: Reverify B012 machine eligibility on actual canonical main
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligibility.json
          python - <<'PY'
          import json
          import os
          data = json.load(open('/tmp/b012-eligibility.json', encoding='utf-8'))
          assert data['task_id'] == 'B012'
          assert data['canonical_main'] == os.environ['BASE_SHA']
          assert data['eligible'] is True
          assert data['authority_result']['satisfied'] is True
          assert data['state_consistency_result']['observed_state'] == 'PENDING'
          assert all(item['satisfied'] for item in data['prerequisite_results'])
          PY
          git checkout --detach "$SUBJECT_SHA"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]

      - name: Verify immutable qualification review and live PR discussion state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-pr182-mandatory-premerge',
          }

          def rest(path: str):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/TheHalfMoon/MSTR{path}', headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          q = rest(f"/actions/runs/{os.environ['QUALIFICATION_RUN']}")
          assert q['status'] == 'completed' and q['conclusion'] == 'success'
          assert q['head_sha'] == os.environ['QUALIFICATION_HEAD']
          assert q['head_branch'] == os.environ['QUALIFICATION_BRANCH']
          qjobs = rest(f"/actions/runs/{os.environ['QUALIFICATION_RUN']}/jobs?per_page=100")['jobs']
          assert any(job['name'] == 'qualify' and job['conclusion'] == 'success' for job in qjobs)

          r = rest(f"/actions/runs/{os.environ['REVIEW_RUN']}")
          assert r['status'] == 'completed' and r['conclusion'] == 'success'
          assert r['head_sha'] == os.environ['REVIEW_HEAD']
          assert r['head_branch'] == os.environ['REVIEW_BRANCH']
          rjobs = rest(f"/actions/runs/{os.environ['REVIEW_RUN']}/jobs?per_page=100")['jobs']
          assert any(job['name'] == 'review' and job['conclusion'] == 'success' for job in rjobs)

          pr = rest('/pulls/182')
          assert pr['state'] == 'open'
          assert pr['draft'] is False
          assert pr['base']['ref'] == 'main'
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['ref'] == os.environ['SUBJECT_BRANCH']
          assert pr['head']['sha'] == os.environ['SUBJECT_SHA']
          assert pr['changed_files'] == 4
          assert pr['mergeable'] is not False
          reviews = rest('/pulls/182/reviews?per_page=100')
          assert not any(review.get('state') == 'CHANGES_REQUESTED' for review in reviews)
          inline = rest('/pulls/182/comments?per_page=100')
          assert len(inline) == 0

          query = '''query($owner:String!, $name:String!, $number:Int!) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                reviewThreads(first:100) { nodes { isResolved } }
              }
            }
          }'''
          payload = json.dumps({
              'query': query,
              'variables': {'owner': 'TheHalfMoon', 'name': 'MSTR', 'number': 182},
          }).encode()
          request = urllib.request.Request(
              'https://api.github.com/graphql',
              data=payload,
              headers={**headers, 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              graph = json.load(response)
          assert 'errors' not in graph, graph
          threads = graph['data']['repository']['pullRequest']['reviewThreads']['nodes']
          assert not any(thread['isResolved'] is False for thread in threads)
          print('QUALIFICATION_REVIEW_AND_DISCUSSION_STATE=PASS')
          PY

      - name: Verify exact repair identities inert binding and frozen semantics
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$STAGED_EXECUTOR_SHA256" colab/mstr_b012_staged.py | sha256sum -c -
          printf '%s  %s\n' "$CANDIDATE_WORKFLOW_SHA256" configs/workflows/b012-qualify-staged.yml | sha256sum -c -
          printf '%s  %s\n' "$REPAIR_MANIFEST_SHA256" artifacts/manifests/B012-runner-shutdown-topology-repair.json | sha256sum -c -
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def sha(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          repair = json.loads(Path('artifacts/manifests/B012-runner-shutdown-topology-repair.json').read_text())
          binding = json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          lock = json.loads(Path('artifacts/manifests/B012-executor-toolchain-lock.json').read_text())
          authority = json.loads(Path('artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json').read_text())

          assert repair['staged_executor_sha256'] == sha('colab/mstr_b012_staged.py')
          assert repair['candidate_workflow_sha256'] == sha('configs/workflows/b012-qualify-staged.yml')
          assert binding['status'] == 'BLOCKED_PENDING_RUNNER_SHUTDOWN_TOPOLOGY_REPAIR'
          assert 'runner_shutdown_topology_repair_manifest_sha256' not in binding
          assert repair['activation_state'] == 'INERT_UNTIL_SEPARATE_CANONICAL_BINDING_ACTIVATION'
          recovery = repair['recovery_semantics']
          assert recovery['retry_same_failed_action_without_new_evidence'] is False
          assert recovery['retry_authority_created'] is False
          assert recovery['external_dispatch_authority_created'] is False
          assert recovery['activation_requires_exact_main_task_eligibility'] is True
          assert recovery['activation_requires_reverification_of_canonical_external_effect_authority'] is True
          assert recovery['activation_requires_separate_review_and_merge'] is True
          candidates = ['mellum-4b', 'qwen3.5-0.8b-control']
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['candidate_ids'] == candidates
          assert repair['authority_boundary']['candidate_ids'] == candidates
          for key in (
              'candidate_revision_or_file_expansion', 'new_candidates', 'training',
              'weight_changing_training', 'production_release', 'authority_scope_modified',
              'authority_transfer',
          ):
              assert repair['authority_boundary'][key] is False
          for key in ('paid_compute', 'paid_model_api'):
              assert repair['resource_boundary'][key] is False
          assert repair['resource_boundary']['aggregate_required_source_download_bytes'] == 9817996174
          assert repair['resource_boundary']['git_model_binaries'] == 0
          assert repair['resource_boundary']['founder_machine_model_binaries'] == 0
          expected = {
              'prompt_tokens': 8192,
              'decode_tokens': 128,
              'threads': 2,
              'warmups_excluded': 1,
              'measured_repetitions': 3,
              'per_invocation_timeout_seconds': 900,
              'benchmark_wall_budget_seconds': 4800,
              'reserved_non_benchmark_seconds': 2400,
              'authorized_job_ceiling_seconds': 7200,
          }
          runtime = lock['task_binding']['runtime_benchmark']
          for key, value in expected.items():
              assert runtime[key] == value
              assert repair['benchmark_semantics'][key] == value
          assert lock['runner']['max_job_minutes'] == 120
          assert repair['benchmark_semantics']['prefill_decode_share_one_monotonic_budget_clock'] is True
          assert repair['benchmark_semantics']['modified_by_repair'] is False
          print('REPAIR_IDENTITIES_AND_FROZEN_SEMANTICS=PASS')
          PY

      - name: Mandatory focused and full quality gate
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m py_compile colab/mstr_b012_staged.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_staged.py \
            tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mypy src/mstr_qualify

      - name: Final exact live premerge guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          python - <<'PY'
          import json
          import os
          import urllib.request
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-pr182-final-premerge',
          }
          def rest(path: str):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/TheHalfMoon/MSTR{path}', headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          pr = rest('/pulls/182')
          assert pr['state'] == 'open' and pr['draft'] is False
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['sha'] == os.environ['SUBJECT_SHA']
          assert pr['changed_files'] == 4
          reviews = rest('/pulls/182/reviews?per_page=100')
          assert not any(review.get('state') == 'CHANGES_REQUESTED' for review in reviews)
          PY
          echo 'PR182_MANDATORY_PREMERGE=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
