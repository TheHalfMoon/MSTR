name: B002 CLI wire

on:
  push:
    branches:
      - evidence/b002-cli-wire

permissions:
  contents: write

env:
  EXPECTED_HEAD: cfcd98283d7e181fc18b4b20ce0069502505a3ff
  EXPECTED_MAIN: 856a7993f64a7f17ead6f6c019c5668724444ed4
  TARGET_BRANCH: feat/000b-b002-task-gate
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  wire-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout guarded B002 branch
        uses: actions/checkout@v4
        with:
          ref: feat/000b-b002-task-gate
          fetch-depth: 0

      - name: Verify exact branch and main identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"

      - name: Wire task eligible CLI
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/mstr_qualify/cli.py")
          text = path.read_text(encoding="utf-8")

          old_commands = """mstr-qualify validate [paths...]\nmstr-qualify rights <candidate-config>\nmstr-qualify candidate static <candidate-config>\nmstr-qualify manifest validate <manifest> [--kind {candidate,task,benchmark}]\n"""
          new_commands = """mstr-qualify validate [paths...]\nmstr-qualify rights <candidate-config>\nmstr-qualify candidate static <candidate-config>\nmstr-qualify task eligible <TASK_ID>\nmstr-qualify manifest validate <manifest> [--kind {candidate,task,benchmark}]\n"""
          if text.count(old_commands) != 1:
              raise SystemExit("CLI command-family documentation anchor mismatch")
          text = text.replace(old_commands, new_commands, 1)

          import_anchor = """from .schemas import (\n    DEFAULT_SCHEMA_DIR,\n    SCHEMA_FILES,\n    load_schema,\n    validation_errors,\n)\n"""
          import_replacement = import_anchor + "from .task_gate import evaluate_task_eligibility\n"
          if text.count(import_anchor) != 1:
              raise SystemExit("CLI import anchor mismatch")
          text = text.replace(import_anchor, import_replacement, 1)

          parser_marker = """# ---------------------------------------------------------------------------\n# parser and dispatch\n# ---------------------------------------------------------------------------\n"""
          task_runner = """# ---------------------------------------------------------------------------\n# task eligibility\n# ---------------------------------------------------------------------------\n\n\ndef run_task_eligible(task_id: str) -> tuple[int, dict[str, Any]]:\n    \"\"\"Evaluate one canonical task without mutating repository state.\"\"\"\n\n    result = evaluate_task_eligibility(task_id)\n    exit_code = _EXIT_OK if result[\"eligible\"] else _EXIT_FAIL_CLOSED\n    return exit_code, result\n\n\n"""
          if text.count(parser_marker) != 1:
              raise SystemExit("CLI parser marker mismatch")
          text = text.replace(parser_marker, task_runner + parser_marker, 1)

          manifest_anchor = """    manifest_parser = subparsers.add_parser(\n        \"manifest\",\n        help=\"manifest subcommands (validate only in T010)\",\n    )\n"""
          task_parser = """    task_parser = subparsers.add_parser(\n        \"task\",\n        help=\"offline canonical task-gate checks\",\n    )\n    task_subparsers = task_parser.add_subparsers(dest=\"task_command\", required=True)\n    task_eligible_parser = task_subparsers.add_parser(\n        \"eligible\",\n        help=\"evaluate one task against canonical repository-local state\",\n    )\n    task_eligible_parser.add_argument(\"task_id\")\n\n"""
          if text.count(manifest_anchor) != 1:
              raise SystemExit("CLI manifest parser anchor mismatch")
          text = text.replace(manifest_anchor, task_parser + manifest_anchor, 1)

          dispatch_anchor = """    if args.command == \"manifest\":\n"""
          task_dispatch = """    if args.command == \"task\":\n        if args.task_command == \"eligible\":\n            return run_task_eligible(args.task_id)\n        raise QualificationError(\n            \"unknown task subcommand\",\n            code=\"cli.subcommand_unknown\",\n            details={\"subcommand\": str(args.task_command)},\n        )\n"""
          if text.count(dispatch_anchor) != 1:
              raise SystemExit("CLI dispatch anchor mismatch")
          text = text.replace(dispatch_anchor, task_dispatch + dispatch_anchor, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="src/mstr_qualify/cli.py"
          test "$actual" = "$expected"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project development tooling
        run: python -m pip install -e '.[dev]'

      - name: Verify B002 candidate
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy
          python -m mstr_qualify validate
          python -m mstr_qualify task eligible B002
          set +e
          python -m mstr_qualify task eligible B003
          code=$?
          set -e
          test "$code" = "1"

      - name: Commit and fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mstr_qualify/cli.py
          git commit -m "feat(mstr-000b): wire B002 task eligibility CLI"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "NEW_B002_HEAD=$(git rev-parse HEAD)"
