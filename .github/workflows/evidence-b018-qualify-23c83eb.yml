name: Qualify exact B018 implementation head

on:
  push:
    branches:
      - evidence/b018-qualify-23c83eb

permissions:
  contents: read

env:
  EXPECTED_MAIN: 73b60aa9421f51be52560bbbca6e8dd46b77b6c9
  EXPECTED_HEAD: 23c83ebae95ca3f0d893840e9d994b33712f124f
  TARGET_BRANCH: feat/000b-b018-self-alignment-contract

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Bind canonical main, task state, and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          python -m mstr_qualify task eligible B018 > /tmp/b018.json
          set +e
          python -m mstr_qualify task eligible B011 > /tmp/b011.json
          b011_rc=$?
          set -e
          test "$b011_rc" -ne 0
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json
          import os

          b018 = json.load(open('/tmp/b018.json'))
          b011 = json.load(open('/tmp/b011.json'))
          drift = json.load(open('/tmp/drift.json'))
          assert b018['canonical_main'] == os.environ['EXPECTED_MAIN']
          assert b018['eligible'] is True
          assert b018['state_consistency_result']['observed_state'] == 'PENDING'
          assert b018['authority_result']['required'] is False
          assert b018['authority_result']['satisfied'] is True
          assert b011['eligible'] is False
          assert b011['state_consistency_result']['observed_state'] == 'BLOCKED'
          assert b011['authority_result']['required'] is True
          assert b011['authority_result']['satisfied'] is False
          assert drift['status'] == 'clean' and drift['findings'] == []
          PY
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          expected=$(printf '%s\n' \
            evidence/mstr-000b/B018-self-alignment-contract.md \
            schemas/mstr-self-alignment-generation-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-self-alignment-generation-v0.schema.json \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/schemas.py \
            tests/contract/test_schemas.py \
            tests/contract/test_self_alignment_contract.py \
            tests/fixtures/schemas/valid/mstr-self-alignment-generation-v0.json \
            tests/fixtures/schemas/invalid/mstr-self-alignment-generation-v0.json \
            tests/integration/test_cli_offline.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          for path in \
            configs/task-gate/mstr-000b.json \
            specs/002-code-model-supremacy-foundation/tasks.md \
            .specify/memory/constitution.md \
            configs/quality.toml \
            pyproject.toml; do
            git diff --quiet "$EXPECTED_MAIN" "$EXPECTED_HEAD" -- "$path"
          done

  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23c83ebae95ca3f0d893840e9d994b33712f124f
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: B018 focused contract and fixture gates
        shell: bash
        run: |
          set -euo pipefail
          cmp \
            schemas/mstr-self-alignment-generation-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-self-alignment-generation-v0.schema.json
          pytest -q \
            tests/contract/test_self_alignment_contract.py \
            tests/contract/test_schemas.py \
            tests/integration/test_cli_offline.py::test_validate_self_checks_schemas_and_fixtures
          python -m mstr_qualify validate tests/fixtures/schemas/valid/mstr-self-alignment-generation-v0.json
          if python -m mstr_qualify validate tests/fixtures/schemas/invalid/mstr-self-alignment-generation-v0.json; then
            echo 'invalid B018 fixture unexpectedly validated' >&2
            exit 1
          fi

  test_suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23c83ebae95ca3f0d893840e9d994b33712f124f
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23c83ebae95ca3f0d893840e9d994b33712f124f
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23c83ebae95ca3f0d893840e9d994b33712f124f
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: mypy

  schema_selfcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23c83ebae95ca3f0d893840e9d994b33712f124f
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m mstr_qualify validate

  complete:
    needs: [identity, focused, test_suite, lint, typecheck, schema_selfcheck]
    runs-on: ubuntu-24.04
    steps:
      - name: Final immutable remote recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          echo 'B018_EXACT_HEAD_QUALIFICATION=PASS'
          echo 'B011_REMAINS_BLOCKED=PASS'
