name: Post-merge verification for B023 verifier health

on:
  push:
    branches:
      - evidence/b023-verifier-health-postmerge-f71a15f

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN: f71a15f967250c5c523749be9f9f3066feccb902
  EXPECTED_PARENT1: fdca133e53a47b8966faef172812da58503576a0
  EXPECTED_PARENT2: da0480c0eb39e4097cb2d3fd3337a7fc49ab75dc
  EXPECTED_TREE: 097cf6373e918e60f6c20bb81e3b7f28435177d3
  PR_NUMBER: '133'

jobs:
  merge_identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Verify exact B023 implementation merge identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT1"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PARENT2"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg merge "$EXPECTED_MAIN" --arg head "$EXPECTED_PARENT2" --arg base "$EXPECTED_PARENT1" '.state == "closed" and .merged == true and .draft == false and .merge_commit_sha == $merge and .head.sha == $head and .base.sha == $base and .changed_files == 4' /tmp/pr.json

  task_frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove canonical drift and B023 pre-closeout frontier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"

          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json

          mstr-qualify task eligible B023 > /tmp/b023.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true' /tmp/b023.json
          jq -e '[.prerequisite_results[] | select(.task_id == "A006" or .task_id == "A014" or .task_id == "B002" or .task_id == "B022") | .satisfied] | length == 4 and all(. == true)' /tmp/b023.json

          if mstr-qualify task eligible B024 > /tmp/b024.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING" and (.reasons | index("prerequisite.unsatisfied:B023")) != null' /tmp/b024.json

          if mstr-qualify task eligible B026 > /tmp/b026.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING" and (.reasons | index("prerequisite.unsatisfied:B024")) != null' /tmp/b026.json

          echo "B023_PRE_CLOSEOUT=$(jq -c '{eligible,state:.state_consistency_result.observed_state,reasons}' /tmp/b023.json)"
          echo "B024_PRE_CLOSEOUT=$(jq -c '{eligible,state:.state_consistency_result.observed_state,reasons}' /tmp/b024.json)"
          echo "B026_PRE_CLOSEOUT=$(jq -c '{eligible,state:.state_consistency_result.observed_state,reasons}' /tmp/b026.json)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  quality_authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused B023, B022, and A018 tests
        run: >-
          python -m pytest
          tests/unit/test_verifier_health.py
          tests/contract/test_verifier_health_contract.py
          tests/unit/trajectory/test_trajectory_factory.py
          -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src
      - name: Re-prove B023 authority and admission boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MODEL_EXECUTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'MODEL_WEIGHT_ACCESS = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'NETWORK_EXECUTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'PAID_COMPUTE = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'LARGE_DATASET_INGESTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'PRIVATE_USER_DATA_INGESTION = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'WEIGHT_CHANGING_TRAINING = NONE' evidence/mstr-000b/B023-verifier-health-implementation.md
          grep -F 'bind_verifier_health' tests/unit/test_verifier_health.py
          grep -F 'decide_training_admission' tests/unit/test_verifier_health.py
          grep -F 'A006' tests/unit/test_verifier_health.py
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

  complete:
    needs: [merge_identity, task_frontier, quality_authority]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
      - name: Final immutable canonical-main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT1"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PARENT2"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo "B023_POSTMERGE_MAIN=$EXPECTED_MAIN"
          echo "B023_POSTMERGE=PASS"
          echo "B023_COMPLETE_CANONICAL=NO"
          echo "MODEL_EXECUTION=NONE"
          echo "WEIGHT_CHANGING_TRAINING=NONE"
