name: PR169 T031 authority exact-head qualification

on:
  push:
    branches:
      - evidence/pr169-t031-authority-qualification-1509ac1

permissions:
  contents: read
  pull-requests: read

env:
  REPO: TheHalfMoon/MSTR
  PR_NUMBER: "169"
  BASE_SHA: e5e47644fb7122cbb47b43cdf13d072f82ebfdf7
  TARGET_HEAD: 1509ac18f00e700b4d9ed3dba518f7b335466c9d
  TARGET_TREE: 2a580729c525fc0c5ccfb2790ff528adfe0be1ee

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact authority head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Verify live identity and exact T031 scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" "$TARGET_HEAD")" = "$BASE_SHA"
          git diff --check "$BASE_SHA...$TARGET_HEAD"
          changed="$(git diff --name-only "$BASE_SHA...$TARGET_HEAD" | sort)"
          expected="$(printf '%s\n' artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json artifacts/manifests/T031-local-measurement-execution-envelope.json tests/contract/test_t031_authority.py | sort)"
          test "$changed" = "$expected"
          pr_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")"
          python - "$pr_json" <<'PY'
          import json, os, sys
          pr=json.loads(sys.argv[1])
          assert pr['state']=='open' and pr['draft'] is False
          assert pr['base']['sha']==os.environ['BASE_SHA']
          assert pr['head']['sha']==os.environ['TARGET_HEAD']
          assert pr['changed_files']==3 and pr['commits']==1
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/authorities/T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION.json').read_text())
          e=json.loads(Path('artifacts/manifests/T031-local-measurement-execution-envelope.json').read_text())
          ids=['granite-4.1-3b','ministral-3-3b','qwen2.5-coder-1.5b','qwen3-4b','qwen3.5-2b','qwen3.5-4b','smollm3-3b','yi-coder-1.5b']
          assert a['authority_id']=='T031_FOUNDER_AUTHORITY_FOR_LOCAL_MEASUREMENT_REGENERATION'
          assert a['task_id']=='T031' and a['status']=='AUTHORIZED_CANONICAL'
          s=a['scope']
          assert s['decision']=='FOUNDER_T031_LOCAL_MEASUREMENT_DECISION=AUTHORIZE_EXACT_T029_CANDIDATES'
          assert s['decision_surface']=={'issue':167,'comment_id':5553875809}
          assert s['candidate_ids']==ids and e['candidate_ids']==ids
          assert s['b010_b012_candidates'] is False
          assert s['t032_execution'] is False and s['t033_execution'] is False
          assert s['t034_admission_decision'] is False
          assert s['training'] is False and s['weight_changing_training'] is False
          assert e['measurement_contract']['contexts']==[4096,8192,16384]
          assert e['dispatch_state']=='BLOCKED_PENDING_CANONICAL_EXECUTOR_TOOLCHAIN_BINDING'
          assert e['toolchain_provisioning']['state']=='BLOCKED_PENDING_SEPARATELY_REVIEWED_EXECUTOR_BINDING'
          assert e['resource_ceiling']['paid_cost_usd']==0.0
          assert e['runner_envelope']['founder_machine_model_binaries']==0
          assert e['runner_envelope']['git_model_binaries']==0
          assert 'mellum-4b' not in e['candidate_ids']
          assert 'qwen3.5-0.8b-control' not in e['candidate_ids']
          PY
          test -z "$(git status --porcelain)"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact authority head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - name: Run frozen repository gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_authority.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"

  final_qualification:
    needs: [identity_scope, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Recheck exact live head and emit verdict
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/branches/main" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          pr_head="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          test "$main_sha" = "$BASE_SHA"
          test "$pr_head" = "$TARGET_HEAD"
          echo "T031_AUTHORITY_EXACT_HEAD_QUALIFICATION=PASS"
          echo "BASE_SHA=$BASE_SHA"
          echo "TARGET_HEAD=$TARGET_HEAD"
          echo "TARGET_TREE=$TARGET_TREE"
          echo "EXTERNAL_EXECUTION=NOT_DISPATCHED"
