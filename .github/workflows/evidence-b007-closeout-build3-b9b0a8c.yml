name: Build clean-checkout B007 canonical closeout

on:
  push:

permissions:
  contents: write

env:
  EXPECTED_MAIN: b9b0a8ca7b9b7528f5da518baa83b23e2348c6f6
  TARGET_BRANCH: docs/000b-b007-canonicalize
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard exact pre-closeout truth
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          git branch -f main "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B007 > /tmp/b007-before.json
          set +e
          python -m mstr_qualify task eligible B008 > /tmp/b008-before.json
          b8_rc=$?
          set -e
          test "$b8_rc" -eq 1
          python -m mstr_qualify task drift > /tmp/drift-before.json
          python - <<'PY'
          import json, os
          m=os.environ['EXPECTED_MAIN']
          b7=json.load(open('/tmp/b007-before.json')); b8=json.load(open('/tmp/b008-before.json')); d=json.load(open('/tmp/drift-before.json'))
          assert b7['canonical_main']==m and b7['task_id']=='B007' and b7['eligible'] is True and b7['reasons']==[], b7
          assert b7['state_consistency_result']['observed_state']=='PENDING', b7
          assert b8['canonical_main']==m and b8['task_id']=='B008' and b8['eligible'] is False, b8
          assert b8['reasons']==['prerequisite.unsatisfied:B007'], b8
          assert d['canonical_main']==m and d['status']=='clean' and d['findings']==[], d
          print('B007_PRECLOSEOUT_TRUTH=PASS')
          PY
      - name: Materialize five-file closeout and create clean local candidate commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, os

          config_path=Path('configs/task-gate/mstr-000b.json')
          catalog=json.loads(config_path.read_text())
          b7=catalog['tasks']['B007']
          assert b7['canonical_state']=='PENDING'
          assert b7['closeout_rule']['require_all_outputs'] is True
          assert b7['outputs']==['benchmarks/manifests/B007-tokenizer-economics.json']
          b7['canonical_state']='COMPLETE_CANONICAL'
          b7['outputs']=[
              'benchmarks/manifests/B007-tokenizer-economics.json',
              'benchmarks/fixtures/tokenizer-economics/B007-corpus.json',
          ]
          config_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False)+'\n')

          tasks_path=Path('specs/002-code-model-supremacy-foundation/tasks.md')
          tasks=tasks_path.read_text()
          old='- [ ] **B007 Freeze tokenizer-economics benchmark corpus/protocol.**  '
          assert tasks.count(old)==1
          tasks=tasks.replace(old,'- [x] **B007 Freeze tokenizer-economics benchmark corpus/protocol.**',1)
          output='  Outputs: `benchmarks/manifests/B007-tokenizer-economics.json`, fixtures, `evidence/mstr-000b/B007-tokenizer-protocol.md`.\n'
          assert tasks.count(output)==1
          tasks=tasks.replace(output,output+'  Canonical implementation: PR #59 / final head `965fbdbf152272397ae6ef721260e806be5d251c` / merge `b9b0a8ca7b9b7528f5da518baa83b23e2348c6f6`.\n',1)
          tasks_path.write_text(tasks)

          ev_path=Path('evidence/mstr-000b/B007-tokenizer-protocol.md')
          ev=ev_path.read_text()
          old_state='**State:** IMPLEMENTATION_ACTIVE / NOT_COMPLETE_CANONICAL\n'
          assert ev.count(old_state)==1
          ev=ev.replace(old_state,
              '**State:** COMPLETE_CANONICAL\n'
              '**Implementation PR:** `#59`\n'
              '**Final implementation head:** `965fbdbf152272397ae6ef721260e806be5d251c`\n'
              '**Canonical implementation merge:** `b9b0a8ca7b9b7528f5da518baa83b23e2348c6f6`\n',1)
          stale='Final-head identity, exact-head qualification, and independent review remain separate gates before merge.\n'
          assert ev.count(stale)==1
          ev=ev.replace(stale,
              'Exact-head qualification run `33148508447` (job `98774836633`) and independent adversarial review run `33148717463` (job `98775495939`) both passed on final implementation head `965fbdbf152272397ae6ef721260e806be5d251c` before merge. Post-implementation verification run `33148856216` (job `98775927107`) then passed on canonical main `b9b0a8ca7b9b7528f5da518baa83b23e2348c6f6`.\n',1)
          tail='B007 remains unchecked and NOT COMPLETE_CANONICAL. B008 must not infer execution or acquisition authority from this protocol.\n'
          assert ev.count(tail)==1
          ev=ev.replace(tail,
              'This separate closeout canonicalizes B007 only after implementation merge and exact-main post-implementation verification. It does not create tokenizer acquisition/measurement, model access/execution, compute, training, or B008 external authority.\n',1)
          marker='## Authority boundary\n'
          assert ev.count(marker)==1
          closeout=f'''## Canonical closeout evidence\n\nB007 becomes canonical only after the frozen corpus/protocol package was exact-head qualified, independently reviewed, merged with expected-head protection, and re-verified on canonical main. The task catalog now requires both the protocol manifest and the pinned corpus bytes before B008 can satisfy its B007 prerequisite.\n\n```text\nENTRY_RUN = 33147997037\nENTRY_JOB = 98773224654\nIMPLEMENTATION_BUILDER_RUN = 33148397634\nIMPLEMENTATION_BUILDER_JOB = 98774487926\nIMPLEMENTATION_PR = #59\nFINAL_IMPLEMENTATION_HEAD = 965fbdbf152272397ae6ef721260e806be5d251c\nCANONICAL_IMPLEMENTATION_MERGE = b9b0a8ca7b9b7528f5da518baa83b23e2348c6f6\nEXACT_HEAD_QUALIFICATION_RUN = 33148508447\nEXACT_HEAD_QUALIFICATION_JOB = 98774836633\nINDEPENDENT_REVIEW_RUN = 33148717463\nINDEPENDENT_REVIEW_JOB = 98775495939\nPOST_IMPLEMENTATION_VERIFY_RUN = 33148856216\nPOST_IMPLEMENTATION_VERIFY_JOB = 98775927107\nPOST_IMPLEMENTATION_MAIN = b9b0a8ca7b9b7528f5da518baa83b23e2348c6f6\nPOST_IMPLEMENTATION_B007_ELIGIBLE = true\nPOST_IMPLEMENTATION_B008_ELIGIBLE = false\nPOST_IMPLEMENTATION_B008_REASON = prerequisite.unsatisfied:B007\nPOST_IMPLEMENTATION_DRIFT = clean\nCLOSEOUT_BUILDER_RUN = {os.environ['GITHUB_RUN_ID']}\nCLOSEOUT_TARGETED_GOVERNANCE = TBD\nCLOSEOUT_FULL_PYTEST = TBD\nCLOSEOUT_RUFF = PASS\nCLOSEOUT_MYPY = PASS / 26 source files\nCLOSEOUT_VALIDATE = PASS / 10 valid / 10 invalid rejected\n```\n\nThe corpus manifest and exact corpus fixture are both required closeout outputs. Deleting either must fail B008 closed. B008 eligibility after this state transition is only machine scheduling eligibility; it is not tokenizer acquisition or measurement authority.\n\n'''
          ev=ev.replace(marker,closeout+marker,1)
          ev_path.write_text(ev)

          p=Path('tests/contract/test_task_gate.py'); s=p.read_text()
          old='''def test_b007_is_eligible_after_b006_closeout() -> None:\n    result = evaluate_task_snapshot("B007", canonical_main=_CANONICAL_MAIN)\n\n    assert result["eligible"] is True\n    assert result["reasons"] == []\n    assert result["prerequisite_results"][0]["task_id"] == "B006"\n    assert result["prerequisite_results"][0]["satisfied"] is True\n    validate_instance("mstr-task-eligibility-v0", result)\n\n\n'''
          assert s.count(old)==1
          s=s.replace(old,'''def test_b007_is_terminal_after_canonical_closeout() -> None:\n    result = evaluate_task_snapshot("B007", canonical_main=_CANONICAL_MAIN)\n\n    assert result["eligible"] is False\n    assert result["state_consistency_result"]["observed_state"] == "COMPLETE_CANONICAL"\n    assert result["state_consistency_result"]["satisfied"] is True\n    assert "task.already_terminal" in result["reasons"]\n    validate_instance("mstr-task-eligibility-v0", result)\n\n\ndef test_b008_is_eligible_after_b007_closeout() -> None:\n    result = evaluate_task_snapshot("B008", canonical_main=_CANONICAL_MAIN)\n\n    assert result["eligible"] is True\n    assert result["reasons"] == []\n    assert result["prerequisite_results"][0]["task_id"] == "B007"\n    assert result["prerequisite_results"][0]["satisfied"] is True\n    validate_instance("mstr-task-eligibility-v0", result)\n\n\n''',1)
          anchor='def test_explicitly_blocked_task_never_becomes_eligible() -> None:\n'
          assert s.count(anchor)==1
          regression='''def test_b008_fails_closed_when_b007_corpus_is_missing(\n    tmp_path: Path,\n) -> None:\n    tasks_dir = tmp_path / "specs" / "002-code-model-supremacy-foundation"\n    tasks_dir.mkdir(parents=True)\n    (tasks_dir / "tasks.md").write_text(\n        "- [x] **B007 Root task.**\\n- [ ] **B008 Successor task.**\\n", encoding="utf-8"\n    )\n    evidence = tmp_path / "evidence" / "mstr-000b" / "B007-tokenizer-protocol.md"\n    evidence.parent.mkdir(parents=True)\n    evidence.write_text("canonical evidence\\n", encoding="utf-8")\n    manifest = tmp_path / "benchmarks" / "manifests" / "B007-tokenizer-economics.json"\n    manifest.parent.mkdir(parents=True)\n    manifest.write_text("{}\\n", encoding="utf-8")\n    payload = {\n        "catalog_version": "mstr.task-catalog.v0", "workstream_id": "MSTR-000B",\n        "tasks_file": "specs/002-code-model-supremacy-foundation/tasks.md",\n        "defaults": {\n            "outputs": [], "candidate_dependent": False, "external_effect_class": "NO_EXTERNAL_EFFECT",\n            "parallel_safe": False, "supersedes": [], "superseded_by": [],\n            "closeout_rule": {"terminal_states": ["COMPLETE_CANONICAL"], "require_all_outputs": False, "require_all_evidence_outputs": True, "completion_requires_merge": True},\n        },\n        "tasks": {\n            "B007": {\n                "canonical_state": "COMPLETE_CANONICAL", "closeout_rule": {"require_all_outputs": True},\n                "prerequisites": [],\n                "outputs": ["benchmarks/manifests/B007-tokenizer-economics.json", "benchmarks/fixtures/tokenizer-economics/B007-corpus.json"],\n                "evidence_outputs": ["evidence/mstr-000b/B007-tokenizer-protocol.md"],\n            },\n            "B008": {"canonical_state": "PENDING", "prerequisites": ["B007"], "evidence_outputs": []},\n        },\n    }\n    catalog_path = tmp_path / "configs" / "task-gate" / "mstr-000b.json"\n    catalog_path.parent.mkdir(parents=True)\n    catalog_path.write_text(json.dumps(payload), encoding="utf-8")\n    result = evaluate_task_snapshot("B008", repository_root=tmp_path, catalog_path=catalog_path, canonical_main=_CANONICAL_MAIN)\n    assert result["eligible"] is False\n    assert "prerequisite.unsatisfied:B007" in result["reasons"]\n    predecessor = result["prerequisite_results"][0]\n    assert predecessor["evidence_present"] is False and predecessor["satisfied"] is False\n    assert "prerequisite.required_artifact_missing" in predecessor["reasons"]\n    assert "missing:benchmarks/fixtures/tokenizer-economics/B007-corpus.json" in predecessor["reasons"]\n    validate_instance("mstr-task-eligibility-v0", result)\n\n\n'''
          p.write_text(s.replace(anchor,regression+anchor,1))

          p=Path('tests/integration/test_task_gate_cli.py'); s=p.read_text()
          old='''def test_task_eligible_b007_successor_returns_zero(\n    monkeypatch: pytest.MonkeyPatch,\n    capsys: pytest.CaptureFixture[str],\n) -> None:\n    expected = evaluate_task_snapshot("B007", canonical_main=_CANONICAL_MAIN)\n\n    def fake_evaluate_task_eligibility(task_id: str) -> dict[str, object]:\n        assert task_id == "B007"\n        return expected\n\n    monkeypatch.setattr(\n        "mstr_qualify.cli.evaluate_task_eligibility",\n        fake_evaluate_task_eligibility,\n    )\n\n    exit_code = main(["task", "eligible", "B007"])\n    payload = _stdout_json(capsys)\n\n    assert exit_code == 0\n    assert payload == expected\n    assert payload["eligible"] is True\n    assert payload["reasons"] == []\n    validate_instance("mstr-task-eligibility-v0", payload)\n\n\n'''
          assert s.count(old)==1
          new='''def test_task_eligible_b007_terminal_returns_one(\n    monkeypatch: pytest.MonkeyPatch, capsys: pytest.CaptureFixture[str]\n) -> None:\n    expected = evaluate_task_snapshot("B007", canonical_main=_CANONICAL_MAIN)\n    def fake_evaluate_task_eligibility(task_id: str) -> dict[str, object]:\n        assert task_id == "B007"\n        return expected\n    monkeypatch.setattr("mstr_qualify.cli.evaluate_task_eligibility", fake_evaluate_task_eligibility)\n    exit_code = main(["task", "eligible", "B007"]); payload = _stdout_json(capsys)\n    assert exit_code == 1 and payload == expected and payload["eligible"] is False\n    assert "task.already_terminal" in payload["reasons"]\n    validate_instance("mstr-task-eligibility-v0", payload)\n\n\ndef test_task_eligible_b008_successor_returns_zero(\n    monkeypatch: pytest.MonkeyPatch, capsys: pytest.CaptureFixture[str]\n) -> None:\n    expected = evaluate_task_snapshot("B008", canonical_main=_CANONICAL_MAIN)\n    def fake_evaluate_task_eligibility(task_id: str) -> dict[str, object]:\n        assert task_id == "B008"\n        return expected\n    monkeypatch.setattr("mstr_qualify.cli.evaluate_task_eligibility", fake_evaluate_task_eligibility)\n    exit_code = main(["task", "eligible", "B008"]); payload = _stdout_json(capsys)\n    assert exit_code == 0 and payload == expected and payload["eligible"] is True and payload["reasons"] == []\n    validate_instance("mstr-task-eligibility-v0", payload)\n\n\n'''
          p.write_text(s.replace(old,new,1))
          print('B007_CLOSEOUT_MUTATION=PASS')
          PY
          expected=$(printf '%s\n' configs/task-gate/mstr-000b.json evidence/mstr-000b/B007-tokenizer-protocol.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py | sort)
          test "$(git diff --name-only | sort)" = "$expected"
          git diff --check
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git diff --cached --check
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git commit -m 'docs(mstr-000b): stage B007 canonical closeout'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B007_CLOSEOUT_CANDIDATE_COMMIT=$(git rev-parse HEAD)"
      - name: Prove clean candidate semantics and run frozen gates
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m mstr_qualify task eligible B007 > /tmp/b007-after.json
          b7_rc=$?
          set -e
          test "$b7_rc" -eq 1
          python -m mstr_qualify task eligible B008 > /tmp/b008-after.json
          python -m mstr_qualify task drift > /tmp/drift-after.json
          python - <<'PY'
          import json, os
          m=os.environ['EXPECTED_MAIN']; b7=json.load(open('/tmp/b007-after.json')); b8=json.load(open('/tmp/b008-after.json')); d=json.load(open('/tmp/drift-after.json'))
          assert b7['canonical_main']==m and b7['task_id']=='B007' and b7['eligible'] is False and 'task.already_terminal' in b7['reasons'], b7
          assert b7['state_consistency_result']['observed_state']=='COMPLETE_CANONICAL', b7
          assert b8['canonical_main']==m and b8['task_id']=='B008' and b8['eligible'] is True and b8['reasons']==[], b8
          assert b8['state_consistency_result']['observed_state']=='PENDING', b8
          assert b8['prerequisite_results'][0]['task_id']=='B007' and b8['prerequisite_results'][0]['satisfied'] is True, b8
          assert d['canonical_main']==m and d['status']=='clean' and d['findings']==[], d
          print('B007_TERMINAL_CANDIDATE=PASS'); print('B008_SUCCESSOR_CANDIDATE=PASS'); print('CLOSEOUT_CANDIDATE_DRIFT=clean')
          PY
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py | tee /tmp/targeted.txt
          pytest -q | tee /tmp/full.txt
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
      - name: Record validation in second non-rewritten commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targeted=Path('/tmp/targeted.txt').read_text().strip().splitlines()[-1]
          full=Path('/tmp/full.txt').read_text().strip().splitlines()[-1]
          p=Path('evidence/mstr-000b/B007-tokenizer-protocol.md'); s=p.read_text()
          assert s.count('CLOSEOUT_TARGETED_GOVERNANCE = TBD')==1 and s.count('CLOSEOUT_FULL_PYTEST = TBD')==1
          s=s.replace('CLOSEOUT_TARGETED_GOVERNANCE = TBD',f'CLOSEOUT_TARGETED_GOVERNANCE = {targeted}',1)
          s=s.replace('CLOSEOUT_FULL_PYTEST = TBD',f'CLOSEOUT_FULL_PYTEST = {full}',1)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = 'evidence/mstr-000b/B007-tokenizer-protocol.md'
          git add evidence/mstr-000b/B007-tokenizer-protocol.md
          git diff --cached --check
          git commit -m 'docs(mstr-000b): record B007 closeout validation'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          set +e
          python -m mstr_qualify task eligible B007 > /tmp/b007-final.json
          b7_rc=$?
          set -e
          test "$b7_rc" -eq 1
          python -m mstr_qualify task eligible B008 > /tmp/b008-final.json
          python -m mstr_qualify task drift > /tmp/drift-final.json
          python - <<'PY'
          import json, os
          m=os.environ['EXPECTED_MAIN']; b7=json.load(open('/tmp/b007-final.json')); b8=json.load(open('/tmp/b008-final.json')); d=json.load(open('/tmp/drift-final.json'))
          assert b7['canonical_main']==m and b7['eligible'] is False and 'task.already_terminal' in b7['reasons'], b7
          assert b8['canonical_main']==m and b8['eligible'] is True and b8['reasons']==[], b8
          assert d['canonical_main']==m and d['status']=='clean' and d['findings']==[], d
          print('B007_FINAL_TERMINAL_CANDIDATE=PASS'); print('B008_FINAL_SUCCESSOR_CANDIDATE=PASS'); print('B007_CLOSEOUT_FINAL_DRIFT=clean')
          PY
      - name: Guard final scope and fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' configs/task-gate/mstr-000b.json evidence/mstr-000b/B007-tokenizer-protocol.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py | sort)
          test "$(git diff --name-only "$EXPECTED_MAIN"...HEAD | sort)" = "$expected"
          git diff --check "$EXPECTED_MAIN"...HEAD
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN"
          final=$(git rev-parse HEAD)
          git push origin "HEAD:$TARGET_BRANCH"
          echo "B007_CLOSEOUT_HEAD=$final"
          echo "B007_CLOSEOUT_BUILDER_RUN=$GITHUB_RUN_ID"
          echo 'TOKENIZER_ARTIFACT_DOWNLOAD=NONE'
          echo 'TOKENIZER_MEASUREMENT=NONE'
          echo 'MODEL_WEIGHT_ACCESS=NONE'
          echo 'MODEL_EXECUTION=NONE'
          echo 'PAID_COMPUTE=NONE'
          echo 'B008_MATERIAL_EXECUTION=NOT_STARTED'
