name: B012 Qwen staged recovery activation builder

on:
  push:
    branches:
      - evidence/b012-qwen-staged-recovery-activation-builder-0cff2d5

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout builder evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: evidence/b012-qwen-staged-recovery-activation-builder-0cff2d5
          path: builder
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact activation target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/b012-qwen-staged-recovery-activation
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Install repository dev dependencies
        working-directory: target
        run: python -m pip install -e '.[dev]'

      - name: Build and publish guarded activation subject
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          python ../builder/.github/scripts/build_b012_qwen_staged_recovery_activation_v2.py
