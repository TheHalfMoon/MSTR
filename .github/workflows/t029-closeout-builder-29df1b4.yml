name: Build T029 canonical closeout

on:
  push:
    branches:
      - evidence/t029-closeout-builder-29df1b4

permissions:
  contents: write
  actions: read

concurrency:
  group: t029-closeout-builder-29df1b4
  cancel-in-progress: false

env:
  BASE_SHA: 29df1b4be142407fbd31e13dca00e525dd729365
  BASE_TREE: 15fb0a0088e1be09d1071c960dbea1fd91df5cb5
  TARGET_BRANCH: closeout/000-t029-canonical
  POSTMERGE_RUN: '33966014675'
  POSTMERGE_EVIDENCE_HEAD: a5524296012c5cc1c15f01fe3ec4796c8b436db2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Verify exact canonical entry and postmerge evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.request
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/{os.environ['POSTMERGE_RUN']}",
              headers=headers,
          )
          with urllib.request.urlopen(request) as response:
              run = json.load(response)
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert run["head_sha"] == os.environ["POSTMERGE_EVIDENCE_HEAD"]
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize bounded three-file closeout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          base = "29df1b4be142407fbd31e13dca00e525dd729365"
          tree = "15fb0a0088e1be09d1071c960dbea1fd91df5cb5"

          tasks_path = Path("specs/000-universal-laptop-interaction-contract/tasks.md")
          tasks = tasks_path.read_text()
          old_task = "- [ ] T029 [US1] Build/obtain quality-oriented and compatibility-oriented Q4 profiles where practical, with exact quantizer/recipe/hash"
          new_task = "- [x] T029 [US1] Build/obtain quality-oriented and compatibility-oriented Q4 profiles where practical, with exact quantizer/recipe/hash"
          assert tasks.count(old_task) == 1
          assert new_task not in tasks
          tasks = tasks.replace(old_task, new_task, 1)
          tasks_path.write_text(tasks)

          evidence_path = Path("evidence/T029-q4-profiles.md")
          evidence = evidence_path.read_text()
          replacements = {
              "**State:** `Q4_PROFILE_SET_READY / QUALIFICATION_PENDING / NOT_COMPLETE_CANONICAL`": "**State:** `CLOSEOUT_CANDIDATE / COMPLETE_CANONICAL_ON_MERGE / Q4_PROFILE_SET_READY`",
              "**Current reconciliation base:** `5cadbd754686ebff6f5327e9746f0b074b35e318`": f"**Canonical implementation merge:** `{base}`",
          }
          for old, new in replacements.items():
              assert evidence.count(old) == 1, old
              evidence = evidence.replace(old, new, 1)

          lifecycle_marker = "## Completion Boundary\n"
          assert evidence.count(lifecycle_marker) == 1
          lifecycle = """## Canonical Closeout Lifecycle

The current-main reconciliation completed the full governed lifecycle without new model execution or authority expansion:

```text
IMPLEMENTATION_PR = #163
IMPLEMENTATION_HEAD = c0b9e977dedf38282872e469aa364dae8e5abf50
IMPLEMENTATION_TREE = 15fb0a0088e1be09d1071c960dbea1fd91df5cb5
EXACT_HEAD_QUALIFICATION = 33965047138 / SUCCESS / evidence 43523ce4a4fc5e8af5c5974664c1cb02d4ba03ee
INDEPENDENT_SEMANTIC_SECURITY_REVIEW = 33965362614 / SUCCESS / evidence faa42705bd9143f4e17771ca59a40e491b00576a
MANDATORY_PREMERGE = 33965724065 / SUCCESS / evidence 172fd9f956421d109fbed9336fb993ab90b3597d
MERGE = 29df1b4be142407fbd31e13dca00e525dd729365
POSTMERGE = 33966014675 / SUCCESS / evidence a5524296012c5cc1c15f01fe3ec4796c8b436db2
```

The earlier review run `33965245059` remains harness-only negative evidence: primary-artifact and authority checks passed, while a brittle textual assertion failed before the full-quality step. It is not treated as a semantic finding and does not replace the corrected successful independent review.

This closeout is governance-only. It does not rerun quantization, acquire weights, widen T027/T028, create B012 authority, authorize K2 Horizon, or make the historical T029 workflow dispatch-ready for future regeneration.

"""
          evidence = evidence.replace(lifecycle_marker, lifecycle + lifecycle_marker, 1)

          old_completion = """T029_EXECUTION_PROFILE_SET = 8_FULLY_VERIFIED
T029_CURRENT_RECONCILIATION_QUALIFICATION = PENDING
T029_COMPLETE_CANONICAL = NO
"""
          new_completion = """T029_EXECUTION_PROFILE_SET = 8_FULLY_VERIFIED
T029_RECONCILIATION_LIFECYCLE = COMPLETE
T029_CLOSEOUT_STATE = COMPLETE_CANONICAL_ON_MERGE
T029_FUTURE_REGENERATION_EXECUTION_READY = NO
T029_COMPLETE_CANONICAL = YES_ON_CLOSEOUT_MERGE
"""
          assert evidence.count(old_completion) == 1
          evidence = evidence.replace(old_completion, new_completion, 1)
          old_tail = "T029 may become canonical only after this current-main reconciliation passes the complete governed lifecycle and a separate closeout proves the task/evidence state on exact canonical `main`."
          new_tail = "Upon merge of this bounded closeout, T029 is `COMPLETE_CANONICAL`. Future T029 regeneration remains separately fail-closed until exact toolchain/network authority is proven; canonical completion does not create execution authority."
          assert evidence.count(old_tail) == 1
          evidence = evidence.replace(old_tail, new_tail, 1)
          evidence_path.write_text(evidence)

          state_path = Path("docs/canonical/CURRENT_STATE.md")
          state = state_path.read_text()
          state_replacements = {
              "**Checkpoint:** 2026-08-27 Asia/Riyadh": "**Checkpoint:** 2026-09-05 Asia/Riyadh",
              "CANONICAL_MAIN_AT_LATEST_RECONCILIATION = d0e90740924f6991da361536e7f835eb55ae9145": f"CANONICAL_MAIN_AT_LATEST_RECONCILIATION = {base}",
              "CANONICAL_TREE = c602b5142a31abe55d3519913f5badfaa27469cc": f"CANONICAL_TREE = {tree}",
              "ACTIVE_IMPLEMENTATION_SPEC = MSTR-000B": "ACTIVE_IMPLEMENTATION_SPEC = MSTR-000 / MSTR-000B",
              "ACTIVE_IMPLEMENTATION_TASK = B004_000A_SEQUENCE_RECONCILIATION / ENTRY_GATE_PROVEN": "ACTIVE_IMPLEMENTATION_TASK = T030_CURRENT_MAIN_RECONCILIATION / B012_EXACT_AUTHORITY_GATE",
              "LAST_COMPLETE_MSTR_000B_TASK = B003 / CLOSEOUT_MERGE d0e90740924f6991da361536e7f835eb55ae9145": "LAST_COMPLETE_MSTR_000B_TASK = B011 / COMPLETE_CANONICAL",
              "CURRENT_ELIGIBLE_MSTR_000B_TASK = B004": "CURRENT_ELIGIBLE_MSTR_000B_TASK = B012 / PENDING / BLOCKED_BY_EXACT_FOUNDER_AUTHORITY",
              "## Canonical History Through A004": "## Canonical History Through T029 + A004",
              "T000-T028 = COMPLETE_CANONICAL\nT029 = IMPLEMENTATION_MERGED_PREVIOUSLY / CANONICAL_RECONCILIATION_STATUS MUST BE READ FROM LIVE MSTR-000 TASK EVIDENCE": "T000-T029 = COMPLETE_CANONICAL\nT029_IMPLEMENTATION_PR = #163 / MERGE 29df1b4be142407fbd31e13dca00e525dd729365\nT029_POSTMERGE_RUN = 33966014675 / SUCCESS\nT030 = LEGACY_PR_#96_EXISTS / CURRENT_MAIN_RECONCILIATION_REQUIRED / NOT_COMPLETE_CANONICAL",
          }
          for old, new in state_replacements.items():
              assert state.count(old) == 1, old
              state = state.replace(old, new, 1)
          state_path.write_text(state)
          PY

          git diff --check
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          docs/canonical/CURRENT_STATE.md
          evidence/T029-q4-profiles.md
          specs/000-universal-laptop-interaction-contract/tasks.md
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

          test -z "$(git diff --name-only -- artifacts/authorities artifacts/manifests configs/task-gate .github/workflows src tests)"
          grep -F -- '- [x] T029 [US1]' specs/000-universal-laptop-interaction-contract/tasks.md
          grep -F 'T000-T029 = COMPLETE_CANONICAL' docs/canonical/CURRENT_STATE.md
          grep -F 'T030 = LEGACY_PR_#96_EXISTS / CURRENT_MAIN_RECONCILIATION_REQUIRED / NOT_COMPLETE_CANONICAL' docs/canonical/CURRENT_STATE.md
          grep -F 'CURRENT_ELIGIBLE_MSTR_000B_TASK = B012 / PENDING / BLOCKED_BY_EXACT_FOUNDER_AUTHORITY' docs/canonical/CURRENT_STATE.md
          grep -F 'T029_COMPLETE_CANONICAL = YES_ON_CLOSEOUT_MERGE' evidence/T029-q4-profiles.md
          grep -F 'T029_FUTURE_REGENERATION_EXECUTION_READY = NO' evidence/T029-q4-profiles.md

      - name: Run closeout quality and prospective semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t029_quantization_manifest.py tests/unit/test_t029_quantize_runner.py
          mstr-qualify validate
          python -m pytest -q
          ruff check .
          mypy
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("artifacts/manifests/quantization/T029-q4-profiles.json").read_text())
          assert manifest["completion_state"] == "Q4_PROFILE_SET_READY_NOT_T029_COMPLETE_CANONICAL"
          assert len(manifest["profiles"]) == 8
          assert manifest["pending"] == []
          assert all(p["result_classification"] == "Q4_PROFILE_READY" for p in manifest["profiles"])
          assert not Path("artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json").exists()
          evidence = Path("evidence/T029-q4-profiles.md").read_text()
          assert "T029_COMPLETE_CANONICAL = YES_ON_CLOSEOUT_MERGE" in evidence
          assert "T029_FUTURE_REGENERATION_EXECUTION_READY = NO" in evidence
          tasks = Path("specs/000-universal-laptop-interaction-contract/tasks.md").read_text()
          assert "- [x] T029 [US1]" in tasks
          assert "- [ ] T030 [US1]" in tasks
          PY

      - name: Commit and guarded push exact closeout candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add docs/canonical/CURRENT_STATE.md evidence/T029-q4-profiles.md specs/000-universal-laptop-interaction-contract/tasks.md
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'docs(mstr-000): close T029 canonically'
          git diff --check "$BASE_SHA" HEAD
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
