name: A018 post-closeout proof

on:
  push:
    branches:
      - evidence/a018-postcloseout-db12d14

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  identity:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove canonical A018 closeout merge
        shell: bash
        run: |
          set -euo pipefail
          MAIN='db12d1467bb81185a9affffb4d470626ceceddfa'
          TREE='13785c0703827f73ebe9fe4b56f28bdb1f3af779'
          OLD_MAIN='b34a17441c24712144ce21b64c41ec18eeb12352'
          CLOSEOUT_HEAD='7336bc60e396480a21de62b5e029f77f8d752d5c'
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(git show -s --format=%P "$MAIN")" = "$OLD_MAIN $CLOSEOUT_HEAD"
          pr="$(gh api repos/TheHalfMoon/MSTR/pulls/123)"
          test "$(jq -r '.state' <<<"$pr")" = 'closed'
          test "$(jq -r '.merged' <<<"$pr")" = 'true'
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$CLOSEOUT_HEAD"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$OLD_MAIN"
          reviews="$(gh api repos/TheHalfMoon/MSTR/pulls/123/reviews)"
          jq -e '.[] | select(.id == 5076971515 and .state == "COMMENTED" and .commit_id == "7336bc60e396480a21de62b5e029f77f8d752d5c")' <<<"$reviews" >/dev/null
          qual="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33498284633)"
          premerge="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33498520280)"
          stale_qual="$(gh api repos/TheHalfMoon/MSTR/actions/runs/33498100142)"
          test "$(jq -r '.conclusion' <<<"$qual")" = 'success'
          test "$(jq -r '.conclusion' <<<"$premerge")" = 'success'
          test "$(jq -r '.conclusion' <<<"$stale_qual")" = 'failure'
          tasks="$(git show "$MAIN:specs/001-agent-harness-verified-loop-foundation/tasks.md")"
          grep -F -- '- [x] **A018 Implement trajectory recorder/replay/admission.**' <<<"$tasks"
          grep -F -- '- [ ] **A019 Run cross-harness baseline/tournament' <<<"$tasks"
          grep -F -- '- [ ] **A020 Implement and qualify `MSTR-RESEARCH-LOOP-v0`' <<<"$tasks"
          grep -F 'Canonical implementation: PR #122 / final head `fc04967b2cbe874489f3b09a38fb80c1650f2461` / merge `b34a17441c24712144ce21b64c41ec18eeb12352`; post-merge proof run `33492060094` = `SUCCESS`.' <<<"$tasks"
          evidence="$(git show "$MAIN:evidence/mstr-000a/A018-trajectory-factory.md")"
          grep -F '**State:** `COMPLETE_CANONICAL`' <<<"$evidence"
          grep -F 'FAILED_QUALIFICATION_1 = 33490868295 / FAILURE / RUFF_UP035_IMPORT_LOCATION / PRESERVED' <<<"$evidence"
          grep -F 'FAILED_QUALIFICATION_2 = 33491198294 / FAILURE / MYPY_NO_ANY_RETURN / PRESERVED' <<<"$evidence"
          grep -F 'FINAL_QUALIFICATION = 33491507890 / SUCCESS' <<<"$evidence"
          grep -F 'INDEPENDENT_REVIEW = 5076280749 / NO_BLOCKING_FINDING' <<<"$evidence"
          grep -F 'MANDATORY_PREMERGE = 33491799986 / SUCCESS' <<<"$evidence"
          grep -F 'IMPLEMENTATION_MERGE = b34a17441c24712144ce21b64c41ec18eeb12352' <<<"$evidence"
          grep -F 'POST_MERGE_PROOF = 33492060094 / SUCCESS' <<<"$evidence"
          grep -F 'A018_STATE = COMPLETE_CANONICAL' <<<"$evidence"
          grep -F 'A019_STATE = PENDING_CONVERGENCE_GATED' <<<"$evidence"
          threads="$(gh api graphql -f query='query { repository(owner:"TheHalfMoon", name:"MSTR") { pullRequest(number:123) { reviewThreads(first:100) { nodes { isResolved } } } } }')"
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$threads")" = '0'

  quality:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db12d1467bb81185a9affffb4d470626ceceddfa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Run canonical A018 post-closeout quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest tests/unit/trajectory/test_trajectory_factory.py -q
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src

  complete:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final immutable A018 post-closeout recheck
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = 'db12d1467bb81185a9affffb4d470626ceceddfa'
          test "$(git show -s --format=%T origin/main)" = '13785c0703827f73ebe9fe4b56f28bdb1f3af779'
