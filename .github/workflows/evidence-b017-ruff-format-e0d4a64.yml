name: Format B017 Python files and satisfy frozen lint

on:
  push:

permissions:
  contents: write

env:
  EXPECTED_HEAD: e0d4a64929376f91a7aef502abedc2bc4645afbc
  TARGET_BRANCH: feat/mstr-000b-b017-evolution-fixture-pilot

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mstr-000b-b017-evolution-fixture-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact candidate before formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
      - run: python -m pip install -e '.[dev]'
      - name: Format B017 Python scope only
        run: |
          ruff format src/mstr_qualify/software_evolution.py tests/unit/test_software_evolution_projection.py
          git diff --check
      - name: Frozen lint gate after formatting
        run: ruff check src tests
      - name: Focused B017 regression after formatting
        run: pytest -q tests/unit/test_software_evolution_projection.py tests/contract/test_software_evolution_contract.py
      - name: Confirm formatting-only file scope
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' src/mstr_qualify/software_evolution.py tests/unit/test_software_evolution_projection.py | sort)
          test "$actual" = "$expected"
      - name: Commit and fast-forward candidate branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add src/mstr_qualify/software_evolution.py tests/unit/test_software_evolution_projection.py
          git commit -m "fix(mstr-000b): satisfy B017 frozen lint gate"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
