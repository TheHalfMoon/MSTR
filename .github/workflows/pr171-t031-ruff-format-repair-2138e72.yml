name: PR171 T031 Ruff format repair 2138e72

on:
  push:
    branches:
      - builder/pr171-t031-ruff-format-repair-2138e72

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/t031-governed-measurement-executor
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact target and canonical main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD=2138e729570e8cba59ee4e9ab573e5b6001dd1cc
          EXPECTED_MAIN=891af2215a2244a6a0912d49d782f42bcc38b6ef
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/feat/t031-governed-measurement-executor | awk '{print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"

      - name: Setup Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'

      - name: Install repository development tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply canonical Ruff formatting and refresh bound hashes
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            colab/mstr_executor_toolchain.py
            colab/mstr_t031_artifacts.py
            colab/mstr_t031_execute.py
            colab/mstr_t031_governance.py
            colab/mstr_t031_measure.py
            colab/mstr_t031_source.py
            tests/contract/test_t031_executor_binding.py
          )
          ruff format "${FILES[@]}"

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          binding_path = Path("artifacts/manifests/T031-executor-toolchain-binding.json")
          binding = json.loads(binding_path.read_text(encoding="utf-8"))

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          updates = {
              "toolchain_helper_sha256": sha256("colab/mstr_executor_toolchain.py"),
              "artifact_script_sha256": sha256("colab/mstr_t031_artifacts.py"),
              "executor_script_sha256": sha256("colab/mstr_t031_execute.py"),
              "governance_script_sha256": sha256("colab/mstr_t031_governance.py"),
              "measurement_script_sha256": sha256("colab/mstr_t031_measure.py"),
              "source_script_sha256": sha256("colab/mstr_t031_source.py"),
          }
          for key, value in updates.items():
              binding[key] = value
          binding_path.write_text(json.dumps(binding, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(updates, indent=2, sort_keys=True))
          PY

      - name: Verify bounded diff and focused qualification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess

          allowed = {
              "artifacts/manifests/T031-executor-toolchain-binding.json",
              "colab/mstr_executor_toolchain.py",
              "colab/mstr_t031_artifacts.py",
              "colab/mstr_t031_execute.py",
              "colab/mstr_t031_governance.py",
              "colab/mstr_t031_measure.py",
              "colab/mstr_t031_source.py",
              "tests/contract/test_t031_executor_binding.py",
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
              if line.strip()
          }
          if not changed:
              raise SystemExit("Ruff formatting produced no repair; refusing empty repair commit")
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"unexpected changed files: {sorted(unexpected)}")
          if not any(path.endswith(".py") for path in changed):
              raise SystemExit("no Python file changed; formatting repair is not substantiated")
          print("changed files:")
          for path in sorted(changed):
              print(path)
          PY

          FILES=(
            colab/mstr_executor_toolchain.py
            colab/mstr_t031_artifacts.py
            colab/mstr_t031_execute.py
            colab/mstr_t031_governance.py
            colab/mstr_t031_measure.py
            colab/mstr_t031_source.py
            tests/contract/test_t031_executor_binding.py
          )
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"
          pytest -q tests/contract/test_t031_executor_binding.py

      - name: Commit one forward-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/manifests/T031-executor-toolchain-binding.json \
            colab/mstr_executor_toolchain.py \
            colab/mstr_t031_artifacts.py \
            colab/mstr_t031_execute.py \
            colab/mstr_t031_governance.py \
            colab/mstr_t031_measure.py \
            colab/mstr_t031_source.py \
            tests/contract/test_t031_executor_binding.py
          git commit -m "fix(t031): apply canonical Ruff formatting"

      - name: Guard remote state and fast-forward target branch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD=2138e729570e8cba59ee4e9ab573e5b6001dd1cc
          EXPECTED_MAIN=891af2215a2244a6a0912d49d782f42bcc38b6ef
          test "$(git ls-remote origin refs/heads/feat/t031-governed-measurement-executor | awk '{print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          git push origin HEAD:refs/heads/feat/t031-governed-measurement-executor
