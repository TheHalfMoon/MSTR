name: Build B017 entry-gate drift repair

on:
  push:

permissions:
  contents: write

env:
  EXPECTED_MAIN: 4919891be2e10c84a4c57a420ee2884d72da4e93
  TARGET_BRANCH: docs/000b-b017-entry-gate-drift-repair

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/000b-b017-entry-gate-drift-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Bind canonical baseline and untouched repair branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain)"
      - name: Add machine-readable B017 entry provenance and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          evidence = Path("evidence/mstr-000b/B017-evolution-fixture-pilot.md")
          text = evidence.read_text(encoding="utf-8")
          marker = "## Execution Evidence\n"
          if text.count(marker) != 1:
              raise SystemExit(f"expected one Execution Evidence marker, found {text.count(marker)}")
          if "ENTRY_GATE_TASK = B017" in text:
              raise SystemExit("B017 machine-readable entry provenance already present")
          block = '''## Canonical Entry Provenance\n\n```text\nENTRY_GATE_TASK = B017\nENTRY_GATE_CANONICAL_MAIN = f7a386214a1346b75dd3311390aa1e19bf354bb1\nENTRY_GATE_RUN = 33174634290\nENTRY_GATE_JOB = 98859944051\nENTRY_GATE_ELIGIBLE = true\nENTRY_GATE_DRIFT = clean\n```\n\n'''
          evidence.write_text(text.replace(marker, block + marker), encoding="utf-8")

          tests = Path("tests/unit/test_software_evolution_projection.py")
          test_text = tests.read_text(encoding="utf-8")
          name = "def test_b017_machine_readable_entry_gate_provenance()"
          if name in test_text:
              raise SystemExit("B017 machine-readable entry provenance regression already present")
          test_text += '''\n\ndef test_b017_machine_readable_entry_gate_provenance() -> None:\n    evidence = (ROOT / "evidence" / "mstr-000b" / "B017-evolution-fixture-pilot.md").read_text(\n        encoding="utf-8"\n    )\n    assert "ENTRY_GATE_TASK = B017" in evidence\n    assert (\n        "ENTRY_GATE_CANONICAL_MAIN = "\n        "f7a386214a1346b75dd3311390aa1e19bf354bb1" in evidence\n    )\n    assert "ENTRY_GATE_RUN = 33174634290" in evidence\n    assert "ENTRY_GATE_JOB = 98859944051" in evidence\n    assert "ENTRY_GATE_ELIGIBLE = true" in evidence\n    assert "ENTRY_GATE_DRIFT = clean" in evidence\n'''
          tests.write_text(test_text, encoding="utf-8")
          PY
          git diff --check
          expected=$(printf '%s\n' evidence/mstr-000b/B017-evolution-fixture-pilot.md tests/unit/test_software_evolution_projection.py | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
      - run: python -m pip install -e '.[dev]'
      - name: Focused regression and frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/unit/test_software_evolution_projection.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy
      - name: Commit locally and prove prospective-main drift clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add evidence/mstr-000b/B017-evolution-fixture-pilot.md tests/unit/test_software_evolution_projection.py
          git commit -m "docs(mstr-000b): restore B017 entry-gate drift metadata"
          candidate=$(git rev-parse HEAD)
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          git branch -f main "$candidate"
          git update-ref refs/remotes/origin/main "$candidate"
          git checkout main
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json
          drift=json.load(open('/tmp/drift.json'))
          assert drift['status']=='clean' and drift['findings']==[]
          PY
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git push origin "$candidate:refs/heads/$TARGET_BRANCH"
