name: Qualify A015 Direction-to-Done contract

on:
  push:
    branches:
      - evidence/a015-qualify-8c31781

permissions:
  contents: read

env:
  BASE_SHA: 28a4a972182c0f58f7c6500239f625a0e2143d0a
  TARGET_SHA: 8c3178156add4dff915a67427d1981f0996e894a
  TARGET_TREE: fdb29c1a3b12f52bd9d043fc49a78ec8afac3d5d

jobs:
  identity_scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify exact A015 identity and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git merge-base "$BASE_SHA" "$TARGET_SHA")" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort)
          expected=(
            benchmarks/direction-to-done/v0-taxonomy.json
            evidence/mstr-000a/A015-direction-to-done.md
            schemas/mstr-direction-task-v0.schema.json
            specs/001-agent-harness-verified-loop-foundation/contracts/mstr-direction-task-v0.schema.json
            tests/contract/test_direction_task_contract.py
            tests/fixtures/schemas/invalid/mstr-direction-task-v0.json
            tests/fixtures/schemas/valid/mstr-direction-task-v0.json
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${files[$i]}" = "${expected[$i]}"
          done
          cmp schemas/mstr-direction-task-v0.schema.json specs/001-agent-harness-verified-loop-foundation/contracts/mstr-direction-task-v0.schema.json
          grep -F -- '**State:** IMPLEMENTATION_CANDIDATE' evidence/mstr-000a/A015-direction-to-done.md
          grep -F -- 'PUBLIC_REPO_CONTAINS_PRIVATE_FRESH_TASKS = FALSE' evidence/mstr-000a/A015-direction-to-done.md
          grep -F -- 'B023_VERIFIER_HEALTH_EXECUTION = NOT_IMPLEMENTED_BY_A015' evidence/mstr-000a/A015-direction-to-done.md
          grep -F -- '- [x] **A014 Implement verifier runner + reward-shortcut battery.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A015 Freeze `DirectionTaskManifest` and MSTR Direction-to-Done v0 task taxonomy.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A016 Implement DVCR/TTVC + diagnostic metric computation.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          git diff --check "$BASE_SHA" "$TARGET_SHA"

  quality:
    needs: identity_scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run A015 focused and repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest -q tests/contract/test_direction_task_contract.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy src

  complete:
    needs: [identity_scope, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Final immutable A015 recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/feat/000a-a015-direction-to-done | cut -f1)" = "$TARGET_SHA"
