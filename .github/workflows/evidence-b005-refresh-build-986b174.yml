name: Guard B005 canonical metadata refresh

on:
  push:
    branches:
      - evidence/b005-refresh-build-986b174

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 986b174b2bf79ce53a3e67b9b02c55cbe6981303
      TARGET_BRANCH: research/000b-b005-code-backbone-rescan-v2
      EXPECTED_TARGET: 986b174b2bf79ce53a3e67b9b02c55cbe6981303
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout evidence builder
        uses: actions/checkout@v4
        with:
          ref: evidence/b005-refresh-build-986b174
          fetch-depth: 1
          path: evidence
          persist-credentials: false

      - name: Checkout exact B005 target
        uses: actions/checkout@v4
        with:
          ref: research/000b-b005-code-backbone-rescan-v2
          fetch-depth: 0
          path: target
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install development tooling
        working-directory: target
        run: python -m pip install -e '.[dev]'

      - name: Verify exact live entry gate immediately before refresh
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET"
          git branch -f main "$EXPECTED_MAIN"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --short)"
          python -m mstr_qualify task eligible B005 > /tmp/b005-entry.json
          cat /tmp/b005-entry.json
          python - <<'PY'
          import json, os
          with open('/tmp/b005-entry.json', encoding='utf-8') as fh:
              payload = json.load(fh)
          assert payload['task_id'] == 'B005'
          assert payload['eligible'] is True
          assert payload['canonical_main'] == os.environ['EXPECTED_MAIN']
          assert payload['reasons'] == []
          PY
          python -m mstr_qualify task drift > /tmp/pre-refresh-drift.json
          cat /tmp/pre-refresh-drift.json
          python - <<'PY'
          import json
          with open('/tmp/pre-refresh-drift.json', encoding='utf-8') as fh:
              payload = json.load(fh)
          assert payload['status'] == 'clean'
          assert payload['findings'] == []
          PY

      - name: Apply public-metadata-only B005 refresh
        run: python evidence/.github/evidence/b005_refresh_apply.py target

      - name: Verify bounded refresh scope
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'artifacts/manifests/B005-code-backbone-discovery.json',
              'artifacts/manifests/B005-canonical-input-binding.json',
              'evidence/mstr-000b/B005-code-backbone-rescan.md',
              'evidence/mstr-000b/B005-schema-validation.md',
          }
          changed = set(subprocess.run(
              ['git', 'diff', '--name-only'], check=True, capture_output=True, text=True
          ).stdout.splitlines())
          assert changed == expected, (changed, expected)
          PY

      - name: Validate refreshed task-local B005 contracts
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import os
          import subprocess
          from pathlib import Path
          from jsonschema import Draft202012Validator, ValidationError

          root = Path('.')
          pairs = [
              (
                  root / 'specs/002-code-model-supremacy-foundation/contracts/b005-code-backbone-discovery-v1.schema.json',
                  root / 'artifacts/manifests/B005-code-backbone-discovery.json',
              ),
              (
                  root / 'specs/002-code-model-supremacy-foundation/contracts/b005-canonical-input-binding-v1.schema.json',
                  root / 'artifacts/manifests/B005-canonical-input-binding.json',
              ),
          ]
          loaded = []
          for schema_path, instance_path in pairs:
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              instance = json.loads(instance_path.read_text(encoding='utf-8'))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(instance)
              loaded.append((schema, instance))

          discovery_schema, discovery = loaded[0]
          bad_discovery = copy.deepcopy(discovery)
          bad_discovery['scope']['model_weight_access'] = True
          try:
              Draft202012Validator(discovery_schema).validate(bad_discovery)
          except ValidationError:
              pass
          else:
              raise AssertionError('discovery weight-access mutation was accepted')

          binding_schema, binding = loaded[1]
          bad_binding = copy.deepcopy(binding)
          bad_binding['authority']['creates_model_access_authority'] = True
          try:
              Draft202012Validator(binding_schema).validate(bad_binding)
          except ValidationError:
              pass
          else:
              raise AssertionError('input-binding authority mutation was accepted')

          expected_main = os.environ['EXPECTED_MAIN']
          assert discovery['canonical_main_sha'] == expected_main
          assert binding['canonical_main_sha'] == expected_main
          assert discovery['no_weight_access_performed'] is True
          assert discovery['no_authority_created'] is True
          assert discovery['scope']['model_weight_access'] is False
          assert binding['authority']['creates_model_access_authority'] is False

          repo_ids = [row['repo_id'] for row in discovery['candidates']]
          assert len(repo_ids) == len(set(repo_ids))
          for required in (
              'JetBrains/Mellum-4b-base',
              'LiquidAI/LFM2.5-1.2B-Base',
              'Qwen/Qwen3.5-0.8B-Base',
              'zai-org/GLM-5.3-Flash',
              'moonshotai/Kimi-K2-Base',
          ):
              assert required in repo_ids
          serious = set(discovery['newly_relevant_for_b006'])
          assert 'LiquidAI/LFM2.5-1.2B-Base' in serious
          assert 'Qwen/Qwen3.5-0.8B-Base' in serious
          assert 'zai-org/GLM-5.3-Flash' not in serious
          assert 'moonshotai/Kimi-K2-Base' not in serious

          for entry in binding['canonical_inputs']:
              observed = subprocess.run(
                  ['git', 'rev-parse', f"{expected_main}:{entry['path']}"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip().lower()
              assert observed == entry['blob_sha'], (entry['path'], observed, entry['blob_sha'])

          print('B005_DISCOVERY_SCHEMA_DRAFT_2020_12_SELF_CHECK=PASS')
          print('B005_INPUT_BINDING_SCHEMA_DRAFT_2020_12_SELF_CHECK=PASS')
          print('B005_REFRESHED_INSTANCES=PASS')
          print('B005_NEGATIVE_AUTHORITY_MUTATIONS=REJECTED')
          print(f'B005_DISCOVERY_ROWS={len(repo_ids)}')
          PY

      - name: Commit refresh candidate locally
        id: candidate
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/manifests/B005-code-backbone-discovery.json \
            artifacts/manifests/B005-canonical-input-binding.json \
            evidence/mstr-000b/B005-code-backbone-rescan.md \
            evidence/mstr-000b/B005-schema-validation.md
          git commit -m "research(mstr-000b): refresh B005 backbone metadata"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET"
          test -z "$(git status --short)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Frozen gate - pytest
        working-directory: target
        run: pytest -q

      - name: Frozen gate - Ruff
        working-directory: target
        run: ruff check src tests

      - name: Frozen gate - mypy
        working-directory: target
        run: mypy

      - name: Frozen gate - offline validate
        working-directory: target
        run: python -m mstr_qualify validate

      - name: Guarded push of exact refresh candidate
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.candidate.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "$candidate"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET"
          test -z "$(git status --short)"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "B005_REFRESH_CANDIDATE=$candidate"
