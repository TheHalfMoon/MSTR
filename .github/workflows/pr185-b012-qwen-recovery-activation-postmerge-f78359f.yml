name: PR185 B012 Qwen recovery activation postmerge verification

on:
  push:
    branches:
      - evidence/pr185-b012-qwen-recovery-activation-postmerge-f78359f

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  PR_NUMBER: "185"
  CANONICAL_MAIN: f78359f87ab5f5259e5569bea178261dbd9cc8e7
  CANONICAL_TREE: 046156f3ff372f541b4a16618c212490027e57c4
  SUBJECT_HEAD: 180b928e56261dbc3e1bd06597e7c81fa32694ee
  QUALIFICATION_RUN: "34162195621"
  REVIEW_RUN: "34162490236"
  PREMERGE_RUN: "34162801947"
  ACTIVATED_MANIFEST_SHA256: 6b9536e16c52fefe03ee2844c68008f68e36cdd91ae45987086e1acda0259d70
  ACTIVE_WORKFLOW_SHA256: 7643ef2b87c32901e5cbdf384001a341cfd061f4a33437a4fb7556dadc6c33a0

jobs:
  postmerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout postmerge evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify postmerge provenance and live canonical identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$CANONICAL_MAIN" ]]
          [[ "$(git show -s --format=%T origin/main)" == "$CANONICAL_TREE" ]]
          [[ "$(git merge-base "$CANONICAL_MAIN" HEAD)" == "$CANONICAL_MAIN" ]]
          git diff --name-only "$CANONICAL_MAIN..HEAD" > /tmp/evidence_changed
          [[ "$(wc -l < /tmp/evidence_changed)" -eq 1 ]]
          grep -Fx '.github/workflows/pr185-b012-qwen-recovery-activation-postmerge-f78359f.yml' /tmp/evidence_changed
          python - <<'PY'
          import json
          import os
          import urllib.request
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-b012-pr185-postmerge',
          }
          def get(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          pr = get(f"https://api.github.com/repos/TheHalfMoon/MSTR/pulls/{os.environ['PR_NUMBER']}")
          assert pr['state'] == 'closed'
          assert pr['merged'] is True
          assert pr['merge_commit_sha'] == os.environ['CANONICAL_MAIN']
          assert pr['head']['sha'] == os.environ['SUBJECT_HEAD']
          assert pr['changed_files'] == 5
          for env_name in ('QUALIFICATION_RUN', 'REVIEW_RUN', 'PREMERGE_RUN'):
              run = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/' + os.environ[env_name])
              assert run['status'] == 'completed'
              assert run['conclusion'] == 'success'
          print('POSTMERGE_PROVENANCE=PASS')
          print('CANONICAL_MAIN_IDENTITY=PASS')
          print('MERGED_PR_IDENTITY=PASS')
          print('PREMERGE_CHAIN=PASS')
          PY

      - name: Verify canonical activation semantics and exact bindings
        run: |
          set -euo pipefail
          git checkout --detach "$CANONICAL_MAIN"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path.cwd()
          active = root / '.github/workflows/b012-qwen-raw-code-recovery.yml'
          spec = root / 'configs/workflows/b012-qwen-raw-code-recovery.yml'
          manifest_path = root / 'artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json'
          binding_path = root / 'artifacts/manifests/B012-executor-toolchain-binding.json'
          runner_path = root / 'colab/mstr_b012_qwen_raw_code_recovery.py'
          incident_path = root / 'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-run-34155931982.json'
          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()
          assert active.read_bytes() == spec.read_bytes()
          assert digest(active) == os.environ['ACTIVE_WORKFLOW_SHA256']
          assert digest(manifest_path) == os.environ['ACTIVATED_MANIFEST_SHA256']
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          binding = json.loads(binding_path.read_text(encoding='utf-8'))
          assert manifest['status'] == 'ACTIVATED_CANONICAL'
          assert manifest['candidate_id'] == 'qwen3.5-0.8b-control'
          assert manifest['prior_run_id'] == 34155931982
          assert manifest['recovery_script_sha256'] == digest(runner_path)
          assert manifest['recovery_workflow_sha256'] == digest(active)
          assert manifest['incident_evidence_sha256'] == digest(incident_path)
          assert binding['qwen_raw_code_recovery_manifest_sha256'] == digest(manifest_path)
          activation = binding['qwen_raw_code_recovery_activation']
          assert activation['recovery_manifest_sha256'] == digest(manifest_path)
          assert activation['active_workflow_sha256'] == digest(active)
          assert activation['candidate_id'] == 'qwen3.5-0.8b-control'
          assert activation['prior_run_id'] == 34155931982
          assert activation['retry_authority_created'] is False
          assert activation['external_dispatch_authority_created'] is False
          assert activation['candidate_expansion'] is False
          assert activation['revision_or_file_expansion'] is False
          assert activation['model_access'] == 'NONE'
          assert activation['training'] is False
          assert activation['paid_cost_usd'] == 0.0
          scope = manifest['recovery_scope']
          assert scope['rerun_prefill'] is False
          assert scope['rerun_decode'] is False
          assert scope['run_raw_code_proxy'] is True
          assert scope['candidate_expansion'] is False
          assert scope['revision_or_file_expansion'] is False
          assert scope['training'] is False
          print('CANONICAL_ACTIVATION_HASHES=PASS')
          print('CANONICAL_AUTHORITY_BOUNDARY=PASS')
          PY

      - name: Verify B012 eligibility on exact new canonical main
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git rev-parse HEAD)" == "$CANONICAL_MAIN" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$CANONICAL_TREE" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-postmerge-eligible.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          gate = json.loads(Path('/tmp/b012-postmerge-eligible.json').read_text(encoding='utf-8'))
          assert gate['canonical_main'] == os.environ['CANONICAL_MAIN']
          assert gate['eligible'] is True
          assert gate['authority_result']['required'] is True
          assert gate['authority_result']['satisfied'] is True
          assert gate['state_consistency_result']['observed_state'] == 'PENDING'
          assert gate['supersession_result']['superseded'] is False
          print('B012_POSTMERGE_ELIGIBLE=true')
          PY

      - name: Run canonical postmerge regression
        run: |
          set -euo pipefail
          git checkout --detach "$CANONICAL_MAIN"
          python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m py_compile colab/mstr_b012_qwen_raw_code_recovery.py tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m pytest -q
          python -m mypy src/mstr_qualify

      - name: Final canonical guard
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$REMOTE_MAIN" == "$CANONICAL_MAIN" ]]
          [[ "$(git rev-parse HEAD)" == "$CANONICAL_MAIN" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$CANONICAL_TREE" ]]
          echo "FINAL_CANONICAL_MAIN=$REMOTE_MAIN"
          echo "FINAL_CANONICAL_TREE=$CANONICAL_TREE"
          echo 'POSTMERGE_VERIFICATION=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
