name: Guard B003 terminal-state contract repair

on:
  push:
    branches:
      - evidence/b003-terminal-state-contract-repair

permissions:
  contents: write

env:
  EXPECTED_HEAD: 8aab244fe7633c5c6f6cd93490143b0fd917426a
  EXPECTED_MAIN: 0754d552752c2f6c099df2b480de99028e2e26e5
  TARGET_BRANCH: feat/000b-b003-drift-detector
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  repair-b003:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact guarded target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify live repair preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"

      - name: Apply bounded terminal-state contract repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} match count: {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          source = Path("src/mstr_qualify/task_drift.py")
          replace_once(
              source,
              '''        invalid_state_paths = sorted(\n            entry.path for entry in metadata if entry.state != "COMPLETE_CANONICAL"\n        )\n''',
              '''        invalid_state_paths = sorted(\n            entry.path for entry in metadata if entry.state != node["canonical_state"]\n        )\n''',
              "per-file terminal state target",
          )
          replace_once(
              source,
              '''    if evidence_state == "COMPLETE_CANONICAL" and not terminal:\n        findings.append(\n            _finding(\n                task_id,\n                "evidence.completion_claim_active_task",\n                canonical_state=node["canonical_state"],\n            )\n        )\n    if terminal and evidence_state != "COMPLETE_CANONICAL":\n''',
              '''    if evidence_state in node["closeout_rule"]["terminal_states"] and not terminal:\n        findings.append(\n            _finding(\n                task_id,\n                "evidence.completion_claim_active_task",\n                canonical_state=node["canonical_state"],\n            )\n        )\n    if terminal and evidence_state != node["canonical_state"]:\n''',
              "aggregate terminal state semantics",
          )

          tests = Path("tests/unit/test_task_drift.py")
          anchor = '''\n\ndef test_detector_refuses_feature_checkout(tmp_path: Path) -> None:\n'''
          addition = '''\n\n@pytest.mark.parametrize(\n    "terminal_state",\n    ["NOT_REQUIRED_NO_NEW_ACCESS", "NOT_REQUIRED_NO_NEW_CANDIDATES"],\n)\ndef test_detector_accepts_allowed_noncomplete_terminal_state(\n    tmp_path: Path, terminal_state: str\n) -> None:\n    root = _init_repo(tmp_path)\n    gate_main, final_head, merge_sha = _merge_b003_implementation(root, include_gate=True)\n    _close_b003(root, gate_main=gate_main, final_head=final_head, merge_sha=merge_sha)\n\n    catalog = root / "configs" / "task-gate" / "mstr-000b.json"\n    payload = json.loads(catalog.read_text(encoding="utf-8"))\n    payload["tasks"]["B003"]["canonical_state"] = terminal_state\n    payload["tasks"]["B003"]["closeout_rule"] = {\n        "terminal_states": ["COMPLETE_CANONICAL", terminal_state]\n    }\n    catalog.write_text(json.dumps(payload, indent=2) + "\\n", encoding="utf-8")\n\n    evidence = root / "evidence" / "mstr-000b" / "B003.md"\n    text = evidence.read_text(encoding="utf-8")\n    state_line = "**State:** COMPLETE_CANONICAL\\n"\n    assert text.count(state_line) == 1\n    evidence.write_text(\n        text.replace(state_line, f"**State:** {terminal_state}\\n", 1),\n        encoding="utf-8",\n    )\n    _commit_main(root, f"close B003 fixture as {terminal_state}")\n\n    report = detect_canonical_drift(repository_root=root)\n    assert report["status"] == "clean", report\n    assert report["findings"] == [], report\n\n\n@pytest.mark.parametrize(\n    "terminal_state",\n    ["NOT_REQUIRED_NO_NEW_ACCESS", "NOT_REQUIRED_NO_NEW_CANDIDATES"],\n)\ndef test_detector_flags_allowed_terminal_claim_while_task_is_active(\n    tmp_path: Path, terminal_state: str\n) -> None:\n    root = _init_repo(tmp_path)\n    catalog = root / "configs" / "task-gate" / "mstr-000b.json"\n    payload = json.loads(catalog.read_text(encoding="utf-8"))\n    payload["tasks"]["B003"]["closeout_rule"] = {\n        "terminal_states": ["COMPLETE_CANONICAL", terminal_state]\n    }\n    catalog.write_text(json.dumps(payload, indent=2) + "\\n", encoding="utf-8")\n    _write_b003_evidence(root, state=terminal_state)\n    _commit_main(root, f"claim {terminal_state} while B003 remains active")\n\n    report = detect_canonical_drift(repository_root=root)\n    assert "evidence.completion_claim_active_task" in _codes(report), report\n'''
          replace_once(tests, anchor, addition + anchor, "terminal-state contract tests")
          PY

      - name: Verify repair scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile src/mstr_qualify/task_drift.py tests/unit/test_task_drift.py
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          expected = {
              "src/mstr_qualify/task_drift.py",
              "tests/unit/test_task_drift.py",
          }
          changed = set(subprocess.run(
              ["git", "diff", "--name-only"], check=True, capture_output=True, text=True
          ).stdout.splitlines())
          assert changed == expected, (changed, expected)
          cases = json.loads(Path("tests/fixtures/task_drift_cases.json").read_text(encoding="utf-8"))["cases"]
          assert len(cases) == 13, len(cases)
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: python -m pip install -e '.[dev]'

      - name: Run targeted B003 tests
        run: pytest -q tests/unit/test_task_drift.py tests/integration/test_task_drift_cli.py

      - name: Prove repaired detector sees canonical main as clean
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git worktree add --detach /tmp/b003-main "$EXPECTED_MAIN"
          git -C /tmp/b003-main update-ref refs/heads/main "$EXPECTED_MAIN"
          git -C /tmp/b003-main update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          python - <<'PY'
          from pathlib import Path
          from mstr_qualify.task_drift import detect_canonical_drift
          report = detect_canonical_drift(repository_root=Path("/tmp/b003-main"))
          assert report["status"] == "clean", report
          assert report["findings"] == [], report
          assert report["tasks_checked"] == 34, report
          print("TERMINAL_STATE_REPAIR_CANONICAL_DRIFT_STATUS=clean")
          PY

      - name: Frozen gate - pytest
        run: pytest -q

      - name: Frozen gate - Ruff
        run: ruff check src tests

      - name: Frozen gate - mypy
        run: mypy

      - name: Frozen gate - offline validate
        run: python -m mstr_qualify validate

      - name: Guarded fast-forward repair push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mstr_qualify/task_drift.py tests/unit/test_task_drift.py
          git commit -m "fix(mstr-000b): respect declared terminal states"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "TERMINAL_STATE_REPAIRED_B003_HEAD=$(git rev-parse HEAD)"
