name: Reconcile PR166 current-state frontier

on:
  push:
    branches:
      - evidence/pr166-current-state-a018-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR166 target
        uses: actions/checkout@v4
        with:
          ref: closeout/000-t030-canonical
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "50df3540fc4c1568169d8b5dcb27e8e49a0e1737"
          test "$(git rev-parse HEAD^{tree})" = "288a818c532a04028219b64dee6b3295f09aa249"

      - name: Repair stale A000A current-state prose only
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/reconcile.py
          python /tmp/reconcile.py
          git diff --check
          test "$(git diff --name-only)" = "docs/canonical/CURRENT_STATE.md"

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add docs/canonical/CURRENT_STATE.md
          git commit -m "docs(canonical): reconcile A018 completion frontier"
          git push origin HEAD:closeout/000-t030-canonical
