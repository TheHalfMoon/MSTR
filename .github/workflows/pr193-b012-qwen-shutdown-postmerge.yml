name: PR193 B012 Qwen shutdown postmerge verification

on:
  push:
    branches:
      - evidence/pr193-postmerge-5e15cfd

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OLD_MAIN: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
      SUBJECT: 15287f04bf279b7896a926e655c344f7be96d38c
      SUBJECT_TREE: ac9f512e6d6b46cf85f0b055174dfe6c7571e59b
      MERGE: 5e15cfd0d5eb696154a757edd9382dfea65359cf
      QUAL_RUN: '34173514002'
      REVIEW_RUN: '34173839964'
      PREMERGE_RUN: '34174585882'
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove exact merge topology and evidence chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          [[ "$(git rev-parse origin/main)" == "$MERGE" ]]
          [[ "$(git rev-parse HEAD)" == "$MERGE" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          [[ "$(git rev-parse HEAD^1)" == "$OLD_MAIN" ]]
          [[ "$(git rev-parse HEAD^2)" == "$SUBJECT" ]]
          gh api repos/$GITHUB_REPOSITORY/pulls/193 > /tmp/pr.json
          jq -e --arg merge "$MERGE" --arg head "$SUBJECT" '.state=="closed" and .merged==true and .merge_commit_sha==$merge and .head.sha==$head' /tmp/pr.json >/dev/null
          for run in "$QUAL_RUN" "$REVIEW_RUN" "$PREMERGE_RUN"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/run.json
            jq -e '.status=="completed" and .conclusion=="success"' /tmp/run.json >/dev/null
          done

      - name: Prove canonical fail-closed incident semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          e=json.loads(Path('artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json').read_text())
          assert b['status']=='BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR'
          q=b['qwen_raw_code_recovery_runner_shutdown']
          assert q['run_id']==34169060075
          assert q['failure_classification']=='B012_INFRASTRUCTURE_RUNNER_SHUTDOWN_NO_DURABLE_RECOVERY_RESULT'
          assert q['durable_artifact_count']==0
          assert q['raw_code_result']=='NONE_DURABLY_PROVEN'
          assert q['model_quality_verdict']=='NONE'
          assert q['retry_authority_created'] is False
          assert q['external_dispatch_authority_created'] is False
          assert e['candidate_execution_completion']=='NOT_PROVEN'
          assert e['ephemeral_cleanup_completion']=='NOT_PROVEN'
          assert e['training'] is False
          assert e['paid_compute_authority_created'] is False
          PY

      - name: Exact-main task gate and canonical formatter baseline
        run: |
          set -euo pipefail
          git checkout -B main "$MERGE"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/b012.json',encoding='utf-8'))
          assert d['task_id']=='B012'
          assert d['canonical_main']==os.environ['MERGE']
          assert d['eligible'] is True
          assert d['authority_result']['satisfied'] is True
          assert d['state_consistency_result']['observed_state']=='PENDING'
          assert d['supersession_result']['superseded'] is False
          PY
          set +e
          python -m ruff format --check --diff . > /tmp/format.diff 2>&1
          code=$?
          set -e
          [[ "$code" -eq 1 ]]

      - name: Fresh canonical quality
        run: |
          set -euo pipefail
          python -m pytest -q tests/contract/test_b012_authority.py tests/contract/test_b012_executor_binding.py tests/contract/test_b012_qwen_raw_code_recovery.py tests/contract/test_b012_runner_shutdown_evidence.py tests/contract/test_b012_stage_checkpoint_topology.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          python -m ruff format --check tests/contract/test_b012_executor_binding.py tests/contract/test_b012_qwen_raw_code_recovery.py tests/contract/test_b012_runner_shutdown_evidence.py tests/contract/test_b012_stage_checkpoint_topology.py

      - name: Final exact canonical guard
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$MERGE" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$MERGE" ]]
          echo 'PR193_POSTMERGE=PASS'
          echo 'B012_BINDING=BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
