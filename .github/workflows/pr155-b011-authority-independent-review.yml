name: Independent semantic review PR155 B011 authority

on:
  push:
    branches:
      - evidence/pr155-b011-authority-independent-review

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  EXPECTED_BASE: 3e3ec4c4ec9b179ab4a3cd7addd6e0a46ac9201b
  EXPECTED_HEAD: 55c972f98399f3699113b4282c0922ef7ace8abf
  EXPECTED_TREE: 7fa76c7e671ebb406c2a2cacba9a02205349d548
  TARGET_BRANCH: governance/b011-founder-authority-exact-b010-envelope-v2
  PR_NUMBER: '155'
  QUALIFICATION_RUN: '33860335057'

jobs:
  independent_semantic_review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical base
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BASE }}
          fetch-depth: 0
          path: base
          persist-credentials: false
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify prior exact-head qualification and immutable identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" --jq .status)" = completed
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" --jq .conclusion)" = success
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git -C candidate rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '.state == "open" and .draft == false and .merged == false and .mergeable == true and .mergeable_state == "clean" and .base.sha == $base and .head.sha == $head and .commits == 1 and .changed_files == 5' /tmp/pr.json >/dev/null
          echo 'PR155_REVIEW_IDENTITY=PASS'
      - name: Independently review authority containment and downstream semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import hashlib
          import json
          from pathlib import Path

          base = Path('base')
          candidate = Path('candidate')
          base_catalog = json.loads((base / 'configs/task-gate/mstr-000b.json').read_text(encoding='utf-8'))
          head_catalog = json.loads((candidate / 'configs/task-gate/mstr-000b.json').read_text(encoding='utf-8'))
          auth_path = candidate / 'artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json'
          auth = json.loads(auth_path.read_text(encoding='utf-8'))
          b010_path = candidate / 'artifacts/manifests/B010-new-candidate-weight-access.json'
          b010 = json.loads(b010_path.read_text(encoding='utf-8'))

          # State-machine review: only B011 authority capture may move.
          assert base_catalog['tasks']['B011']['canonical_state'] == 'BLOCKED'
          assert head_catalog['tasks']['B011']['canonical_state'] == 'PENDING'
          assert head_catalog['tasks']['B011']['prerequisites'] == ['B002', 'B010']
          assert head_catalog['tasks']['B011']['external_effect_class'] == 'MODEL_WEIGHT_ACCESS'
          assert head_catalog['tasks']['B011']['required_authority_id'] == 'B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED'
          for task_id, node in base_catalog['tasks'].items():
              if task_id != 'B011':
                  assert head_catalog['tasks'][task_id] == node, task_id
          normalized = copy.deepcopy(head_catalog)
          normalized['tasks']['B011']['canonical_state'] = 'BLOCKED'
          normalized['unresolved_bindings']['B011'] = base_catalog['unresolved_bindings']['B011']
          assert normalized == base_catalog
          assert head_catalog['tasks']['B012'] == base_catalog['tasks']['B012']
          assert head_catalog['tasks']['B013'] == base_catalog['tasks']['B013']
          assert head_catalog['tasks']['B031'] == base_catalog['tasks']['B031']

          # Founder authority identity and ceiling are exact, not inferred.
          assert auth['authority_id'] == 'B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED'
          assert auth['task_id'] == 'B011'
          assert auth['external_effect_class'] == 'MODEL_WEIGHT_ACCESS'
          assert auth['status'] == 'AUTHORIZED_CANONICAL'
          assert auth['cost_resource_ceiling']['cost_model'] == 'exact-b010-zero-usd-weight-access'
          assert auth['cost_resource_ceiling']['limits'] == [
              {'max': 0.0, 'resource': 'cost', 'unit': 'USD'},
              {'max': 9817996174, 'resource': 'required_download_bytes', 'unit': 'bytes'},
          ]
          scope = auth['scope']
          assert scope['decision'] == 'FOUNDER_B011_MODEL_WEIGHT_ACCESS_DECISION=AUTHORIZE_EXACT_B010_ENVELOPE'
          assert scope['decision_surface'] == {'issue': 153, 'comment_id': 5538049681}
          assert scope['b010_manifest']['sha256'] == hashlib.sha256(b010_path.read_bytes()).hexdigest()
          assert scope['b010_manifest']['sha256'] == '4c2fd1469cdcf728063ab8f5b6a603191ffdc9e1a4d4c2d794abd2a24950c3ef'

          envelopes = {row['candidate_id']: row for row in scope['candidate_access_envelopes']}
          assert set(envelopes) == {'mellum-4b', 'qwen3.5-0.8b-control'}
          mellum = envelopes['mellum-4b']
          qwen = envelopes['qwen3.5-0.8b-control']
          assert mellum['exact_revision'] == '83cce2605fbdf6a3868627e9b0a5924e0072b94d'
          assert mellum['expected_required_download_bytes'] == 8048099065
          assert mellum['expected_weight_bytes'] == 8038527904
          assert qwen['exact_revision'] == 'dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68'
          assert qwen['expected_required_download_bytes'] == 1769897109
          assert qwen['expected_weight_bytes'] == 1746942600
          expected_hosts = [
              'huggingface.co',
              'cdn-lfs.huggingface.co',
              'cas-bridge.xethub.hf.co',
              'transfer.xethub.hf.co',
              'us.aws.cdn.hf.co',
          ]
          for row in envelopes.values():
              assert row['expected_usd'] == 0.0
              assert row['network_hosts'] == expected_hosts
              assert row['network_policy'] == 'HTTPS_GET_ONLY_AFTER_B011_EXACT_FOUNDER_AUTHORIZATION; ABORT_ON_AUTH_GATING_PAYMENT_OR_UNLISTED_REDIRECT'
              assert row['executor'] == 'B011_APPROVED_EPHEMERAL_CLOUD_RUNNER_AFTER_EXACT_FOUNDER_AUTHORIZATION'
              assert row['new_weight_access_required'] is True

          pinned = {
              f['path']: (f['sha256'], f['size_bytes'])
              for row in envelopes.values()
              for f in row['required_files']
              if f['sha256'] is not None
          }
          assert pinned['model-00001-of-00002.safetensors'] == ('04bf4f574526ebecd75283af1f7ed0a412362388ddd28360c1581706cb3a00d2', 4986625856)
          assert pinned['model-00002-of-00002.safetensors'] == ('8fa0269d11332e13874280dbf5a15d5d6086d038656832c16e984544caf4b21b', 3051902048)
          assert pinned['model.safetensors-00001-of-00001.safetensors'] == ('c2b1e5a17d9c1e27685d92ed9b382911ebb99955ecd89052d1721241adfbab6c', 1746942600)
          assert pinned['tokenizer.json'] == ('fe000e3ed39ed12b8d2481d527d44f93c65d37e87645d2dcc80d1bf9d50d2927', 12807196)

          for key in ('gated_terms_acceptance', 'git_model_binaries', 'large_dataset_ingestion', 'paid_compute', 'paid_model_api', 'production_release', 'quantization_execution', 'weight_changing_training'):
              assert scope[key] is False, key
          assert scope['founder_machine_large_artifacts'] == 0
          assert scope['candidate_access_envelopes'] == b010['candidate_access_envelopes']
          print('PR155_INDEPENDENT_AUTHORITY_CONTAINMENT=PASS')
          PY
      - name: Review exact changed-file and source-code boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files <<'EOF'
          artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json
          configs/task-gate/mstr-000b.json
          tests/contract/test_convergence_external_bindings.py
          tests/contract/test_task_gate.py
          tests/integration/test_task_gate_cli.py
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          git -C candidate diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          test -z "$(git -C candidate diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" -- src schemas specs/002-code-model-supremacy-foundation/contracts .github/workflows)"
          git -C candidate diff --check "$EXPECTED_BASE...$EXPECTED_HEAD"
          echo 'PR155_INDEPENDENT_SCOPE_REVIEW=PASS'
      - name: Install exact candidate tooling
        run: python -m pip install -e './candidate[dev]'
      - name: Fresh machine-gate and downstream fail-closed review
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$EXPECTED_HEAD"
          git update-ref refs/remotes/origin/main "$EXPECTED_HEAD"
          mstr-qualify task eligible B011 > /tmp/b011.json
          jq -e '.eligible == true and .authority_result.required == true and .authority_result.satisfied == true and .state_consistency_result.observed_state == "PENDING" and (.reasons | length) == 0' /tmp/b011.json >/dev/null
          if mstr-qualify task eligible B012 > /tmp/b012.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B011")) != null' /tmp/b012.json >/dev/null
          if mstr-qualify task eligible B013 > /tmp/b013.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '(.reasons | index("prerequisite.unsatisfied:B012")) != null' /tmp/b013.json >/dev/null
          echo 'PR155_INDEPENDENT_GATE_REVIEW=PASS'
      - name: Fresh focused and full regression review
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/contract/test_convergence_external_bindings.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          echo 'PR155_INDEPENDENT_QUALITY_REVIEW=PASS'
      - name: Final immutable live review recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr-final.json
          jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '.state == "open" and .draft == false and .merged == false and .mergeable == true and .mergeable_state == "clean" and .base.sha == $base and .head.sha == $head and .review_comments == 0' /tmp/pr-final.json >/dev/null
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          echo 'PR155_B011_AUTHORITY_INDEPENDENT_REVIEW=PASS'
