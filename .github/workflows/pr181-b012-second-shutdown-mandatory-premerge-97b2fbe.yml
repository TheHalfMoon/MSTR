name: PR181 B012 second shutdown mandatory premerge

on:
  push:
    branches:
      - evidence/pr181-b012-second-shutdown-mandatory-premerge-97b2fbe

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  PR_NUMBER: "181"
  BASE_SHA: d9fbf070c425b3da378655cbbd8f656d1a8b7b90
  SUBJECT_BRANCH: fix/b012-second-runner-shutdown-evidence-34068813113
  SUBJECT_SHA: 97b2fbea7493b2499546a0f9c7933ee212002764
  SUBJECT_TREE: 206b3d85404b76a08cc323904eff18ed1d31e604
  QUALIFICATION_RUN: "34135803996"
  QUALIFICATION_HEAD: 111ca30467a9121555c7689570a10a03d1b2203f
  REVIEW_RUN: "34139623741"
  REVIEW_HEAD: 787fb4034906b45256f07ed4e9cad4dd5c5ed82b
  INCIDENT_RUN: "34068813113"
  INCIDENT_JOB: "101582272038"
  INCIDENT_EVIDENCE_SHA256: f20f8a1048392932d477c521329566341f0c1a13115caa3091bb27dfcb38df75

jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout premerge evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Prove immutable base head tree and scope
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            "artifacts/manifests/B012-executor-toolchain-binding.json"
            "artifacts/results/equivalent/B012/failures/B012-mellum-4b-run-34068813113.json"
            "evidence/mstr-000b/B012-runner-shutdown-34068813113.md"
            "tests/contract/test_b012_executor_binding.py"
            "tests/contract/test_b012_runner_shutdown_evidence.py"
          )
          [[ "${#changed[@]}" -eq 5 ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done

      - name: Reverify B012 machine eligibility on actual canonical main
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligibility.json
          python - <<'PY'
          import json, os
          data = json.load(open('/tmp/b012-eligibility.json', encoding='utf-8'))
          assert data['task_id'] == 'B012'
          assert data['canonical_main'] == os.environ['BASE_SHA']
          assert data['eligible'] is True
          assert data['authority_result']['satisfied'] is True
          assert data['state_consistency_result']['observed_state'] == 'PENDING'
          PY
          git checkout --detach "$SUBJECT_SHA"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]

      - name: Verify immutable qualification and review identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
          }
          def get(path: str):
              req = urllib.request.Request(f'https://api.github.com/repos/TheHalfMoon/MSTR{path}', headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          q = get(f"/actions/runs/{os.environ['QUALIFICATION_RUN']}")
          assert q['status'] == 'completed'
          assert q['conclusion'] == 'success'
          assert q['head_sha'] == os.environ['QUALIFICATION_HEAD']
          assert q['head_branch'] == 'evidence/pr181-b012-second-shutdown-qualification-97b2fbe'
          r = get(f"/actions/runs/{os.environ['REVIEW_RUN']}")
          assert r['status'] == 'completed'
          assert r['conclusion'] == 'success'
          assert r['head_sha'] == os.environ['REVIEW_HEAD']
          assert r['head_branch'] == 'evidence/pr181-b012-second-shutdown-independent-review-97b2fbe'
          PY

      - name: Verify live PR readiness and review state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
          }
          def rest(path: str):
              req = urllib.request.Request(f'https://api.github.com/repos/TheHalfMoon/MSTR{path}', headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          pr = rest('/pulls/181')
          assert pr['state'] == 'open'
          assert pr['draft'] is False
          assert pr['base']['ref'] == 'main'
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['ref'] == os.environ['SUBJECT_BRANCH']
          assert pr['head']['sha'] == os.environ['SUBJECT_SHA']
          assert pr['changed_files'] == 5
          reviews = rest('/pulls/181/reviews?per_page=100')
          assert not any(review.get('state') == 'CHANGES_REQUESTED' for review in reviews)

          query = '''query($owner:String!, $name:String!, $number:Int!) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                reviewThreads(first:100) { nodes { isResolved } }
              }
            }
          }'''
          payload = json.dumps({'query': query, 'variables': {'owner':'TheHalfMoon','name':'MSTR','number':181}}).encode()
          request = urllib.request.Request(
              'https://api.github.com/graphql',
              data=payload,
              headers={**headers, 'Content-Type':'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              graph = json.load(response)
          assert 'errors' not in graph, graph
          threads = graph['data']['repository']['pullRequest']['reviewThreads']['nodes']
          assert not any(thread['isResolved'] is False for thread in threads)
          PY

      - name: Reverify incident and fail-closed binding semantics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$INCIDENT_EVIDENCE_SHA256" artifacts/results/equivalent/B012/failures/B012-mellum-4b-run-34068813113.json | sha256sum -c -
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          headers = {'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept':'application/vnd.github+json'}
          def get(path: str):
              req = urllib.request.Request(f'https://api.github.com/repos/TheHalfMoon/MSTR{path}', headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          run = get(f"/actions/runs/{os.environ['INCIDENT_RUN']}")
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          jobs = get(f"/actions/runs/{os.environ['INCIDENT_RUN']}/jobs?per_page=100")['jobs']
          job = next(item for item in jobs if str(item['id']) == os.environ['INCIDENT_JOB'])
          steps = {step['name']: step['conclusion'] for step in job['steps']}
          assert steps['Execute governed B012 qualification'] == 'cancelled'
          assert steps['Upload durable JSON evidence only'] == 'skipped'
          assert get(f"/actions/runs/{os.environ['INCIDENT_RUN']}/artifacts?per_page=100")['total_count'] == 0

          binding = json.loads(Path('artifacts/manifests/B012-executor-toolchain-binding.json').read_text())
          assert binding['status'] == 'BLOCKED_PENDING_RUNNER_SHUTDOWN_TOPOLOGY_REPAIR'
          second = binding['repeated_runner_shutdown_recovery']
          assert second['run_id'] == int(os.environ['INCIDENT_RUN'])
          assert second['same_failure_class_recurred'] is True
          assert second['same_single_job_execution_topology'] is True
          assert second['repeating_same_topology_authorized_by_this_evidence'] is False
          assert second['model_quality_verdict'] == 'NONE'
          assert second['candidate_execution_completion'] == 'NOT_PROVEN'
          assert second['retry_authority_created'] is False
          boundary = binding['execution_boundary']
          for key in ('authority_transfer','candidate_revision_or_file_expansion','new_candidates','training','weight_changing_training','paid_compute','paid_model_api','production_release'):
              assert boundary[key] is False
          PY

      - name: Mandatory focused and full quality gate
        run: |
          python -m pytest -q tests/contract/test_b012_authority.py tests/contract/test_b012_executor_binding.py tests/contract/test_b012_runner_shutdown_evidence.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check tests/contract/test_b012_executor_binding.py tests/contract/test_b012_runner_shutdown_evidence.py
          python -m mypy src/mstr_qualify

      - name: Final live premerge guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          python - <<'PY'
          import json, os, urllib.request
          headers = {'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept':'application/vnd.github+json'}
          def rest(path: str):
              req = urllib.request.Request(f'https://api.github.com/repos/TheHalfMoon/MSTR{path}', headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          pr = rest('/pulls/181')
          assert pr['state'] == 'open' and pr['draft'] is False
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['sha'] == os.environ['SUBJECT_SHA']
          reviews = rest('/pulls/181/reviews?per_page=100')
          assert not any(review.get('state') == 'CHANGES_REQUESTED' for review in reviews)
          PY
          echo 'PR181_MANDATORY_PREMERGE=PASS'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
