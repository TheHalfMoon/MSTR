name: A004 exact-head quality evidence

on:
  push:
    branches:
      - evidence/a004-b3f63-quality-gates

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: b3f63d9c4a597062ee3da2e252cc31fdcc2d6ab7
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: b3f63d9c4a597062ee3da2e252cc31fdcc2d6ab7
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "TARGET_HEAD=$(git rev-parse HEAD)"
          git status --short

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project development tooling
        run: python -m pip install -e '.[dev]'

      - name: Record toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          python --version
          pytest --version
          ruff --version
          mypy --version
          python -c 'import jsonschema; print("jsonschema", jsonschema.__version__)'
          git diff --exit-code

      - name: pytest
        run: pytest -q

      - name: ruff
        run: ruff check src tests

      - name: mypy
        run: mypy

      - name: mstr qualify
        run: python -m mstr_qualify validate
