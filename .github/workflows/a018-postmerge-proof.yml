name: A018 implementation postmerge proof

on:
  push:
    branches:
      - evidence/a018-postmerge-b34a174

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  MERGE_SHA: b34a17441c24712144ce21b64c41ec18eeb12352
  MERGE_TREE: 047b1b36bd83ce6fbfd52de97e3e38fa52db7d32
  OLD_MAIN: f222df1b939fc5db792021d6883d977014502dba
  FEATURE_SHA: fc04967b2cbe874489f3b09a38fb80c1650f2461
  PR_NUMBER: '122'
  QUALIFICATION_RUN: '33491507890'
  PREMERGE_RUN: '33491799986'
  REVIEW_ID: '5076280749'

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - name: Verify merge identity, topology, and canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git rev-parse HEAD^1)" = "$OLD_MAIN"
          test "$(git rev-parse HEAD^2)" = "$FEATURE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
      - name: Verify merged PR and immutable evidence chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.merged' <<<"$pr")" = "true"
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$MERGE_SHA"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$FEATURE_SHA"
          qualification="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}")"
          test "$(jq -r '.conclusion' <<<"$qualification")" = "success"
          premerge="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREMERGE_RUN}")"
          test "$(jq -r '.conclusion' <<<"$premerge")" = "success"
          review="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}")"
          test "$(jq -r '.commit_id' <<<"$review")" = "$FEATURE_SHA"
      - name: Verify implementation is merged but canonical closeout is still pending
        shell: bash
        run: |
          set -euo pipefail
          grep -F '**State:** `IMPLEMENTATION_CANDIDATE`' evidence/mstr-000a/A018-trajectory-factory.md
          grep -F -- '- [x] **A017 Freeze failure taxonomy and training trajectory contract.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A018 Implement trajectory recorder/replay/admission.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A019 Run cross-harness baseline/tournament' specs/001-agent-harness-verified-loop-foundation/tasks.md

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/unit/trajectory/test_trajectory_factory.py -q
      - run: python -m mstr_qualify validate
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy src

  complete:
    runs-on: ubuntu-latest
    needs:
      - identity
      - quality
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
      - name: Final immutable canonical-main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MERGE_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGE_SHA"
