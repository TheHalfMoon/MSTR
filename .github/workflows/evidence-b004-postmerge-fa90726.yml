name: Evidence B004 post-merge verification

on:
  push:
    branches:
      - evidence/b004-postmerge-fa90726

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact canonical main
        run: |
          test "$(git rev-parse HEAD)" = "fa90726a6415cab0b655acae4768c7343cc6370c"
          test "$(git rev-parse HEAD^2)" = "9b8ad22e59e096409b753a6264e61ee59a966dc4"
          test -z "$(git status --short)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -e '.[dev]'

      - name: Verify B004 production eligibility
        run: python -m mstr_qualify task eligible B004

      - name: Capture expected pre-closeout drift
        continue-on-error: true
        run: python -m mstr_qualify task drift

      - name: Frozen pytest
        run: pytest -q

      - name: Frozen Ruff
        run: ruff check src tests

      - name: Frozen mypy
        run: mypy

      - name: Frozen offline validate
        run: python -m mstr_qualify validate

      - name: Verify main remained exact
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "fa90726a6415cab0b655acae4768c7343cc6370c"
          test "$(git rev-parse refs/remotes/origin/main)" = "fa90726a6415cab0b655acae4768c7343cc6370c"
          test -z "$(git status --short)"
