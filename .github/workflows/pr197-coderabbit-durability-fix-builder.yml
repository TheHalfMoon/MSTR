name: PR197 CodeRabbit durability fix builder

on:
  push:
    branches:
      - evidence/pr197-coderabbit-durability-fix-builder-be5dc18

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE: 2d35efe6d7350f6aa0241ee9de128134cd321f90
      START_SUBJECT: be5dc182c7f15602b5da0999ad7f55108233c568
      TARGET_BRANCH: fix/b012-qwen-raw-code-case-checkpoint-topology
    steps:
      - name: Checkout exact reviewed subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.START_SUBJECT }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Prove exact starting identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$START_SUBJECT"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$START_SUBJECT"
          test "$(git merge-base "$BASE" "$START_SUBJECT")" = "$BASE"

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply exact review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          script_path = Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          workflow_path = Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          evidence_path = Path('evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md')
          test_path = Path('tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py')
          manifest_path = Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')

          text = script_path.read_text(encoding='utf-8')
          start = text.index('def _complete_stage(')
          end = text.index('\ndef _stage_init', start)
          block = text[start:end]
          state_write = '    _write(_state_path(output_dir), state)\n'
          assert block.count(state_write) == 1
          block = block.replace(state_write, '', 1)
          checkpoint_tail = '            "checkpoint_payload": checkpoint_payload,\n        },\n    )\n'
          assert block.count(checkpoint_tail) == 1
          block = block.replace(checkpoint_tail, checkpoint_tail + state_write, 1)
          text = text[:start] + block + text[end:]
          script_path.write_text(text, encoding='utf-8')

          workflow = workflow_path.read_text(encoding='utf-8')
          assert workflow.count('retention-days: 7') == 7
          workflow = workflow.replace('retention-days: 7', 'retention-days: 90')
          workflow_path.write_text(workflow, encoding='utf-8')

          evidence = evidence_path.read_text(encoding='utf-8')
          anchor = (
              'Durable workflow artifacts remain JSON-only. No GGUF, safetensors, model source file, '
              'executable, or other model binary is uploaded.\n'
          )
          assert evidence.count(anchor) == 1
          retention = (
              '\nAll seven stage checkpoints use `retention-days: 90`, the maximum GitHub Actions '
              'artifact retention window for this public-repository workflow. The governed follow-up '
              'lifecycle must bind required artifact IDs/digests into canonical evidence before expiration; '
              'missing or expired required checkpoint evidence remains fail-closed.\n'
          )
          evidence = evidence.replace(anchor, anchor + retention, 1)
          evidence_path.write_text(evidence, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          if 'import pytest\n' not in tests:
              tests = tests.replace('import sys\n', 'import sys\n\nimport pytest\n', 1)
          retention_anchor = (
              '    assert workflow.count("${{ runner.temp }}/b012-qwen-raw-code-results/*.json") == 7\n'
          )
          assert tests.count(retention_anchor) == 1
          tests = tests.replace(
              retention_anchor,
              retention_anchor
              + '    assert workflow.count("retention-days: 90") == 7\n'
              + '    assert "retention-days: 7" not in workflow\n',
              1,
          )
          append_test = '''\n\ndef test_completed_state_is_persisted_only_after_checkpoint_write(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    state: dict[str, object] = {\n        "task_id": "B012",\n        "candidate_id": "qwen3.5-0.8b-control",\n        "canonical_main_at_start": "a" * 40,\n        "completed_stages": [],\n        "last_completed_stage": None,\n        "model_access_state": "NONE",\n    }\n    state_path = case_checkpoint._state_path(tmp_path)\n    checkpoint_path = case_checkpoint._checkpoint_path(tmp_path, "init")\n    original_write = case_checkpoint._write\n    attempted: list[Path] = []\n\n    def fail_checkpoint(path: Path, payload: dict[str, object]) -> None:\n        attempted.append(path)\n        if path == checkpoint_path:\n            raise OSError("synthetic checkpoint write failure")\n        original_write(path, payload)\n\n    monkeypatch.setattr(case_checkpoint, "_write", fail_checkpoint)\n    with pytest.raises(OSError, match="synthetic checkpoint write failure"):\n        case_checkpoint._complete_stage(\n            output_dir=tmp_path,\n            state=state,\n            stage="init",\n            checkpoint_payload={"synthetic": True},\n        )\n\n    assert attempted == [checkpoint_path]\n    assert not state_path.exists()\n'''
          assert 'test_completed_state_is_persisted_only_after_checkpoint_write' not in tests
          tests += append_test
          test_path.write_text(tests, encoding='utf-8')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['durability_boundary']['completed_state_persisted_only_after_checkpoint_write'] = True
          manifest['durability_boundary']['checkpoint_artifact_retention_days'] = 90
          manifest['durability_boundary']['checkpoint_artifact_retention_scope'] = (
              'GITHUB_ACTIONS_PUBLIC_REPOSITORY_MAXIMUM'
          )
          manifest['durability_boundary']['required_checkpoint_evidence_missing_or_expired_is_fail_closed'] = True
          manifest['topology']['checkpoint_artifact_retention_days'] = 90
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Canonical formatting and hash binding
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          script_path = Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py')
          workflow_path = Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['case_checkpoint_script_sha256'] = hashlib.sha256(script_path.read_bytes()).hexdigest()
          manifest['case_checkpoint_workflow_sha256'] = hashlib.sha256(workflow_path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print('SCRIPT_SHA256=' + manifest['case_checkpoint_script_sha256'])
          print('WORKFLOW_SHA256=' + manifest['case_checkpoint_workflow_sha256'])
          PY

      - name: Prove review findings are closed and scope is frozen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          script = Path('colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py').read_text(encoding='utf-8')
          start = script.index('def _complete_stage(')
          end = script.index('\ndef _stage_init', start)
          block = script[start:end]
          assert block.index('_checkpoint_path(output_dir, stage)') < block.index('_state_path(output_dir)')
          workflow_path = Path('configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          assert workflow.count('retention-days: 90') == 7
          assert 'retention-days: 7' not in workflow
          manifest_path = Path('artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          sha = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert manifest['case_checkpoint_script_sha256'] == sha(manifest['case_checkpoint_script_path'])
          assert manifest['case_checkpoint_workflow_sha256'] == sha(manifest['case_checkpoint_workflow_spec_path'])
          assert manifest['durability_boundary']['completed_state_persisted_only_after_checkpoint_write'] is True
          assert manifest['durability_boundary']['checkpoint_artifact_retention_days'] == 90
          assert manifest['durability_boundary']['required_checkpoint_evidence_missing_or_expired_is_fail_closed'] is True
          assert manifest['topology']['checkpoint_artifact_retention_days'] == 90
          PY
          git diff --check
          git diff --name-only "$START_SUBJECT" | sort > /tmp/dirty.txt
          cat > /tmp/expected-dirty.txt <<'EOF'
          artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json
          colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py
          configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml
          evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md
          tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          EOF
          sort -o /tmp/expected-dirty.txt /tmp/expected-dirty.txt
          diff -u /tmp/expected-dirty.txt /tmp/dirty.txt
          git diff --name-only "$BASE" | sort > /tmp/all.txt
          diff -u /tmp/expected-dirty.txt /tmp/all.txt
          for path in \
            .github/workflows/b012-qwen-raw-code-recovery.yml \
            artifacts/manifests/B012-executor-toolchain-binding.json \
            artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json \
            artifacts/manifests/B012-equivalent-qualification-execution-envelope.json \
            artifacts/manifests/B012-executor-toolchain-lock.json \
            benchmarks/manifests/B012-raw-code-proxy.json \
            colab/mstr_b012_raw_code.py; do
            test "$(git hash-object "$path")" = "$(git rev-parse "$BASE:$path")"
          done

      - name: Create local reviewed-fix subject
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add \
            artifacts/manifests/B012-qwen-raw-code-case-checkpoint-topology.json \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            configs/workflows/b012-qwen-raw-code-case-checkpoint-recovery.yml \
            evidence/mstr-000b/B012-qwen-raw-code-case-checkpoint-topology.md \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'fix(b012): close per-case durability review findings'
          echo "NEW_SUBJECT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "NEW_TREE=$(git show -s --format=%T HEAD)" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain)"

      - name: Reprove B012 exact-main machine eligibility
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "$BASE"
          python -m mstr_qualify task eligible B012 > /tmp/b012.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('/tmp/b012.json').read_text())
          assert d['task_id'] == 'B012'
          assert d['canonical_main'] == os.environ['BASE']
          assert d['eligible'] is True
          assert d['authority_result']['required'] is True
          assert d['authority_result']['satisfied'] is True
          assert all(x['satisfied'] for x in d['prerequisite_results'])
          assert d['supersession_result']['satisfied'] is True
          assert d['state_consistency_result']['satisfied'] is True
          assert d['candidate_pool_result']['satisfied'] is True
          assert all(d['semantic_checks'].values())
          PY
          git checkout --detach "$NEW_SUBJECT"

      - name: Focused repair contracts
        run: |
          PYTHONPATH=colab python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py \
            tests/contract/test_b012_qwen_staged_recovery_topology.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py

      - name: Repository validation and static quality
        run: |
          python -m mstr_qualify validate
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery_case_checkpoint.py \
            tests/contract/test_b012_qwen_raw_code_case_checkpoint_topology.py

      - name: Full repository tests
        run: python -m pytest -q

      - name: Mypy
        run: python -m mypy src/mstr_qualify

      - name: Push only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEW_SUBJECT"
          test "$(git show -s --format=%T HEAD)" = "$NEW_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$START_SUBJECT"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$NEW_SUBJECT"
          echo "NEW_SUBJECT=$NEW_SUBJECT"
          echo "NEW_TREE=$NEW_TREE"
          echo 'PR197_CODERABBIT_DURABILITY_FIX_BUILDER=PASS'
