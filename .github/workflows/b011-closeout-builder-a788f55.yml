name: Build B011 canonical closeout candidate

on:
  push:
    branches:
      - evidence/b011-closeout-builder-a788f55

permissions:
  actions: read
  contents: write
  pull-requests: read

env:
  EXPECTED_MAIN: a788f55f5251f0be92b33e0765d0436cb321eb8b
  TARGET_BRANCH: closeout/b011-acquisition
  POSTIMPLEMENTATION_RUN: '33927258696'
  POSTIMPLEMENTATION_HEAD: 20cfa49df97012f42a810856e13bcc0bacce2fd6

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify immutable canonical entry and post-implementation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${POSTIMPLEMENTATION_RUN}" > /tmp/postimplementation.json
          jq -e --arg sha "$POSTIMPLEMENTATION_HEAD" '
            .status == "completed" and .conclusion == "success" and
            .head_sha == $sha and .head_branch == "evidence/b011-postimplementation-a788f55-v2"
          ' /tmp/postimplementation.json >/dev/null

      - name: Checkout exact closeout target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact B011 entry gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          python -m mstr_qualify task drift > /tmp/entry-drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/entry-drift.json >/dev/null
          python -m mstr_qualify task eligible B011 > /tmp/b011-entry.json
          jq -e --arg main "$EXPECTED_MAIN" '
            .canonical_main == $main and .task_id == "B011" and .eligible == true and
            .state_consistency_result.observed_state == "PENDING" and
            .authority_result.required == true and .authority_result.satisfied == true and
            (.reasons | length) == 0
          ' /tmp/b011-entry.json >/dev/null

      - name: Materialize bounded B011 closeout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          config_path = Path('configs/task-gate/mstr-000b.json')
          config = json.loads(config_path.read_text())
          assert config['tasks']['B011']['canonical_state'] == 'PENDING'
          assert config['tasks']['B011']['required_authority_id'] == 'B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED'
          assert config['tasks']['B012']['canonical_state'] == 'PENDING'
          assert config['tasks']['B013']['canonical_state'] == 'BLOCKED'
          config['tasks']['B011']['canonical_state'] = 'COMPLETE_CANONICAL'
          config_path.write_text(json.dumps(config, indent=2, ensure_ascii=False) + '\n')

          evidence_path = Path('evidence/mstr-000b/B011-acquisition.md')
          evidence = evidence_path.read_text()
          old_state = '**Evidence state:** `ACQUISITION_EXECUTED_VERIFIED / CANONICAL_CLOSEOUT_PENDING`  '
          assert old_state in evidence
          evidence = evidence.replace(old_state, '**Evidence state:** `COMPLETE_CANONICAL`  ', 1)
          marker = '**Founder decision:** `FOUNDER_B011_MODEL_WEIGHT_ACCESS_DECISION=AUTHORIZE_EXACT_B010_ENVELOPE`\n'
          assert marker in evidence
          provenance = '''**Closeout entry canonical main:** `a788f55f5251f0be92b33e0765d0436cb321eb8b`  
**Implementation PR:** `#157`  
**Final implementation head:** `450d9b5b9b3c6aca27222a553dc6230f6eef6783`  
**Canonical implementation merge:** `b9aa4f7de8b924d283d09fa8d93dbaceb0f6b4cd`  
**Successful acquisition run:** `33865617854`  
**Exact-head qualification:** `33867186224`  
**Independent substantive semantic review:** `33867564924`  
**Mandatory premerge verification:** `33867838434`  
**Post-implementation verification:** `33927258696`  
**Frontier-planning postmerge verification:** `33926866711`
'''
          evidence = evidence.replace(marker, marker + '\n' + provenance, 1)
          closeout_marker = '## Closeout Boundary\n\n'
          assert closeout_marker in evidence
          prefix = evidence.split(closeout_marker, 1)[0]
          closeout = '''## Canonical Closeout

The B011 acquisition/verification implementation is complete and all required lifecycle evidence is bound above. The earlier fail-closed run `33865467059` remains preserved as negative evidence: no model-weight download started in that attempt.

This closeout changes only the canonical lifecycle state of B011. It does not re-acquire any model body, does not perform model execution, conversion, quantization, training, large-dataset ingestion, gated-terms acceptance, paid compute/API use, production release, or model-binary persistence.

The historical authority `B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED` remains an execution record scoped only to B011 and the exact B010 envelope. It does not transfer to, authorize, or widen B012 or any later task. In particular, it does not authorize K2 Horizon or any newly discovered candidate.

`COMPLETE_CANONICAL` is valid only after this closeout candidate is merged to canonical `main` and the required post-closeout exact-main verification succeeds. Until then, canonical `main` remains authoritative.
'''
          evidence_path.write_text(prefix + closeout)

          tasks_path = Path('specs/002-code-model-supremacy-foundation/tasks.md')
          tasks = tasks_path.read_text()
          old_b011 = '- [ ] **B011 EXPLICIT NEW WEIGHT ACCESS GATE — acquire/verify only founder-authorized B010 access-required candidates.**'
          assert old_b011 in tasks
          tasks = tasks.replace(old_b011, '- [x] **B011 EXPLICIT NEW WEIGHT ACCESS GATE — acquire/verify only founder-authorized B010 access-required candidates.**', 1)
          boundary = '  Outputs: `artifacts/manifests/B011-acquired-candidates.json` or explicit no-access decision artifact, runner evidence where executed, `evidence/mstr-000b/B011-acquisition.md`.\n\n- [ ] **B012'
          assert boundary in tasks
          tasks = tasks.replace(
              boundary,
              '  Outputs: `artifacts/manifests/B011-acquired-candidates.json` or explicit no-access decision artifact, runner evidence where executed, `evidence/mstr-000b/B011-acquisition.md`.\n'
              '  Canonical implementation: PR #157 / final head `450d9b5b9b3c6aca27222a553dc6230f6eef6783` / merge `b9aa4f7de8b924d283d09fa8d93dbaceb0f6b4cd`.\n\n- [ ] **B012',
              1,
          )
          tasks_path.write_text(tasks)

          contract_path = Path('tests/contract/test_task_gate.py')
          contract = contract_path.read_text()
          pattern = re.compile(
              r'def test_b011_is_eligible_after_exact_founder_authority_capture\(\) -> None:\n.*?\n\ndef test_b006_fails_closed_when_b005_discovery_manifest_is_missing',
              re.S,
          )
          replacement = '''def test_b011_is_terminal_after_canonical_closeout() -> None:
    result = evaluate_task_snapshot("B011", canonical_main=_CANONICAL_MAIN)

    assert result["eligible"] is False
    assert result["state_consistency_result"]["observed_state"] == "COMPLETE_CANONICAL"
    assert result["state_consistency_result"]["satisfied"] is True
    assert result["authority_result"] == {
        "required": True,
        "authority_id": "B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED",
        "satisfied": True,
        "reasons": [],
    }
    assert "task.already_terminal" in result["reasons"]
    validate_instance("mstr-task-eligibility-v0", result)


def test_b012_is_eligible_after_b011_canonical_closeout() -> None:
    result = evaluate_task_snapshot("B012", canonical_main=_CANONICAL_MAIN)

    assert result["eligible"] is True
    assert result["state_consistency_result"]["observed_state"] == "PENDING"
    predecessor = next(row for row in result["prerequisite_results"] if row["task_id"] == "B011")
    assert predecessor["satisfied"] is True
    assert "task.blocked" not in result["reasons"]
    assert "task.unresolved_binding" not in result["reasons"]
    validate_instance("mstr-task-eligibility-v0", result)


def test_b006_fails_closed_when_b005_discovery_manifest_is_missing'''
          contract, count = pattern.subn(replacement, contract, count=1)
          assert count == 1
          contract_path.write_text(contract)

          cli_path = Path('tests/integration/test_task_gate_cli.py')
          cli = cli_path.read_text()
          pattern = re.compile(
              r'def test_task_eligible_b011_authorized_returns_zero\(.*?\n\ndef test_task_eligible_configuration_error_returns_two',
              re.S,
          )
          replacement = '''def test_task_eligible_b011_terminal_returns_one(
    monkeypatch: pytest.MonkeyPatch, capsys: pytest.CaptureFixture[str]
) -> None:
    expected = evaluate_task_snapshot("B011", canonical_main=_CANONICAL_MAIN)

    def fake_evaluate_task_eligibility(task_id: str) -> dict[str, object]:
        assert task_id == "B011"
        return expected

    monkeypatch.setattr(
        "mstr_qualify.cli.evaluate_task_eligibility", fake_evaluate_task_eligibility
    )
    exit_code = main(["task", "eligible", "B011"])
    payload = _stdout_json(capsys)
    assert exit_code == 1
    assert payload == expected
    assert payload["eligible"] is False
    assert "task.already_terminal" in payload["reasons"]
    validate_instance("mstr-task-eligibility-v0", payload)


def test_task_eligible_b012_successor_returns_zero(
    monkeypatch: pytest.MonkeyPatch, capsys: pytest.CaptureFixture[str]
) -> None:
    expected = evaluate_task_snapshot("B012", canonical_main=_CANONICAL_MAIN)

    def fake_evaluate_task_eligibility(task_id: str) -> dict[str, object]:
        assert task_id == "B012"
        return expected

    monkeypatch.setattr(
        "mstr_qualify.cli.evaluate_task_eligibility", fake_evaluate_task_eligibility
    )
    exit_code = main(["task", "eligible", "B012"])
    payload = _stdout_json(capsys)
    assert exit_code == 0
    assert payload == expected
    assert payload["eligible"] is True
    validate_instance("mstr-task-eligibility-v0", payload)


def test_task_eligible_configuration_error_returns_two'''
          cli, count = pattern.subn(replacement, cli, count=1)
          assert count == 1
          cli_path.write_text(cli)

          convergence_path = Path('tests/contract/test_convergence_external_bindings.py')
          convergence = convergence_path.read_text()
          old = '    assert tasks["B011"]["canonical_state"] == "PENDING"\n'
          assert convergence.count(old) == 1
          convergence = convergence.replace(
              old,
              '    assert tasks["B011"]["canonical_state"] == "COMPLETE_CANONICAL"\n'
              '    assert tasks["B012"]["canonical_state"] == "PENDING"\n',
              1,
          )
          convergence_path.write_text(convergence)
          PY

      - name: Verify exact bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cat > /tmp/expected-files <<'EOF'
          configs/task-gate/mstr-000b.json
          evidence/mstr-000b/B011-acquisition.md
          specs/002-code-model-supremacy-foundation/tasks.md
          tests/contract/test_convergence_external_bindings.py
          tests/contract/test_task_gate.py
          tests/integration/test_task_gate_cli.py
          EOF
          sed -i 's/^          //' /tmp/expected-files
          sort -o /tmp/expected-files /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --quiet -- artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json artifacts/manifests/B010-new-candidate-weight-access.json artifacts/manifests/B011-acquired-candidates.json src schemas .github/workflows docs/canonical/CURRENT_STATE.md

      - name: Candidate validation and quality
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/contract/test_convergence_external_bindings.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src

      - name: Commit candidate and prove prospective task frontier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TheHalfMoon'
          git config user.email '285091250+TheHalfMoon@users.noreply.github.com'
          git add configs/task-gate/mstr-000b.json evidence/mstr-000b/B011-acquisition.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_convergence_external_bindings.py tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          git commit -m 'closeout(mstr): canonicalize B011 acquisition'
          candidate="$(git rev-parse HEAD)"
          git update-ref refs/heads/main "$candidate"
          git update-ref refs/remotes/origin/main "$candidate"
          python -m mstr_qualify task drift > /tmp/prospective-drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/prospective-drift.json >/dev/null
          set +e
          python -m mstr_qualify task eligible B011 > /tmp/b011-prospective.json
          b011_exit=$?
          python -m mstr_qualify task eligible B012 > /tmp/b012-prospective.json
          b012_exit=$?
          python -m mstr_qualify task eligible B013 > /tmp/b013-prospective.json
          b013_exit=$?
          set -e
          test "$b011_exit" -eq 1
          test "$b012_exit" -eq 0
          test "$b013_exit" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null' /tmp/b011-prospective.json >/dev/null
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and (.reasons | length) == 0' /tmp/b012-prospective.json >/dev/null
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and (.reasons | index("prerequisite.unsatisfied:B012")) != null' /tmp/b013-prospective.json >/dev/null
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          echo "CANDIDATE_HEAD=$candidate"

      - name: Guarded fast-forward push of target branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$(git rev-parse HEAD)"
          echo 'B011_CLOSEOUT_CANDIDATE_BUILT=PASS'
