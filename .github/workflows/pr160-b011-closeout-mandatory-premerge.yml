name: Mandatory premerge PR160 B011 closeout

on:
  push:
    branches:
      - evidence/pr160-b011-closeout-mandatory-premerge

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read

env:
  BASE_SHA: a788f55f5251f0be92b33e0765d0436cb321eb8b
  HEAD_SHA: 60eb83121a80fc4f30058c62e3d18b01d89d68cf
  EXPECTED_TREE: 2f0480a380c746b8a59ec39d2381303098738f5e
  TARGET_BRANCH: closeout/b011-acquisition
  PR_NUMBER: '160'
  QUALIFICATION_RUN: '33957022743'
  QUALIFICATION_EVIDENCE_HEAD: e3b9af44a0cbb56f3db4e2496980139714e11d75
  REVIEW_RUN: '33957202006'
  REVIEW_EVIDENCE_HEAD: 8ccceac3fb953b26ae365cef379cc0c48f439dad

jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60eb83121a80fc4f30058c62e3d18b01d89d68cf
          fetch-depth: 0
          persist-credentials: false
      - name: Verify evidence dependencies, exact PR object, review/thread state, rules and checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA".."$HEAD_SHA")" -eq 2
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"

          for spec in "$QUALIFICATION_RUN:$QUALIFICATION_EVIDENCE_HEAD" "$REVIEW_RUN:$REVIEW_EVIDENCE_HEAD"; do
            run="${spec%%:*}"
            expected="${spec##*:}"
            test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$run --jq .status)" = completed
            test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$run --jq .conclusion)" = success
            test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$run --jq .head_sha)" = "$expected"
          done

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" '.state == "open" and .merged == false and .draft == false and .mergeable != false and .base.ref == "main" and .base.sha == $base and .head.ref == "closeout/b011-acquisition" and .head.sha == $head and .commits == 2 and .changed_files == 6' /tmp/pr.json >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" > /tmp/reviews.json
          jq -e '[.[] | select(.state == "CHANGES_REQUESTED")] | length == 0' /tmp/reviews.json >/dev/null

          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner='TheHalfMoon' -f name='MSTR' -F number=160 > /tmp/threads.json
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length == 0' /tmp/threads.json >/dev/null

          test "$(gh api repos/${GITHUB_REPOSITORY}/branches/main --jq .protected)" = false
          test "$(gh api repos/${GITHUB_REPOSITORY}/rulesets --jq 'length')" -eq 0

          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" > /tmp/status.json
          jq -e '[.statuses[] | select(.state == "failure" or .state == "error")] | length == 0' /tmp/status.json >/dev/null
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" > /tmp/checks.json
          jq -e '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required")] | length == 0' /tmp/checks.json >/dev/null
          echo 'PR160_PREMERGE_BOUNDARY=PASS'

  scope_semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60eb83121a80fc4f30058c62e3d18b01d89d68cf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reprove exact six-file closeout, lifecycle semantics, drift, and authority containment
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
          expected=(
            configs/task-gate/mstr-000b.json
            evidence/mstr-000b/B011-acquisition.md
            specs/002-code-model-supremacy-foundation/tasks.md
            tests/contract/test_convergence_external_bindings.py
            tests/contract/test_task_gate.py
            tests/integration/test_task_gate_cli.py
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 6
          diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}")
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- src schemas .github/workflows docs/canonical/CURRENT_STATE.md artifacts/authorities artifacts/manifests)"

          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$HEAD_SHA"
          git update-ref refs/remotes/origin/main "$HEAD_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json >/dev/null
          set +e
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_exit=$?
          mstr-qualify task eligible B012 > /tmp/b012.json; b012_exit=$?
          mstr-qualify task eligible B013 > /tmp/b013.json; b013_exit=$?
          set -e
          test "$b011_exit" -eq 1
          test "$b012_exit" -eq 0
          test "$b013_exit" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null and .authority_result.required == true and .authority_result.satisfied == true and .authority_result.authority_id == "B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED"' /tmp/b011.json >/dev/null
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and (.reasons | length) == 0' /tmp/b012.json >/dev/null
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and (.reasons | index("prerequisite.unsatisfied:B012")) != null' /tmp/b013.json >/dev/null

          grep -F 'ENTRY_GATE_TASK=B011' evidence/mstr-000b/B011-acquisition.md
          grep -F 'ENTRY_GATE_CANONICAL_MAIN=dd547bb768598f92ad203764ce32be6e1fc710d6' evidence/mstr-000b/B011-acquisition.md
          grep -F 'does not transfer to, authorize, or widen B012 or any later task' evidence/mstr-000b/B011-acquisition.md
          grep -F 'does not authorize K2 Horizon or any newly discovered candidate' evidence/mstr-000b/B011-acquisition.md
          git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- artifacts/authorities/B011_FOUNDER_AUTHORITY_IF_ACCESS_REQUIRED.json artifacts/manifests/B010-new-candidate-weight-access.json artifacts/manifests/B011-acquired-candidates.json
          echo 'PR160_PREMERGE_SCOPE_SEMANTICS=PASS'

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60eb83121a80fc4f30058c62e3d18b01d89d68cf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mandatory premerge repository validation and quality
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py tests/contract/test_convergence_external_bindings.py
          python -m pytest -q
          python -m ruff check .
          python -m mypy src
          git update-ref refs/heads/main "$HEAD_SHA"
          git update-ref refs/remotes/origin/main "$HEAD_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json >/dev/null
          echo 'PR160_PREMERGE_QUALITY=PASS'

  complete:
    needs: [boundary, scope_semantics, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60eb83121a80fc4f30058c62e3d18b01d89d68cf
          fetch-depth: 0
          persist-credentials: false
      - name: Final guarded identity and immutability proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$HEAD_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" '.state == "open" and .merged == false and .draft == false and .mergeable != false and .base.sha == $base and .head.sha == $head' /tmp/pr.json >/dev/null
          echo 'PR160_B011_CLOSEOUT_MANDATORY_PREMERGE=PASS'
