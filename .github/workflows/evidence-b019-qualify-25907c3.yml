name: Qualify exact B019 teacher-rescue head

on:
  push:
    branches:
      - evidence/b019-qualify-25907c3

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_MAIN: 2605846607fc98291ded4e53e9bb6bb6c3cf52a0
  EXPECTED_HEAD: 25907c32fb60e83a6b171192e8c12c8092bc9f5e
  TARGET_BRANCH: feat/000b-b019-teacher-rescue-policy
  PR_NUMBER: "78"

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/000b-b019-teacher-rescue-policy
          fetch-depth: 0
      - name: Verify exact PR target and scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          expected=$(printf '%s\n' \
            docs/data/TEACHER_RESCUE_POLICY.md \
            evidence/mstr-000b/B019-teacher-policy.md \
            schemas/mstr-teacher-rescue-record-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-teacher-rescue-record-v0.schema.json \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/schemas.py \
            tests/contract/test_schemas.py \
            tests/contract/test_teacher_rescue_contract.py \
            tests/fixtures/schemas/invalid/mstr-teacher-rescue-record-v0.json \
            tests/fixtures/schemas/valid/mstr-teacher-rescue-record-v0.json \
            tests/integration/test_cli_offline.py | sort)
          actual=$(git diff --name-only "$EXPECTED_MAIN...$EXPECTED_HEAD" | sort)
          test "$actual" = "$expected"
          git diff --check "$EXPECTED_MAIN...$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.ref' <<<"$pr")" = "main"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.ref' <<<"$pr")" = "$TARGET_BRANCH"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.changed_files' <<<"$pr")" = "11"

  entry_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact-main environment
        run: python -m pip install -e '.[dev]'
      - name: Re-prove exact-main B019 authority and drift state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain)"
          python -m mstr_qualify task eligible B019 > /tmp/b019.json
          if python -m mstr_qualify task eligible B011 > /tmp/b011.json; then exit 1; fi
          python -m mstr_qualify task drift > /tmp/drift.json
          test "$(jq -r '.eligible' /tmp/b019.json)" = "true"
          test "$(jq -r '.state_consistency_result.observed_state' /tmp/b019.json)" = "PENDING"
          test "$(jq -r '.authority_result.required' /tmp/b019.json)" = "false"
          test "$(jq -r '.authority_result.satisfied' /tmp/b019.json)" = "true"
          test "$(jq -r '.eligible' /tmp/b011.json)" = "false"
          test "$(jq -r '.state_consistency_result.observed_state' /tmp/b011.json)" = "BLOCKED"
          test "$(jq -r '.authority_result.required' /tmp/b011.json)" = "true"
          test "$(jq -r '.authority_result.satisfied' /tmp/b011.json)" = "false"
          test "$(jq -r '.status' /tmp/drift.json)" = "clean"
          test "$(jq '.findings | length' /tmp/drift.json)" = "0"

  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/000b-b019-teacher-rescue-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Run exact B019 contract and registration tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          pytest -q tests/contract/test_teacher_rescue_contract.py tests/contract/test_schemas.py tests/integration/test_cli_offline.py
          python -m mstr_qualify validate
          cmp schemas/mstr-teacher-rescue-record-v0.schema.json specs/002-code-model-supremacy-foundation/contracts/mstr-teacher-rescue-record-v0.schema.json

  full_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/000b-b019-teacher-rescue-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Run frozen repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy

  complete:
    needs: [identity, entry_gate, focused, full_quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Final PR and remote immutability recheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft' <<<"$pr")" = "false"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$EXPECTED_MAIN"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.changed_files' <<<"$pr")" = "11"
