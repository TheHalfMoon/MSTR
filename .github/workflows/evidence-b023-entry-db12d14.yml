name: Prove B023 entry gate

on:
  push:
    branches:
      - evidence/b023-entry-db12d14

permissions:
  contents: read

env:
  EXPECTED_MAIN: db12d1467bb81185a9affffb4d470626ceceddfa

jobs:
  entry_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db12d1467bb81185a9affffb4d470626ceceddfa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove exact B023 eligibility and clean canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          python -m pip install -e '.[dev]'
          git update-ref refs/heads/main "$EXPECTED_MAIN"
          git update-ref refs/remotes/origin/main "$EXPECTED_MAIN"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json
          mstr-qualify task eligible B023 > /tmp/b023.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true' /tmp/b023.json
          jq -e '[.prerequisite_results[] | select(.task_id == "A006" and .observed_state == "COMPLETE_CANONICAL" and .evidence_present == true and .satisfied == true)] | length == 1' /tmp/b023.json
          jq -e '[.prerequisite_results[] | select(.task_id == "A014" and .observed_state == "COMPLETE_CANONICAL" and .evidence_present == true and .satisfied == true)] | length == 1' /tmp/b023.json
          jq -e '[.prerequisite_results[] | select(.task_id == "B002" and .observed_state == "COMPLETE_CANONICAL" and .evidence_present == true and .satisfied == true)] | length == 1' /tmp/b023.json
          jq -e '[.prerequisite_results[] | select(.task_id == "B022" and .observed_state == "COMPLETE_CANONICAL" and .evidence_present == true and .satisfied == true)] | length == 1' /tmp/b023.json
          if mstr-qualify task eligible B024 > /tmp/b024.json; then exit 1; else test "$?" -eq 1; fi
          jq -e '.eligible == false and .state_consistency_result.observed_state == "PENDING" and (.reasons | index("prerequisite.unsatisfied:B023")) != null' /tmp/b024.json
          mstr-qualify validate
          pytest -q
          ruff check src tests
          mypy src
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo "ENTRY_GATE_TASK=B023"
          echo "ENTRY_GATE_CANONICAL_MAIN=$EXPECTED_MAIN"
          echo "ENTRY_GATE_ELIGIBLE=true"
          echo "ENTRY_GATE_DRIFT=clean"
          echo "B023_EXTERNAL_AUTHORITY_REQUIRED=false"
          echo "MODEL_EXECUTION=NONE"
          echo "VERIFIER_EVALUATOR_EXECUTION=CONTROLLED_FIXTURES_ONLY"
          echo "WEIGHT_CHANGING_TRAINING=NONE"
