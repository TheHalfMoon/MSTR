name: PR159 Machine Eligibility Diagnostic

on:
  push:
    branches:
      - evidence/pr159-frontier-machine-eligibility-diagnostic

permissions:
  contents: read

env:
  EXPECTED_MAIN: b9aa4f7de8b924d283d09fa8d93dbaceb0f6b4cd

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
      - name: Install canonical tooling
        run: python -m pip install -e '.[dev]'
      - name: Print B011 eligibility and task drift without masking diagnostic output
        shell: bash
        run: |
          set +e
          python -m mstr_qualify task eligible B011 > /tmp/b011.json 2>/tmp/b011.err
          b011_exit=$?
          python -m mstr_qualify task drift > /tmp/drift.json 2>/tmp/drift.err
          drift_exit=$?
          set -e
          echo '=== B011_ELIGIBILITY_JSON ==='
          cat /tmp/b011.json || true
          echo '=== B011_ELIGIBILITY_STDERR ==='
          cat /tmp/b011.err || true
          echo "B011_EXIT=${b011_exit}"
          echo '=== TASK_DRIFT_JSON ==='
          cat /tmp/drift.json || true
          echo '=== TASK_DRIFT_STDERR ==='
          cat /tmp/drift.err || true
          echo "DRIFT_EXIT=${drift_exit}"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/b011.json')
          if p.exists() and p.read_text().strip():
              data = json.loads(p.read_text())
              print('B011_ELIGIBLE=' + str(data.get('eligible')))
              print('B011_REASONS=' + json.dumps(data.get('reasons', []), sort_keys=True))
              print('B011_AUTHORITY=' + json.dumps(data.get('authority_result', {}), sort_keys=True))
              print('B011_STATE=' + json.dumps(data.get('state_consistency_result', {}), sort_keys=True))
              print('B011_PREREQUISITES=' + json.dumps(data.get('prerequisite_results', []), sort_keys=True))
          p = Path('/tmp/drift.json')
          if p.exists() and p.read_text().strip():
              data = json.loads(p.read_text())
              print('DRIFT_TOP_LEVEL=' + json.dumps(data, sort_keys=True))
          PY
          exit 0
