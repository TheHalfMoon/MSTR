name: Build B005 canonical closeout

on:
  push:
    branches:
      - evidence/b005-closeout-build-1e096f4

permissions:
  contents: write

env:
  EXPECTED_MAIN: 1e096f4d1f270b2803da6a6306e9e7f0cf8fb81b
  TARGET_BRANCH: docs/000b-b005-canonicalize
  EXPECTED_TARGET: 1e096f4d1f270b2803da6a6306e9e7f0cf8fb81b
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout builder
        uses: actions/checkout@v4
        with:
          ref: evidence/b005-closeout-build-1e096f4
          fetch-depth: 1
          path: evidence
          persist-credentials: false

      - name: Checkout exact closeout target
        uses: actions/checkout@v4
        with:
          ref: docs/000b-b005-canonicalize
          fetch-depth: 0
          path: target
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        working-directory: target
        run: python -m pip install -e '.[dev]'

      - name: Verify exact live closeout entry state
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET"
          git branch -f main "$EXPECTED_MAIN"
          test -z "$(git status --short)"
          python -m mstr_qualify task eligible B005 > /tmp/b005-entry.json
          python -m mstr_qualify task drift > /tmp/b005-drift.json
          python - <<'PY'
          import json, os
          entry = json.load(open('/tmp/b005-entry.json', encoding='utf-8'))
          drift = json.load(open('/tmp/b005-drift.json', encoding='utf-8'))
          assert entry['task_id'] == 'B005'
          assert entry['eligible'] is True
          assert entry['canonical_main'] == os.environ['EXPECTED_MAIN']
          assert entry['state_consistency_result']['observed_state'] == 'PENDING'
          assert entry['reasons'] == []
          assert drift['status'] == 'clean'
          assert drift['findings'] == []
          print('B005_CLOSEOUT_ENTRY_GATE=PASS')
          print('B005_CLOSEOUT_ENTRY_DRIFT=CLEAN')
          PY

      - name: Apply bounded B005 closeout transition
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('configs/task-gate/mstr-000b.json')
          tasks_path = Path('specs/002-code-model-supremacy-foundation/tasks.md')
          evidence_path = Path('evidence/mstr-000b/B005-code-backbone-rescan.md')

          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          assert catalog['tasks']['B005']['canonical_state'] == 'PENDING'
          assert catalog['tasks']['B006']['canonical_state'] == 'PENDING'
          assert catalog['tasks']['B006']['prerequisites'] == ['B005']
          catalog['tasks']['B005']['canonical_state'] = 'COMPLETE_CANONICAL'
          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          tasks = tasks_path.read_text(encoding='utf-8')
          old_start = '- [ ] **B005 Run mission-aligned compact backbone metadata rescan.**'
          new_start = '- [x] **B005 Run mission-aligned compact backbone metadata rescan.**'
          assert tasks.count(old_start) == 1
          assert tasks.count(new_start) == 0
          tasks = tasks.replace(old_start, new_start, 1)
          b006_marker = '\n\n- [ ] **B006 Create/reconcile candidate records for newly relevant code-specialized models.**'
          assert tasks.count(b006_marker) == 1
          before_b006, after_b006 = tasks.split(b006_marker, 1)
          canonical_line = '  Canonical implementation: PR #54 / final head `0a7ee7e392d827fb08c8cc9f3b2d9ec45c8cca1a` / merge `1e096f4d1f270b2803da6a6306e9e7f0cf8fb81b`.\n'
          assert canonical_line.strip() not in before_b006
          before_b006 = before_b006.rstrip() + '\n' + canonical_line.rstrip() + '\n'
          tasks_path.write_text(before_b006 + b006_marker + after_b006, encoding='utf-8')

          evidence = evidence_path.read_text(encoding='utf-8')
          assert '**State:** IMPLEMENTATION_COMPLETE / NOT_COMPLETE_CANONICAL' in evidence
          evidence = evidence.replace(
              '**State:** IMPLEMENTATION_COMPLETE / NOT_COMPLETE_CANONICAL',
              '**State:** COMPLETE_CANONICAL',
              1,
          )
          assert '## Closeout state\n' in evidence
          prefix = evidence.split('## Closeout state\n', 1)[0]
          closeout = '''## Closeout state

B005 is prospectively marked `COMPLETE_CANONICAL` by this closeout branch only after the metadata-only implementation was independently reviewed, merged, and verified on canonical `main`. The marker becomes canonical only if this exact closeout head is qualified, reviewed, and merged with an expected-head guard. Post-closeout verification must then prove B005 terminal, B006 `eligible=true`, canonical drift clean, and all frozen gates green before B006 material mutation begins.

### Canonical implementation identity

```text
HISTORICAL_IMPLEMENTATION_PR = #41 / retained as non-canonical historical evidence
REFRESH_ENTRY_CANONICAL_MAIN = 986b174b2bf79ce53a3e67b9b02c55cbe6981303
REFRESH_ENTRY_GATE_RUN = 33103275261
REFRESH_ENTRY_GATE_JOB = 98626338825
FINAL_IMPLEMENTATION_PR = #54
FINAL_IMPLEMENTATION_HEAD = 0a7ee7e392d827fb08c8cc9f3b2d9ec45c8cca1a
IMPLEMENTATION_MERGE = 1e096f4d1f270b2803da6a6306e9e7f0cf8fb81b
```

### Exact qualification and review evidence

