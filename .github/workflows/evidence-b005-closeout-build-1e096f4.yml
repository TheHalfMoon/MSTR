```

```text
B005_IMPLEMENTATION = MERGED_AND_POST_MERGE_VERIFIED
B005_CLOSEOUT_STATE = PROSPECTIVE_COMPLETE_CANONICAL_UNTIL_CLOSEOUT_MERGE
B005_COMPLETE_CANONICAL = ONLY_AFTER_CLOSEOUT_MERGE_AND_POST_CLOSEOUT_PROOF
B006_STATE = PENDING
NEXT_DEPENDENT_TASK = B006_AFTER_PRODUCTION_ELIGIBLE_TRUE
```
'''
          evidence_path.write_text(prefix + closeout, encoding='utf-8')
          print('B005_CLOSEOUT_TRANSITION=APPLIED')
          PY

      - name: Verify bounded closeout scope and consistency
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          expected = {
              'configs/task-gate/mstr-000b.json',
              'specs/002-code-model-supremacy-foundation/tasks.md',
              'evidence/mstr-000b/B005-code-backbone-rescan.md',
          }
          changed = set(subprocess.run(['git','diff','--name-only'], check=True, capture_output=True, text=True).stdout.splitlines())
          assert changed == expected, (changed, expected)
          c = json.loads(Path('configs/task-gate/mstr-000b.json').read_text(encoding='utf-8'))
          t = Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text(encoding='utf-8')
          e = Path('evidence/mstr-000b/B005-code-backbone-rescan.md').read_text(encoding='utf-8')
          assert c['tasks']['B005']['canonical_state'] == 'COMPLETE_CANONICAL'
          assert c['tasks']['B006']['canonical_state'] == 'PENDING'
          assert c['tasks']['B006']['prerequisites'] == ['B005']
          assert '- [x] **B005 Run mission-aligned compact backbone metadata rescan.**' in t
          assert '- [ ] **B006 Create/reconcile candidate records for newly relevant code-specialized models.**' in t
          assert '**State:** COMPLETE_CANONICAL' in e
          assert 'B005_CLOSEOUT_STATE = PROSPECTIVE_COMPLETE_CANONICAL_UNTIL_CLOSEOUT_MERGE' in e
          assert 'B006_STATE = PENDING' in e
          print('B005_CLOSEOUT_SCOPE=PASS')
          print('B005_CLOSEOUT_CONSISTENCY=PASS')
          PY

      - name: Commit closeout candidate locally
        id: commit
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/task-gate/mstr-000b.json specs/002-code-model-supremacy-foundation/tasks.md evidence/mstr-000b/B005-code-backbone-rescan.md
          git commit -m "docs(mstr-000b): canonicalize B005 closeout"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET"
          test -z "$(git status --short)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Frozen gate - pytest
        working-directory: target
        run: pytest -q

      - name: Frozen gate - Ruff
        working-directory: target
        run: ruff check src tests

      - name: Frozen gate - mypy
        working-directory: target
        run: mypy

      - name: Frozen gate - offline validate
        working-directory: target
        run: python -m mstr_qualify validate

      - name: Validate closeout candidate terminal consistency
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('configs/task-gate/mstr-000b.json').read_text(encoding='utf-8'))
          t = Path('specs/002-code-model-supremacy-foundation/tasks.md').read_text(encoding='utf-8')
          assert c['tasks']['B005']['canonical_state'] == 'COMPLETE_CANONICAL'
          assert '- [x] **B005 Run mission-aligned compact backbone metadata rescan.**' in t
          assert c['tasks']['B006']['canonical_state'] == 'PENDING'
          assert '- [ ] **B006 Create/reconcile candidate records for newly relevant code-specialized models.**' in t
          print('B005_CLOSEOUT_TERMINAL_CONSISTENCY=PASS')
          PY

      - name: Guarded push exact closeout candidate
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.commit.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "$candidate"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET"
          test -z "$(git status --short)"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "B005_CLOSEOUT_CANDIDATE=$candidate"
