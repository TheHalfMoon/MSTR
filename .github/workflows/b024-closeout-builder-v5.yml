name: Build guarded B024 canonical closeout v5

on:
  push:
    branches: [evidence/b024-closeout-builder-138a2c2]

permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  BASE_SHA: 138a2c2c1d86c050db79e3190ab24d7c1052fe44
  TARGET_BRANCH: docs/000b-b024-canonicalize
  POSTMERGE_RUN: '33560182387'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify canonical entry and prepare formatting-repaired builder
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/heads/$TARGET_BRANCH)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${POSTMERGE_RUN}" > /tmp/postmerge.json
          jq -e '.status == "completed" and .conclusion == "success" and (.name | contains("Post-merge verification for B024"))' /tmp/postmerge.json
          git show "${GITHUB_SHA}:.github/scripts/b024_closeout_builder.py" > /tmp/builder.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/builder.py')
          t = p.read_text(encoding='utf-8')
          replacements = {
              'path.write_text(text.rstrip() + closeout + "\\n", encoding="utf-8")':
                  'path.write_text(text.rstrip() + closeout.rstrip() + "\\n", encoding="utf-8")',
              '    assert all(item["observed_state"] == "COMPLETE_CANONICAL" for item in result["prerequisite_results"])':
                  '    assert all(\n        item["observed_state"] == "COMPLETE_CANONICAL"\n        for item in result["prerequisite_results"]\n    )',
          }
          for old, new in replacements.items():
              if t.count(old) != 1:
                  raise SystemExit(f'expected one builder replacement, found {t.count(old)}: {old}')
              t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')
          PY
          git checkout --detach "$BASE_SHA"

      - name: Build and seal exact five-file candidate
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/builder.py
          printf '%s\n' configs/task-gate/mstr-000b.json evidence/mstr-000b/B024-test-curriculum.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check
          test -z "$(git diff --name-only -- src schemas specs/002-code-model-supremacy-foundation/contracts docs/data)"
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add configs/task-gate/mstr-000b.json evidence/mstr-000b/B024-test-curriculum.md specs/002-code-model-supremacy-foundation/tasks.md tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          git commit -m 'docs(mstr-000b): canonicalize B024 test-generation closeout'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git diff-tree --no-commit-id --name-only -r HEAD | sort > /tmp/committed
          diff -u /tmp/expected /tmp/committed
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "B024_CLOSEOUT_LOCAL_CANDIDATE=$candidate"

      - name: Install development gates
        run: python -m pip install -e '.[dev]'

      - name: Prove closeout machine state
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$CANDIDATE_SHA"
          git update-ref refs/remotes/origin/main "$CANDIDATE_SHA"
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          set +e
          mstr-qualify task eligible B024 > /tmp/b024.json; b024_rc=$?
          mstr-qualify task eligible B011 > /tmp/b011.json; b011_rc=$?
          set -e
          test "$b024_rc" -eq 1
          test "$b011_rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "COMPLETE_CANONICAL" and (.reasons | index("task.already_terminal")) != null' /tmp/b024.json
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json
          mstr-qualify task eligible B026 > /tmp/b026.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true and (.reasons | length) == 0' /tmp/b026.json
          jq -e '[.prerequisite_results[] | select((.task_id == "B022" or .task_id == "B024" or .task_id == "B025") and .observed_state == "COMPLETE_CANONICAL" and .evidence_present == true and .satisfied == true)] | length == 3' /tmp/b026.json
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"

      - name: Focused closeout tests
        run: python -m pytest tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py -q
      - name: Offline validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src

      - name: Re-prove provenance and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          grep -F '**State:** COMPLETE_CANONICAL' evidence/mstr-000b/B024-test-curriculum.md
          grep -F '**Implementation PR:** #135' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'ENTRY_GATE_TASK = B024' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'post-merge implementation verification: run `33560182387` — SUCCESS' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'CodeRabbit comment `5498547347`' evidence/mstr-000b/B024-test-curriculum.md
          grep -F -- '- [x] **B024 Freeze test-generation curriculum and acceptance semantics.**' specs/002-code-model-supremacy-foundation/tasks.md
          for marker in 'MODEL_WEIGHT_ACCESS = NONE' 'MODEL_EXECUTION = NONE' 'TEST_GENERATION_EXECUTION = NONE' 'VERIFIER_EXECUTION = NONE' 'PAID_COMPUTE = NONE' 'WEIGHT_CHANGING_TRAINING = NONE' 'PRODUCTION_RELEASE = NONE'; do grep -F "$marker" evidence/mstr-000b/B024-test-curriculum.md; done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"

      - name: Publish exact qualified closeout commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/heads/$TARGET_BRANCH)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$CANDIDATE_SHA"
          echo "B024_CLOSEOUT_HEAD=$CANDIDATE_SHA"
