name: Build cross-workstream binding repair v6

on:
  push:
    branches:
      - fix/000b-cross-workstream-prerequisite-bindings

permissions:
  contents: write

env:
  EXPECTED_BASE: db12d1467bb81185a9affffb4d470626ceceddfa
  EXPECTED_PARENT: 96ff8fd8ac27bc54a5dca74348ef781fd1369e85
  BRANCH: fix/000b-cross-workstream-prerequisite-bindings

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable base and negative-evidence history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-list --count "$EXPECTED_BASE"..HEAD)" -eq 6
      - name: Generate bounded repair with exact identity hardening
        shell: bash
        env:
          IDENTITY_TEST_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import textwrap

          workflow = Path('.github/workflows/build-cross-workstream-binding-repair-v4.yml')
          source = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          script = script.split("\ntests = Path('tests/contract/test_task_gate.py')", 1)[0]
          exec(compile(script, '<bounded-generator-v6>', 'exec'), {'__name__': '__main__'})

          tests = Path('tests/contract/test_task_gate.py')
          addition = base64.b64decode(__import__('os').environ['IDENTITY_TEST_B64']).decode('utf-8')
          current = tests.read_text(encoding='utf-8')
          if 'test_external_prerequisite_mismatched_evidence_identity_fails_closed' in current:
              raise SystemExit('identity mismatch regression already present')
          tests.write_text(current + addition, encoding='utf-8')

          for path in (
              '.github/workflows/build-cross-workstream-binding-repair.yml',
              '.github/workflows/build-cross-workstream-binding-repair-v2.yml',
              '.github/workflows/build-cross-workstream-binding-repair-v3.yml',
              '.github/workflows/build-cross-workstream-binding-repair-v4.yml',
              '.github/workflows/build-cross-workstream-binding-repair-v5.yml',
              '.github/workflows/build-cross-workstream-binding-repair-v6.yml',
          ):
              Path(path).unlink(missing_ok=True)
          PY
      - name: Run complete frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          git diff --check "$EXPECTED_BASE"
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          python -m mstr_qualify validate
          pytest -q
          ruff check src tests
          mypy
      - name: Create clean prospective repair commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git commit -m 'fix(task-gate): bind cross-workstream prerequisites'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --name-only "$EXPECTED_BASE"..HEAD | tee /tmp/final-files
          test "$(wc -l < /tmp/final-files)" -eq 4
          grep -Fx 'configs/task-gate/mstr-000b.json' /tmp/final-files
          grep -Fx 'evidence/mstr-000b/B023-cross-workstream-binding-reconciliation.md' /tmp/final-files
          grep -Fx 'src/mstr_qualify/task_gate.py' /tmp/final-files
          grep -Fx 'tests/contract/test_task_gate.py' /tmp/final-files
      - name: Prove prospective drift and B023 machine eligibility
        shell: bash
        run: |
          set -euo pipefail
          FINAL_HEAD=$(git rev-parse HEAD)
          git update-ref refs/heads/main "$FINAL_HEAD"
          git update-ref refs/remotes/origin/main "$FINAL_HEAD"
          python -m mstr_qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0 and .tasks_checked == 34' /tmp/drift.json
          cat /tmp/drift.json
          mstr-qualify task eligible B023 > /tmp/b023.json
          jq -e '.task_id == "B023" and .eligible == true and (.reasons | length) == 0' /tmp/b023.json
          jq -e '.semantic_checks.prerequisite_set_complete == true and .semantic_checks.prerequisite_states_satisfied == true' /tmp/b023.json
          jq -e '[.prerequisite_results[] | select(.task_id == "A006" or .task_id == "A014") | .satisfied] == [true, true]' /tmp/b023.json
          cat /tmp/b023.json
      - name: Push exact repair after live-main recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          FINAL_HEAD=$(git rev-parse HEAD)
          git push origin HEAD:"$BRANCH"
          echo "FINAL_REPAIR_HEAD=$FINAL_HEAD"
