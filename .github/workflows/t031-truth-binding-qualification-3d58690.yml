name: T031 hash-bound replay truth qualification 3d58690

on:
  push:
    branches:
      - evidence/t031-truth-binding-qualification-3d58690

permissions:
  contents: read

jobs:
  exact_identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3d586900e241dfa5f15d990b285e7584726007d2
          fetch-depth: 0
          persist-credentials: false
      - name: Exact base head tree and file-scope gates
        shell: bash
        run: |
          set -euo pipefail
          BASE=a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          HEAD=3d586900e241dfa5f15d990b285e7584726007d2
          TREE=49faa9c378b39c59f691dc24b1f391bd5bb01a23
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/fix/t031-historical-59wheel-binding-truth | awk '{print $1}')" = "$HEAD"
          git diff --check "$BASE".."$HEAD"
          cat > /tmp/expected <<'EOF'
          artifacts/manifests/T031-executor-toolchain-binding.json
          artifacts/manifests/T031-t029-historical-producer-replay-overlay.json
          artifacts/manifests/T031-t029-historical-pypi-packages-01.json
          artifacts/manifests/T031-t029-historical-pypi-packages-02.json
          artifacts/manifests/T031-t029-historical-pypi-packages-03.json
          colab/mstr_t031_execute.py
          colab/mstr_t031_governance.py
          colab/mstr_t031_historical_replay.py
          tests/contract/test_t031_executor_binding.py
          EOF
          sort /tmp/expected -o /tmp/expected
          git diff --name-only "$BASE".."$HEAD" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

  binding_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3d586900e241dfa5f15d990b285e7584726007d2
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable binding and bounded reconstruction truth
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/colab"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from mstr_t031_historical_replay import _load_historical_packages
          root=Path('.')
          b=json.loads((root/'artifacts/manifests/T031-executor-toolchain-binding.json').read_text())
          pairs={
            'toolchain_lock_sha256':'artifacts/manifests/T031-executor-toolchain-lock.json',
            'producer_replay_overlay_sha256':'artifacts/manifests/T031-t029-historical-producer-replay-overlay.json',
            'toolchain_helper_sha256':'colab/mstr_executor_toolchain.py',
            'producer_replay_helper_sha256':'colab/mstr_t031_replay.py',
            'historical_replay_helper_sha256':'colab/mstr_t031_historical_replay.py',
            'governance_script_sha256':'colab/mstr_t031_governance.py',
            'source_script_sha256':'colab/mstr_t031_source.py',
            'artifact_script_sha256':'colab/mstr_t031_artifacts.py',
            'measurement_script_sha256':'colab/mstr_t031_measure.py',
            'executor_script_sha256':'colab/mstr_t031_execute.py',
            'workflow_sha256':'.github/workflows/t031-measure.yml',
          }
          for k,p in pairs.items():
              actual=hashlib.sha256((root/p).read_bytes()).hexdigest()
              assert b[k]==actual,(k,b[k],actual)
          assert b['source_main']=='a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          assert b['producer_replay']['package_count']==59
          assert b['producer_replay']['historical_transitive_identity_claim'] is False
          assert b['producer_replay']['reconstruction_semantics']=='HASH_BOUND_PRE_CUTOFF_RECONSTRUCTION_NOT_HISTORICAL_TRANSITIVE_IDENTITY_PROOF'
          assert b['producer_replay']['acceptance_gate']=='EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH'
          overlay_path=root/b['producer_replay_overlay_path']
          o=json.loads(overlay_path.read_text())
          assert o['historical_t029_observation']['package_versions_recorded_by_t029'] is False
          assert o['reconstruction_basis']['historical_transitive_identity_claim'] is False
          assert o['reconstruction_basis']['equivalence_gate']=='EXACT_T029_F16_AND_Q4_SHA256_MUST_MATCH'
          assert o['historical_smoke_evidence']['run_id']==34042093348
          assert o['historical_smoke_evidence']['model_access']=='NONE'
          packages,shards=_load_historical_packages(overlay=o,overlay_path=overlay_path)
          assert len(packages)==59 and len(shards)==3
          e=b['execution_boundary']
          for k in ['authority_transfer','b012_execution','t032_execution','t033_execution','t034_admission_decision','training']:
              assert e[k] is False,k
          assert e['paid_cost_usd']==0.0 and e['git_model_binaries']==0 and e['founder_machine_model_binaries']==0
          print('T031_HASH_BOUND_RECONSTRUCTION_BINDING=PASS')
          print('MODEL_ACCESS=NONE')
          print('TRAINING=false')
          print('PAID_COST_USD=0.0')
          PY
          python -m py_compile colab/mstr_executor_toolchain.py colab/mstr_t031_replay.py colab/mstr_t031_historical_replay.py colab/mstr_t031_artifacts.py colab/mstr_t031_execute.py colab/mstr_t031_governance.py colab/mstr_t031_measure.py colab/mstr_t031_source.py tests/contract/test_t031_executor_binding.py

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3d586900e241dfa5f15d990b285e7584726007d2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Frozen repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/contract/test_t031_executor_binding.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src/mstr_qualify
          test -z "$(git status --porcelain)"

  final_qualification:
    needs: [exact_identity, binding_contract, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reverify exact live refs
        shell: bash
        run: |
          set -euo pipefail
          BASE=a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          HEAD=3d586900e241dfa5f15d990b285e7584726007d2
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/fix/t031-historical-59wheel-binding-truth | awk '{print $1}')" = "$HEAD"
          echo 'T031_HASH_BOUND_REPLAY_TRUTH_QUALIFICATION=PASS'
          echo "BASE_SHA=$BASE"
          echo "TARGET_HEAD=$HEAD"
          echo 'TARGET_TREE=49faa9c378b39c59f691dc24b1f391bd5bb01a23'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
