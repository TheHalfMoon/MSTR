name: Build A017 canonical closeout v3

on:
  push:
    branches:
      - automation/a017-closeout-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact two-file A017 closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git fetch origin closeout/000a-a017 --quiet
          git switch -C closeout/000a-a017 origin/closeout/000a-a017
          echo '' | base64 -d > /tmp/build_a017_closeout.py
          python /tmp/build_a017_closeout.py
          python -c "from pathlib import Path; p=Path('specs/001-agent-harness-verified-loop-foundation/tasks.md'); s=p.read_text(encoding='utf-8'); old='- [x] **A017 Freeze failure taxonomy and training trajectory contract.**  \\n'; new='- [x] **A017 Freeze failure taxonomy and training trajectory contract.**\\n'; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          expected="$(printf '%s\n' 'evidence/mstr-000a/A017-trajectory-contract.md' 'specs/001-agent-harness-verified-loop-foundation/tasks.md')"
          actual="$(git diff --name-only)"
          test "$actual" = "$expected"
          git diff --check
          grep -F '**State:** COMPLETE_CANONICAL' evidence/mstr-000a/A017-trajectory-contract.md
          grep -F -- '- [x] **A017 Freeze failure taxonomy and training trajectory contract.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          grep -F -- '- [ ] **A018 Implement trajectory recorder/replay/admission.**' specs/001-agent-harness-verified-loop-foundation/tasks.md
          git add evidence/mstr-000a/A017-trajectory-contract.md specs/001-agent-harness-verified-loop-foundation/tasks.md
          git commit -m 'docs(mstr-000a): close out A017'
          git push origin HEAD:closeout/000a-a017
