name: PR185 B012 Qwen recovery activation independent review

on:
  push:
    branches:
      - evidence/pr185-b012-qwen-recovery-activation-independent-review-180b928

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  PR_NUMBER: "185"
  BASE_SHA: 31549eeb78f2b3346c0915519cf5f4899ab47773
  SUBJECT_BRANCH: fix/b012-qwen-raw-code-recovery-activation
  SUBJECT_SHA: 180b928e56261dbc3e1bd06597e7c81fa32694ee
  SUBJECT_TREE: 046156f3ff372f541b4a16618c212490027e57c4
  QUALIFICATION_RUN: "34162195621"
  QUALIFICATION_HEAD: 05d24e4030143b11f017bf6e5866c2a781c0003b
  QUALIFICATION_BRANCH: evidence/pr185-b012-qwen-recovery-activation-qualification-180b928
  ACTIVATED_MANIFEST_SHA256: 6b9536e16c52fefe03ee2844c68008f68e36cdd91ae45987086e1acda0259d70
  ACTIVE_WORKFLOW_SHA256: 7643ef2b87c32901e5cbdf384001a341cfd061f4a33437a4fb7556dadc6c33a0

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout independent review branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"

      - name: Verify live PR and qualification provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH" "$QUALIFICATION_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "$SUBJECT_SHA^")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          [[ "$(git rev-parse "origin/$QUALIFICATION_BRANCH")" == "$QUALIFICATION_HEAD" ]]
          [[ "$(git rev-parse "$QUALIFICATION_HEAD^")" == "$SUBJECT_SHA" ]]
          python - <<'PY'
          import json
          import os
          import urllib.request
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mstr-pr185-independent-review',
          }
          def get(path: str):
              req = urllib.request.Request('https://api.github.com/repos/TheHalfMoon/MSTR' + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          run = get('/actions/runs/' + os.environ['QUALIFICATION_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['QUALIFICATION_HEAD']
          assert run['head_branch'] == os.environ['QUALIFICATION_BRANCH']
          pr = get('/pulls/' + os.environ['PR_NUMBER'])
          assert pr['state'] == 'open' and pr['draft'] is False
          assert pr['base']['sha'] == os.environ['BASE_SHA']
          assert pr['head']['sha'] == os.environ['SUBJECT_SHA']
          assert pr['changed_files'] == 5
          print('LIVE_PR_AND_QUALIFICATION_PROVENANCE=PASS')
          PY

      - name: Checkout exact subject for substantive review
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_SHA"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          python -m pip install -e '.[dev]'

      - name: Review containment and activation semantics
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            ".github/workflows/b012-qwen-raw-code-recovery.yml"
            "artifacts/manifests/B012-executor-toolchain-binding.json"
            "artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json"
            "evidence/B012-qwen-raw-code-recovery-activation.md"
            "tests/contract/test_b012_qwen_raw_code_recovery.py"
          )
          [[ "${#changed[@]}" -eq 5 ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          def sha(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          manifest_path = 'artifacts/manifests/B012-qwen-raw-code-runner-shutdown-recovery.json'
          binding_path = 'artifacts/manifests/B012-executor-toolchain-binding.json'
          incident_path = 'artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-run-34155931982.json'
          runner_path = 'colab/mstr_b012_qwen_raw_code_recovery.py'
          spec_path = 'configs/workflows/b012-qwen-raw-code-recovery.yml'
          active_path = '.github/workflows/b012-qwen-raw-code-recovery.yml'
          authority_path = 'artifacts/authorities/B012_FOUNDER_AUTHORITY_FOR_EQUIVALENT_QUALIFICATION.json'
          manifest = json.loads(Path(manifest_path).read_text(encoding='utf-8'))
          binding = json.loads(Path(binding_path).read_text(encoding='utf-8'))
          authority = json.loads(Path(authority_path).read_text(encoding='utf-8'))
          incident = json.loads(Path(incident_path).read_text(encoding='utf-8'))
          assert manifest['status'] == 'ACTIVATED_CANONICAL'
          assert sha(manifest_path) == os.environ['ACTIVATED_MANIFEST_SHA256']
          assert sha(active_path) == os.environ['ACTIVE_WORKFLOW_SHA256']
          assert Path(active_path).read_bytes() == Path(spec_path).read_bytes()
          assert manifest['candidate_id'] == 'qwen3.5-0.8b-control'
          assert manifest['prior_run_id'] == 34155931982
          assert manifest['recovery_script_sha256'] == sha(runner_path)
          assert manifest['recovery_workflow_sha256'] == sha(active_path)
          assert manifest['incident_evidence_sha256'] == sha(incident_path)
          assert binding['qwen_raw_code_recovery_manifest_sha256'] == sha(manifest_path)
          activation = binding['qwen_raw_code_recovery_activation']
          assert activation['recovery_manifest_sha256'] == sha(manifest_path)
          assert activation['active_workflow_sha256'] == sha(active_path)
          assert activation['retry_authority_created'] is False
          assert activation['external_dispatch_authority_created'] is False
          assert activation['candidate_expansion'] is False
          assert activation['revision_or_file_expansion'] is False
          assert activation['model_access'] == 'NONE'
          assert activation['training'] is False
          assert activation['paid_cost_usd'] == 0.0
          assert authority['status'] == 'AUTHORIZED_CANONICAL'
          assert authority['scope']['candidate_ids'] == ['mellum-4b', 'qwen3.5-0.8b-control']
          assert incident['raw_code_result'] == 'NONE'
          assert incident['model_quality_verdict'] == 'NONE'
          assert incident['candidate_admission_decision'] == 'NONE'
          scope = manifest['recovery_scope']
          assert scope['rerun_prefill'] is False
          assert scope['rerun_decode'] is False
          assert scope['run_raw_code_proxy'] is True
          assert scope['durable_outputs'] == ['JSON']
          for key in ('candidate_expansion', 'revision_or_file_expansion', 'training', 'paid_compute', 'paid_model_api', 'git_model_binaries', 'founder_machine_model_binaries'):
              assert scope[key] is False
          print('ACTIVATION_SEMANTICS_REVIEW=PASS')
          PY

      - name: Review exact dispatch and fail-closed workflow boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/b012-qwen-raw-code-recovery.yml').read_text(encoding='utf-8')
          runner = Path('colab/mstr_b012_qwen_raw_code_recovery.py').read_text(encoding='utf-8')
          assert "github.event.issue.number == 162" in workflow
          assert "github.event.comment.user.login == 'TheHalfMoon'" in workflow
          assert "github.event.comment.author_association == 'OWNER'" in workflow
          assert "github.event.comment.body == 'B012_RECOVER_RAW_CODE qwen3.5-0.8b-control 34155931982'" in workflow
          assert 'runs-on: ubuntu-24.04' in workflow
          assert 'timeout-minutes: 45' in workflow
          assert 'cancel-in-progress: false' in workflow
          assert '.gguf' not in workflow
          assert '.safetensors' not in workflow
          assert 'CANDIDATE_ID = "qwen3.5-0.8b-control"' in runner
          assert 'PRIOR_RUN_ID = 34155931982' in runner
          assert 'ACTIVATED_CANONICAL' in runner
          assert 'qwen_raw_code_recovery_manifest_sha256' in runner
          assert 'run_raw_code_proxy' in runner
          assert 'llama-bench' not in runner
          assert '_stage_prefill' not in runner
          assert '_stage_decode' not in runner
          assert 'B012_RAW_CODE_RECOVERY_FAILED_CLOSED' in runner
          print('FAIL_CLOSED_DISPATCH_BOUNDARY_REVIEW=PASS')
          PY

      - name: Re-run focused and full quality independently
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_stage_checkpoint_topology.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_runner_shutdown_evidence.py \
            tests/contract/test_b012_timeout_budget.py \
            tests/contract/test_b012_authority.py
          python -m py_compile colab/mstr_b012_qwen_raw_code_recovery.py tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check \
            colab/mstr_b012_qwen_raw_code_recovery.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m mypy src/mstr_qualify

      - name: Final independent live-ref guard
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$SUBJECT_TREE" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote origin "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          echo 'PR185_INDEPENDENT_REVIEW=PASS'
          echo 'MATERIAL_FINDINGS=0'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
