name: PR175 B012 reconciliation qualification c705d36

on:
  push:
    branches:
      - evidence/pr175-b012-reconciliation-qualification-c705d36

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: colab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c705d36defe3fd96cd6d9a6369b4096ee08acb75
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Verify exact reconciliation topology
        shell: bash
        run: |
          set -euo pipefail
          BASE=a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          HEAD=c705d36defe3fd96cd6d9a6369b4096ee08acb75
          TREE=18366443d2fee5435e9ffa4ce1a432d46a9087c5
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/governance/pr174-b012-merge-race-reconciliation | awk '{print $1}')" = "$HEAD"
          test "$(git diff --name-only "$BASE".."$HEAD")" = 'evidence/B012-pr174-merge-race-reconciliation.md'
          git diff --check "$BASE".."$HEAD"
      - name: Verify reconciliation statements against GitHub truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          headers = {
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(url: str):
              req = urllib.request.Request(url, headers=headers)
              return json.load(urllib.request.urlopen(req, timeout=30))

          text = Path('evidence/B012-pr174-merge-race-reconciliation.md').read_text(encoding='utf-8')
          required = [
              'PR174_MANDATORY_PREMERGE_FINAL_GUARD = FAILURE',
              'RETROACTIVE_PREMERGE_PASS = PROHIBITED',
              '34045379758', '34045539668', '34045842975', '34045909273', '34046087930',
              'a2b2788dd5a8a8d5f301359586f6b2019615b4a9',
              '6290127080459879aa494efdb91aa44bc629a9fc',
              '2013b367c3163ab37170b28f611999b54e2dad1f',
              '890c9d1536ae4046a827789530c186dd02afca80bae8930ef22c2cb6e9ddcf26',
              'This artifact creates no new Founder authority',
          ]
          for marker in required:
              assert marker in text, marker

          pr = get('https://api.github.com/repos/TheHalfMoon/MSTR/pulls/174')
          assert pr['merged'] is True
          assert pr['merged_at'] == '2026-09-06T16:34:22Z'
          assert pr['merge_commit_sha'] == 'a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          assert pr['head']['sha'] == '6290127080459879aa494efdb91aa44bc629a9fc'
          assert pr['base']['sha'] == '4d9e423f7fa2aa6d4f706d5c9ad61dafb24b2513'

          mandatory = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34045842975')
          assert mandatory['conclusion'] == 'failure'
          jobs = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34045842975/jobs?per_page=100')['jobs']
          by_name = {job['name']: job for job in jobs}
          assert by_name['canonical_eligibility']['conclusion'] == 'success'
          assert by_name['exact_head_gates']['conclusion'] == 'success'
          assert by_name['final_premerge']['conclusion'] == 'failure'

          postmerge = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34045909273')
          assert postmerge['conclusion'] == 'success'
          diagnostic = get('https://api.github.com/repos/TheHalfMoon/MSTR/actions/runs/34046087930')
          assert diagnostic['conclusion'] == 'failure'
          print('PR175_RECONCILIATION_TRUTH_BINDING=PASS')
          PY
      - name: Run exact-head frozen quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify
          git diff --exit-code
          git diff --cached --exit-code
      - name: Verify B012 eligibility on exact canonical base
        shell: bash
        run: |
          set -euo pipefail
          git branch --force main a2b2788dd5a8a8d5f301359586f6b2019615b4a9
          python -m mstr_qualify task eligible B012
      - name: Final exact refs guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | awk '{print $1}')" = 'a2b2788dd5a8a8d5f301359586f6b2019615b4a9'
          test "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/governance/pr174-b012-merge-race-reconciliation | awk '{print $1}')" = 'c705d36defe3fd96cd6d9a6369b4096ee08acb75'
          echo 'PR175_B012_RECONCILIATION_QUALIFICATION=PASS'
          echo 'HISTORICAL_PR174_FINAL_PREMERGE=FAILURE'
          echo 'RETROACTIVE_PREMERGE_PASS=false'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
