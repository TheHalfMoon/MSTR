name: Qualify B024 stage-eligibility repaired exact head

on:
  push:
    branches:
      - evidence/b024-qualify-2c57b84

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  BASE_SHA: 1ffa71c94bda161ec7be7784de3a6a4be81570ad
  HEAD_SHA: 2c57b8445c76b2c0b3efc59c4de5eda13bf3df53
  HEAD_TREE: ced544c457f00748e17e03f1010270c9cc272c13
  FINAL_REPAIR_RUN: '33541295614'
  STAGE_REVIEW_ID: '5081306167'

jobs:
  identity_scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Verify exact identity, provenance, and bounded PR scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git rev-parse HEAD^)" = "1b6f4180ef22c7c2124e6c392bf846a5e8ca2393"
          test "$(git rev-parse HEAD^^)" = "639c263b2c349f21dddc2539d46748f67e544a0e"
          test "$(git rev-parse HEAD^^^)" = "f052704cdb89b0e8d99135aa8d844c18a6b7a698"
          test "$(git rev-parse HEAD^^^^)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/feat/000b-b024-test-generation-curriculum | cut -f1)" = "$HEAD_SHA"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/135" > /tmp/pr.json
          jq -e '.state == "open" and .draft == false and .base.sha == env.BASE_SHA and .head.sha == env.HEAD_SHA and .commits == 4 and .changed_files == 11' /tmp/pr.json

          printf '%s\n' \
            docs/data/TEST_GENERATION_CURRICULUM.md \
            evidence/mstr-000b/B024-test-curriculum.md \
            schemas/mstr-test-generation-example-v0.schema.json \
            specs/002-code-model-supremacy-foundation/contracts/mstr-test-generation-example-v0.schema.json \
            src/mstr_qualify/cli.py \
            src/mstr_qualify/schemas.py \
            tests/contract/test_schemas.py \
            tests/contract/test_test_generation_example_contract.py \
            tests/fixtures/schemas/invalid/mstr-test-generation-example-v0.json \
            tests/fixtures/schemas/valid/mstr-test-generation-example-v0.json \
            tests/integration/test_cli_offline.py | sort > /tmp/expected-files
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check "$BASE_SHA...$HEAD_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- specs/002-code-model-supremacy-foundation/tasks.md configs/task-gate/mstr-000b.json)"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FINAL_REPAIR_RUN}" > /tmp/repair.json
          jq -e '.status == "completed" and .conclusion == "success"' /tmp/repair.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/135/reviews/${STAGE_REVIEW_ID}" > /tmp/review.json
          jq -e '.user.login == "chatgpt-codex-connector[bot]" and .commit_id == "639c263b2c349f21dddc2539d46748f67e544a0e"' /tmp/review.json

  canonical_machine_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Re-prove exact-main task ordering and authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          git update-ref refs/heads/main "$BASE_SHA"
          git update-ref refs/remotes/origin/main "$BASE_SHA"
          python -m pip install -e '.[dev]'
          mstr-qualify task drift > /tmp/drift.json
          jq -e '.status == "clean" and (.findings | length) == 0' /tmp/drift.json
          mstr-qualify task eligible B024 > /tmp/b024.json
          jq -e '.eligible == true and .state_consistency_result.observed_state == "PENDING" and .authority_result.required == false and .authority_result.satisfied == true' /tmp/b024.json
          jq -e '[.prerequisite_results[] | select(.task_id == "B023" and .satisfied == true)] | length == 1' /tmp/b024.json
          set +e
          mstr-qualify task eligible B026 > /tmp/b026.json
          rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.eligible == false and ([.prerequisite_results[] | select(.task_id == "B024" and .satisfied == false)] | length == 1)' /tmp/b026.json
          set +e
          mstr-qualify task eligible B011 > /tmp/b011.json
          rc=$?
          set -e
          test "$rc" -eq 1
          jq -e '.eligible == false and .state_consistency_result.observed_state == "BLOCKED" and .authority_result.required == true and .authority_result.satisfied == false' /tmp/b011.json

  candidate_quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development gates
        run: python -m pip install -e '.[dev]'
      - name: Focused B024 contract and CLI tests
        run: |
          python -m pytest \
            tests/contract/test_test_generation_example_contract.py \
            tests/contract/test_schemas.py \
            tests/integration/test_cli_offline.py \
            tests/contract/test_task_gate.py \
            -q
      - name: Offline schema validation
        run: python -m mstr_qualify validate
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Strict mypy
        run: python -m mypy src
      - name: Re-prove all five review remediations and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          cmp schemas/mstr-test-generation-example-v0.schema.json \
              specs/002-code-model-supremacy-foundation/contracts/mstr-test-generation-example-v0.schema.json
          grep -F 'ADMIT_REQUIRES_COMPLETE_PROVENANCE = true' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'GENERATED_SOURCE_REQUIRES_GENERATOR_IDENTITY = true' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'VERIFIER_HEALTH_BINDING_TO_TASK_AND_EXECUTED_MANIFEST = required' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'ADEQUATE_MUTATION_REQUIRES_NONZERO_EVIDENCE = true' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'FAIL_BEFORE_PASS_AFTER_DISTINCT_BASE_FIX_REVISIONS = required' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'VERIFIER_HEALTH_STAGE_IDENTITY = required' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'CLEAN_POSITIVE_STAGE_ELIGIBILITY = CLEAN_POSITIVE_ELIGIBLE' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'MODEL_EXECUTION = NONE' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'TEST_GENERATION_EXECUTION = NONE' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'PAID_COMPUTE = NONE' evidence/mstr-000b/B024-test-curriculum.md
          grep -F 'WEIGHT_CHANGING_TRAINING = NONE' evidence/mstr-000b/B024-test-curriculum.md
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/feat/000b-b024-test-generation-curriculum | cut -f1)" = "$HEAD_SHA"

  complete:
    needs: [identity_scope, canonical_machine_gate, candidate_quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Final immutable main/head/tree recheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/feat/000b-b024-test-generation-curriculum | cut -f1)" = "$HEAD_SHA"
          echo "B024_STAGE_ELIGIBILITY_EXACT_HEAD_QUALIFICATION=PASS"
