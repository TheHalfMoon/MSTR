name: Verify B007 post-closeout exact canonical main

on:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 7f2fe43797db4b94103ca07c172de5672806f624
      PREVIOUS_MAIN: b9b0a8ca7b9b7528f5da518baa83b23e2348c6f6
      CLOSEOUT_HEAD: 8410856e23f130be3f7e61dcf4cced2f9ce9aa53
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard exact merged identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$PREVIOUS_MAIN"
          test "$(git rev-parse HEAD^2)" = "$CLOSEOUT_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B007_POSTCLOSEOUT_IDENTITY=PASS"

      - name: Install frozen dev environment
        run: python -m pip install -e '.[dev]'

      - name: Prove B007 terminal B008 production eligible and drift clean
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m mstr_qualify task eligible B007 > /tmp/b007.json
          b7=$?
          set -e
          test "$b7" -eq 1
          python -m mstr_qualify task eligible B008 > /tmp/b008.json
          python -m mstr_qualify task drift > /tmp/drift.json
          python - <<'PY'
          import json, os
          m = os.environ['EXPECTED_MAIN']
          b7 = json.load(open('/tmp/b007.json'))
          b8 = json.load(open('/tmp/b008.json'))
          d = json.load(open('/tmp/drift.json'))
          assert b7['canonical_main'] == m, b7
          assert b7['eligible'] is False, b7
          assert b7['reasons'] == ['task.already_terminal'], b7
          assert b7['state_consistency_result']['observed_state'] == 'COMPLETE_CANONICAL', b7
          assert b8['canonical_main'] == m, b8
          assert b8['eligible'] is True and b8['reasons'] == [], b8
          assert b8['state_consistency_result']['observed_state'] == 'PENDING', b8
          assert any(p['task_id'] == 'B007' and p['satisfied'] is True for p in b8['prerequisite_results']), b8
          assert d['canonical_main'] == m, d
          assert d['status'] == 'clean' and d['findings'] == [], d
          print('B007_COMPLETE_CANONICAL=PASS')
          print('B008_PRODUCTION_ELIGIBLE=PASS')
          print('CANONICAL_DRIFT=clean')
          PY
          test -f benchmarks/manifests/B007-tokenizer-economics.json
          test -f benchmarks/fixtures/tokenizer-economics/B007-corpus.json

      - name: Frozen post-closeout gates
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/contract/test_task_gate.py tests/integration/test_task_gate_cli.py
          pytest -q
          ruff check src tests
          mypy src
          python -m mstr_qualify validate
          git diff --check

      - name: Final canonical-main immutability and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "MODEL_WEIGHT_ACCESS=NOT_AUTHORIZED"
          echo "MODEL_EXECUTION=NOT_AUTHORIZED"
          echo "TOKENIZER_ARTIFACT_DOWNLOAD=NOT_AUTHORIZED_BY_B007"
          echo "TOKENIZER_MEASUREMENT=NOT_EXECUTED_BY_B007"
          echo "PAID_COMPUTE=NOT_AUTHORIZED"
          echo "B008_EXTERNAL_AUTHORITY=NOT_CREATED"
          echo "B007_POSTCLOSEOUT_FINAL=PASS"
