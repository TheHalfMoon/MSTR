name: PR193 B012 Qwen recovery shutdown qualification

on:
  push:
    branches:
      - evidence/pr193-b012-qwen-recovery-shutdown-qualification-146b8a3

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 5e74e77c1fc86d4ebc7e64654f45bd18f565edd6
      SUBJECT_BRANCH: fix/b012-qwen-recovery-runner-shutdown-34169060075
      SUBJECT_SHA: 146b8a3e7ddf4c5694fb08fc82f6efd7166356c2
      SUBJECT_TREE: 325c4d16e4aa26065392d6af603b30719a9a5489
      INCIDENT_RUN: '34169060075'
      INCIDENT_JOB: '101885732522'
      INCIDENT_EVIDENCE_SHA256: 3994421abe4d368746672f539edca2c509188147cadf9f1d6fd142f9ff9dc8ea
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Prove exact live topology and five-file scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SUBJECT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse "origin/$SUBJECT_BRANCH")" == "$SUBJECT_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$SUBJECT_SHA")" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%T "$SUBJECT_SHA")" == "$SUBJECT_TREE" ]]
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$SUBJECT_SHA")
          expected=(
            "artifacts/manifests/B012-executor-toolchain-binding.json"
            "artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json"
            "evidence/mstr-000b/B012-qwen-recovery-runner-shutdown-34169060075.md"
            "tests/contract/test_b012_executor_binding.py"
            "tests/contract/test_b012_qwen_raw_code_recovery.py"
          )
          [[ "${#changed[@]}" -eq "${#expected[@]}" ]]
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done

      - name: Install development dependencies on canonical main
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          [[ "$(git symbolic-ref --short HEAD)" == "main" ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          python -m pip install -e '.[dev]'

      - name: Verify machine B012 entry state on canonical main
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify task eligible B012 | tee /tmp/b012-eligibility.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/b012-eligibility.json', encoding='utf-8'))
          if data.get('eligible') is not True:
              raise SystemExit(f'B012 is not eligible on canonical main: {data!r}')
          PY

      - name: Checkout exact subject
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SUBJECT_SHA"
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]

      - name: Verify exact external incident identity without model access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(sha256sum artifacts/results/equivalent/B012/failures/B012-qwen3.5-0.8b-control-raw-code-recovery-run-34169060075.json | cut -d' ' -f1)" == "$INCIDENT_EVIDENCE_SHA256" ]]
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(path):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          run_id = os.environ['INCIDENT_RUN']
          job_id = int(os.environ['INCIDENT_JOB'])
          run = get(f'/actions/runs/{run_id}')
          assert run['status'] == 'completed'
          assert run['conclusion'] == 'failure'
          assert run['head_sha'] == '5e74e77c1fc86d4ebc7e64654f45bd18f565edd6'
          assert run['event'] == 'issue_comment'
          jobs = get(f'/actions/runs/{run_id}/jobs?per_page=100')['jobs']
          job = next(item for item in jobs if item['id'] == job_id)
          steps = {item['name']: item['conclusion'] for item in job['steps']}
          assert steps['Recover Qwen raw-code evidence only'] == 'cancelled'
          assert steps['Upload Qwen raw-code recovery JSON'] == 'skipped'
          assert steps['Remove ephemeral B012 recovery binaries'] == 'skipped'
          artifacts = get(f'/actions/runs/{run_id}/artifacts')
          assert artifacts['total_count'] == 0
          PY

      - name: Run focused fail-closed contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/contract/test_b012_authority.py \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m ruff check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py
          python -m ruff format --check \
            tests/contract/test_b012_executor_binding.py \
            tests/contract/test_b012_qwen_raw_code_recovery.py

      - name: Verify repository quality
        shell: bash
        run: |
          set -euo pipefail
          python -m mstr_qualify validate
          python -m pytest -q
          python -m ruff check .
          python -m mypy src/mstr_qualify

      - name: Final immutable live-ref guard
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git refs/heads/main | cut -f1)" == "$BASE_SHA" ]]
          [[ "$(git ls-remote https://github.com/TheHalfMoon/MSTR.git "refs/heads/$SUBJECT_BRANCH" | cut -f1)" == "$SUBJECT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SUBJECT_SHA" ]]
          echo 'PR193_QUALIFICATION=PASS'
          echo 'B012_BINDING_STATUS=BLOCKED_PENDING_QWEN_RAW_CODE_RECOVERY_TOPOLOGY_REPAIR'
          echo 'MODEL_EXECUTION=NONE'
          echo 'MODEL_ACCESS=NONE'
          echo 'TRAINING=false'
          echo 'PAID_COST_USD=0.0'
